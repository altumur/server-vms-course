openapi: 3.1.0
info: {title: thing (fixture), version: "1"}
paths:
  /v1/get:
    get:
      responses:
        "200":
          description: ok
        "400": {$ref: "#/components/responses/BadKey"}
        "413":
          description: row too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowTooLargeFault'
components:
  schemas:
    BadKeyFault:
      type: object
      required: [kind, error]
      properties:
        kind: {const: badkey}
        error: {type: string}
    RowTooLargeFault:
      type: object
      required: [kind, error, key, size, limit]
      properties:
        kind: {const: toolarge}
        error: {type: string}
  responses:
    BadKey:
      description: bad key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadKeyFault"
