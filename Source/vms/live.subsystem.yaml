# Live video, as the platform sees it: the SECOND subsystem. Its unit is a camera's
# live fan-out — "camera 7 is being watched, from gateway g-2" — one per camera,
# created by its first viewer (`POST /live/streams`, a `view` of the camera — `rights.routes`) and deleted by the
# gateway a grace period after the last one leaves. Its workers are gateways (vms/liveworker.py):
# stateless, count = N by demand, capacity in VIEWERS, not cameras. Same
# controller class, same console class, same ACL shape as the VMS; nothing
# about video in the platform.
name: live
# The slot a worker of this subsystem makes, `g-<n>`, and the variable naming the one it is started under
# beside `WORKER_NAME` (`runtime.slot`; the boundary's step 4: it was each worker's class saying it).
slot: {prefix: g, name_env: GATEWAY_NAME}
worker: {writes: [streams]}   # a gateway deletes the fan-out it holds once nobody has watched it for `grace`
about: {sub: vms, field: cam}   # a fan-out is about the camera it fans out: its events, grants and labels are the camera's
unit:
  rows: streams                      # live/streams/<cam>
  id: cam                            # named by the camera it fans out, never numbered
  fields:
    cam:       {type: string, required: true, fixed: true}   # the VMS camera id, as the row's name
    labels:    {type: list}                     # where the viewers are: "public-address" for outside the LAN
    grace:     {type: int, default: 30}         # seconds a gateway keeps the subscription after the last viewer
placement:
  capacity:   {from: capacity, default: 100}   # viewers a gateway can carry — its own number, from its heartbeat
  headroom:   {from: headroom}                  # what the autoscaler moves N on: viewers it could still take
  constraint: labels-subset                     # a stream's labels ⊆ the gateway's server's labels
  tie_break:  most-free-capacity
  offers:     true                              # a gateway short on a label set is offered to a spare (`live_workers_needed`)
  rebalance:  {dead_band: 0.10}
snapshot: [cam, labels]
# Asking for a camera's stream is watching it, not changing it: `view` on the camera creates the row (it was the
# console's `POST /whep/<cam>`, which created it on the first viewer — the boundary's step 6).
rights:
  routes: {view: [streams]}
# The gateway's door, opened to a page itself (the owner's decision 1: the bytes — here the offer and the stream — go
# gateway ↔ browser): `POST /whep/<cam>` with the console's door token, `DELETE /whep/session/<id>` to hang up.
# `GET /live/where/<cam>` hands it out.
door: {routes: [whep]}
metrics:
  - {name: streams_live, from: status.phase, agg: count, equals: running, live: true}   # the running gauge (`console.running`)
console:
  running: streams_live                # live_streams_live: fan-outs with a subscription up
