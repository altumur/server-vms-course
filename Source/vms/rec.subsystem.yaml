# rec.subsystem.yaml — the recorder: the FOURTH subsystem, and the only one placed on top of the archive.
#
# A unit is ONE RECORDING of one camera, named by the operator: `rec/recordings/<name>`. The recorder worker
# (`vms/recworker.py`, `recworker@`) subscribes to the camera's fan-out from whichever VMS worker holds it
# (the `live_url` in the VMS heartbeat — never a second connection to the camera), takes `rec/epoch/<name>`,
# and writes footage into the volume it holds, as the stream `<name>/e<epoch>`, through the host's `obsd`.
# The worker that holds the camera may be anywhere; the recorder must be where disks are — `requires:
# resource` — and one per VOLUME (`servers: distinct` over `place_by: volume`): a second recorder on the
# same disk is no second place to record, while a second one on another disk of the same box is exactly
# that. How far back the footage is SHOWN is this row's `retention_days` — a ceiling the recorder's archive
# door applies; what is still there, the volume's ring decides. The camera's events are the worker's and
# retained by the VMS row's `events_retention_days`.
#
# WHY A NAME AND NOT THE CAMERA. `id: cam` stood here while every camera had at most one recording, and it
# stopped being true the day an archive stopped meaning "this box's disks": with a network archive as a
# second volume, "camera 7 on the local disk" and "camera 7 in the network archive" are two recordings, of
# one camera, with their own retention, their own tree and their own epoch — and two rows cannot share the
# key `rec/recordings/7`. The name says which one it is; `cam` below says whose footage it holds. The two
# were always separate in the recorder (`enrich` reads both in three lines) — only the spec tied them.
#
# The page keeps the simple case simple: with no archive chosen the name IS the camera, so a box with one
# volume still writes `rec/recordings/7` and `rec/7/e1/…`, and the rule is visible in one place
# (`#recadd` in `console.html`) instead of hidden in a default here.
#
# Created by the operator: a camera exists without a recording (watched: live, detected, its events kept),
# and records when a row is here — from the page's Record form, which POSTs `/rec/recordings`.
name: rec
# The slot a worker of this subsystem makes, `r-<n>`, and the variable naming the one it is started under
# beside `WORKER_NAME` (`runtime.slot`; the boundary's step 4: it was each worker's class saying it).
slot: {prefix: r, name_env: RECORDER_NAME}
# Objects of this subsystem that are ROWS of the store, not files (`catalog.object_rows`, `cluster/objectstore.py`):
# a volume this subsystem opened, and at which address (`RecWorker._may_format`): read where the volume is gone.
objects: {rows: [used/*]}
# A recording is ABOUT a camera (the boundary's step 2): its events are also the camera's (the line's `of`), a grant
# on camera 7 takes in its recordings, and a `labels:` grant reads the camera's labels — a recording's own say where
# it may run, not whose it is. `cam` is fixed: a recording does not move to another camera (the review's fourth pass).
about: {sub: vms, field: cam}
unit:
  rows: recordings                   # rec/recordings/<name>
  id: name                           # "7", "7-cloud" — the operator's name for THIS recording
  fields:
    name:           {type: string, required: true}   # which recording this is: its key, its epoch, its streams
    cam:            {type: string, required: true, fixed: true}   # WHOSE footage it holds — the VMS camera id
    retention_days: {type: int,    default: 30}      # media: how far back its door shows it — a ceiling, the ring decides what is there
    enabled:        {type: bool,   default: true}
    labels:         {type: list}                     # where it may run: a recorder whose server has these labels
    # the VOLUME whose archive holds it — the operator's answer to "where does this footage live" (a storage tier, say).
    # A card in a camera holds that camera's recordings and no other's: the volume row says whose card it is (`cam`),
    # and the platform refuses a recording of another camera homed on it (`must_match`; the review's sixth pass, major —
    # it was `volumes.refuse_recording`, a hook, until the boundary's step 6).
    home:           {type: string, ref: rec/volumes, must_match: {cam: cam}}
    # WHEN THIS RECORDING STOPS BEING ONE, in unix seconds; 0 — never, which is every recording an
    # operator creates by hand. A scenario asks for ten minutes of a camera, and ten minutes is not a
    # setting on the row: it is an END. The console's loop deletes the row when the time comes, the
    # controller unplaces it and the recorder stops its pipeline — the ordinary path for a recording that
    # was removed, reached by a clock instead of by a click.
    #
    # It is a field and not a timer because a timer lives in a process: the one that set it would have to
    # survive ten minutes for the recording to stop, and a restart would leave a camera recording for
    # ever with nobody remembering why.
    until:          {type: float,  default: 0}       # unix seconds; 0 — never
    # THE FLOOR OF THIS RECORDING, in days; 0 — none. `retention_days` is a ceiling: nothing older is shown.
    # Nothing said how much must BE there, and a recording promised thirty days on a volume that holds four
    # looked healthy. When the volume's ring has closed and the recording holds less than this, the recorder
    # raises the alarm `archive.shallow` (М10B Lesson 18). It does not stop the ring: a larger quota, or fewer
    # recordings on the volume, is the answer.
    min_depth_days: {type: float,  default: 0}
    when:           {type: string, default: always}  # a BACKUP recording (home on a backup volume): `always`, or `offline` — only while the primary should be written and is not (Lesson 26)
placement:
  capacity:   {from: capacity, default: 50}         # cameras a recorder can write — its own number, from its heartbeat: disks and NIC
  headroom:   {from: headroom}
  constraint: labels-subset
  # STILL `requires: resource` with the footage in obsd (the review's third pass asked why). The footage no longer
  # needs the resource; two other things do. The recorder's EVENTS — `archive.shallow`, `keep.copied`/`keep.lost`,
  # what it fetched — go into the resource's tree (`ARCHIVE`), and the resource's door is how anybody reads them.
  # And the resource's heartbeat is the second witness that a SERVER is gone: `gone_servers` moves the recordings
  # of a slot that lapsed only when the resource of its server is silent too (one silence is a crash, two are the
  # server — М11 Lesson 4); without `requires` that move never happens, and the recordings of a box that lost its
  # power wait for it for ever. What the review saw — a five-minute pass whose pulse died on a blinking store, a
  # silent resource, recordings moved off a sound server — was the pulse, and the pulse is mended
  # (`Resource.pass_`: a `try` per beat, a monotonic clock, a limit on no progress).
  requires:   resource                               # the only subsystem that must be where the archive is
  place_by:   volume                                 # WHAT `distinct` and `home` count in: the disk, not the box —
                                                     # a server with three volumes runs three recorders, and one
                                                     # recording's worth of work goes to each. Reachability,
                                                     # draining and `spread_by` stay on the server: a volume has no
                                                     # address and cannot be drained on its own.
  servers:    distinct                               # one recorder per VOLUME carries recordings (the others idle)
  tie_break:  most-free-capacity
  # No `near`. A recorder does not follow a camera around: it is the one thing here that CANNOT move, being
  # pinned to disks (`requires: resource` above), and a fan-out can be read from any server over RTSP. So
  # the recording names the disk and the camera comes to it — `near: rec` in `vms.subsystem.yaml`. The pair
  # ends up on one server either way and the recorder reads shared memory; what changes is which of the two
  # decides, and it has to be the one with the disks.
  #
  # `home` is a preference, never a filter: a recording whose home is down is written elsewhere, which is
  # the whole reason the home may be down. It is MAINTAINED, unlike a bare affinity — `_pick` prefers a
  # recorder there when placing, `ensure_home(budget)` brings back, one recording a pass, what is written
  # somewhere else, so a server returning from an outage takes its recordings back without anybody running
  # a procedure. The filters (`labels-subset`, `spread_by`, `requires: resource`) still win: this only
  # orders what is already eligible. With no home, the pick is the disk with the most room.
  home:       home                                   # the row's field naming the volume whose archive holds it
  # …and a FILTER where the volume is a standby (`affinity`; М10B Lesson 26 — it was `volumes.admit_recording`, a hook,
  # until the boundary's step 6). A recording homed on an enabled backup or edge volume goes there or nowhere, and
  # nothing else goes there: a primary moved onto the backup while its server rebooted is ONE copy where the operator
  # paid for two, and a backup moved off it is no copy at all. A volume row that says `admits: false` — an incidents
  # volume, a place for what somebody kept (`RecWorker.keep_pass`) — takes no recording. `/unplaceable` says so.
  affinity:   {field: home, table: volumes, server_field: server, strict: {kind: [backup, edge], enabled: true}}
  rebalance:  {dead_band: 0.10}
  # No `spread_by: cam`, deliberately, though `id: name` is what makes it possible. `spread_by` is a filter
  # over SERVERS — two recordings of one camera may not share a machine — and that is right for the reason
  # it exists (redundancy: a second copy on the failed server is not a second copy) and wrong for the
  # reason the name arrived here (a local volume and a network archive on the SAME box are two archives,
  # and the filter would refuse the pair outright). Which one the operator is buying is not visible from
  # the rows, so the spec does not guess: `home` names the volume for each recording, and an installation
  # that wants copies to survive a server adds the line — `/unplaceable` then says so out loud instead of
  # quietly putting both in one place.
# The archives themselves, as rows the administrator writes: `rec/volumes/<name>` (`vms/volumes.py`).
# Not units — nothing is placed on a volume, it has no epoch and no worker; it is a LIST, like `policy`,
# and the platform learns only its name so the console's token may write it. A volume becomes a PLACE when
# a recorder takes it (`rec/holds/<name>`), which is what lets an operator create a network archive in the
# console and have it served without anybody editing a unit file.
#
# And what somebody said to KEEP: `rec/keeps/<id>` (`vms/keeps.py`) — a camera, an interval, a note, who set
# it. The footage it names is COPIED into an `incidents` volume (`RecWorker.keep_pass`); the events it names
# are left in place by the resource's retention.
tables: [volumes, keeps]
# Whose a row of a table is: a keep is its camera's (`cam`, an id of the camera `about` names). Whoever writes one
# needs on that camera what the route needs — on both, if a write ever moved it.
rights:
  unit_of: {keeps: cam}
# What a keep HOLDS on every resource past its days (the boundary's step 6: it was the VMS's function the resource called,
# `kept_buckets`): the events of its camera's units — the camera's own and every unit about it — for its stretch, at
# most a week from its start (a stretch a person can mean, the review's fourth pass, Т-B6).
holds: {table: keeps, unit: cam, since: from, until: to, longest: 604800}
# The resource asks this subsystem to free bytes on a volume of its server by a request row (`free-<server>-<volume>`),
# and the recorder decides (the boundary's step 6: it was a hook). The footage is in rings of a fixed size: the recorder
# answers that it frees nothing (`RecWorker.requests`, `freed` in its heartbeat).
requests: {free: true}
snapshot: [name, cam, retention_days, min_depth_days, enabled, until, labels, home, when]   # `when`: the domain finds an offline backup of another cluster's camera (М12)
# WHAT A SCALING POLICY AND AN ALERT READ, DECLARED (the boundary's step 6: it was `vms/console.py`'s `rec_metrics`, a
# function the platform's console called and never read). `rec_<name>` on `/metrics`; the shapes are the platform's
# (`w2cplatform/metrics.py`): a count of a table's rows, or a field of the recorders' heartbeats and status entries.
metrics:
  - {name: volumes_declared, count: table volumes, where: {enabled: true}}          # what the operator says to write into
  - {name: volumes_unserved, count: table volumes, where: {enabled: true}, unheld: true}   # …and nobody holds
  # The number a scaling policy must use, and why it is not `unserved` itself: a volume nobody CAN take does not become
  # takeable by starting processes; one spare running proves the shortage is not of processes (`minus: placeless`).
  - {name: recorders_needed, count: table volumes, where: {enabled: true}, unheld: true, minus: placeless}
  # Keeps that nothing copies: marks set while no incidents volume is declared (the review's second pass, B10).
  - {name: keeps_unprotected, count: table keeps, unless: {table: volumes, where: {kind: incidents, enabled: true}}}
  # The seconds of each keep not in the incidents volume yet, the largest a live recorder says (the fourth pass, major).
  - {name: keep_missing_seconds, from: "heartbeat.keep_missing.<keep>", agg: max, live: true}
  # What each recorder says of itself (feedback BG): its recordings by phase; a volume that would not open; a pin to a
  # volume another holds (the eighth pass); how long the archive has been away; why it stopped taking samples; its writer.
  - {name: recordings, from: status.phase, agg: count}
  - {name: volume_error, from: heartbeat.volume_error, agg: flag, default: 0}
  - {name: volume_wait, from: heartbeat.volume_wait, agg: flag, default: 0}
  - {name: archive_away_seconds, from: heartbeat.archive_away_since, agg: age, default: 0}
  - {name: archive_failure, from: heartbeat.archive_failure, agg: label, label: kind}
  - {name: writer, from: heartbeat.writer.state, agg: label, label: state, default: ok}
  # Per recording: how long since it last took anything from its source (feedback BI); what the engine refused of its
  # samples, by answer (the third pass); how deep it goes and whether its ring closed inside the floor (feedback BM);
  # and how long it has gone on under an epoch the store has not confirmed.
  - {name: last_frame_age_seconds, from: status.last_frame_at, agg: age}
  - {name: samples_refused_total, from: "status.samples_refused.<status>", type: counter}
  - {name: archive_depth_days, from: status.depth_days}
  - {name: archive_shallow, from: status.shallow, agg: flag, when: depth_days}
  - {name: unconfirmed_seconds, from: status.unconfirmed_s}
  # A camera's stream as its pusher says it in the camera recorder's heartbeat (`stream`; the eighth to eleventh reviews).
  - {name: stream_behind_seconds, from: heartbeat.stream.behind_s}
  - {name: stream_lagging, from: heartbeat.stream.lagging, agg: flag, equals: true}
  - {name: stream_skipped_seconds_total, from: heartbeat.stream.cut_s, labels: {why: cut}, type: counter}
  - {name: stream_skipped_seconds_total, from: heartbeat.stream.left_s, labels: {why: left}, type: counter}
  - {name: stream_skipped_seconds_total, from: heartbeat.stream.failed_s, labels: {why: failed}, type: counter}
  - {name: stream_skipped_seconds_total, from: heartbeat.stream.evicted_s, labels: {why: evicted}, type: counter}
  - {name: stream_owed_unknown, from: heartbeat.stream.owed, agg: flag, equals: unknown}
  - {name: stream_evicted_unknown_seconds_total, from: heartbeat.stream.evicted_unknown_s, type: counter}
  - {name: camera_clock_stepped_seconds_total, from: heartbeat.stream.clock_back_s, labels: {way: back}, type: counter}
  - {name: camera_clock_stepped_seconds_total, from: heartbeat.stream.clock_forward_s, labels: {way: forward}, type: counter}
  - {name: camera_clock_set_total, from: heartbeat.stream.clock_set, type: counter}
  - {name: camera_frames_ahead_total, from: heartbeat.stream.ahead, type: counter}
# What a page shows under a server: the volumes whose `server` names it (the boundary's step 6; it was the recorder's
# heartbeat field `archive`, read by the platform's `/servers`).
servers:
  show:
    - {table: volumes, by: server, title: тома, columns: [name, kind, url, quota_bytes, enabled]}
# What a page calls things (the console module reads it from /spec; the platform reads none of it).
display:
  unit: запись
  units: записи
  field_help:
    cam: камера, которую пишет запись
    home: том, в котором лежит запись
    retention_days: сколько дней показывать
    min_depth_days: сколько дней должно быть не меньше
    when: "резервная запись: всегда или только когда основная не пишется"
  kinds:
    archive.shallow: архив мельче обещанного
    keep.copied: сохранённое скопировано
    keep.lost: сохранённое не удалось скопировать
console:
  running: recordings_running          # rec_recordings_running: recordings whose pipeline is writing — what the health check reads
