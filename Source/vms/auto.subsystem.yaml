# auto.subsystem.yaml — the SEVENTH subsystem: scenarios. The first one whose work is reading what the
# others wrote.
#
# A unit is one scenario — `auto/scenarios/<name>` — and the operator writes it on the console: when this
# happens (and that, within thirty seconds), do this. The worker (`vms/autoworker.py`) evaluates it against
# the event log and, when it fires, FILES REQUESTS: `vms/requests/<id>` to pulse a relay or go to a preset,
# `rec/requests/<id>` to record for ten minutes. It touches no device and writes no configuration — the
# subsystem that owns the device performs the command, under its own epoch, on its own connection.
#
# Why a subsystem and not the platform: every word here is domain. "A sensor closed", "a detector fired",
# "open the door" — the platform knows a unit, a row and an epoch, and learning what a door is would be the
# end of the line it has held for twenty lessons.
#
# Why a UNIT and not a daemon reading a list: because then two evaluators would run the same scenario and
# the door would open twice. A scenario placed like everything else gets `servers: distinct`-free placement,
# an epoch and a lease — "exactly one evaluator" comes out of machinery that already exists rather than out
# of care.
name: auto
# The slot a worker of this subsystem makes, `a-<n>`, and the variable naming the one it is started under
# beside `WORKER_NAME` (`runtime.slot`; the boundary's step 4: it was each worker's class saying it).
slot: {prefix: a, name_env: AUTO_NAME}
# The one worker that files to other subsystems: their request rows, and nothing else of theirs.
worker: {requests: [vms, rec, det]}
unit:
  rows: scenarios                    # auto/scenarios/<name>
  id: name                           # the operator's name for it: "door-on-badge"
  fields:
    name:            {type: string, required: true}
    # WHEN: a list of triggers, each `{sub, kind}` plus optional `unit` and `match`. JSON because a scenario's triggers
    # are a list of shapes: flattening them into fields would cap the count at one or invent `when_1_sub`, `when_2_sub`.
    # What a trigger may BE is the schema below, checked by the platform at the door for every writer (the boundary's
    # step 6, the owner's decision 3: it was `AutoController`, a controller of the VMS's own); what it may MEAN — that
    # camera 7 raises `io.input` on port 2 — the evaluator checks against what the devices said, and a scenario that
    # asks for what nobody can do is refused in its heartbeat (`AutoWorker`, `why`), never fired.
    when:
      type: json
      required: true
      schema:
        type: array
        minItems: 1
        maxItems: 4
        items:
          type: object
          required: [sub, kind]
          additionalProperties: false
          properties:
            sub:   {type: string, minLength: 1}
            kind:  {type: string, minLength: 1}
            unit:  {type: [string, integer]}
            match: {type: object}
    # The correlation window, in seconds. That two triggers need it and one refuses it is the evaluator's to say (a
    # scenario's two fields together); how large it may be is the schema's.
    within:          {type: int,    default: 0, schema: {minimum: 0, maximum: 3600}}
    # THEN: a list of actions, each `{sub, action, …}` — one of the five shapes below. Every one becomes a REQUEST, never
    # a configuration row: a request has an owner who performs it and a `valid_until` after which it is not performed.
    then:
      type: json
      required: true
      schema:
        type: array
        minItems: 1
        maxItems: 4
        items:
          type: object
          required: [sub, action]
          anyOf:
            - properties:
                sub: {const: vms}
                action: {const: output}
                unit: {type: [string, integer]}
                port: {type: [string, integer]}
                state: {type: string}
                pulse_ms: {type: [string, integer]}
              required: [unit, port]
              additionalProperties: false
            - properties: {sub: {const: vms}, action: {const: preset}, unit: {type: [string, integer]}, n: {type: [string, integer]}}
              required: [unit, n]
              additionalProperties: false
            - properties:
                sub: {const: rec}
                action: {const: record}
                cam: {type: [string, integer]}
                minutes: {type: [number, string]}
                archive: {type: string}
              required: [cam, minutes]
              additionalProperties: false
            - properties:
                sub: {const: det}
                action: {const: detect}
                cam: {type: [string, integer]}
                kind: {type: string}
                minutes: {type: [number, string]}
                params: {}
              required: [cam, kind, minutes]
              additionalProperties: false
            - properties:
                sub: {const: det}
                action: {const: scan}
                cam: {type: [string, integer]}
                kind: {type: string}
                before: {type: [number, string]}
                after: {type: [number, string]}
                rec: {type: string}
                params: {}
              required: [cam, kind]
              additionalProperties: false
    # The ceiling on firing, per scenario. Automation that can fire without bound is automation that can ring: a sensor
    # bouncing at 5 Hz would file three hundred door commands a minute, and every one of them would be obeyed.
    rate_per_minute: {type: int,    default: 6, schema: {anyOf: [{const: 0}, {minimum: 1, maximum: 600}]}}   # 0: the default
    # How long a request this scenario files stays worth doing, from the moment of the event: the holder does not perform
    # it later (`expired`). Five seconds at least — less is shorter than the road from an event to the device — and ten
    # minutes at most: the holder refuses a command valid longer (`VmsWorker.MAX_VALID`).
    valid_for:       {type: int,    default: 30, schema: {anyOf: [{const: 0}, {minimum: 5, maximum: 600}]}}  # 0: the default
    enabled:         {type: bool,   default: true}
    labels:          {type: list}
placement:
  capacity:   {from: capacity, default: 50}       # scenarios an evaluator can carry: a window and a query each
  headroom:   {from: headroom}
  constraint: labels-subset
  # The evaluator reads events, and events live on resources. On a box that is the resource on this server;
  # in a cluster it reads the same merge the console does, which is why this is `requires: resource` and
  # not `near`: what a scenario watches is named inside its `when`, which is JSON, and no placement rule
  # reads JSON. A scenario whose triggers all come from one server would be better off there — that is a
  # refinement for the day somebody measures it, not a guess to build in now.
  requires:   resource
  servers:    shared                               # two evaluators on one box are two places to evaluate
  tie_break:  most-free-capacity
  offers:     true                                 # an evaluator short on a label set is offered to a spare (`auto_workers_needed`)
  rebalance:  {dead_band: 0.10}
# What leaves the cluster: that a scenario exists and whether it is on. Not its triggers or its actions —
# М12's directory has never wanted to know which relay a site pulses, and a `then` carrying a preset number
# for somebody else's camera is nobody's business up there.
# Whose a scenario is (the boundary's step 6: it was the VMS's wiring of the console, `CLUSTER_ROWS` and
# `scenario_cams`): a write to one is the whole cluster's business — its labels say where its evaluator runs, not whose
# it is (the review's fifth pass); and the units it names — every trigger's, every action's — are what a camera it
# commands answers for when it is moved to another device (the eighth pass: the scenario's port, chosen by somebody
# with no right on the new device). A trigger on any unit names anybody.
rights:
  cluster_rows: true
  names:
    - {field: when, unit: unit, sub: sub}
    - {field: then, unit: unit, sub: sub}
    - {field: then, unit: cam, of: vms}
snapshot: [name, enabled]
# Each evaluator's last pass and what it counted since it started, from its heartbeat (the boundary's step 6: it was
# `vms/console.py`'s `auto_metrics`). `auto_<name>`; the shapes are the platform's (`w2cplatform/metrics.py`).
metrics:
  - {name: scenarios_running, from: status.phase, agg: count, equals: running, live: true}   # the running gauge (`console.running`)
  - {name: pass_seconds, from: heartbeat.pass_seconds}
  - {name: queries_per_pass, from: heartbeat.queries}
  - {name: cursor_lag_seconds, from: heartbeat.lag_seconds}
  - {name: firing_latency_seconds, from: heartbeat.latency_seconds}
  - {name: event_to_request_seconds, from: heartbeat.latency, agg: histogram, buckets: [1.0, 2.0, 5.0, 10.0, 30.0, 60.0, 300.0]}
  - {name: fired_late_total, from: heartbeat.late, type: counter}
  - {name: firings_suppressed_total, from: heartbeat.suppressed, type: counter}     # refused by a scenario's own ceiling
  # the long poll of the resources (`AutoWorker.long_poll_stats`): a wait that fails breaks nothing, so here is where it
  # is seen — `auto_wait_errors_total` growing is the road back at two seconds
  - {name: waits_total, from: heartbeat.waits, type: counter}
  - {name: woken_total, from: heartbeat.woken, type: counter}
  - {name: early_passes_total, from: heartbeat.early_passes, type: counter}
  - {name: wait_errors_total, from: heartbeat.wait_errors, type: counter}
  - {name: wants_folded, from: heartbeat.wants_folded}                              # triggers folded to their kinds (the eighth pass)

console:
  running: scenarios_running         # auto_scenarios_running: scenarios an evaluator is actually watching
