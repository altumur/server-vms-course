# testsub.subsystem.yaml — a subsystem that exists only for the platform's own tests (tests/test_boundary.py; the
# product's `w2cplatform/testdata/testsub.subsystem.yaml` is the same subsystem).
#
# The platform knows the subsystems by their specs and by nothing else. This one has nothing to do with the
# product: a unit is a named counter a worker keeps. If the platform's pieces come up on this file alone —
# the controller from the spec, the contract's keys, slots, epochs, the console, the resource — they come up
# without the product. Later steps of the boundary plan add an `about:` section here.
name: testsub
unit:
  rows: counters                     # testsub/counters/<name>
  id: name
  fields:
    name:   {type: string, required: true}
    start:  {type: int,    default: 0}
    labels: {type: list}
    step:   {type: int,  inherit: 1}                 # a counter's step: the counter's own, else the domain's, else 1
    marks:  {type: list, inherit: [], merge: union}  # marks the domain adds to every counter's own
placement:
  capacity:   {from: capacity, default: 4}
  headroom:   {from: headroom}
  constraint: labels-subset
  tie_break:  most-free-capacity
snapshot: [name, start]
# testsub on the domain: a counter is found across clusters by its name; the holder keeps a book of tallies for each
# member and a ledger for the domain as a whole, served at `/api/testsub/ledger`; a tally carries a token of its own kind.
domain:
  ref: name
  view: [start]
  books: [tallies]
  kept: [ledger]
  tables: [ledger]
  tokens:
    tally: {lifetime: 600, claims: [counter]}
  shared: [step, marks]                # the fields whose domain-wide value the domain holds
  # its key families, for a page that lists the domain's keys (their words below, display.keys)
  keys:
    - {id: tallies, keys: [domain/testsub/tallies], prefix: domain/testsub/tallies/}
    - {id: ledger, keys: [domain/testsub/ledger]}
display:
  keys:
    tallies: {title: tallies, about: "a member's tally book: domain/testsub/tallies/<member> at the holder, domain/testsub/tallies at home"}
    ledger: {title: ledger, about: the ledger the holder keeps for the domain, absent: nothing ledgered yet}
console:
  running: counters_running
