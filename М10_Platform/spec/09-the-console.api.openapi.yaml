components:
  schemas:
    M2_SpecView:
      type: object
      required:
      - name
      - rows
      - id
      - fields
      - metrics
      - running_gauge
      - workers_gauge
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[a-z]
          not:
            anyOf:
            - pattern: '[^a-z0-9_-]'
            - enum:
              - platform
              - domain
              - console
              - audit
              - spec
              - session
              - mounts
              - healthz
              - metrics
              - servers
              - resources
              - where
              - unplaceable
              - policy
              - drain
              - schema
              - events
              - marks
              - requests
              - asked
              - api
        rows:
          type: string
        id:
          type: string
          not:
            pattern: _secret(?![\s\S])
          description: numeric либо имя несекретного строкового поля единицы по Н1.4.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/M2_FieldView'
        about:
          type: object
          required:
          - sub
          - field
          additionalProperties: false
          properties:
            sub:
              type: string
            field:
              type: string
        display:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/M2_JsonValue'
        servers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/M2_JsonValue'
        door:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/M2_JsonValue'
        places:
          type: object
          description: placement.places спеки, как загружен (урок 4); отсутствует, если раздела нет.
          additionalProperties:
            $ref: '#/components/schemas/M2_JsonValue'
        domain:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/M2_JsonValue'
        metrics:
          type: object
          required:
          - prefix
          - running
          additionalProperties: false
          properties:
            prefix:
              type: string
              description: Префикс имён метрик подсистемы — "<name>_" (урок 9 Н1.2, running_gauge = <name>_<метрика>).
            running:
              type: ['string', 'null']
              description: null, если у спеки нет console.running (урок 2 Н2).
        running_gauge:
          type: ['string', 'null']
          description: null, если у спеки нет console.running (урок 2 Н2); workers_gauge есть всегда.
        workers_gauge:
          type: string
    M2_FieldView:
      type: object
      required:
      - name
      - type
      - default
      - required
      additionalProperties: false
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - string
          - int
          - float
          - bool
          - list
          - json
          - url
          - blob
        default: {}
        required:
          type: boolean
        fixed:
          type: boolean
        bound_to:
          type: array
          items:
            type: string
        enum: {}
        inherit: {}
        merge:
          type: string
      dependentRequired:
        merge:
        - inherit
      allOf:
      - if:
          required:
          - inherit
        then:
          properties:
            default:
              type: 'null'
      oneOf:
      - properties:
          type:
            const: string
          default:
            anyOf:
            - type: 'null'
            - type: string
          inherit:
            type: string
          enum:
            type: array
            items:
              type: string
      - properties:
          type:
            const: int
          default:
            anyOf:
            - type: 'null'
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          inherit:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
        not:
          required:
          - enum
      - properties:
          type:
            const: float
          default:
            anyOf:
            - type: 'null'
            - type: number
              minimum: -1.7976931348623157e+308
              maximum: 1.7976931348623157e+308
          inherit:
            type: number
            minimum: -1.7976931348623157e+308
            maximum: 1.7976931348623157e+308
        not:
          required:
          - enum
      - properties:
          type:
            const: bool
          default:
            anyOf:
            - type: 'null'
            - type: boolean
          inherit:
            type: boolean
          enum:
            type: array
            items:
              type: boolean
      - properties:
          type:
            const: list
          default:
            anyOf:
            - type: 'null'
            - type: array
              items:
                type: string
          inherit:
            type: array
            items:
              type: string
        not:
          required:
          - enum
      - properties:
          type:
            const: json
          default:
            $ref: '#/components/schemas/M2_JsonValue'
          inherit:
            $ref: '#/components/schemas/M2_JsonValue'
        not:
          required:
          - enum
      - properties:
          type:
            const: url
          default:
            anyOf:
            - type: 'null'
            - type: string
          inherit:
            type: string
        not:
          required:
          - enum
      - properties:
          type:
            const: blob
          default:
            type: 'null'
          inherit:
            type: 'null'
          required:
            const: false
        not:
          anyOf:
          - required:
            - enum
          - required:
            - inherit
      description: Loaded field form. default is always present; null means no explicit default (or JSON null).
        inherit is absent when not declared. Type restrictions are static; enum/default membership and other cross-field
        rules still require semantic checks.
    M2_JsonValue:
      description: JSON value from a loaded spec. Numeric bounds apply recursively, including opaque sections.
      anyOf:
      - type:
        - 'null'
        - boolean
        - string
      - type: number
        minimum: -1.7976931348623157e+308
        maximum: 1.7976931348623157e+308
      - type: array
        items:
          $ref: '#/components/schemas/M2_JsonValue'
      - type: object
        additionalProperties:
          $ref: '#/components/schemas/M2_JsonValue'
    M3_UnitId:
      type: string
      minLength: 1
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: '[/\\|",\u0000-\u001F\u007F-\u009F\u2028\u2029]'
      description: 'Общие запреты обеих форм Н1.3: пустота, точные . и .., разделители и управляющие знаки. numeric
        дополнительно требует десятичное целое от 1; named — значение поля; Nd вне ASCII проверяются отдельно по Unicode-категории.
        Дополнительно проверяются объявленные ограничения файлового профиля М10/8: id должен помещаться в каталог бакета,
        имя слота — в компонент heartbeats; предел полного ключа их не отменяет.'
    M4_WorkerName:
      type: string
      pattern: ^[a-z]{1,8}-[a-z0-9]+(-[a-z0-9]+)*$
      not:
        pattern: '[^a-z0-9-]'
      description: 'Имя слота по М10/3 Н1.4: prefix из 1–8 строчных латинских букв и непустой суффикс из строчных латинских
        букв/цифр с одиночными дефисами между частями. Совпадение prefix с slot.prefix выбранной спеки проверяется отдельно.
        Дополнительно проверяются объявленные ограничения файлового профиля М10/8: id должен помещаться в каталог бакета,
        имя слота — в компонент heartbeats; предел полного ключа их не отменяет.'
    M4_Server:
      type: string
      minLength: 1
      not:
        pattern: '[/\\]'
    M4_SubsystemName:
      description: Имя загружаемой подсистемы по М10/2 Н1.2.
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^[a-z]
      not:
        anyOf:
        - pattern: '[^a-z0-9_-]'
        - enum:
          - platform
          - domain
          - console
          - audit
          - spec
          - session
          - mounts
          - healthz
          - metrics
          - servers
          - resources
          - where
          - unplaceable
          - policy
          - drain
          - schema
          - events
          - marks
          - requests
          - asked
          - api
    M4_Policy:
      type: object
      required:
      - servers
      additionalProperties: false
      properties:
        servers:
          type: string
          enum:
          - shared
          - distinct
    M4_Where:
      type: object
      required:
      - worker
      - server
      - reason
      - directory
      - scans
      additionalProperties: false
      properties:
        worker:
          $ref: '#/components/schemas/M4_WorkerName'
        server:
          type:
          - string
          - 'null'
          minLength: 1
        reason:
          type: string
          minLength: 1
        directory:
          anyOf:
          - $ref: '#/components/schemas/M4_WorkerName'
          - type: 'null'
        scans:
          type: integer
          minimum: 0
        door:
          $ref: '#/components/schemas/M4_Door'
    M4_Door:
      type: object
      required:
      - url
      - token
      - expires
      - routes
      additionalProperties: false
      properties:
        url:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        expires:
          type: number
        routes:
          type: array
          items:
            type: string
            minLength: 1
    M4_NotPlaced:
      type: object
      required:
      - reason
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
    M4_Unplaceable:
      type: object
      required:
      - id
      - labels
      - workers_live
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/M4_UnitId'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/M4_Label'
        workers_live:
          type: integer
          minimum: 0
        why:
          type: string
          minLength: 1
    M4_UnitId:
      type: string
      minLength: 1
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: '[/\\|",\u0000-\u001F\u007F-\u009F\u2028\u2029]'
      description: 'Общие запреты обеих форм Н1.3: пустота, точные . и .., разделители и управляющие знаки. numeric
        дополнительно требует десятичное целое от 1; named — значение поля; Nd вне ASCII проверяются отдельно по Unicode-категории.
        Дополнительно проверяются объявленные ограничения файлового профиля М10/8: id должен помещаться в каталог бакета,
        имя слота — в компонент heartbeats; предел полного ключа их не отменяет.'
    M4_Label:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9]
      not:
        pattern: '[^A-Za-z0-9_.:-]'
    ErrorOnly:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: string
    NoVersion:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          const: no such version
    MountedPage:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
          minLength: 1
        error:
          const: is mounted
    Health:
      type: object
      required:
      - ok
      additionalProperties: false
      properties:
        ok:
          const: true
    Mounts:
      type: object
      required:
      - root
      - mounts
      additionalProperties: false
      properties:
        root:
          $ref: '#/components/schemas/M4_SubsystemName'
        mounts:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/M2_SpecView'
          propertyNames:
            $ref: '#/components/schemas/M4_SubsystemName'
    Grant:
      type: object
      required:
      - cap
      - scope
      additionalProperties: false
      properties:
        cap:
          enum:
          - view
          - edit
          - admin
        scope:
          type: string
          minLength: 1
    OpenSession:
      type: object
      required:
      - open
      - login_url
      additionalProperties: false
      properties:
        open:
          const: true
        login_url:
          type: string
    AnonymousSession:
      type: object
      required:
      - open
      - login_url
      additionalProperties: false
      properties:
        open:
          const: false
        login_url:
          type: string
          minLength: 1
    AuthenticatedSession:
      type: object
      required:
      - open
      - login_url
      - user
      - until
      - via
      - grants
      additionalProperties: false
      properties:
        open:
          const: false
        login_url:
          type: string
          minLength: 1
        user:
          type: string
          minLength: 1
        until:
          type: number
        via:
          type: string
        debug:
          type: boolean
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
    Session:
      oneOf:
      - $ref: '#/components/schemas/OpenSession'
      - $ref: '#/components/schemas/AnonymousSession'
      - $ref: '#/components/schemas/AuthenticatedSession'
    SessionInput:
      type: object
      required:
      - token
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
    GlassInput:
      type: object
      required:
      - who
      - why
      - password
      additionalProperties: false
      properties:
        who:
          type: string
          minLength: 1
        why:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    LoggedIn:
      type: object
      required:
      - user
      - until
      additionalProperties: false
      properties:
        user:
          type: string
          minLength: 1
        until:
          type: number
    LoggedOut:
      type: object
      required:
      - out
      additionalProperties: false
      properties:
        out:
          const: true
    WorkerRow:
      type: object
      required:
      - worker
      - load
      - capacity
      - labels
      - state
      - idle_by_policy
      - hung
      - name_conflict
      additionalProperties: false
      properties:
        worker:
          $ref: '#/components/schemas/M4_WorkerName'
        load:
          type: integer
          minimum: 0
        capacity:
          type: integer
          minimum: 0
        labels:
          type: array
          items:
            $ref: '#/components/schemas/M4_Label'
        place:
          type: string
          minLength: 1
        state:
          enum:
          - live
          - stale
