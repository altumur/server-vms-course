openapi: 3.1.0
info:
  title: М10/9 — двери консоли
  version: '1'
paths:
  /:
    get:
      summary: Страница root
      responses:
        '400':
          $ref: '#/components/responses/M2_BadBody'
        '401':
          $ref: '#/components/responses/M2_Unauthenticated'
        '403':
          $ref: '#/components/responses/M2_Denied'
        '404':
          description: Полное JSON-тело
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2_NoRoute'
        '405':
          $ref: '#/components/responses/M2_Method'
        '408':
          $ref: '#/components/responses/M2_SlowBody'
        '413':
          $ref: '#/components/responses/M2_LargeBody'
        '429':
          $ref: '#/components/responses/M2_RateLimited'
        '503':
          description: Недоступно обязательное чтение/доверие/запечатывание либо busy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2_ConsoleRefusal'
          headers:
            Retry-After:
              schema:
                type: integer
                const: 1
              description: Обязателен для error=busy, не обещает срок восстановления прочих отказов.
        '200':
          description: Полный документ UTF-8
          content:
            text/html:
              schema:
                type: string
          headers:
            Content-Security-Policy:
              schema:
                type: string
                minLength: 1
              description: Обязателен; минимум по Н1.1.
    head:
      summary: 'HEAD: Страница root'
      responses:
        '400':
          description: Общий отказ транспорта консоли — тело chunked или короче объявленного; урок 9 Н4.;
            HEAD не содержит тела
        '401':
          description: Общий отказ личности из урока 9; доступность открытых путей определяется его Н1.3.;
            HEAD не содержит тела
        '403':
          description: Общий отказ доступа из урока 9; применяется по условиям его сторожевой.; HEAD не
            содержит тела
        '404':
          description: Полное JSON-тело; HEAD не содержит тела
        '405':
          description: Метод не из объявленных для этой двери.; HEAD не содержит тела
        '408':
          description: Тело читается слишком медленно; урок 9 Н4.; HEAD не содержит тела
        '413':
          description: Тело больше предела консоли; урок 9 Н4.; HEAD не содержит тела
        '429':
          description: Общий предел входа консоли из урока 9; новой квоты на чтение спеки нет.; HEAD не
            содержит тела
          headers:
            Retry-After:
              description: Срок повтора по правилу предела входа.
              schema:
                type: string
        '503':
          description: Недоступно обязательное чтение/доверие/запечатывание либо busy; HEAD не содержит
            тела
          headers:
            Retry-After:
              schema:
                type: integer
                const: 1
              description: Обязателен для error=busy, не обещает срок восстановления прочих отказов.
        '200':
