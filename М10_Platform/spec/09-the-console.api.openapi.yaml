        application/json:
          schema:
            $ref: '#/components/schemas/M2_ConsoleRefusal'
    M2_Unauthenticated:
      description: Общий отказ личности из урока 9; доступность открытых путей определяется его Н1.3.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M2_Denied'
    M2_Denied:
      description: Общий отказ доступа из урока 9; применяется по условиям его сторожевой.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M2_Denied'
    M2_NoRoute:
      description: Нет маршрута; это не ответ загрузчика об ошибочной спеке.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M2_NoRoute'
    M2_Method:
      description: Метод не из объявленных для этой двери.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M2_Method'
    M2_SlowBody:
      description: Тело читается слишком медленно; урок 9 Н4.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M2_ConsoleRefusal'
    M2_LargeBody:
      description: Тело больше предела консоли; урок 9 Н4.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M2_ConsoleRefusal'
    M2_RateLimited:
      description: Общий предел входа консоли из урока 9; новой квоты на чтение спеки нет.
      headers:
        Retry-After:
          description: Срок повтора по правилу предела входа.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M2_ConsoleRefusal'
x-owned-paths:
  М10/3: GET/POST /{rows}, PUT/DELETE /{rows}/{id}; базовый префикс root или /{sub}
  М10/4: /policy, /drain, /unplaceable и /where/{id}; показанные формы Where/Unplaceable — точные копии
  М10/8: /events, /marks, /requests, /asked
  М10/10: /schema, blob и таблицы
  М11 / ADR-0066: /domain/* и /api/held, /api/backup, /api/prepare, /api/take — самостоятельные двери домена; не
    заглушки JSON этого контракта
x-mounting: Маршруты подсистемы /spec, /servers, /unplaceable, /where, /metrics также имеют префикс /<sub>. /session,
  /mounts и /platform общие; страница у смонтированной подсистемы даёт 404 MountedPage. Имена читаются из каталога,
  неизвестный sub — NoRoute.
