                const: 1
              description: Обязателен для error=busy, не обещает срок восстановления прочих отказов.
        '200':
          description: Полное JSON-тело
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDeleted'
        '409':
          description: Конфликт CAS или ссылок
          content:
