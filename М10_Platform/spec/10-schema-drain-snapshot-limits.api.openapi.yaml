            не содержит тела
        '403':
          description: Общий отказ доступа из урока 9; применяется по условиям его сторожевой.; HEAD не содержит
            тела
        '404':
          description: Нет пути, единицы, поля или строки; HEAD не содержит тела
        '405':
          description: Метод не из объявленных для этой двери.; HEAD не содержит тела
        '408':
          description: Тело читается слишком медленно; урок 9 Н4.; HEAD не содержит тела
        '413':
          description: Тело больше предела консоли; урок 9 Н4.; HEAD не содержит тела
        '429':
          description: Общий предел входа консоли (урок 9 Н4); новой квоты на чтение спеки нет.; HEAD не содержит
            тела
          headers:
            Retry-After:
              description: Срок повтора по правилу предела входа.
              schema:
                type: string
        '503':
          description: Недоступно обязательное чтение/доверие/запечатывание либо busy; HEAD не содержит тела
          headers:
            Retry-After:
              schema:
                type: integer
                const: 1
              description: Обязателен для error=busy, не обещает срок восстановления прочих отказов.
        '200':
          description: Полное JSON-тело; HEAD не содержит тела
  /v1/objects/{sub}/blobs/{digest}:
    parameters:
    - name: sub
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/M4_SubsystemName'
    - name: digest
      in: path
      required: true
      schema:
        type: string
        pattern: ^sha256-[0-9a-f]{64}(?![\s\S])
    put:
      summary: 'Дверь ресурса: принять полную копию blob'
      parameters:
      - name: Content-Length
        in: header
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 67108864
      - name: X-Written
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9]+(?:\.[0-9]+)?(?![\s\S])
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '400':
          description: Неверный путь, framing или чтение
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M8_ResourceError'
        '404':
          description: Нет пути
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M8_ResourceError'
        '405':
          description: Метод/семья не допускает PUT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M8_ResourceError'
        '408':
          description: Медленное тело
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M8_ResourceError'
        '409':
          description: Надгробие новее копии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M8_ResourceError'
        '411':
          description: Нет длины
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M8_ResourceError'
        '413':
          description: Больше предела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M8_ResourceError'
        '422':
          description: Байты не соответствуют digest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M8_ResourceError'
        '503':
          description: Хранилище недоступно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M8_ResourceError'
        '403':
          description: Недопустимая роль/семья
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/M8_ResourceError'
                - $ref: '#/components/schemas/M8_ResourceDenied'
        '204':
          description: Целая копия принята; тела ответа нет
components:
  schemas:
    M3_Unit:
      type: object
      required:
      - id
      - revision
      properties:
        id:
          $ref: '#/components/schemas/M3_UnitId'
        revision:
          type: integer
          minimum: 1
      patternProperties:
        _secret$:
          type: string
          enum:
          - ''
          - '***'
      additionalProperties: true
      description: 'Типизированная строка единицы. Остальные поля задаёт unit.fields: int/float — JSON-числа, bool
        — булево, list — массив, json — JSON-значение, string/url/blob — строки; секрет пустой или маска урока 7.
        Отсутствующий inherit и json null не добавляются в ответ. Открытый набор имён поддерживает произвольную
        спеку, а не разрешает чужие поля.'
    M3_UnitId:
      type: string
      minLength: 1
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: '[/\\|",\u0000-\u001F\u007F-\u009F\u2028\u2029]'
      description: 'Общие запреты обеих форм Н1.3: пустота, точные . и .., разделители и управляющие знаки. numeric
        дополнительно требует десятичное целое от 1; named — значение поля; Nd вне ASCII проверяются отдельно по Unicode-категории.
        Дополнительно проверяются объявленные ограничения файлового профиля М10/8: id должен помещаться в каталог бакета,
        имя слота — в компонент heartbeats; предел полного ключа их не отменяет.'
    M3_ClientFields:
      type: object
      propertyNames:
        not:
          enum:
          - id
          - revision
          - deleted
          - worker
          - placement
          - epoch
          - phase
          - observed_revision
      additionalProperties: true
      description: Только поля unit.fields; дополнительные имена здесь нужны для произвольной спеки, но неизвестное
        ей поле отказывается. Типы, required, enum, url, blob, json и fixed/inherit проверяются по Н1 и в порядке
        Н3, а не одним валидатором общей схемы. PUT содержит изменяемые поля; пустой или null секрет сохраняет прежний
        (урок 7).
    M3_TextRefusal:
      allOf:
      - $ref: '#/components/schemas/M3_Refusal'
      - not:
          required:
          - fault
    M3_Refusal:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          type: string
        fault:
          type: string
          enum:
          - not_json
          - not_number
          - too_long
          - bad_url
          - must_match
          - unique
          - garbled
    M3_FormRefusal:
      allOf:
      - $ref: '#/components/schemas/M3_Refusal'
      - properties:
          fault:
            enum:
            - not_json
            - not_number
            - too_long
            - bad_url
    M3_ReferenceConflict:
      allOf:
      - $ref: '#/components/schemas/M3_Refusal'
      - required:
        - fault
        properties:
          error:
            const: conflict
          fault:
            enum:
            - must_match
            - unique
            - garbled
    M2_JsonValue:
      description: JSON value from a loaded spec. Numeric bounds apply recursively, including opaque sections.
      anyOf:
      - type:
        - 'null'
        - boolean
        - string
      - type: number
        minimum: -1.7976931348623157e+308
        maximum: 1.7976931348623157e+308
      - type: array
        items:
          $ref: '#/components/schemas/M2_JsonValue'
      - type: object
        additionalProperties:
          $ref: '#/components/schemas/M2_JsonValue'
    M4_SubsystemName:
      description: Имя загружаемой подсистемы по М10/2 Н1.2.
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^[a-z]
      not:
        anyOf:
        - pattern: '[^a-z0-9_-]'
        - enum:
          - platform
          - domain
          - console
          - audit
          - spec
          - session
          - mounts
          - healthz
          - metrics
          - servers
          - resources
          - where
          - unplaceable
          - policy
          - drain
          - schema
          - events
          - marks
          - requests
          - asked
          - api
    M4_Server:
      type: string
      minLength: 1
      not:
        pattern: '[/\\]'
    M8_Sha256:
      type: string
      pattern: ^[0-9a-f]{64}(?![\s\S])
    M8_ResourceError:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: string
          minLength: 1
    M8_ResourceDenied:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
          minLength: 1
        error:
          const: refused
        role:
          type: string
          minLength: 1
    ProcessBuild:
      type: object
      required:
      - schema
      - build
      - ts
      - live
      additionalProperties: false
      properties:
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        build:
          type: string
        ts:
          type: number
        live:
          type: boolean
    SchemaState:
      type: object
      required:
      - version
      - understood
      - builds
      - can_raise_to
      - processes
      additionalProperties: false
      properties:
        version:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        understood:
          type: integer
          minimum: 1
        builds:
          type: array
          items:
            type: string
        can_raise_to:
          type: integer
          minimum: 0
        schema_unknown:
          type: boolean
        processes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ProcessBuild'
          propertyNames:
            type: string
            minLength: 1
    SchemaRaised:
      type: object
      required:
      - version
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
    M4_DrainState:
      type: object
      required:
      - draining
      - safe
      - would_strand
      - subsystems
      additionalProperties: false
      properties:
        draining:
          $ref: '#/components/schemas/M4_ServerOrEmpty'
        safe:
          type: boolean
        would_strand:
          type: object
          propertyNames:
            $ref: '#/components/schemas/M4_SubsystemName'
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/M4_UnitId'
        subsystems:
          type: object
          propertyNames:
            $ref: '#/components/schemas/M4_SubsystemName'
          additionalProperties:
            $ref: '#/components/schemas/M4_SubsystemDrain'
    M4_ServerOrEmpty:
      anyOf:
      - $ref: '#/components/schemas/M4_Server'
      - const: ''
    M4_UnitId:
      type: string
      minLength: 1
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: '[/\\|",\u0000-\u001F\u007F-\u009F\u2028\u2029]'
      description: 'Общие запреты обеих форм Н1.3: пустота, точные . и .., разделители и управляющие знаки. numeric
        дополнительно требует десятичное целое от 1; named — значение поля; Nd вне ASCII проверяются отдельно по Unicode-категории.
        Дополнительно проверяются объявленные ограничения файлового профиля М10/8: id должен помещаться в каталог бакета,
        имя слота — в компонент heartbeats; предел полного ключа их не отменяет.'
    M4_SubsystemDrain:
      type: object
      required:
      - draining
      - subsystem
      - workers
      - units
      - pending_writes
      - would_strand
      - safe
      additionalProperties: false
      properties:
        draining:
          $ref: '#/components/schemas/M4_ServerOrEmpty'
        subsystem:
          $ref: '#/components/schemas/M4_SubsystemName'
        workers:
          type: integer
          minimum: 0
        units:
          type: integer
          minimum: 0
        pending_writes:
          type: integer
          minimum: 0
        would_strand:
          type: array
          items:
            $ref: '#/components/schemas/M4_UnitId'
        safe:
          type: boolean
        pending_unsaid:
          type: array
          items:
            $ref: '#/components/schemas/M4_WorkerName'
    M4_WorkerName:
      type: string
      pattern: ^[a-z]{1,8}-[a-z0-9]+(-[a-z0-9]+)*$
      not:
        pattern: '[^a-z0-9-]'
      description: 'Имя слота по М10/3 Н1.4: prefix из 1–8 строчных латинских букв и непустой суффикс из строчных латинских
        букв/цифр с одиночными дефисами между частями. Совпадение prefix с slot.prefix выбранной спеки проверяется отдельно.
        Дополнительно проверяются объявленные ограничения файлового профиля М10/8: id должен помещаться в каталог бакета,
        имя слота — в компонент heartbeats; предел полного ключа их не отменяет.'
    M4_ConsoleRefusal:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          type: string
      description: Общая форма отказа консоли урока 9; это не диагностика загрузчика и не Fault хранилища.
    M4_Denied:
      allOf:
      - $ref: '#/components/schemas/M4_ConsoleRefusal'
      - properties:
          error:
            const: denied
    M4_NoRoute:
      allOf:
      - $ref: '#/components/schemas/M4_ConsoleRefusal'
      - properties:
          detail:
            const: no such route
          error:
            const: no such path
    M4_Method:
      allOf:
      - $ref: '#/components/schemas/M4_ConsoleRefusal'
      - properties:
          detail:
            const: method
          error:
            const: method
    M4_Unavailable:
      allOf:
      - $ref: '#/components/schemas/M4_ConsoleRefusal'
      - properties:
          error:
            enum:
            - busy
            - denied
            - unavailable
    M4_DrainStarted:
      type: object
      required:
      - draining
      additionalProperties: false
      properties:
        draining:
          $ref: '#/components/schemas/M4_Server'
    M4_DrainCleared:
      type: object
      required:
      - draining
      additionalProperties: false
      properties:
        draining:
          const: ''
    BlobWritten:
      allOf:
      - $ref: '#/components/schemas/M3_Unit'
      - type: object
        required:
        - bytes
        properties:
          bytes:
            type: integer
            minimum: 0
      description: Полная Unit и число принятых байтов. Спека с blob и объявленным unit.fields.bytes отвергается при загрузке по Н1.5.
    SecretFreeValue:
      anyOf:
      - type:
        - 'null'
        - boolean
        - number
        - string
      - type: array
        items:
          $ref: '#/components/schemas/SecretFreeValue'
      - type: object
        propertyNames:
          not:
            pattern: _secret(?![\s\S])
        additionalProperties:
          $ref: '#/components/schemas/SecretFreeValue'
    TableRow:
      type: object
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/M3_UnitId'
        held_by:
          anyOf:
          - $ref: '#/components/schemas/M4_WorkerName'
          - type: 'null'
        garbled:
          type: boolean
      propertyNames:
        not:
          pattern: _secret(?![\s\S])
      additionalProperties:
        $ref: '#/components/schemas/SecretFreeValue'
      description: Поля объявленной таблицы и stamp проверяются по её спеке; секретные поля исключены на любой глубине.
        garbled=true означает только диагностическую строку name/garbled.
      allOf:
      - if:
          required:
          - garbled
          properties:
            garbled:
              const: true
        then:
          maxProperties: 2
    TableList:
      type: object
      minProperties: 1
      maxProperties: 1
      propertyNames:
        $ref: '#/components/schemas/M4_SubsystemName'
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/TableRow'
      description: Единственное имя свойства равно table в пути.
    TableInput:
      type: object
      propertyNames:
        not:
          enum:
          - held_by
          - garbled
          - by
          - at
          - made_at
      additionalProperties: true
      description: Штампы by/at/made_at клиентом не передаются (400 unknown field), независимо от stamp. Только объявленные поля этой таблицы; типы, required, enum, schema и ключ проверяются динамически по спеке. id/revision/worker/placement/epoch/phase/observed_revision допустимы при объявлении. Поле name допускается только у key=name с типом string.
    TableWritten:
      type: object
      required:
      - row
      additionalProperties: false
      properties:
        row:
          $ref: '#/components/schemas/TableRow'
    TableDeleted:
      type: object
      required:
      - deleted
      additionalProperties: false
      properties:
        deleted:
          $ref: '#/components/schemas/M3_UnitId'
    SnapshotUnit:
      type: object
      required:
      - id
      - revision
      - worker
      - server
      properties:
        id:
          $ref: '#/components/schemas/M3_UnitId'
        revision:
          type: integer
          minimum: 1
        worker:
          anyOf:
          - $ref: '#/components/schemas/M4_WorkerName'
          - type: 'null'
        server:
          anyOf:
          - $ref: '#/components/schemas/M4_Server'
          - type: 'null'
      propertyNames:
        not:
          pattern: _secret(?![\s\S])
      additionalProperties:
        $ref: '#/components/schemas/SecretFreeValue'
      description: Дополнительные поля — ровно snapshot по спеке, без blob/секретов/авторского server; server здесь вычисляется платформой. Адреса маскированы.
    SnapshotShard:
      type: object
      required:
      - cluster
      - worker
      - ts
      properties:
        cluster:
          type: string
        worker:
          anyOf:
          - $ref: '#/components/schemas/M4_WorkerName'
          - type: 'null'
        ts:
          type: number
      minProperties: 4
      maxProperties: 4
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/SnapshotUnit'
      description: Четвёртое свойство — имя rows из спеки; cluster/worker/ts как rows отвергаются загрузчиком. Отдельный шард, без транзакции нескольких шардов.
    M2_ConsoleRefusal:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          type: string
      description: Общая форма отказа консоли урока 9; это не диагностика загрузчика и не Fault хранилища.
    M2_Denied:
      allOf:
      - $ref: '#/components/schemas/M2_ConsoleRefusal'
      - properties:
          error:
            const: denied
    M2_NoRoute:
      allOf:
      - $ref: '#/components/schemas/M2_ConsoleRefusal'
      - properties:
          detail:
            const: no such route
          error:
            const: no such path
    M2_Method:
      allOf:
      - $ref: '#/components/schemas/M2_ConsoleRefusal'
      - properties:
          detail:
            const: method
          error:
            const: method
  responses:
    M4_BadBody:
      description: Invalid request form or body transport; lessons 4 and 9.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M4_ConsoleRefusal'
    M4_Unauthenticated:
      description: Общий отказ личности из урока 9; доступность открытых путей определяется его Н1.3.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M4_Denied'
    M4_Denied:
      description: Общий отказ доступа из урока 9; применяется по условиям его сторожевой.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M4_Denied'
    M4_NoRoute:
      description: No route; lesson 9.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M4_NoRoute'
    M4_Method:
      description: Method not supported by this path; lesson 9.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M4_Method'
    M4_SlowBody:
      description: Тело читается слишком медленно; урок 9 Н4.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M4_ConsoleRefusal'
    M4_LargeBody:
      description: Тело больше предела консоли; урок 9 Н4.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M4_ConsoleRefusal'
    M4_RateLimited:
      description: Общий предел входа консоли (урок 9 Н4); новой квоты на чтение спеки нет.
      headers:
        Retry-After:
          description: Срок повтора по правилу предела входа.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M4_ConsoleRefusal'
    M4_Unavailable:
      description: 'busy (Retry-After: 1), denied, or unavailable when the required store operation could not be
        confirmed. Read state before retrying a mutation.'
      headers:
        Retry-After:
          description: Обязателен со значением 1 при busy; не обещан для остальных причин.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M4_Unavailable'
    M2_BadBody:
      description: Общий отказ транспорта консоли — тело chunked или короче объявленного; урок 9 Н4.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M2_ConsoleRefusal'
    M2_Unauthenticated:
      description: Общий отказ личности из урока 9; доступность открытых путей определяется его Н1.3.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M2_Denied'
    M2_Denied:
      description: Общий отказ доступа из урока 9; применяется по условиям его сторожевой.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M2_Denied'
    M2_NoRoute:
      description: Нет маршрута; это не ответ загрузчика об ошибочной спеке.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M2_NoRoute'
    M2_Method:
      description: Метод не из объявленных для этой двери.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/M2_Method'
    M2_SlowBody:
      description: Тело читается слишком медленно; урок 9 Н4.
      content:
        application/json:
