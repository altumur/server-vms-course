openapi: 3.1.0
info:
  title: М10/10 — схема, дренаж, тела и таблицы
  version: '1'
paths:
  /drain:
    get:
      summary: Drain snapshot; lesson 10 N1.2
      responses:
        '200':
          description: Drain snapshot; lesson 10 N1.2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M4_DrainState'
        '400':
          $ref: '#/components/responses/M4_BadBody'
        '401':
          $ref: '#/components/responses/M4_Unauthenticated'
        '403':
          $ref: '#/components/responses/M4_Denied'
        '404':
          $ref: '#/components/responses/M4_NoRoute'
        '405':
          $ref: '#/components/responses/M4_Method'
        '408':
          $ref: '#/components/responses/M4_SlowBody'
        '413':
          $ref: '#/components/responses/M4_LargeBody'
        '429':
          $ref: '#/components/responses/M4_RateLimited'
        '503':
          $ref: '#/components/responses/M4_Unavailable'
    post:
      summary: Start one-server drain
      responses:
        '200':
          description: Start one-server drain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M4_DrainStarted'
        '400':
          $ref: '#/components/responses/M4_BadBody'
        '401':
          $ref: '#/components/responses/M4_Unauthenticated'
        '403':
          $ref: '#/components/responses/M4_Denied'
        '404':
          $ref: '#/components/responses/M4_NoRoute'
        '405':
          $ref: '#/components/responses/M4_Method'
        '408':
          $ref: '#/components/responses/M4_SlowBody'
        '413':
          $ref: '#/components/responses/M4_LargeBody'
        '429':
          $ref: '#/components/responses/M4_RateLimited'
        '503':
          $ref: '#/components/responses/M4_Unavailable'
        '409':
          description: Another server is already draining
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M4_ConsoleRefusal'
      parameters:
      - name: server
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/M4_Server'
    delete:
      summary: Cancel drain
      responses:
        '200':
          description: Cancel drain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M4_DrainCleared'
        '400':
          $ref: '#/components/responses/M4_BadBody'
        '401':
          $ref: '#/components/responses/M4_Unauthenticated'
        '403':
          $ref: '#/components/responses/M4_Denied'
        '404':
          $ref: '#/components/responses/M4_NoRoute'
        '405':
          $ref: '#/components/responses/M4_Method'
        '408':
          $ref: '#/components/responses/M4_SlowBody'
        '413':
          $ref: '#/components/responses/M4_LargeBody'
        '429':
          $ref: '#/components/responses/M4_RateLimited'
        '503':
          $ref: '#/components/responses/M4_Unavailable'
    head:
      summary: 'HEAD: Drain snapshot; lesson 10 N1.2'
      responses:
        '200':
          description: Drain snapshot; lesson 10 N1.2; HEAD не содержит тела
        '400':
          description: Invalid request form or body transport; lessons 4 and 9.; HEAD не содержит тела
        '401':
          description: Общий отказ личности из урока 9; доступность открытых путей определяется его Н1.3.; HEAD
            не содержит тела
        '403':
          description: Общий отказ доступа из урока 9; применяется по условиям его сторожевой.; HEAD не содержит
            тела
        '404':
          description: No route; lesson 9.; HEAD не содержит тела
        '405':
          description: Method not supported by this path; lesson 9.; HEAD не содержит тела
        '408':
          description: Тело читается слишком медленно; урок 9 Н4.; HEAD не содержит тела
        '413':
          description: Тело больше предела консоли; урок 9 Н4.; HEAD не содержит тела
        '429':
          description: Общий предел входа консоли (урок 9 Н4); новой квоты на чтение спеки нет.; HEAD не содержит
            тела
          headers:
            Retry-After:
              description: Срок повтора по правилу предела входа.
              schema:
                type: string
        '503':
          description: 'busy (Retry-After: 1), denied, or unavailable when the required store operation could not
            be confirmed. Read state before retrying a mutation.; HEAD не содержит тела'
          headers:
            Retry-After:
              description: Обязателен со значением 1 при busy; не обещан для остальных причин.
              schema:
                type: string
                const: '1'
  /schema:
    get:
      summary: Наблюдаемая схема и возможности сборок
      responses:
        '400':
          $ref: '#/components/responses/M2_BadBody'
        '401':
          $ref: '#/components/responses/M2_Unauthenticated'
        '403':
          $ref: '#/components/responses/M2_Denied'
        '404':
          $ref: '#/components/responses/M2_NoRoute'
        '405':
          $ref: '#/components/responses/M2_Method'
        '408':
          $ref: '#/components/responses/M2_SlowBody'
        '413':
          $ref: '#/components/responses/M2_LargeBody'
        '429':
          $ref: '#/components/responses/M2_RateLimited'
        '503':
          description: Недоступно обязательное чтение/доверие/запечатывание либо busy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2_ConsoleRefusal'
          headers:
            Retry-After:
              schema:
                type: integer
                const: 1
              description: Обязателен для error=busy, не обещает срок восстановления прочих отказов.
        '200':
          description: Полное JSON-тело
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaState'
    put:
      summary: Поднять схему в окне обслуживания
      responses:
        '400':
          $ref: '#/components/responses/M2_BadBody'
        '401':
          $ref: '#/components/responses/M2_Unauthenticated'
        '403':
          $ref: '#/components/responses/M2_Denied'
        '404':
          $ref: '#/components/responses/M2_NoRoute'
        '405':
          $ref: '#/components/responses/M2_Method'
        '408':
          $ref: '#/components/responses/M2_SlowBody'
        '413':
          $ref: '#/components/responses/M2_LargeBody'
        '429':
          $ref: '#/components/responses/M2_RateLimited'
        '503':
          description: Недоступно обязательное чтение/доверие/запечатывание либо busy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2_ConsoleRefusal'
          headers:
            Retry-After:
              schema:
                type: integer
                const: 1
              description: Обязателен для error=busy, не обещает срок восстановления прочих отказов.
        '200':
          description: Полное JSON-тело
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaRaised'
        '409':
          description: Откат, неизвестная схема, несовместимая сборка или конфликт CAS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M3_TextRefusal'
      parameters:
      - name: version
        in: query
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*(?![\s\S])
    head:
      summary: 'HEAD: Наблюдаемая схема и возможности сборок'
      responses:
        '400':
          description: Общий отказ транспорта консоли — тело chunked или короче объявленного; урок 9 Н4.; HEAD не
            содержит тела
        '401':
          description: Общий отказ личности из урока 9; доступность открытых путей определяется его Н1.3.; HEAD
            не содержит тела
        '403':
          description: Общий отказ доступа из урока 9; применяется по условиям его сторожевой.; HEAD не содержит
            тела
        '404':
          description: Нет маршрута; это не ответ загрузчика об ошибочной спеке.; HEAD не содержит тела
        '405':
          description: Метод не из объявленных для этой двери.; HEAD не содержит тела
        '408':
          description: Тело читается слишком медленно; урок 9 Н4.; HEAD не содержит тела
        '413':
          description: Тело больше предела консоли; урок 9 Н4.; HEAD не содержит тела
        '429':
          description: Общий предел входа консоли (урок 9 Н4); новой квоты на чтение спеки нет.; HEAD не содержит
            тела
          headers:
            Retry-After:
              description: Срок повтора по правилу предела входа.
              schema:
                type: string
        '503':
          description: Недоступно обязательное чтение/доверие/запечатывание либо busy; HEAD не содержит тела
          headers:
            Retry-After:
              schema:
                type: integer
                const: 1
              description: Обязателен для error=busy, не обещает срок восстановления прочих отказов.
        '200':
          description: Полное JSON-тело; HEAD не содержит тела
  /{rows}/{id}/{blob_field}:
    servers:
      - url: '{origin}'
        description: Короткий путь выбирает CONSOLE_ROOT.
        variables:
          origin: {default: 'http://localhost', description: 'Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.'}
      - url: '{origin}/{sub}'
        description: Имя явно выбирает загруженную подсистему, включая CONSOLE_ROOT.
        variables:
          origin: {default: 'http://localhost', description: 'Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.'}
          sub: {default: testsub, description: 'Имя загруженной спеки по М10/2; пример заменяется выбранным именем из /mounts.'}
    parameters:
    - name: rows
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/M4_SubsystemName'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/M3_UnitId'
    - name: blob_field
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z_][A-Za-z0-9_]*(?![\s\S])
        description: Имя существующего unit blob-поля; непредставимая спека отвергается загрузчиком по Н1.5.
    put:
      summary: Записать байты blob и затем ссылку строки
      responses:
        '400':
          $ref: '#/components/responses/M2_BadBody'
        '401':
          $ref: '#/components/responses/M2_Unauthenticated'
        '403':
          $ref: '#/components/responses/M2_Denied'
        '404':
          description: Нет пути, единицы, поля или строки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2_ConsoleRefusal'
        '405':
          $ref: '#/components/responses/M2_Method'
        '408':
          $ref: '#/components/responses/M2_SlowBody'
        '413':
          $ref: '#/components/responses/M2_LargeBody'
        '429':
          $ref: '#/components/responses/M2_RateLimited'
        '503':
          description: Недоступно обязательное чтение/доверие/запечатывание либо busy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2_ConsoleRefusal'
          headers:
            Retry-After:
              schema:
                type: integer
                const: 1
              description: Обязателен для error=busy, не обещает срок восстановления прочих отказов.
        '200':
          description: Полное JSON-тело
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobWritten'
        '409':
          description: Строка изменилась; повтор начинается с её чтения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M3_TextRefusal'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      parameters:
      - name: Content-Length
        in: header
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 33554432
  /{table}:
    servers:
      - url: '{origin}'
        description: Короткий путь выбирает CONSOLE_ROOT.
        variables:
          origin: {default: 'http://localhost', description: 'Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.'}
      - url: '{origin}/{sub}'
        description: Имя явно выбирает загруженную подсистему, включая CONSOLE_ROOT.
        variables:
          origin: {default: 'http://localhost', description: 'Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.'}
          sub: {default: testsub, description: 'Имя загруженной спеки по М10/2; пример заменяется выбранным именем из /mounts.'}
    parameters:
    - name: table
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/M4_SubsystemName'
    get:
      summary: Список строк таблицы без секретов
      responses:
        '400':
          $ref: '#/components/responses/M2_BadBody'
        '401':
          $ref: '#/components/responses/M2_Unauthenticated'
        '403':
          $ref: '#/components/responses/M2_Denied'
        '404':
          description: Нет пути, единицы, поля или строки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2_ConsoleRefusal'
        '405':
          $ref: '#/components/responses/M2_Method'
        '408':
          $ref: '#/components/responses/M2_SlowBody'
        '413':
          $ref: '#/components/responses/M2_LargeBody'
        '429':
          $ref: '#/components/responses/M2_RateLimited'
        '503':
          description: Недоступно обязательное чтение/доверие/запечатывание либо busy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2_ConsoleRefusal'
          headers:
            Retry-After:
              schema:
                type: integer
                const: 1
              description: Обязателен для error=busy, не обещает срок восстановления прочих отказов.
        '200':
          description: Полное JSON-тело
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableList'
    post:
      summary: Записать полную строку таблицы
      responses:
        '400':
          description: Полное JSON-тело
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/M3_TextRefusal'
                - $ref: '#/components/schemas/M3_FormRefusal'
        '401':
          $ref: '#/components/responses/M2_Unauthenticated'
        '403':
          $ref: '#/components/responses/M2_Denied'
        '404':
          description: Нет пути, единицы, поля или строки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2_ConsoleRefusal'
        '405':
          $ref: '#/components/responses/M2_Method'
        '408':
          $ref: '#/components/responses/M2_SlowBody'
        '413':
          $ref: '#/components/responses/M2_LargeBody'
        '429':
          $ref: '#/components/responses/M2_RateLimited'
        '503':
          description: Недоступно обязательное чтение/доверие/запечатывание либо busy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M2_ConsoleRefusal'
          headers:
            Retry-After:
              schema:
                type: integer
                const: 1
              description: Обязателен для error=busy, не обещает срок восстановления прочих отказов.
        '201':
          description: Полное JSON-тело
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableWritten'
        '409':
          description: Полное JSON-тело
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/M3_ReferenceConflict'
                - $ref: '#/components/schemas/M3_TextRefusal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableInput'
    head:
      summary: 'HEAD: Список строк таблицы без секретов'
      responses:
        '400':
          description: Общий отказ транспорта консоли — тело chunked или короче объявленного; урок 9 Н4.; HEAD не
            содержит тела
        '401':
          description: Общий отказ личности из урока 9; доступность открытых путей определяется его Н1.3.; HEAD
            не содержит тела
        '403':
          description: Общий отказ доступа из урока 9; применяется по условиям его сторожевой.; HEAD не содержит
            тела
        '404':
          description: Нет пути, единицы, поля или строки; HEAD не содержит тела
        '405':
          description: Метод не из объявленных для этой двери.; HEAD не содержит тела
        '408':
          description: Тело читается слишком медленно; урок 9 Н4.; HEAD не содержит тела
        '413':
          description: Тело больше предела консоли; урок 9 Н4.; HEAD не содержит тела
        '429':
          description: Общий предел входа консоли (урок 9 Н4); новой квоты на чтение спеки нет.; HEAD не содержит
            тела
          headers:
            Retry-After:
              description: Срок повтора по правилу предела входа.
              schema:
                type: string
        '503':
          description: Недоступно обязательное чтение/доверие/запечатывание либо busy; HEAD не содержит тела
          headers:
            Retry-After:
              schema:
                type: integer
                const: 1
              description: Обязателен для error=busy, не обещает срок восстановления прочих отказов.
        '200':
          description: Полное JSON-тело; HEAD не содержит тела
  /{table}/{name}:
    servers:
      - url: '{origin}'
        description: Короткий путь выбирает CONSOLE_ROOT.
