# Нормы: 03-units-slots-epochs-lease.norms.md, Н1–Н4.
# Состав unit.fields задаёт загруженная спека; состояние, права и байтовые пределы проверяются отдельно.
openapi: 3.1.0
info:
  title: М10/3 дверь единиц
  version: "1"
  description: >-
    Пути относительно консоли выбранной подсистемы; rows равен unit.rows.
    Список читает модуль консоли (урок 9 Н1.4, вызовы /<rows> и /<sub>/<rows>); контракт списка и формы строк принадлежат этому уроку.
    Общие ответы консоли (урок 9 Н2 «Общие коды», Н4) перечислены у каждой операции явно.
paths:
  /{rows}:
    servers:
      - url: '{origin}'
        description: Короткий путь выбирает CONSOLE_ROOT.
        variables:
          origin: {default: 'http://localhost', description: 'Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.'}
      - url: '{origin}/{sub}'
        description: Имя явно выбирает загруженную подсистему, включая CONSOLE_ROOT.
        variables:
          origin: {default: 'http://localhost', description: 'Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.'}
          sub: {default: testsub, description: 'Имя загруженной спеки по М10/2; пример заменяется выбранным именем из /mounts.'}
    parameters:
      - $ref: "#/components/parameters/Rows"
    post:
      summary: создать единицу; повтор по ключу возвращает прежний ответ
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {$ref: "#/components/schemas/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientFields"}
      responses:
        "201":
          description: >-
            Создано или прежний ответ завершённой заявки. Поля по типам спеки,
            секреты маской; worker всегда null, включая повтор.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreatedUnit"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "405": {$ref: "#/components/responses/Method"}
        "408": {$ref: "#/components/responses/SlowBody"}
        "409":
          description: Имя занято, нарушена ссылка либо заявка другой консоли ещё в работе.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CreateBusy"
                  - $ref: "#/components/schemas/ReferenceConflict"
        "413": {$ref: "#/components/responses/LargeBody"}
        "422":
          description: Тот же ключ с другим отпечатком запроса; заявка не меняется.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeyReused"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/WriteUnavailable"}
    get:
      summary: все единицы и конфигурация, доступные по view (урок 9 Н1.3 need)
      responses:
        "200":
          description: >-
            rows — единицы из пульсов с данными воркера;
            configured — строки конфигурации с масками секретов.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UnitList"}
        "400": {$ref: "#/components/responses/BadRead"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "405": {$ref: "#/components/responses/Method"}
        "408": {$ref: "#/components/responses/SlowBody"}
        "413": {$ref: "#/components/responses/LargeBody"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
    head:
      summary: 'HEAD: все единицы и конфигурация, доступные по view (урок 9 Н1.3 need)'
      responses:
        '200':
          description: rows — единицы из пульсов с данными воркера; configured — строки конфигурации с масками секретов;
            HEAD не содержит тела
        '400':
          description: Общий отказ транспорта или пути, включая badkey полного ключа хранилища; detail и error, без
            fault; HEAD не содержит тела
        '401':
          description: Личность не подтверждена; урок 9 Н1.3 и Н4; HEAD не содержит тела
        '403':
          description: Нет гранта, недопустимый Origin или без домена не с петли; урок 9 Н4 «гранта нет», «чужой Origin на действующем запросе по куке», «нет домена, не петля»; HEAD не содержит тела
        '404':
          description: Нет строки или надгробие у PUT/DELETE — error no such unit. Неизвестный маршрут — detail no such
            route, error no such path. Лишний сегмент — detail a unit's path names one unit, error no such path (урок 9 Н2 «Общие коды»); HEAD не содержит
            тела
        '405':
          description: Метод не разрешён; отдельного GET одной единицы нет; HEAD не содержит тела
        '408':
          description: Тело читается слишком медленно; урок 9 Н4; HEAD не содержит тела
        '413':
          description: Тело больше объявленного предела; урок 9 Н4. Служебных полей limit/size урок 1 сюда не добавляет;
            HEAD не содержит тела
        '429':
          description: Общий код предела входа консоли (урок 9 Н4); не новая квота на создание единиц; HEAD не содержит
            тела
          headers:
            Retry-After:
              description: Срок повтора по правилу предела входа.
              schema:
                type: string
        '503':
          description: Хранилище недоступно — error с текстом store unavailable; ответ под ключом не запоминается. Также
            полоса занята — error busy и Retry-After 1, либо ключи были, но проверить доверие нечем — error denied (урок
            9); HEAD не содержит тела
          headers:
            Retry-After:
              description: Обязателен со значением 1 при busy; не обещан для остальных причин.
              schema:
                type: string
                const: '1'
  /{rows}/{id}:
    servers:
      - url: '{origin}'
        description: Короткий путь выбирает CONSOLE_ROOT.
        variables:
          origin: {default: 'http://localhost', description: 'Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.'}
      - url: '{origin}/{sub}'
        description: Имя явно выбирает загруженную подсистему, включая CONSOLE_ROOT.
        variables:
          origin: {default: 'http://localhost', description: 'Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.'}
          sub: {default: testsub, description: 'Имя загруженной спеки по М10/2; пример заменяется выбранным именем из /mounts.'}
    parameters:
      - $ref: "#/components/parameters/Rows"
      - name: id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/UnitId"}
        description: >-
          Ровно один id; грамматика зависит от unit.id (Н1.3). Сегмент процент-декодируется после выбора маршрута;
          не UTF-8 или не по грамматике — 400 bad id (Н2).
          Путь длиннее одного id — 404, кроме двери байтов /{rows}/{id}/{blob_field} урока 10 (иной метод на ней — 405); неверный именованный id — 400.
    put:
      summary: править поля; revision растёт при каждой успешной правке
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {$ref: "#/components/schemas/IdempotencyKey"}
          description: Необязателен и не читается — правка сходится по cas (Н3 «править»); каждый повтор PUT поднимает revision. Обязательный ключ и проход повторов POST описаны в Н3.
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientFields"}
      responses:
        "200":
          description: Строка после правки; значения по типам спеки, секреты маской, revision увеличен.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Unit"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "405": {$ref: "#/components/responses/Method"}
        "408": {$ref: "#/components/responses/SlowBody"}
        "409":
          description: Ссылки по живым строкам; конфликт cas перечитывается внутри прохода.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReferenceConflict"}
        "412": {$ref: "#/components/responses/RevisionMoved"}
        "413": {$ref: "#/components/responses/LargeBody"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/WriteUnavailable"}
    delete:
      summary: пометить удалённой без изменения revision
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Идентификатор помеченной единицы; повторное удаление — 404.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeletedUnit"}
        "400": {$ref: "#/components/responses/BadRead"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Denied"}
        "404": {$ref: "#/components/responses/NotFound"}
        "405": {$ref: "#/components/responses/Method"}
        "408": {$ref: "#/components/responses/SlowBody"}
        "412": {$ref: "#/components/responses/RevisionMoved"}
        "413": {$ref: "#/components/responses/LargeBody"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
components:
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Условие правки по revision строки (Н3 «править», «удалить»); не равен — 412, не целое — 400.
      schema: {type: string, pattern: '^[1-9][0-9]*$'}
    Rows:
      name: rows
      in: path
      required: true
      description: Имя семьи единиц из unit.rows загруженной спеки; произвольная семья не создаётся.
      schema: {type: string, minLength: 1, pattern: '^[^/]+$'}
  schemas:
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 200
      not:
        anyOf:
          - const: '..'
          - pattern: '/'
      description: >-
        Один непустой сегмент, кроме '..', не больше 200 UTF-8-байт (Н3).
        maxLength считает символы и не заменяет отдельную проверку байтов.
        Предел полного ключа с префиксом проверяется отдельно по М10/1 Н1;
        определённый отказ хранилища badkey преобразуется по М10/3 Н3–Н4.
    WorkerName:
      type: string
      pattern: ^[a-z]{1,8}-[a-z0-9]+(-[a-z0-9]+)*$
      not:
        pattern: '[^a-z0-9-]'
      description: 'Имя слота по М10/3 Н1.4: prefix из 1–8 строчных латинских букв и непустой суффикс из строчных латинских
        букв/цифр с одиночными дефисами между частями. Совпадение prefix с slot.prefix выбранной спеки проверяется отдельно.
        Дополнительно проверяются объявленные ограничения файлового профиля М10/8: id должен помещаться в каталог бакета,
        имя слота — в компонент heartbeats; предел полного ключа их не отменяет.'
    UnitId:
      type: string
      minLength: 1
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: '[/\\|",\u0000-\u001F\u007F-\u009F\u2028\u2029]'
      description: 'Общие запреты обеих форм Н1.3: пустота, точные . и .., разделители и управляющие знаки. numeric
        дополнительно требует десятичное целое от 1; named — значение поля; Nd вне ASCII проверяются отдельно по Unicode-категории.
        Дополнительно проверяются объявленные ограничения файлового профиля М10/8: id должен помещаться в каталог бакета,
        имя слота — в компонент heartbeats; предел полного ключа их не отменяет.'
    ClientFields:
      type: object
      propertyNames:
        not:
          enum: [id, revision, deleted, worker, placement, epoch, phase, observed_revision]
      additionalProperties: true
      description: >-
        Только поля unit.fields; дополнительные имена здесь нужны для произвольной спеки,
        но неизвестное ей поле отказывается. Типы, required, enum, url, blob, json и
        fixed/inherit проверяются по Н1 и в порядке Н3, а не одним валидатором общей схемы.
        null у поля с inherit — «не задано», значение снова наследуется; у прочих полей, кроме json, null — 400 (Н2).
        PUT содержит изменяемые поля; пустой или null секрет сохраняет прежний (урок 7 Н3 «создать/править», шаг 3;
        при смене поля из bound_to — 400 «must be given anew»).
        Платформенные имена worker, placement добавлены М10/4; phase, observed_revision — М10/5.
    Unit:
      type: object
      required: [id, revision]
      properties:
        id: {$ref: "#/components/schemas/UnitId"}
        revision: {type: integer, minimum: 1}
      patternProperties:
        '_secret$': {type: string, enum: ["", "***"]}
      additionalProperties: true
      description: >-
        Типизированная строка единицы. Остальные поля задаёт unit.fields:
        int/float — JSON-числа, bool — булево, list — массив, json — JSON-значение,
        string/url/blob — строки; секрет пустой или маска "***" (урок 7 Н1.1 mask, добавлено М10/7).
        Отсутствующий inherit и json null не добавляются в ответ.
        Открытый набор имён поддерживает произвольную спеку, а не разрешает чужие поля.
    CreatedUnit:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/Unit"
        - type: object
          required: [worker]
          properties:
            worker: {type: "null"}
    DeletedUnit:
      type: object
      required: [deleted]
      additionalProperties: false
      properties:
        deleted: {$ref: "#/components/schemas/UnitId"}
    UnitList:
      type: object
      required:
      - rows
      - configured
      additionalProperties: false
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RunningUnit'
        configured:
          type: array
          items:
            $ref: '#/components/schemas/Unit'
      description: Форма GET собственного контракта М10/3 Н2; фильтрация по view не меняет форму оболочки.
    RunningUnit:
      type: object
      required:
      - id
      - phase
      - epoch
      - revision
      - observed_revision
      - worker
      - server
      - age
      - worker_state
      properties:
        id:
          $ref: '#/components/schemas/UnitId'
        phase:
          type: string
        epoch:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
        observed_revision:
          type: integer
          minimum: 0
        worker:
          $ref: '#/components/schemas/WorkerName'
        server:
          type: string
        age:
          type: number
          minimum: 0
        worker_state:
          enum: [live, stale]
      additionalProperties: true
      description: Элемент status пульса (урок 5 Н1.1) плюс worker, server, age, worker_state (собственный
        контракт М10/3 Н2; фильтрация по view — М10/9 Н1.3 need). Слова подсистемы остаются непрозрачными. Смысл свежести
        и формирования списка — М10/3 Н2 («`rows` в `GET /{rows}`»).
    Refusal:
      type: object
      required: [detail, error]
      additionalProperties: false
      properties:
        detail: {type: string}
        error: {type: string}
        fault:
          type: string
          enum: [not_json, not_number, too_long, bad_url, must_match, unique, garbled]
    TextRefusal:
      allOf:
        - $ref: "#/components/schemas/Refusal"
        - not: {required: [fault]}
    FormRefusal:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/Refusal"
        - properties:
            fault: {enum: [not_json, not_number, too_long, bad_url]}
    CreateBusy:
      allOf:
        - $ref: "#/components/schemas/TextRefusal"
        - properties:
            error: {enum: [exists, in flight]}
    ReferenceConflict:
      allOf:
        - $ref: "#/components/schemas/Refusal"
        - required: [fault]
          properties:
            error: {const: conflict}
            fault: {enum: [must_match, unique, garbled]}
    KeyReused:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/TextRefusal"
        - properties:
            error: {const: key reused}
    Denied:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/TextRefusal"
        - properties:
            error: {const: denied}
    Method:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/TextRefusal"
        - properties:
            detail: {const: method}
            error: {const: method}
    SealingUnavailable:
      allOf:
        - $ref: "#/components/schemas/TextRefusal"
        - properties:
            error: {const: unavailable}
            detail: {const: "the sealing key is set and does not read"}
      description: Кольцо секретов задано, но не читается; все POST/PUT единиц, включая тела без секретов (HMAC памяти повторов), М10/7 Н1.2/Н2/Н4.
    Unavailable:
      allOf:
        - $ref: "#/components/schemas/TextRefusal"
        - properties:
            error: {enum: [store unavailable, busy, denied]}
  responses:
    RevisionMoved:
      description: If-Match не равен revision строки (Н3 «править», «удалить»); ничего не записано.
      content:
        application/json:
          schema:
            type: object
            required: [error, revision]
            additionalProperties: false
            properties:
              error: {const: revision moved}
              revision: {type: integer, minimum: 1}
    BadRead:
      description: Общий отказ транспорта или пути, включая badkey полного ключа хранилища; detail и error, без fault.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/TextRefusal"}
    BadRequest:
      description: >-
        Отказ формы по Н4; порядок Н3. Также общий отказ чтения тела консоли:
        chunked или короткое тело (урок 9 Н1.3 body, Н4 «тело: chunked / больше / медленно / коротко»). Причины без fault передают detail и error.
        Отказ полного ключа хранилища — error badkey без fault; завершение POST по Н3.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FormRefusal"}
    Unauthenticated:
      description: Личность не подтверждена; урок 9 Н1.3 и Н4.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Denied"}
    Denied:
      description: Нет гранта, недопустимый Origin или без домена не с петли; урок 9 Н4 «гранта нет», «чужой Origin на действующем запросе по куке», «нет домена, не петля».
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Denied"}
    NotFound:
      description: >-
        Нет строки или надгробие у PUT/DELETE — error no such unit.
        Неизвестный маршрут — detail no such route, error no such path.
        Лишний сегмент — detail a unit's path names one unit, error no such path (урок 9 Н2 «Общие коды»).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/TextRefusal"}
    Method:
      description: Метод не разрешён; отдельного GET одной единицы нет.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Method"}
    SlowBody:
      description: Тело читается слишком медленно; урок 9 Н4.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/TextRefusal"}
    LargeBody:
      description: Тело больше объявленного предела; урок 9 Н4. Служебных полей limit/size урок 1 сюда не добавляет.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/TextRefusal"}
    RateLimited:
      description: Общий код предела входа консоли (урок 9 Н4); не новая квота на создание единиц.
      headers:
        Retry-After:
          description: Срок повтора по правилу предела входа.
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/TextRefusal"}
    Unavailable:
      description: >-
        Хранилище недоступно — error с текстом store unavailable; ответ под ключом не запоминается.
        Также полоса занята — error busy и Retry-After 1 (урок 9 Н4 «полоса занята»),
        либо ключи были, но проверить доверие нечем — error denied (урок 9 Н1.3 shut, Н4 «ключи были, проверить нечем»);
        слова busy и denied добавлены М10/9.
      headers:
        Retry-After:
          description: Обязателен со значением 1 при busy; не обещан для остальных причин.
          schema: {type: string, const: "1"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Unavailable"}
    WriteUnavailable:
      description: >-
        Общий 503 по Unavailable либо заданное, но нечитаемое кольцо секретов по М10/7 Н4 («ключ задан и не читается, любой POST/PUT единицы»).
        Ответ 5xx как done не сохраняется; состояние pending — по М10/3 Н3.
      headers:
        Retry-After:
          description: Обязателен со значением 1 при busy; для ошибки кольца не требуется.
          schema: {type: string, const: "1"}
      content:
