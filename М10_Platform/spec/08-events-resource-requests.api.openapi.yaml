openapi: 3.1.0
info:
  title: М10/8 — двери объектов, событий, ресурса и просьб
  version: '1'
  description: 'Канон — 08-events-resource-requests.norms.md. Разные серверы: ресурс и консоль. Н2 разделяет JSON,
    байты и отсутствие тела; требования TLS/грантов — ADR-0075 и М10/9, внутренний API не нормируется. Формы реализации
    могут расходиться: контракт не объявляет проверку продукта.'
paths:
  /v1/objects:
    get:
      summary: 'Ресурс: список доступных объектов'
      responses:
        '200':
          description: Полный список доступной семьи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectListing'
        '400':
          description: Неверный scope/prefix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '503':
          description: Листинг не удался
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '403':
          description: Отказ личности/роли до операции по ADR-0075
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
      parameters:
      - name: prefix
        in: query
        required: false
        schema:
          type: string
        description: Начало относительного ключа; пустота разрешена. Проверка по Н1.1, отдельная от полного ключа.
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum:
          - local
          - cluster
          default: local
  /v1/objects/{key}:
    parameters:
    - name: key
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectKey'
    get:
      summary: 'Ресурс: прочитать объект'
      responses:
        '200':
          description: Байты выбранной копии
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            X-Written:
              schema:
                type: string
              description: 'Обязателен: время записи выбранной копии в секундах, десятичный текст.'
            X-Server:
              schema:
                $ref: '#/components/schemas/SafeSegment'
              description: 'Обязателен: сервер выбранной копии.'
            X-Missing:
              schema:
                type: string
              description: 'Если есть неответившие: имена через запятую.'
        '400':
          description: Неверный key/scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '403':
          description: Семья не выдаётся, строка-объект или отказ личности
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ResourceError'
                - $ref: '#/components/schemas/ResourceDenied'
        '404':
          description: Объект не найден среди ответивших
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
          headers:
            X-Missing:
              schema:
                type: string
              description: Неответившие серверы через запятую, если есть.
        '503':
          description: Не удалось прочитать копию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '413':
          description: Выбранное тело больше 64 МиБ; до успешных заголовков, без усечения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
      parameters:
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum:
          - local
          - cluster
          default: local
    put:
      summary: Только отказ PUT не-блоба; полная дверь копирования blobs принадлежит М10/10
      responses:
        '400':
          description: Неверный ключ/scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '405':
          description: Этот ключ не blob; другой объект пишет его писатель
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '403':
          description: Отказ личности/роли до операции по ADR-0075
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
      parameters:
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum:
          - local
          - cluster
          default: local
  /events:
    get:
      summary: 'Ресурс: локальный индекс; консоль: слияние'
      responses:
        '200':
          description: ResourceEvents у ресурса, ConsoleEvents у консоли
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsAnswer'
        '400':
          description: Неверные параметры/чтение тела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '408':
          description: 'Консоль: чтение тела медленно'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '413':
          description: 'Консоль: тело больше предела'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '429':
          description: 'Консоль: предел входа'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '404':
          description: 'Консоль: путь недоступен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '405':
          description: 'Консоль: метод не поддержан'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '401':
          description: 'Консоль: личность не установлена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDenied'
        '403':
          description: Отказ доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '503':
          description: 'Ресурс: busy либо индекса нет; консоль: общий отказ двери'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ResourceError'
                - $ref: '#/components/schemas/TextError'
          headers:
            Retry-After:
              description: При busy обязателен со значением 1.
              schema:
                const: '1'
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: number
          default: 0
      - name: to
        in: query
        required: false
        schema:
          type: number
          default: 1000000000000.0
      - name: kind
        in: query
        required: false
        schema:
          type: string
      - name: subsystem
        in: query
        required: false
        schema:
          type: string
      - name: unit
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UnitRef'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
      - name: keep
        in: query
        required: false
        schema:
          enum:
          - newest
          - oldest
          default: newest
      - name: class
        in: query
        required: false
        schema:
          enum:
          - alarm
          - observation
      - name: by
        in: query
        required: false
        schema:
          enum:
          - t
          - occurred
          default: t
  /events/wait:
    get:
      summary: 'Ресурс: подсказка перечитать, без строк событий (ADR-0038)'
      responses:
        '200':
          description: Изменение, тишина, очередь полна либо прежний запрос вытеснен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitAnswer'
        '400':
          description: Неверный want/client/since/timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '503':
          description: Общая полоса ресурса занята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
          headers:
            Retry-After:
              description: При busy обязателен со значением 1.
              schema:
                const: '1'
        '403':
          description: Отказ личности/роли до операции по ADR-0075
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
      parameters:
      - name: want
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Want'
      - name: timeout
        in: query
        required: false
        schema:
          type: number
          exclusiveMinimum: 0
          maximum: 30
          default: 30
      - name: since
        in: query
        required: false
        schema:
          type: string
          pattern: ^(?:0|[1-9][0-9]*)(?![\s\S])
          description: Десятичный uint64, по умолчанию 0. Проверка диапазона обязательна.
      - name: client
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[!-~]+(?![\s\S])
  /buckets/{sub}/{unit}:
    parameters:
    - name: sub
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Subsystem'
    - name: unit
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SafeSegment'
    get:
      summary: 'Ресурс: перечень бакетов единицы'
      responses:
        '200':
          description: 'UTF-8 JSON Lines: по одному BucketInfo на LF, без внешнего массива; пустой перечень — пустое
            тело'
          content:
            application/x-ndjson:
              schema:
                type: string
                x-line-schema:
                  $ref: '#/components/schemas/BucketInfo'
        '404':
          description: Неверный путь/неизвестная единица; тело отсутствует
        '403':
          description: Отказ личности/роли до операции по ADR-0075
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
  /events/{path}:
    parameters:
    - name: path
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectKey'
      description: Относительный путь с суффиксом .events.jsonl, также .mirror/<server>/... для восстановления;
        сегменты . и .. запрещены.
    get:
      summary: 'Ресурс: поток файла бакета'
      responses:
        '200':
          description: Полный файл до зафиксированного размера
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            X-Sum:
              schema:
                $ref: '#/components/schemas/Sha256'
              description: SHA-256 полного возвращаемого тела, обязателен.
        '206':
          description: Один диапазон файла
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Range:
              schema:
                type: string
              description: 'Обязателен: bytes start-end/size.'
        '404':
          description: Нет доступного обычного файла бакета; тело отсутствует
        '416':
          description: Диапазон не удовлетворяется
          content:
            text/plain:
              schema:
                type: string
          headers:
            Content-Range:
              schema:
                type: string
              description: 'Обязателен: bytes */size.'
        '500':
          description: Не удалось подготовить полное тело/его сумму; тело отсутствует
        '403':
          description: Отказ личности/роли до операции по ADR-0075
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
      parameters:
      - name: Range
        in: header
        required: false
        schema:
          type: string
          pattern: ^bytes=(?:[0-9]+-[0-9]*|-[1-9][0-9]*)(?![\s\S])
        description: В профиле урока один диапазон; множественные/условные запросы вне профиля.
  /mirror/{server}/{path}:
    parameters:
    - name: server
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SafeSegment'
    - name: path
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectKey'
    put:
      summary: 'Ресурс: принять целую копию закрытого бакета'
      responses:
        '204':
          description: Копия проверена и опубликована; тело отсутствует
        '400':
          description: Неверные путь/сумма или оборванное тело; тело отсутствует
        '408':
          description: Тело пришло слишком медленно; тело отсутствует
        '413':
          description: Больше 67108864 байт; тело отсутствует
        '422':
          description: SHA-256 тела не совпала; тело отсутствует
        '500':
          description: Ошибка файла/публикации; тело отсутствует
        '403':
          description: Отказ личности/роли до операции по ADR-0075
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
      parameters:
      - name: X-Sum
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/Sha256'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  /mirrored/{server}:
    parameters:
    - name: server
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SafeSegment'
    get:
      summary: 'Ресурс: перечень копий сервера'
      responses:
        '200':
          description: Полный перечень копий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MirroredListing'
        '404':
          description: Копий этого сервера нет; тело отсутствует
        '403':
          description: Отказ личности/роли до операции по ADR-0075
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
  /mirrored/{server}/{path}:
    parameters:
    - name: server
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SafeSegment'
    - name: path
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectKey'
    get:
      summary: 'Ресурс: целая копия бакета'
      responses:
        '200':
          description: Байты копии
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            X-Sum:
              schema:
                $ref: '#/components/schemas/Sha256'
              description: Обязателен, сумма возвращаемой копии.
        '404':
          description: Нет такой копии; тело отсутствует
        '500':
          description: Не удалось прочитать/проверить копию; тело отсутствует
        '403':
          description: Отказ личности/роли до операции по ADR-0075
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
  /marks:
    post:
      summary: 'Консоль: отметка оператора'
      responses:
        '400':
          description: Тело/unit/note не по форме
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '408':
          description: Слишком медленное тело
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '413':
          description: Тело или подготовленная строка больше применимого предела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '429':
          description: Предел входа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '401':
          description: Личность не установлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDenied'
        '403':
          description: Нет гранта, чужой Origin или доступ вне петли без домена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDenied'
        '404':
          description: Нет пути/цели
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '405':
          description: Метод не поддержан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '503':
          description: busy, недоступно хранилище или доверие; без успешной публикации при известном отказе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
          headers:
            Retry-After:
              description: При busy обязателен со значением 1.
              schema:
                const: '1'
        '200':
          description: Отметка записана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkWritten'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkInput'
  /{sub}/requests:
    parameters:
    - name: sub
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Subsystem'
    post:
      summary: 'Консоль: подать или повторить просьбу'
      responses:
        '400':
          description: Нет/неверный Idempotency-Key, форма/schema/unit/rid/deadline; fault только при too_long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
        '408':
          description: Слишком медленное тело
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '413':
          description: Тело или подготовленная строка больше применимого предела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '429':
          description: Учёт полон либо успешно прочитанная строка учёта повреждена; недоступное чтение — 503
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '401':
          description: Личность не установлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDenied'
        '403':
          description: Нет гранта, чужой Origin или доступ вне петли без домена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDenied'
        '404':
          description: no requests либо no such unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '405':
          description: Метод не поддержан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '503':
          description: busy, недоступно хранилище или доверие; без успешной публикации при известном отказе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
          headers:
            Retry-After:
              description: При busy обязателен со значением 1.
              schema:
                const: '1'
        '200':
          description: Тот же rid/unit/digest уже имеет исход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answered'
        '202':
          description: Просьба ожидает или уже начата без исхода
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queued'
        '409':
          description: spent при чужой метке, exists при чужой строке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInput'
  /{sub}/asked/{sha16}:
    parameters:
    - name: sub
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Subsystem'
    - name: sha16
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{16}(?![\s\S])
    delete:
      summary: 'Консоль: снять учёт человека'
      responses:
        '400':
          description: Неверное чтение тела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '408':
          description: Тело пришло слишком медленно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '413':
          description: Тело больше предела двери
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '429':
          description: Предел входа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '401':
          description: Личность не установлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDenied'
        '403':
          description: Нет гранта, чужой Origin или доступ вне петли без домена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDenied'
        '404':
          description: Учёта нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '405':
          description: Метод не поддержан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '503':
          description: busy, недоступно хранилище или доверие; без успешной публикации при известном отказе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
          headers:
            Retry-After:
              description: При busy обязателен со значением 1.
              schema:
                const: '1'
        '200':
          description: Учёт снят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cleared'
components:
  schemas:
    UnitId:
      type: string
      minLength: 1
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: '[/\\|",\u0000-\u001F\u007F-\u009F\u2028\u2029]'
      description: 'Общие запреты обеих форм Н1.3: пустота, точные . и .., разделители и управляющие знаки. numeric
        дополнительно требует десятичное целое от 1; named — значение поля; Nd вне ASCII проверяются отдельно по
        Unicode-категории.'
    Subsystem:
      type: string
      pattern: ^[a-z][a-z0-9_-]{0,31}(?![\s\S])
    SafeSegment:
      type: string
      minLength: 1
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: '[/\\\u0000-\u001F\u007F-\u009F\u2028\u2029]'
    ObjectKey:
      type: string
      minLength: 1
      pattern: ^(?!/)(?!.*(?:^|/)\.{1,2}(?:/|$))[^/\\\u0000-\u001F\u007F-\u009F\u2028\u2029]+(?:/[^/\\\u0000-\u001F\u007F-\u009F\u2028\u2029]+)*(?![\s\S])
      description: Непустой относительный ключ; каждый сегмент непуст и не точка или две точки. Проверка смысла
        ключа — Н1.1; схема не проверяет символические ссылки диска.
    UnitRef:
      type: string
      minLength: 3
      pattern: ^[a-z][a-z0-9_-]{0,31}(?:\.alarms)?/[^/|",\\\u0000-\u001F\u007F-\u009F\u2028\u2029]+(?![\s\S])
      description: Полная ссылка <дерево>/<единица>, также console/<экземпляр> и audit/<роль>. Без точных . и ..
        во второй части; для адресата единицы дополнительно действует UnitId; существование проверяется там, где
        этого требует маршрут.
      not:
        pattern: /\.{1,2}(?![\s\S])
    Rid:
      type: string
      minLength: 1
      maxLength: 200
      description: Безопасный сегмент ADR-0060, не более 200 UTF-8-байт; maxLength не заменяет байтовую проверку.
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: '[/\\"''\u0000-\u001F\u007F-\u009F\u2028\u2029]'
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 200
      not:
        anyOf:
        - const: ..
        - pattern: /
      description: Один непустой сегмент, кроме '..', не больше 200 UTF-8-байт (Н3). maxLength считает символы и
        не заменяет отдельную проверку байтов. Предел полного ключа с префиксом проверяется отдельно по М10/1 Н1;
        определённый отказ хранилища badkey преобразуется по М10/3 Н3–Н4.
    Sha256:
      type: string
      pattern: ^[0-9a-f]{64}(?![\s\S])
    ObjectEntry:
      type: object
      required:
      - written
      - server
      - size
      additionalProperties: false
      properties:
        written:
          type: number
        server:
          $ref: '#/components/schemas/SafeSegment'
        size:
          type: integer
          minimum: 0
    ObjectListing:
      type: object
      required:
      - server
      - objects
      additionalProperties: false
      properties:
        server:
          $ref: '#/components/schemas/SafeSegment'
        objects:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ObjectEntry'
          propertyNames:
            $ref: '#/components/schemas/ObjectKey'
        missing:
          type: array
          items:
            $ref: '#/components/schemas/SafeSegment'
          uniqueItems: true
    ResourceError:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: string
          minLength: 1
    TextError:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          type: string
          minLength: 1
    ResourceDenied:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
          minLength: 1
        error:
          const: refused
        role:
          type: string
          minLength: 1
    ConsoleDenied:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
          minLength: 1
        error:
          const: denied
    Denied:
      oneOf:
      - $ref: '#/components/schemas/ResourceDenied'
      - $ref: '#/components/schemas/ConsoleDenied'
    RequestError:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          type: string
          minLength: 1
        fault:
          const: too_long
    EventRow:
      type: object
      required:
      - id
      - subsystem
      - unit
      - of
      - epoch
      - t
      - kind
      - server
      - bucket
      - class
      - epoch_is
      - fenced
      additionalProperties: true
      properties:
        id:
          type: string
          minLength: 1
        subsystem:
          type: string
          minLength: 1
        unit:
          $ref: '#/components/schemas/UnitRef'
        of:
          type: string
        epoch:
          type: integer
          minimum: 0
        t:
          type: number
        kind:
          type: string
          minLength: 1
        server:
          $ref: '#/components/schemas/SafeSegment'
        bucket:
          $ref: '#/components/schemas/ObjectKey'
        class:
          enum:
          - alarm
          - observation
        epoch_is:
          enum:
          - current
          - fenced
          - earlier-run
        fenced:
          type: boolean
        occurred:
          type: number
        repeats:
          type: integer
          minimum: 1
        since:
          type: number
        until:
          type: number
      description: Поля подсистемы открыты; перечисленные поля платформы имеют эти типы и не переопределяются. of
        пуст только у платформенной строки без адресата. Все JSON-числа конечны. Согласованность epoch_is/fenced
        — Н1.3.
    ResourceEvents:
      type: object
      required:
      - events
      - state
      - truncated
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventRow'
        state:
          const: live
        truncated:
          type: integer
          minimum: 0
        partial:
          const: true
    ConsoleEvents:
      type: object
      required:
      - events
      - state
      - truncated
      - complete
      - incomplete
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventRow'
        state:
          type: string
          pattern: ^live(?:; [^;\r\n]+ (?:unreachable|from mirror))*(?![\s\S])
        truncated:
          type: integer
          minimum: 0
        partial:
          const: true
        complete:
          type: boolean
        incomplete:
          type: object
          additionalProperties:
            type: string
            pattern: ^(?:did not answer|silent|said .+)(?![\s\S])
    EventsAnswer:
      oneOf:
      - $ref: '#/components/schemas/ResourceEvents'
      - $ref: '#/components/schemas/ConsoleEvents'
    WaitPart:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9_-][A-Za-z0-9_.-]*(?![\s\S])
    Want:
      type: string
      minLength: 3
      description: 'Список через запятую: <sub>/<kind>[/<unit>]. Каждая часть — WaitPart; пустые элементы и пробелы
        не допускаются.'
      pattern: ^[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63}/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63}(?:/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63})?(?:,[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63}/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63}(?:/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63})?)*(?![\s\S])
    Touched:
      type: string
      pattern: ^[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63}/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63}/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63}(?![\s\S])
    WaitChanged:
      type: object
      required:
      - changed
      - seq
      - touched
      additionalProperties: false
      properties:
        changed:
          const: true
        seq:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        touched:
          type: array
          items:
            $ref: '#/components/schemas/Touched'
          minItems: 1
          uniqueItems: true
    WaitQuiet:
      type: object
      required:
      - changed
      - seq
      additionalProperties: false
      properties:
        changed:
          const: false
        seq:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
    WaitFull:
      type: object
      required:
      - changed
      - seq
      - full
      additionalProperties: false
      properties:
        changed:
          const: false
        seq:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        full:
          const: true
    WaitReplaced:
      type: object
      required:
      - changed
      - seq
      - replaced
      additionalProperties: false
      properties:
        changed:
          const: false
        seq:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        replaced:
          const: true
    WaitAnswer:
      oneOf:
      - $ref: '#/components/schemas/WaitChanged'
      - $ref: '#/components/schemas/WaitQuiet'
      - $ref: '#/components/schemas/WaitFull'
      - $ref: '#/components/schemas/WaitReplaced'
    BucketInfo:
      type: object
      required:
      - kind
      - subsystem
      - unit
      - epoch
      - start
      - end
      - path
      - events
      additionalProperties: false
      properties:
        kind:
          const: events
        subsystem:
          type: string
          minLength: 1
        unit:
          $ref: '#/components/schemas/SafeSegment'
        epoch:
          type: integer
          minimum: 0
        start:
          type: number
        end:
          type: number
        path:
          $ref: '#/components/schemas/ObjectKey'
        events:
          type: integer
          minimum: 0
        sha256:
          $ref: '#/components/schemas/Sha256'
    MirroredCopy:
      type: object
      required:
      - path
      - written
      - size
      - sum
      additionalProperties: false
      properties:
        path:
          $ref: '#/components/schemas/ObjectKey'
        written:
          type: number
        size:
          type: integer
          minimum: 0
        sum:
          $ref: '#/components/schemas/Sha256'
    MirroredListing:
      type: object
      required:
      - copies
      additionalProperties: false
      properties:
        copies:
          type: array
          items:
            $ref: '#/components/schemas/MirroredCopy'
    MarkInput:
      type: object
      required:
      - unit
      additionalProperties: true
      properties:
        unit:
          $ref: '#/components/schemas/UnitRef'
        note:
          type: string
      description: Лишние поля принимаются и игнорируются; note при отсутствии — пустая строка. Тип note проверяется,
        длина уроком не ограничена.
    MarkWritten:
      type: object
      required:
      - written
      additionalProperties: false
      properties:
        written:
          const: true
    RequestInput:
      type: object
      required:
      - unit
      additionalProperties: true
      properties:
        unit:
          $ref: '#/components/schemas/UnitId'
        valid_until:
          type: number
      not:
        anyOf:
        - required:
          - rid
        - required:
          - digest
        - required:
          - filed
        - required:
          - by
        - required:
          - at
        - required:
          - group
      description: Дополнительно применяется requests.schema выбранной спеки; её required/типы/лишние поля сохраняются.
        Служебные поля не принимаются, кроме valid_until.
    Queued:
      type: object
      required:
      - queued
      additionalProperties: false
      properties:
        queued:
          $ref: '#/components/schemas/Rid'
    HolderAnswer:
      type: object
      required:
      - unit
      - digest
      - ended_at
      - instance
      - slot
      - at
      - outcome
      additionalProperties: false
      properties:
        unit:
          $ref: '#/components/schemas/UnitId'
        digest:
          $ref: '#/components/schemas/Sha256'
        ended_at:
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?(?![\s\S])
          description: Конечное число секунд, записанное текстом строки хранилища; числовой диапазон проверяется
            отдельно.
        instance:
          type: string
          minLength: 1
        slot:
          type: string
          minLength: 1
        of:
          $ref: '#/components/schemas/UnitRef'
        at:
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?(?![\s\S])
          description: Конечное число секунд, записанное текстом строки хранилища; числовой диапазон проверяется
            отдельно.
        valid_until:
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?(?![\s\S])
          description: Конечное число секунд, записанное текстом строки хранилища; числовой диапазон проверяется
            отдельно.
        outcome:
          enum:
          - performed
          - refused
          - unknown
        action:
          type: string
          minLength: 1
        error:
          type: string
          maxLength: 200
        late:
          const: 'true'
      allOf:
      - if:
          properties:
            outcome:
              const: performed
        then:
          required:
          - action
          not:
            required:
            - error
        else:
          required:
          - error
      - if:
          properties:
            outcome:
              const: refused
        then:
          required:
          - action
    ClosedBegun:
      type: object
      required:
      - unit
      - digest
      - ended_at
      - instance
      - slot
      - at
      - outcome
      - ended_by
      - error
      additionalProperties: false
      properties:
        unit:
          $ref: '#/components/schemas/UnitId'
        digest:
          $ref: '#/components/schemas/Sha256'
        ended_at:
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?(?![\s\S])
          description: Конечное число секунд, записанное текстом строки хранилища; числовой диапазон проверяется
            отдельно.
        instance:
          type: string
          minLength: 1
        slot:
          type: string
          minLength: 1
        of:
          $ref: '#/components/schemas/UnitRef'
        at:
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?(?![\s\S])
          description: Конечное число секунд, записанное текстом строки хранилища; числовой диапазон проверяется
            отдельно.
        valid_until:
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?(?![\s\S])
          description: Конечное число секунд, записанное текстом строки хранилища; числовой диапазон проверяется
            отдельно.
        outcome:
          const: unknown
        ended_by:
          enum:
          - reaper
          - holder
        error:
          type: string
          maxLength: 200
    NeverBegun:
      type: object
      required:
      - unit
      - digest
      - ended_at
      - outcome
      - ended_by
      additionalProperties: false
      properties:
        unit:
          $ref: '#/components/schemas/UnitId'
        digest:
          $ref: '#/components/schemas/Sha256'
        ended_at:
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?(?![\s\S])
          description: Конечное число секунд, записанное текстом строки хранилища; числовой диапазон проверяется
            отдельно.
        outcome:
          enum:
          - expired
          - refused
        ended_by:
          enum:
          - reaper
          - holder
        error:
          type: string
          maxLength: 200
      allOf:
      - if:
          properties:
            outcome:
              const: refused
        then:
          required:
          - error
          properties:
            ended_by:
              const: holder
        else:
          not:
            required:
            - error
    AnsweredMark:
      oneOf:
      - $ref: '#/components/schemas/HolderAnswer'
      - $ref: '#/components/schemas/ClosedBegun'
      - $ref: '#/components/schemas/NeverBegun'
      description: 'Полная метка-строка: ответ начавшего, закрытие чужой begun либо отказ до начала. Все значения
        строки текстовые. begun без исхода сюда не входит.'
    Answered:
      type: object
      required:
      - answered
      additionalProperties: false
      properties:
        answered:
          $ref: '#/components/schemas/AnsweredMark'
    Cleared:
      type: object
      required:
      - cleared
      additionalProperties: false
      properties:
        cleared:
          const: true
