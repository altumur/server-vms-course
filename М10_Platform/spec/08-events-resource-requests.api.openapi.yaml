openapi: 3.1.0
info:
  title: 'М10/8 — двери консоли: события, отметки и просьбы'
  version: '1'
  description: 'Канон — 08-events-resource-requests.norms.md. Двери консоли; двери ресурса (`/v1/objects`, `/events` ресурса,
    `/events/wait`, `/buckets`, `/events/{path}`, `/mirror`, `/mirrored`) — P/05 (05-resource.api.openapi.yaml, стадия B). Н2 разделяет JSON
    и отсутствие тела; гранты — М10/9 Н1.3 `need`, внутренний API не нормируется. Формы реализации
    могут расходиться: контракт не утверждает, что какая-либо реализация ему проверена.'
paths:
  /events:
    get:
      summary: 'Консоль: слияние ответов ресурсов (GET /events ресурса — P/05, 05-resource.api.openapi.yaml)'
      responses:
        '200':
          description: ConsoleEvents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleEvents'
        '400':
          description: 'Неверные параметры/чтение тела — TextError (Н2; параметры — P/05 Н1.3)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '408':
          description: 'Консоль: чтение тела медленно'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '413':
          description: 'Консоль: тело больше предела'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '429':
          description: 'Консоль: предел входа'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '404':
          description: 'Консоль: путь недоступен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '405':
          description: 'Метод не поддержан: консоль — TextError (ресурс — без тела, P/05 Н2)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '401':
          description: 'Консоль: личность не установлена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDenied'
        '403':
          description: 'Консоль: отказ доступа'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDenied'
        '503':
          description: 'Консоль: общий отказ двери'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
          headers:
            Retry-After:
              description: При busy обязателен со значением 1.
              schema:
                const: '1'
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: number
          default: 0
      - name: to
        in: query
        required: false
        schema:
          type: number
          default: 1000000000000.0
      - name: kind
        in: query
        required: false
        schema:
          type: string
      - name: subsystem
        in: query
        required: false
        schema:
          type: string
      - name: unit
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UnitRef'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
      - name: keep
        in: query
        required: false
        schema:
          enum:
          - newest
          - oldest
          default: newest
      - name: class
        in: query
        required: false
        schema:
          enum:
          - alarm
          - observation
      - name: by
        in: query
        required: false
        schema:
          enum:
          - t
          - occurred
          default: t
    head:
      summary: 'HEAD: консоль (М10/9 Н2), код и заголовки GET без тела (у ресурса HEAD — 405, P/05 Н2)'
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: number
          default: 0
      - name: to
        in: query
        required: false
        schema:
          type: number
          default: 1000000000000.0
      - name: kind
        in: query
        required: false
        schema:
          type: string
      - name: subsystem
        in: query
        required: false
        schema:
          type: string
      - name: unit
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UnitRef'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
      - name: keep
        in: query
        required: false
        schema:
          enum:
          - newest
          - oldest
          default: newest
      - name: class
        in: query
        required: false
        schema:
          enum:
          - alarm
          - observation
      - name: by
        in: query
        required: false
        schema:
          enum:
          - t
          - occurred
          default: t
      responses:
        '200':
          description: Консоль — как GET с ConsoleEvents; HEAD не содержит тела
        '400':
          description: 'Консоль: неверные параметры/чтение тела; HEAD не содержит тела'
        '408':
          description: 'Консоль: чтение тела медленно; HEAD не содержит тела'
        '413':
          description: 'Консоль: тело больше предела; HEAD не содержит тела'
        '429':
          description: 'Консоль: предел входа; HEAD не содержит тела'
        '404':
          description: 'Консоль: путь недоступен; HEAD не содержит тела'
        '401':
          description: 'Консоль: личность не установлена; HEAD не содержит тела'
        '403':
          description: Отказ доступа; HEAD не содержит тела
        '503':
          description: 'Консоль: общий отказ двери; HEAD не содержит тела'
          headers:
            Retry-After:
              description: При busy обязателен со значением 1.
              schema:
                const: '1'
  /marks:
    post:
      summary: 'Консоль: отметка оператора'
      responses:
        '400':
          description: Тело/unit/note не по форме
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '408':
          description: Слишком медленное тело
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '413':
          description: Тело или подготовленная строка больше применимого предела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '429':
          description: Предел входа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '401':
          description: Личность не установлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDenied'
        '403':
          description: Нет гранта, чужой Origin или доступ вне петли без домена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDenied'
        '404':
          description: Нет пути; существование строки адресата не проверяется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '405':
          description: Метод не поддержан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '503':
          description: busy, недоступно хранилище или доверие; без успешной публикации при известном отказе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
          headers:
            Retry-After:
              description: При busy обязателен со значением 1.
              schema:
                const: '1'
        '200':
          description: Отметка записана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkWritten'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkInput'
  /{sub}/requests:
    parameters:
    - name: sub
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Subsystem'
    post:
      summary: 'Консоль: подать или повторить просьбу'
      responses:
        '400':
          description: Нет/неверный Idempotency-Key, форма/schema/unit/rid/deadline; fault только при too_long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestError'
        '408':
          description: Слишком медленное тело
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '413':
          description: Тело или подготовленная строка больше применимого предела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '429':
          description: Учёт полон либо успешно прочитанная строка учёта повреждена; недоступное чтение — 503
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '401':
          description: Личность не установлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDenied'
        '403':
          description: Нет гранта, чужой Origin или доступ вне петли без домена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDenied'
        '404':
          description: no requests либо no such unit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '405':
          description: Метод не поддержан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '503':
          description: busy, недоступно хранилище или доверие; без успешной публикации при известном отказе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
          headers:
            Retry-After:
              description: При busy обязателен со значением 1.
              schema:
                const: '1'
        '200':
          description: Тот же rid/unit/digest уже имеет исход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answered'
        '202':
          description: Просьба ожидает или уже начата без исхода
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queued'
        '409':
          description: spent при чужой метке, exists при чужой строке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInput'
  /{sub}/asked/{sha16}:
    parameters:
    - name: sub
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Subsystem'
    - name: sha16
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{16}(?![\s\S])
    delete:
      summary: 'Консоль: снять учёт человека'
      responses:
        '400':
          description: Неверное чтение тела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '408':
          description: Тело пришло слишком медленно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '413':
          description: Тело больше предела двери
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '429':
          description: Предел входа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '401':
          description: Личность не установлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDenied'
        '403':
          description: Нет гранта, чужой Origin или доступ вне петли без домена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleDenied'
        '404':
          description: Учёта нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '405':
          description: Метод не поддержан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
        '503':
          description: busy, недоступно хранилище или доверие; без успешной публикации при известном отказе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextError'
          headers:
            Retry-After:
              description: При busy обязателен со значением 1.
              schema:
                const: '1'
        '200':
          description: Учёт снят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cleared'
components:
  schemas:
    UnitId:
      type: string
      minLength: 1
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: '[/\\|",\u0000-\u001F\u007F-\u009F\u2028\u2029]'
      description: 'Общие запреты обеих форм Н1.3: пустота, точные . и .., разделители и управляющие знаки. numeric
        дополнительно требует десятичное целое от 1; named — значение поля; Nd вне ASCII проверяются отдельно по Unicode-категории.
        Дополнительно проверяются объявленные ограничения файлового профиля (договор журнала событий «Имена файлов в общих деревьях»): id должен помещаться в каталог бакета,
        имя слота — в компонент heartbeats; предел полного ключа их не отменяет.'
    Subsystem:
      description: Форма — P/05 (05-resource.api.openapi.yaml), здесь копия для дверей консоли.
      type: string
      pattern: ^[a-z][a-z0-9_-]{0,31}(?![\s\S])
    SafeSegment:
      description: Форма — P/05 (05-resource.api.openapi.yaml), здесь копия для дверей консоли.
      type: string
      minLength: 1
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: '[/\\\u0000-\u001F\u007F-\u009F\u2028\u2029]'
    ObjectKey:
      type: string
      minLength: 1
      pattern: ^(?!/)(?!.*(?:^|/)\.{1,2}(?:/|$))[^/\\\u0000-\u001F\u007F-\u009F\u2028\u2029]+(?:/[^/\\\u0000-\u001F\u007F-\u009F\u2028\u2029]+)*(?![\s\S])
      description: Форма — P/05 (05-resource.api.openapi.yaml), здесь копия для дверей консоли. Непустой относительный ключ; каждый сегмент непуст и не точка или две точки. Проверка смысла
        ключа — P/05 Н1.1; схема не проверяет символические ссылки диска. Все компоненты и полный путь с корнем должны
        помещаться в объявленный файловый профиль (договор журнала событий «Имена файлов в общих деревьях»); иначе 400 до
        файловой операции.
    UnitRef:
      type: string
      minLength: 3
      pattern: ^[a-z][a-z0-9_-]{0,31}(?:\.alarms)?/[^/|",\\\u0000-\u001F\u007F-\u009F\u2028\u2029]+(?![\s\S])
      description: Форма — P/05 (05-resource.api.openapi.yaml), здесь копия для дверей консоли. Полная ссылка <дерево>/<единица>, также console/<экземпляр> и audit/<роль>; экземпляр заранее ограничен профилем договора журнала событий. Без точных . и ..
        во второй части; для адресата единицы дополнительно действует UnitId; существование проверяется там, где
        этого требует маршрут.
      not:
        pattern: /\.{1,2}(?![\s\S])
    Rid:
      type: string
      minLength: 1
      maxLength: 200
      description: rid по Н1.5 — не более 200 байт UTF-8, без / \ " ' и управляющих (ADR-0060); maxLength не заменяет байтовую проверку.
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: '[/\\"''\u0000-\u001F\u007F-\u009F\u2028\u2029]'
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 200
      not:
        anyOf:
        - const: ..
        - pattern: /
      description: Один непустой сегмент, кроме '..', не больше 200 UTF-8-байт (Н3). maxLength считает символы и
        не заменяет отдельную проверку байтов. Предел полного ключа с префиксом проверяется отдельно по P/01.1 Н1;
        определённый отказ хранилища badkey преобразуется по М10/3 Н3–Н4.
    Sha256:
      description: Форма — P/05 (05-resource.api.openapi.yaml), здесь копия для дверей консоли.
      type: string
      pattern: ^[0-9a-f]{64}(?![\s\S])
    TextError:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          type: string
          minLength: 1
    ConsoleDenied:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
          minLength: 1
        error:
          const: denied
    RequestError:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          type: string
          minLength: 1
        fault:
          const: too_long
    EventRow:
      type: object
      required:
      - id
      - subsystem
      - unit
      - of
      - epoch
      - t
      - kind
      - server
      - bucket
      - class
      additionalProperties: true
      properties:
        id:
          type: string
          minLength: 1
          pattern: ^e1-(?:[0-9a-f]{2})+-(?:[0-9a-f]{2})+-(?:0|[1-9][0-9]*)-(?:[0-9a-f]{2})+-[1-9][0-9]*(?![\s\S])
          description: Hex UTF-8 дерева, единицы и уникального экземпляра; эпоха и номер десятичные. Генерация и отсутствие повторного номера — договор журнала событий (Н1.2).
        subsystem:
          type: string
          minLength: 1
        unit:
          $ref: '#/components/schemas/UnitRef'
        of:
          type: string
        epoch:
          type: integer
          minimum: 0
        t:
          type: number
        kind:
          type: string
          minLength: 1
        server:
          $ref: '#/components/schemas/SafeSegment'
        bucket:
          $ref: '#/components/schemas/ObjectKey'
        class:
          enum:
          - alarm
          - observation
        epoch_is:
          enum:
          - current
          - fenced
          - earlier-run
        fenced:
          type: boolean
        occurred:
          type: number
        repeats:
          type: integer
          minimum: 1
        since:
          type: number
        until:
          type: number
      description: Форма — P/05 (05-resource.api.openapi.yaml), здесь копия для дверей консоли. Поля подсистемы открыты; перечисленные поля платформы имеют эти типы и не переопределяются.
        of пуст только у платформенной строки без адресата. Все JSON-числа конечны. epoch_is и fenced ставит консоль при
        слиянии (у ресурса их нет); согласованность epoch_is/fenced — P/05 Н1.3.
    ConsoleEventRow:
      description: Строка ответа консоли — с epoch_is и fenced (P/05 Н1.3, Н3 «слияние»).
      type: object
      additionalProperties: true
      allOf:
      - $ref: '#/components/schemas/EventRow'
      required:
      - epoch_is
      - fenced
    ConsoleEvents:
      type: object
      required:
      - events
      - state
      - truncated
      - complete
      - incomplete
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ConsoleEventRow'
        state:
          type: string
          pattern: ^live(?:; [^;\r\n]+ (?:unreachable|from mirror))*(?![\s\S])
        truncated:
          description: Сумма локальных truncated плюс пропуски общей обрезки после дедупликации кандидатов; копии могут учитываться по нескольким источникам, это не точное число разных пропущенных событий.
          type: integer
          minimum: 0
        partial:
          const: true
        lines_garbled:
          description: Сумма lines_garbled ответивших ресурсов плюс строки ответов ресурсов не по форме EventRow, пропущенные консолью (Н3 «слияние»); поля нет, когда пропусков нет.
          type: integer
          minimum: 1
        complete:
          type: boolean
        incomplete:
          type: object
          additionalProperties:
            type: string
            pattern: ^(?:did not answer|silent|said .+)(?![\s\S])
    MarkInput:
      type: object
      required:
      - unit
      additionalProperties: true
      properties:
        unit:
          $ref: '#/components/schemas/UnitRef'
        note:
          type: string
      description: Лишние поля принимаются и игнорируются; note при отсутствии — пустая строка. Тип note проверяется,
        длина уроком не ограничена.
    MarkWritten:
      type: object
      required:
      - written
      additionalProperties: false
      properties:
        written:
          const: true
    RequestInput:
      type: object
      required:
      - unit
      additionalProperties: true
      properties:
        unit:
          $ref: '#/components/schemas/UnitId'
        valid_until:
          type: number
      not:
        anyOf:
        - required:
          - rid
        - required:
          - digest
        - required:
          - filed
        - required:
          - by
        - required:
          - at
        - required:
          - group
      description: Дополнительно применяется requests.schema выбранной спеки; её required/типы/лишние поля сохраняются.
        Служебные поля не принимаются, кроме valid_until.
    Queued:
      type: object
      required:
      - queued
      additionalProperties: false
      properties:
        queued:
          $ref: '#/components/schemas/Rid'
    HolderAnswer:
      type: object
      required:
      - unit
      - digest
      - ended_at
      - instance
      - slot
      - at
      - outcome
