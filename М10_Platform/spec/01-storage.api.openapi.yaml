# М10/1 — дверь хранилища строк: HTTP-контракт. Семантика операций — 01-storage.norms.md Н3, отказы — Н4; транспорт — Н2.
openapi: 3.1.0
info: {title: Дверь хранилища строк, version: "1"}
paths:
  /v1/get:
    get:
      summary: прочитать
      parameters:
        - name: key
          in: query
          required: true
          schema: {$ref: "#/components/schemas/Key"}
          description: Разбор query — Н2.1 (application/x-www-form-urlencoded; + — пробел, %2B — плюс); повтор или отсутствие — 400 badrequest, байты не UTF-8 — 400 badkey.
      responses:
        "200":
          description: строка; отсутствующая — items null, index ""
          content: {application/json: {schema: {$ref: "#/components/schemas/Row"}}}
        "400": {$ref: "#/components/responses/BadRequestOrKey"}
        "404": {$ref: "#/components/responses/NoRoute"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/list:
    get:
      summary: перечислить
      description: После проверки личности по М10/6 Н3 «проверить»; право read на значения не требуется.
      parameters:
        - name: prefix
          in: query
          required: false
          schema: {type: string}
          description: Байты после разбора query по Н2.1, UTF-8 не требуется; отсутствие — пустой префикс; повтор — 400 badrequest.
      responses:
        "200":
          description: каждый ключ с данным префиксом и его версия; ключи — в порядке байтов
          content: {application/json: {schema: {$ref: "#/components/schemas/Listing"}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoRoute"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/write:
    post:
      summary: записать или удалить
      description: >-
        Н2 норм: предел чтения тела задаётся отдельно от потолка строки; при его
        превышении до разбора JSON — 413 toolarge, limit равен пределу тела в байтах.
        В приёмке предел тела 1048576, потолок строки 524288 байт.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/Cmd"}}}
      responses:
        "200":
          description: сделано; again — ответ прежнего применения записи с этим id
          content: {application/json: {schema: {$ref: "#/components/schemas/Written"}}}
        "400": {$ref: "#/components/responses/BadRequestOrKey"}
        "404": {$ref: "#/components/responses/NoRoute"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "412": {$ref: "#/components/responses/Guard"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "503": {$ref: "#/components/responses/UnavailableOrAmbiguous"}
components:
  schemas:
    Key:
      type: string
      minLength: 1
      not:
        anyOf:
          - pattern: '^/'
          - pattern: '(^|/)\.\.(/|(?![\s\S]))'
      description: >-
        Н1: ключ непуст, не начинается с /, ни один сегмент между / не равен ..;
        ..foo допустим. Предел 1024 байта UTF-8 и меньший файловый предел
        проверяются отдельно; maxLength не выражает число байтов.
    Version:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,19})(?![\s\S])'
      description: Непустая версия по Н1; сравнивается вызывающим только на равенство.
    VersionOrAbsent:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,19})?(?![\s\S])'
      description: Версия или пустая строка, если строки нет.
    Row:
      description: Три различимых исхода чтения; unreadable бывает только true у повреждённой строки.
      oneOf:
        - type: object
          required: [items, index]
          additionalProperties: false
          properties:
            items: {type: object, additionalProperties: {type: string}}
            index: {$ref: "#/components/schemas/Version"}
        - type: object
          required: [items, index]
          additionalProperties: false
          properties:
            items: {type: "null"}
            index: {const: ""}
        - type: object
          required: [items, index, unreadable]
          additionalProperties: false
          properties:
            items: {type: "null"}
            index: {$ref: "#/components/schemas/Version"}
            unreadable: {const: true}
    Listing:
      type: object
      required: [keys]
      additionalProperties: false
      properties:
        keys:
          type: object
          propertyNames: {$ref: "#/components/schemas/Key"}
          additionalProperties: {$ref: "#/components/schemas/Version"}
      description: Порядок имён keys — по UTF-8-байтам; JSON Schema порядок объекта не проверяет.
    Cmd:
      type: object
      required: [op, key]
      properties:
        op: {type: string, enum: [put, delete], description: "op floor — отдельная схема FloorCmd урока 11 на admin-сокете лидера (добавлено М10/11 Н2)"}
        key: {$ref: "#/components/schemas/Key"}
        cas: {type: [string, "null"], pattern: '^(?:0|[1-9][0-9]{0,19})?(?![\s\S])'}  # Н1: null, пусто или версия; строго до конца строки
        guard:
          type: object
          required: [key, index]
          additionalProperties: false
          properties:
            key: {$ref: "#/components/schemas/Key"}
            index: {type: string, pattern: '^(?:0|[1-9][0-9]{0,19})?(?![\s\S])'}  # Н1: пусто или версия
        id: {type: string, pattern: "^[0-9a-f]{1,64}$"}
      oneOf:
        - properties:
            op: {const: put}
            items: {type: object, additionalProperties: {type: string}}
          required: [items]  # у put обязателен; МОЖЕТ быть пустым объектом
        - properties:
            op: {const: delete}
            items: {}  # у delete не читается: любое JSON-значение или отсутствие — не отказ
    Written:
      type: object
      required: [index]
      additionalProperties: false
      properties:
        index: {$ref: "#/components/schemas/Version"}
        again: {const: true}
      description: Первое применение — index; сохранённый повтор добавляет again true.
    Fault:
      description: Закрытые формы отказов Н4; конкретный код операции ограничивает допустимые ветви.
      oneOf:
        - $ref: "#/components/schemas/BadKeyFault"
        - $ref: "#/components/schemas/BadRequestFault"
        - $ref: "#/components/schemas/ForbiddenFault"
        - $ref: "#/components/schemas/ConflictFault"
        - $ref: "#/components/schemas/GuardFault"
        - $ref: "#/components/schemas/RowTooLargeFault"
        - $ref: "#/components/schemas/BodyTooLargeFault"
        - $ref: "#/components/schemas/UnavailableFault"
        - $ref: "#/components/schemas/AmbiguousFault"
    BadKeyFault:
      type: object
      required: [kind, error]
      additionalProperties: false
      properties:
        kind: {const: badkey}
        error: {type: string}
    BadRequestFault:
      type: object
      required: [kind, error]
      additionalProperties: false
      properties:
        kind: {const: badrequest}
        error: {type: string}
    ForbiddenFault:
      type: object
      required: [kind, error]
      additionalProperties: false
      properties:
        kind: {const: forbidden}
        error: {type: string}
    ConflictFault:
      type: object
      required: [kind, error, index]
      additionalProperties: false
      properties:
        kind: {const: conflict}
        error: {type: string}
        index: {$ref: "#/components/schemas/VersionOrAbsent"}
    GuardFault:
      type: object
      required: [kind, error, key, index]
      additionalProperties: false
      properties:
        kind: {const: guard}
        error: {type: string}
        key: {$ref: "#/components/schemas/Key"}
        index: {$ref: "#/components/schemas/VersionOrAbsent"}
    RowTooLargeFault:
      type: object
      required: [kind, error, key, size, limit]
      additionalProperties: false
      properties:
        kind: {const: toolarge}
        error: {type: string}
        key: {$ref: "#/components/schemas/Key"}
        size: {type: integer, minimum: 1}
        limit: {type: integer, minimum: 0}
      description: key — ключ строки, size — вес items, limit — потолок строки; size больше limit.
    BodyTooLargeFault:
      type: object
      required: [kind, error, limit]
      additionalProperties: false
      properties:
        kind: {const: toolarge}
        error: {type: string}
        limit: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1}
      description: Без key; size, если выдан, — известный полный размер тела; size больше limit.
    UnavailableFault:
      type: object
      required: [kind, error]
      additionalProperties: false
      properties:
        kind: {const: unavailable}
        error: {type: string}
    AmbiguousFault:
      type: object
      required: [kind, error]
      additionalProperties: false
      properties:
        kind: {const: ambiguous}
        error: {type: string}
  responses:
    BadKey:
      description: Неверный целевой ключ или непустой ключ стража.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadKeyFault"
    BadRequest:
      description: Запрос не по форме (Н2.1); kind badrequest.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadRequestFault"
    BadRequestOrKey:
      description: Неверная форма запроса или команды либо ключ; классификация — Н2.1 и Н4.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/BadRequestFault"
              - $ref: "#/components/schemas/BadKeyFault"
    Forbidden:
      description: Личность не допускается по М10/6 Н3 «проверить» либо allowed М10/6 Н1.3 отказал в чтении, записи, удалении или чтении стража; list не требует права read.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenFault"
    Conflict:
      description: Версия строки не совпала с cas; index — текущая версия или отсутствие.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConflictFault"
    Guard:
      description: Страж не совпал; key и index относятся к строке-стражу.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GuardFault"
    TooLarge:
      description: Превышен вес строки либо предел тела; поля различают причины.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/RowTooLargeFault"
              - $ref: "#/components/schemas/BodyTooLargeFault"
    Unavailable:
      description: Операция не сделана; срок ожидания лидера или местной блокировки либо предел соединений.
      headers:
        Retry-After:
          schema: {type: integer, const: 1}
          description: Только при пределе соединений двери (М10/11 Н4); иначе отсутствует.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnavailableFault"
    NoRoute:
      description: Нет маршрута или метода на нём (Н2.1); kind badrequest. Неразбираемый HTTP — 400 badrequest, не 414, 431, 501 или 505.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadRequestFault"
    UnavailableOrAmbiguous:
      description: Запись не сделана либо исход неизвестен; вид определяет способ повтора.
      headers:
        Retry-After:
          schema: {type: integer, const: 1}
          description: Только у unavailable при пределе соединений двери (М10/11 Н4); иначе отсутствует.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/UnavailableFault"
              - $ref: "#/components/schemas/AmbiguousFault"
