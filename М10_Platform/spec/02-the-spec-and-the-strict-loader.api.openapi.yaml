openapi: 3.1.0
info:
  title: М10/2 дверь спеки
  version: '1'
paths:
  /spec:
    get:
      summary: форма подсистемы, какой её загрузила консоль; слова display — как написаны
      responses:
        '200':
          description: Форма подсистемы, какой её загрузила консоль; ревизии в ответе нет.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecView'
        '400':
          $ref: '#/components/responses/BadBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          $ref: '#/components/responses/NoRoute'
        '405':
          $ref: '#/components/responses/Method'
        '408':
          $ref: '#/components/responses/SlowBody'
        '413':
          $ref: '#/components/responses/LargeBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  schemas:
    SpecView:
      type: object
      required:
      - name
      - rows
      - id
      - fields
      - metrics
      - running_gauge
      - workers_gauge
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[a-z]
          not:
            anyOf:
            - pattern: '[^a-z0-9_-]'
            - enum:
              - platform
              - domain
              - console
              - audit
              - spec
              - session
              - mounts
              - healthz
              - metrics
              - servers
              - resources
              - where
              - unplaceable
              - policy
              - drain
              - schema
              - events
              - marks
              - requests
              - asked
              - api
        rows:
          type: string
        id:
          type: string
          not:
            pattern: _secret(?![\s\S])
          description: numeric либо имя несекретного строкового поля единицы по Н1.4.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldView'
        about:
          type: object
          required:
          - sub
          - field
          additionalProperties: false
          properties:
            sub:
              type: string
            field:
              type: string
        display:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
        servers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
        door:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
        places:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
        domain:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
        metrics:
          type: object
          required:
          - prefix
          - running
          additionalProperties: false
          properties:
            prefix:
              type: string
            running:
              type: string
        running_gauge:
          type: string
        workers_gauge:
          type: string
    JsonValue:
      description: JSON value from a loaded spec. Numeric bounds apply recursively, including opaque sections.
      anyOf:
      - type: ['null', boolean, string]
      - type: number
        minimum: -1.7976931348623157e+308
        maximum: 1.7976931348623157e+308
      - type: array
        items:
          $ref: '#/components/schemas/JsonValue'
      - type: object
        additionalProperties:
          $ref: '#/components/schemas/JsonValue'
    ConsoleRefusal:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          type: string
      description: Общая форма отказа консоли урока 9; это не диагностика загрузчика и не Fault хранилища.
    Denied:
      allOf:
      - $ref: '#/components/schemas/ConsoleRefusal'
      - properties:
          error:
            const: denied
    NoRoute:
      allOf:
      - $ref: '#/components/schemas/ConsoleRefusal'
      - properties:
          detail:
            const: no such route
          error:
            const: no such path
    Method:
      allOf:
      - $ref: '#/components/schemas/ConsoleRefusal'
      - properties:
          detail:
            const: method
          error:
            const: method
    Unavailable:
      allOf:
      - $ref: '#/components/schemas/ConsoleRefusal'
      - properties:
          error:
            enum:
            - busy
            - denied
    FieldView:
      type: object
      required:
      - name
      - type
      - default
      - required
      additionalProperties: false
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - string
          - int
          - float
          - bool
          - list
          - json
          - url
          - blob
        default: {}
        required:
          type: boolean
        fixed:
          type: boolean
        bound_to:
          type: array
          items:
            type: string
        enum: {}
        inherit: {}
        merge:
          type: string
      dependentRequired:
        merge:
        - inherit
      allOf:
      - if:
          required:
          - inherit
        then:
          properties:
            default:
              type: 'null'
      oneOf:
      - properties:
          type:
            const: string
          default:
            anyOf:
            - type: 'null'
            - type: string
          inherit:
            type: string
          enum:
            type: array
            items:
              type: string
      - properties:
          type:
            const: int
          default:
            anyOf:
            - type: 'null'
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          inherit:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
        not:
          required:
          - enum
      - properties:
          type:
            const: float
          default:
            anyOf:
            - type: 'null'
            - type: number
              minimum: -1.7976931348623157e+308
              maximum: 1.7976931348623157e+308
          inherit:
            type: number
            minimum: -1.7976931348623157e+308
            maximum: 1.7976931348623157e+308
        not:
          required:
          - enum
      - properties:
          type:
            const: bool
          default:
            anyOf:
            - type: 'null'
            - type: boolean
          inherit:
            type: boolean
          enum:
            type: array
            items:
              type: boolean
      - properties:
          type:
            const: list
          default:
            anyOf:
            - type: 'null'
            - type: array
              items:
                type: string
          inherit:
            type: array
            items:
              type: string
        not:
          required:
          - enum
      - properties:
          type:
            const: json
          default:
            $ref: '#/components/schemas/JsonValue'
          inherit:
            $ref: '#/components/schemas/JsonValue'
        not:
          required:
          - enum
      - properties:
          type:
            const: url
          default:
            anyOf:
            - type: 'null'
            - type: string
          inherit:
            type: string
        not:
          required:
          - enum
      - properties:
          type:
            const: blob
          default:
            type: 'null'
          inherit:
            type: 'null'
          required:
            const: false
        not:
          anyOf:
          - required:
            - enum
          - required:
            - inherit
      description: Loaded field form. default is always present; null means no explicit default (or JSON null).
        inherit is absent when not declared. Type restrictions are static; enum/default membership and other cross-field
        rules still require semantic checks.
  responses:
    BadBody:
      description: Общий отказ транспорта консоли — тело chunked или короче объявленного; урок 9 Н4.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    Unauthenticated:
      description: Общий отказ личности из урока 9; доступность открытых путей определяется его Н1.3.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Denied'
    Denied:
      description: Общий отказ доступа из урока 9; применяется по условиям его сторожевой.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Denied'
    NoRoute:
      description: Нет маршрута; это не ответ загрузчика об ошибочной спеке.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoRoute'
    Method:
      description: Метод не из объявленных для этой двери.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Method'
    SlowBody:
      description: Тело читается слишком медленно; урок 9 Н4.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    LargeBody:
      description: Тело больше предела консоли; урок 9 Н4.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    RateLimited:
      description: Общий предел входа консоли из урока 9; новой квоты на чтение спеки нет.
      headers:
        Retry-After:
          description: Срок повтора по правилу предела входа.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    Unavailable:
      description: Общий отказ консоли — busy с Retry-After 1 либо denied при потере доверия (урок 9).
      headers:
        Retry-After:
          description: Обязателен со значением 1 при busy; не обещан для остальных причин.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unavailable'
