# Семья domain/backup — резервная копия у хранителя (P/09.1; P/09.1 Н1.9 member, Н3 «проверить резервную копию»). Источник
# формы объекта (ADR-0088 п. 8). Экземпляр — {key, object}; ключ — точное имя domain/backup. Слова —
# Platform/common/DIALECT.md. Документ резервной копии как пришёл: форма общая с объектом держателя domain/backups/rev-<rev>
# (P/08.8 Н1.5 document) — common.domain_backup_doc (решение «Архитектора» 2026-10-20 «Планы переноса 8–10», п. 3). Текст объекта — JCS; подпись и sha256 — по исходным байтам
# (DIALECT § 8). Пишет только агент хранителя — документ, прошедший sha256 и record, раньше строки domain/backup-taken; не
# удаляет никто — последний запасной путь.
dialect: data-form/1
root:
  ref: common.domain_backup_doc
  description: "подписанный документ резервной копии держателя у хранителя (Н1.9 member)"
