# Семья domain/placed/<sub>/<ref> — копия записи назначения у члена (P/09.1; P/09.1 Н1.5 member, readers). Источник формы
# строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md.
# Элементы записи как у держателя: форма — common.domain_placement, та же у строки domain/placement/<sub>/<ref> держателя
# (P/08.6 Н1.1; решение «Архитектора» 2026-10-20 «Планы переноса 8–10», п. 3). Пишет только агент: изменившиеся копии по CAS прочитанной версии, удаляет копии, которых нет в
# records; у кластера держателя копий нет — его читатели берут запись (P/08.6 Н1.1 readers).
dialect: data-form/1
root:
  ref: common.domain_placement
  description: копия записи назначения у члена — элементы как у держателя (Н1.5 member)
