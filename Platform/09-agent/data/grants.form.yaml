# Семья domain/grants — копия грантов у своего кластера (P/09.1; P/09.1 Н1.4 member_copy, holder_copy, fresh). Источник
# формы строки (ADR-0088). Экземпляр — {key, row}; ключ — точное имя domain/grants (строки держателя — семья
# domain/grants/<кластер>, P/08.4). Слова — Platform/common/DIALECT.md. doc — как пришёл: форма — common.grants_doc, та же
# у строки грантов держателя (P/08.4 Н1.3; решение «Архитектора» 2026-10-20 «Планы переноса 8–10», п. 3); as_of — своё поле копии. Пишет только агент по CAS прочитанной
# версии (doc сменился — сразу, тот же doc — as_of не чаще FRESH_EVERY); поля нет в открывшемся конверте — удаляет.
dialect: data-form/1
root:
  type: object
  properties:
    doc:
      ref: common.grants_doc
      description: текст JCS {lines} — поле grants ответа держателя как есть
    as_of:
      ref: common.time
      description: >-
        момент, когда держатель собрал ответ: стенные секунды приёма минус domain_age (прямой ответ — 0); назад не
        уходит; копия старше as_of + GRANT_LIFETIME прав не даёт (P/08.4 Н1.3)
  required: [doc, as_of]
