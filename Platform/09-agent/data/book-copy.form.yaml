# Семья domain/<sub>/<manifest:domain.books> — копия собранной книги у члена (P/09.1; P/09.1 Н1.4 member_row, Н3 «запись у
# члена»). Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога: <sub> —
# подсистема каталога, <книга> — имя книги domain.books её манифеста байт в байт. Слова — Platform/common/DIALECT.md. Элементы —
# как получены в sealed.books ответа держателя: форма — common.book_row, та же у строки книги держателя
# domain/<sub>/<книга>/<член> (P/08.5 Н1.3; решение «Архитектора» 2026-10-20 «Планы переноса 8–10», п. 3); секреты value — конверты кольца члена (договор запечатывания). Пишет
# только агент по CAS; у кластера держателя копии нет.
dialect: data-form/1
root:
  ref: common.book_row
  description: копия книги у члена; секреты value — конверты кольца члена (Н1.4 member_row)
