# Семья domain/agent — строка агента у члена: что агент не отправил (P/09.1; P/09.1 Н1.12 domain/agent). Источник формы
# строки (ADR-0088). Экземпляр — {key, row}; ключ — точное имя domain/agent. Слова — Platform/common/DIALECT.md. Пишет только
# агент — при изменении прочих полей; ни одного поля, кроме at, — строки нет (агент её удаляет); строку прошлого запуска
# агент удаляет при старте (проза Н1.12, не форма).
dialect: data-form/1
root:
  type: object
  properties:
    sign_failures_domain:
      ref: common.pos53
      description: "запросы держателю или ретранслятору, которые агент с запуска не отправил, потому что не смог подписать (Н1.12 count: один на проход)"
    sign_failures_console:
      ref: common.pos53
      description: "правки Н1.5 своей консоли, которые агент с запуска не отправил, потому что не смог подписать (одна на правку)"
    too_large:
      ref: common.pos53
      description: "байты целого, которое агент не отправил (Н1.2 body); снимается следующим отправленным целым"
    at:
      ref: common.time
      description: стенные секунды агента записи
  required: [at]
