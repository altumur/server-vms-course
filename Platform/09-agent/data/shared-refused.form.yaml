# Семья domain/shared-refused — отказ члена взять общий документ (P/09.1; P/09.1 Н1.10 member, in_report; Н3 «взять
# документ»). Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — точное имя domain/shared-refused. Слова —
# Platform/common/DIALECT.md. Пишет только агент по CAS прочитанной версии; взятый документ снимает строку с парой не новее
# своей. reason — слова шагов 3–5 Н3 «взять документ» (слово record — договор записи срока «Слова отказа»).
dialect: data-form/1
root:
  type: object
  properties:
    doc:
      encoding: jcs
      type: object
      description: "текст JCS отказа {term, rev, reason, at}; в отчёте — разобранный объект, term и rev целые (Н1.10 in_report)"
      properties:
        term:
          ref: common.pos53
          description: срок отказанного документа (указателя)
        rev:
          ref: common.pos53
          description: номер правки отказанного документа (указателя)
        reason:
          type: string
          not_enum: ['']
          description: причина отказа — слова Н3 «взять документ» шаги 3–5
        at:
          ref: common.time
          description: стенные секунды агента отказа
      required: [term, rev, reason, at]
  required: [doc]
