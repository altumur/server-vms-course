# Семья domain/member-key — ключ члена у своего кластера (P/09.1; P/09.1 Н1.1 domain/member-key, born; Н1.12 key_read).
# Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — точное имя domain/member-key. Слова —
# Platform/common/DIALECT.md. Пишет агент (создание-однажды при первом старте) и admin (`w2cctl secrets seal`, P/02.4 Н1.9).
# Секрет по суффиксу `_secret` — конверт кольца `enc:v2` (договор запечатывания); форма hex — у открытого значения. Что pub —
# открытый ключ зерна и точка не малого порядка, форма не выражает (проза Н1.1 pub; договор подписи агента).
dialect: data-form/1
root:
  type: object
  properties:
    seed_secret:
      type: string
      description: >-
        hex 32 случайных байт — зерно Ed25519 ключа члена (RFC 8032); в строке — конверт кольца члена (договор
        запечатывания), форма hex — у открытого
    pub:
      ref: common.domain_member_key
      description: "hex открытого ключа члена: им агент подписывает (Н1.3), к нему держатель запечатывает (P/08.3 Н1.5)"
  required: [seed_secret, pub]
