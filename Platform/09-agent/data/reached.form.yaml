# Семья domain/reached — когда агент последний раз дотянулся до домена (P/09.1; P/09.1 Н1.7 domain/reached, Н1.4 fresh).
# Источник формы объекта (ADR-0088 п. 8). Экземпляр — {key, object}; ключ — точное имя domain/reached. Слова —
# Platform/common/DIALECT.md. Пишет только агент (put): прямо — момент ответа, через ретранслятор — момент ответа минус
# domain_age; назад не уходит, тот же ts не переписывается, новый — не чаще FRESH_EVERY (правила Н1.7, Н1.4 fresh, не форма).
dialect: data-form/1
root:
  type: object
  properties:
    ts:
      ref: common.time
      description: стенные секунды, когда агент последний раз дотянулся до домена
  required: [ts]
