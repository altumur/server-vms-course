# Семья <sub>/controller/placement_turn — очередь размещения между контроллерами (P/04; P/04 Н1.5, Н3 «получить и
# удерживать очередь размещения»). Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key
# каталога. Слова — Platform/common/DIALECT.md.
dialect: data-form/1
root:
  type: object
  properties:
    holder:
      type: string
      description: уникальная метка попытки захвата или "" — очередь свободна; новая попытка не повторяет метку прежней
    manifest_rev:
      type: string
      pattern: '[1-9][0-9]*'
      description: ревизия манифеста (P/02.3 Н1.5 rev); не убывает — старый контроллер не захватывает новую ревизию
  required: [holder, manifest_rev]
