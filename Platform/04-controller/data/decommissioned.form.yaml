# Семья <sub>/decommissioned/<сервер> — отметка контроллера об исполненном выводе сервера (P/04; P/04 Н1.1, Н3
# «вывести_сервер»). Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога.
# Слова — Platform/common/DIALECT.md.
dialect: data-form/1
root:
  type: object
  properties:
    asked_at:
      ref: common.time
      description: стенные секунды запроса консоли (`platform/decommission/<сервер>` at)
    at:
      ref: common.time
      description: стенные секунды отметки контроллера
    slots:
      type: array
      items:
        type: string
        pattern: '[a-z]{1,8}-[a-z0-9]+(-[a-z0-9]+)*'
        description: имя отданного слота P/03.2 Н1.4
      description: имена отданных слотов по правилу списка М10/3 Н1.2; "" — ни одного; имена, не число (Д7)
    units:
      type: array
      items:
        ref: common.named_id
        description: id снятой единицы М10/3 Н1.3
      description: id снятых единиц по правилу списка М10/3 Н1.2; "" — ни одной
    holds:
      type: array
      items:
        type: string
        description: имя места удержания P/03.2 Н1.3 (`<sub>/holds/<место>`)
      description: места удержаний по правилу списка М10/3 Н1.2; "" — ни одного
  required: [asked_at, at, slots, units, holds]
