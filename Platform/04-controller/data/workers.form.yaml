# Семья <sub>/workers/<имя> — назначение воркера, производное от строк размещения (P/04; P/04 Н1.1). Источник формы
# строки (ADR-0088; разбор ревью стадии A 3–5, № 16). Экземпляр — {key, row}; ключ — грамматика колонки key каталога
# (<имя> — имя слота P/03.2 Н1.4). Слова — Platform/common/DIALECT.md. Порядок списка (отсортирован) — правило урока, не формы.
dialect: data-form/1
root:
  type: object
  properties:
    units:
      type: array
      items:
        ref: common.named_id
        description: id единицы (P/06.1 Н1.3); числовой id — тоже по этой грамматике
      unique_items: true
      description: id назначенных единиц по правилу списка P/06.1 Н1.2 (через запятую, иначе массив JSON; кодек array), отсортирован; "" — ни одной
    rev:
      type: string
      pattern: '[1-9][0-9]*'
      description: десятичное целое ≥ 1; +1 только при изменении списка
  required: [units, rev]
