# Семья <sub>/placement/<id> — решение размещения единицы (P/04; P/04 Н1.1, Н1.5). Источник формы строки (ADR-0088).
# Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md. Эффективное решение
# при active intent (Н1.5) и грамматика причины (Н3 «выбрать», «Причина») — правила урока, не формы.
dialect: data-form/1
root:
  type: object
  properties:
    worker:
      type: string
      pattern: '([a-z]{1,8}-[a-z0-9]+(-[a-z0-9]+)*)?'
      description: имя воркера — имя слота P/03.2 Н1.4 (`<prefix>-<суффикс>`; prefix своего манифеста — проверка урока, не формы); "" — не размещена
    reason:
      type: string
      writer: {not_enum: ['']}
      description: причина для человека; непустая (Н3 «Причина», P/04-18)
    at:
      ref: common.time
      description: стенные секунды контроллера в момент решения
    rev:
      type: string
      pattern: '[1-9][0-9]*'
      description: десятичное целое ≥ 1; +1 на каждую запись строки
    manifest_rev:
      type: string
      pattern: '[1-9][0-9]*'
      description: ревизия манифеста (P/02.3 Н1.5 rev), под которой принято решение; ДОЛЖЕН у реализации с хранением манифеста в строке; строки без него штампует проход (Н3 «проход()» шаг 1)
  required: [worker, reason, at, rev]
