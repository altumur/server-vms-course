# Семья <sub>/snapshot/<воркер> — шард снимка конфигурации по воркеру (P/04; P/04 Н1.3а, Н3 «снимок — после прохода»).
# Источник формы объекта (ADR-0088). Экземпляр — {key, object}; ключ — грамматика колонки key каталога (имя воркера
# unplaced — отказ). Слова — Platform/common/DIALECT.md. Ключ массива строк — unit.rows спеки (имя автора); состав полей
# snapshot: и маска адресов — правила урока (Н1.3а fields), не формы; потолок L — Н1.3а ceiling.
dialect: data-form/1
defs:
  row:
    type: object
    properties:
      id: {ref: common.named_id, description: "id единицы (P/06.1 Н1.3)"}
      revision: {type: [integer, string], description: "revision строки единицы"}
      worker: {type: [string, 'null'], description: "воркер назначения; у unplaced — нет"}
      server: {type: [string, 'null'], description: "сервер воркера"}
    required: [id, revision, worker, server]
    names:
      key: {type: string}
      value: {type: any, description: "поле из snapshot спеки (P/02.1), адреса — с маской P/06.2 Н1.1а"}
root:
  type: object
  properties:
    cluster: {type: string, description: "имя установки — CLUSTER окружения (P/02.4 Н1.2), не задано — local"}
    worker:
      type: string
      pattern: '[a-z]{1,8}-[a-z0-9]+(-[a-z0-9]+)*'
      description: имя воркера шарда (слот P/03.2 Н1.4)
    ts: {ref: common.time, description: "момент публикации"}
  required: [cluster, worker, ts]
  names:
    key: {type: string, description: "unit.rows спеки (P/06.1 Н1.1; не cluster/worker/ts — P/02.1)"}
    value:
      type: array
      items: {ref: row}
  writer: {max_items: 1}
