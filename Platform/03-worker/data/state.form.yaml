# Семья <sub>/state/<имя>/<id> — состояние единицы (P/03.6 Н1.7; ADR-0091 п. 3). Источник формы строки (ADR-0088).
# Экземпляр — {key, row}; ключ — грамматика колонки key каталога: имя — из unit.state манифеста, id — единицы (P/06.1 Н1.3).
dialect: data-form/1
root:
  type: object
  properties:
    born:
      type: string
      pattern: '([0-9a-f]{32})?'
      description: "born строки единицы при запуске держателя (P/06.1 Н1.2 born); пустая строка — строка единицы без born"
    revision:
      ref: common.pos53
      whole: true
      description: "revision строки единицы при запуске держателя; десятичное целое ≥ 1"
    epoch:
      ref: common.pos53
      whole: true
      description: "эпоха держателя, под которой записано (P/03.2 Н1.5); при чтении не сверяется"
    value:
      encoding: jcs
      type: any
      description: "канонический JSON значения по схеме unit.state.<имя> манифеста; не по схеме — состояние не действует (P/03.6 Н1.7 unreadable)"
  required: [born, revision, epoch, value]
