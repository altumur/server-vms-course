# Семья <sub>/holds/<место> — строка удержания места (P/03.2; P/03.2 Н1.3). Источник формы строки (ADR-0088).
# Экземпляр — {key, row}; ключ — грамматика колонки key каталога; грамматика места не названа — только полный ключ
# P/01.1 Н1 (Н3 «место»). Слова — Platform/common/DIALECT.md. Форма слота Н1.4 без server, плюс by; читатель, как у слота,
# отказывает только по until и gen (Н1.4 torn).
dialect: data-form/1
root:
  type: object
  properties:
    holder:
      type: string
      description: "как у слота: экземпляр держателя `<коробка>:<pid>:<6 hex случайности>` или \"\""
    until:
      ref: common.time
      description: "как у слота: часы писателя + 45; показ, не свежесть — чужое место свободно, простояв без изменений 45 + HOLD_SKEW по часам судьи"
    released:
      type: string
      writer: {enum: ['true', 'false', 'taking']}
      description: "как у слота; отпустить — \"true\" (только упорядоченная остановка)"
    gen:
      type: integer
      minimum: 0
      whole: true
      description: "как у слота: поколение, не убывает"
    by:
      type: string
      writer: {pattern: '[a-z]{1,8}-[a-z0-9]+(-[a-z0-9]+)*'}
      description: "имя слота держателя — чьё место (Н1.3); по нему место «следует за именем» (Н3 «место»)"
  required: [until, gen]
  names:
    key: {type: string}
    value: {type: any, description: "поля сверх Н1.3: норма их не называет"}
