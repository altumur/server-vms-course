# Семья <sub>/heartbeats/<имя> — пульс воркера, объект (P/03.4; P/03.4 Н1.1). Источник формы объекта (ADR-0088 п. 8).
# Экземпляр — {key, object}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md. Поля, имена которых
# называет манифест (<capacity.from>, <headroom.from>, <place_by>), и слова подсистемы — имена автора (names); правила, которые
# схема не выражает (worker равен имени в ключе, server_unsaid только при places.server_field и неизвестном сервере, fenced и
# stood_in — только в своих случаях, запас по весам P/04 Н1.3, said_id, ритм), — проза Н1.1.
dialect: data-form/1
root:
  type: object
  properties:
    worker:
      type: string
      description: имя слота; ДОЛЖЕН; равен имени в ключе
    ts:
      ref: common.time
      description: стенные секунды писателя; ДОЛЖЕН; для показа и расхождения часов, не для свежести (ADR-0049)
    status:
      type: array
      description: ДОЛЖЕН; по элементу на единицу, которую воркер ведёт
      items:
        type: object
        description: "элемент не по этой форме — единственный перечень (исходы рядом, путь /status; разбор ревью стадии B 6–7, № 15): нет id, phase, epoch, revision или observed_revision; id не по грамматике id единицы (договор проверки строки); phase не строка; epoch, revision не целым знаком ≥ 1; observed_revision не целым знаком ≥ 0 (границы — RunningUnit контракта урока 6)"
        properties:
          id:
            ref: common.named_id
            description: id единицы — по грамматике договора проверки строки (форма держит named; у манифеста с unit.id numeric — ещё numeric, P/06.1 Н1.3)
          phase:
            type: string
            description: слова подсистемы; платформа знает одно — running (счётчик running, соседство near)
          epoch:
            type: integer
            minimum: 1
            whole: true
            description: "эпоха единицы; целый знак ≥ 1 (P/08.1 Н1.6 claim: элемент с нецелыми epoch, revision, observed_revision — не по форме)"
          revision:
            type: integer
            minimum: 1
            whole: true
            description: revision строки единицы; целый знак ≥ 1 (P/08.1 Н1.6 claim)
          observed_revision:
            type: integer
            minimum: 0
            whole: true
            description: revision строки, под которой единица сейчас запущена; целый знак ≥ 0 (P/08.1 Н1.6 claim)
          why:
            type: string
            description: "причина платформы, когда единица не идёт (sealed — глава 3.5 Н3 «открыть»), как fates.why P/04, не error (второй пилот, Н-7)"
          stalled:
            type: boolean
            enum: [true]
            description: "отступ запуска единицы дошёл до RETRY_MAX (глава 3.3 Н1.2 retry; ADR-0091 п. 6); иначе поля нет"
          lease:
            type: string
            enum: [unconfirmed]
            description: "аренда единицы не подтверждена (глава 3.2 Н1.6 silent); иначе поля нет (запрос VMS «пульс и битая строка»)"
          unconfirmed_s:
            type: number
            minimum: 0
            description: "секунды без подтверждения аренды единицы, с точностью 0,1 с; только вместе с lease: unconfirmed"
        required: [id, phase, epoch, revision, observed_revision]
        names:
          key: {type: string}
          value: {type: any, description: "слова подсистемы; учебный обработчик testsub — одно слово n, текущее значение счётчика (второй пилот, Н-7)"}
    server:
      type: string
      description: "сервер; ДОЛЖЕН; \"\" ровно когда сервер неизвестен (ADR-0029)"
    instance:
      type: string
      description: экземпляр; ДОЛЖЕН
    labels:
      type: string
      description: метки узла через запятую
    url:
      type: string
      description: "url двери — строка платформы (platform_strings Н1.1; добавлено М10/9, P/06.5 Н3 «`/where/<id>`»); хост, схема и привязка — Н1.7 door_address (ADR-0091 доп. (7), (8))"
    fetched:
      type: string
      description: "SaidID(rid) через запятую, без пробелов — просьбы, исход которых держатель сообщил (глава 3.6 Н3 «взгляд держателя»); поля нет или пусто — ничего не сообщено; длину ограничивают FETCHED_COUNT/FETCHED_BYTES (глава 3.6)"
    events:
      type: string
      description: строка платформы (platform_strings Н1.1)
    conflicts:
      ref: common.uint53
      description: Σ конфликтов аренд + перенесённых; метрика `<sub>_epoch_conflicts`
    started:
      ref: common.time
      description: момент старта
    previous_hb:
      ref: common.time
      description: "число ts застанного под своим именем при старте пульса, если было (журнал cammeta-go, урок 9 № 6: по нему консоль считает failover_seconds, P/06.5 Н3)"
    previous_instance:
      type: string
      description: instance застанного пульса, если был
    previous_server:
      type: string
      description: server застанного пульса, если был
    fenced:
      type: boolean
      enum: [true]
      description: только пока отсечён и имя ещё моё; после отдать_имя пульс не пишется
    was_fenced:
      type: boolean
      description: "был ли этот экземпляр отсечён с запуска (Н3 «отсечён»); ряд P/06.5 worker_fenced{worker} (запрос VMS «пульс и битая строка»)"
    store_errors:
      ref: common.uint53
      description: "ответов хранилища с ошибкой или без ответа с запуска экземпляра (глава 3.2 таблица отказов: store_errors + 1); ряд worker_store_errors{worker}"
    pass_failures:
      ref: common.uint53
      description: "проходов цикла, оборванных ошибкой, с запуска экземпляра (глава 3.3 Н3); ряд worker_pass_failures{worker}"
    unconfirmed:
      ref: common.uint53
      description: "единиц, чья аренда сейчас не подтверждена (элементы status[] с lease: unconfirmed); ряд worker_unconfirmed{worker}"
    place_error:
      type: object
      description: "место не взято или потеряно: место → слово — sealed (секрет строки места не открылся, глава 3.5), refused (отказ подсистемы), wrong (строка места не по форме) — закрытый перечень; запись снимается, когда место взято или отпущено; записей не больше числа мест-кандидатов; поле платформы, не строка platform_strings; place_by — прежнее (ADR-0091 доп. (10) п. 4, повторное ревью)"
      names:
        key: {type: string}
        value: {enum: [sealed, refused, wrong]}
    freeing:
      type: object
      description: "ответ на просьбу ресурса освободить место (P/05 Н1.4 free_ask): том ресурса → байты, которые воркер освобождает и которых ещё нет в used; 0 — ничего; поле платформы; что освобождать — подсистема (запрос VMS freeing)"
      names:
        key: {type: string, pattern: '[A-Za-z0-9_]{1,64}'}
        value: {ref: common.uint53}
    garbled_rows:
      ref: common.uint53
      description: "чтений строк своих единиц, не прочитанных своим типом (глава 3.3 Н3 шаг 2), и строк просьб и меток, не прочитанных своей формой держателем (глава 3.6 «взгляд держателя»; RM-G01), с запуска экземпляра"
    schema:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      whole: true
      description: "схема сборки (P/06.6 Н1.1а heartbeat): целое JSON без дробной части и экспоненты, ≥ 1"
    build:
      type: string
      description: слово сборки для человека (P/06.6 Н1.1а heartbeat)
    pending_writes:
      ref: common.uint53
      whole: true
      description: "P/06.6 Н1.2 pending_writes: целое JSON без дробной части и экспоненты, 0 ≤ x ≤ 2^53 − 1; базовый воркер пишет 0 сам, если подсистема не сказала своё; поля нет — дренаж не safe"
    server_unsaid:
      type: string
      enum: ["this worker names no server of its own: every place it holds is let go when its hold goes unconfirmed"]
      description: ровно эта строка (ADR-0029); только когда сервер не назван, а манифест требует places.server_field
    stood_in:
      type: object
      description: "только в пульсе подмены (Н3); ts пульса — время этого повтора (журнал cammeta-go, урок 5 № 2)"
      properties:
        step:
          description: "stood_in.step (Н1.1 {step, for, as_of})"
        for:
          description: "stood_in.for (Н1.1 {step, for, as_of})"
        as_of:
          ref: common.time
          description: ts последнего пульса цикла, который подмена повторяет (возраст состояния подсистемы), у следующих повторов тот же
      required: [step, for, as_of]
    stand_in_renewals:
      ref: common.pos53
      description: число продлений подменой; только когда > 0
    command_counts:
      type: object
      description: "исходы вызовов действия этим экземпляром с его старта (глава 3.6 Н3 «взгляд держателя»; ADR-0091 п. 6)"
      properties:
        performed: {ref: common.uint53}
        refused: {ref: common.uint53}
        expired: {ref: common.uint53}
        unknown: {ref: common.uint53}
    commands_in_flight:
      ref: common.pos53
      description: вызовов действия, ещё не вернувшихся; только когда > 0
    commands_reanswered:
      ref: common.pos53
      description: исходов, записанных снова (late); только когда > 0
    command_road:
      type: object
      description: "по подателю (operator или подсистема): дорога — от at строки просьбы до первого местного наблюдения её этим воркером (W03-E05)"
      names:
        key: {type: string}
        value: {ref: histogram}
    command_request:
      type: object
      description: "по подателю: полное время — от at строки просьбы (время подачи) до исхода; из filed время не выводится (W03-E05)"
      names:
        key: {type: string}
        value: {ref: histogram}
    command_wait:
      ref: histogram
      description: ожидание у держателя — от первого местного наблюдения просьбы этим воркером до исхода, по монотонным часам (W03-E05)
    filings:
      type: object
      description: "подача просьб воркером (глава 3.6 Н1.5; ADR-0091 п. 7)"
      properties:
        filed: {ref: common.uint53}
        again: {ref: common.uint53}
        refused: {ref: common.uint53}
    creates:
      type: object
      description: "исходы заказа строк другой подсистемы (глава 3.6 Н1.6; ADR-0091 п. 1, Г-7)"
      properties:
        created: {ref: common.uint53}
        extended: {ref: common.uint53}
        unchanged: {ref: common.uint53}
        taken: {ref: common.uint53}
        gone: {ref: common.uint53}
        expired: {ref: common.uint53}
        refused: {ref: common.uint53}
    made_rows:
      type: object
      description: "заказчик: ключей под префиксом `<адресат>/<rows>/<заказчик>-` по последнему перечислению (ADR-0091 п. 1)"
      names:
        key: {type: string}
        value: {ref: common.uint53}
  required: [worker, ts, status, server, instance]
  names:
    key: {type: string}
    value: {type: any, description: "поля, имена которых называет манифест: `<capacity.from>` — ёмкость (умолчание capacity), `<headroom.from>` — запас = ёмкость − Σ весов назначения (умолчание headroom), `<place_by>` — место, которое воркер держит, \"\" — не держит; остальное — слова подсистемы, которые платформа не читает (heartbeat.strings называет строки)"}
defs:
  histogram:
    type: object
    description: "гистограмма пульса (Н1.1 histogram): buckets — счёты по границам ROAD_BUCKETS, накопительно"
    properties:
      buckets:
        type: array
        min_items: 10
        max_items: 10
        items: {ref: common.uint53}
      sum: {type: number, minimum: 0}
      count: {ref: common.uint53}
      ahead: {ref: common.uint53}
      behind: {ref: common.uint53}
    required: [buckets, sum, count]
