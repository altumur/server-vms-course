# Семья <sub>/epoch/<id> — строка эпохи единицы (P/03.2; P/03.2 Н1.5). Источник формы строки (ADR-0088).
# Экземпляр — {key, row}; ключ — грамматика колонки key каталога (id единицы — договор проверки строки). Слова — Platform/common/DIALECT.md.
dialect: data-form/1
root:
  type: object
  properties:
    epoch:
      type: integer
      whole: true
      writer: {minimum: 1, maximum: 9007199254740991}
      description: "десятичное целое ≥ 1, < 2^53 (ADR-0070); растёт на 1 при каждом взятии единицы воркером: max(текущая, floor) + 1 с cas, при max = 2^53 − 1 — отказ выдачи до записи (разбор ревью стадии B 3–5, № 8); перезапуск той же единицы тем же держателем по смене revision эпоху не меняет; строка не удаляется"
  required: [epoch]
