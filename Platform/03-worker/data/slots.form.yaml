# Семья <sub>/slots/<имя> — строка слота воркера (P/03.2; P/03.2 Н1.4). Источник формы строки (ADR-0088).
# Экземпляр — {key, row}; ключ — грамматика колонки key каталога (имя слота Н1.4). Слова — Platform/common/DIALECT.md.
# Читатель отказывает только по until и gen — порванная строка Н1.4 torn; holder, released, server читаются как есть.
dialect: data-form/1
root:
  type: object
  properties:
    holder:
      type: string
      description: "экземпляр держателя `<коробка>:<pid>:<6 hex случайности>` или \"\"; коробка держателя — часть до первого «:»"
    until:
      ref: common.time
      description: "часы писателя + 45; показ и расхождение, не свежесть: held и lapsed — по возрасту наблюдаемой версии у судьи; конечный until в прошлом или будущем не делает строку порванной"
    released:
      type: string
      writer: {enum: ['true', 'false', 'taking']}
      description: "\"true\" | \"false\" | \"taking\" — первая запись захвата (Н3 «захватить» шаг 3); всякое «released» без значения — released ≠ \"false\""
    gen:
      type: integer
      minimum: 0
      whole: true
      description: "поколение: у отсутствующей строки исходное — 0, +1 на каждый захват, никогда не убывает; у существующей строки отсутствие или недопустимость не заменяются нулём"
    server:
      type: string
      description: "сервер держателя, пишется при каждом захвате и продлении; \"\" — сервер неизвестен (глава 3.4 Н1.1, ADR-0029)"
  required: [until, gen]
  names:
    key: {type: string}
    value: {type: any, description: "поля сверх Н1.4: норма их не называет; захват пишет ровно пять полей Н1.4, продление и отдача переписывают строку с прочими полями ({…строка, …}, Н3 «продлить», «отдать»)"}
