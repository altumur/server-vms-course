# keep:true local cache policy, receiver outcomes are external facts; IO effects are only observed here.
machine: token-cache
norm: P/03.7-R009, P/03.7-R055, P/03.7-R056, P/03.7-R057, P/03.7-R058, P/03.7-R059, P/03.7-R060, P/03.7-R106, P/03.7-R107
states:
- loading
- ready
- asking
- candidate
- cooldown
initial: loading
terminal: []
input: {}
types: {}
const: {}
vars:
  current_handle:
    type: string
    init: ''
  current_jti:
    type: string
    init: ''
  candidate_handle:
    type: string
    init: ''
  candidate_jti:
    type: string
    init: ''
  revoked_word:
    type: string
    init: ''
  usable:
    type: bool
    init: false
  blocked_day:
    type: int
    init: -1
timers: {}
events:
  loaded:
    opened: bool
    handle: string
    jti: string
  demand:
    day: int
  issued:
    handle: string
    jti: string
    day: int
  issue_failed: {}
  accepted:
    handle: string
  unknown_key:
    handle: string
  expired:
    handle: string
  revoked:
    handle: string
env:
- One process, one manifest kind with keep:true and one ref. Handles/JTIs are opaque references to already parsed
  real tokens; trace handles contain no token bytes.
- loaded reports the actual envelope/file read. day is the UTC calendar-day ordinal by this worker wall clock
  under P/03.7-R107, supplied by the ordinary clock/calendar code; TIMEZONE does not select this boundary.
- accepted/unknown_key/expired/revoked are actual recipient outcomes for the named handle, not a decision based
  on the worker clock or on exp alone.
- request, offer, wait and persist are effects of the ordinary code. The reference observes their selection; it
  executes no HTTP, signature, file or cryptographic operation.
- persist is selected only after the first accepted request with the candidate. Actual sealing/path/mode0600, IO
  failures, retry/write ordering and confirmation remain with the ordinary file writer; selection is not a claim
  that a file write completed.
functions: {}
actions:
  restore:
    args:
      opened: bool
      handle: string
      jti: string
    set:
      current_handle: 'opened ? handle : ""'
      current_jti: 'opened ? jti : ""'
      usable: opened
  reject:
    args:
      word: string
    set:
      usable: 'false'
      revoked_word: word
      candidate_handle: '""'
      candidate_jti: '""'
  receive:
    args:
      handle: string
      jti: string
    set:
      candidate_handle: handle
      candidate_jti: jti
  promote:
    set:
      current_handle: candidate_handle
      current_jti: candidate_jti
      candidate_handle: '""'
      candidate_jti: '""'
      usable: 'true'
      revoked_word: '""'
  block:
    args:
      day: int
    set:
      blocked_day: day
      candidate_handle: '""'
      candidate_jti: '""'
  request:
    args:
      word: string
    io: Ask the ordinary local agent token door, including revoked only when word is nonempty.
  offer:
    args:
      handle: string
    io: Supply this real token to the ordinary recipient request; no token is returned in a trace.
  wait:
    io: Wait for the existing request/key/day condition; do not request a replacement token.
  same_jti_log:
    args:
      day: int
    io: The existing log for a reply that did not execute the revoked word; no token bytes.
  persist:
    args:
      handle: string
    io: Request replacement of this kind/ref cache file with the now-accepted token, by the ordinary sealing/file
      writer.
invariants:
  usable_has_identity: '!usable || (current_handle != "" && current_jti != "")'
  candidate_has_identity: state != "candidate" || (candidate_handle != "" && candidate_jti != "")
  blocked_day: blocked_day >= -1
transitions:
- id: load-once
  event: loaded
  from: loading
  do:
  - restore(opened, handle, jti)
  to: ready
- id: use-current
  event: demand
  from: ready
  if: usable
  do:
  - offer(current_handle)
  to: ready
- id: ask-when-no-current
  event: demand
  from: ready
  if: '!usable'
  do:
  - request(revoked_word)
  to: asking
- id: one-request-at-a-time
  event: demand
  from: asking
  do:
  - wait()
  to: asking
- id: use-candidate
  event: demand
  from: candidate
  do:
  - offer(candidate_handle)
  to: candidate
- id: blocked-through-this-day
  event: demand
  from: cooldown
  if: day <= blocked_day
  do:
  - wait()
  to: cooldown
- id: next-day
  event: demand
  from: cooldown
  if: day > blocked_day
  do:
  - request(revoked_word)
  to: asking
- id: failed-request-no-file-change
  event: issue_failed
  from: asking
  to: ready
- id: revoked-word-not-executed
  event: issued
  from: asking
  if: revoked_word != "" && jti == revoked_word
  do:
  - block(day)
  - same_jti_log(day)
  to: cooldown
- id: new-candidate-no-file-yet
  event: issued
  from: asking
  do:
  - receive(handle, jti)
  - offer(candidate_handle)
  to: candidate
- id: persist-after-first-accept
  event: accepted
  from: candidate
  if: handle == candidate_handle
  do:
  - persist(candidate_handle)
  - promote()
  to: ready
- id: unknown-key-current-waits
  event: unknown_key
  from: ready
  if: usable && handle == current_handle
  do:
  - wait()
  to: ready
- id: unknown-key-candidate-waits
  event: unknown_key
  from: candidate
  if: handle == candidate_handle
  do:
  - wait()
  to: candidate
- id: expired-current
  event: expired
  from: ready
  if: usable && handle == current_handle
  do:
  - reject("")
  - request(revoked_word)
  to: asking
- id: revoked-current
  event: revoked
  from: ready
  if: usable && handle == current_handle
  do:
  - reject(current_jti)
  - request(revoked_word)
  to: asking
- id: expired-candidate
  event: expired
  from: candidate
  if: handle == candidate_handle
  do:
  - reject("")
  - request(revoked_word)
  to: asking
- id: revoked-candidate
  event: revoked
  from: candidate
  if: handle == candidate_handle
  do:
  - reject(candidate_jti)
  - request(revoked_word)
  to: asking
