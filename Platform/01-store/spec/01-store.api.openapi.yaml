# P/01 — doors of the store process: the HTTP contract. Operations — chapter 1.1 (01.1-store.norms.md N2–N4), rights and /v1/rights —
# chapter 1.2 (01.2-store.norms.md), service doors of the daemon /v1/status, /v1/join, /v1/leave, /metrics and op floor — chapter 1.3 (01.3-store.norms.md).
openapi: 3.1.0
info: {title: Doors of the store process, version: "1"}
paths:
  /v1/get:
    get:
      summary: read
      parameters:
      - name: key
        in: query
        required: true
        schema: {$ref: "#/components/schemas/Key"}
        description: Query parsing — N2.1 (application/x-www-form-urlencoded; + is a space, %2B is a plus); repeated or absent — 400 badrequest, bytes not UTF-8 — 400 badkey.
      responses:
        "200":
          description: a row; an absent one — items null, index ""
          content: {application/json: {schema: {$ref: "#/components/schemas/Row"}}}
        "400": {$ref: "#/components/responses/BadRequestOrKey"}
        "404": {$ref: "#/components/responses/NoRoute"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413": {$ref: "#/components/responses/BodyTooLarge"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/list:
    get:
      summary: list
      description: After the identity check of P/01.2 N3 «check»; the read right to values is not required.
      parameters:
      - name: prefix
        in: query
        required: false
        schema: {type: string}
        description: Bytes after query parsing by N2.1, UTF-8 is not required; absent — an empty prefix; repeated — 400 badrequest.
      responses:
        "200":
          description: every key with the given prefix and its version; keys in byte order
          content: {application/json: {schema: {$ref: "#/components/schemas/Listing"}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NoRoute"}
        "413": {$ref: "#/components/responses/BodyTooLarge"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /v1/write:
    post:
      summary: A plain write of P/01.1, a batch or a privileged raise of the floor
      description: >-
        N2 of the norms: the body read limit is set separately from the row ceiling; when
        it is exceeded before JSON parsing — 413 toolarge, limit equals the body limit in bytes.
        In acceptance the body limit is 1048576, the row ceiling 524288 bytes.
      requestBody:
        required: true
        content: {application/json: {schema: {oneOf: [$ref: '#/components/schemas/Cmd', $ref: '#/components/schemas/BatchCmd', $ref: '#/components/schemas/FloorCmd']}}}
      responses:
        "200":
          description: done; again — the answer of the former application of the write with this id
          content: {application/json: {schema: {$ref: "#/components/schemas/Written"}}}
        "400": {$ref: "#/components/responses/BadRequestOrKey"}
        "404": {$ref: "#/components/responses/NoRoute"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: CAS of P/01.1 (for a batch — with key of the row), admission-time conditions (expired, early — ADR-0091 item 1) or floor does not increase or the current floor does not read (refused — floor_not_higher of P/01.1 N4, floor_unreadable of P/01.3 N4); another payload with the same id — 400 badrequest, not 409
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ConflictFault'
                - $ref: '#/components/schemas/BatchConflictFault'
                - $ref: '#/components/schemas/ExpiredFault'
                - $ref: '#/components/schemas/EarlyFault'
                - $ref: '#/components/schemas/Refused'
        "412": {$ref: "#/components/responses/Guard"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "503": {$ref: "#/components/responses/UnavailableOrAmbiguous"}
  /v1/rights:
    get:
      summary: The loaded rights file; only the identity admin after the forwarding admissibility check
      responses:
        '200':
          description: The whole loaded JSON object; no envelope and no added fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RightsFile'
        '403':
          description: Not admin, or an attempt to substitute the role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenFault'
        '404':
          description: The rights file is not loaded, or no route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestFault'
        '413':
          description: The body is larger than the effective -max-body read limit; checked before the route, the method and the identity (chapter 1.1 R034, chapter 1.3 R017)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyTooLargeFault'
        '503':
          description: The store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnavailableFault'
  /v1/status:
    get:
      summary: Local observation of membership and indexes
      responses:
        '200':
          description: The whole JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '400':
          description: The whole JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestFault'
        '403':
          description: The whole JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenFault'
        '404':
          description: No route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestFault'
        '405':
          description: Wrong method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestFault'
        '413':
          description: The body is larger than the effective -max-body read limit; checked before the route, the method and the identity (chapter 1.1 R034, chapter 1.3 R017)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyTooLargeFault'
        '503':
          description: The whole JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnavailableFault'
          headers:
            Retry-After:
              schema:
                type: integer
                const: 1
              description: For this operation it is exactly 1 at the connection limit (P/01.3-R321), otherwise absent. The separate replay_limit deadline of writes is specified by P/01.3-R329.
  /v1/join:
    post:
      summary: Joining by the certified role of the daemon
      responses:
        '200':
          description: The whole JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          description: The whole JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestFault'
        '403':
          description: The whole JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenFault'
        '404':
          description: No route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestFault'
        '405':
          description: Wrong method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestFault'
        '503':
          description: Not done (for another member on admin.sock of a follower — unavailable, admin_not_leader of P/01.3 N4), or the outcome of the membership change is unknown; re-read status
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/UnavailableFault'
                - $ref: '#/components/schemas/AmbiguousFault'
          headers:
            Retry-After:
              schema:
                type: integer
                const: 1
              description: For this operation it is exactly 1 at the connection limit (P/01.3-R321), otherwise absent. The separate replay_limit deadline of writes is specified by P/01.3-R329.
        '409':
          description: 'Inadmissible membership (P/01.3-R272); on a door, join/leave are refused after form and identity checks (P/01.3-R087).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refused'
        '413':
          description: The read limit of a service request body is exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyTooLargeFault'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Join'
  /v1/leave:
    post:
      summary: Leaving of oneself or of the named member
      responses:
        '200':
          description: The whole JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400':
          description: The whole JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestFault'
        '403':
          description: The whole JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenFault'
        '404':
          description: No route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestFault'
        '405':
          description: Wrong method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestFault'
        '503':
          description: Not done (for another member on admin.sock of a follower — unavailable, admin_not_leader of P/01.3 N4), or the outcome of the membership change is unknown; re-read status
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/UnavailableFault'
                - $ref: '#/components/schemas/AmbiguousFault'
          headers:
            Retry-After:
              schema:
                type: integer
                const: 1
              description: For this operation it is exactly 1 at the connection limit (P/01.3-R321), otherwise absent. The separate replay_limit deadline of writes is specified by P/01.3-R329.
        '409':
          description: 'Inadmissible membership (P/01.3-R272), including the last voter; on a door, join/leave are refused after form and identity checks (P/01.3-R087).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refused'
        '413':
          description: The read limit of a service request body is exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyTooLargeFault'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Leave'
  /v1/copy:
    get:
      summary: Read one consistent copy through the local admin socket only
      description: >-
        P/01.3 HTTP copy. Check framing, route/method and identity in that order.
        A correct GET on an ordinary role socket is 403 before opening or exposing
        a snapshot; role headers and network forwarding grant no admin access.
        The successful body is the existing UTF-8/LF JSONL copy version1 at one index,
        not a single JSON object. Complete exact Content-Length or valid chunked
        framing is required; EOF-only framing is not successful completion.
        After 200 a failure closes the stream without a second fault or false final
        zero chunk. HEAD is unsupported: 405 with Allow GET and no body.
        A door returns 503 unavailable before successful headers after request and
        identity checks (P/01.3-R411); it has no local consistent copy.
        Internal read-fence/admit/import frames remain implementation-private.
      responses:
        '200':
          description: The whole consistent copy; success is signalled only after its complete artifact and HTTP framing
          headers:
            Content-Length:
              schema: {type: string, pattern: '^(?:[0-9]+)$'}
              description: Exact entity-body byte length; use this or valid completed chunked, not both
            Transfer-Encoding:
              schema: {type: string, pattern: '^(?:[Cc][Hh][Uu][Nn][Kk][Ee][Dd])$'}
              description: Alternative to Content-Length; send the terminal zero chunk only on successful complete output
          content:
            application/x-ndjson:
              schema:
                type: string
                description: Existing w2c-configstore-copy version1 UTF-8/LF header and rows, one consistent index, keys in UTF-8-byte order
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NoRoute'}
        '405':
          description: Unsupported method on this known path; BadRequestFault, body omitted for HEAD
          headers:
            Allow: {required: true, schema: {type: string, const: GET}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BadRequestFault'}
        '413':
          description: Existing effective body-limit refusal before the copy operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BodyTooLargeFault'}
        '503':
          description: Unavailable consistent snapshot or expired wait before successful headers; no write AmbiguousFault
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UnavailableFault'}
          headers:
            Retry-After:
              schema: {type: integer, const: 1}
              description: Only for the existing unavailable connection-limit cause; absent for snapshot or wait failure
    head:
      summary: Unsupported copy method; always bodyless
      description: Framing precedes the method check; this declares no successful HEAD copy operation
      responses:
        '400': {description: BadRequestFault status without a body}
        '405':
          description: Method not supported; no body
          headers:
            Allow: {required: true, schema: {type: string, const: GET}}
        '413': {description: Existing body-limit refusal status without a body}
        '503':
          description: Existing connection-limit refusal status without a body
          headers:
            Retry-After: {schema: {type: integer, const: 1}}
  /metrics:
    get:
      summary: Daemon metrics
      responses:
        '200':
          description: Prometheus text exposition UTF-8; series — N1.3 metrics; a voter has configstore_raft_* and configstore_doors, a door without a vote — only configstore_door_forwards_total{outcome} and configstore_door_voters_reachable
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: The whole JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestFault'
        '403':
          description: The whole JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenFault'
        '404':
          description: No route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestFault'
        '405':
          description: Wrong method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestFault'
        '413':
          description: The body is larger than the effective -max-body read limit; checked before the route, the method and the identity (chapter 1.1 R034, chapter 1.3 R017)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyTooLargeFault'
        '503':
          description: The whole JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnavailableFault'
          headers:
            Retry-After:
              schema:
                type: integer
                const: 1
              description: For this operation it is exactly 1 at the connection limit (P/01.3-R321), otherwise absent. The separate replay_limit deadline of writes is specified by P/01.3-R329.
components:
  schemas:
    Key:
      type: string
      minLength: 1
      not:
        anyOf:
        - pattern: "^(?:/[\\s\\S]*)$"
        - pattern: "^(?:(?:[\\s\\S]*/)?\\.\\.(?:/[\\s\\S]*)?)$"
      description: >-
        N1: a key is not empty, does not start with /, no segment between / equals ..;
        ..foo is admissible. The limit of 1024 UTF-8 bytes applies to every implementation
        and is checked separately; maxLength does not express a number of bytes.
    Version:
      type: string
      pattern: "^(?:(?:0|[1-9][0-9]{0,19}))$"
      description: A non-empty version by N1; the caller compares it only for equality.
    VersionOrAbsent:
      type: string
      pattern: "^(?:(?:0|[1-9][0-9]{0,19})?)$"
      description: A version, or the empty string if there is no row.
    Row:
      description: Three distinguishable outcomes of a read; unreadable is only ever true, for a damaged row.
      unevaluatedProperties: false
      oneOf:
      - type: object
        required: [items, index]
        additionalProperties: false
        properties:
          items: {type: object, additionalProperties: {type: string}}
          index: {$ref: "#/components/schemas/Version"}
      - type: object
        required: [items, index]
        additionalProperties: false
        properties:
          items: {type: "null"}
          index: {const: ""}
      - type: object
        required: [items, index, unreadable]
        additionalProperties: false
        properties:
          items: {type: "null"}
          index: {$ref: "#/components/schemas/Version"}
          unreadable: {const: true}
    Listing:
      type: object
      required: [keys]
      additionalProperties: false
      properties:
        keys:
          type: object
          propertyNames: {$ref: "#/components/schemas/Key"}
          additionalProperties: {$ref: "#/components/schemas/Version"}
      description: The order of the names in keys is by UTF-8 bytes; JSON Schema does not check the order of an object.
    Cmd:
      type: object
      description: "Extra top-level fields of a command are accepted and not read regardless of their JSON type (N2, P/01.1-12; judge-only: sc. 23 of chapter 1.1); only guard is closed"
      unevaluatedProperties: true
      required: [op, key]
      properties:
        op: {type: string, enum: [put, delete], description: "op floor is a separate schema FloorCmd of chapter 1.3 on admin.sock of a running box or of the group leader (P/01.3-R215)"}
        key: {$ref: "#/components/schemas/Key"}
        cas: {type: [string, "null"], pattern: "^(?:(?:0|[1-9][0-9]{0,19})?)$"}  # N1: null, empty or a version; strictly to the end of the string
        guard:
          type: object
          required: [key, index]
          additionalProperties: false
          properties:
            key: {$ref: "#/components/schemas/Key"}
            index: {type: string, pattern: "^(?:(?:0|[1-9][0-9]{0,19})?)$"}  # N1: empty or a version
        id: {type: string, pattern: "^(?:[0-9a-f]{1,64})$"}
        not_after: {type: number, minimum: 0, description: "N1, N3 «Admission time»: admitted only while the admission time ≤ not_after, otherwise 409 expired (ADR-0091 item 1)"}
        not_before: {type: number, minimum: 0, description: "N1, N3 «Admission time»: admitted only if the admission time > not_before, otherwise 409 early (ADR-0091 item 1)"}
      oneOf:
      - properties:
          op: {const: put}
          items: {type: object, additionalProperties: {type: string}}
        required: [items]    # required for put; MAY be an empty object
      - properties:
          op: {const: delete}
          items: {}    # not read for delete: any JSON value or absence is no refusal
    BatchCmd:
      type: object
      description: "A batch: N1 batch, N3 «write batch» (ADR-0094 B9). Extra top-level fields are not read, including key, items, cas, guard of a single write (N2); the elements of writes and guards are closed. The limits BATCH_WRITES and BATCH_GUARDS, a repeated key and a guard on a written key are checks of the door, 400 badrequest; the role console has no count limits, the role domain has no limit on the number of guards (N1), so the schema sets no maxItems."
      unevaluatedProperties: true
      required: [op, writes]
      properties:
        op: {const: batch}
        writes:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/BatchWrite"}
        guards:
          type: array
          items: {$ref: "#/components/schemas/BatchGuard"}
        id: {type: string, pattern: "^(?:[0-9a-f]{1,64})$"}
        not_after: {type: number, minimum: 0}
        not_before: {type: number, minimum: 0}
    BatchWrite:
      type: object
      required: [op, key]
      additionalProperties: false
      properties:
        op: {type: string, enum: [put, delete]}
        key: {$ref: "#/components/schemas/Key"}
        items: {}
        cas: {type: [string, "null"], pattern: "^(?:(?:0|[1-9][0-9]{0,19})?)$"}
      oneOf:
      - properties:
          op: {const: put}
          items: {type: object, additionalProperties: {type: string}}
        required: [items]
      - properties:
          op: {const: delete}
          items: {}    # not read for delete: any JSON value or absence is no refusal
    BatchGuard:
      type: object
      required: [key, index]
      additionalProperties: false
      properties:
        key: {$ref: "#/components/schemas/Key"}
        index: {type: string, pattern: "^(?:(?:0|[1-9][0-9]{0,19})?)$"}
    Written:
      type: object
      required: [index]
      additionalProperties: false
      properties:
        index: {$ref: "#/components/schemas/Version"}
        again: {const: true}
      description: The first application — index, for a batch one version for all rows; a stored replay adds again true.
    Fault:
      description: The closed refusal forms of N4; the specific code of the operation limits the admissible branches.
      oneOf:
      - $ref: "#/components/schemas/BadKeyFault"
      - $ref: "#/components/schemas/BadRequestFault"
      - $ref: "#/components/schemas/ForbiddenFault"
      - $ref: "#/components/schemas/ConflictFault"
      - $ref: "#/components/schemas/BatchConflictFault"
      - $ref: "#/components/schemas/ExpiredFault"
      - $ref: "#/components/schemas/EarlyFault"
      - $ref: "#/components/schemas/GuardFault"
      - $ref: "#/components/schemas/RowTooLargeFault"
      - $ref: "#/components/schemas/BodyTooLargeFault"
      - $ref: "#/components/schemas/UnavailableFault"
      - $ref: "#/components/schemas/AmbiguousFault"
      - $ref: "#/components/schemas/Refused"
    BadKeyFault:
      type: object
      required: [kind, error]
      additionalProperties: false
      properties:
        kind: {const: badkey}
        error: {type: string}
    BadRequestFault:
      type: object
      required: [kind, error]
      additionalProperties: false
      properties:
        kind: {const: badrequest}
        error: {type: string}
    ForbiddenFault:
      type: object
      required: [kind, error]
      additionalProperties: false
      properties:
        kind: {const: forbidden}
        error: {type: string}
    ConflictFault:
      type: object
      required: [kind, error, index]
      additionalProperties: false
      properties:
        kind: {const: conflict}
        error: {type: string}
        index: {$ref: "#/components/schemas/VersionOrAbsent"}
    BatchConflictFault:
      type: object
      required: [kind, error, key, index]
      additionalProperties: false
      properties:
        kind: {const: conflict}
        error: {type: string}
        key: {$ref: "#/components/schemas/Key"}
        index: {$ref: "#/components/schemas/VersionOrAbsent"}
      description: N4, for a batch — the first row in the order of writes whose cas differed; nothing written.
    ExpiredFault:
      type: object
      required: [kind, error]
      additionalProperties: false
      properties:
        kind: {const: expired}
        error: {type: string}
      description: The admission time is later than not_after (N4; ADR-0091 item 1); nothing written.
    EarlyFault:
      type: object
      required: [kind, error]
      additionalProperties: false
      properties:
        kind: {const: early}
        error: {type: string}
      description: The admission time is not later than not_before (N4; ADR-0091 item 1); nothing written.
    GuardFault:
      type: object
      required: [kind, error, key, index]
      additionalProperties: false
      properties:
        kind: {const: guard}
        error: {type: string}
        key: {$ref: "#/components/schemas/Key"}
        index: {$ref: "#/components/schemas/VersionOrAbsent"}
    RowTooLargeFault:
      type: object
      required: [kind, error, key, size, limit]
      additionalProperties: false
      properties:
        kind: {const: toolarge}
        error: {type: string}
        key: {$ref: "#/components/schemas/Key"}
        size: {type: integer, minimum: 1}
        limit: {type: integer, minimum: 0}
      description: key — the key of the row, size — the weight of items, limit — the row ceiling; size larger than limit.
    BodyTooLargeFault:
      type: object
      required: [kind, error, limit]
      additionalProperties: false
      properties:
        kind: {const: toolarge}
        error: {type: string}
        limit: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1}
      description: No key; size, if returned, is the known full size of the body; size larger than limit.
    UnavailableFault:
      type: object
      required: [kind, error]
      additionalProperties: false
      properties:
        kind: {const: unavailable}
        error: {type: string}
    AmbiguousFault:
      type: object
      required: [kind, error]
      additionalProperties: false
      properties:
        kind: {const: ambiguous}
        error: {type: string}
    RightsFile:
      type: object
      additionalProperties: false
      required:
      - roles
      properties:
        comment:
          type: string
          description: An optional stable mark of the generator; does not take part in the evaluation of rights.
        roles:
          type: object
          propertyNames:
            $ref: '#/components/schemas/RoleName'
          additionalProperties:
            $ref: '#/components/schemas/RoleRights'
      description: The loaded configstore-rights.json. Agreement with the generator, groups and readers is a semantic check of N1/N3, not JSON Schema.
    RoleName:
      type: string
      pattern: "^(?:[a-z][a-z0-9_-]{0,63})$"
      not:
        enum:
        - admin
        - configstore
        - configstore-door
    RoleRights:
      type: object
      additionalProperties: false
      required:
      - group
      - read
      - write
      properties:
        group:
          type: string
          minLength: 1
        read:
          type: array
          items:
            type: string
        write:
          type: array
          items:
            type: string
        delete:
          type: array
          items:
            type: string
      description: 'delete absent — an empty list, deleting is not allowed (P/01.2 N1.2); the generator writes delete explicitly for every role. Patterns and negations — N1.2/N1.3.'
    Empty:
      type: object
      required: []
      additionalProperties: false
      properties: {}
    FloorCmd:
      type: object
      required:
      - op
      - floor
      - id
      additionalProperties: false
      properties:
        op:
          const: floor
        floor:
          type: integer
          minimum: 1
          maximum: 9007194959773696
        id:
          type: string
          pattern: "^(?:[0-9a-f]{1,64})$"
    Join:
      type: object
      required:
      - id
      - raft
      - api
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/MemberId'
        raft:
          type: string
          minLength: 1
        api:
          type: string
          minLength: 1
        force:
          type: boolean
    Leave:
      type: object
      required:
      - id
      additionalProperties: false
      properties:
        id:
          anyOf:
          - $ref: '#/components/schemas/MemberId'
          - const: ''
    MemberId:
      type: string
      pattern: "^(?:[A-Za-z0-9][A-Za-z0-9_.-]{0,127})$"
    Refused:
      type: object
      required:
      - kind
      - error
      additionalProperties: false
      properties:
        kind:
          const: refused
        error:
          type: string
    Status:
      type: object
      required:
      - id
      - state
      - leader
      - leader_id
      - term
      - commit
      - applied
      - voters
      - members
      - tls
      - max_value
      - max_body
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/MemberId'
        state:
          enum:
          - Leader
          - Follower
          - Candidate
          - Shutdown
          - Door
        leader:
          type: string
          description: The -api address of the leader, as in members; empty if the leader is unknown or runs without -api.
        leader_id:
          type: string
          description: The id of the leader; empty if the leader is unknown.
        term:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        commit:
          description: 'Raft commit index; box and door use 0 (forms/status-fields.tsv, P/01.3-R169, P/01.3-R211). '
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        applied:
          description: 'Raft applied index; box and door use 0 (forms/status-fields.tsv, P/01.3-R169, P/01.3-R211). '
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        voters:
          type: array
          items:
            $ref: '#/components/schemas/MemberId'
        members:
          type: object
          description: A map id → -api address; a member without -api is not in the map, the map may be empty.
          additionalProperties:
            type: string
            minLength: 1
          propertyNames:
            $ref: '#/components/schemas/MemberId'
        base:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        again:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        tls:
          type: boolean
        max_value:
          type: integer
          minimum: 1
          description: 'This instance’s effective row-weight ceiling in bytes: -max-value (P/01.3 N1.3; row weight P/01.1); distinct from the HTTP body limit -max-body. Acceptance stand: 524288 bytes.'
        max_body:
          type: integer
          minimum: 1
          description: 'This instance’s actual configured -max-body in entity-body bytes, including emitted JSON whitespace/LF and excluding HTTP framing. Required local observation for the static finite profile installation check (ADR-0127 P/06 C2); distinct from max_value. Default acceptance stand: 1048576 bytes.'
        role:
          type: string
        last_snapshot:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        admission_ahead:
          type: number
          exclusiveMinimum: 60
          description: P/01.3 N1.3 admission — by how many seconds the admission time of the last record is ahead of the leader's clock, only beyond 60 s (ADR-0091 item 1); a follower and a door have none.
        out:
          type: array
          items:
            $ref: '#/components/schemas/MemberId'
      allOf:
      - if:
          properties:
            state:
              const: Door
        then:
          required:
          - role
          properties:
            role:
              const: door
            term:
              const: 0
            commit:
              const: 0
            applied:
              const: 0
  responses:
    BodyTooLarge:
      description: The body is larger than the effective -max-body read limit; checked before the route, the method and the identity, whatever the method (chapter 1.1 R034).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BodyTooLargeFault"
    BadKey:
      description: A bad target key or a non-empty guard key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadKeyFault"
    BadRequest:
      description: The request is out of form (N2.1); kind badrequest.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadRequestFault"
    BadRequestOrKey:
      description: A bad form of the request or command, or a key; classification — N2.1 and N4.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: "#/components/schemas/BadRequestFault"
            - $ref: "#/components/schemas/BadKeyFault"
    Forbidden:
      description: The identity is not admitted by P/01.2 N3 «check», or allowed of P/01.2 N1.3 refused the read, write, delete or guard read; list does not require the read right.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenFault"
    Conflict:
      description: The version of the row did not match cas; index — the current version or absence.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConflictFault"
    Guard:
      description: The guard did not match; key and index refer to the guard row.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GuardFault"
    TooLarge:
      description: The row weight or the body limit is exceeded; the fields tell the causes apart.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: "#/components/schemas/RowTooLargeFault"
            - $ref: "#/components/schemas/BodyTooLargeFault"
    Unavailable:
      description: The operation is not done; the wait time of the leader or of the local lock, the connection limit, or the lost version of a row (version_lost, P/01.1 N4).
      headers:
        Retry-After:
          schema: {type: integer, const: 1}
          description: Only at the connection limit of the door (P/01.3 N4); otherwise absent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnavailableFault"
    NoRoute:
      description: No route or no such method on it (N2.1); kind badrequest. Unparseable HTTP is 400 badrequest, not 414, 431, 501 or 505.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadRequestFault"
    UnavailableOrAmbiguous:
      description: The write is not done (including import_held and admin_not_leader of P/01.3 N4), or the outcome is unknown; the kind decides how to repeat.
      headers:
        Retry-After:
          schema: {type: integer}
          description: Only for unavailable. At the connection limit of the door it is exactly 1 (P/01.3-R321); above the replay-processing limit it is the time until admission in seconds, computed by the implementation (P/01.3-R329, replay_limit); otherwise absent.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: "#/components/schemas/UnavailableFault"
            - $ref: "#/components/schemas/AmbiguousFault"
