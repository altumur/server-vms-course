# Семья platform/configstore-doors/<id> — строка двери хранилища без голоса (P/01.3; P/01.3 Н1.3 door). Источник формы
# строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md.
dialect: data-form/1
root:
  type: object
  properties:
    seen_at:
      ref: common.time
      description: стенное время последнего подтверждения двери (раз в 30 с)
  required: [seen_at]
