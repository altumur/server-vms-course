# Семья domain/root — закрепление корня домена у члена (P/08.2; P/08.2 Н1.1 pin). Источник формы строки (ADR-0088).
# Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md. Пишет только admin:
# установка у держателя (P/02.4 Н3 «установка домена») и join у члена (P/09.1), создание-однажды; закрепление не чинится
# само (решение «Архитектора» 2026-10-20, ADR-0083 доп. (14) п. 8). Читает функция keys как pinned (договор набора ключей
# домена «Функция keys»), сторожевая консоли (P/06.3 Н1.8 — след домена), агент и процесс domain.
dialect: data-form/1
root:
  type: object
  properties:
    pub:
      type: string
      pattern: '[0-9a-f]{64}'
      description: hex открытого корня (32 байта Ed25519); обязателен
    domain:
      type: string
      pattern: '[a-z0-9-]{1,64}'
      description: имя домена, 1–64 знака [a-z0-9-]; обязателен
  required: [pub, domain]
