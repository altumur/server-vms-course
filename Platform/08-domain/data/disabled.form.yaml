# Семья domain/disabled — имена выключенных людей у держателя (P/08.4; P/08.4 Н1.1). Источник формы строки (ADR-0088).
# Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md. Пишет процесс
# domain при каждой правке disabled человека и сверкой при старте и каждым проходом (Н3 «дверь людей», абзац обрыва шага 9).
# Секретов нет (ADR-0051). Читают: консоль кластера держателя — вход disabled функции may (договор права), процесс domain,
# консоль домена, агент.
dialect: data-form/1
root:
  type: object
  properties:
    names:
      encoding: jcs
      type: array
      items:
        type: string
        description: имя выключенного человека (ключ его строки domain/users/<имя>)
      unique_items: true
      description: >-
        текст JCS массива имён выключенных по возрастанию в байтах UTF-8, без повторов; нет — "[]"; массив, не строка
        через «,»: имя может нести запятую (решение «Архитектора» по R41-11); порядок — правило писателя, не форма
  required: [names]
