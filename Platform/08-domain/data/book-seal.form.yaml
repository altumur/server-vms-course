# Семья domain/book-seal — ключ приёма книг у держателя (P/08.2; P/08.2 Н1.4). Источник формы строки (ADR-0088).
# Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md. Создаёт установка
# (admin, P/02.4) раньше набора rev 1; меняет процесс domain (смена ключа приёма книг, смена после кражи, перенос —
# P/08.2 Н3, P/08.8); admin — `w2cctl secrets seal` (P/02.4 Н1.9). Секрет — конверт кольца `enc:v2` (договор
# запечатывания; P/06.2 Н1.2); читатель — только domain; без rev.
dialect: data-form/1
root:
  type: object
  properties:
    seed_secret:
      type: string
      description: "hex 32 случайных байт — закрытый скаляр X25519 как есть (RFC 7748 §5: зажим при умножении); book_seal набора = X25519(seed_secret, 9)"
  required: [seed_secret]
