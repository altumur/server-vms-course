# Семья domain/shared — строка указателя общего документа (P/08.9; P/08.9 Н1.2 pointer, Н1.4 holder_self). Источник формы
# строки (ADR-0088). Экземпляр — {key, row}; ключ — точное имя domain/shared. Слова — Platform/common/DIALECT.md.
# Писателей двое (каталог): у держателя — процесс domain, указатель {doc: JCS {term, rev, sha256, object}} (Н1.2 pointer,
# write); у члена — агент, строка копии {doc: JCS {term, rev, sha256}} (сторона агента — глава 9.1; до переноса урока 9 —
# М11/11 Н1.4 member). Протокол строки задаёт держатель (владелец — P/08.9; разбор ревью стадии A 8–10, № 26; план урока 8
# В8). Правила, которые схема не выражает (object — только у держателя и с rev указателя; у кластера держателя строка —
# указатель, Н1.4 holder_self; запись — после объекта, по CAS), — проза Н1.2 и Н1.4.
dialect: data-form/1
root:
  type: object
  properties:
    doc:
      encoding: jcs
      type: object
      description: "текст JCS указателя (у держателя) или строки копии (у члена)"
      properties:
        term:
          ref: common.pos53
          description: "срок держателя документа (глава 8.8, из М11/10 Н1.1); порядок — (term, rev), term старше"
        rev:
          ref: common.pos53
          description: номер правки документа
        sha256:
          ref: common.sha256_hex
          description: hex sha256 текста объекта документа
        object:
          type: string
          pattern: 'domain/shared-docs/rev-[1-9][0-9]*'
          description: "ключ объекта документа — строка `domain/shared-docs/rev-<rev>` с rev указателя; только у указателя держателя, у строки копии члена поля нет (Н1.2 pointer; разбор ревью стадии A 8–10, № 26)"
      required: [term, rev, sha256]
  required: [doc]
