# Семья domain/signer — ключи держателя (P/08.2; P/08.2 Н1.3). Источник формы строки (ADR-0088). Экземпляр — {key, row};
# ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md. Создаёт установка (admin, P/02.4), меняет
# процесс domain (плановая смена ключа токенов, перенос и передача — P/08.2 Н3, P/08.8), admin — `w2cctl secrets seal`
# (P/02.4 Н1.9). Секреты по суффиксу `_secret` — конверты кольца `enc:v2` (договор запечатывания; P/06.2 Н1.2). Смещённый
# держатель заменяет строку на {forgotten} (P/08.8 Н1.6). Читатель — только domain (P/02.5 Н1.3 platform_readers).
dialect: data-form/1
root:
  type: object
  properties:
    kid:
      type: string
      not_enum: ['']
      writer: {pattern: '[0-9a-f]{8}'}
      description: kid ключа токенов — current набора (договор набора ключей домена writer_forms)
    token_key_secret:
      type: string
      description: hex 32 байт — зерно Ed25519 ключа токенов (current набора); конверт кольца
    serial:
      type: string
      not_enum: ['']
      writer: {pattern: '[0-9a-f]{16}'}
      description: serial выпускающего — тот, что в issuing набора (writer_forms)
    issuing_key_secret:
      type: string
      description: hex 32 байт — зерно Ed25519 выпускающего (применение — P/08.8); конверт кольца
    backup_key_secret:
      type: string
      description: hex 32 байт — ключ резервной копии (P/08.8 Н1.5, HMAC-SHA256 от зерна корня); пишет установка и перенос; конверт кольца
    backup_key_rev:
      ref: common.pos53
      description: целое ≥ 1, при установке 1
    forgotten:
      type: string
      writer: {pattern: 'deposed by term [1-9][0-9]*'}
      description: "смещённый держатель заменяет строку на {forgotten: \"deposed by term N\"} (P/08.8 Н1.6)"
  rules:
    - when: {present: [forgotten]}
      forbid: [kid, token_key_secret, serial, issuing_key_secret, backup_key_secret, backup_key_rev]
    - when: {absent: [forgotten]}
      require: [kid, token_key_secret, serial, issuing_key_secret, backup_key_secret, backup_key_rev]
