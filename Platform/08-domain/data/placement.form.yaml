# Семья domain/placement — счётчик назначений держателя (P/08.6; P/08.6 Н1.1, Н3 «записать назначение»). Источник формы
# строки (ADR-0088 п. 8). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md.
# Пишет только процесс domain: +1 на каждую запись и удаление назначения, CAS (шаг 4, до 8 попыток), и +1 при старте до
# первого ответа агенту (Н3); строки нет — счётчика нет (rev 0, Н1.2 absent).
dialect: data-form/1
root:
  type: object
  properties:
    rev:
      ref: common.pos53
      description: счётчик domain/placement — rev последней записи или удаления назначения (Н1.1); ответ агенту несёт его в carry.placement.rev (Н1.2)
  required: [rev]
