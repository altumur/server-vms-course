# Семья domain/signer-turn — очередь процесса domain у кластера держателя (P/08.10; P/08.10 Н1.7 turn, release,
# Н3 «очередь процесса domain»). Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки
# key каталога. Слова — Platform/common/DIALECT.md.
dialect: data-form/1
root:
  type: object
  properties:
    holder:
      type: string
      description: "экземпляр активного процесса domain `<коробка>:<pid>:<6 hex>` (форма экземпляра — договор экземпляра common/contracts/instance.md) или \"\" — очередь отдана по SIGTERM (Н1.7 release)"
  required: [holder]
