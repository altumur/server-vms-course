# Семья domain/break-glass/<кластер> — аварийная учётка кластера (P/08.4; P/08.4 Н1.6). Источник формы строки (ADR-0088).
# Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md. У держателя пишет
# процесс domain (PUT /domain/break-glass/<кластер> и своя строка кластера держателя); у члена — агент, копия своей строки
# из ответа держателя (сторона агента — P/09.1 Н1.4 break_glass); admin — `w2cctl secrets seal` (P/02.4 Н1.9). Секрет по суффиксу
# `_secret` — конверт кольца `enc:v2` (договор запечатывания): у держателя — кольцом держателя, у члена — его кольцом.
# Сверка хеша и сессия — консоль кластера (OpenAPI урока 6, POST /session/break-glass).
dialect: data-form/1
root:
  type: object
  properties:
    pwhash_secret:
      type: string
      description: >-
        та же форма, что pwhash_secret строки человека (Н1.1): pbkdf2-sha256$600000$<соль: 32 hex>$<ключ: 64 hex> от
        аварийного пароля (≥ GLASS_MIN); в строке — конверт кольца, форма хеша — у открытого
    set_at:
      ref: common.time
      description: "стенные секунды установки пароля (GET /domain/break-glass — {clusters: {<кластер>: {set_at}}})"
  required: [pwhash_secret, set_at]
