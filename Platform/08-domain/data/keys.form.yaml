# Семья domain/keys — набор ключей домена, подписанный корнем (P/08.2; договор набора ключей домена «Набор `domain/keys`»).
# Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова —
# Platform/common/DIALECT.md. Форма — строки row, doc, writer_forms договора common/contracts/keys.md (В10 плана переноса
# урока 8: семья строится по форме договора, колонка norm — договор). Создаёт установка (admin, P/02.4), меняет процесс
# domain держателя (смены P/08.2 Н3), у члена — агент после функции keys (P/09.1). Чего форма не выражает — ∈ и ∉ между
# полями, непустота keys, точка малого порядка book_seal, kid = "root", подпись — проверяет функция keys договора (шаги 2–6).
dialect: data-form/1
root:
  type: object
  properties:
    doc:
      encoding: json
      type: object
      description: >-
        текст JSON документа набора; ровно один элемент строки; закрытый набор полей — лишнее поле: not_a_set; массивы —
        без значения порядка, повтор элемента допустим; писатель кладёт массивы по возрастанию
      properties:
        domain:
          type: string
          pattern: '[a-z0-9-]{1,64}'
          description: имя домена, 1–64 знака [a-z0-9-] (P/08.2 Н1.1)
        rev:
          ref: common.pos53
          description: ревизия набора, целое 1 … 2^53 − 1; только вперёд (договор only_forward; rev писателя — P/08.2 Н1.2)
        root:
          type: string
          pattern: '[0-9a-f]{64}'
          description: hex открытого корня (32 байта Ed25519)
        current:
          type: string
          not_enum: ['']
          writer: {pattern: '[0-9a-f]{8}'}
          description: "kid ключа токенов, которым держатель подписывает сейчас; ∈ keys; ∉ until (писатель: первые 8 знаков hex открытого ключа)"
        keys:
          type: object
          properties: {}
          names:
            key:
              type: string
              not_enum: ['']
              writer: {pattern: '[0-9a-f]{8}'}
              description: "kid — непустая строка (писатель: первые 8 знаков hex открытого ключа токенов, writer_forms)"
            value:
              type: string
              pattern: '[0-9a-f]{64}'
              description: hex открытого ключа токенов Ed25519 (32 байта)
          description: "`{<kid>: <hex открытого ключа токенов>}`, не пусто"
        until:
          type: object
          properties: {}
          names:
            key:
              type: string
              not_enum: ['']
              description: "kid ∈ keys"
            value:
              ref: common.time
              description: стенные секунды — ключ ещё принимается до этого момента включительно
          description: "`{<kid>: <стенные секунды>}` — срок прежних ключей токенов; нет — у ключей срока нет"
        issuing:
          type: array
          items:
            type: string
            not_enum: ['']
            writer: {pattern: '[0-9a-f]{16}'}
            description: "serial — непустая строка (писатель: первые 16 знаков hex открытого ключа выпускающего)"
          description: ключи выпускающего держателя (P/08.8); пустой массив допустим (непустота названа только у keys)
        revoked_issuing:
          type: array
          items:
            type: string
            not_enum: ['']
            description: serial отозванного выпускающего
          description: отозванные ключи выпускающего; всегда массив, может быть пустым
        revoked_members:
          type: array
          items:
            type: string
            pattern: '[0-9a-f]{64}'
            description: hex открытого ключа члена
          description: отозванные ключи членов (приём и подпись члена сверяются с ним — P/08.3); нет — пусто
        book_seal:
          type: string
          pattern: '[0-9a-f]{64}'
          description: >-
            hex открытого ключа приёма книг X25519 (P/08.2 Н1.4); обязателен; точка малого порядка — набор не читается
            (функция keys шаг 6 — no_book_seal, не not_a_set; добавлено сверкой М11, S1)
        kid:
          type: string
          writer: {enum: [root]}
          description: "\"root\"; иное — функция keys шаг 3 (bad_signature), не форма"
        sig:
          type: string
          writer: {pattern: '[A-Za-z0-9_-]{85}[AQgw]'}
          description: >-
            base64url без = подписи Ed25519 корня над UTF-8(JCS(doc без kid и sig)), 64 байта; не base64url или не 64
            байта — функция keys шаг 5 (bad_signature), не форма
      required: [domain, rev, root, current, keys, issuing, revoked_issuing, book_seal, kid, sig]
  required: [doc]
