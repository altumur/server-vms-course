# Семья domain/keepers/<член> — указатель выбранного хранителя на резервную копию (P/08.8 Н1.5 keepers). Источник формы
# строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md.
# Пишет процесс domain держателя (put — выбранному хранителю, delete — невыбранному). Форма пары {term, rev, sha256} общая
# со строкой domain/backup-taken хранителя (семья агента, глава P/09.1): обе ссылаются на common.domain_backup_pointer
# (решение «Архитектора» по планам переноса 8–10, ADR-0083 доп. (14) п. 3). Что указатель называет последнюю резервную
# копию и sha256 — её JCS, форма не выражает (проза Н1.5).
dialect: data-form/1
root:
  ref: common.domain_backup_pointer
  description: "указатель выбранного хранителя {term, rev, sha256} у держателя (Н1.5 keepers); его несёт ответ агенту — carry (P/08.3 Н1.5)"
