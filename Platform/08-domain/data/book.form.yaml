# Семья domain/<sub>/<manifest:domain.books>/<член> — строка книги у держателя для получателя <член> (P/08.5; P/08.5 Н1.3
# result). Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога: <sub> —
# подсистема каталога, <книга> — имя книги domain.books её манифеста байт в байт (собираемой или переносимой), <член> — член
# списка. Слова — Platform/common/DIALECT.md. Пишет процесс domain проходом держателя (собираемая книга, Н3 «сборка
# книги», только при изменении открытого содержимого, страж domain/signer-turn) и воркер подсистемы на домене
# (переносимая книга, P/03.7 Н1.6 carried_book); строки бывших членов удаляет процесс domain. Форма элементов —
# common.book_row: та же у копии книги члена domain/<sub>/<manifest:domain.books>, которую пишет агент (семья урока P/09;
# решение «Архитектора» 2026-10-20 по планам 8–10, п. 3). Порядок entries и missing, «только получатели из to», «ключ
# только с элементами» — правила Н1.3, не форма.
dialect: data-form/1
root:
  ref: common.book_row
  description: строка книги получателя у держателя; секреты value — конверты кольца держателя (Н1.3 at_rest)
