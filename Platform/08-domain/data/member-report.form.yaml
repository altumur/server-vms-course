# Семья domain/members/<член>/reports/<rev> — целое поколение члена у держателя (P/08.3; P/08.3 Н1.3 generation, whole;
# договор приёма отчёта, шаг 7). Источник формы объекта (ADR-0088). Экземпляр — {key, object}; ключ — грамматика колонки
# key каталога. Слова — Platform/common/DIALECT.md. Объект — JCS(whole') (проверка урока, не формы); пишет процесс domain
# одним приёмом, объект не выше метки неизменяем (Н1.3).
dialect: data-form/1
defs:
  root_fingerprint:
    type: string
    pattern: '[0-9a-f]{16}'
    description: отпечаток корня domain/root члена (P/08.2 Н1.1)
  outcome:
    type: object
    opaque: true
    description: исход правки домена у члена — форма М11/6 Н1.5 (глава 9.1)
root:
  type: object
  properties:
    sent_at:
      type: number
      description: sent_at публикации, создавшей поколение (стенные секунды агента, как пришло)
    objects:
      type: object
      opaque: true
      description: все объекты члена после применения изменения — только member_objects (М11/3 Н1.2); ключ — ключ объекта, значение — JSON объекта
    key:
      ref: common.domain_member_key
      description: ключ члена из публикации
    keys_rev:
      ref: common.pos53
      description: rev набора domain/keys, который член держит; нет — набора нет
    pinned:
      ref: root_fingerprint
      description: отпечаток domain/root члена; нет — не закреплён
    outcomes:
      type: object
      names:
        key:
          type: string
          not_enum: ['']
        value:
          ref: outcome
      description: исходы правок домена (М11/6 Н1.5); нет поля — исходов нет
  required: [sent_at, objects, key]
