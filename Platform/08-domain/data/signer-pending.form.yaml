# Семья domain/signer-pending — подготовленный ключ X25519 плановой передачи у цели (P/08.2; P/08.2 Н1.3, P/08.8 Н1.7).
# Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова —
# Platform/common/DIALECT.md. Пишет процесс domain цели передачи; admin — `w2cctl secrets seal` (P/02.4 Н1.9). Секрет —
# конверт кольца `enc:v2` (договор запечатывания; P/06.2 Н1.2); одно имя seed_secret с domain/member-key, domain/book-seal.
dialect: data-form/1
root:
  type: object
  properties:
    seed_secret:
      type: string
      description: hex 32 случайных байт — закрытый скаляр X25519; конверт кольца
  required: [seed_secret]
