# Семья domain/shadow — теневой отчёт последнего прохода, объект держателя (P/08.1; P/08.1 Н1.6 report). Источник
# формы объекта (ADR-0088 п. 8). Экземпляр — {key, object}; ключ — грамматика колонки key каталога. Слова —
# Platform/common/DIALECT.md. Правила, которые схема не выражает (counts — число находок каждого вида; порядок findings —
# findings_order; cluster и worker — по зерну вида grain; may_write — exit), — проза Н1.6.
dialect: data-form/1
defs:
  count:
    ref: common.uint53
    description: число находок вида
root:
  type: object
  properties:
    counts:
      type: object
      description: по виду Н1.6 kinds и unknown
      properties:
        lagging: {ref: count}
        stalled: {ref: count}
        orphaned: {ref: count}
        unmanaged: {ref: count}
        conflict: {ref: count}
        stale_epoch: {ref: count}
        unknown: {ref: count}
      required: [lagging, stalled, orphaned, unmanaged, conflict, stale_epoch, unknown]
    findings:
      type: array
      description: по порядку видов в counts, затем (sub, ref, cluster, worker) в байтах UTF-8 (Н1.6 findings_order)
      items:
        type: object
        properties:
          kind: {type: string, enum: [lagging, stalled, orphaned, unmanaged, conflict, stale_epoch, unknown]}
          sub: {ref: common.sub_name}
          ref: {type: string, description: "ref единицы (Н1.2)"}
          cluster: {type: string, pattern: '[a-z0-9-]{1,64}', description: "член по зерну вида (Н1.6 grain)"}
          worker: {type: string, description: "воркер заявки (Н1.6 grain)"}
          detail: {type: string, not_enum: [''], description: "слова; у unknown — состояние члена или «not a member»"}
        required: [kind, sub, ref, detail]
    clean_streak: {ref: common.uint53, description: "проходов подряд без находок (Н1.6 SHADOW_CLEAN)"}
    may_write: {type: boolean, description: "Н1.6 exit"}
    why: {type: string, not_enum: [''], description: "почему may_write такое"}
  required: [counts, findings, clean_streak, may_write, why]
