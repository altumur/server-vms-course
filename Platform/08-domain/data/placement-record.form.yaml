# Семья domain/placement/<sub>/<ref> — запись назначения у держателя (P/08.6; P/08.6 Н1.1). Источник формы строки
# (ADR-0088 п. 8). Экземпляр — {key, row}; ключ — грамматика колонки key каталога (ref — остаток после <sub>/ байт в байт,
# по грамматике имени P/06.1 Н1.3 named). Слова — Platform/common/DIALECT.md. Форма общая с копией у члена
# domain/placed/<sub>/<ref> (P/09.1) — определение common.domain_placement (решение «Архитектора» по планам переноса 8–10,
# п. 3). Правила, которые схема не выражает (copies по возрастанию и без cluster; имена — члены списка; rev записи не
# больше счётчика domain/placement), — проза Н1.1 и Н3.
dialect: data-form/1
root:
  ref: common.domain_placement
  description: запись назначения — исполнитель единицы, копии, источник, причина, время и rev счётчика (Н1.1)
