# Семья domain/backups/rev-<rev> — подписанный документ резервной копии у держателя (P/08.8 Н1.5 document). Источник формы
# объекта (ADR-0088 п. 8). Экземпляр — {key, object}; ключ — грамматика колонки key каталога. Слова —
# Platform/common/DIALECT.md. Форма документа общая с копией хранителя — объектом domain/backup у члена (семья агента,
# глава P/09.1): обе семьи ссылаются на common.domain_backup_doc (решение «Архитектора» по планам переноса 8–10, ADR-0083
# доп. (14) п. 3). Текст объекта — JCS; подпись, sha256 указателя и ответ агенту — по исходным байтам (DIALECT § 8). Пишет
# процесс domain держателя (put без стража — действует через указатель domain/keepers/*; хранятся последние 5). Правила,
# которые схема не выражает (rev ключа равен rev документа, rev растёт только при смене содержимого, состав state и
# objects, секреты — конверт ключа резервной копии), — проза Н1.5; подпись — функция record (вид «документ резервной
# копии», договор записи срока).
dialect: data-form/1
root:
  ref: common.domain_backup_doc
  description: "подписанный документ резервной копии держателя (Н1.5 document); его объект у хранителя — domain/backup"
