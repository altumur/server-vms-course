# Семья domain/shared-docs/rev-<rev> — объект общего документа у держателя (P/08.9; P/08.9 Н1.2 document). Источник формы
# объекта (ADR-0088 п. 8). Экземпляр — {key, object}; ключ — грамматика колонки key каталога. Слова —
# Platform/common/DIALECT.md. Форма документа общая с копией агента — объектом domain/shared у члена (глава 9.1): обе семьи
# ссылаются на common.shared_doc (решение «Архитектора» по планам переноса 8–10, ADR-0083 доп. (14) п. 3). Текст объекта —
# JCS; подпись, sha256 указателя и ответ агенту — по исходным байтам (DIALECT § 8). Правила, которые схема не выражает
# (rev ключа равен rev документа, хранятся последние 5, объект ревизии не перезаписывается чужими байтами, переподпись после
# переноса), — проза Н1.2.
dialect: data-form/1
root:
  ref: common.shared_doc
  description: "подписанный общий документ держателя; пишет процесс domain раньше указателя domain/shared (Н1.2 write)"
