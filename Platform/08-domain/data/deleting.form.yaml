# Семья domain/deleting/<имя> — метка удаления человека у держателя (P/08.4; P/08.4 Н1.1 domain/deleting, Н3 «дверь
# людей» шаг 9 и сверка). Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key
# каталога. Слова — Platform/common/DIALECT.md. Пишет и снимает процесс domain под стражем domain/signer-turn; писатель
# пишет пустую строку {}. Метка — любая строка под domain/deleting/, что бы ни лежало в items (добавлено сверкой М11, P1):
# читатель полей не проверяет. <имя> не по грамматике Н1.1 — сверка удаляет метку (исход ниже).
dialect: data-form/1
root:
  type: object
  properties: {}
  names:
    key: {type: string}
    value: {type: any, description: "поля метки: читатель их не читает и ими не отказывает; писатель пишет {} (Н1.1 domain/deleting)"}
  writer: {max_items: 0}
