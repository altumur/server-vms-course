# Семья domain/revoked — отзывы токенов домена (P/08.2; договор набора ключей домена «Отзывы `domain/revoked`»).
# Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова —
# Platform/common/DIALECT.md. Форма — блок domain/revoked договора common/contracts/keys.md (В10 плана переноса урока 8;
# колонка norm — договор). Пишет процесс domain держателя (отзыв, каждый проход; prune), у члена — агент объединением
# ответа держателя со своей строкой (merge, P/09.1). Порядок записей (по возрастанию jti в байтах), снятие prune и
# конечность exp форма не выражает: конечность проверяет функция token (договор токена домена «Проверка» шаг 1).
dialect: data-form/1
root:
  type: object
  properties:
    jtis:
      type: string
      pattern: '([A-Za-z0-9_-]{1,64}:-?(0|[1-9][0-9]*)(\.[0-9]+)?([eE][+-]?[0-9]+)?(,[A-Za-z0-9_-]{1,64}:-?(0|[1-9][0-9]*)(\.[0-9]+)?([eE][+-]?[0-9]+)?)*)?'
      description: >-
        `"<jti>:<exp>,…"` — jti по грамматике токена (1–64 [A-Za-z0-9_-]), exp — число JSON без пробелов, конечное, exp
        отозванного токена; пусто — ""; повтор jti и порядок читатель не проверяет; писатель — по возрастанию jti в байтах
  required: [jtis]
