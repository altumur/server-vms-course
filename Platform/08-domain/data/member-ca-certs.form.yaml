# Семья domain/members/<член>/ca-certs — сертификаты центров члена у держателя (P/08.3; P/08.3 Н1.6 ca-certs, on_accept,
# admin). Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова —
# Platform/common/DIALECT.md. Пишет процесс domain до Entry.ca (put), удаляет дверь admin при ca []; члену не доставляется.
dialect: data-form/1
root:
  type: object
  properties:
    certs:
      encoding: jcs
      type: array
      items:
        type: string
        not_enum: ['']
        description: PEM — ровно один блок CERTIFICATE центра (CA:true); sha256(DER) — отпечаток Entry.ca на том же месте (проверка урока, не формы)
      min_items: 1
      max_items: 2
      description: текст JCS `[<PEM>…]` — сертификаты центров члена в порядке его Entry.ca
  required: [certs]
