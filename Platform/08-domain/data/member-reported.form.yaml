# Семья domain/members/<член>/reported — метка, единственная граница принятого (P/08.3; P/08.3 Н1.3 reported; договор
# приёма отчёта, шаги 6, 7). Источник формы объекта (ADR-0088). Экземпляр — {key, object}; ключ — грамматика колонки key
# каталога. Слова — Platform/common/DIALECT.md. Две части: поля поколения пишет только generation, поля последнего
# принятого запроса — каждый приём с записью метки. Набор полей закрыт (форма метки — строго, договор приёма отчёта
# «Векторы»: stale есть всегда; signature необязательна и у метки без via).
dialect: data-form/1
defs:
  root_fingerprint:
    type: string
    pattern: '[0-9a-f]{16}'
    description: отпечаток корня domain/root члена (P/08.2 Н1.1)
  failures:
    type: integer
    minimum: 1
    description: n ≥ 1 — запросы, которые агент с запуска не отправил, потому что не смог подписать
root:
  type: object
  properties:
    rev:
      ref: common.pos53
      description: номер поколения; выдаёт держатель, +1 на принятое изменение
    sha256:
      ref: common.sha256_hex
      description: sha256 байтов generation
    base:
      ref: common.uint53
      description: rev, против которого пришло изменение; 0 — пришло целое
    delta_sha256:
      ref: common.sha256_hex
      description: sha256 байтов delta (при base 0 — тела целого, как пришло)
    signature:
      type: string
      description: заголовок X-Agent-Signature прямого отчёта, создавшего поколение, как пришёл; через ретранслятор поля нет
    key:
      ref: common.domain_member_key
    keys_rev:
      ref: common.pos53
    pinned:
      ref: root_fingerprint
    sent_at:
      type: number
      description: sent_at публикации последнего принятого запроса, как пришёл (P/01.1 Н0 «Время в строке» — по своей норме)
    received_at:
      ref: common.time
      description: стенные секунды держателя приёма
    request_sha256:
      ref: common.sha256_hex
      description: sha256 байтов тела этого запроса, как пришло; повтор узнаётся по (sent_at, request_sha256)
    via:
      ref: common.domain_member
      description: ретранслятор дороги последнего запроса (Н1.3а); нет — прямо
    stale:
      type: array
      items:
        type: string
      writer:
        unique_items: true
      description: из публикации при каждом приёме; нет в публикации — []
    sign_failures:
      type: object
      properties:
        domain:
          ref: failures
        console:
          ref: failures
      rules:
        - when: {}
          any_of: [domain, console]
      description: из публикации при каждом приёме с записью метки; нет в публикации — поля нет (Н1.6а)
  required: [rev, sha256, base, delta_sha256, key, sent_at, received_at, request_sha256, stale]
