# Семья domain/users/<имя> — строка человека у держателя (P/08.4; P/08.4 Н1.1). Источник формы строки (ADR-0088).
# Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md. Пишет процесс
# domain (POST, PUT, DELETE /domain/users… — Н3 «дверь людей»; команда first-admin — Н1.9), admin — `w2cctl secrets seal`
# (P/02.4 Н1.9). Секрет по суффиксу `_secret` — конверт кольца держателя `enc:v2` (договор запечатывания; P/02.1 Н1.3а).
# Читатель — только domain. name ≠ <имя> ключа — строка не читается (Н1.1 unreadable): равенство поля и ключа — правило
# строки, не форма.
dialect: data-form/1
root:
  type: object
  properties:
    name:
      ref: common.person_name
      description: имя человека — то же, что <имя> ключа; не субъект индекса имён (проверка двери, глава 8.5 Н1.7)
    how:
      type: string
      enum: [password]
      description: '"password" — иных способов входа урок не нормирует'
    pwhash_secret:
      type: string
      description: >-
        pbkdf2-sha256$600000$<соль: 32 hex>$<ключ: 64 hex> — PBKDF2-HMAC-SHA256 от UTF-8 пароля, соль — 16 случайных байт,
        ключ — 32 байта; секрет по суффиксу (P/02.1 Н1.3а) — в строке конверт кольца держателя, форма хеша — у открытого
    disabled:
      type: boolean
      description: выключен ли человек; каждая правка — затем domain/disabled (Н3 «дверь людей» шаг 9)
    at:
      ref: common.time
      description: стенные секунды последней правки
    by:
      type: string
      description: имя человека последней правки (доказанное сторожевой); у first-admin — сам заводимый
  required: [name, how, pwhash_secret, disabled, at, by]
