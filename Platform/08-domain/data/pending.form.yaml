# Семья domain/pending/<член> — ждущие правки члена у держателя (P/08.6; P/08.6 Н1.4). Источник формы строки (ADR-0088
# п. 8). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md. Элемент seq —
# счётчик приёмов, прочие элементы — правки e-…, каждая — текст JSON (KEPT_LIMIT 50 считает только их). Правила, которые
# схема не выражает (id равен имени элемента и sha256 члена и ключа; seq правки — значение seq строки при приёме; base по
# ждущим того же path; asked.path нормализован; at после исхода того же id — nextafter его kept_at), — проза Н1.4 и Н3
# «принять правку». Пишет только процесс domain по CAS строки (приём и снятие исполненной).
dialect: data-form/1
root:
  type: object
  properties:
    seq:
      ref: common.pos53
      description: номер последнего приёма; +1 при каждом приёме под тем же CAS, что правка (Н1.4 seq); не правка
  names:
    key:
      type: string
      pattern: 'e-[0-9a-f]{12}'
      description: id правки — "e-" + первые 12 знаков hex sha256(UTF-8(член) ‖ 0x00 ‖ UTF-8(Idempotency-Key)) (Н1.4 id)
    value:
      ref: edit
  required: [seq]
  writer: {max_items: 50}
defs:
  edit:
    encoding: json
    type: object
    properties:
      id:
        type: string
        pattern: 'e-[0-9a-f]{12}'
        description: id правки; равен имени элемента (Н1.4 id)
      seq:
        ref: common.pos53
        description: номер приёма — значение элемента seq строки после +1 при приёме; порядок ждущих правок члена (Н1.4 seq)
      what:
        type: string
        description: имена полей тела по возрастанию через «,», у POST — с полем domain.ref, без cluster; DELETE — ""
      method:
        type: string
        enum: [POST, PUT, DELETE]
        description: метод двери единиц консоли члена
      path:
        type: string
        description: путь двери единиц консоли члена — `/<sub>/<rows>` или `/<sub>/<rows>/<id>` (id — местный id единицы из копии члена)
      body:
        type: object
        opaque: true
        description: объект полей; DELETE — {}
      key:
        type: string
        description: Idempotency-Key запроса
      at:
        ref: common.time
        description: стенные секунды процесса domain; после исхода того же id — не меньше nextafter его kept_at (Н1.4 at)
      base:
        type: integer
        minimum: 1
        description: revision единицы в копии члена при приёме (PUT, DELETE) или base ждущей PUT того же path + 1; у POST нет; нет — правка идёт без If-Match (Н1.4 base)
      asked:
        type: object
        properties:
          method:
            type: string
            enum: [POST, PUT, DELETE]
            description: метод двери домена
          path:
            type: string
            description: путь двери домена, нормализован — PUT, DELETE `/domain/<sub>/<rows>/<ref>?cluster=<член найденный>`; POST `/domain/<sub>/<rows>` без query (Н1.4 asked)
          body:
            type: object
            opaque: true
            description: тело запроса двери домена, у POST — с cluster
        required: [method, path, body]
        description: запрос двери домена, как его принял процесс; по нему правку повторяют у нового держателя (глава 8.8 Н1.6 apply)
    required: [id, seq, what, method, path, body, key, at, asked]
    description: хранимая правка {id, seq, what, method, path, body, key, at, base?, asked} — текст JSON (Н1.4 edit)
