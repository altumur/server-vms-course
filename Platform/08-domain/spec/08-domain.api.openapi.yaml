      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - $ref: '#/components/parameters/XW2CClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: true
