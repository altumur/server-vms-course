# P/08 — двери процесса domain (SIGNER_URL): HTTP-контракт (одна дверь процесса — один контракт урока; план переноса
# урока 8 § 4). Главы ссылаются на свои пути (описание каждого пути называет главу): 8.3 — /api/member/{member},
# /api/carry/{member}, /api/relay/{relay}, /domain/members, /domain/members/{name}, /domain/members/{member}/ca,
# /domain/topology; 8.4 — /api/login, /domain/users, /domain/users/{name}, /domain/grants/{cluster}, /domain/break-glass,
# /domain/break-glass/{cluster}, /domain/revoke; 8.6 — /domain/placement/{sub}/{ref}, /domain/{sub}/{rows},
# /domain/{sub}/{rows}/{ref}; 8.7 — /api/tokens/{member}/{sub}/{kind}; 8.8 — /api/prepare, /api/take, /domain/move,
# /domain/handover, /domain/stranded/apply; 8.9 — /domain/shared. Своих путей у глав 8.0, 8.1, 8.2, 8.5, 8.10 нет: 8.0 —
# параметр X-W2C-Client и ответы deposed, frozen, standby; 8.1 — схемы вида и теневого отчёта (их отдаёт консоль домена,
# урок P/10 ссылается $ref), вход и вывод команды view; 8.10 — 409 и 413 потолков у путей 8.3, 503 standby у каждой двери.
# Свои двери процесса (класс signed: /api/member, /api/carry, /api/relay, /api/tokens) — 4 операции; двери, которые процессу
# передают, — 24 и 2 HEAD (консоль домена — 21 и HEAD у GET /domain/users, /domain/break-glass; консоль кластера — 3:
# /api/prepare, /api/take, POST /domain/move; глава 8.0 Н2; разбор ревью стадии B 8–10, № 22: М-6); у каждой операции — operationId: OpenAPI урока 10 ссылается на ответы этих операций (решение
# «Архитектора» 2026-10-20 по планам 8–10, п. 9). Контракт несёт только коды процесса (переход 3 договора пересылки
# Platform/common/contracts/forwarding.md «Отказы по переходам»; разбор ревью стадии A 8–10, решение 3): коды Н3 дверей,
# 401/403 своей проверки личности и гранта (глава 8.4 Н1.5), 409 deposed (глава 8.8), 503 frozen (глава 8.8) и standby
# (глава 8.10); коды переходов 1 и 2 (пересылка консоли кластера, приём и передача консоли домена: 404, 502, 400/408/413
# чтения тела, сторожевая консоли) — OpenAPI 06 (глава 6.7) и 10, здесь не перечисляются; ответа Forwarded нет.
# Слито из контрактов М11/1, М11/3, М11/4, М11/6, М11/7, М11/8, М11/9, М11/10, М11/11 (стороны процесса domain) — стадия B,
# без изменения поведения; контракт приведён к нормам глав (сверка контракта с нормами P/08, перенос урока 8): Publication —
# поля вне дельты не строже 8.3 Н1.2 out_of_delta; MembersDoc — с term (8.3 Н1.1; форма строки, не ответ двери),
# MembersAnswer {rev, members} — ответ 200 дверей членов 8.3 Н2 (дополнение «Архитектора» к № 8 разбора ревью стадии B 8–10),
# MembersView — без обязательного term (P/10 Н2; разбор ревью стадии B 8–10, № 8); у дверей людей (8.4 Н2) 413 и 503
# standby/unavailable — коды процесса; у дверей правок — 503 frozen (8.8 Н1.7), у GET дверей людей — 503 standby (8.0 Н2);
# TopologyEdit.centre — "" и null снимают центр (8.3 Н1.2); Entry.how — три формы 8.3 Н1.1; HolderRecord — url непустой,
# ca без повторов (договор записи срока, функция record шаг 1); PersonName — пробельные по Unicode White_Space, не \s
# ECMA-262. Generation и Mark не перенесены: объекты хранилища, их формы — семьи member-report, member-reported (ADR-0088).
# PeerInput и PeerOutput — договор peer (P/09); пути вида, списка, топологии, назначений, грантов и общего документа на
# чтение отвечает консоль домена сама — урок P/10 (схемы их ответов — здесь, P/10 ссылается $ref).
openapi: 3.1.0
info:
  title: P/08 — двери процесса domain
  version: '1'
  description: 'Канон — нормы глав 08.0…08.10-domain.norms.md; сводная таблица дверей процесса — глава 8.0 Н2. Разбор запроса
    — P/01.1 Н2.1 с отступлениями P/06.5 Н2. Двери /api/member, /api/carry, /api/relay, /api/tokens — класс signed (подпись
    агента, договор подписи агента; серверная сторона — договор сертификата роли); /api/prepare, /api/take, /domain/move
    процессу передаёт консоль кластера (пересылка подписанту), прочие /domain/* и /api/login — консоль домена (глава 8.0
    Н1.8 pass; список дверей домена — договор пересылки). Процесс проверяет личность и грант сам (глава 8.4 Н1.5). View,
    ServedView, Unit, ShadowReport, MembersView, Topology, Placement, SharedDoc, Delivery — P/08.1 Н1.4, Н1.6 и формы глав
    (отдаёт консоль домена, урок P/10). ViewInput и ViewOutput — вход и вывод команды view (P/08.1 Н5, vectors/view);
    MayInput, MayUnit, MayOutput — вход и вывод функции may (договор права may.md, P/08.4 Н1.4) — не HTTP. Внутренний API не
    нормируется; контракт не утверждает, что какая-либо реализация ему проверена.'
servers:
  - url: '{origin}'
    description: Дверь процесса domain (SIGNER_URL, P/02.4 P/02.4-13).
    variables:
      origin: {default: 'http://localhost:8445', description: 'Origin без завершающего /; пример адреса (стенд одной машины), не настройка.'}
paths:
  /api/member/{member}:
    description: 'Глава 8.3 (08.3-domain.norms.md) Н2, Н1.5, договор приёма отчёта; 413 whole too large — глава 8.10 Н1.5.'
    parameters:
      - $ref: '#/components/parameters/Member'
    post:
      operationId: memberReport
      summary: Отчёт агента члена — поколение или «слышал»; ответ — то, что агент уносит домой
      parameters:
        - $ref: '#/components/parameters/AgentSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Publication'
      responses:
        '408': {$ref: '#/components/responses/BodyRefused'}
        '200':
          description: Принято (поколение, «слышал» или тот же отчёт снова)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carry'
        '400':
          $ref: '#/components/responses/RefusedWord'
        '401':
          $ref: '#/components/responses/RefusedWord'
        '403':
          $ref: '#/components/responses/RefusedPlain'
        '404':
          $ref: '#/components/responses/RefusedPlain'
        '409':
          description: 'rebase, same_sent_at или not_ready (договор приёма отчёта); deposed смещённого держателя с записью нового
            (P/08.8 Н1.6; добавлено М11/10); запись первого key держателя (P/08.3 Н3 «держатель в списке» шаг 2) нарушила бы
            every_entry — {error: refused, detail: "the entry of <член> would exceed 820 bytes"} без reason, метки нет
            (P/08.10 Н1.5; C08-MEMBER-409-ENTRY-01)'
          content:
            application/json:
              schema:
                oneOf:
                  - unevaluatedProperties: false
                    allOf:
                      - $ref: '#/components/schemas/Refusal'
                      - properties:
                          error: {const: refused}
                          reason: {enum: [rebase, same_sent_at, not_ready]}
                        required: [reason, detail]
                  - unevaluatedProperties: false
                    allOf:
                      - $ref: '#/components/schemas/Refusal'
                      - properties:
                          error: {const: refused}
                          detail: {type: string, minLength: 1}
                        required: [detail]
                        not: {required: [reason]}
                  - $ref: '#/components/schemas/Deposed'
        '413':
          description: 'Тело больше BODY_LIMIT или целое поколение больше BODY_LIMIT — {error: "whole too large"} (P/08.10 Н1.5; добавлено М11/12)'
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                allOf:
                  - $ref: '#/components/schemas/Refusal'
                  - required: [detail]
        '503':
          $ref: '#/components/responses/StandbyOrExhausted'
  /api/carry/{member}:
    description: 'Глава 8.3 Н2, Н1.4а, Н1.5.'
    parameters:
      - $ref: '#/components/parameters/Member'
    get:
      operationId: memberCarry
      summary: Ответ держателя без отчёта (до первого снимка, ретранслятор)
      parameters:
        - $ref: '#/components/parameters/AgentSignature'
      responses:
        '200':
          description: Ответ держателя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carry'
        '401':
          $ref: '#/components/responses/RefusedWord'
        '403':
          $ref: '#/components/responses/RefusedPlain'
        '404':
          $ref: '#/components/responses/RefusedPlain'
        '409':
          $ref: '#/components/responses/DeposedAgent'
        '503':
          $ref: '#/components/responses/StandbyOrUnavailable'
  /api/relay/{relay}:
    description: 'Глава 8.3 Н2, Н3 «держатель на POST /api/relay» (сторона держателя; сторона ретранслятора — P/09.2 Н2, Н3).'
    parameters:
      - name: relay
        in: path
        required: true
        schema: {$ref: '#/components/schemas/MemberName'}
    post:
      operationId: relayBatch
      summary: Пакет ретранслятора — отчёты членов за ним и стуки
      description: 'Порядок отказов (Н2; C08-G06): 413 тело больше BATCH_LIMIT — до разбора (договор приёма отчёта «Пакет
        ретранслятора: пределы»; C08-G05); 400 не пакет; 404 ретранслятор не член — без проверки подписи и без стука; 403
        член без key в Entry («ключа нет в записи»); 403 ключ не тот или отозван; 401 подпись ключом записи; 409 deposed;
        503 standby.'
      parameters:
        - $ref: '#/components/parameters/AgentSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Batch'
      responses:
        '408': {$ref: '#/components/responses/BodyRefused'}
        '200':
          description: Ответ ретранслятору; отказ одного члена — в refused, не код
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayAnswer'
        '400':
          $ref: '#/components/responses/Refused'
        '401':
          $ref: '#/components/responses/Refused'
        '403':
          $ref: '#/components/responses/Refused'
        '404':
          $ref: '#/components/responses/Refused'
        '409':
          $ref: '#/components/responses/DeposedAgent'
        '413':
          $ref: '#/components/responses/Refused'
        '503': {$ref: '#/components/responses/StandbyOrUnavailable'}
  /api/tokens/{member}/{sub}/{kind}:
    description: 'Глава 8.7 (08.7-domain.norms.md) Н1.3, Н2, Н3 «выдать»; местная дверь агента — договор местной двери токенов (P/09.1 Н1.6; OpenAPI урока 9, тег local-door).'
    parameters:
      - $ref: '#/components/parameters/Member'
      - {$ref: '#/components/parameters/Sub'}
      - {$ref: '#/components/parameters/Kind'}
    post:
      operationId: holderToken
      summary: Агент просит токен у держателя
      parameters:
        - $ref: '#/components/parameters/AgentSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HolderAsk'}
      responses:
        '408': {$ref: '#/components/responses/BodyRefused'}
        '200':
          description: 'Ответ, запечатанный члену конвертом m1; содержимое — договор конвертов домена «Содержимое sealed»'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenSealed'}
        '400': {$ref: '#/components/responses/TokenRefused'}
        '401': {$ref: '#/components/responses/TokenRefused'}
        '403': {$ref: '#/components/responses/TokenRefused'}
        '404': {$ref: '#/components/responses/TokenRefused'}
        '409':
          description: 'no_centre (Н3 «выдать») или deposed смещённого держателя (P/08.8 Н1.6; добавлено М11/10)'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenRefusal'
                  - $ref: '#/components/schemas/Deposed'
        '413': {$ref: '#/components/responses/TokenRefused'}
        '503': {$ref: '#/components/responses/StandbyOrUnavailable'}
  /api/login:
    description: 'Глава 8.4 (08.4-domain.norms.md) Н1.2, Н1.10, Н2; передаёт консоль домена (глава 8.0 Н1.8 pass, открытая строка
      списка дверей домена).'
    post:
      operationId: login
      summary: Вход человека (Н1.2)
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, password]
              additionalProperties: false
              properties:
                user: {type: string}
                password: {type: string}
      responses:
        '408': {$ref: '#/components/responses/BodyRefused'}
        '200':
          description: Токен человека
          content:
            application/json:
              schema:
                type: object
                required: [token, until, user]
                additionalProperties: false
                properties:
                  token: {type: string}
                  until: {type: number}
                  user: {$ref: '#/components/schemas/PersonName'}
        '400': {$ref: '#/components/responses/Refused'}
        '401': {$ref: '#/components/responses/Refused'}
        '409': {$ref: '#/components/responses/Refused'}
        '413': {$ref: '#/components/responses/Refused'}
        '429': {$ref: '#/components/responses/TooMany'}
        '503': {$ref: '#/components/responses/StandbyOrUnavailable'}
  /domain/members:
    description: 'Глава 8.3 Н2, Н3 «принять члена»; 409 потолков — глава 8.10 Н1.5. GET и HEAD отвечает консоль домена сама
      (урок P/10; схема — MembersView).'
    post:
      operationId: membersAdmit
      summary: Принять стучащегося по отпечатку его ключа
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, fingerprint]
              additionalProperties: false
              properties:
                name: {$ref: '#/components/schemas/MemberName'}
                fingerprint: {type: string, pattern: "^(?:[0-9a-f]{16})$"}
      responses:
        '408': {$ref: '#/components/responses/BodyRefused'}
        '413': {$ref: '#/components/responses/BodyRefused'}
        '200':
          description: Список после записи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersAnswer'
        '400':
          $ref: '#/components/responses/Refused'
        '401':
          $ref: '#/components/responses/Denied'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          $ref: '#/components/responses/Refused'
        '409':
          description: 'Н3 «принять члена» шаги 1–6; список полон — detail «too many members: the list holds 500»; Entry больше 820 байт — «the entry of <name> would exceed 820 bytes» (P/08.10 Н1.5; добавлено М11/12); deposed (P/08.8 Н1.6)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refusal'}
        '503': {$ref: '#/components/responses/StandbyFrozenOrUnavailable'}
  /domain/members/{name}:
    description: 'Глава 8.3 Н2, Н3 «DELETE /domain/members/<член>».'
    parameters:
      - name: name
        in: path
        required: true
        schema: {$ref: '#/components/schemas/MemberName'}
    delete:
      operationId: membersRemove
      summary: Член уходит из домена
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
      responses:
        '200':
          description: Список после записи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersAnswer'
        '400':
          $ref: '#/components/responses/Refused'
        '401':
          $ref: '#/components/responses/Denied'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          $ref: '#/components/responses/Refused'
        '409': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/StandbyFrozenOrUnavailable'}
  /domain/members/{member}/ca:
    description: 'Глава 8.3 Н1.6 admin, Н2.'
    parameters:
      - $ref: '#/components/parameters/Member'
    post:
      operationId: memberCaSet
      summary: Администратор заменяет отпечатки центра члена (Н1.6 admin)
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ca]
              additionalProperties: false
              properties:
                ca:
                  type: array
                  maxItems: 2
                  uniqueItems: true
                  description: '[] — снять отпечатки и строку ca-certs.'
                  items: {$ref: '#/components/schemas/Fingerprint'}
                ca_certs:
                  type: array
                  maxItems: 2
                  description: 'Н1.6 admin: PEM сертификатов центров в порядке ca, sha256(DER) — отпечаток на том же месте; пишутся в domain/members/<член>/ca-certs до Entry.ca.'
                  items: {type: string, minLength: 1}
      responses:
        '408': {$ref: '#/components/responses/BodyRefused'}
        '413': {$ref: '#/components/responses/BodyRefused'}
        '200':
          description: Список членов после записи по CAS (Н2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersAnswer'
        '400': {$ref: '#/components/responses/Refused'}
        '401': {$ref: '#/components/responses/Denied'}
        '403': {$ref: '#/components/responses/Denied'}
        '404': {$ref: '#/components/responses/Refused'}
        '409': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/StandbyFrozenOrUnavailable'}
  /domain/topology:
    description: 'Глава 8.3 Н1.2 put_order, Н2. GET и HEAD отвечает консоль домена сама (урок P/10; схема — Topology).'
    put:
      operationId: topologyPut
      summary: Правка топологии против прочитанной ревизии
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopologyEdit'
      responses:
        '408': {$ref: '#/components/responses/BodyRefused'}
        '413': {$ref: '#/components/responses/BodyRefused'}
        '200':
          description: Документ после записи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topology'
        '400':
          $ref: '#/components/responses/Refused'
        '401':
          $ref: '#/components/responses/Denied'
        '403':
          $ref: '#/components/responses/Denied'
        '409':
          $ref: '#/components/responses/Refused'
        '503': {$ref: '#/components/responses/StandbyFrozenOrUnavailable'}
  /domain/placement/{sub}/{ref}:
    description: 'Глава 8.6 (08.6-domain.norms.md) Н1.1, Н2, Н3. GET и HEAD отвечает консоль домена сама (урок P/10; схема — Placement).'
    parameters:
      - {$ref: '#/components/parameters/Sub'}
      - {$ref: '#/components/parameters/Ref'}
    put:
      operationId: placementPut
      summary: Назначить (только оператор)
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementEdit'
      responses:
        '408': {$ref: '#/components/responses/BodyRefused'}
        '413': {$ref: '#/components/responses/BodyRefused'}
        '200':
          description: Запись после правки; то же содержимое — прежняя rev
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Placement'}
        '400': {$ref: '#/components/responses/Refused'}
        '401': {$ref: '#/components/responses/Denied'}
        '403': {$ref: '#/components/responses/Denied'}
        '404': {$ref: '#/components/responses/Refused'}
        '409': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/Refused503'}
    delete:
      operationId: placementDelete
      summary: Снять назначение
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
      responses:
        '200':
          description: Снято
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                additionalProperties: false
                properties:
                  deleted: {type: string}
        '400':
          description: 'ref не по грамматике имени P/06.1 Н1.3 named, в том числе с «/» (глава 8.6 Н1.1 ref; разбор ревью стадии B 8–10, № 7).'
          $ref: '#/components/responses/Refused'
        '401': {$ref: '#/components/responses/Denied'}
        '403': {$ref: '#/components/responses/Denied'}
        '404': {$ref: '#/components/responses/Refused'}
        '409': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/StandbyFrozenOrUnavailable'}
  /domain/{sub}/{rows}:
    description: 'Глава 8.6 Н1.3, Н1.4, Н2, Н3 «принять правку». GET и HEAD (вид единиц) отвечает консоль домена сама (урок P/10; схема — Unit).'
    parameters:
      - {$ref: '#/components/parameters/Sub'}
      - {$ref: '#/components/parameters/Rows'}
    post:
      operationId: editCreate
      summary: Создать единицу на члене (правка хранится)
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - $ref: '#/components/parameters/XW2CClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
