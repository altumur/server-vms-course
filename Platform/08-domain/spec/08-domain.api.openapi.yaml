      - {name: ref, in: path, required: true, schema: {type: string}}
    delete:
      operationId: issuedRevoke
      summary: Revocation of the tokens of a target of kind keep (chapter 8.2 N1.6a)
      responses:
        '200': {description: '{revoked}'}
        '404': {$ref: '#/components/responses/Refused'}
        '409':
          description: 'too many revocations — the row domain/revoked is full, nothing is written, the row domain/issued stays (chapter 8.2 N1.6a; ADR-0110 addendum (19) item 1)'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refusal'}
  /domain/batches/{batch}:
    parameters:
      - name: batch
        in: path
        required: true
        schema: {type: string}
    delete:
      operationId: batchRevoke
      summary: Revocation of a batch — new admissions are closed, admitted ones are not touched
      responses:
        '200':
          description: 'Row of the batch with revoked: true; a repeat on a revoked one — the same answer, the row does not change'
          content:
            application/json:
              schema:
                type: object
                required: [batches]
                additionalProperties: false
                properties:
                  batches:
                    type: object
                    propertyNames: {$ref: '#/components/schemas/BatchName'}
                    additionalProperties: {$ref: '#/components/schemas/BatchRow'}
        '404': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/Refused'}
