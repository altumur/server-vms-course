      responses:
        '201':
          description: The new folder; a repeat with the same key returns the saved response.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DomainFolderView'}
        '412': {$ref: '#/components/responses/DomainFolderRefused'}
        '400': {$ref: '#/components/responses/DomainFolderRefused'}
        '401': {$ref: '#/components/responses/Denied'}
        '403': {$ref: '#/components/responses/Denied'}
        '404': {$ref: '#/components/responses/DomainFolderRefused'}
        '408': {$ref: '#/components/responses/BodyRefused'}
        '409': {$ref: '#/components/responses/DomainFolderRefused'}
        '413': {$ref: '#/components/responses/BodyRefused'}
        '422': {$ref: '#/components/responses/KeyReused'}
        '503': {$ref: '#/components/responses/StandbyFrozenOrUnavailable'}
    get:
      operationId: foldersRead
      summary: Live domain folders (answered by the domain console).
      responses:
        '200':
          description: Tree by id; every live folder carries its own row revision and index.
          content:
            application/json:
              schema:
                type: object
                required: [rev, folders]
                additionalProperties: false
                properties:
                  rev:
                    type: object
                    required: [term, rev]
                    additionalProperties: false
                    properties:
                      term: {type: integer, minimum: 1}
                      rev: {type: integer, minimum: 0}
                  folders: {type: array, items: {"oneOf": [{"$ref": "#/components/schemas/DomainFolderView"}, {"type": "object", "required": ["id", "garbled"], "additionalProperties": false, "properties": {"id": {"type": "string", "pattern": "^(?:[0-9a-f]{32})$"}, "garbled": {"const": true}}}]}}
  /domain/folders/{folder}:
    parameters:
      - name: folder
        in: path
        required: true
        schema: {type: string, pattern: '^(?:[0-9a-f]{32})$'}
    put:
      operationId: folderRename
      summary: Rename a live domain folder; parent is immutable.
      parameters:
        - {$ref: '#/components/parameters/XW2CClient'}
        - {$ref: '#/components/parameters/RepeatKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: {$ref: '#/components/schemas/DomainFolderName'}
      responses:
        '200':
          description: Folder after the write.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DomainFolderView'}
        '412': {$ref: '#/components/responses/DomainFolderConditionRefused'}
        '400': {$ref: '#/components/responses/DomainFolderRefused'}
        '401': {$ref: '#/components/responses/Denied'}
        '403': {$ref: '#/components/responses/Denied'}
        '404': {$ref: '#/components/responses/DomainFolderRefused'}
        '408': {$ref: '#/components/responses/BodyRefused'}
        '409': {$ref: '#/components/responses/DomainFolderRefused'}
        '413': {$ref: '#/components/responses/BodyRefused'}
        '422': {$ref: '#/components/responses/KeyReused'}
        '503': {$ref: '#/components/responses/StandbyFrozenOrUnavailable'}
    delete:
      operationId: folderDelete
      summary: Write the domain folder tombstone; the row and its index remain.
      parameters:
        - {$ref: '#/components/parameters/XW2CClient'}
        - {$ref: '#/components/parameters/RepeatKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200':
          description: Tombstone written; ETag is its result row index.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                additionalProperties: false
                properties:
                  deleted: {type: string, pattern: '^(?:[0-9a-f]{32})$'}
        '412': {$ref: '#/components/responses/DomainFolderConditionRefused'}
        '400': {$ref: '#/components/responses/DomainFolderRefused'}
        '401': {$ref: '#/components/responses/Denied'}
        '403': {$ref: '#/components/responses/Denied'}
        '404': {$ref: '#/components/responses/DomainFolderRefused'}
        '408': {$ref: '#/components/responses/BodyRefused'}
        '409': {$ref: '#/components/responses/DomainFolderRefused'}
        '413': {$ref: '#/components/responses/BodyRefused'}
        '422': {$ref: '#/components/responses/KeyReused'}
        '503': {$ref: '#/components/responses/StandbyFrozenOrUnavailable'}
  /domain/memberof/{member}/{sub}/{rows}/{id}:
    parameters:
      - {$ref: '#/components/parameters/Member'}
      - {$ref: '#/components/parameters/Sub'}
      - {$ref: '#/components/parameters/Rows'}
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: memberofRead
      summary: Membership of a unit in domain folders (answered by the domain console).
      responses:
        '200':
          description: Confirmed absence is folders [] and index empty; no revision counter or ETag.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DomainMembershipView'}
    put:
      operationId: memberofWrite
      summary: Replace membership atomically with its reverse indexes; an empty list deletes this row.
      parameters:
        - {$ref: '#/components/parameters/XW2CClient'}
        - {$ref: '#/components/parameters/RepeatKey'}
        - {$ref: '#/components/parameters/IndexIfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folders]
              additionalProperties: false
              properties:
                folders:
                  type: array
                  uniqueItems: true
                  items: {type: string, pattern: '^(?:[0-9a-f]{32})$'}
      responses:
        '200':
          description: Current folders and membership row index; an empty list deletes it and returns index empty. No ETag.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DomainMembershipView'}
        '412': {$ref: '#/components/responses/IndexMoved'}
        '400': {$ref: '#/components/responses/DomainFolderRefused'}
        '401': {$ref: '#/components/responses/Denied'}
        '403': {$ref: '#/components/responses/Denied'}
        '404': {$ref: '#/components/responses/DomainFolderRefused'}
        '408': {$ref: '#/components/responses/BodyRefused'}
        '409': {$ref: '#/components/responses/DomainFolderRefused'}
        '413': {$ref: '#/components/responses/BodyRefused'}
        '422': {$ref: '#/components/responses/KeyReused'}
        '503': {$ref: '#/components/responses/StandbyFrozenOrUnavailable'}
  /api/members/{member}/{part}:
    parameters:
      - {$ref: '#/components/parameters/Member'}
      - $ref: '#/components/parameters/Part'
      - {$ref: '#/components/parameters/AgentSignature'}
    get:
      operationId: memberRow
      summary: Row of a part at the request of a member (the report intake contract; ADR-0113)
      responses:
        '200': {$ref: '#/components/responses/HolderMembersResponse'}
        '429': {$ref: '#/components/responses/Busy'}
  /api/book/{member}/{sub}/{book}:
    parameters:
      - {$ref: '#/components/parameters/Member'}
      - {$ref: '#/components/parameters/BookSub'}
      - {$ref: '#/components/parameters/Book'}
      - {$ref: '#/components/parameters/AgentSignature'}
    get:
      operationId: bookAll
      summary: Head of the book to "*" (chapter 8.5 N1.4)
      responses:
        '200': {$ref: '#/components/responses/HolderBookHeadResponse'}
        '429': {$ref: '#/components/responses/Busy'}
  /domain/{sub}/books/{book}/*/{part}:
    parameters:
      - {name: sub, in: path, required: true, schema: {type: string}}
      - {name: book, in: path, required: true, schema: {type: string}}
      - {name: part, in: path, required: true, schema: {type: string, pattern: '^(?:0[0-9]{3}|[1-3][0-9]{3}|40[0-8][0-9]|409[0-5])$'}}
    get:
      operationId: bookAllPartPerson
      summary: Part of the book to "*" for a person (chapter 8.5 N2; ADR-0113 addendum (26) item 2)
      responses:
        '200': {description: '{items}'}
        '401': {$ref: '#/components/responses/Refused'}
        '403': {$ref: '#/components/responses/Refused'}
        '404': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/Refused503'}
  /api/book/{member}/{sub}/{book}/{part}:
    parameters:
      - {$ref: '#/components/parameters/Member'}
      - {$ref: '#/components/parameters/BookSub'}
      - {$ref: '#/components/parameters/Book'}
      - {$ref: '#/components/parameters/Part'}
      - {$ref: '#/components/parameters/AgentSignature'}
    get:
      operationId: bookAllPart
      summary: Part of the book to "*" (chapter 8.5 N1.4)
      responses:
        '200': {$ref: '#/components/responses/HolderBookPartResponse'}
        '404':
          description: 'reason: empty_part — there is no row of the part, the head of the current term is written, the copy is removed; the head is not written — 503 unavailable, the copy is kept (ADR-0113 addendum (47) item 1); not_a_book — the book is not to "*"; without reason — not a member (P/08.3 N2).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refusal'}
        '429': {$ref: '#/components/responses/Busy'}
        '503': {$ref: '#/components/responses/StandbyOrUnavailable'}
  /api/backup-part/{member}/{part}:
    parameters:
      - {$ref: '#/components/parameters/Member'}
      - $ref: '#/components/parameters/Part'
      - {$ref: '#/components/parameters/AgentSignature'}
    get:
      operationId: backupPart
      summary: Part of the backup for a keeper (chapter 8.8 N1.5a)
      parameters:
      - $ref: '#/components/parameters/BackupPartRevision'
      responses:
        '200': {$ref: '#/components/responses/HolderBackupPartResponse'}
