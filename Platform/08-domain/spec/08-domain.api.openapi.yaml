    post:
      operationId: batchCreate
      summary: New batch; the token is shown once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, n]
              additionalProperties: false
              properties:
                name: {$ref: '#/components/schemas/BatchName'}
                via: {$ref: '#/components/schemas/MemberName'}
                n: {type: integer, minimum: 1, maximum: 9007199254740991}
      responses:
        '201':
          description: 'Batch created; token — the private key Ed25519 (seed, 64 hex), shown once and stored nowhere; until — at + 7 days'
          content:
            application/json:
              schema:
                type: object
                required: [name, token, until]
                additionalProperties: false
                properties:
                  name: {$ref: '#/components/schemas/BatchName'}
                  token: {type: string, pattern: "^(?:[0-9a-f]{64})$"}
                  until: {type: number}
        '400': {$ref: '#/components/responses/Refused'}
        '409': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/Refused'}
  /domain/issued/{sub}/{kind}/{ref}:
    parameters:
      - {name: sub, in: path, required: true, schema: {type: string}}
