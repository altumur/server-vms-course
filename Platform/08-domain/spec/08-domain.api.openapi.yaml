      responses:
        '200':
          description: as at GET, without a body
        '401':
          description: as at GET, without a body
        '403':
          description: as at GET, without a body
        '503':
          description: as at GET, without a body
    post:
      operationId: userCreate
      summary: Create a person (N1.1, N3)
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
