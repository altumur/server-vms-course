# P/08 — doors of the domain process (SIGNER_URL): HTTP contract (one process door — one lesson contract; the move plan
# of lesson 8 § 4). Chapters refer to their paths (the description of each path names its chapter): 8.3 — /api/member/{member},
# /api/carry/{member}, /api/relay/{relay}, /domain/members, /domain/members/{name}, /domain/members/{member}/ca,
# /domain/topology; 8.4 — /api/login, /domain/users, /domain/users/{name}, /domain/groups, /domain/groups/{name}, /domain/roles,
# /domain/roles/{name}, /domain/roles/{role}/lines, /domain/batch, /domain/grants/{cluster}, /domain/break-glass,
# /domain/break-glass/{cluster}, /domain/revoke; 8.6 — /domain/placement/{sub}/{ref}, /domain/{sub}/{rows},
# /domain/{sub}/{rows}/{ref}; 8.7 — /api/tokens/{member}/{sub}/{kind}; 8.8 — /api/prepare, /api/take, /domain/move,
# /domain/handover, /domain/stranded/apply; 8.9 — /domain/shared; 8.5 — /domain/folders and /domain/memberof. Chapters 8.0, 8.1, 8.2, 8.10 have no paths of their own: 8.0 —
# the X-W2C-Client parameter and the answers deposed, frozen, standby; 8.1 — the schemas of the view and of the shadow report (the domain console serves them,
# lesson P/10 refers by $ref), the input and output of the view command; 8.10 — 409 and 413 of the ceilings at the paths of 8.3, 503 standby at every door.
# The process's own doors (class signed: /api/member, /api/carry, /api/relay, /api/tokens) — 4 operations; the doors that are passed
# to the process — listed by paths below, including HEAD (the domain console — the paths below and HEAD at GET /domain/users, /domain/groups, /domain/roles, /domain/break-glass; the cluster console — 3:
# /api/prepare, /api/take, POST /domain/move; chapter 8.0 N2; analysis of review of stage B 8–10, № 22: M-6); every operation has an operationId: the OpenAPI of lesson 10 refers to the answers of these operations (decision
# of the Architect of 2026-10-20 on plans 8–10, item 9). The contract carries only the codes of the process (transition 3 of the forwarding contract
# Platform/common/contracts/forwarding.md «Refusals by transition»; analysis of review of stage A 8–10, decision 3): the codes of the N3 doors,
# 401/403 of its own check of identity and grant (chapter 8.4 N1.5), 409 deposed (chapter 8.8), 503 frozen (chapter 8.8) and standby
# (chapter 8.10); the codes of transitions 1 and 2 (forwarding by the cluster console, acceptance and passing by the domain console: 404, 502, 400/408/413
# of reading the body, the gate of the console) — OpenAPI 06 (chapter 6.7) and 10, not listed here; there is no Forwarded answer.
# Merged from the contracts M11/1, M11/3, M11/4, M11/6, M11/7, M11/8, M11/9, M11/10, M11/11 (the domain process side) — stage B,
# without a change of behaviour; the contract is brought to the norms of the chapters (check of the contract against the norms of P/08, move of lesson 8): Publication —
# fields outside the delta no stricter than 8.3 N1.2 out_of_delta; MembersDoc — with term (8.3 N1.1; the form of the row, not a door answer),
# MembersAnswer {rev, members} — the 200 answer of the member doors 8.3 N2 (addition of the Architect to № 8 of the analysis of review of stage B 8–10),
# MembersView — without a required term (P/10 N2; analysis of review of stage B 8–10, № 8); at the people doors (8.4 N2) 413 and 503
# standby/unavailable are process codes; at the edit doors — 503 frozen (8.8 N1.7), at the GET people doors — 503 standby (8.0 N2);
# TopologyEdit.centre — "" and null remove the centre (8.3 N1.2); Entry.how — the three forms of 8.3 N1.1; HolderRecord — url non-empty,
# ca without repeats (the term record contract, function record step 1); PersonName — whitespace per Unicode White_Space, not \s
# of ECMA-262. Generation and Mark are not moved: they are store objects, their forms — the families member-report, member-reported (ADR-0088).
# PeerInput and PeerOutput — the peer contract (P/09); the paths of the view, the list, the topology, the placements, the grants and the shared document for
# reading are answered by the domain console itself — lesson P/10 (the schemas of their answers are here, P/10 refers by $ref).
openapi: 3.1.0
info:
  title: P/08 — doors of the domain process
  version: '1'
  description: 'Canon — the norms of chapters 08.0…08.10-domain.norms.md; the summary table of the process doors — chapter 8.0 N2. Request parsing
    — P/01.1 N2.1 with the deviations of P/06.5 N2. The doors /api/member, /api/carry, /api/relay, /api/tokens — class signed (signature
    of the agent, the agent signature contract; the server side — the role certificate contract); /api/prepare, /api/take, /domain/move
    are passed to the process by the cluster console (forwarding to the signer), the other /domain/* and /api/login — by the domain console (chapter 8.0
    N1.8 pass; the list of domain doors — the forwarding contract). The process checks identity and grant itself (chapter 8.4 N1.5). View,
    ServedView, Unit, ShadowReport, MembersView, Topology, Placement, SharedDoc, Delivery — P/08.1 N1.4, N1.6 and the forms of the chapters
    (served by the domain console, lesson P/10). ViewInput and ViewOutput — the input and output of the view command (P/08.1 N5, vectors/view);
    MayInput, MayUnit, MayOutput — the input and output of the function may (the right contract may.md, P/08.4 N1.4) — not HTTP. The internal API is not
    normed; the contract does not claim that any implementation has been checked against it.'
servers:
  - url: '{origin}'
    description: Door of the domain process (SIGNER_URL, P/02.4 P/02.4-13).
    variables:
      origin: {default: 'http://localhost:8445', description: 'Origin without a trailing /; an example address (a single-machine stand), not a setting.'}
paths:
  /api/member/{member}:
    description: 'Chapter 8.3 (08.3-domain.norms.md) N2, N1.5, the report intake contract; 413 whole too large — chapter 8.10 N1.5.'
    parameters:
      - $ref: '#/components/parameters/Member'
    post:
      operationId: memberReport
      summary: Report of a member agent — a generation or «heard»; the answer — what the agent carries home
      parameters:
        - $ref: '#/components/parameters/AgentSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Publication'
      responses:
        '408': {$ref: '#/components/responses/BodyRefused'}
        '200':
          description: Accepted (a generation, «heard» or the same report again)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carry'
        '400':
          $ref: '#/components/responses/RefusedWord'
        '401':
          $ref: '#/components/responses/RefusedWord'
        '403':
          $ref: '#/components/responses/RefusedPlain'
        '404':
          $ref: '#/components/responses/RefusedPlain'
        '409':
          description: 'rebase, same_sent_at or not_ready (the report intake contract); deposed of a displaced holder with the record of the new one
            (P/08.8 N1.6; added in M11/10); the record of the first key of the holder (P/08.3 N3 «the holder in the list» step 2) would break
            every_entry — {error: refused, detail: "the entry of <member> would exceed 1240 bytes"} without reason, no mark
            (P/08.10 N1.5; C08-MEMBER-409-ENTRY-01)'
          content:
            application/json:
              schema:
                oneOf:
                  - unevaluatedProperties: false
                    allOf:
                      - $ref: '#/components/schemas/Refusal'
                      - properties:
                          error: {const: refused}
                          reason: {enum: [rebase, same_sent_at, not_ready]}
                        required: [reason, detail]
                  - unevaluatedProperties: false
                    allOf:
                      - $ref: '#/components/schemas/Refusal'
                      - properties:
                          error: {const: refused}
                          detail: {type: string, minLength: 1}
                        required: [detail]
                        not: {required: [reason]}
                  - $ref: '#/components/schemas/Deposed'
        '413':
          description: 'Body larger than BODY_LIMIT — {error: denied} before parsing (C08-BODY-DENIED-01); a whole generation larger than BODY_LIMIT — {error: "whole too large"} (P/08.10 N1.5; added in M11/12)'
          content:
            application/json:
              schema:
                unevaluatedProperties: false
                allOf:
                  - $ref: '#/components/schemas/Refusal'
                  - required: [detail]
        '429': {$ref: '#/components/responses/Busy'}
        '503':
          $ref: '#/components/responses/StandbyOrExhausted'
  /api/carry/{member}:
    description: 'Chapter 8.3 N2, N1.4a, N1.5.'
    parameters:
      - $ref: '#/components/parameters/Member'
    get:
      operationId: memberCarry
      summary: Answer of the holder without a report (before the first snapshot, relay)
      parameters:
        - $ref: '#/components/parameters/AgentSignature'
      responses:
        '200':
          description: Answer of the holder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carry'
        '401':
          $ref: '#/components/responses/RefusedWord'
        '403':
          $ref: '#/components/responses/RefusedPlain'
        '404':
          $ref: '#/components/responses/RefusedPlain'
        '409':
          $ref: '#/components/responses/DeposedAgent'
        '429': {$ref: '#/components/responses/Busy'}
        '503':
          $ref: '#/components/responses/StandbyOrUnavailable'
  /api/relay/{relay}:
    description: 'Chapter 8.3 N2, N3 «the holder on POST /api/relay» (the holder side; the relay side — P/09.2 N2, N3).'
    parameters:
      - name: relay
        in: path
        required: true
        schema: {$ref: '#/components/schemas/MemberName'}
    post:
      operationId: relayBatch
      summary: Relay batch — the reports of the members behind it and knocks
      description: 'Order of refusals (N2; C08-G06): 413 body larger than BATCH_LIMIT — before parsing (the report intake contract
        «The relay batch: limits»; C08-G05); 400 not a batch; 404 the relay is not a member — without a signature check and without a knock; 403
        a member without key in Entry («the key is not in the entry»); 403 the key is wrong or revoked; 401 the signature by the key of the entry; 409 deposed;
        503 standby.'
      parameters:
        - $ref: '#/components/parameters/AgentSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Batch'
      responses:
        '408': {$ref: '#/components/responses/BodyRefused'}
        '200':
          description: Answer to the relay; a refusal of one member is in refused, not a code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayAnswer'
        '400':
          $ref: '#/components/responses/Refused'
        '401':
          $ref: '#/components/responses/Refused'
        '403':
          $ref: '#/components/responses/Refused'
        '404':
          $ref: '#/components/responses/Refused'
        '409':
          $ref: '#/components/responses/DeposedAgent'
        '413':
          $ref: '#/components/responses/Refused'
        '503': {$ref: '#/components/responses/StandbyOrUnavailable'}
  /api/tokens/{member}/{sub}/{kind}:
    description: 'Chapter 8.7 (08.7-domain.norms.md) N1.3, N2, N3 «issue»; the local door of the agent — the local token door contract (P/09.1 N1.6; OpenAPI of lesson 9, tag local-door).'
    parameters:
      - $ref: '#/components/parameters/Member'
      - {$ref: '#/components/parameters/Sub'}
      - {$ref: '#/components/parameters/Kind'}
    post:
      operationId: holderToken
      summary: The agent asks the holder for a token
      parameters:
        - $ref: '#/components/parameters/AgentSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HolderAsk'}
      responses:
        '408': {$ref: '#/components/responses/BodyRefused'}
        '200':
          description: 'Answer sealed to the member in envelope m1; the content — the domain envelopes contract «Content of sealed»'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenSealed'}
        '400': {$ref: '#/components/responses/TokenRefused'}
        '401': {$ref: '#/components/responses/TokenRefused'}
        '403': {$ref: '#/components/responses/TokenRefused'}
        '404': {$ref: '#/components/responses/TokenRefused'}
        '409':
          description: 'no_centre (N3 «issue») or deposed of a displaced holder (P/08.8 N1.6; added in M11/10)'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenRefusal'
                  - $ref: '#/components/schemas/Deposed'
        '413': {$ref: '#/components/responses/TokenRefused'}
        '503': {$ref: '#/components/responses/StandbyFrozenOrUnavailable'}
  /api/verify:
    description: 'Chapter 8.4 (08.4-domain.norms.md) N1.2a, N1.10 verify, N2 (ADR-0119); passed by the domain console — POST /domain/verify
      of the list of domain doors, only by ticket (the forwarding contract «Ticket on forwarding»). There is no token, cookie or session.'
    post:
      operationId: verify
      summary: Check of credentials without login (N1.2a)
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, password]
              additionalProperties: false
              properties:
                user: {type: string}
                password: {type: string}
      responses:
        '408': {$ref: '#/components/responses/BodyRefused'}
        '200':
          description: The password matched; the right is not judged (the cluster console judges it, chapter 6.7 N1.15)
          content:
            application/json:
              schema:
                type: object
                required: [user]
                additionalProperties: false
                properties:
                  user: {$ref: '#/components/schemas/PersonName'}
        '400': {$ref: '#/components/responses/Refused'}
        '401': {$ref: '#/components/responses/Refused'}
        '403': {$ref: '#/components/responses/Denied'}
        '409': {$ref: '#/components/responses/Refused'}
        '413': {$ref: '#/components/responses/Refused'}
        '429': {$ref: '#/components/responses/TooMany'}
        '503': {$ref: '#/components/responses/StandbyOrUnavailable'}
  /api/login:
    description: 'Chapter 8.4 (08.4-domain.norms.md) N1.2, N1.10, N2; passed by the domain console (chapter 8.0 N1.8 pass, an open line
      of the list of domain doors).'
    post:
      operationId: login
      summary: Login of a person (N1.2)
      description: 'iat is the confirmed credential read time before unlocked PBKDF2; exp=iat+TOKEN_LIFETIME. A too-long issuance refuses with 401 refused and asks for a new request, never a refreshed iat (P08 review C5).'
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, password]
              additionalProperties: false
              properties:
                user: {type: string}
                password: {type: string}
      responses:
        '408': {$ref: '#/components/responses/BodyRefused'}
        '200':
          description: Token of the person
          content:
            application/json:
              schema:
                type: object
                required: [token, until, user]
                additionalProperties: false
                properties:
                  token: {type: string}
                  until: {type: number}
                  user: {$ref: '#/components/schemas/PersonName'}
        '400': {$ref: '#/components/responses/Refused'}
        '401': {$ref: '#/components/responses/Refused'}
        '409': {$ref: '#/components/responses/Refused'}
        '413': {$ref: '#/components/responses/Refused'}
        '429': {$ref: '#/components/responses/TooMany'}
        '503': {$ref: '#/components/responses/StandbyOrUnavailable'}
  /domain/members:
    description: 'Chapter 8.3 N2, N3 «admit a member»; 409 of the ceilings — chapter 8.10 N1.5. GET and HEAD are answered by the domain console itself
      (lesson P/10; schema — MembersView).'
    post:
      operationId: membersAdmit
      summary: Accept the one knocking by the fingerprint of its key
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
        - $ref: '#/components/parameters/RepeatKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, fingerprint]
              additionalProperties: false
              properties:
                name: {$ref: '#/components/schemas/MemberName'}
                fingerprint: {type: string, pattern: "^(?:[0-9a-f]{16})$"}
      responses:
        '412': {$ref: '#/components/responses/RevisionMoved'}
        '422': {$ref: '#/components/responses/KeyReused'}
        '408': {$ref: '#/components/responses/BodyRefused'}
        '413': {$ref: '#/components/responses/BodyRefused'}
        '200':
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          description: The list after the write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersAnswer'
        '400':
          $ref: '#/components/responses/Refused'
        '401':
          $ref: '#/components/responses/Denied'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          $ref: '#/components/responses/Refused'
        '409':
          description: 'N3 «admit a member» steps 1–6, detail — the words of the steps (P/08.3 N3): step 5a — «this name''s row is full: pick another name», «too many servers», «this name''s section is near the book ceiling: pick another name»; step 5b — «a domain of this size needs <n> backup holders: add a server first», relay full; step 6 — «the entry of <name> would exceed 1240 bytes» (ENTRY_MAX, P/08.10 N1.5), «the list of members kept changing; look again»; deposed (P/08.8 N1.6); ADR-0113 addendum (47) item 5'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refusal'}
        '503': {$ref: '#/components/responses/StandbyFrozenOrUnavailable'}
  /domain/members/{name}:
    description: 'Chapter 8.3 N2, N3 «DELETE /domain/members/<member>».'
    parameters:
      - name: name
        in: path
        required: true
        schema: {$ref: '#/components/schemas/MemberName'}
    delete:
      operationId: membersRemove
      summary: The member leaves the domain
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
        - $ref: '#/components/parameters/RepeatKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '412': {$ref: '#/components/responses/RevisionMoved'}
        '422': {$ref: '#/components/responses/KeyReused'}
        '200':
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          description: The list after the write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersAnswer'
        '400':
          $ref: '#/components/responses/Refused'
        '401':
          $ref: '#/components/responses/Denied'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          $ref: '#/components/responses/Refused'
        '409': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/StandbyFrozenOrUnavailable'}
  /domain/members/{member}/ca:
    description: 'Chapter 8.3 N1.6 admin, N2.'
    parameters:
      - $ref: '#/components/parameters/Member'
    post:
      operationId: memberCaSet
      summary: The administrator replaces the centre fingerprints of a member (N1.6 admin)
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
        - $ref: '#/components/parameters/RepeatKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ca]
              additionalProperties: false
              properties:
                ca:
                  type: array
                  maxItems: 2
                  uniqueItems: true
                  description: '[] — remove the fingerprints and the ca-certs row.'
                  items: {$ref: '#/components/schemas/Fingerprint'}
                ca_certs:
                  type: array
                  maxItems: 2
                  description: 'N1.6 admin: PEM of the centre certificates in the order of ca, sha256(DER) — the fingerprint at the same place; written to domain/members/<member>/ca-certs before Entry.ca.'
                  items: {type: string, minLength: 1}
      responses:
        '412': {$ref: '#/components/responses/RevisionMoved'}
        '422': {$ref: '#/components/responses/KeyReused'}
        '408': {$ref: '#/components/responses/BodyRefused'}
        '413': {$ref: '#/components/responses/BodyRefused'}
        '200':
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          description: The list of members after the write by CAS (N2)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersAnswer'
        '400': {$ref: '#/components/responses/Refused'}
        '401': {$ref: '#/components/responses/Denied'}
        '403': {$ref: '#/components/responses/Denied'}
        '404': {$ref: '#/components/responses/Refused'}
        '409': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/StandbyFrozenOrUnavailable'}
  /domain/topology:
    description: 'Chapter 8.3 N1.2 put_order, N2. GET and HEAD are answered by the domain console itself (lesson P/10; schema — Topology). At PUT 503 unavailable — also when the row domain/topology cannot be read, nothing is written (C08-TOPOLOGY-PUT-UNREADABLE-01).'
    put:
      operationId: topologyPut
      summary: Topology edit against the read revision
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
        - $ref: '#/components/parameters/RepeatKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopologyEdit'
      responses:
        '412': {$ref: '#/components/responses/RevisionMoved'}
        '422': {$ref: '#/components/responses/KeyReused'}
        '408': {$ref: '#/components/responses/BodyRefused'}
        '413': {$ref: '#/components/responses/BodyRefused'}
        '200':
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          description: The document after the write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topology'
        '400':
          $ref: '#/components/responses/Refused'
        '401':
          $ref: '#/components/responses/Denied'
        '403':
          $ref: '#/components/responses/Denied'
        '409':
          $ref: '#/components/responses/Refused'
        '503': {$ref: '#/components/responses/StandbyFrozenOrUnavailable'}
  /domain/placement/{sub}/{ref}:
    description: 'Chapter 8.6 (08.6-domain.norms.md) N1.1, N2, N3. GET and HEAD are answered by the domain console itself (lesson P/10; schema — Placement).'
    parameters:
      - {$ref: '#/components/parameters/Sub'}
      - {$ref: '#/components/parameters/Ref'}
    put:
      operationId: placementPut
      summary: Assign (operator only)
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
        - $ref: '#/components/parameters/RepeatKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementEdit'
      responses:
        '412': {$ref: '#/components/responses/RevisionMoved'}
        '422': {$ref: '#/components/responses/KeyReused'}
        '408': {$ref: '#/components/responses/BodyRefused'}
        '413': {$ref: '#/components/responses/BodyRefused'}
        '200':
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          description: The record after the edit; the same content — the previous rev
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Placement'}
        '400': {$ref: '#/components/responses/Refused'}
        '401': {$ref: '#/components/responses/Denied'}
        '403': {$ref: '#/components/responses/Denied'}
        '404': {$ref: '#/components/responses/Refused'}
        '409': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/Refused503'}
    delete:
      operationId: placementDelete
      summary: Remove the assignment
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
        - $ref: '#/components/parameters/RepeatKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '412': {$ref: '#/components/responses/RevisionMoved'}
        '422': {$ref: '#/components/responses/KeyReused'}
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                additionalProperties: false
                properties:
                  deleted: {type: string}
        '400':
          description: 'ref not by the name grammar of P/06.1 N1.3 named, including with «/» (chapter 8.6 N1.1 ref; analysis of review of stage B 8–10, № 7).'
          $ref: '#/components/responses/Refused'
        '401': {$ref: '#/components/responses/Denied'}
        '403': {$ref: '#/components/responses/Denied'}
        '404': {$ref: '#/components/responses/Refused'}
        '409': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/StandbyFrozenOrUnavailable'}
