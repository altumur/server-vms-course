                  to: {$ref: '#/components/schemas/MemberName'}
                  stranded:
                    description: 'Н1.6 stranded; no field — the collection failed, the divergences are unknown; [] — there are no divergences (C08-HANDOVER-STRANDED-UNKNOWN-01).'
                    type: array
                    items: {$ref: '#/components/schemas/StrandedItem'}
        '400': {$ref: '#/components/responses/Refused'}
        '401': {$ref: '#/components/responses/Denied'}
        '403': {$ref: '#/components/responses/Denied'}
        '409': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/Refused503'}
  /domain/stranded/apply:
    description: 'Chapter 8.8 Н1.6 apply, Н2; passed to the process of the displaced holder by the domain console (chapter 8.0 Н1.8). The answer of the door of chapter 8.6
      of the new holder (operations editCreate, editUpdate, editDelete) and the codes of forwarding to it (the forwarding contract
      «Отказы по переходам») arrive as they came and are not listed here; below — the codes of this process.'
    post:
      operationId: strandedApply
      summary: Repeat an abandoned edit at the new holder (Н1.6 apply)
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, key]
              additionalProperties: false
              properties:
                path: {type: string, minLength: 1}
                key: {type: string, minLength: 1}
      responses:
        '408': {$ref: '#/components/responses/BodyRefused'}
        '413': {$ref: '#/components/responses/BodyRefused'}
        '202': {description: 'The edit is accepted by the new holder — the answer of its door as it came (operations editCreate, editUpdate, editDelete)'}
        '400':
          description: 'redo it on the new holder — the item is not an edit (Н1.6 apply), before forwarding'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refusal'}
        '401': {$ref: '#/components/responses/Denied'}
        '403': {$ref: '#/components/responses/Denied'}
        '404':
          description: No item (Н1.6 apply)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refusal'}
        '409':
          description: The process is not displaced (Н1.6 apply)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refusal'}
        '503': {$ref: '#/components/responses/StandbyOrUnavailable'}
  /domain/shared:
    description: 'Chapter 8.9 (08.9-domain.norms.md) Н1.3, Н2; the domain console passes it to the process (ADR-0032; chapter 8.0 Н1.8). GET and
      HEAD are answered by the domain console itself (lesson P/10; schemas — SharedDoc, Delivery).'
    put:
      operationId: sharedPut
      summary: Edit of the shared document (P/08.9 Н1.3)
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
        - $ref: '#/components/parameters/RepeatKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SharedEdit'}
      responses:
        '412': {$ref: '#/components/responses/RevisionMoved'}
        '422': {$ref: '#/components/responses/KeyReused'}
        '408': {$ref: '#/components/responses/BodyRefused'}
        '200':
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          description: New revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SharedEdited'}
        '400': {$ref: '#/components/responses/Refused'}
        '401': {$ref: '#/components/responses/Denied'}
        '403': {$ref: '#/components/responses/Denied'}
        '409': {$ref: '#/components/responses/Refused'}
        '413': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/Refused503'}
components:
  parameters:
    XW2CViaWorker:
      name: X-W2C-Via-Worker
      in: header
      required: false
      description: '<sub>/<экземпляр> of the worker whose callback is forwarded (forwarding contract); the process trusts it only on a connection of the role domainconsole.'
      schema: {type: string}
    XW2CClient:
      name: X-W2C-Client
      in: header
      required: false
      description: >-
        TCP peer address of the client: set by the domain console when passing an edit to the process domain; the process reads it only on a
        connection of the role domainconsole, on the others it does not read it (P/08.0 Н1.8; Platform/common/contracts/forwarding.md
        «Адрес клиента»; review analysis of stage A 8–10, № 23).
      schema: {type: string, minLength: 1}
    XW2CUser:
      name: X-W2C-User
      in: header
      required: false
      description: >-
        Name proven to the gate of the cluster console (at the break-glass entry — the session name): set by the cluster console when
        forwarding POST /domain/move to the signer (P/06.7 Н1.8); the process reads it only on a connection of the console of its own
        cluster (client certificate of the role console), on the others it does not read it; the console strips one that came from outside. by of the journal entry
        domain.moved (P/08.8 Н1.8; C08-MOVED-BY-01).
      schema: {type: string, minLength: 1}
    Member:
      name: member
      in: path
      required: true
      schema: {$ref: '#/components/schemas/MemberName'}
    AgentSignature:
      name: X-Agent-Signature
      in: header
      required: true
      description: '<ms>.<base64url of 64 bytes Ed25519> over «METHOD\npath\nms\nsha256hex(body)»; window 300 s both ways — Platform/common/contracts/agent-signature.md.'
      schema: {type: string, pattern: "^(?:(0|[1-9][0-9]{0,15})\\.[A-Za-z0-9_-]{86})$"}
    Sub:
      name: sub
      in: path
      required: true
      schema: {type: string, pattern: "^(?:[a-z][a-z0-9_-]{0,31})$"}
    Rows:
      name: rows
      in: path
      required: true
      schema: {type: string, minLength: 1}
    Ref:
      name: ref
      in: path
      required: true
      schema: {type: string, minLength: 1}
    Kind:
      name: kind
      in: path
      required: true
      schema: {type: string, pattern: "^(?:[a-z][a-z0-9_-]{0,31})$"}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 200}
    RepeatKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional at this door: absent — the pass is unchanged, a repeat is a new write; present — the repeat memory (P/08.0 Н1.9; ADR-0094 B3).'
      schema: {type: string, minLength: 1, maxLength: 200}
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 'Write condition (P/08.0 Н1.9 «Версии»): revision of the row — a decimal integer ≥ 1 — or the store index in double quotes, as ETag gave it. Not equal — 412, another form — 400; the value is not part of the fingerprint of the repeat memory.'
      schema:
        type: string
        pattern: "^(?:[1-9][0-9]*|\"(?:0|[1-9][0-9]{0,19})\")$"
  headers:
    ETag:
      description: Index of the store row in double quotes, a strong tag of RFC 9110 (P/08.0 Н1.9 «Версии»). The value is fit for If-Match.
      schema:
        type: string
        pattern: "^(?:\"(?:0|[1-9][0-9]{0,19})\")$"
  responses:
    BodyRefused:
      description: 'Error reading the request body (parsing of P/01.1 Н2.1 with the deviations of P/06.5 Н2, Н4 «body»): chunked or
        short — 400, over the limit — 413, not read in full within BODY_WAIT — 408; body {detail, error: denied} (GP-L03; C08-BODY-DENIED-01); at the edit doors 413 also {detail, error: "too large"}: an edit larger than the row ceiling (P/08.6 Н1.4 row_full).
        A parsed body not in the form of the door — 400 of its own row of Н4 (Refused).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    Refused:
      description: Refusal of the door (Н4 of the chapter of the door)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    RevisionMoved:
      description: If-Match is not equal to the row version, nothing is written (P/08.0 Н1.9 «Версии»; the form of row — the table in the same place).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RevisionMoved'}
    KeyReused:
      description: 'Another body under the same Idempotency-Key: error — key reused (P/08.0 Н1.9 «Память повторов»; ADR-0094 addendum (14)).'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Refusal'}
    RefusedEdit409:
      description: 'Refusal 409 of the edit door by ref (P/08.6 Н4): Refusal — kept_full, «unit is being deleted», «the pending edits kept
        changing; ask again»; Executors — ref at two executors or more without ?cluster= (P/08.6 Н3 «принять правку» step 2а;
        ADR-0091 addendum (13) item 3, addendum (15) item 4); siblings — ref at several units of one member without ?id= (P/08.6 Н1.3 find)'
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/Refusal'
              - $ref: '#/components/schemas/Executors'
    RefusedWord:
      description: 'Refusal of the agent doors with a word (P/08.3 Н4): {error: refused, reason, detail} — at 400 not_a_publication, at 401 a word of the agent signature contract (added by the М11 reconciliation)'
      content:
        application/json:
          schema:
            unevaluatedProperties: false
            allOf:
              - $ref: '#/components/schemas/Refusal'
              - properties:
                  error: {const: refused}
                  reason: {type: string, minLength: 1}
                required: [reason, detail]
    RefusedPlain:
      description: 'Refusal of the agent doors without a word (P/08.3 Н4): {error: refused, detail} (added by the М11 reconciliation)'
      content:
        application/json:
          schema:
            unevaluatedProperties: false
            allOf:
              - $ref: '#/components/schemas/Refusal'
              - properties:
                  error: {const: refused}
                required: [detail]
    DeposedAgent:
      description: 'Deposed holder on a request of an agent or a relay — {error: deposed, holder} (P/08.8 Н1.6; added by М11/10)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Deposed'}
    TokenRefused:
      description: 'Refusal of issue (P/08.7 Н3 «выдать», Н4): {error: refused, reason, detail}; at 401 — the words of the agent signature contract; reason — from a closed list'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TokenRefusal'}
    Denied:
      description: 'Identity and grant at the door of the process (P/08.4 Н1.5): no token or it did not pass — 401, may — deny — 403; form
        {error: denied, detail} — P/06.3 Н4 denied (the gate-and-pass contract, common form Denied); nothing to check with — not 401
        and not 403, but 503 unavailable (rule «Нечитаемая строка», form Unavailable — in the 503 answer of the door)'
      content:
        application/json:
          schema: {$ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Denied'}
    Standby:
      description: 'Process domain without the turn domain/signer-turn — a standby one: {error: standby, detail} (P/08.10 Н1.7 standby; added by М11/12)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/StandbyBody'}
    StandbyOrFrozen:
      description: 'standby of the process domain (P/08.10 Н1.7) or frozen — a planned handover is under way, edits of people and of the signer are refused (P/08.8 Н1.7 order step 1)'
      content:
        application/json:
          schema:
            oneOf:
              - {$ref: '#/components/schemas/StandbyBody'}
              - {$ref: '#/components/schemas/FrozenBody'}
    StandbyOrUnavailable:
      description: 'standby of the process domain (P/08.10 Н1.7) or unavailable — a row without which the door does not answer exists, but is not
        readable: at doors with the gate — the access check row (P/08.4 Н1.5; rule «Нечитаемая строка» of the gate-and-pass
        contract); /api/login — the row of the person (P/08.4 Н1.2 check); /api/tokens — the topology (P/08.7 Н3
        «выдать» step 4а); /api/carry — the member list, the mark, the key set, the revocations (P/08.3 Н3 «принять»); /api/relay — the rows of the relay batch (P/08.3 Н3 «держатель на POST /api/relay» step 0); form Unavailable of the contract'
      content:
        application/json:
          schema:
            anyOf:
              - {$ref: '#/components/schemas/StandbyBody'}
              - {$ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'}
    StandbyFrozenOrUnavailable:
      description: 'standby of the process domain (P/08.10 Н1.7), frozen — a planned handover is under way (P/08.8 Н1.7 order step 1) or
        unavailable — nothing to check with: the access check row (at POST /domain/revoke — the key set or domain/revoked,
        no_revocations, P/08.4 Н1.2 revoke) exists, but is not readable (P/08.4 Н1.5; rule «Нечитаемая строка» of the
        gate-and-pass contract, form Unavailable)'
      content:
        application/json:
          schema:
            anyOf:
              - {$ref: '#/components/schemas/StandbyBody'}
              - {$ref: '#/components/schemas/FrozenBody'}
              - {$ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'}
    Refused503:
      description: '503 of the door (its Н3: the assignment counter was not written, edit — ref not found with an incomplete answer, or contested
        (P/08.6); names unknown (P/08.4); the former shared document is not readable (P/08.9 Н1.3 step 5); «a move is under way here
        already», «a handover is under way already» (P/08.8 Н1.7, Н1.8)), frozen (P/08.8 Н1.7) or standby of the process domain
        (P/08.10 Н1.7); at doors with an access check — also unavailable of the gate (P/08.4 Н1.5; rule «Нечитаемая строка»;
        the body passes NotStandby)'
      content:
        application/json:
          schema:
            oneOf:
              - {$ref: '#/components/schemas/StandbyBody'}
              - {$ref: '#/components/schemas/NotStandby'}
    StandbyOrExhausted:
      description: 'standby (P/08.10 Н1.7), the generation number is exhausted — {error: refused, reason: rev_exhausted, detail} (report intake contract, step 7; added by the М11 reconciliation, A18) — or unavailable: the mark is not readable, the read of the mark or of the generation is incomplete, the write did not pass before the mark (P/08.3 Н3 «принять»; Г-29, C08-ACCEPT-PARTIAL-READ-01)'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/StandbyBody'
              - unevaluatedProperties: false
                allOf:
                  - $ref: '#/components/schemas/Refusal'
                  - properties:
                      error: {const: refused}
                      reason: {const: rev_exhausted}
                    required: [reason, detail]
              - {$ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'}
    Busy:
      description: 'Busy: report intake contract «Занято» (ADR-0113): only class camera, after the signature, nothing is written'
      content:
        application/json:
          schema:
            type: object
            required: [error, retry_in]
            additionalProperties: false
            properties:
              error: {const: busy}
              retry_in: {type: number, minimum: 0}
    TooMany:
      description: 'Attempt limit (P/08.4 Н1.10)'
      headers:
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema:
            type: object
            required: [error, detail]
            additionalProperties: false
            properties:
              error: {const: too many attempts}
              detail: {type: string}
    Kept:
      description: The edit is kept until it reaches the member (P/08.6 Н1.4)
      content:
        application/json:
          schema:
            type: object
            required: [kept, cluster, what, note]
            additionalProperties: false
            properties:
              kept: {type: string, pattern: "^(?:e-[0-9a-f]{12})$"}
              cluster: {$ref: '#/components/schemas/MemberName'}
              what: {type: string}
              note: {type: string}
  schemas:
    TokenSealed:
      type: object
      required: [sealed]
      additionalProperties: false
      description: 'Answer of the token door of the holder — the token sealed to the member by an envelope m1 (domain envelopes contract «Содержимое sealed»); the relay carries it byte for byte (P/09.2)'
      properties:
        sealed: {type: string, pattern: "^(?:m1:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+)$"}
    # --- common refusal forms of the process (chapter 8.0 Н4; 8.8; 8.10) ---
    Refusal:
      type: object
      required: [error]
      additionalProperties: false
      description: 'Refusal body of a door of the process (P/08.0 Н4, Н4 of the door chapters): error — a word (refused, the words of chapters 8.4, 8.6 and 8.8, deposed,
        frozen, standby, whole too large, the words of the repeat memory P/08.0 Н1.9); the closed list by doors — data/refusal-words.tsv (P/08.0 Н4, ADR-0094 B5); detail — at refusals where the chapter names it (at the agent doors — always); reason — a word
        at the agent doors (P/08.3 Н4, P/08.7 Н4); field — JSON Pointer of the field at 400 and 409 (P/06.1 Н2), at 412 — its own schema RevisionMoved; holder — only at 409 deposed'
      properties:
        error:
          type: string
          enum:
            - refused
            - denied
            - method
            - deposed
            - frozen
            - standby
            - unavailable
            - whole too large
            - bad body
            - bad name
            - bad password
            - bad line
            - grant too wide
            - unknown subject
            - no such person
            - exists
            - being deleted
            - name taken
            - last admin
            - no such group
            - no such role
            - unknown member
            - bad batch
            - admin only
            - builtin
            - too many admins
            - roles table too large
            - admin table too large
            - password set by a non-admin
            - conflict
            - batch too large
            - too large
            - names unknown
            - no such member
            - executors
            - kept_full
            - unit is being deleted
            - the pending edits kept changing; ask again
            - this Idempotency-Key was used for another edit
            - a secret is set in the member's own cluster, never through a kept edit
            - called off
            - redo it on the new holder
            - If-Match is a unit revision
            - Idempotency-Key required
            - in flight
            - key reused
            - revision moved
            - row too large
        detail: {type: string}
        reason: {type: string}
        field: {$ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/RefusalField'}
        holder:
          $ref: '#/components/schemas/HolderRecord'
          description: 'at 409 deposed — the term record document of the new holder as an object (P/08.8 Н1.6; added by М11/10)'
    RevisionMoved:
      type: object
      required: [detail, error, field, revision]
      additionalProperties: false
      description: 'Refusal 412 of the edit doors (P/08.0 Н1.9 «Версии»); the form is the same as at the cluster console (P/06.1 Н2 «Versions»).'
      properties:
        detail: {type: string}
        error: {const: revision moved}
        field: {const: /revision}
        revision: {type: integer, minimum: 0, description: 'the current one; 0 — no row or its revision is not readable'}
        row:
          type: object
          additionalProperties: true
          description: 'the current row in the table form of P/08.0 Н1.9; carries no secrets; absent if there is no row, it is not readable, or the request row would come out heavier than the ceiling'
    Executors:
      type: object
      required: [error, detail, clusters]
      additionalProperties: false
      description: 'Body of 409 executors (P/08.6 Н1.3, Н3 step 2а; P/08.1 Н4): an edit by a ref that is, in the view, at two executors
        of the assignment or more, without ?cluster= — ?cluster=<исполнитель> is needed'
      properties:
        error: {const: executors}
        detail: {type: string}
        clusters:
          type: array
          minItems: 2
          uniqueItems: true
          items: {$ref: '#/components/schemas/MemberName'}
          description: executors at which ref is in units, ascending by UTF-8 bytes
    Deposed:
      type: object
      required: [error, holder]
      additionalProperties: false
      description: 'Refusal of a deposed holder (P/08.8 Н1.6 refusal; added by М11/10): to an agent report — without detail, to an edit and
        to a login of people — with detail «<n> held the domain at term N; <h> holds it at term M — edits go there», when its own
        term is unknown — «<n> held the domain at an earlier term; <h> holds it at term M — edits go there» (P/08.8 Н1.6; C08-DEPOSED-DETAIL-N-01)'
      properties:
        error: {const: deposed}
        detail: {type: string}
        holder: {$ref: '#/components/schemas/HolderRecord'}
    StandbyBody:
      type: object
      required: [error, detail]
      additionalProperties: false
      description: 'P/08.10 Н1.7 standby: every door of a standby process — before reading the body'
      properties:
        error: {const: standby}
        detail: {type: string, minLength: 1, description: 'the domain process of this cluster is <экземпляр> — the instance of the standby process that answered, not the holder of the turn (P/08.10 Н1.7 standby)'}
    FrozenBody:
      type: object
      required: [error, detail]
      additionalProperties: false
      description: 'A planned handover is under way; edits of people and of the signer (P/08.8 Н1.7 order step 1)'
      properties:
        error: {const: frozen}
        detail: {type: string, minLength: 1, description: '<h> is handing the domain over to <to>; edits are refused until it has — seconds, not minutes — and then go there'}
    NotStandby:
      allOf:
        - {$ref: '#/components/schemas/Refusal'}
        - {properties: {error: {not: {const: standby}}}}
    TokenRefusal:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/Refusal'
        - properties:
            error: {const: refused}
            reason:
              description: 'the words of P/08.7 Н3 «выдать»; at 401 — the words of the agent signature contract «Слова отказа» (no_signature, not_a_signature, out_of_window, bad_signature; added by run 41)'
              enum: [bad_request, by_misplaced, not_granted, assignment_unreadable, no_assignment, outside_scope,
                     unit_not_unique, not_poll_home, trigger_not_reported, no_shared_doc, no_item, no_home, no_audience,
                     no_centre, no_signature, not_a_signature, out_of_window, bad_signature]
    # --- names and values ---
    MemberName:
      type: string
      pattern: "^(?:[a-z0-9-]{1,64})$"
    BatchName:
      type: string
      description: 'Batch name (P/08.3 Н1.1б) — the grammar of a member name: the last segment of the key domain/batches/<имя>'
      pattern: "^(?:[a-z0-9-]{1,64})$"
    BatchRow:
      type: object
      description: 'Row domain/batches/<имя> (P/08.3 Н1.1б; family schema — data/batches.schema.json) as is, refused — a map fingerprint → at; unreadable — {unreadable: true}'
      additionalProperties: true
    Hex32:
      type: string
      pattern: "^(?:[0-9a-f]{64})$"
    Fingerprint:
      type: string
      pattern: "^(?:[0-9a-f]{64})$"
      description: sha256 of the DER certificate of the cluster centre (P/08.3 Н1.6).
    RequestId:
      type: string
      pattern: "^(?:[A-Za-z0-9_-]{1,64})$"
    # --- chapter 8.1: view and shadow report (served by the domain console, lesson P/10 refers to it), command view ---
    MemberState:
      type: object
      required: [name, state, age]
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/MemberName'
        class: {enum: [server, camera], description: 'Entry.class, absent — server (P/08.1 Н1.7).'}
        url: {type: string, description: 'entry address of the member, PUBLIC_URL of its environment; absent — the member is behind NAT (Н1.4)'}
        servers:
          type: array
          items:
            type: object
            required: [name]
            additionalProperties: false
            properties:
              name: {type: string, minLength: 1}
              online: {type: boolean}
              labels: {type: string}
              pulse:
                type: object
                additionalProperties: true
                description: Fields domain.view_pulse of the manifest from the heartbeat of the server worker, by subsystems.
          description: Servers of the copy by name; no copy or not a single name — no field (Н1.4).
        state:
          enum: [ok, unseen, silent, never]
        age:
          type: ['number', 'null']
          minimum: 0
          description: Seconds since the last change of the mark seen by this holder process, without a change — since the first sight; at never — null.
    Unit:
      type: object
      required: [sub, id, ref, cluster, revision, phase, age, state]
      additionalProperties: false
      properties:
        sub: {type: string, minLength: 1}
        id: {type: string, minLength: 1}
        ref: {type: string, minLength: 1}
        cluster:
          $ref: '#/components/schemas/MemberName'
        revision: {type: integer, minimum: 1}
        labels:
          type: array
          items: {type: string}
          description: Field labels of the shard row; absent — no field (Н1.4).
        about:
          type: string
          minLength: 1
          description: id of the about unit from the shard row; absent — no field (Н1.4).
        status:
          type: object
          additionalProperties: true
          description: Fields domain.view_status of the manifest from the element status[] of the heartbeat (Н1.4).
        worker: {type: string, minLength: 1}
        server: {type: string, minLength: 1}
        phase: {type: string, minLength: 1}
        age: {type: number, minimum: 0}
        state:
          enum: [live, stale, configured, silent]
        view:
          type: object
          additionalProperties: true
          description: Fields domain.view of the manifest; no secret ones. Open on purpose — the set of fields is given by the manifest of the subsystem, not by the lesson.
    MemberTable:
      type: object
      description: Snapshot of a member table (P/08.1 Н1.4а, P/04 Н1.3б).
      required: [cluster, ts, rows]
      additionalProperties: false
      properties:
        cluster:
          $ref: '#/components/schemas/MemberName'
        ts: {type: number}
        refused:
          enum: [too_large, whole_too_large]
        rows:
          type: array
          items:
            type: object
            required: [key, revision, fields]
            additionalProperties: false
            properties:
              key: {type: string, minLength: 1}
              revision: {type: integer, minimum: 1}
              fields:
                type: object
                additionalProperties: true
                description: Fields domain.view_tables of the manifest; no secrets.
              secrets:
                type: array
                items: {type: string}
                description: Names of the set *_secret fields, no values.
              labels:
                type: array
                items: {type: string}
              about: {type: string}
              worker: {type: string}
              server: {type: string}
              phase: {type: string}
              status:
                type: object
                additionalProperties: true
    View:
      type: object
      required: [as_of, holder, complete, members, units, contested]
      additionalProperties: true
      properties:
        as_of: {type: number}
        holder:
          $ref: '#/components/schemas/MemberName'
        complete: {type: boolean}
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberState'
        units:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Unit'
        contested:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              minItems: 2
              items:
                $ref: '#/components/schemas/MemberName'
      description: 'Domain view (P/08.1 Н1.4). Fields of other chapters (trust — 8.1 Н1.2а; knocking, reports — 8.1 Н1.7;
        topology, relay_refused — 8.1 Н1.6а; books — 8.5; pending, outcomes — 8.6; url — chapter P/06.7 (forwarding address); term — 8.8;
        shared — 8.9) are given by their chapters; the served view (ServedView) is closed and names them.'
    ServedView:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/View'
        - type: object
          required: [age]
          properties:
            age: {type: number, minimum: 0, description: 'field of the door of lesson P/10: seconds since as_of by the wall clock of the domain console, one digit after the point (P/10 Н1.2а; review analysis of stage B 8–10, № 22: М-7)'}
            trust: {description: 'P/08.1 Н1.2а: {rev, root, book_seal}; fingerprint — chapter 8.2 Н1.1'}
            knocking_count: {type: integer, minimum: 0, description: 'P/08.1 Н1.4б.'}
            backup_short:
              type: object
              description: 'there are cameras, but fewer have taken the copy than BACKUP_HOLDERS (P/08.8 Н1.5 new_camera)'
              required: [have, need]
              additionalProperties: false
              properties:
                have: {type: integer, minimum: 0}
                need: {type: integer, minimum: 0}
            knocking: {description: 'P/08.1 Н1.7: [knock…]'}
            reports: {description: 'P/08.1 Н1.7; via — P/08.1 Н1.6а'}
            topology: {description: P/08.1 Н1.6а}
            relay_refused: {description: P/08.1 Н1.6а}
            books: {description: P/08.5}
            pending:
              type: object
              additionalProperties:
                anyOf:
                  - {type: integer, minimum: 0}
                  - {type: 'null'}
              description: 'P/08.6 Н1.6: {<член>: <number of pending edits>} — every member of the list, 0 — no pending ones; null — the row
                of pending edits of the member is not readable (common output rule, answer of the Architect 2026-10-25 to the questions of stage 3, Г-33)'
            outcomes:
              type: object
              additionalProperties:
                type: array
                items: {$ref: '#/components/schemas/Outcome'}
              description: 'P/08.6 Н1.6: {<член>: [<исход>…]} — the row domain/outcomes/<член> by (at, id) descending'
            url: {type: string, description: 'address of the domain console (DOMAIN_CONSOLE_URL of the process domain; read by the forwarding of the cluster console — chapter P/06.7)'}
            term: {description: P/08.8 Н1.3}
            shared:
              $ref: '#/components/schemas/Delivery'
              description: 'P/08.9 Н1.6 — delivery of the shared document'
    Finding:
      type: object
      required: [kind, sub, ref, detail]
      additionalProperties: false
      properties:
        kind:
          enum: [lagging, stalled, orphaned, unmanaged, conflict, stale_epoch, unknown]
        sub: {type: string}
        ref: {type: string}
        cluster:
          $ref: '#/components/schemas/MemberName'
        worker: {type: string}
        detail: {type: string, minLength: 1}
    ShadowReport:
      type: object
      required: [counts, findings, clean_streak, may_write, why]
      additionalProperties: false
      description: Shadow report (P/08.1 Н1.6 report).
      properties:
        counts:
          type: object
          required: [lagging, stalled, orphaned, unmanaged, conflict, stale_epoch, unknown]
          additionalProperties: false
          properties:
            lagging: {type: integer, minimum: 0}
            stalled: {type: integer, minimum: 0}
            orphaned: {type: integer, minimum: 0}
            unmanaged: {type: integer, minimum: 0}
            conflict: {type: integer, minimum: 0}
            stale_epoch: {type: integer, minimum: 0}
            unknown: {type: integer, minimum: 0}
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        clean_streak: {type: integer, minimum: 0}
        may_write: {type: boolean}
        why: {type: string, minLength: 1}
    ViewInput:
      type: object
      description: 'Not HTTP: input of the command view (P/08.1 Н5; vectors vectors/view) — the passes of the holder in order.'
      required: [manifests, holder, passes]
      additionalProperties: false
      properties:
        manifests:
          type: array
          minItems: 1
          items: {type: string, enum: [testsub, testsub2]}
          description: Manifests of the catalogue from the specification data.
        holder:
          $ref: '#/components/schemas/MemberName'
        passes:
          type: array
          minItems: 1
          items:
            type: object
            required: [at, members, placements]
            additionalProperties: false
            properties:
              at:
                type: number
                minimum: 0
                description: Monotonic seconds of the holder, not wall ones; they do not decrease from pass to pass.
              members:
                type: object
                propertyNames:
                  $ref: '#/components/schemas/MemberName'
                additionalProperties:
                  type: object
                  required: [mark, objects]
                  additionalProperties: false
                  properties:
                    mark:
                      type: ['integer', 'null']
                      minimum: 1
                      maximum: 9007199254740991
                      description: rev of the mark reported (chapter 8.3 Н1.3) or null — no mark; greater than 2^53 − 1 — input not in form (code 2; added by the М11 reconciliation, V7).
                    objects:
                      type: object
                      additionalProperties: true
                      description: Objects of the copy by the keys of P/03.4 Н1.1 and P/04 Н1.3а. Open on purpose — the copy also carries families of other lessons (P/09.1 Н1.2 member_objects); the view takes the named ones.
                    silent_after:
                      type: number
                      minimum: 0
                      description: 'Silence period of the member (observation contract «Свежесть члена домена»); absent — LOST_AFTER.'
                    stale:
                      type: array
                      items: {type: string}
                      description: Field stale of the mark (chapter 8.3 Н1.3) — heartbeats that the agent of the member has not seen changing for longer than LOST_AFTER; absent — empty.
              placements:
                type: ['object', 'null']
                description: '{<sub>: {<ref>: <член> | {cluster, copies?, origin?}}} — assignments of chapter 8.6 Н1.1; a name — the same as {cluster: name, copies: []};
                  null — the assignments of this pass are not read (P/08.1 Н3 step 3а: no exception executors, the shadow report of the pass is not
                  built; ADR-0091 addendum (13) item 1, addendum (15) item 3).'
                additionalProperties:
                  type: object
                  additionalProperties:
                    unevaluatedProperties: false
                    oneOf:
                      - $ref: '#/components/schemas/MemberName'
                      - type: object
                        required: [cluster]
                        description: 'copies absent — empty (Н5; run 41)'
                        additionalProperties: false
                        properties:
                          cluster: {$ref: '#/components/schemas/MemberName'}
                          copies:
                            type: array
                            items: {$ref: '#/components/schemas/MemberName'}
                          origin:
                            $ref: '#/components/schemas/MemberName'
                            description: 'the member owning the source (chapter 8.6 Н1.1); absent — none; does not change the executors (ADR-0091 addendum (15) item 1)'
    ViewOutput:
      type: object
      description: 'Not HTTP: output of the command view (P/08.1 Н5) — the view and the shadow report of the last pass of the input.'
      required: [view, shadow]
      additionalProperties: false
      properties:
        view:
          $ref: '#/components/schemas/View'
        shadow:
          description: 'the report of the last pass that built it (P/08.1 Н1.6 unread); none built it — null'
          anyOf:
            - $ref: '#/components/schemas/ShadowReport'
            - type: 'null'
    # --- chapter 8.2: rows of the key set and of the revocations in the holder answer ---
    KeysRow:
      type: object
      required: [doc]
      additionalProperties: false
      description: 'Row domain/keys of the holder as is — domain key set contract «Набор domain/keys» (P/08.2; family keys)'
      properties:
        doc: {type: string}
    RevokedRow:
      type: object
      required: [jtis]
      additionalProperties: false
      description: 'Row domain/revoked of the holder as is — domain key set contract «Отзывы domain/revoked» (P/08.2; family revoked)'
      properties:
        jtis:
          type: string
          pattern: "^(?:([A-Za-z0-9_-]{1,64}:-?(0|[1-9][0-9]*)(\\.[0-9]+)?([eE][+-]?[0-9]+)?(,[A-Za-z0-9_-]{1,64}:-?(0|[1-9][0-9]*)(\\.[0-9]+)?([eE][+-]?[0-9]+)?)*)?)$"
          description: '"<jti>:<exp>,…"; empty — ""'
    # --- chapter 8.3: publication, holder answer, relay batch, list, topology ---
    Publication:
      type: object
      description: 'Body of POST /api/member — publication P/09.1 Н1.2 (the original of the body form; the agent — chapter 9.1). base 0 or absent — the body
        is whole; deleted — only at base > 0. Fields outside the delta (stale, tls_ca, tls_ca_certs, sign_failures, members_rev, class, batch) — any
        value: not in the form of its norm — the field is not taken, the holder journal, the report is accepted (P/08.3 Н1.2 out_of_delta, family
        member-report-delta; reconciliation of the contract with the norms of P/08, transfer of lesson 8).'
      required: [sent_at, objects, key]
      additionalProperties: false
      properties:
        sent_at: {type: number}
        objects:
          type: object
          additionalProperties: true
          description: Open on purpose — keys and values are given by member_objects (P/09.1 Н1.2) and chapters 8.3 Н1.2, 8.5, 8.8, 8.9; the holder drops the rest silently.
        base: {type: integer, minimum: 0}
        deleted:
          type: array
          items: {type: string, minLength: 1}
        key: {$ref: '#/components/schemas/Hex32'}
        keys_rev: {type: integer, minimum: 1}
        pinned: {type: string, pattern: "^(?:[0-9a-f]{16})$"}
        stale:
          description: 'Outside the delta (out_of_delta): form — [<пульс>…], heartbeats that did not change for longer than LOST_AFTER on the clock of the agent (chapter 8.3 Н1.3); not in it — the field is not taken.'
        outcomes:
          type: object
          description: 'P/08.6 Н1.5: elements of the row domain/outcomes of the member — {<id>: <исход>}, the outcome as a JSON object.'
          additionalProperties: {$ref: '#/components/schemas/Outcome'}
        tls_ca:
          description: 'Outside the delta (out_of_delta): form — a list of strings, fingerprints of ca.pem and ca.next.pem of the cluster ascending (P/08.3 Н1.6); not a list of strings — the field is not taken; length, repetition and fingerprint form are checked by the holder (on_accept), a mismatch — journal domain.member.ca.refused, the report is accepted (the decision of the Architect on the М11 reconciliation, D10).'
        tls_ca_certs:
          description: 'Outside the delta (out_of_delta): form — a list of strings, PEM of the certificates of the centres of tls_ca in the same order, sha256(DER) — the fingerprint at the same place; only together with tls_ca (P/08.3 Н1.6); not a list of strings — the field is not taken, the rest — on_accept (М11 reconciliation, D10).'
        sign_failures:
          description: 'Outside the delta (out_of_delta): form — {domain?: integer ≥ 1, console?: integer ≥ 1}, not empty — requests that the agent has not sent since start because it could not sign them (P/08.3 Н1.6а; the agent side — P/09.1 Н1.12); not in it — the field is not taken.'
        members_rev:
          description: 'Outside the delta (out_of_delta): form — {term: integer ≥ 1, rev: integer ≥ 1} of the document domain/member-list/<раздел> that the member holds (P/08.3 Н1.4а); not in it — the field is not taken.'
        gathered:
          description: 'Outside the delta: form — {term, rev} or null, the field gathered of its own section row (P/08.8 Н1.8а); not in it — the field is not taken.'
        book_parts:
          description: 'Outside the delta: form — {<sub>/<книга>: {<раздел>: {term, rev}}} (P/08.5 Н1.4); not in it — the field is not taken.'
        row:
          description: 'Outside the delta: form — {doc} of the section row by the word send_row (P/08.8 Н1.8а); not in it — the field is not taken.'
        class:
          description: 'Outside the delta: form — server | camera (P/09.1 Н1.1 domain/join); not in it — the field is not taken, server.'
        batch:
          description: 'Outside the delta: form — {name, sig}, sig — 128 hex (report intake contract «Стук партии»); not in it — the field is not taken, an ordinary knock.'
    Carry:
      type: object
      description: 'Answer of the holder to the agent (P/08.3 Н1.5). Fields of chapters 8.3 Н1.2, 8.6, 8.8, 8.9 — their norms; what is secret to the member (books
        8.5, grants and the emergency account 8.4, tokens) — in sealed.'
      required: [cluster, rev]
      additionalProperties: false
      properties:
        gone_seen:
          type: array
          items: {type: string}
          description: Links gone, the holder has no rows (chapter 8.5 Н1.8).
        folders:
          type: object
          required: [rev, folders, memberof]
          additionalProperties: false
          description: Shared folders, chapter 8.5 Н1.8.
          properties:
            rev: {type: object, required: [term, rev], additionalProperties: false, properties: {term: {type: integer}, rev: {type: integer}}}
            folders: {type: object, additionalProperties: {type: object, required: [name, parent], additionalProperties: false, properties: {name: {type: string}, parent: {type: string}}}}
            memberof: {type: object, additionalProperties: {type: array, items: {type: string}}}
        cluster: {$ref: '#/components/schemas/MemberName'}
        rev: {type: integer, minimum: 0}
        every: {type: number, minimum: 1, maximum: 3600, description: 'No field — the agent keeps the former value (report intake contract «Ответ carry: every»).'}
        keys: {$ref: '#/components/schemas/KeysRow'}
        revoked: {$ref: '#/components/schemas/RevokedRow'}
        members:
          type: object
          required: [doc]
          additionalProperties: false
          description: 'Row domain/member-rows/<раздел> (MembersDoc as text) — only to a lagging one: members_rev of the publication is absent or not equal to (term, rev) of the holder (P/08.3 Н1.4а; added by М11/12); at GET /api/carry — always; no field — no changes.'
          properties:
            doc: {type: string}
        holder:
          type: object
          required: [doc]
          additionalProperties: false
          description: 'Row domain/holder of the holder (P/08.8 Н1.1; HolderRecord as JCS text).'
          properties:
            doc: {type: string}
        sealed:
          type: string
          description: 'Envelope m1:<eph>:<nonce>:<ct> and its content — Platform/common/contracts/domain-envelopes.md.'
          pattern: "^(?:m1:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+)$"
        topology:
          type: object
          required: [doc]
          additionalProperties: false
          description: 'P/08.3 Н1.2 — row domain/topology of the holder (Topology as JCS text).'
          properties:
            doc: {type: string}
        domain_age: {type: number, minimum: 0, description: 'Added by the relay (P/09.2 Н1.4).'}
        send_row: {const: true, description: 'Send your own section row in the field row (P/08.8 Н1.8а).'}
        book_rev:
          type: object
          description: 'Versions of the heads of the books to "*" (P/08.5 Н1.4).'
          additionalProperties: {$ref: '#/components/schemas/Pair'}
        book_stale:
          type: object
          description: 'Outdated sections of the books to "*" (P/08.5 Н1.4).'
          additionalProperties: {type: array, items: {type: string}}
        placement: {$ref: '#/components/schemas/CarryPlacement'}
        pending:
          type: array
          description: 'P/08.6 Н1.4 — pending edits of this member by seq; [] — no pending ones; no field — the row was not read (C09-PENDING-ABSENT-01).'
          items: {$ref: '#/components/schemas/KeptEdit'}
        shared: {$ref: '#/components/schemas/CarryShared'}
        backup: {$ref: '#/components/schemas/CarryBackup'}
    Batch:
      type: object
      required: [relayed]
      additionalProperties: false
      description: 'Relay batch (P/09.2 Н1.4; the original of the body form — the relay of P/09.2 reads from here).'
      properties:
        relay_rev: {type: integer, minimum: 0, description: 'rev of the index that the relay holds (P/09.2 Н1.4)'}
        relayed:
          type: object
          description: 'Names — by MemberName at the writer (relay P/09.2); the holder refuses a name not by the grammar in
            refused[<name as received>], the batch lives on (P/08.3 Н3 «держатель на POST /api/relay» step 2, H1) — so the schema
            of the batch does not judge names (C08-RELAY-BATCH-FORM-01)'
          additionalProperties:
            type: object
            additionalProperties: true
            description: 'Publication (Publication; whole or a change against rev of this route). Open on purpose: a publication not in form — refused[member], not a refusal of the batch (P/08.3 Н3 «держатель на POST /api/relay» step 2).'
        knocks:
          type: object
          description: 'The writer (relay P/09.2 Н1.4 knocks) writes a knock like this: the name — MemberName, the value — {publication:
            string ≤ 256 KiB, signature: string}, without other fields; the holder skips a knock not in this form without a write,
            the batch lives on (P/08.3 Н3 step 3, H2) — so the schema of the batch does not judge knocks (C08-RELAY-BATCH-FORM-01)'
          additionalProperties: true
    RelayAnswer:
      type: object
      required: [relayed, refused]
      additionalProperties: false
      properties:
        relay_rev: {type: integer, minimum: 0}
        relay_for:
          type: array
          items: {$ref: '#/components/schemas/MemberName'}
        relayed:
          type: object
          additionalProperties: {$ref: '#/components/schemas/Carry'}
          description: Answer of the holder to every member of relay_for; rev — for the route of this relay.
        refused:
          type: object
          additionalProperties:
            unevaluatedProperties: false
            oneOf:
              - type: string
              - type: object
                required: [reason, retry_in]
                additionalProperties: false
                properties:
                  reason: {const: busy}
                  retry_in: {type: number, minimum: 0}
              - type: object
                required: [reason]
                additionalProperties: false
                properties:
                  reason: {const: send_row}
        collecting: {const: true, description: 'Gathering «from nothing» is under way (P/08.8 Н1.8а).'}
        keys:
          type: object
          additionalProperties:
            type: string
            pattern: "^(?:(?:[0-9a-f]{64})?)$"
    Entry:
      type: object
      required: [how, since]
      additionalProperties: false
      description: Member record (P/08.3 Н1.1). No class — server.
      properties:
        how:
          type: string
          pattern: "^(?:(admitted|holder|held the domain until term [1-9][0-9]*))$"
          description: 'admitted | holder | held the domain until term <N> (P/08.3 Н1.1; the last two — P/08.8 Н1.2)'
        since: {type: number}
        by: {type: string}
        key: {$ref: '#/components/schemas/Hex32'}
        revoked_keys:
          type: array
          items: {$ref: '#/components/schemas/Hex32'}
        ca:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: 'P/08.3 Н1.6: fingerprints of the centre of the member ascending.'
          items: {type: string, pattern: "^(?:[0-9a-f]{64})$"}
    MembersDoc:
      type: object
      required: [rev, term, members]
      additionalProperties: false
      description: 'Document domain/member-rows/<раздел> {rev, term, members} (P/08.3 Н1.1; term — the term of the holder that wrote the row, P/08.8 Н1.1) —
        the form of the row (family members, common.domain_members_doc; as text — Carry.members), does not serve as a door answer: the answer
        of the member doors — MembersAnswer (addition of the Architect to № 8 of the review analysis of stage B 8–10).'
      properties:
        rev: {type: integer, minimum: 1}
        term: {type: integer, minimum: 1}
        members:
          type: object
          propertyNames: {$ref: '#/components/schemas/MemberName'}
          additionalProperties: {$ref: '#/components/schemas/Entry'}
    MembersAnswer:
      type: object
      required: [rev, members]
      additionalProperties: false
      description: 'Answer 200 of the doors POST, DELETE /domain/members and POST /domain/members/{member}/ca — {rev, members}, a closed
        form (P/08.3 Н2); not MembersDoc: MembersDoc — the form of the row domain/member-rows/<раздел>, does not serve as a door answer (addition
        of the Architect to № 8 of the review analysis of stage B 8–10).'
      properties:
        rev: {type: integer, minimum: 1}
        members:
          type: object
          propertyNames: {$ref: '#/components/schemas/MemberName'}
          additionalProperties: {$ref: '#/components/schemas/Entry'}
    Knock:
      type: object
      required: [name, last, times, key, fingerprint, pinned, keys_rev, class]
      additionalProperties: false
      description: Knocker (P/08.3 Н1.1 knock).
      properties:
        name: {$ref: '#/components/schemas/MemberName'}
        last: {type: number}
        times: {type: integer, minimum: 1}
        key: {$ref: '#/components/schemas/Hex32'}
        fingerprint: {type: string, pattern: "^(?:[0-9a-f]{16})$"}
        pinned: {enum: [this, another, none]}
        keys_rev: {type: ['integer', 'null'], minimum: 1}
        class: {enum: [server, camera]}
        batch: {type: string, description: 'Batch: a knock with a correct batch signature (report intake contract «Стук партии»).'}
    MembersView:
      type: object
      required: [members, parts, knocking]
      additionalProperties: false
      description: 'Answer of GET /domain/members of the domain console (lesson P/10 Н2): a page of non-empty sections.'
      properties:
        parts:
          type: object
          additionalProperties:
            type: object
            required: [rev, term, index]
            additionalProperties: false
            properties:
              rev: {type: integer, minimum: 1}
              term: {type: integer, minimum: 1}
              index: {type: integer, minimum: 0}
        count:
          type: object
          required: [servers, cameras]
          additionalProperties: false
          properties:
            servers: {type: integer, minimum: 0}
            cameras: {type: integer, minimum: 0}
        cursor: {type: string}
        members:
          type: object
          propertyNames: {$ref: '#/components/schemas/MemberName'}
          additionalProperties: {$ref: '#/components/schemas/Entry'}
        knocking:
          type: array
          items: {$ref: '#/components/schemas/Knock'}
    Topology:
      type: object
      required: [rev, star]
      additionalProperties: false
      description: 'Document domain/topology (P/08.3 Н1.2); via only in the answer of an edit (the named members) and in the copy of a member (the member itself).'
      properties:
        rev: {type: integer, minimum: 0}
        centre: {$ref: '#/components/schemas/MemberName'}
        star:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/MemberName'}
        relays:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/MemberName'}
        via:
          type: object
          propertyNames: {$ref: '#/components/schemas/MemberName'}
          additionalProperties: {$ref: '#/components/schemas/MemberName'}
        by: {type: string}
        at: {type: number}
    TopologyEdit:
      type: object
      additionalProperties: false
      description: 'Body of PUT /domain/topology (P/08.3 Н1.2 put_order). base_rev is required only if there is no header If-Match; both present and differing — 400 (P/08.0 Н1.9 «base_rev»).'
      properties:
        base_rev: {type: integer, minimum: 0}
        centre:
          description: 'centre; "" or null removes the centre (P/08.3 Н1.2 centre; added by the М11 reconciliation, T2)'
          anyOf:
            - {$ref: '#/components/schemas/MemberName'}
            - {const: ''}
            - {type: 'null'}
        star:
          type: array
          items: {$ref: '#/components/schemas/MemberName'}
        via:
          type: object
          propertyNames: {$ref: '#/components/schemas/MemberName'}
          additionalProperties:
            description: 'relay; "" — the member leaves via (P/08.3 Н1.2 put_order)'
            anyOf:
              - {$ref: '#/components/schemas/MemberName'}
              - {const: ''}
    # --- chapter 8.4: people, grants, function may ---
    PersonName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^(?:[^\u0000- \u007F\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000:|()\"/]+)$"
      description: 'Person name (P/08.4 Н1.1): without whitespace characters (property White_Space of Unicode 15.0.0), control characters U+0000–U+001F, U+007F and : | ( ) " /; not break-glass and
        not a subject of the name index — 400 bad name by the norm, not by the schema.'
    Cap:
      enum: [view, edit, admin]
    LineCap:
      enum: [none, view, edit, admin]
      description: Rank of a grant row; none — only at a role row (P/08.4 Н1.3).
    LineSubject:
      anyOf:
        - $ref: '#/components/schemas/PersonName'
        - type: string
          pattern: "^(?:role:[^\u0000- \u007F\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000:|()\"/]{1,64})$"
      description: Person name, a subject of the name index or role:<role name> (P/08.4 Н1.3).
    SubName:
      type: string
      pattern: "^(?:[a-z][a-z0-9_-]{0,31})$"
      description: Manifest name (P/02.1 Н1.2) or platform.
    Scope:
      type: string
      pattern: "^(?:\\*|unit:[a-z][a-z0-9_-]{0,31}/[^\u000A\u000D\u2028\u2029]+|labels:[^,]+(?:,[^,]+)*|folder:[0-9a-f]{32})$"
    Line:
      type: object
      required: [subject, cap, scope, until, by]
      additionalProperties: false
      description: Grant row (P/08.4 Н1.3).
      properties:
        subject: {$ref: '#/components/schemas/LineSubject'}
        cap: {$ref: '#/components/schemas/LineCap'}
        sub: {$ref: '#/components/schemas/SubName'}
        scope: {$ref: '#/components/schemas/Scope'}
        until: {type: number, minimum: 0}
        by: {type: string}
    PersonView:
      type: object
      required: [name, how, disabled, title, expires, password_by_admin, at, by, revision, index]
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/PersonName'}
        how: {const: password}
        disabled: {type: boolean}
        title: {type: string, maxLength: 200}
        email: {type: string, maxLength: 254, description: 'Only to the domain administrator, to a manager and in the own element of the person (P/08.4 Н2).'}
        expires: {type: number, minimum: 0}
        password_by_admin: {type: boolean, description: 'The password was set by the domain administrator, not by the person (P/08.4 Н2); pw_by does not go out.'}
        at: {type: number}
        by: {type: string}
        revision: {type: integer, minimum: 0, description: 'chapter 8.0 Н1.9 «Версии»: 0 — no field or it is not readable'}
        index: {type: string, minLength: 1, description: 'store row index, from the read of this row (chapter 8.0 Н1.9)'}
    GroupView:
      type: object
      required: [name, title, comment, members, source, at, by, revision, index]
      additionalProperties: false
      description: Group row (P/08.4 Н1.3а).
      properties:
        name: {$ref: '#/components/schemas/PersonName'}
        title: {type: string, maxLength: 200}
        comment: {type: string, maxLength: 2000}
        members:
          type: array
          items: {$ref: '#/components/schemas/PersonName'}
        source: {const: local}
        at: {type: number}
        by: {type: string}
        revision: {type: integer, minimum: 0}
        index: {type: string}
    RoleAssigned:
      type: object
      required: [until]
      additionalProperties: false
      oneOf:
        - required: [person]
        - required: [group]
      properties:
        person: {$ref: '#/components/schemas/PersonName'}
        group: {$ref: '#/components/schemas/PersonName'}
        until: {type: number, minimum: 0}
    RoleView:
      type: object
      required: [name, title, comment, assigned, at, by, revision, index]
      additionalProperties: false
      description: Role row (P/08.4 Н1.3а).
      properties:
        lines:
          type: array
          items: {type: object, additionalProperties: true}
          description: Rights of the role over the whole domain (chapter 8.4 Н1.3а lines).
        lines_at: {type: number}
        name: {$ref: '#/components/schemas/PersonName'}
        title: {type: string, maxLength: 200}
        comment: {type: string, maxLength: 2000}
        assigned:
          type: array
          items: {$ref: '#/components/schemas/RoleAssigned'}
        at: {type: number}
        by: {type: string}
        revision: {type: integer, minimum: 0}
        index: {type: string}
    MayInput:
      type: object
      description: 'Not HTTP: input of the function may (may contract Platform/common/contracts/may.md; P/08.4 Н1.4; vectors common/vectors/may).'
      required: [grants, as_of, disabled, user, glass, cap, unit, now]
      additionalProperties: false
      properties:
        grants:
          unevaluatedProperties: false
          oneOf:
            - type: 'null'
            - type: object
              required: [lines]
              additionalProperties: false
              properties:
                lines:
                  type: array
                  items: {$ref: '#/components/schemas/Line'}
        anywhere:
          type: object
          additionalProperties: {type: number, minimum: 0}
          description: Summary of P/08.4 Н1.3 anywhere; only step 6 of the may contract.
        as_role: {type: string, description: 'Check of acting as a role, may contract «Действие от роли».'}
        as_of: {type: ['number', 'null']}
        disabled:
          type: array
          items: {type: string}
        user: {type: string}
        glass: {type: boolean}
        cap: {$ref: '#/components/schemas/Cap'}
        unit:
          oneOf:
            - type: 'null'
            - const: '*'
            - const: any
            - $ref: '#/components/schemas/MayUnit'
        now: {type: number}
        sub:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SubName'
        roles:
          unevaluatedProperties: false
          oneOf:
            - type: 'null'
            - const: unreadable
            - type: object
              additionalProperties:
                type: array
                items:
                  type: object
                  required: [role, until, at]
                  additionalProperties: false
                  properties:
                    role: {type: string}
                    until: {type: number, minimum: 0}
                    at: {type: number, minimum: 0}
        unread:
          oneOf:
            - const: all
            - type: array
              items:
                type: object
                required: [role]
                additionalProperties: false
                properties:
                  role: {type: string}
                  sub: {type: string}
        iat: {type: ['number', 'null']}
    MayChains:
      oneOf:
        - const: unknown
        - type: array
          items:
            type: array
            items: {type: string}
    MayUnit:
      type: object
      description: 'Not HTTP: unit of the input of the function may (contract may.md).'
      required: [sub, id, labels]
      additionalProperties: false
      properties:
        sub: {type: string}
        id: {type: string}
        labels:
          type: array
          items: {type: string}
        chains: {$ref: '#/components/schemas/MayChains'}
        about:
          unevaluatedProperties: false
          oneOf:
            - const: unknown
            - type: object
              required: [sub, id, labels]
              additionalProperties: false
              properties:
                sub: {type: string}
                id: {type: string}
                labels:
                  type: array
                  items: {type: string}
                chains: {$ref: '#/components/schemas/MayChains'}
    MayOutput:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result: {enum: [allow, deny, unavailable]}
        reason: {enum: [disabled, stale, no_grant]}
      description: 'Not HTTP: output of the function may; reason — only at deny (contract may.md; P/08.4 Н1.4)'
      if: {properties: {result: {const: deny}}}
      then: {required: [reason]}
      else: {not: {required: [reason]}}
    # --- chapter 8.6: assignment, pending edits, outcomes ---
    Placement:
      type: object
      required: [cluster, origin, copies, reason, at, rev]
      additionalProperties: false
      description: Assignment record (P/08.6 Н1.1).
      properties:
        cluster: {$ref: '#/components/schemas/MemberName'}
        origin: {type: string, description: '"" — none'}
        copies:
          type: array
          items: {$ref: '#/components/schemas/MemberName'}
        reason: {type: string}
        at: {type: number}
        rev: {type: integer, minimum: 1}
        index: {type: string, minLength: 1, description: 'store row index: only in GET /domain/placement and in row of the 412 refusal (chapter 8.0 Н1.9); in the answer to the agent the field is absent'}
    PlacementEdit:
      type: object
      required: [cluster]
      additionalProperties: false
      description: 'Body of PUT /domain/placement/{sub}/{ref} (P/08.6 Н1.1, Н2). The schema judges the outer form (400); a name of a non-member,
        including one not by the grammar of MemberName, — 409 by Н2 (C08-PLACEMENT-NAME-409-01).'
      properties:
        cluster: {type: string, minLength: 1, description: 'member (MemberName); not a member — 409'}
        origin:
          type: string
          description: 'the member owning the source; "" — remove the source (Н1.1; run 41 R41-10); non-empty and not a member — 409'
        copies:
          type: array
          uniqueItems: true
          items: {type: string, description: 'member (MemberName); not a member — 409'}
        reason: {type: string}
    CarryPlacement:
      type: object
      required: [rev, records]
      additionalProperties: false
      description: 'Field placement of the holder answer (P/08.6 Н1.2): assignments that name this member; at rev 0, at an unreadable counter or one not confirmed in this tenure (Н3) there is no field.'
      properties:
        rev: {type: integer, minimum: 1}
        records:
          type: object
          description: '{"<sub>/<ref>": record of P/08.6 Н1.1}'
          additionalProperties: {$ref: '#/components/schemas/Placement'}
    KeptEdit:
      type: object
      required: [id, seq, what, method, path, body, key, at, asked]
      additionalProperties: false
      description: Pending edit (P/08.6 Н1.4) — element of the field pending of the holder answer.
      properties:
        id: {type: string, pattern: "^(?:e-[0-9a-f]{12})$"}
        seq: {type: integer, minimum: 1, description: 'order of acceptance (P/08.6 Н1.4; run 41 R41-09)'}
        what: {type: string}
        method: {enum: [POST, PUT, DELETE]}
        path: {type: string, minLength: 1}
        body:
          type: object
          additionalProperties: true
          description: Open on purpose — fields domain.edit of the manifest (P/08.6 Н1.3); DELETE — {}.
        key: {type: string, minLength: 1, maxLength: 200}
        at: {type: number}
        base: {type: integer, minimum: 1}
        by: {type: string, description: 'the person judged by the console of the member (P/08.6 Н1.4 by)'}
        iat: {type: number}
        asked:
          type: object
          required: [method, path, body]
          additionalProperties: false
          description: 'request of the domain door, as the process accepted it (P/08.6 Н1.4; P/08.8 Н1.6 apply)'
          properties:
            method: {enum: [POST, PUT, DELETE]}
            path: {type: string, minLength: 1}
            body: {type: object, additionalProperties: true, description: Open on purpose — the body of the domain door P/08.6 Н2.}
    Outcome:
      type: object
      required: [id, status, result, at, what, kept_at]
      additionalProperties: false
      description: 'Edit outcome (P/08.6 Н1.5): element of outcomes of the publication and of the domain view.'
      properties:
        made: {type: string, description: 'id of the created unit (P/09.1 Н1.5 made)'}
        by: {type: string}
        id: {type: string, pattern: "^(?:e-[0-9a-f]{12})$"}
        status: {type: integer}
        result: {enum: [performed, conflict, refused]}
        error: {type: string}
        at: {type: number}
        what: {type: string}
        kept_at: {type: number}
    # --- chapter 8.7: token request ---
    HolderAsk:
      type: object
      required: [request_id, role, ref]
      additionalProperties: false
      description: Body of POST /api/tokens (P/08.7 Н1.3).
      properties:
        request_id: {$ref: '#/components/schemas/RequestId'}
        role: {type: string, minLength: 1}
        ref: {type: string, minLength: 1}
        by: {type: string, minLength: 1}
        revoked: {type: string, pattern: '^(?:[0-9a-f]{16})$', description: 'jti of the token that the recipient refused with the word revoked (P/08.2 Н1.6а).'}
    # --- chapter 8.8: term record, backup copy, stranded ---
    HolderRecord:
      type: object
      description: 'Document domain/holder (P/08.8 Н1.1); form — term record contract «Запись срока», types — function record step 1.'
      required: [domain, term, holder, url, at, issuer, kid, sig]
      additionalProperties: false
      properties:
        domain: {type: string}
        term: {type: integer, minimum: 1}
        holder: {$ref: '#/components/schemas/MemberName'}
        url: {type: string, minLength: 1}
        ca:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: {$ref: '#/components/schemas/Hex32'}
        at: {type: number}
        key: {$ref: '#/components/schemas/Hex32'}
        restored_from: {$ref: '#/components/schemas/Pair'}
        issuer: {$ref: '#/components/schemas/Hex32'}
        kid: {type: string, pattern: "^(?:[0-9a-f]{16})$"}
        sig: {type: string, pattern: "^(?:[A-Za-z0-9_-]+)$"}
    Pair:
      type: object
      required: [term, rev]
      additionalProperties: false
      properties:
        term: {type: integer, minimum: 1}
        rev: {type: integer, minimum: 1}
    Pointer:
      type: object
      required: [term, rev, sha256]
      additionalProperties: false
      description: 'Pointer {term, rev, sha256} — of the backup copy (P/08.8 Н1.5) and of the shared document (P/08.9 Н1.2).'
      properties:
        term: {type: integer, minimum: 1}
        rev: {type: integer, minimum: 1}
        sha256: {$ref: '#/components/schemas/Hex32'}
    CarryBackup:
      type: object
      required: [pointer, doc]
      additionalProperties: false
      description: 'Field backup of the holder answer — the copy to the keeper (P/08.8 Н1.5 carry).'
      properties:
        pointer: {$ref: '#/components/schemas/Pointer'}
        doc: {type: string}
    StrandedItem:
      type: object
      required: [path, key, value]
      additionalProperties: false
      properties:
        path: {type: string}
        key: {type: string}
        value:
          type: ['string', 'null']
          description: 'The value of the element as stored; a secret changed — "<secret: differs>"; null — the element is absent in the state of the deposed one (deletion, and for a secret); "" — an empty value (P/08.8 Н1.6 stranded; the decision of the Architect on cammeta-go М11-10 № 16).'
    # --- chapter 8.9: shared document ---
    SharedDoc:
      type: object
      required: [domain, term, rev, at, by, shared, issuer, kid, sig]
      additionalProperties: false
      description: Shared document (P/08.9 Н1.2 document).
      properties:
        domain: {type: string}
        term: {type: integer, minimum: 1}
        rev: {type: integer, minimum: 1}
        at: {type: number}
        by: {type: string}
        shared:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
            description: Values declared by domain.shared of the manifest (P/08.9 Н1.1).
        issuer: {type: string, pattern: "^(?:[0-9a-f]{64})$"}
        kid: {type: string, pattern: "^(?:[0-9a-f]{16})$"}
        sig: {type: string}
    SharedEdit:
      type: object
      required: [shared]
      additionalProperties: false
      description: 'Body of PUT /domain/shared (P/08.9 Н1.3). base_rev is required only if there is no header If-Match; both present and differing — 400 (P/08.0 Н1.9 «base_rev»).'
      properties:
        base_rev: {type: integer, minimum: 0}
        shared:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
            description: 'Names of domain.shared of the manifest → a value or null; what is allowed — the manifest (P/08.9 Н1.1), not the contract schema.'
    SharedEdited:
      type: object
      required: [term, rev, by]
      additionalProperties: false
      description: Answer 200 of PUT /domain/shared (P/08.9 Н1.3).
      properties:
        term: {type: integer, minimum: 1}
        rev: {type: integer, minimum: 1}
        by: {type: string}
    Delivery:
      type: object
      required: [term, rev, holding, behind, refused, silent, sentence]
      additionalProperties: false
      description: Delivery of the shared document — domain/view.shared (P/08.9 Н1.6).
      properties:
        term: {type: integer, minimum: 0, description: '0 before the first document (P/08.9 Н1.6 before).'}
        rev: {type: integer, minimum: 0, description: '0 before the first document (P/08.9 Н1.6 before).'}
        holding:
          type: array
          items: {type: string}
        behind:
          type: object
          additionalProperties:
            type: object
            required: [term, rev]
            additionalProperties: false
            description: 'Member without a copy — {term: 0, rev: 0}, not null (P/08.9 Н1.6).'
            properties:
              term: {type: integer, minimum: 0}
              rev: {type: integer, minimum: 0}
        refused:
          type: object
          additionalProperties: {type: string}
        silent:
          type: array
          items: {type: string}
        sentence: {type: string}
    CarryShared:
      type: object
      required: [pointer]
      additionalProperties: false
      description: 'Field shared of the holder answer (P/08.9 Н1.4 carry): the pointer always, doc — only when the copy of the member is behind.'
      properties:
        pointer: {$ref: '#/components/schemas/Pointer'}
        doc: {type: string}
