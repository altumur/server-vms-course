      responses:
        '200': {description: '{closed: true}'}
        '401': {$ref: '#/components/responses/Refused'}
        '403': {$ref: '#/components/responses/Refused'}
        '404': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/StandbyOrUnavailable'}
  /domain/batches:
    get:
      operationId: batchesRead
      summary: Admission batches (chapter 8.3 N1.1b)
      responses:
        '200':
          description: 'Rows domain/batches/* as they are, by name; there is no private key in the row (it holds the public pub); an unreadable row — {unreadable: true} under its own name'
          content:
            application/json:
              schema:
                type: object
                required: [batches]
                additionalProperties: false
                properties:
                  batches:
                    type: object
                    propertyNames: {$ref: '#/components/schemas/BatchName'}
                    additionalProperties: {$ref: '#/components/schemas/BatchRow'}
