        - {$ref: '#/components/parameters/RepeatKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: {$ref: '#/components/schemas/DomainFolderName'}
