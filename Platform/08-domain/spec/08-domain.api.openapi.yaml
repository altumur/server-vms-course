      operationId: anywhereBody
      summary: Body of the anywhere summary (chapter 8.4 N1.3)
      responses:
        '200': {$ref: '#/components/responses/HolderAnywhereResponse'}
        '429': {$ref: '#/components/responses/Busy'}
  /api/topology/{member}:
    parameters:
      - {$ref: '#/components/parameters/Member'}
      - {$ref: '#/components/parameters/AgentSignature'}
    get:
      operationId: topologyBody
      summary: Body of the member topology {doc, via} at a new sha256 of the topology field of the answer (chapter 8.3 N1.2 carry; ADR-0113 addendum (47) item 3)
      responses:
        '200': {$ref: '#/components/responses/HolderTopologyResponse'}
        '429': {$ref: '#/components/responses/Busy'}
  /domain/partial/close:
    post:
