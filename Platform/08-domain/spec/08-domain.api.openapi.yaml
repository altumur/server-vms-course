  /domain/shared:
    description: 'Глава 8.9 (08.9-domain.norms.md) Н1.3, Н2; процессу передаёт консоль домена (ADR-0032; глава 8.0 Н1.8). GET и
      HEAD отвечает консоль домена сама (урок P/10; схемы — SharedDoc, Delivery).'
    put:
      operationId: sharedPut
      summary: Правка общего документа (P/08.9 Н1.3)
      parameters:
        - $ref: '#/components/parameters/XW2CClient'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SharedEdit'}
      responses:
        '408': {$ref: '#/components/responses/BodyRefused'}
        '200':
          description: Новая ревизия
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SharedEdited'}
        '400': {$ref: '#/components/responses/Refused'}
        '401': {$ref: '#/components/responses/Denied'}
        '403': {$ref: '#/components/responses/Denied'}
        '409': {$ref: '#/components/responses/Refused'}
        '413': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/Refused503'}
components:
  parameters:
    XW2CClient:
      name: X-W2C-Client
      in: header
      required: false
      description: >-
        Адрес TCP-пира клиента: ставит консоль домена при передаче правки процессу domain; процесс читает его только на
        соединении роли domainconsole, на прочих — не читает (P/08.0 Н1.8; Platform/common/contracts/forwarding.md
        «Адрес клиента»; разбор ревью стадии A 8–10, № 23).
      schema: {type: string, minLength: 1}
    Member:
      name: member
      in: path
      required: true
      schema: {$ref: '#/components/schemas/MemberName'}
    AgentSignature:
      name: X-Agent-Signature
      in: header
      required: true
      description: '<мс>.<base64url 64 байт Ed25519> над «METHOD\npath\nмс\nsha256hex(тела)»; окно 300 с в обе стороны — Platform/common/contracts/agent-signature.md.'
      schema: {type: string, pattern: "^(?:(0|[1-9][0-9]{0,15})\\.[A-Za-z0-9_-]{86})$"}
    Sub:
      name: sub
      in: path
      required: true
      schema: {type: string, pattern: "^(?:[a-z][a-z0-9_-]{0,31})$"}
    Rows:
      name: rows
      in: path
      required: true
      schema: {type: string, minLength: 1}
    Ref:
      name: ref
      in: path
      required: true
      schema: {type: string, minLength: 1}
    Kind:
      name: kind
      in: path
      required: true
      schema: {type: string, pattern: "^(?:[a-z][a-z0-9_-]{0,31})$"}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 200}
  responses:
    BodyRefused:
      description: 'Ошибка чтения тела запроса (разбор P/01.1 Н2.1 с отступлениями P/06.5 Н2, Н4 «тело»): chunked или
        коротко — 400, больше предела — 413, не дочитано за BODY_WAIT — 408; тело {detail, error: denied} (GP-L03; C08-BODY-DENIED-01).
        Разобранное тело не по форме двери — 400 своей строки Н4 (Refused).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    Refused:
      description: Отказ двери (Н4 главы двери)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    RefusedEdit409:
      description: 'Отказ 409 двери правки по ref (P/08.6 Н4): Refusal — kept_full, «unit is being deleted», «the pending edits kept
        changing; ask again»; Executors — ref у двух исполнителей и больше без ?cluster= (P/08.6 Н3 «принять правку» шаг 2а;
        ADR-0091 доп. (13) п. 3, доп. (15) п. 4)'
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/Refusal'
              - $ref: '#/components/schemas/Executors'
    RefusedWord:
      description: 'Отказ двери агентов со словом (P/08.3 Н4): {error: refused, reason, detail} — у 400 not_a_publication, у 401 слово договора подписи агента (добавлено сверкой М11)'
      content:
        application/json:
          schema:
            unevaluatedProperties: false
            allOf:
              - $ref: '#/components/schemas/Refusal'
              - properties:
                  error: {const: refused}
                  reason: {type: string, minLength: 1}
                required: [reason, detail]
    RefusedPlain:
      description: 'Отказ двери агентов без слова (P/08.3 Н4): {error: refused, detail} (добавлено сверкой М11)'
      content:
        application/json:
          schema:
            unevaluatedProperties: false
            allOf:
              - $ref: '#/components/schemas/Refusal'
              - properties:
                  error: {const: refused}
                required: [detail]
    DeposedAgent:
      description: 'Смещённый держатель на просьбу агента или ретранслятора — {error: deposed, holder} (P/08.8 Н1.6; добавлено М11/10)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Deposed'}
    TokenRefused:
      description: 'Отказ выдачи (P/08.7 Н3 «выдать», Н4): {error: refused, reason, detail}; у 401 — слова договора подписи агента; reason — из закрытого списка'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TokenRefusal'}
    Denied:
      description: 'Личность и грант у двери процесса (P/08.4 Н1.5): токена нет или не прошёл — 401, may — deny — 403; форма
        {error: denied, detail} — P/06.3 Н4 denied (договор сторожевой и передачи, общая форма Denied); проверить нечем — не 401
        и не 403, а 503 unavailable (правило «Нечитаемая строка», форма Unavailable — в ответе 503 двери)'
      content:
        application/json:
          schema: {$ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Denied'}
    Standby:
      description: 'Процесс domain без очереди domain/signer-turn — ждущий: {error: standby, detail} (P/08.10 Н1.7 standby; добавлено М11/12)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/StandbyBody'}
    StandbyOrFrozen:
      description: 'standby процесса domain (P/08.10 Н1.7) или frozen — идёт плановая передача, правки людей и подписанта отказаны (P/08.8 Н1.7 order шаг 1)'
      content:
        application/json:
          schema:
            oneOf:
              - {$ref: '#/components/schemas/StandbyBody'}
              - {$ref: '#/components/schemas/FrozenBody'}
    StandbyOrUnavailable:
      description: 'standby процесса domain (P/08.10 Н1.7) или unavailable — строка, без которой дверь не отвечает, есть, но не
        читается: у дверей со сторожевой — строка проверки доступа (P/08.4 Н1.5; правило «Нечитаемая строка» договора
        сторожевой и передачи); /api/login — строка человека (P/08.4 Н1.2 check); /api/tokens — топология (P/08.7 Н3
        «выдать» шаг 4а); /api/carry — список членов, метка, набор, отзывы (P/08.3 Н3 «принять»); /api/relay — строки пакета (P/08.3 Н3 «держатель на POST /api/relay» шаг 0); форма Unavailable договора'
      content:
        application/json:
          schema:
            anyOf:
              - {$ref: '#/components/schemas/StandbyBody'}
              - {$ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'}
    StandbyFrozenOrUnavailable:
      description: 'standby процесса domain (P/08.10 Н1.7), frozen — идёт плановая передача (P/08.8 Н1.7 order шаг 1) или
        unavailable — проверить нечем: строка проверки доступа (у POST /domain/revoke — набор ключей или domain/revoked,
        no_revocations, P/08.4 Н1.2 revoke) есть, но не читается (P/08.4 Н1.5; правило «Нечитаемая строка» договора
        сторожевой и передачи, форма Unavailable)'
      content:
        application/json:
          schema:
            anyOf:
              - {$ref: '#/components/schemas/StandbyBody'}
              - {$ref: '#/components/schemas/FrozenBody'}
              - {$ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'}
    Refused503:
      description: '503 двери (её Н3: счётчик назначений не записался, правка — ref не найден при неполном ответе или contested
        (P/08.6); names unknown (P/08.4); прежний общий документ не читается (P/08.9 Н1.3 шаг 5); «a move is under way here
        already», «a handover is under way already» (P/08.8 Н1.7, Н1.8)), frozen (P/08.8 Н1.7) или standby процесса domain
        (P/08.10 Н1.7); у дверей с проверкой доступа — и unavailable сторожевой (P/08.4 Н1.5; правило «Нечитаемая строка»;
        тело проходит NotStandby)'
      content:
        application/json:
          schema:
            oneOf:
              - {$ref: '#/components/schemas/StandbyBody'}
              - {$ref: '#/components/schemas/NotStandby'}
    StandbyOrExhausted:
      description: 'standby (P/08.10 Н1.7), исчерпан номер поколения — {error: refused, reason: rev_exhausted, detail} (договор приёма отчёта, шаг 7; добавлено сверкой М11, A18) — или unavailable: метка не читается, чтение метки или поколения неполно, запись не прошла до метки (P/08.3 Н3 «принять»; Г-29, C08-ACCEPT-PARTIAL-READ-01)'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/StandbyBody'
              - unevaluatedProperties: false
                allOf:
                  - $ref: '#/components/schemas/Refusal'
                  - properties:
                      error: {const: refused}
                      reason: {const: rev_exhausted}
                    required: [reason, detail]
              - {$ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'}
    TooMany:
      description: 'Предел попыток (P/08.4 Н1.10)'
      headers:
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema:
            type: object
            required: [error, detail]
            additionalProperties: false
            properties:
              error: {const: too many attempts}
              detail: {type: string}
    Kept:
      description: Правка хранится до члена (P/08.6 Н1.4)
      content:
        application/json:
          schema:
            type: object
            required: [kept, cluster, what, note]
            additionalProperties: false
            properties:
              kept: {type: string, pattern: "^(?:e-[0-9a-f]{12})$"}
              cluster: {$ref: '#/components/schemas/MemberName'}
              what: {type: string}
              note: {type: string}
  schemas:
    TokenSealed:
      type: object
      required: [sealed]
      additionalProperties: false
      description: 'Ответ двери токенов держателя — токен, запечатанный члену конвертом m1 (договор конвертов домена «Содержимое sealed»); ретранслятор несёт его байт в байт (P/09.2)'
      properties:
        sealed: {type: string, pattern: "^(?:m1:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+)$"}
    # --- общие формы отказов процесса (глава 8.0 Н4; 8.8; 8.10) ---
    Refusal:
      type: object
      required: [error]
      additionalProperties: false
      description: 'Тело отказа двери процесса (P/08.0 Н4, Н4 глав двери): error — слово (refused, слова глав 8.4, 8.6 и 8.8, deposed,
        frozen, standby, whole too large); detail — у отказов, где глава его называет (у дверей агентов — всегда); reason — слово
        у дверей агентов (P/08.3 Н4, P/08.7 Н4); holder — только у 409 deposed'
      properties:
        error: {type: string, minLength: 1}
        detail: {type: string}
        reason: {type: string}
        holder:
          $ref: '#/components/schemas/HolderRecord'
          description: 'у 409 deposed — документ записи срока нового держателя как объект (P/08.8 Н1.6; добавлено М11/10)'
    Executors:
      type: object
      required: [error, detail, clusters]
      additionalProperties: false
      description: 'Тело 409 executors (P/08.6 Н1.3, Н3 шаг 2а; P/08.1 Н4): правка по ref, который в виде у двух исполнителей
        назначения и больше, без ?cluster= — нужен ?cluster=<исполнитель>'
      properties:
        error: {const: executors}
        detail: {type: string}
        clusters:
          type: array
          minItems: 2
          uniqueItems: true
          items: {$ref: '#/components/schemas/MemberName'}
          description: исполнители, у которых ref в units, по возрастанию байтов UTF-8
    Deposed:
      type: object
      required: [error, holder]
      additionalProperties: false
      description: 'Отказ смещённого держателя (P/08.8 Н1.6 refusal; добавлено М11/10): на отчёт агента — без detail, на правку и
        вход людей — с detail «<n> held the domain at term N; <h> holds it at term M — edits go there», при неизвестном
        своём сроке — «<n> held the domain at an earlier term; <h> holds it at term M — edits go there» (P/08.8 Н1.6; C08-DEPOSED-DETAIL-N-01)'
      properties:
        error: {const: deposed}
        detail: {type: string}
        holder: {$ref: '#/components/schemas/HolderRecord'}
    StandbyBody:
      type: object
      required: [error, detail]
      additionalProperties: false
      description: 'P/08.10 Н1.7 standby: каждая дверь ждущего процесса — до чтения тела'
      properties:
        error: {const: standby}
        detail: {type: string, minLength: 1, description: 'the domain process of this cluster is <экземпляр> — экземпляр ответившего ждущего процесса, не держатель очереди (P/08.10 Н1.7 standby)'}
    FrozenBody:
      type: object
      required: [error, detail]
      additionalProperties: false
      description: 'Идёт плановая передача; правки людей и подписанта (P/08.8 Н1.7 order шаг 1)'
      properties:
        error: {const: frozen}
        detail: {type: string, minLength: 1, description: '<h> is handing the domain over to <to>; edits are refused until it has — seconds, not minutes — and then go there'}
    NotStandby:
      allOf:
        - {$ref: '#/components/schemas/Refusal'}
        - {properties: {error: {not: {const: standby}}}}
    TokenRefusal:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/Refusal'
        - properties:
            error: {const: refused}
            reason:
              description: 'слова P/08.7 Н3 «выдать»; у 401 — слова договора подписи агента «Слова отказа» (no_signature, not_a_signature, out_of_window, bad_signature; добавлено прогоном 41)'
              enum: [bad_request, by_misplaced, not_granted, assignment_unreadable, no_assignment, outside_scope,
                     unit_not_unique, not_poll_home, trigger_not_reported, no_shared_doc, no_item, no_home, no_audience,
                     no_centre, no_signature, not_a_signature, out_of_window, bad_signature]
    # --- имена и значения ---
    MemberName:
      type: string
      pattern: "^(?:[a-z0-9-]{1,64})$"
    Hex32:
      type: string
      pattern: "^(?:[0-9a-f]{64})$"
    Fingerprint:
      type: string
      pattern: "^(?:[0-9a-f]{64})$"
      description: sha256 DER-сертификата центра кластера (P/08.3 Н1.6).
    RequestId:
      type: string
      pattern: "^(?:[A-Za-z0-9_-]{1,64})$"
    # --- глава 8.1: вид и теневой отчёт (отдаёт консоль домена, урок P/10 ссылается), команда view ---
    MemberState:
      type: object
      required: [name, state, age]
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/MemberName'
        state:
          enum: [ok, unseen, silent, never]
        age:
          type: ['number', 'null']
          minimum: 0
          description: Секунды с последней смены метки, которую видел этот процесс держателя, без смены — с первого взгляда; у never — null.
    Unit:
      type: object
      required: [sub, id, ref, cluster, phase, age, state]
      additionalProperties: false
      properties:
        sub: {type: string, minLength: 1}
        id: {type: string, minLength: 1}
        ref: {type: string, minLength: 1}
        cluster:
          $ref: '#/components/schemas/MemberName'
        worker: {type: string, minLength: 1}
        server: {type: string, minLength: 1}
        phase: {type: string, minLength: 1}
        age: {type: number, minimum: 0}
        state:
          enum: [live, stale, configured, silent]
        view:
          type: object
          additionalProperties: true
          description: Поля domain.view манифеста; секретных нет. Открыт намеренно — набор полей задаёт манифест подсистемы, не урок.
    View:
      type: object
      required: [as_of, holder, complete, members, units, contested]
      additionalProperties: true
      properties:
        as_of: {type: number}
        holder:
          $ref: '#/components/schemas/MemberName'
        complete: {type: boolean}
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberState'
        units:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Unit'
        contested:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              minItems: 2
              items:
                $ref: '#/components/schemas/MemberName'
      description: 'Вид домена (P/08.1 Н1.4). Поля других глав (trust — 8.1 Н1.2а; member_list, knocking, reports — 8.1 Н1.7;
        topology, relay_refused — 8.1 Н1.6а; books — 8.5; pending, outcomes — 8.6; url — глава P/06.7 (адрес пересылки); term — 8.8;
        shared — 8.9) задают их главы; отданный вид (ServedView) закрыт и называет их.'
    ServedView:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/View'
        - type: object
          required: [age]
          properties:
            age: {type: number, minimum: 0, description: 'поле двери урока P/10: секунды с as_of по стенным часам консоли домена, один знак после точки (P/10 Н1.2а; разбор ревью стадии B 8–10, № 22: М-7)'}
            trust: {description: 'P/08.1 Н1.2а: {rev, root, book_seal}; отпечаток — глава 8.2 Н1.1'}
            member_list: {description: 'P/08.1 Н1.7: {rev, members}'}
            knocking: {description: 'P/08.1 Н1.7: [knock…]'}
            reports: {description: 'P/08.1 Н1.7; via — P/08.1 Н1.6а'}
            topology: {description: P/08.1 Н1.6а}
            relay_refused: {description: P/08.1 Н1.6а}
            books: {description: P/08.5}
            pending:
              type: object
              additionalProperties:
                anyOf:
                  - {type: integer, minimum: 0}
                  - {type: 'null'}
              description: 'P/08.6 Н1.6: {<член>: <число ждущих правок>} — каждый член списка, 0 — ждущих нет; null — строка
                ждущих правок члена не читается (общее правило выдачи, ответ «Архитектора» 2026-10-25 на вопросы этапа 3, Г-33)'
            outcomes:
              type: object
              additionalProperties:
                type: array
                items: {$ref: '#/components/schemas/Outcome'}
              description: 'P/08.6 Н1.6: {<член>: [<исход>…]} — строка domain/outcomes/<член> по (at, id) убывая'
            url: {type: string, description: 'адрес консоли домена (DOMAIN_CONSOLE_URL процесса domain; читает пересылка консоли кластера — глава P/06.7)'}
            term: {description: P/08.8 Н1.3}
            shared:
              $ref: '#/components/schemas/Delivery'
              description: 'P/08.9 Н1.6 — доставка общего документа'
    Finding:
      type: object
      required: [kind, sub, ref, detail]
      additionalProperties: false
      properties:
        kind:
          enum: [lagging, stalled, orphaned, unmanaged, conflict, stale_epoch, unknown]
        sub: {type: string}
        ref: {type: string}
        cluster:
          $ref: '#/components/schemas/MemberName'
        worker: {type: string}
        detail: {type: string, minLength: 1}
    ShadowReport:
      type: object
      required: [counts, findings, clean_streak, may_write, why]
      additionalProperties: false
      description: Теневой отчёт (P/08.1 Н1.6 report).
      properties:
        counts:
          type: object
          required: [lagging, stalled, orphaned, unmanaged, conflict, stale_epoch, unknown]
          additionalProperties: false
          properties:
            lagging: {type: integer, minimum: 0}
            stalled: {type: integer, minimum: 0}
            orphaned: {type: integer, minimum: 0}
            unmanaged: {type: integer, minimum: 0}
            conflict: {type: integer, minimum: 0}
            stale_epoch: {type: integer, minimum: 0}
            unknown: {type: integer, minimum: 0}
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        clean_streak: {type: integer, minimum: 0}
        may_write: {type: boolean}
        why: {type: string, minLength: 1}
    ViewInput:
      type: object
      description: 'Не HTTP: вход команды view (P/08.1 Н5; векторы vectors/view) — проходы держателя по порядку.'
      required: [manifests, holder, passes]
      additionalProperties: false
      properties:
        manifests:
          type: array
          minItems: 1
          items: {type: string, enum: [testsub, testsub2]}
          description: Манифесты каталога из данных спецификации.
        holder:
          $ref: '#/components/schemas/MemberName'
        passes:
          type: array
          minItems: 1
          items:
            type: object
            required: [at, members, placements]
            additionalProperties: false
            properties:
              at:
                type: number
                minimum: 0
                description: Монотонные секунды держателя, не стенные; не убывают от прохода к проходу.
              members:
                type: object
                propertyNames:
                  $ref: '#/components/schemas/MemberName'
                additionalProperties:
                  type: object
                  required: [mark, objects]
                  additionalProperties: false
                  properties:
                    mark:
                      type: ['integer', 'null']
                      minimum: 1
                      maximum: 9007199254740991
                      description: rev метки reported (глава 8.3 Н1.3) или null — метки нет; больше 2^53 − 1 — вход не по форме (код 2; добавлено сверкой М11, V7).
                    objects:
                      type: object
                      additionalProperties: true
                      description: Объекты копии по ключам P/03.4 Н1.1 и P/04 Н1.3а. Открыт намеренно — копия несёт и семьи других уроков (P/09.1 Н1.2 member_objects); вид берёт названные.
                    stale:
                      type: array
                      items: {type: string}
                      description: Поле stale метки (глава 8.3 Н1.3) — пульсы, которые агент члена не видел меняющимися дольше LOST_AFTER; нет — пусто.
              placements:
                type: ['object', 'null']
                description: '{<sub>: {<ref>: <член> | {cluster, copies?, origin?}}} — назначения главы 8.6 Н1.1; имя — то же, что {cluster: имя, copies: []};
                  null — назначения этого прохода не прочитаны (P/08.1 Н3 шаг 3а: исключения executors нет, теневой отчёт прохода не
                  строится; ADR-0091 доп. (13) п. 1, доп. (15) п. 3).'
                additionalProperties:
                  type: object
                  additionalProperties:
                    unevaluatedProperties: false
                    oneOf:
                      - $ref: '#/components/schemas/MemberName'
                      - type: object
                        required: [cluster]
                        description: 'copies нет — пусто (Н5; прогон 41)'
                        additionalProperties: false
                        properties:
                          cluster: {$ref: '#/components/schemas/MemberName'}
                          copies:
                            type: array
                            items: {$ref: '#/components/schemas/MemberName'}
                          origin:
                            $ref: '#/components/schemas/MemberName'
                            description: 'член-владелец источника (глава 8.6 Н1.1); нет — нет; исполнителей не меняет (ADR-0091 доп. (15) п. 1)'
    ViewOutput:
      type: object
      description: 'Не HTTP: вывод команды view (P/08.1 Н5) — вид и теневой отчёт последнего прохода входа.'
      required: [view, shadow]
      additionalProperties: false
      properties:
        view:
          $ref: '#/components/schemas/View'
        shadow:
          description: 'отчёт последнего прохода, который его строил (P/08.1 Н1.6 unread); ни один не строил — null'
          anyOf:
            - $ref: '#/components/schemas/ShadowReport'
            - type: 'null'
    # --- глава 8.2: строки набора и отзывов в ответе держателя ---
    KeysRow:
      type: object
      required: [doc]
      additionalProperties: false
      description: 'Строка domain/keys держателя как есть — договор набора ключей домена «Набор domain/keys» (P/08.2; семья keys)'
      properties:
        doc: {type: string}
    RevokedRow:
      type: object
      required: [jtis]
      additionalProperties: false
      description: 'Строка domain/revoked держателя как есть — договор набора ключей домена «Отзывы domain/revoked» (P/08.2; семья revoked)'
      properties:
        jtis:
          type: string
          pattern: "^(?:([A-Za-z0-9_-]{1,64}:-?(0|[1-9][0-9]*)(\\.[0-9]+)?([eE][+-]?[0-9]+)?(,[A-Za-z0-9_-]{1,64}:-?(0|[1-9][0-9]*)(\\.[0-9]+)?([eE][+-]?[0-9]+)?)*)?)$"
          description: '"<jti>:<exp>,…"; пусто — ""'
    # --- глава 8.3: публикация, ответ держателя, пакет ретранслятора, список, топология ---
    Publication:
      type: object
      description: 'Тело POST /api/member — публикация P/09.1 Н1.2 (подлинник формы тела; агент — глава 9.1). base 0 или нет — тело
        целое; deleted — только при base > 0. Поля вне дельты (stale, tls_ca, tls_ca_certs, sign_failures, members_rev) — любое
        значение: не по форме своей нормы — поле не взято, журнал держателя, отчёт принят (P/08.3 Н1.2 out_of_delta, семья
        member-report-delta; сверка контракта с нормами P/08, перенос урока 8).'
      required: [sent_at, objects, key]
      additionalProperties: false
      properties:
        sent_at: {type: number}
        objects:
          type: object
          additionalProperties: true
          description: Открыт намеренно — ключи и значения задают member_objects (P/09.1 Н1.2) и главы 8.3 Н1.2, 8.5, 8.8, 8.9; прочее держатель отбрасывает молча.
        base: {type: integer, minimum: 0}
        deleted:
          type: array
          items: {type: string, minLength: 1}
        key: {$ref: '#/components/schemas/Hex32'}
        keys_rev: {type: integer, minimum: 1}
        pinned: {type: string, pattern: "^(?:[0-9a-f]{16})$"}
        stale:
          description: 'Вне дельты (out_of_delta): форма — [<пульс>…], пульсы, не менявшиеся дольше LOST_AFTER на часах агента (глава 8.3 Н1.3); не по ней — поле не взято.'
        outcomes:
          type: object
          description: 'P/08.6 Н1.5: элементы строки domain/outcomes члена — {<id>: <исход>}, исход JSON-объектом.'
          additionalProperties: {$ref: '#/components/schemas/Outcome'}
        tls_ca:
          description: 'Вне дельты (out_of_delta): форма — список строк, отпечатки ca.pem и ca.next.pem кластера по возрастанию (P/08.3 Н1.6); не список строк — поле не взято; длину, повтор и вид отпечатка проверяет держатель (on_accept), несходящееся — журнал domain.member.ca.refused, отчёт принимается (решение «Архитектора» по сверке М11, D10).'
        tls_ca_certs:
          description: 'Вне дельты (out_of_delta): форма — список строк, PEM сертификатов центров tls_ca в том же порядке, sha256(DER) — отпечаток на том же месте; только вместе с tls_ca (P/08.3 Н1.6); не список строк — поле не взято, прочее — on_accept (сверка М11, D10).'
        sign_failures:
          description: 'Вне дельты (out_of_delta): форма — {domain?: целое ≥ 1, console?: целое ≥ 1}, не пусто — запросы, которые агент с запуска не отправил, потому что не смог подписать (P/08.3 Н1.6а; сторона агента — P/09.1 Н1.12); не по ней — поле не взято.'
        members_rev:
          description: 'Вне дельты (out_of_delta): форма — {term: целое ≥ 1, rev: целое ≥ 1} документа domain/member-list, который член держит (P/08.3 Н1.4а); не по ней — поле не взято.'
    Carry:
      type: object
      description: 'Ответ держателя агенту (P/08.3 Н1.5). Поля глав 8.3 Н1.2, 8.6, 8.8, 8.9 — их нормы; секретное члену (книги
        8.5, гранты и аварийная учётка 8.4, токены) — в sealed.'
      required: [cluster, rev, every]
      additionalProperties: false
      properties:
        cluster: {$ref: '#/components/schemas/MemberName'}
        rev: {type: integer, minimum: 0}
        every: {type: number, minimum: 1, maximum: 3600}
        keys: {$ref: '#/components/schemas/KeysRow'}
        revoked: {$ref: '#/components/schemas/RevokedRow'}
        members:
          type: object
          required: [doc]
          additionalProperties: false
          description: 'Строка domain/members (MembersDoc текстом) — только отставшему: members_rev публикации нет или не равен (term, rev) держателя (P/08.3 Н1.4а; добавлено М11/12); у GET /api/carry — всегда; нет поля — без изменений.'
          properties:
            doc: {type: string}
        holder:
          type: object
          required: [doc]
          additionalProperties: false
          description: 'Строка domain/holder держателя (P/08.8 Н1.1; HolderRecord текстом JCS).'
          properties:
            doc: {type: string}
        sealed:
          type: string
          description: 'Конверт m1:<eph>:<nonce>:<ct> и его содержимое — Platform/common/contracts/domain-envelopes.md.'
          pattern: "^(?:m1:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+)$"
        topology:
          type: object
          required: [doc]
          additionalProperties: false
          description: 'P/08.3 Н1.2 — строка domain/topology держателя (Topology текстом JCS).'
          properties:
            doc: {type: string}
        domain_age: {type: number, minimum: 0, description: 'Добавляет ретранслятор (P/09.2 Н1.4).'}
        placement: {$ref: '#/components/schemas/CarryPlacement'}
        pending:
          type: array
          description: 'P/08.6 Н1.4 — ждущие правки этого члена по seq; [] — ждущих нет; поля нет — строка не прочиталась (C09-PENDING-ABSENT-01).'
          items: {$ref: '#/components/schemas/KeptEdit'}
        shared: {$ref: '#/components/schemas/CarryShared'}
        backup: {$ref: '#/components/schemas/CarryBackup'}
    Batch:
      type: object
      required: [relayed]
      additionalProperties: false
      description: 'Пакет ретранслятора (P/09.2 Н1.4; подлинник формы тела — ретранслятор P/09.2 читает отсюда).'
      properties:
        relayed:
          type: object
          description: 'Имена — по MemberName у писателя (ретранслятор P/09.2); держатель имя не по грамматике отказывает в
            refused[<имя как пришло>], пакет живёт (P/08.3 Н3 «держатель на POST /api/relay» шаг 2, H1) — поэтому схема
            пакета имён не судит (C08-RELAY-BATCH-FORM-01)'
          additionalProperties:
            type: object
            additionalProperties: true
            description: 'Публикация (Publication; целое или изменение против rev этой дороги). Открыт намеренно: публикация не по форме — refused[член], не отказ пакета (P/08.3 Н3 «держатель на POST /api/relay» шаг 2).'
        knocks:
          type: object
          description: 'Стук писатель (ретранслятор P/09.2 Н1.4 knocks) пишет так: имя — MemberName, значение — {publication:
            строка ≤ 256 KiB, signature: строка}, без иных полей; стук не по этой форме держатель пропускает без записи,
            пакет живёт (P/08.3 Н3 шаг 3, H2) — поэтому схема пакета стуков не судит (C08-RELAY-BATCH-FORM-01)'
          additionalProperties: true
    RelayAnswer:
      type: object
      required: [relay_for, relayed, refused, keys]
      additionalProperties: false
      properties:
        relay_for:
          type: array
          items: {$ref: '#/components/schemas/MemberName'}
        relayed:
          type: object
          additionalProperties: {$ref: '#/components/schemas/Carry'}
          description: Ответ держателя каждому члену relay_for; rev — для дороги этого ретранслятора.
        refused:
          type: object
          additionalProperties: {type: string}
        keys:
          type: object
          additionalProperties:
            type: string
            pattern: "^(?:(?:[0-9a-f]{64})?)$"
    Entry:
      type: object
      required: [how, since]
      additionalProperties: false
      description: Запись члена (P/08.3 Н1.1).
      properties:
        how:
          type: string
          pattern: "^(?:(admitted|holder|held the domain until term [1-9][0-9]*))$"
          description: 'admitted | holder | held the domain until term <N> (P/08.3 Н1.1; два последних — P/08.8 Н1.2)'
        since: {type: number}
        by: {type: string}
        key: {$ref: '#/components/schemas/Hex32'}
        revoked_keys:
          type: array
          items: {$ref: '#/components/schemas/Hex32'}
        ca:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: 'P/08.3 Н1.6: отпечатки центра члена по возрастанию.'
          items: {type: string, pattern: "^(?:[0-9a-f]{64})$"}
    MembersDoc:
      type: object
      required: [rev, term, members]
      additionalProperties: false
      description: 'Документ domain/members {rev, term, members} (P/08.3 Н1.1; term — срок держателя, записавшего строку, P/08.8 Н1.1) —
        форма строки (семья members, common.domain_members_doc; текстом — Carry.members), ответом двери не служит: ответ
        дверей членов — MembersAnswer (дополнение «Архитектора» к № 8 разбора ревью стадии B 8–10).'
      properties:
        rev: {type: integer, minimum: 1}
        term: {type: integer, minimum: 1}
        members:
          type: object
          propertyNames: {$ref: '#/components/schemas/MemberName'}
          additionalProperties: {$ref: '#/components/schemas/Entry'}
    MembersAnswer:
      type: object
      required: [rev, members]
      additionalProperties: false
      description: 'Ответ 200 дверей POST, DELETE /domain/members и POST /domain/members/{member}/ca — {rev, members}, закрытая
        форма (P/08.3 Н2); не MembersDoc: MembersDoc — форма строки domain/members, ответом двери не служит (дополнение
        «Архитектора» к № 8 разбора ревью стадии B 8–10).'
      properties:
        rev: {type: integer, minimum: 1}
        members:
          type: object
          propertyNames: {$ref: '#/components/schemas/MemberName'}
          additionalProperties: {$ref: '#/components/schemas/Entry'}
    Knock:
      type: object
      required: [name, last, times, key, fingerprint, pinned, keys_rev]
      additionalProperties: false
      description: Стучащийся (P/08.3 Н1.1 knock).
      properties:
        name: {$ref: '#/components/schemas/MemberName'}
        last: {type: number}
        times: {type: integer, minimum: 1}
        key: {$ref: '#/components/schemas/Hex32'}
        fingerprint: {type: string, pattern: "^(?:[0-9a-f]{16})$"}
        pinned: {enum: [this, another, none]}
        keys_rev: {type: ['integer', 'null'], minimum: 1}
    MembersView:
      type: object
      required: [rev, members, knocking]
      additionalProperties: false
      description: 'Ответ GET /domain/members консоли домена (урок P/10 Н2): {rev, members, knocking} — список и стучащиеся;
        term — необязательное поле (форма М11/3; разбор ревью стадии B 8–10, № 8).'
      properties:
        rev: {type: integer, minimum: 1}
        term: {type: integer, minimum: 1}
        members:
          type: object
          propertyNames: {$ref: '#/components/schemas/MemberName'}
          additionalProperties: {$ref: '#/components/schemas/Entry'}
        knocking:
          type: array
          items: {$ref: '#/components/schemas/Knock'}
    Topology:
      type: object
      required: [rev, star, via]
      additionalProperties: false
      description: Документ domain/topology (P/08.3 Н1.2).
      properties:
        rev: {type: integer, minimum: 0}
        centre: {$ref: '#/components/schemas/MemberName'}
        star:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/MemberName'}
        via:
          type: object
          propertyNames: {$ref: '#/components/schemas/MemberName'}
          additionalProperties: {$ref: '#/components/schemas/MemberName'}
        by: {type: string}
        at: {type: number}
    TopologyEdit:
      type: object
      required: [base_rev]
      additionalProperties: false
      description: Тело PUT /domain/topology (P/08.3 Н1.2 put_order).
      properties:
        base_rev: {type: integer, minimum: 0}
        centre:
          description: 'центр; "" или null снимает центр (P/08.3 Н1.2 centre; добавлено сверкой М11, T2)'
          anyOf:
            - {$ref: '#/components/schemas/MemberName'}
            - {const: ''}
            - {type: 'null'}
        star:
          type: array
          items: {$ref: '#/components/schemas/MemberName'}
        via:
          type: object
          propertyNames: {$ref: '#/components/schemas/MemberName'}
          additionalProperties:
            description: 'ретранслятор; "" — член уходит из via (P/08.3 Н1.2 put_order)'
            anyOf:
              - {$ref: '#/components/schemas/MemberName'}
              - {const: ''}
    # --- глава 8.4: люди, гранты, функция may ---
    PersonName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^(?:[^\u0000- \u007F\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000:|()\"/]+)$"
      description: 'Имя человека (P/08.4 Н1.1): без пробельных (свойство White_Space Unicode 15.0.0), управляющих U+0000–U+001F, U+007F и : | ( ) " /; не break-glass и
        не субъект индекса имён — 400 bad name по норме, не по схеме.'
    Cap:
      enum: [view, edit, admin]
    Scope:
      type: string
      pattern: "^(?:\\*|unit:[a-z][a-z0-9_-]{0,31}/[^\u000A\u000D\u2028\u2029]+|labels:[^,]+(?:,[^,]+)*)$"
    Line:
      type: object
      required: [subject, cap, scope, until, by]
      additionalProperties: false
      description: Строка гранта (P/08.4 Н1.3).
      properties:
        subject: {$ref: '#/components/schemas/PersonName'}
        cap: {$ref: '#/components/schemas/Cap'}
        scope: {$ref: '#/components/schemas/Scope'}
        until: {type: number, minimum: 0}
        by: {type: string}
    PersonView:
      type: object
      required: [name, how, disabled, at, by]
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/PersonName'}
        how: {const: password}
        disabled: {type: boolean}
        at: {type: number}
        by: {type: string}
    MayInput:
      type: object
      description: 'Не HTTP: вход функции may (договор права Platform/common/contracts/may.md; P/08.4 Н1.4; векторы common/vectors/may).'
      required: [grants, as_of, disabled, user, glass, cap, unit, now]
      additionalProperties: false
      properties:
        grants:
          unevaluatedProperties: false
          oneOf:
            - type: 'null'
            - type: object
              required: [lines]
              additionalProperties: false
              properties:
                lines:
                  type: array
                  items: {$ref: '#/components/schemas/Line'}
        as_of: {type: ['number', 'null']}
        disabled:
          type: array
          items: {type: string}
        user: {type: string}
        glass: {type: boolean}
        cap: {$ref: '#/components/schemas/Cap'}
        unit:
          oneOf:
            - type: 'null'
            - const: '*'
            - $ref: '#/components/schemas/MayUnit'
        now: {type: number}
    MayUnit:
      type: object
      description: 'Не HTTP: единица входа функции may (договор may.md).'
      required: [sub, id, labels]
      additionalProperties: false
      properties:
        sub: {type: string}
        id: {type: string}
        labels:
          type: array
          items: {type: string}
        about:
          type: object
          required: [sub, id, labels]
          additionalProperties: false
          properties:
            sub: {type: string}
            id: {type: string}
            labels:
              type: array
              items: {type: string}
    MayOutput:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result: {enum: [allow, deny]}
        reason: {enum: [disabled, stale, no_grant]}
      description: 'Не HTTP: вывод функции may; reason — только при deny (договор may.md; P/08.4 Н1.4)'
      if: {properties: {result: {const: allow}}}
      then: {not: {required: [reason]}}
      else: {required: [reason]}
    # --- глава 8.6: назначение, ждущие правки, исходы ---
    Placement:
      type: object
      required: [cluster, origin, copies, reason, at, rev]
      additionalProperties: false
      description: Запись назначения (P/08.6 Н1.1).
      properties:
        cluster: {$ref: '#/components/schemas/MemberName'}
        origin: {type: string, description: '"" — нет'}
        copies:
          type: array
          items: {$ref: '#/components/schemas/MemberName'}
        reason: {type: string}
        at: {type: number}
        rev: {type: integer, minimum: 1}
    PlacementEdit:
      type: object
      required: [cluster]
      additionalProperties: false
      description: 'Тело PUT /domain/placement/{sub}/{ref} (P/08.6 Н1.1, Н2). Схема судит внешнюю форму (400); имя не члена, в
        том числе не по грамматике MemberName, — 409 по Н2 (C08-PLACEMENT-NAME-409-01).'
      properties:
        cluster: {type: string, minLength: 1, description: 'член (MemberName); не член — 409'}
        origin:
          type: string
          description: 'член-владелец источника; "" — снять источник (Н1.1; прогон 41 R41-10); непустое не член — 409'
        copies:
          type: array
          uniqueItems: true
          items: {type: string, description: 'член (MemberName); не член — 409'}
        reason: {type: string}
    CarryPlacement:
      type: object
      required: [rev, records]
      additionalProperties: false
      description: 'Поле placement ответа держателя (P/08.6 Н1.2): назначения, которые называют этого члена; при rev 0, нечитаемом или неподтверждённом в этом владении счётчике (Н3) поля нет.'
      properties:
        rev: {type: integer, minimum: 1}
        records:
          type: object
          description: '{"<sub>/<ref>": запись P/08.6 Н1.1}'
          additionalProperties: {$ref: '#/components/schemas/Placement'}
    KeptEdit:
      type: object
      required: [id, seq, what, method, path, body, key, at, asked]
      additionalProperties: false
      description: Ждущая правка (P/08.6 Н1.4) — элемент поля pending ответа держателя.
      properties:
        id: {type: string, pattern: "^(?:e-[0-9a-f]{12})$"}
        seq: {type: integer, minimum: 1, description: 'порядок приёма (P/08.6 Н1.4; прогон 41 R41-09)'}
        what: {type: string}
        method: {enum: [POST, PUT, DELETE]}
        path: {type: string, minLength: 1}
        body:
          type: object
          additionalProperties: true
          description: Открыт намеренно — поля domain.edit манифеста (P/08.6 Н1.3); DELETE — {}.
        key: {type: string, minLength: 1, maxLength: 200}
        at: {type: number}
        base: {type: integer, minimum: 0}
        asked:
          type: object
          required: [method, path, body]
          additionalProperties: false
          description: 'запрос двери домена, как его принял процесс (P/08.6 Н1.4; P/08.8 Н1.6 apply)'
          properties:
            method: {enum: [POST, PUT, DELETE]}
            path: {type: string, minLength: 1}
            body: {type: object, additionalProperties: true, description: Открыт намеренно — тело двери домена P/08.6 Н2.}
    Outcome:
      type: object
      required: [id, status, result, at, what, kept_at]
      additionalProperties: false
      description: 'Исход правки (P/08.6 Н1.5): элемент outcomes публикации и вида домена.'
      properties:
        id: {type: string, pattern: "^(?:e-[0-9a-f]{12})$"}
        status: {type: integer}
        result: {enum: [performed, conflict, refused]}
        error: {type: string}
        at: {type: number}
        what: {type: string}
        kept_at: {type: number}
    # --- глава 8.7: просьба токена ---
    HolderAsk:
      type: object
      required: [request_id, role, ref]
      additionalProperties: false
      description: Тело POST /api/tokens (P/08.7 Н1.3).
      properties:
        request_id: {$ref: '#/components/schemas/RequestId'}
        role: {type: string, minLength: 1}
        ref: {type: string, minLength: 1}
        by: {type: string, minLength: 1}
    # --- глава 8.8: запись срока, резервная копия, брошенное ---
    HolderRecord:
      type: object
      description: 'Документ domain/holder (P/08.8 Н1.1); форма — договор записи срока «Запись срока», типы — функция record шаг 1.'
      required: [domain, term, holder, url, at, issuer, kid, sig]
      additionalProperties: false
      properties:
        domain: {type: string}
        term: {type: integer, minimum: 1}
        holder: {$ref: '#/components/schemas/MemberName'}
        url: {type: string, minLength: 1}
        ca:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: {$ref: '#/components/schemas/Hex32'}
        at: {type: number}
        restored_from: {$ref: '#/components/schemas/Pair'}
        issuer: {$ref: '#/components/schemas/Hex32'}
        kid: {type: string, pattern: "^(?:[0-9a-f]{16})$"}
        sig: {type: string, pattern: "^(?:[A-Za-z0-9_-]+)$"}
    Pair:
      type: object
      required: [term, rev]
      additionalProperties: false
      properties:
        term: {type: integer, minimum: 1}
        rev: {type: integer, minimum: 1}
    Pointer:
      type: object
      required: [term, rev, sha256]
      additionalProperties: false
      description: 'Указатель {term, rev, sha256} — резервной копии (P/08.8 Н1.5) и общего документа (P/08.9 Н1.2).'
      properties:
        term: {type: integer, minimum: 1}
        rev: {type: integer, minimum: 1}
        sha256: {$ref: '#/components/schemas/Hex32'}
    CarryBackup:
      type: object
      required: [pointer, doc]
      additionalProperties: false
      description: 'Поле backup ответа держателя — копия хранителю (P/08.8 Н1.5 carry).'
      properties:
        pointer: {$ref: '#/components/schemas/Pointer'}
        doc: {type: string}
    StrandedItem:
      type: object
      required: [path, key, value]
      additionalProperties: false
      properties:
        path: {type: string}
        key: {type: string}
        value:
          type: ['string', 'null']
          description: 'Значение элемента как хранится; секрет изменён — "<secret: differs>"; null — элемента нет в state смещённого (удаление, и у секрета); "" — пустое значение (P/08.8 Н1.6 stranded; решение «Архитектора» по cammeta-go М11-10 № 16).'
    # --- глава 8.9: общий документ ---
    SharedDoc:
      type: object
      required: [domain, term, rev, at, by, shared, issuer, kid, sig]
      additionalProperties: false
      description: Общий документ (P/08.9 Н1.2 document).
      properties:
        domain: {type: string}
        term: {type: integer, minimum: 1}
        rev: {type: integer, minimum: 1}
        at: {type: number}
        by: {type: string}
        shared:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
            description: Значения, объявленные domain.shared манифеста (P/08.9 Н1.1).
        issuer: {type: string, pattern: "^(?:[0-9a-f]{64})$"}
        kid: {type: string, pattern: "^(?:[0-9a-f]{16})$"}
        sig: {type: string}
    SharedEdit:
      type: object
      required: [base_rev, shared]
      additionalProperties: false
      description: Тело PUT /domain/shared (P/08.9 Н1.3).
      properties:
        base_rev: {type: integer, minimum: 0}
        shared:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
            description: 'Имена domain.shared манифеста → значение или null; что можно — манифест (P/08.9 Н1.1), не схема контракта.'
    SharedEdited:
      type: object
      required: [term, rev, by]
      additionalProperties: false
      description: Ответ 200 PUT /domain/shared (P/08.9 Н1.3).
      properties:
        term: {type: integer, minimum: 1}
        rev: {type: integer, minimum: 1}
        by: {type: string}
    Delivery:
      type: object
      required: [term, rev, holding, behind, refused, silent, sentence]
      additionalProperties: false
      description: Доставка общего документа — domain/view.shared (P/08.9 Н1.6).
      properties:
        term: {type: ['integer', 'null']}
        rev: {type: ['integer', 'null']}
        holding:
          type: array
          items: {type: string}
        behind:
          type: object
          additionalProperties:
            type: object
            required: [term, rev]
            additionalProperties: false
            description: 'Член без копии — {term: 0, rev: 0}, не null (P/08.9 Н1.6).'
            properties:
              term: {type: integer, minimum: 0}
              rev: {type: integer, minimum: 0}
        refused:
          type: object
          additionalProperties: {type: string}
        silent:
          type: array
          items: {type: string}
        sentence: {type: string}
    CarryShared:
      type: object
      required: [pointer]
      additionalProperties: false
      description: 'Поле shared ответа держателя (P/08.9 Н1.4 carry): указатель всегда, doc — только когда копия члена отстала.'
      properties:
        pointer: {$ref: '#/components/schemas/Pointer'}
        doc: {type: string}
