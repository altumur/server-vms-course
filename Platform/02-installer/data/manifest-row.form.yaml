# Семья platform/manifest/<sub> — строка манифеста подсистемы в хранилище (P/02.3; P/02.3 Н1.5). Источник формы строки (ADR-0088).
# Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md. Поле yaml — оболочка
# манифеста (ADR-0088 доп. (1) Р3): форма самих байтов — источник формы главы 2.1 (02.1-installer.form.yaml).
dialect: data-form/1
root:
  type: object
  properties:
    yaml:
      type: string
      description: байты файла манифеста как есть; загружаются по главе 2.1 (Н3 «загрузить»)
    sha256:
      ref: common.sha256_hex
      description: "дайджест байтов yaml; читатель сравнивает запись как есть — иная запись (заглавные) не совпадает: «sha256 не совпадает», не старт (Н4; ревью стадии A 2)"
    rev:
      ref: common.pos53
      whole: true
      description: десятичное целое ≥ 1 — ревизия правила; первая установка — 1, затем +1 записью с cas по строке
    shell:
      type: string
      description: "страница подсистемы (P/06.5 Н1.1) или пусто; источник — файл `<sub>.shell.html` рядом с файлом манифеста, файла нет — поле не пишется; отсутствие поля и пустое — одно «страницы нет»; МОЖЕТ отсутствовать у реализации без страниц"
  required: [yaml, sha256, rev]
  names:
    key: {type: string}
    value: {type: any, description: "лишние поля: читатель их не читает и ими не отказывает, писатель их не пишет (P/02.3 Н1.5 rules; ADR-0088 стр. 66–67; решение «Архитектора» по 1bd77782b)"}
  writer: {max_items: 0}
