# Семья <sub>/retention — срок хранения (P/02.4; форма — P/02.4 Н1.9, смысл — P/05 Н1.3 retention). Источник формы строки
# (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Пишет w2cctl retention -days.
dialect: data-form/1
root:
  type: object
  properties:
    days:
      type: number
      exclusive_minimum: 0
      description: "дни; конечное число > 0; строки нет — умолчание 365; иное — «не известно», ничего не убирать (ADR-0076)"
  required: [days]
