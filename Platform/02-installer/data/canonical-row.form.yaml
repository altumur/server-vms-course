# Семья platform/spec/<sub>/canonical/<форма> — строка канонического вида спеки (P/02.2; P/02.2 Н1.2). Источник формы
# строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md.
# Форма самого spec — схема, построенная из источника формы главы 2.1 (ADR-0089 п. 3), не эта схема.
dialect: data-form/1
root:
  type: object
  properties:
    form:
      type: string
      pattern: '[1-9][0-9]*'
      description: номер формы вида; сейчас 1
    rev:
      type: string
      pattern: '[1-9][0-9]*'
      description: rev строки спеки, из которой вид построен (P/02.3 Н1.5)
    sha256:
      ref: common.sha256_hex
      description: sha256 строки спеки
    spec:
      type: string
      description: байты вида текстом — JCS, UTF-8 (P/02.2 Н1.1); проверяется построенной схемой вида
  required: [form, rev, sha256, spec]
  names:
    key: {type: string}
    value: {type: any, description: "лишние поля: читатель их не читает и ими не отказывает, писатель их не пишет (терпимый читатель, как строка спеки P/02.3 Н1.5)"}
  writer: {max_items: 0}
