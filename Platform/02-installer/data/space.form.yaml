# Семья platform/space — отметки диска (P/02.4; форма — P/02.4 Н1.9, смысл — P/05 Н1.4 space). Источник формы строки
# (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md.
dialect: data-form/1
root:
  type: object
  properties:
    enabled:
      type: boolean
      description: "false — ресурс снимает свою строку free-* (E45); строки нет — включено с порогами 0.85/0.75"
    high:
      type: number
      minimum: 0
      maximum: 1
      description: доля used/total, выше которой ресурс просит освободить; умолчание 0.85
    low:
      type: number
      minimum: 0
      maximum: 1
      description: доля, до которой просят освободить; умолчание 0.75
