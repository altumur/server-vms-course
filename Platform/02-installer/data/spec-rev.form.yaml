# Семья platform/spec/<sub>/rev — метка ревизии спеки (P/02.3; P/02.3 Н1.5). Источник формы строки (ADR-0088).
# Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md.
dialect: data-form/1
root:
  type: object
  properties:
    rev:
      type: string
      pattern: '[1-9][0-9]*'
      description: то же число, что rev строки; пишется после строки, никогда не понижается
    sha256:
      ref: common.sha256_hex
      description: тот же дайджест, что у строки
  required: [rev, sha256]
  names:
    key: {type: string}
    value: {type: any, description: "лишние поля: читатель их не читает и ими не отказывает, писатель их не пишет (P/02.3 Н1.5 rules; ADR-0088 стр. 66–67; решение «Архитектора» по 1bd77782b)"}
  writer: {max_items: 0}
