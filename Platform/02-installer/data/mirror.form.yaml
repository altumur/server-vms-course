# Семья platform/mirror — зеркало закрытых бакетов и тел (P/02.4; форма — P/02.4 Н1.9, смысл — P/05 Н1.4 mirror, М10/10
# Н1.5 mirror). Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога.
dialect: data-form/1
root:
  type: object
  properties:
    enabled:
      type: boolean
      description: копировать закрытые бакеты событий соседям; тела зеркалируются всегда, независимо от enabled (P/05 Н1.1 «Тела у ресурса»)
    copies:
      ref: common.uint53
      description: соседей — следующие copies живых серверов по имени; строки нет или не читается — 1 (P/05 Н1.1 «Тела у ресурса» mirror)
