# A table field's credentials.login names the undeclared nouser field; M10/2 N1.4, P/06.2 N1.1; references.tsv row 22
name: probe
unit: {rows: counters, id: numeric}
placement: {capacity: {default: 4}}
tables:
  notes:
    key: name
    fields:
      name: {type: string, required: true}
      feed: {type: url, credentials: {login: nouser, secret: feed_secret}}
      feed_user: {type: string}
      feed_secret: {type: string}
worker: {exec: /usr/lib/probe/worker}
