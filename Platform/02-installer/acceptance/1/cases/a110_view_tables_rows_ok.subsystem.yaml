# Unit rows and the places table in the snapshot (P/04 N1.3b)
name: probe
unit: {rows: things, id: name, fields: {name: {type: string, required: true}}}
placement:
  capacity: {default: 1}
  places: {table: disks}
tables: {disks: {fields: {note: {type: string}}}}
worker: {exec: /usr/lib/probe/worker}
domain: {view_tables: {things: [name], disks: [note, held_by]}}
