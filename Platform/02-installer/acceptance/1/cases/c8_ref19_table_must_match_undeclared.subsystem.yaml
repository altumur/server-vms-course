# A table field's must_match names its undeclared field nozone; M10/2 N1.4, P/06.1 N1.3; references.tsv row 19
name: probe
unit: {rows: counters, id: numeric}
placement: {capacity: {default: 4}}
tables:
  notes:
    key: name
    fields:
      name: {type: string, required: true}
      shelf: {type: string, ref: probe/shelves, must_match: {zone: nozone}}
      zone: {type: string}
worker: {exec: /usr/lib/probe/worker}
