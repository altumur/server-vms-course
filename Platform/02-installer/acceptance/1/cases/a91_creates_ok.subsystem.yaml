# worker.creates targets another subsystem; key substitutions use a dash, ADR-0091 item 1 (addendum 5: no valid_for)
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
worker:
  exec: /usr/lib/probe/worker
  creates:
  - {sub: other, rows: things, key: '{cam}-{kind}'}
