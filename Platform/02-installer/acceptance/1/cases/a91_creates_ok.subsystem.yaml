# worker.creates к другой подсистеме, key — подстановки через «-», ADR-0091 п. 1 (доп. 5: без valid_for)
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
worker:
  creates:
  - {sub: other, rows: things, key: '{cam}-{kind}'}
