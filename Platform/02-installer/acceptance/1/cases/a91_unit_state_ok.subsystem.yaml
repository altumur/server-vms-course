# unit.state and a snapshot with state.<name>, retire_when by state with delete_after; ADR-0091 item 3; P/02.1 N1.2a
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
  state:
    result: {type: object, properties: {state: {type: string}}}
placement:
  capacity: {default: 4}
  retire_when: {state: result, field: state, in: [done, failed], delete_after: 600}
snapshot: [name, state.result]
worker: {exec: /usr/lib/probe/worker}
