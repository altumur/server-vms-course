# worker.exec: an absolute path and words separated by single spaces, using permitted characters; ADR-0091 addendum (5) item 2
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
worker: {exec: '/usr/lib/probe/worker --mode=a,b +x @y:z ^w_1.2'}
