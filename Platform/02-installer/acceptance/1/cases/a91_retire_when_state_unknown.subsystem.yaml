# retire_when.state is not a unit.state name; references.tsv row 36
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
  state:
    result: {type: object, properties: {state: {type: string}}}
placement:
  capacity: {default: 4}
  retire_when: {state: nope, field: state, in: [done]}
worker: {exec: /usr/lib/probe/worker}
