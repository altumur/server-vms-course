# Nested targets and steps (the gate and pass contract, names; ADR-0105 item 4)
name: probe
unit: {rows: things, id: name, fields: {name: {type: string, required: true}, when: {type: json}, then: {type: json}}}
placement: {capacity: {default: 1}}
worker: {exec: /usr/lib/probe/worker}
rights:
  names:
    - {field: when, at: "target.include[]", unit: id, kind: kind, kinds: {device: {of: cam}, child: {of: cam, table: children}, folder: {folder: true}, server: {server: true}}}
    - {field: then, at: "target.include[]", walk: ["yes", "no"], quiet: [control], action: action, unit: id, kind: kind, kinds: {device: {of: cam}, child: {of: cam, table: children}, folder: {folder: true}, server: {server: true}}}
    - {field: then, at: "event.target.include[]", walk: ["yes", "no"], unit: id, kind: kind, kinds: {device: {of: cam}}}
