# Two worker.creates entries for one subsystem; references.tsv row 90
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
worker:
  exec: /usr/lib/probe/worker
  creates:
  - {sub: other, rows: things, key: '{cam}'}
  - {sub: other, rows: things, key: '{kind}'}
