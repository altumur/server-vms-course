# два worker.creates к одной подсистеме; строка 90 references.tsv
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
worker:
  creates:
  - {sub: other, rows: things, key: '{cam}', valid_for: 60}
  - {sub: other, rows: things, key: '{kind}', valid_for: 60}
