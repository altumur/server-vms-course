# одиночная } в умолчании string при unit.id numeric; строка 124 references.tsv
name: probe
unit:
  rows: counters
  id: numeric
  fields:
    name: {type: string, required: true}
    label: {type: string, default: 'cam{id}}'}
placement:
  capacity: {default: 4}
worker: {exec: /usr/lib/probe/worker}
