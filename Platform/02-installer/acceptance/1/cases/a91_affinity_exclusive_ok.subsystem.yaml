# affinity.exclusive beside strict; ADR-0091 addendum (10) item 1
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
    shelf: {type: string}
placement:
  capacity: {default: 4}
  affinity: {field: shelf, table: shelves, server_field: server, strict: {kind: [reserve]}, exclusive: true}
worker: {exec: /usr/lib/probe/worker}
tables:
  shelves:
    key: name
    fields:
      name: {type: string, required: true}
      server: {type: string}
      kind: {type: string}
