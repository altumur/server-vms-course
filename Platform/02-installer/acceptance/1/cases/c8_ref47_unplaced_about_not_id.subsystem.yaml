# delete_after with about.field other than id is accepted: ADR-0091 item 1 removed row 47 (ADR-0067 correction 2026-10-10: physical deletion applies only to
# rows with made, not manual rows); parent is fixed so about.field matches the form (formerly a row 47 case)
name: probe
unit: {rows: things, id: name, fields: {name: {type: string, fixed: true}, parent: {type: string, fixed: true}}}
placement: {capacity: {default: 1}, unplaced: {delete_after: 30}}
about: {sub: cam, field: parent}
worker: {exec: /usr/lib/probe/worker}
