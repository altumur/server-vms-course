# snapshot names state.<name> outside unit.state; references.tsv row 28; ADR-0091 item 3
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
  state:
    result: {type: object, properties: {state: {type: string}}}
placement:
  capacity: {default: 4}
snapshot: [name, state.nope]
worker: {exec: /usr/lib/probe/worker}
