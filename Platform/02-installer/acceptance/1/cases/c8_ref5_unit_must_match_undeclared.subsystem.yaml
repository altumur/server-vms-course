# A unit field must_match names the undeclared nozone field; M10/2 N1.4, P/06.1 N1.3; references.tsv row 5
name: probe
unit:
  rows: counters
  id: numeric
  fields:
    shelf: {type: string, ref: probe/shelves, must_match: {zone: nozone}}
    zone: {type: string}
placement: {capacity: {default: 4}}
worker: {exec: /usr/lib/probe/worker}
