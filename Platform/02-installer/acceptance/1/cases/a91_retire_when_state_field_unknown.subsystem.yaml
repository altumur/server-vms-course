# retire_when.field is not a field of state retire_when.state; references.tsv row 35
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
  state:
    result: {type: object, properties: {state: {type: string}}}
placement:
  capacity: {default: 4}
  retire_when: {state: result, field: nope, in: [done]}
worker: {exec: /usr/lib/probe/worker}
