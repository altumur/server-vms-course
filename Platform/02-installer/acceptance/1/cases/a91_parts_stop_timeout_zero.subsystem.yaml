# parts.<part>.stop_timeout 0 is below 1; ADR-0091 addendum (3) item 4
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
parts:
  pump: {exec: /usr/lib/probe/pump, stop_timeout: 0}
worker: {exec: /usr/lib/probe/worker}
