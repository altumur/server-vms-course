# stale is allowed only on a book with to: "*" (relation 157)
name: probe
unit: {rows: things, id: name, fields: {name: {type: string, required: true}}}
placement: {capacity: {default: 1}}
worker: {exec: /usr/lib/probe/worker}
domain:
  books:
    asks: {from: probe/asks/, key: target, pick: all, to: whom, stale: true}
