# placement.places.table называет таблицу с delete_after; строка 126 связей (ADR-0094 шаг 3б; решение «Архитектора» 2026-10-31)
name: probe
unit: {rows: things, id: numeric}
placement:
  capacity: {default: 1}
  place_by: disk
  places: {table: disks}
tables: {disks: {fields: {server: {type: string}}, delete_after: 60}}
worker: {exec: /usr/lib/probe/worker}
