# placement.places.table names a table with delete_after; relation 126 (ADR-0094 step 3b; Architect decision 2026-10-31)
name: probe
unit: {rows: things, id: numeric}
placement:
  capacity: {default: 1}
  place_by: disk
  places: {table: disks}
tables: {disks: {fields: {server: {type: string}}, delete_after: 60}}
worker: {exec: /usr/lib/probe/worker}
