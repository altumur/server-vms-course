# key worker.creates с :int — отказ: усечение склеивает значения; ADR-0091 п. 1
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
worker:
  exec: /usr/lib/probe/worker
  creates:
  - {sub: other, rows: things, key: '{cam}-{from:int}'}
