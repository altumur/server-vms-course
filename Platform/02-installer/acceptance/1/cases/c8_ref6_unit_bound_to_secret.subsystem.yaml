# bound_to поля единицы называет объявленное поле-секрет other_secret; норма М10/2 Н1.2а bound_to, Н1.4, P/06.2 Н1.1; строка 6 references.tsv
name: probe
unit:
  rows: counters
  id: numeric
  fields:
    feed: {type: url}
    other_secret: {type: string}
    feed_secret: {type: string, bound_to: other_secret}
placement: {capacity: {default: 4}}
worker: {exec: /usr/lib/probe/worker}
