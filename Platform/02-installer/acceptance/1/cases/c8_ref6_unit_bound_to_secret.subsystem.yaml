# A unit field bound_to names the declared secret field other_secret; M10/2 N1.2a bound_to, N1.4, P/06.2 N1.1; references.tsv row 6
name: probe
unit:
  rows: counters
  id: numeric
  fields:
    feed: {type: url}
    other_secret: {type: string}
    feed_secret: {type: string, bound_to: other_secret}
placement: {capacity: {default: 4}}
worker: {exec: /usr/lib/probe/worker}
