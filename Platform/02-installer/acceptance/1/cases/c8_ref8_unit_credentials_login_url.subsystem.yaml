# credentials.login поля единицы называет объявленное поле типа url; норма М10/2 Н1.2а credentials, Н1.4, P/06.2 Н1.1; строка 8 references.tsv
name: probe
unit:
  rows: counters
  id: numeric
  fields:
    feed: {type: url, credentials: {login: mirror, secret: feed_secret}}
    mirror: {type: url}
    feed_secret: {type: string}
placement: {capacity: {default: 4}}
worker: {exec: /usr/lib/probe/worker}
