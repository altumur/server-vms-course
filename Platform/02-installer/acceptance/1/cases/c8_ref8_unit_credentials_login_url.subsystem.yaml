# A unit field's credentials.login names a declared url field; M10/2 N1.2a credentials, N1.4, P/06.2 N1.1; references.tsv row 8
name: probe
unit:
  rows: counters
  id: numeric
  fields:
    feed: {type: url, credentials: {login: mirror, secret: feed_secret}}
    mirror: {type: url}
    feed_secret: {type: string}
placement: {capacity: {default: 4}}
worker: {exec: /usr/lib/probe/worker}
