# credentials.secret поля единицы называет необъявленное поле nofeed_secret; норма М10/2 Н1.4, P/06.2 Н1.1; строка 9 references.tsv
name: probe
unit:
  rows: counters
  id: numeric
  fields:
    feed: {type: url, credentials: {login: feed_user, secret: nofeed_secret}}
    feed_user: {type: string}
    feed_secret: {type: string}
placement: {capacity: {default: 4}}
worker: {exec: /usr/lib/probe/worker}
