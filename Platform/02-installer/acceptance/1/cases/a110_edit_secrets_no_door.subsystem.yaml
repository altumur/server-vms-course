# The table secret has no door: its table is not in edit_tables
name: probe
unit: {rows: things, id: name, fields: {name: {type: string, required: true}}}
placement: {capacity: {default: 1}}
worker: {exec: /usr/lib/probe/worker}
tables: {disks: {fields: {note: {type: string}, key_secret: {type: string}}}}
domain: {edit_secrets: {disks: [key_secret]}}
