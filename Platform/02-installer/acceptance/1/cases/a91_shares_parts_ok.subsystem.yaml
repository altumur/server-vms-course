# shares and parts: a part share uses the part user group; ADR-0091 item 5
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
shares:
  belt: {kind: socket}
  pump: {kind: dir, part: pump}
parts:
  pump: {exec: /usr/lib/probe/pump}
worker: {exec: /usr/lib/probe/worker}
