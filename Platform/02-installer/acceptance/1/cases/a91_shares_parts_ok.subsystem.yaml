# shares и parts; доля части — группа пользователя части; ADR-0091 п. 5
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
shares:
  belt: {kind: socket}
  pump: {kind: dir}
parts:
  pump: {exec: /usr/lib/probe/pump}
worker: {exec: /usr/lib/probe/worker}
