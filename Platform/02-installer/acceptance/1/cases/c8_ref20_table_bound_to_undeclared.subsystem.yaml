# A table field bound_to string names the undeclared nofeed field; M10/2 N1.4, P/06.2 N1.1; references.tsv row 20
name: probe
unit: {rows: counters, id: numeric}
placement: {capacity: {default: 4}}
tables:
  notes:
    key: name
    fields:
      name: {type: string, required: true}
      feed: {type: url}
      feed_secret: {type: string, bound_to: nofeed}
worker: {exec: /usr/lib/probe/worker}
