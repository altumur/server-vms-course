# A table field default is outside its enum; M10/2 N1.2a default; references.tsv row 24
name: probe
unit: {rows: counters, id: numeric}
placement: {capacity: {default: 4}}
tables:
  notes:
    key: name
    fields:
      name: {type: string, required: true}
      kind: {type: string, enum: [a, b], default: c}
worker: {exec: /usr/lib/probe/worker}
