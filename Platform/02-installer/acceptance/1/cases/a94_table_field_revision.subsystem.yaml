# поле таблицы revision — поле платформы строки таблицы; P/06.1 Н1.6 field_names, ADR-0094 B4
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
tables:
  shelves:
    key: name
    fields:
      name: {type: string, required: true}
      revision: {type: string}
placement:
  capacity: {default: 4}
worker: {exec: /usr/lib/probe/worker}
