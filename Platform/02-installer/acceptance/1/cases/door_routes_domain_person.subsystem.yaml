# person is not a domain.tokens kind (the kind grammar); ADR-0091 addenda (14) item 1 and (19) item 1
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
worker: {exec: /usr/lib/probe/worker}
door:
  routes: [{name: feed, domain: [person]}]
