# Tables and secrets in a stored edit (P/08.6 N1.3, N1.3a)
name: probe
unit: {rows: things, id: name, fields: {name: {type: string, required: true}, key_secret: {type: string}}}
placement: {capacity: {default: 1}}
worker: {exec: /usr/lib/probe/worker}
tables: {disks: {fields: {note: {type: string}, url_secret: {type: string}}}, stash: {fields: {note: {type: string}}, service: true}}
domain: {edit_tables: {disks: [note]}, edit_secrets: {disks: [url_secret], things: [key_secret]}}
