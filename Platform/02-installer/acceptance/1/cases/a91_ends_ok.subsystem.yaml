# placement.ends uses a float field; never defaults to 0; ADR-0091 item 2
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
    until: {type: float, default: 0}
placement:
  capacity: {default: 4}
  ends: {field: until}
worker: {exec: /usr/lib/probe/worker}
