# A unit field bound_to string names the undeclared nofeed field; M10/2 N1.4, P/06.2 N1.1; references.tsv row 6
name: probe
unit:
  rows: counters
  id: numeric
  fields:
    feed: {type: url}
    feed_secret: {type: string, bound_to: nofeed}
placement: {capacity: {default: 4}}
worker: {exec: /usr/lib/probe/worker}
