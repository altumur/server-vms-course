# worker.uses: its own share without part; references.tsv row 91, ADR-0091 addendum (2) item 4
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
worker:
  exec: /usr/lib/probe/worker
  uses: [probe.belt]
shares:
  belt: {kind: socket}
