# Another substitution {x} in a string default with unit.id numeric: a closed spelling without escapes; references.tsv row 124
name: probe
unit:
  rows: counters
  id: numeric
  fields:
    name: {type: string, required: true}
    label: {type: string, default: 'cam{x}'}
placement:
  capacity: {default: 4}
worker: {exec: /usr/lib/probe/worker}
