# stale is a platform word in view pulse.<sub>; it cannot name a heartbeat field (P/08.1 N1.4)
name: probe
unit: {rows: things, id: name, fields: {name: {type: string, required: true}}}
placement: {capacity: {default: 1}}
worker: {exec: /usr/lib/probe/worker}
domain: {ref: name, view_pulse: [stale]}
