# A table and heartbeat fields in the domain view (P/08.1 N1.4, N1.4a)
name: probe
unit: {rows: things, id: name, fields: {name: {type: string, required: true}}}
placement: {capacity: {default: 1}}
worker: {exec: /usr/lib/probe/worker}
tables: {disks: {fields: {note: {type: string}, url: {type: string}}}}
domain: {view_status: [jam], view_tables: {disks: [note, url]}}
