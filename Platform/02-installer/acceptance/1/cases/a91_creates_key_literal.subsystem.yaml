# worker.creates key has a literal other than '-' between substitutions; ADR-0091 item 1
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
worker:
  exec: /usr/lib/probe/worker
  creates:
  - {sub: other, rows: things, key: 'cam{cam}'}
