# credentials.secret поля единицы называет объявленное несекретное поле feed_user; норма М10/2 Н1.2а credentials, Н1.4, P/06.2 Н1.1; строка 9 references.tsv
name: probe
unit:
  rows: counters
  id: numeric
  fields:
    feed: {type: url, credentials: {login: feed_user, secret: feed_user}}
    feed_user: {type: string}
placement: {capacity: {default: 4}}
worker: {exec: /usr/lib/probe/worker}
