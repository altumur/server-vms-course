# A unit field credentials.secret names the declared non-secret feed_user field; M10/2 N1.2a credentials, N1.4, P/06.2 N1.1; references.tsv row 9
name: probe
unit:
  rows: counters
  id: numeric
  fields:
    feed: {type: url, credentials: {login: feed_user, secret: feed_user}}
    feed_user: {type: string}
placement: {capacity: {default: 4}}
worker: {exec: /usr/lib/probe/worker}
