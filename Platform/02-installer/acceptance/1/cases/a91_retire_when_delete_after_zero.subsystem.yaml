# retire_when.delete_after is not an integer >= 1; P/02.1 N1.2a, ADR-0091 item 1
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
    stage: {type: string}
placement:
  capacity: {default: 4}
  retire_when: {field: stage, in: [done], delete_after: 0}
worker: {exec: /usr/lib/probe/worker}
