# shares.<share>.part is not in parts; references.tsv row 121
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
shares:
  pump: {kind: socket, part: pumps}
parts:
  pump: {exec: /usr/lib/probe/pump}
worker: {exec: /usr/lib/probe/worker}
