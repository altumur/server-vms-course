# door.routes: {name} is token admission, {name, domain}, {name, role, domain}; kinds are checked against the catalogue (N3), not by the loader; ADR-0091 addendum (14) item 1
# probe and tally are declared by the manifest-put stand testsub (ACC-CORPUS-DOOR-DOMAIN-KIND-01)
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
worker: {exec: /usr/lib/probe/worker}
door:
  routes: [read, {name: plain}, {name: feed, domain: [probe, tally]}, {name: archive, role: [recworker], domain: [tally]}]
