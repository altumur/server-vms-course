# доля с part, своя доля части в worker.uses; ADR-0091 доп. (2) п. 4
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
worker:
  exec: /usr/lib/probe/worker
  uses: [probe.pump]
shares:
  pump: {kind: socket, part: pump}
parts:
  pump: {exec: /usr/lib/probe/pump}
