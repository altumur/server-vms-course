# worker.stop_timeout at the CLOSE_BY upper bound 50, parts.<part>.stop_timeout at the lower bound 1; ADR-0091 addendum (3) item 4
name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 4}
worker:
  exec: /usr/lib/probe/worker
  stop_timeout: 50
parts:
  pump: {exec: /usr/lib/probe/pump, stop_timeout: 1}
