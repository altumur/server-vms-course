# The console does not write a worker table
name: probe
unit: {rows: things, id: name, fields: {name: {type: string, required: true}}}
placement: {capacity: {default: 1}}
worker: {exec: /usr/lib/probe/worker, writes: [disks]}
tables: {disks: {fields: {note: {type: string}}}}
domain: {edit_tables: {disks: [note]}}
