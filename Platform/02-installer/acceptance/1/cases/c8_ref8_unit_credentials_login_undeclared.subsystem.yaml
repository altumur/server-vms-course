# credentials.login поля единицы называет необъявленное поле nouser; норма М10/2 Н1.4, P/06.2 Н1.1; строка 8 references.tsv
name: probe
unit:
  rows: counters
  id: numeric
  fields:
    feed: {type: url, credentials: {login: nouser, secret: feed_secret}}
    feed_user: {type: string}
    feed_secret: {type: string}
placement: {capacity: {default: 4}}
worker: {exec: /usr/lib/probe/worker}
