# {id} in a string field default with unit.id numeric: the door substitutes id; VMS request 1
name: probe
unit:
  rows: counters
  id: numeric
  fields:
    name: {type: string, required: true}
    label: {type: string, default: 'cam{id}'}
placement:
  capacity: {default: 4}
worker: {exec: /usr/lib/probe/worker}
