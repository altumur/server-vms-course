# a submission to the own subsystem by ticket (P/06.3 N1.9; P/02.1 relation 131)
name: callo
unit:
  rows: callers
  id: name
  fields:
    name:  {type: string, required: true}
placement: {capacity: {default: 1}}
door: {pass: {routes: [api], calls: [callo/requests]}}
worker: {exec: /usr/lib/callo/worker}
