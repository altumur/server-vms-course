# A target with a required *_secret field: the customer library does not write secrets (ADR-0091 item 1, G-8)
name: target
unit:
  rows: things
  id: name
  fields:
    name: {type: string, required: true}
    cam: {type: string, required: true, fixed: true}
    kind: {type: string, required: true}
    note_secret: {type: string, required: true}
placement: {capacity: {default: 1}}
worker: {exec: /usr/lib/target/worker}
