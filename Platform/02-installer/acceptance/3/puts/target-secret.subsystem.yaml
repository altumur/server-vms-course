# адресат с обязательным полем *_secret — библиотека заказчика секрет не пишет (ADR-0091 п. 1, Г-8)
name: target
unit:
  rows: things
  id: name
  fields:
    name: {type: string, required: true}
    cam: {type: string, required: true, fixed: true}
    kind: {type: string, required: true}
    note_secret: {type: string, required: true}
placement: {capacity: {default: 1}}
