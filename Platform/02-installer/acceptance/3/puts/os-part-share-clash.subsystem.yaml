# Part belt (group w2c-psub-belt) collides with share belt lacking part (its separate share group w2c-psub-belt) (P/02.4 N1.1 users_groups)
name: psub
unit: {rows: things, id: numeric}
placement: {capacity: {default: 1}}
parts:
  belt: {exec: /usr/lib/psub/beltd}
shares:
  belt: {kind: socket}
worker: {exec: /usr/lib/psub/worker}
