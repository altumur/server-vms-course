# near.of names nosuch, absent from neart, while near.prefer names an existing field (P/02.1 N3, ADR-0091 addendum (26) item 2)
name: nearb
unit:
  rows: nearbs
  id: name
  fields:
    name: {type: string, required: true}
    of:   {type: string, required: true}
placement:
  capacity: {default: 1}
  near: {sub: neart, by: of, of: nosuch, prefer: {start: [0]}}
worker: {exec: /usr/lib/nearb/worker}
