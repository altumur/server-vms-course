# Part belt and share belt with part: belt use the same part user group without collision (P/02.4 N1.1 users_groups)
name: psub
unit: {rows: things, id: numeric}
placement: {capacity: {default: 1}}
parts:
  belt: {exec: /usr/lib/psub/beltd}
shares:
  belt: {kind: socket, part: belt}
worker: {exec: /usr/lib/psub/worker}
