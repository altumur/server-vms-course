# адресат заказа с необязательным полем *_secret, у которого default — правило 4 worker.creates (P/02.1 Н3 «загрузить_каталог»); иначе как target
name: target
unit:
  rows: things
  id: name
  fields:
    name: {type: string, required: true}
    cam: {type: string, required: true, fixed: true}
    kind: {type: string, required: true}
    zone: {type: string}
    tags: {type: list, required: true}
    note_secret: {type: string, default: "preset"}
placement: {capacity: {default: 1}}
about: {sub: cam, field: cam}
worker: {exec: /usr/lib/target/worker}
