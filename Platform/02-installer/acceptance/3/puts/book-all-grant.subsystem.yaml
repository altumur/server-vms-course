# An all-members book with grant: no recipient state is kept in the row (ADR-0113 addendum (9) item 1)
name: probe
unit: {rows: things, id: name, fields: {name: {type: string, required: true}}}
placement: {capacity: {default: 1}}
worker: {exec: /usr/lib/probe/worker}
domain:
  books:
    asks: {from: probe/asks/, key: target, pick: all, to: "*"}
  names:
    asks/: {exclusive_with: domain/groups, grant: view}
