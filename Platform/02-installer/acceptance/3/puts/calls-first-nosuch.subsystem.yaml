# The segment is absent from the subsystem door.pass (ADR-0112 addendum (3) item 2)
name: callc
unit:
  rows: callers
  id: name
  fields:
    name:  {type: string, required: true}
placement: {capacity: {default: 1}}
door: {pass: {routes: [api], calls: [live/nosuch]}}
worker: {exec: /usr/lib/callc/worker}
