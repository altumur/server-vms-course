name: testsub
unit:
  rows: items
  id: name
  fields:
    name: {type: string, required: true}
placement:
  capacity: {default: 1}
worker: {exec: /usr/lib/testsub/worker}
domain:
  ref: name
  books:
    tallies: {show: [n]}
secrets:
  readers:
    domain/testsub/tallies: [domain]
    domain/testsub/tallies/: [domain]
