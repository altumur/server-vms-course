name: probe
unit:
  rows: counters
  id: name
  fields:
    name: {type: string, required: true}
    feed: {type: url, credentials: {login: feed_user, secret: feed_secret}}
    feed_user: {type: string}
    feed_secret: {type: string, bound_to: feed}
placement:
  capacity: {from: capacity, default: 4}
worker: {exec: /usr/lib/probe/worker}
