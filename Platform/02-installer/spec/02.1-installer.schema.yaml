# Проверка рядом с нормой (ADR-0085), не норма; правится вместе с нормой главы 2.1.
# Норма — проза 02.1-installer.norms.md (Н1.1–Н1.4); реализации эту схему не исполняют и в выгрузку
# генераторам она не идёт. Байты правит «Спецификация» той же правкой, что норму главы 2.1 (ADR-0080 доп. 16).
# Исполняет check_spec (skills/lesson-spec/scripts/spec_schema/run.py) на корпусе
# Platform/02-installer/acceptance/1: вердикт против verdicts.tsv, класс против classes.tsv.
# Происхождение: пилот /Users/murat/w2c/cammeta-schema-pilot (REPORT.md, schema/PROFILE.md), нормы cammeta-specs 8300b3c.
#
# Форма спеки подсистемы <name>.subsystem.yaml (P/02.1 Н1.2, Н1.2а, Н1.3): JSON Schema draft 2020-12, записана в YAML.
# description каждого раздела — урок-владелец смысла. Ссылки Н1.4 и отношения между значениями —
# 02.1-installer.references.tsv. Порядок слоёв (Н3): текст → имя → ключи → значения → ссылки.
#
# ==== Профиль: что разрешено писать в схеме и как прогонщик её исполняет ====
#
# §1 Диалект и ключевые слова.
#   Draft 2020-12, $schema обязателен. JSON прогонщик делает из этого YAML сам и проверяет метасхемой.
#   Закрытый перечень (28 слов; проверяет прогонщик, слово вне перечня — FAIL check_spec):
#     $schema $id $defs $ref description; type enum const; properties patternProperties additionalProperties
#     propertyNames required dependentRequired; items minItems uniqueItems; minimum maximum exclusiveMinimum;
#     pattern; if then else allOf anyOf oneOf not.
#   Сверка с М10/3 Н1.2 (перечень для schema поля, 23 слова): отсюда взято 19, добавлено 9 — $schema, $id, $defs,
#   $ref, description (устройство и урок-владелец), patternProperties и propertyNames (уровни named: имя автора),
#   dependentRequired («merge только с inherit», «must_match только с ref»), uniqueItems (повтор в enum, claims, show).
#   Профиль урока 3 — про схемы, которые пишет автор спеки; этот — про схему, которую пишет курс.
#   Не использовать: format (не проверяется); unevaluatedProperties (при неуспешной подсхеме её свойства выпадают
#   из «оценённых», знакомый ключ становится незнакомым — класс key вместо value); minProperties/maxProperties,
#   contains, prefixItems, $data — форме не нужны.
#
# §2 Правила написания.
#   1. Закрытые наборы не прятать в oneOf/anyOf: additionalProperties: false стоит рядом со своими properties.
#      anyOf/oneOf — только над required ({param} | {regex} | {nested}, «ровно один из sub/of») или над скалярами
#      (forever | off | целое). Развилка по признаку — if/then: по type поля, по type значения (tables: отображение
#      или список).
#   2. patternProperties: {'': …} — так подсхема применяется ко всем именам уровня named. additionalProperties не
#      применяется к именам, совпавшим с каким-либо patternProperties (в первой версии пилота из-за этого поля
#      таблиц не проверялись вовсе).
#   3. Правило по имени автора (bound_to только у *_secret, имя blob) — через patternProperties с регулярным
#      выражением имени. Отрицание суффикса без просмотра вперёд пишется перебором:
#      ^(?:[\s\S]{0,6}|[\s\S]*(?:[^t]|[^e]t|[^r]et|[^c]ret|[^e]cret|[^s]ecret|[^_]secret))$
#   4. Запрещённое имя — properties: {имя: false} или not: {enum: […]}; класс value, не key.
#   5. У каждого объявленного свойства есть type, enum, const, $ref (или anyOf из таких) или false; true — только у
#      непрозрачных default/inherit (их тип задаёт if/then по типу поля). Проверяет прогонщик.
#
# §3 pattern.
#   Только общее подмножество ECMA-262 и RE2: классы […], \s\S в классе, якоря ^…$, группы (?:…), альтернатива,
#   повторы * + ? {m,n}. Без просмотра вперёд/назад, обратных ссылок, именованных групп, флагов.
#   По стандарту pattern — ECMA-262; jsonschema по умолчанию исполняет re Python ($ совпадает и перед конечным \n:
#   значение "probe\n" прошло бы ^[a-z]…$). Поэтому прогонщик исполняет pattern и patternProperties библиотекой
#   regress (ECMA-262).
#
# §4 Числа.
#   Целое — целый знак (^[-+]?[0-9]+$): запись float в целом месте (4.0, 4., 4e0, 1e2) — отказ value (Н1.1 scalars,
#   случаи c5_int_*). По 2020-12 integer — число с нулевой дробной частью (1.0 — целое), поэтому прогонщик
#   переопределяет integer: только целое Python, не float (вариант «py-int» пилота).
#   Пределы: $defs/int — integer в ±(2^53 − 1), так 1e308 в целом месте отказывается.
#   Конечность и предел во всём документе (включая opaque и json) — не схема: общий проход слоя текста; целое по
#   модулю > 2^53 − 1 и .inf/.nan/переполнение — refused:value.
#
# §5 Длина строк.
#   minLength/maxLength считают знаки Unicode, нормы — байты; везде, где длина ограничена (name, unit.rows, имя
#   blob, slot.prefix), pattern пускает только ASCII, и граница пишется повтором {0,31}, не maxLength.
#
# §6 Классы отказа. Порядок — Н3; класс файла — первый непустой:
#   text      — слой текста (spec_schema/textlayer.py);
#   name      — ошибка схемы с путём /name… или required корня без name;
#   key       — additionalProperties: false;
#   value     — всё прочее в схеме, включая propertyNames и false; общий проход чисел и пустых значений; строки
#               references.tsv с классом value;
#   reference — строки references.tsv с классом reference.
#   propertyNames — value, не key: на уровнях named имя автора не по грамматике — refused:value по Н1.2а.
#   Переопределение по пути (Н1.2а: внутри domain.* класс задаёт урок М11): domain.names → reference;
#   domain.books, domain.shared, domain.tokens → value (spec_schema/run.py CLASS_BY_PREFIX).
#   Проход ссылок идёт, только если схема и общий проход чисты: значение раньше ссылки.
#
# §7 Скаляры — таблица Н1.1 scalars; простой скаляр распознаётся ею, а не распознавателем библиотеки:
#   null ^(null|Null|NULL|~|)$ (пустое — отдельно, §8); bool true/false в любом регистре; int ^[-+]?[0-9]+$;
#   float ^[-+]?(\.[0-9]+|[0-9]+(\.[0-9]*)?)([eE][-+]?[0-9]+)?$; inf/nan ^[-+]?\.(inf|Inf|INF)$, ^\.(nan|NaN|NAN)$ —
#   читаются, отказ value; string — всё прочее; в кавычках и блочный скаляр — всегда строка.
#   Это не core YAML 1.2: core читает 0x10 и 0o7 целыми, норма — словами; core знает bool только в трёх написаниях.
#
# §8 Слой текста (spec_schema/textlayer.py, парсер ruamel.yaml, YAML 1.2, события с началом и концом узла).
#   E     UTF-8; BOM; C0 кроме TAB/LF/CR, DEL, C1, U+FFFE/FFFF, U+2028/2029, одиночный CR — в тексте и в значении
#         после экранирований; суррогаты в значении (Н1.1 encoding, escape);
#   R1–R5 повтор ключа; якорь/псевдоним; ключ <<; любой тег, включая !; глубина > 64 (корень — 1);
#   K     простой ключ, который таблица скаляров читает не строкой; ключ-коллекция (Н1.1 keys); длина ключа не
#         ограничена (без предела 1024 знаков неявного ключа YAML: сканер ruamel переопределён);
#   T     корень не отображение, пустой файл (Н1.1 document);
#   S     TAB вне кавычек/блочного скаляра/комментария; поток или строка в кавычках на нескольких строках; указатель
#         отступа |2; ключ ? …; директива %, ..., второй документ;
#   N     корень потоком или не с колонки 1; ключ без : в потоковом отображении ({a, b: 1}, {a:b}); пара в потоковом
#         списке ([a: 1]); # вплотную за кавычкой или скобкой; пустой элемент потока ([a,]); строка продолжения
#         простого слова с «: », «:» в конце или с начальным [ { " ' & * ! | > (Н1.1 document, comment, blocks);
#         значение блочного ключа на следующей строке не блочной коллекцией (слово, кавычки, поток); простое слово
#         с ? в начале (?x) — ключом и значением (Н1.1 keys, string).
#   Одиночный - значением блочного ключа (unit: -) — слово (Н1.1 string): YAML читал бы его указателем списка,
#   поэтому до парсера слой текста берёт его в кавычки; -x — простое слово и в YAML.
#   Пустое значение (key: без значения) — не отказ текста, а общий проход: refused:value (Н1.2а «сказанный ключ без
#   значения»); явный null — значение.
#
# §9 Проход ссылок (references.tsv): путь → слово прохода → класс; слова — ветки spec_schema/refs.py (CHECKS).
#   Новый вид ссылки — новое слово там же; строка со словом вне словаря — FAIL check_spec.
#
# ==== Схема ====
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://w2c.example/m10/02/subsystem.schema.json
description: P/02.1 Н1.2 — корень, закрытый набор разделов
type: object
required: [name, unit, placement]
additionalProperties: false
properties:
  name: {$ref: '#/$defs/subName', description: P/02.1 Н1.2}
  unit:
    description: М10/3 Н1.1
    type: object
    required: [rows, id]
    additionalProperties: false
    properties:
      rows: {$ref: '#/$defs/rowsName'}
      id: {type: string, description: "numeric или поле (references.tsv)"}
      fields: {$ref: '#/$defs/unitFields'}
  placement: {$ref: '#/$defs/placement'}
  tables: {$ref: '#/$defs/tables'}
  requests: {$ref: '#/$defs/requests'}
  holds:
    description: М10/8
    type: object
    additionalProperties: false
    properties:
      table: {$ref: '#/$defs/str'}
      unit: {$ref: '#/$defs/str'}
      since: {$ref: '#/$defs/str'}
      until: {$ref: '#/$defs/str'}
      released: {$ref: '#/$defs/str'}
      longest: {type: number, exclusiveMinimum: 0}
  events:
    description: М10/8
    type: object
    additionalProperties: false
    properties:
      suppress:
        type: object
        additionalProperties:
          type: object
          required: [window]
          additionalProperties: false
          properties:
            window: {type: number, exclusiveMinimum: 0}
            by:
              type: array
              minItems: 1
              items: {type: string, not: {enum: [t, id, repeats, since, until]}}
      older_epochs: {enum: [fenced, earlier-run]}
  about:
    description: М10/8 Н1.2, М10/3 Н1.3
    type: object
    required: [sub, field]
    additionalProperties: false
    properties:
      sub: {$ref: '#/$defs/name'}
      field: {$ref: '#/$defs/str'}
  snapshot: {description: М10/10 Н1.3, $ref: '#/$defs/strList'}
  rights: {$ref: '#/$defs/rights'}
  secrets: {$ref: '#/$defs/secrets'}
  worker:
    description: М10/5, P/02.5 Н1.4, М10/8 Н1.5
    type: object
    additionalProperties: false
    properties:
      writes: {$ref: '#/$defs/strList'}
      reads: {$ref: '#/$defs/grantList'}
      requests: {$ref: '#/$defs/strList'}
      deletes: {$ref: '#/$defs/strList'}
  slot:
    description: М10/3 Н1.4
    type: object
    additionalProperties: false
    properties:
      prefix: {type: string, pattern: '^[a-z]{1,8}$'}
      name_env: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
  lease:
    description: М10/3 Н1.6
    type: object
    required: [unconfirmed_max]
    additionalProperties: false
    properties:
      unconfirmed_max:
        anyOf: [{enum: [forever, 'off']}, {$ref: '#/$defs/int', minimum: 1}]
  heartbeat:
    description: М10/5 Н1.1
    type: object
    additionalProperties: false
    properties:
      strings:
        type: array
        items: {type: string, not: {enum: [worker, server, url, instance, labels, fetched, events]}}
  objects:
    description: М10/8 Н1.1
    type: object
    additionalProperties: false
    properties:
      rows: {$ref: '#/$defs/strList'}
      door: {$ref: '#/$defs/strList'}
  door:
    description: М10/9 Н3, М10/11 Н1.8
    type: object
    additionalProperties: false
    properties:
      routes: {$ref: '#/$defs/strList'}
      pass: {$ref: '#/$defs/strList'}
  servers: {$ref: '#/$defs/servers'}
  display: {$ref: '#/$defs/display'}
  console:
    description: М10/9 Н1.2
    type: object
    additionalProperties: false
    properties:
      running: {$ref: '#/$defs/str'}
  metrics: {$ref: '#/$defs/metrics'}
  domain: {$ref: '#/$defs/domain'}
allOf:
  # unplaced.delete_after — только с named id (ADR-0067; P/02.1 Н1.2а placement)
  - if: {required: [placement], properties: {placement: {required: [unplaced]}}}
    then: {properties: {unit: {properties: {id: {not: {const: numeric}}}}}}

$defs:
  str: {type: string}
  int:
    description: профиль §4 «Числа» — целый знак YAML в пределах ±(2^53−1); 1e308 и иные дроби вне предела — value
    type: integer
    minimum: -9007199254740991
    maximum: 9007199254740991
  intOrNull: {type: [integer, 'null'], minimum: -9007199254740991, maximum: 9007199254740991}
  strList: {type: array, items: {type: string}}
  name: {type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$'}
  subName:
    description: P/02.1 Н1.2 — 21 зарезервированное слово
    $ref: '#/$defs/name'
    not:
      enum: [platform, spec, policy, drain, servers, where, unplaceable, console, audit, events, marks,
             requests, asked, session, mounts, healthz, metrics, resources, schema, domain, api]
  tableName:
    description: P/02.1 Н1.2а «Запрещённые имена»; М10/3 Н1.1, М10/4, М10/5, М10/8, М10/9, М10/10, М11
    $ref: '#/$defs/name'
    not:
      enum: [platform, spec, next_id, slots, epoch, idem, policy, placement, workers, controller, decommissioned,
             holds, requests, asked, sweep, servers, where, unplaceable, drain, events, marks, console, audit,
             session, mounts, healthz, metrics, resources, schema, domain, api,
             heartbeats, contenders, snapshot, blobs, commands]
  rowsName:
    description: М10/3 Н1.1; cluster, worker, ts — оболочка снимка М10/10 Н1.3
    $ref: '#/$defs/tableName'
    not: {enum: [cluster, worker, ts]}
  grantList:
    description: "P/02.5 Н1.3, P/02.5 Н1.4 — без *, !, delete:"
    type: array
    items: {$ref: '#/$defs/grantPath'}
  grantName: {type: string, not: {pattern: '^!|^delete:|\*'}}
  grantPath: {$ref: '#/$defs/grantName', pattern: /}

  # ---- поле: P/02.1 Н1.3, смысл — М10/3 Н1.2; формы url — М10/7 Н1.1
  unitFields:
    description: М10/3 Н1.2; platform_fields запрещены (value)
    type: object
    properties: {id: false, revision: false, deleted: false, worker: false, placement: false, epoch: false,
                 phase: false, observed_revision: false}
    patternProperties:
      '': {$ref: '#/$defs/unitField'}
      '_secret$': {properties: {type: {const: string}}}
      '^(?:[\s\S]{0,6}|[\s\S]*(?:[^t]|[^e]t|[^r]et|[^c]ret|[^e]cret|[^s]ecret|[^_]secret))$': {not: {required: [bound_to]}}
      '^$|^[^A-Za-z_]|[^A-Za-z0-9_]|^[\s\S]{65,}$': {$ref: '#/$defs/notBlob'}
    if: {required: [bytes]}
    then: {patternProperties: {'': {$ref: '#/$defs/notBlob'}}}
  notBlob:
    not: {properties: {type: {const: blob}}, required: [type]}
  unitField:
    type: object
    additionalProperties: false
    properties:
      type: {$ref: '#/$defs/fieldType'}
      required: {type: boolean}
      fixed: {type: boolean}
      default: true
      inherit: true
      merge: {enum: [union, override], description: М11/11 Н1.5}
      enum: {$ref: '#/$defs/fieldEnum'}
      unique: {enum: [true, canonical]}
      ref: {$ref: '#/$defs/refTarget'}
      must_match: {$ref: '#/$defs/mustMatch'}
      schema: {$ref: '#/$defs/jsonSchemaLite'}
      bound_to: {$ref: '#/$defs/boundTo'}
      credentials: {$ref: '#/$defs/credentials'}
      secret_in: {$ref: '#/$defs/secretIn'}
      schemes: {$ref: '#/$defs/schemes'}
    not: {required: [default, inherit]}
    dependentRequired: {merge: [inherit], must_match: [ref]}
    allOf:
      - $ref: '#/$defs/fieldByType'
      - if: {required: [merge], properties: {merge: {const: union}}}
        then: {required: [type], properties: {type: {const: list}}}
      - if: {required: [type], properties: {type: {const: list}}}
        then: {not: {required: [unique]}}
      - if: {not: {required: [type], properties: {type: {const: url}}}}
        then: {properties: {unique: {const: true}}}
  tableField:
    description: М10/10 Н1.6; без fixed, inherit, merge, unique (key); без blob (value)
    type: object
    additionalProperties: false
    properties:
      type: {$ref: '#/$defs/fieldType'}
      required: {type: boolean}
      default: true
      enum: {$ref: '#/$defs/fieldEnum'}
      ref: {$ref: '#/$defs/refTarget'}
      must_match: {$ref: '#/$defs/mustMatch'}
      schema: {$ref: '#/$defs/jsonSchemaLite'}
      bound_to: {$ref: '#/$defs/boundTo'}
      credentials: {$ref: '#/$defs/credentials'}
      secret_in: {$ref: '#/$defs/secretIn'}
      schemes: {$ref: '#/$defs/schemes'}
    dependentRequired: {must_match: [ref]}
    allOf:
      - $ref: '#/$defs/fieldByType'
      - $ref: '#/$defs/notBlob'
  fieldType: {enum: [string, int, float, bool, list, json, url, blob]}
  fieldEnum: {type: array, minItems: 1, uniqueItems: true}
  fieldByType:
    description: P/02.1 Н1.3 — default/inherit по типу поля; enum только у string и bool; формы url только у url
    allOf:
      - if: {properties: {type: {const: string}}}
        then: {properties: {default: {type: [string, 'null']}, inherit: {type: [string, 'null']},
                            enum: {items: {type: string}}}}
      - if: {required: [type], properties: {type: {const: int}}}
        then: {properties: {default: {$ref: '#/$defs/intOrNull'}, inherit: {$ref: '#/$defs/intOrNull'}}}
      - if: {required: [type], properties: {type: {const: float}}}
        then: {properties: {default: {type: [number, 'null']}, inherit: {type: [number, 'null']}}}
      - if: {required: [type], properties: {type: {const: bool}}}
        then: {properties: {default: {type: [boolean, 'null']}, inherit: {type: [boolean, 'null']},
                            enum: {items: {type: boolean}}}}
      - if: {required: [type], properties: {type: {const: list}}}
        then: {properties: {default: {type: [array, 'null'], items: {type: string}},
                            inherit: {type: [array, 'null'], items: {type: string}}}}
      - if: {required: [type], properties: {type: {const: url}}}
        then: {properties: {default: {type: [string, 'null']}, inherit: {type: [string, 'null']}}}
      - if: {required: [type], properties: {type: {const: blob}}}
        then:
          properties: {required: {const: false}}
          not: {anyOf: [{required: [default]}, {required: [inherit]}]}
      - if: {required: [type], properties: {type: {enum: [int, float, list, json, url, blob]}}}
        then: {not: {required: [enum]}}
      - if: {not: {required: [type], properties: {type: {const: url}}}}
        then: {not: {anyOf: [{required: [credentials]}, {required: [secret_in]}, {required: [schemes]}]}}
  refTarget:
    description: М10/3 Н1.3 — <подсистема>/<семья>
    type: string
    pattern: '^[a-z][a-z0-9_-]{0,31}/[a-z][a-z0-9_-]{0,31}$'
  mustMatch: {type: object, additionalProperties: {type: string}, description: "М10/3 Н1.3; ключи opaque"}
  boundTo: {type: [string, array], items: {type: string}, description: М10/7 Н1.1}
  credentials:
    description: М10/7 Н1.1
    type: object
    required: [login, secret]
    additionalProperties: false
    properties: {login: {$ref: '#/$defs/str'}, secret: {$ref: '#/$defs/str'}}
  secretIn:
    description: М10/7 Н1.1 — элемент ровно одного вида {param, login?} | {regex, in?, schemes?, decoded?} | {nested}
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        param: {$ref: '#/$defs/strList'}
        login: {$ref: '#/$defs/strList'}
        regex: {type: string}
        in:
          anyOf:
            - {enum: [path, query, authority, fragment]}
            - {type: array, items: {enum: [path, query, authority, fragment]}}
        schemes: {$ref: '#/$defs/strList'}
        decoded: {type: boolean}
        nested: {$ref: '#/$defs/strList'}
      anyOf: [{required: [param]}, {required: [regex]}, {required: [nested]}]
      dependentRequired: {login: [param], in: [regex], schemes: [regex], decoded: [regex]}
      allOf:
        - if: {required: [param]}
          then: {not: {anyOf: [{required: [regex]}, {required: [nested]}]}}
        - if: {required: [regex]}
          then: {not: {required: [nested]}}
  schemes:
    description: М10/7 Н1.1, М10/3 Н4 — имя схемы → {host?, fragment?, none?}
    type: object
    propertyNames: {pattern: '^[a-z][a-z0-9+.-]*$'}
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        host: {enum: [authority, path]}
        fragment: {const: none}
        none: {$ref: '#/$defs/strList'}
  jsonSchemaLite:
    description: М10/3 Н1.2 — ключевые слова JSON Schema из перечня; иное — value; глубина — references.tsv
    type: object
    propertyNames:
      enum: [type, enum, const, properties, required, additionalProperties, items, minItems, maxItems, minLength,
             maxLength, minimum, maximum, exclusiveMinimum, exclusiveMaximum, pattern, if, then, else, allOf, anyOf,
             oneOf, not]
    properties:
      properties: {type: object, additionalProperties: {$ref: '#/$defs/jsonSchemaLite'}}
      additionalProperties: {$ref: '#/$defs/subSchemaLite'}
      items: {$ref: '#/$defs/subSchemaLite'}
      if: {$ref: '#/$defs/subSchemaLite'}
      then: {$ref: '#/$defs/subSchemaLite'}
      else: {$ref: '#/$defs/subSchemaLite'}
      not: {$ref: '#/$defs/subSchemaLite'}
      allOf: {type: array, items: {$ref: '#/$defs/subSchemaLite'}}
      anyOf: {type: array, items: {$ref: '#/$defs/subSchemaLite'}}
      oneOf: {type: array, items: {$ref: '#/$defs/subSchemaLite'}}
  subSchemaLite:
    type: [boolean, object]
    if: {type: object}
    then: {$ref: '#/$defs/jsonSchemaLite'}

  # ---- placement: М10/4 Н1.3
  placement:
    description: М10/4 Н1.3
    type: object
    required: [capacity]
    additionalProperties: false
    properties:
      capacity:
        type: object
        required: [default]
        additionalProperties: false
        properties:
          from: {$ref: '#/$defs/str'}
          default: {$ref: '#/$defs/int', minimum: 0}
          unit_mb: {type: number, exclusiveMinimum: 0, description: М10/5 Н1.2 memory}
          base_mb: {type: number, minimum: 0, description: М10/5 Н1.2 memory}
      headroom:
        type: object
        additionalProperties: false
        properties: {from: {$ref: '#/$defs/str'}}
      weight:
        type: object
        additionalProperties: false
        properties: {field: {$ref: '#/$defs/str'}, default: {$ref: '#/$defs/int', minimum: 1}}
      constraint: {enum: [none, labels-subset]}
      tie_break: {enum: [most-free-capacity]}
      servers: {enum: [shared, distinct]}
      place_by: {$ref: '#/$defs/str'}
      places:
        type: object
        required: [table]
        additionalProperties: false
        properties:
          table: {$ref: '#/$defs/str'}
          where: {type: object}
          server_field: {$ref: '#/$defs/str'}
          lease: {enum: [strict]}
      spread_by: {$ref: '#/$defs/str'}
      group_by:
        type: object
        required: [field]
        additionalProperties: false
        properties: {field: {$ref: '#/$defs/str'}, cut_at: {enum: [host]}}
      near:
        type: object
        required: [sub]
        additionalProperties: false
        properties:
          sub: {$ref: '#/$defs/str'}
          by: {$ref: '#/$defs/str'}
          of: {$ref: '#/$defs/str'}
          prefer: {type: object}
      home: {$ref: '#/$defs/str'}
      affinity:
        type: object
        additionalProperties: false
        properties:
          field: {$ref: '#/$defs/str'}
          table: {$ref: '#/$defs/str'}
          server_field: {$ref: '#/$defs/str'}
          strict: {type: object}
      requires: {enum: [none, resource]}
      grows: {type: boolean}
      retire_when:
        type: object
        required: [field, in]
        additionalProperties: false
        properties: {field: {$ref: '#/$defs/str'}, in: {type: array}}
      rebalance:
        type: object
        additionalProperties: false
        properties: {dead_band: {type: number, minimum: 0}}
      unplaced:
        type: object
        required: [delete_after]
        additionalProperties: false
        properties: {delete_after: {$ref: '#/$defs/int', minimum: 1}}

  # ---- tables: М10/10 Н1.6
  tables:
    description: М10/10 Н1.6 — отображение named или список имён
    type: [object, array]
    if: {type: array}
    then: {items: {$ref: '#/$defs/tableName'}}
    else:
      propertyNames: {$ref: '#/$defs/tableName'}
      additionalProperties: {$ref: '#/$defs/table'}
  table:
    type: object
    additionalProperties: false
    properties:
      key: {type: string}
      fields:
        type: object
        properties: {held_by: false, garbled: false, by: false, at: false, made_at: false}
        patternProperties:
          '': {$ref: '#/$defs/tableField'}
          '_secret$': {properties: {type: {const: string}}}
          '^(?:[\s\S]{0,6}|[\s\S]*(?:[^t]|[^e]t|[^r]et|[^c]ret|[^e]cret|[^s]ecret|[^_]secret))$': {not: {required: [bound_to]}}
      schema: {$ref: '#/$defs/jsonSchemaLite'}
      stamp: {type: array, items: {enum: [by, at, made_at]}}
      journal:
        type: object
        additionalProperties: false
        properties: {written: {$ref: '#/$defs/str'}, deleted: {$ref: '#/$defs/str'}}
    allOf:
      - if: {required: [fields], properties: {fields: {required: [name]}}}
        then:
          required: [key]
          properties:
            key: {const: name}
            fields: {properties: {name: {properties: {type: {const: string}}}}}

  # ---- requests: М10/8
  requests:
    description: М10/8 Н1.5, ADR-0054
    type: object
    additionalProperties: false
    properties:
      schema: {$ref: '#/$defs/jsonSchemaLite'}
      valid_for: {type: number, minimum: 0}
      most_valid: {type: number, minimum: 0}
      per_person: {$ref: '#/$defs/int', minimum: 1}
      settle: {type: number, minimum: 0}
      ttl: {type: number, minimum: 0}
      key: {type: string, pattern: '\{[^{}]+\}'}
      outcome: {enum: [mark, fetched]}
      stamp: {type: array, items: {enum: [by, at, group, about]}}
      journal: {$ref: '#/$defs/str'}
      elsewhere: {$ref: '#/$defs/strList'}
      free: {type: boolean}
    dependentRequired: {per_person: [ttl]}
    allOf:
      - if: {not: {required: [free], properties: {free: {const: true}}}}
        then: {required: [valid_for, most_valid]}
      - if: {required: [free], properties: {free: {const: true}}}
        then: {required: [ttl]}

  # ---- rights: М10/6 Н1.5; secrets: P/02.5 Н1.3
  rights:
    description: М10/6 Н1.5
    type: object
    additionalProperties: false
    properties:
      routes:
        type: object
        additionalProperties: false
        properties: {view: {$ref: '#/$defs/strList'}, edit: {$ref: '#/$defs/strList'}}
      cluster_rows: {type: boolean}
      unit_of: {type: object, additionalProperties: {type: string}}
      reach:
        type: object
        additionalProperties: false
        properties:
          group: {$ref: '#/$defs/strList'}
          cluster: {$ref: '#/$defs/strList'}
          requests: {$ref: '#/$defs/strList'}
      names:
        type: array
        items:
          type: object
          required: [field, unit]
          additionalProperties: false
          properties:
            field: {$ref: '#/$defs/str'}
            unit: {$ref: '#/$defs/str'}
            sub: {$ref: '#/$defs/str'}
            of: {$ref: '#/$defs/str'}
          oneOf: [{required: [sub]}, {required: [of]}]
  secrets:
    description: P/02.5 Н1.3
    type: object
    additionalProperties: false
    properties:
      readers:
        type: object
        propertyNames: {$ref: '#/$defs/grantName'}
        additionalProperties:
          type: array
          minItems: 1
          items: {enum: [console, controller, worker, domainworker, domain, domainagent, resource, domainconsole]}
      reads: {$ref: '#/$defs/grantList'}

  # ---- servers, display, console, metrics: М10/9 Н1.2
  servers:
    description: М10/9 Н1.2
    type: object
    additionalProperties: false
    properties:
      show:
        type: array
        items:
          type: object
          required: [table, by]
          additionalProperties: false
          properties:
            table: {$ref: '#/$defs/str'}
            by: {$ref: '#/$defs/str'}
            title: {$ref: '#/$defs/str'}
            columns: {$ref: '#/$defs/strList'}
      status:
        type: array
        items:
          type: object
          required: [field]
          additionalProperties: false
          properties:
            field:
              description: первый сегмент — не ключ пульса платформы (М10/5 Н1.1)
              type: string
              not: {pattern: '^(worker|ts|status|server|instance|labels|url|fetched|events|conflicts|started|previous_hb|previous_instance|previous_server|fenced|schema|build|pending_writes|server_unsaid|stood_in|stand_in_renewals)(\.|$)'}
            title: {$ref: '#/$defs/str'}
            of: {$ref: '#/$defs/str'}
  strMap: {type: object, additionalProperties: {type: string}}
  display:
    description: М10/9 Н1.2
    type: object
    additionalProperties: false
    properties:
      unit: {$ref: '#/$defs/str'}
      units: {$ref: '#/$defs/str'}
      units_count: {$ref: '#/$defs/str'}
      section: {$ref: '#/$defs/str'}
      general: {$ref: '#/$defs/str'}
      fields: {$ref: '#/$defs/strMap'}
      field_help: {$ref: '#/$defs/strMap'}
      options: {type: object, additionalProperties: {$ref: '#/$defs/strMap'}}
      form:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            title: {$ref: '#/$defs/str'}
            state: {type: boolean}
            placement: {type: boolean}
            fields: {$ref: '#/$defs/strList'}
            note: {$ref: '#/$defs/str'}
            status:
              type: array
              items:
                type: object
                required: [field]
                additionalProperties: false
                properties: {field: {$ref: '#/$defs/str'}, since: {$ref: '#/$defs/str'}, title: {$ref: '#/$defs/str'}}
      events: {type: boolean}
      kinds: {$ref: '#/$defs/strMap'}
      keys:
        description: М11/9 Н1.8
        type: object
        additionalProperties:
          type: object
          required: [title, about]
          additionalProperties: false
          properties: {title: {$ref: '#/$defs/str'}, about: {$ref: '#/$defs/str'}, absent: {$ref: '#/$defs/str'}}
      tree:
        type: object
        additionalProperties: false
        properties:
          group_by: {$ref: '#/$defs/str'}
          nested_by: {$ref: '#/$defs/str'}
          columns:
            type: array
            items:
              type: object
              required: [field]
              additionalProperties: false
              properties:
                field: {$ref: '#/$defs/str'}
                title: {$ref: '#/$defs/str'}
                width: {$ref: '#/$defs/int', minimum: 1}
          children: {type: boolean}
          group_title: {$ref: '#/$defs/str'}
          group_hint: {$ref: '#/$defs/str'}
          filter: {$ref: '#/$defs/str'}
          no_group: {$ref: '#/$defs/str'}
          contents_title: {$ref: '#/$defs/str'}
          group_word: {$ref: '#/$defs/str'}
          no_group_suffix: {$ref: '#/$defs/str'}
          pick_note: {$ref: '#/$defs/str'}
          new_root: {$ref: '#/$defs/str'}
          new_sub: {$ref: '#/$defs/str'}
          add_here: {$ref: '#/$defs/str'}
          new_group_note: {$ref: '#/$defs/str'}
          remove: {$ref: '#/$defs/str'}
          not_in: {$ref: '#/$defs/str'}
          add_to: {$ref: '#/$defs/str'}
          no_others: {$ref: '#/$defs/str'}
          new_group: {$ref: '#/$defs/str'}
  metrics:
    description: М10/9 Н1.2; смысл значений — М13
    type: array
    items:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, pattern: '^[a-z_][a-z0-9_]*$'}
        type: {enum: [gauge, counter, histogram]}
        from: {$ref: '#/$defs/str'}
        agg: {$ref: '#/$defs/str'}
        equals: {type: [string, boolean, array], items: {type: string}}
        when: {$ref: '#/$defs/str'}
        default: {type: [number, string]}
        live: {type: boolean}
        unheld: {type: boolean}
        labels: {type: object}
        count: {type: string, pattern: '^table [a-z][a-z0-9_-]{0,31}$'}
        where: {type: object}
        unless:
          type: object
          required: [table]
          additionalProperties: false
          properties: {table: {$ref: '#/$defs/str'}, where: {type: object}}
        buckets: {type: array, items: {type: number}}
        label: {$ref: '#/$defs/str'}
        values: {$ref: '#/$defs/strList'}

  # ---- domain: форма — здесь; смысл и класс отказа — уроки М11 (профиль §6 «Классы», переопределение по пути)
  domain:
    description: М11; классы — М11/5 (books value), М11/7 (tokens value), М11/9 (names reference), М11/11 (shared value)
    type: object
    additionalProperties: false
    properties:
      ref: {$ref: '#/$defs/str'}
      view: {$ref: '#/$defs/nonSecretList'}
      edit: {$ref: '#/$defs/nonSecretList'}
      kept: {$ref: '#/$defs/strList'}
      tables: {$ref: '#/$defs/strList'}
      reports: {$ref: '#/$defs/strList'}
      shared:
        description: P/02.1 Н1.2б
        type: array
        uniqueItems: true
        items:
          type: [string, object]
          if: {type: string}
          then: {not: {pattern: '_secret$'}}
          else:
            type: object
            required: [name, type, schema]
            additionalProperties: false
            properties:
              name: {type: string, pattern: '^[a-z][a-z0-9_-]*$'}
              type: {const: json}
              schema: {$ref: '#/$defs/jsonSchemaLite'}
      keys:
        description: М11/9 Н1.8
        type: array
        items:
          type: object
          required: [id]
          additionalProperties: false
          properties:
            id: {$ref: '#/$defs/name'}
            keys: {$ref: '#/$defs/strList'}
            prefix: {$ref: '#/$defs/str'}
          anyOf: [{required: [keys]}, {required: [prefix]}]
      books:
        description: P/02.1 Н1.2б
        type: object
        propertyNames: {pattern: '^[a-z0-9][a-z0-9_-]*$'}
        additionalProperties: {$ref: '#/$defs/book'}
      names:
        description: М11/9 Н1.7
        type: object
        propertyNames: {pattern: '^[a-z0-9][a-z0-9_-]*/$'}
        additionalProperties:
          type: object
          required: [exclusive_with]
          additionalProperties: false
          properties:
            exclusive_with: {const: domain/users}
            grant: {enum: [view, edit, admin]}
      tokens:
        description: P/02.1 Н1.2б
        type: object
        propertyNames: {$ref: '#/$defs/name', not: {const: person}}
        additionalProperties: {$ref: '#/$defs/token'}
      witness:
        description: P/02.1 Н1.2б
        type: object
        required: [report, member_field]
        additionalProperties: false
        properties: {report: {$ref: '#/$defs/str'}, member_field: {$ref: '#/$defs/str'}}
    if: {not: {required: [ref]}}
    then:
      properties:
        tokens:
          additionalProperties:
            not: {required: [scenario]}
            properties: {unit: {required: [sub]}}
  nonSecretList: {type: array, items: {type: string, not: {pattern: '_secret$'}}}
  book:
    type: object
    additionalProperties: false
    properties:
      from: {type: string, pattern: '^[a-z][a-z0-9_-]{0,31}/[a-z][a-z0-9_-]{0,31}/?$'}
      key: {$ref: '#/$defs/nonSecretName'}
      pick: {enum: [unique, all]}
      to: {$ref: '#/$defs/nonSecretName'}
      show:
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/nonSecretName'}
    dependentRequired: {from: [key, pick, to], key: [from], pick: [from], to: [from]}
  nonSecretName: {type: string, not: {pattern: '_secret$'}}
  claimName: {type: string}
  fieldPath: {type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'}
  token:
    type: object
    required: [lifetime, claims, grant]
    additionalProperties: false
    properties:
      lifetime: {type: number, exclusiveMinimum: 0}
      claims:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, not: {enum: [iss, sub, iat, exp, jti, kind]}}
      grant: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
      placement:
        type: object
        required: [sub, caller, ref_claim, target_fields, audience_claim]
        additionalProperties: false
        properties:
          sub: {$ref: '#/$defs/str'}
          caller: {enum: [cluster, origin, copies]}
          ref_claim: {$ref: '#/$defs/claimName'}
          target_fields: {type: array, uniqueItems: true, items: {enum: [cluster, origin, copies, centre, star_centre]}}
          audience_claim: {$ref: '#/$defs/claimName'}
      unit:
        type: object
        required: [ref_claim, target_fields, audience_claim]
        additionalProperties: false
        properties:
          sub: {$ref: '#/$defs/str'}
          caller: {enum: [self, poll_home]}
          ref_claim: {$ref: '#/$defs/claimName'}
          target_fields: {type: array, uniqueItems: true, items: {enum: [poll_home, centre]}}
          audience_claim: {$ref: '#/$defs/claimName'}
      scenario:
        type: object
        required: [doc, items, name, enabled, trigger, target, act, ref_claim, trigger_claim, acts_claim, up_claim,
                   audience_claim]
        additionalProperties: false
        properties:
          doc: {$ref: '#/$defs/str'}
          items: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
          name: {$ref: '#/$defs/fieldPath'}
          enabled: {$ref: '#/$defs/fieldPath'}
          trigger: {$ref: '#/$defs/fieldPath'}
          target: {$ref: '#/$defs/fieldPath'}
          act: {$ref: '#/$defs/fieldPath'}
          placement: {$ref: '#/$defs/str'}
          ref_claim: {$ref: '#/$defs/claimName'}
          trigger_claim: {$ref: '#/$defs/claimName'}
          acts_claim: {$ref: '#/$defs/claimName'}
          up_claim: {$ref: '#/$defs/claimName'}
          audience_claim: {$ref: '#/$defs/claimName'}
    anyOf: [{required: [placement]}, {required: [unit]}, {required: [scenario]}]
    if: {required: [scenario]}
    then: {not: {anyOf: [{required: [placement]}, {required: [unit]}]}}
