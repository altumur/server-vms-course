# Семья platform/resources/<server>/heartbeat — пульс ресурса сервера, JSON-объект (P/05; P/05 Н1.4 heartbeat). Источник
# формы объекта (ADR-0088). Экземпляр — {key, object}; ключ — грамматика колонки key каталога. Слова —
# Platform/common/DIALECT.md. Набор полей закрыт: консоль выдаёт пульс как ResourceRow P/06.5 (P/06.5 Н2 «Выдачи»: поле
# вне ResourceRow — пульс нечитаем); типы вложенных полей — по схемам ResourceRow контракта P/06 (06-console.api.openapi.yaml; производная выдача).
# waits, restore, mirror писатель пишет в каждом пульсе (E39); читатель их отсутствием не отказывает — правило писателя
# прозой (writer диалекта не держит required).
dialect: data-form/1
root:
  type: object
  properties:
    server:
      type: string
      pattern: '[a-z0-9]+(-[a-z0-9]+)*'
      description: свой сервер — SERVER_NAME по грамматике P/02.4 Н1.2, как у замка присутствия (догадка стадии C R05-G07, решение «Архитектора» 2026-10-23); не по ней или не равен серверу ключа — пульс нечитаем (P/06.5 Н2)
    box:
      type: string
      description: коробка (BOX_ID, P/02.4 Н1.2)
    ts:
      ref: common.time
      description: стенные секунды пульса; пишется каждые 10 с
    url:
      type: string
      description: адрес двери ресурса
    schema:
      ref: common.pos53
      whole: true
      description: "SCHEMA сборки (P/06.6 Н1.1а heartbeat): целое JSON без дробной части и экспоненты, ≥ 1; `1.0`, `1e0`, `-1`, строка, null — схема процесса неизвестна"
    build:
      type: string
      description: слово сборки (BUILD); не строка — ""
    usage:
      ref: common.uint53
      description: байты файлов бакетов деревьев этого сервера и копий в .mirror/
    usage_at:
      ref: common.time
      description: стенные секунды замера usage
    space:
      ref: disk
      description: том дерева событий
    volumes:
      type: object
      names:
        key: {type: string}
        value: {ref: disk}
      description: то же по каждому тому (журнал cammeta-go, урок 9 № 1)
    units:
      type: object
      names:
        key: {ref: common.sub_name}
        value:
          type: array
          items: {type: string}
          description: id единиц, которые называют в status пульсы воркеров этой коробки из running, по возрастанию байтов
      description: "`{<sub>: [<id>…]}`; нет таких — {}; в каждом пульсе (E39)"
    workers:
      ref: slot_list
      description: все слоты, о которых ресурс знает на своей коробке (по замкам присутствия)
    running:
      ref: slot_list
      description: слоты с живым процессом (держит замок присутствия)
    unknown:
      ref: slot_list
      description: присутствие не прочлось
    instances:
      type: object
      names:
        key: {type: string, pattern: '[^/]+/[^/]+'}
        value: {type: string, pattern: '.+'}
      description: "`{<sub>/<имя слота>: <экземпляр>}`"
    short:
      ref: common.uint53
      description: "сколько байтов отметка просила освободить и не смогла (P/06.5 Н3 /metrics w2c_resource_short_bytes): Σ по томам наибольшей need (> 0) среди действующих своих `free-<server>-<volume>` этого прохода relieve — подсистемы на одном томе не суммируются; need — по Н3 relieve, вверх до целого байта, насыщение 2^53−1; platform/space выключен, просьб нет, need ≤ 0 — 0; вход прохода не прочитан — прежнее значение (догадка стадии C R05-G03, решение «Архитектора» 2026-10-23)"
    waits:
      type: object
      properties:
        waiting: {ref: common.uint53}
        held: {ref: common.uint53}
        full: {ref: common.uint53}
        replaced: {ref: common.uint53}
        max: {ref: common.uint53}
      required: [waiting, held, full, replaced, max]
      description: счётчики ожиданий /events/wait (Н1.6); в каждом пульсе (E39)
    mirrors:
      type: object
      names:
        key: {type: string}
        value: {ref: common.uint53}
      description: "`{<сервер>: n}` — копии соседей в .mirror/"
    pass_started:
      ref: common.time
      description: начало текущего прохода (Н3 «проход ресурса»)
    pass_stalled:
      type: number
      minimum: 0
      description: секунды, только пока проход завис (PULSE_LIMIT)
    volumes_stuck:
      type: object
      names:
        key: {type: string}
        value: {type: number}
      description: тома, чей зонд не ответил (P/06.5 ResourceRow)
    door:
      type: object
      properties:
        addr: {type: string, description: "адрес двери ресурса — RESOURCE_HOST:RESOURCE_PORT"}
        mode: {type: string, enum: [loopback, mtls], description: "loopback — без RESOURCE_TLS, только петля; mtls — RESOURCE_TLS=1, взаимный TLS (ADR-0075)"}
        cert_until: {type: number, description: "стенные секунды конца срока сертификата сервера своего комплекта (W2C_TLS_DIR); при mtls"}
      required: [addr, mode]
      description: "состояние двери ресурса (P/06.5 ResourceRow DoorState); пишет ресурс в каждом пульсе (P/05 Н1.4; ADR-0075 доп. (3); разбор ревью стадии B 3–5, № 28)"
    garbled_rows:
      type: object
      names:
        key: {type: string}
        value: {ref: common.uint53}
      description: нечитаемых строк таблиц, прочитанных ресурсом (holds), по таблице
    retention_garbled:
      type: array
      min_items: 1
      unique_items: true
      items: {type: string, pattern: '[a-z][a-z0-9_-]{0,31}'}
      description: "подсистемы, у которых любой срок (`<sub>/retention` или `<sub>/alarms_retention`) с неверным days (P/05 Н1.3 retention rule), независимо от retention_withheld (R05-RETENTION-MIXED-51-01), по возрастанию байтов; нет таких — поля нет (P/05 Н3 retain, Н4; догадка стадии C C05-RETENTION-PULSE-33, решение «Архитектора» 2026-10-25)"
    retention_withheld:
      type: object
      names:
        key: {type: string, pattern: '[a-z][a-z0-9_-]{0,31}'}
        value: {type: string, enum: [days_garbled, unknown, holds_unread]}
      description: "почему зависимое дерево подсистемы в этом проходе срока не убиралось — закрытый перечень: days_garbled — неверный days, unknown — строка срока не прочитана (хранилище не ответило), holds_unread — удержания не прочитаны (договор удержаний); у подсистемы одна причина по порядку unknown → days_garbled → holds_unread; каждое дерево удерживается по своему сроку (R05-G08, R05-RETENTION-MIXED-51-01); нет причины — поля нет (P/05 Н3 retain, Н4; C05-RETENTION-PULSE-33)"
    restore:
      type: object
      names:
        key: {type: string}
        value:
          type: object
          properties:
            done: {type: boolean}
            silent: {type: boolean}
            last_ok: {type: number}
            last_error: {type: string}
            error_at: {type: number}
            restored: {ref: common.uint53}
            missing: {ref: common.uint53}
            failures: {ref: common.uint53}
            lines_garbled: {ref: common.uint53}
            next: {type: number}
          required: [done, restored, missing, failures]
      description: "`{<сосед>: …}` — восстановление бакетов с копий соседей (Н1.4 «Восстановление бакетов»); в каждом пульсе (E39)"
    mirror:
      type: object
      properties:
        skipped: {ref: common.uint53}
        failed: {ref: common.uint53}
        peer_errors: {ref: common.uint53}
        lines_garbled: {ref: common.uint53}
        sum_refused: {ref: common.uint53}
        peer_sum_refused: {ref: common.uint53}
        pull_sum_bad: {ref: common.uint53}
        unsummed: {ref: common.uint53}
      required: [skipped, failed, peer_errors, lines_garbled]
      description: счётчики зеркала (Н1.4 mirror; skipped — бакеты больше 64 MiB); в каждом пульсе (E39)
  required: [server, ts, url, schema, build, usage, usage_at, space, volumes, units, mirrors, short]
defs:
  disk:
    type: object
    properties:
      total: {ref: common.uint53, description: байты (statfs)}
      free: {ref: common.uint53, description: байты}
      used: {ref: common.uint53, description: байты}
      full: {type: number, minimum: 0, maximum: 1, description: доля used/total от 0 до 1 (не признак)}
    required: [total, free, used, full]
  slot_list:
    type: array
    items: {type: string, pattern: '[^/]+/[^/]+', description: "`<sub>/<имя слота>`"}
