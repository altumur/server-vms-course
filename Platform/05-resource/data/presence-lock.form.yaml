# Семья <корень событий>/.workers/<sub>/<экземпляр>.lock — содержимое замка присутствия, JSON-объект в файле (P/05;
# договор замка присутствия, Platform/common/contracts/presence-lock.md; разбор ревью стадии B 3–5, № 23; ADR-0083
# доп. (11)). Экземпляр — {key, file}: текст файла UTF-8 с encoding: json у корня (DIALECT §8; разбор ревью стадии B 6–7, № 44); ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md.
# Пишет воркер под своим исключающим flock: при старте до захвата имени (worker — ""), заново после каждого захвата
# имени (P/03.2 Н3 «старт()» шаги 2б, 5) и после потери имени (worker — "", Н3 «никто и возврат имени»). Читает ресурс своей коробки. Занятый замок с
# пустым или не по форме содержимым — живой процесс без номера (исход ниже), не unknown; unknown — только файл, который
# не читается. Набор полей закрыт.
dialect: data-form/1
root:
  encoding: json
  type: object
  properties:
    instance:
      type: string
      not_enum: ['']
      description: "экземпляр воркера (P/03.2 Н3 «старт()» шаг 2: INSTANCE_ID или `<коробка>:<pid>:<6 hex>`); имя файла замка — он же в кодировании имён договора журнала событий"
    sub:
      ref: common.sub_name
      description: "подсистема воркера — каталог `.workers/<sub>/` замка"
    worker:
      type: string
      pattern: '|[a-z]{1,8}-[a-z0-9]+(-[a-z0-9]+)*'
      description: "имя слота (P/03.2 Н1.4) или \"\" — до захвата имени и пока воркер ищет без имени (никто); номер n имени `<prefix>-<сервер>-<n>` — для room и live (договор замка присутствия «Счёт room»)"
    server:
      type: string
      pattern: '[a-z0-9]+(-[a-z0-9]+)*'
      description: "сервер воркера — SERVER_NAME (P/02.4 Н1.2)"
    pid:
      ref: common.pos53
      whole: true
      description: "pid процесса воркера — целое ≥ 1; для показа: присутствие — по flock, не по pid (kill(pid, 0) — не источник)"
  required: [instance, sub, worker, server, pid]
