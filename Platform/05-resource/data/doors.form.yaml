# Семья platform/doors/<сервер> — строка двери сервера (P/05; P/05 Н1.4 door_row, room, live).
# Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова —
# Platform/common/DIALECT.md. Пишет ресурс своего сервера каждые 15 с; счёт room.<sub> — договор замка присутствия.
dialect: data-form/1
root:
  type: object
  properties:
    url:
      type: string
      description: адрес двери ресурса (RESOURCE_URL)
    since:
      ref: common.time
      description: момент старта ресурса
    at:
      ref: common.time
      description: момент последней отметки, каждые 15 с; судят по смене версии строки, не по значению (resource_state договора наблюдения)
  required: [url, since, at]
  names:
    key:
      type: string
      writer: {pattern: '(room|live)\.[a-z][a-z0-9_-]{0,31}'}
      description: "`room.<sub>` — элемент каждой подсистемы каталога, чей файл роли `roles/<sub>worker.env` есть на коробке; рядом `live.<sub>` (ADR-0084 доп. (3) Р14′)"
    value:
      type: string
      writer: {pattern: '0|[1-9][0-9]*|unknown|([2-9]|[1-9][0-9])(,([2-9]|[1-9][0-9]))*|'}
      description: >-
        десятичное ≥ 0 — сколько ещё процессов роли `<sub>worker` сервер поднимет (договор замка присутствия «Счёт room»),
        или "unknown"; читатель элемент не по форме строкой не отказывает: элемента нет, не читается или unknown — сервер
        не кандидат в заказ этой роли (P/04 Н3 «заказать()»); у `live.<sub>` — номера n ≥ 2 живых замков роли через запятую
        по возрастанию без повторов из того же снимка, что `room.<sub>`, или пусто; нет или не читается — сервер не кандидат
        (договор замка присутствия, live)
