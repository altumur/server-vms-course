# P/05 — the doors of the server resource: the HTTP contract. Canon — 05-resource.norms.md (N1.1, N1.3, N1.6, N2–N4).
# The console doors are in P/06 (06-console.api.openapi.yaml, chapters 6.1 and 6.4).
# EventRow, UnitRef, SafeSegment, ObjectKey, Sha256 and Subsystem are shared: P/06 refers to them ($ref).
openapi: 3.1.0
info:
  title: P/05 — the doors of the server resource
  version: '1'
  description: 'Canon — 05-resource.norms.md. N2 separates JSON, bytes and the absence of a body; the admission of roles and TLS — N2
    «Resource door admission», P/02.4 N1.6 and the role certificate contract; the internal API is not normed. The forms
    of an implementation may diverge: the contract does not claim that any implementation has been checked against it.'
paths:
  /v1/objects:
    x-route-priority: 50
    get:
      summary: 'Resource: the list of available objects'
      responses:
        '200':
          description: The full list of the available family
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectListing'
        '400':
          description: Wrong scope/prefix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '503':
          description: The listing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '403':
          description: The family is not given out, a row object or a refusal of the identity
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ResourceError'
                - $ref: '#/components/schemas/ResourceDenied'
      parameters:
      - name: prefix
        in: query
        required: false
        schema:
          type: string
        description: The beginning of a relative key; emptiness is allowed. The check by N1.1, separate from the full
          key. The ordinary list does not show the tombstones .gone/; prefix=.gone/ — read only of the tombstones
          {written, peers, acked} (N1.1 «Tombstones»; log of cammeta-go, lesson 10 № 2).
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum:
          - local
          - cluster
          default: local
  /v1/objects/{key}:
    x-route-priority: 60
    parameters:
    - name: key
      in: path
      x-path-capture: remainder
      x-path-decode: percent-segment
      x-path-error:
        GET: {status: 400, response_schema: ResourceError}
        PUT: {status: 400, response_schema: ResourceError}
      required: true
      schema:
        $ref: '#/components/schemas/ObjectKey'
    get:
      summary: 'Resource: read an object'
      responses:
        '200':
          description: The bytes of the selected copy
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            X-Written:
              schema:
                type: string
              description: 'Required: the write time of the selected copy in seconds, decimal text.'
            X-Server:
              schema:
                $ref: '#/components/schemas/SafeSegment'
              description: 'Required: the server of the selected copy.'
            X-Missing:
              schema:
                type: string
              description: 'If there are servers that did not answer: the names, comma-separated.'
        '400':
          description: Wrong key/scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '403':
          description: The family is not given out, a row object or a refusal of the identity
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ResourceError'
                - $ref: '#/components/schemas/ResourceDenied'
        '404':
          description: The object is not found among those that answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
          headers:
            X-Missing:
              schema:
                type: string
              description: The servers that did not answer, comma-separated, if any.
        '503':
          description: Failed to read the copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '413':
          description: The selected body is larger than 64 MiB; before successful headers, without truncation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
      parameters:
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum:
          - local
          - cluster
          default: local
    put:
      summary: Only the refusal of PUT of a non-blob; the full door PUT /v1/objects/{sub}/blobs/{digest} — N2
      responses:
        '400':
          description: Wrong key/scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '405':
          description: This key is not a blob; another object is written by its writer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '403':
          description: Refusal of the identity/role before the operation by the table N2 «Resource door admission»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
      parameters:
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum:
          - local
          - cluster
          default: local
  /v1/objects/{sub}/blobs/{digest}:
    x-route-priority: 20
    parameters:
    - name: sub
      in: path
      x-path-capture: segment
      x-path-decode: percent-segment
      x-path-error:
        PUT: {status: 400, response_schema: ResourceError}
      required: true
      schema:
        $ref: '#/components/schemas/SubsystemName'
    - name: digest
      in: path
      x-path-capture: segment
      x-path-decode: percent-segment
      x-path-error:
        PUT: {status: 405, response_schema: ResourceError}
      required: true
      schema:
        type: string
        pattern: "^(?:sha256-[0-9a-f]{64})$"
    put:
      summary: 'Resource door: accept a full copy of a blob (N1.1 «Bodies at the resource», N2)'
      parameters:
      - name: Content-Length
        in: header
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 67108864
      - name: X-Written
        in: header
        required: true
        schema:
          type: string
          pattern: "^(?:[0-9]+(?:\\.[0-9]+)?)$"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '400':
          description: Wrong path, framing or read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '404':
          description: No path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '405':
          description: The method/family does not admit PUT; a key not of the blob form (uppercase hex, without sha256-) or a subsystem without a blob field — an ordinary object, it is written by the owner (N1.1 «Bodies at the resource» mirror)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '408':
          description: Slow body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '409':
          description: The tombstone is newer than the copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '411':
          description: No length
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '413':
          description: Larger than the limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '422':
          description: The bytes do not match digest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '503':
          description: The store is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '403':
          description: Inadmissible role/family
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ResourceError'
                - $ref: '#/components/schemas/ResourceDenied'
        '204':
          description: The whole copy is accepted; there is no response body
  /events:
    x-route-priority: 70
    get:
      summary: 'Resource: the local index (N1.3, N3 «query (resource)»); the console merge — the contract P/06 (chapter 6.4)'
      description: 'The order and the cut (cut, N1.3) — the same for the resource and for the console merge (chapter 6.4 N3 «merge»): before the cut
        remove duplicates by id; first class alarm, then observation; within a class by by (keep newest — descending, oldest —
        ascending), with equal time — id lexicographically by UTF-8 bytes; the first limit rows. truncated — the number
        of matching rows unique by id that remain after this cut.'
      responses:
        '200':
          description: ResourceEvents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceEvents'
        '400':
          description: Wrong parameters (N1.3, N2, N3 «query»)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '403':
          description: Refusal of the identity/role before the operation by the table N2 «Resource door admission»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
        '405':
          description: The method is not supported (including HEAD and POST, N2) — without a body
        '503':
          description: Busy or there is no index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
          headers:
            Retry-After:
              description: With busy it is required with the value 1.
              schema:
                const: '1'
      parameters:
      - name: from
        in: query
        x-query-lexeme:
          pattern: '^(?:-?(?:[0-9](?:_?[0-9])*(?:\.(?:[0-9](?:_?[0-9])*)?)?|\.(?:[0-9](?:_?[0-9])*))(?:[eE][+-]?[0-9](?:_?[0-9])*)?)$'
          parse: number
          strip: '_'
        required: false
        schema:
          type: number
          default: 0
      - name: to
        in: query
        x-query-lexeme:
          pattern: '^(?:-?(?:[0-9](?:_?[0-9])*(?:\.(?:[0-9](?:_?[0-9])*)?)?|\.(?:[0-9](?:_?[0-9])*))(?:[eE][+-]?[0-9](?:_?[0-9])*)?)$'
          parse: number
          strip: '_'
        required: false
        description: The bound is not included, the window from ≤ t < to (the event log merge contract query).
        schema:
          type: number
          default: 1000000000000.0
      - name: kind
        in: query
        required: false
        schema:
          type: string
      - name: subsystem
        in: query
        required: false
        schema:
          type: string
      - name: unit
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UnitRef'
      - name: limit
        in: query
        x-query-lexeme:
          pattern: '^(?:[0-9]+)$'
          parse: integer
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
      - name: keep
        in: query
        required: false
        schema:
          enum:
          - newest
          - oldest
          default: newest
      - name: class
        in: query
        required: false
        schema:
          enum:
          - alarm
          - observation
      - name: by
        in: query
        required: false
        schema:
          enum:
          - t
          - occurred
          default: t
      - name: late
        in: query
        x-query-lexeme:
          pattern: '^(?:[0-9]+)$'
          parse: integer
        required: false
        description: Only with by=occurred; by how many seconds the write could lag behind occurred (the event log merge contract by).
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          default: 3600
  /events/wait:
    x-route-priority: 10
    get:
      summary: 'Resource: a hint to re-read, without event rows'
      responses:
        '200':
          description: A change, silence, the queue is full or the previous request is displaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitAnswer'
        '400':
          description: Wrong want/client/since/timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
        '503':
          description: The common lane of the resource is busy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceError'
          headers:
            Retry-After:
              description: With busy it is required with the value 1.
              schema:
                const: '1'
        '403':
          description: Refusal of the identity/role before the operation by the table N2 «Resource door admission»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
      parameters:
      - name: want
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Want'
      - name: timeout
        in: query
        x-query-lexeme:
          pattern: '^(?:(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+))$'
          parse: number
        required: false
        schema:
          type: number
          exclusiveMinimum: 0
          maximum: 30
          default: 30
      - name: since
        in: query
        x-query-lexeme:
          pattern: '^(?:0|[1-9][0-9]*)$'
          parse: uint64
        required: false
        schema:
          type: string
          pattern: "^(?:(?:0|[1-9][0-9]*))$"
          description: A decimal uint64, 0 by default. The range check is mandatory. An unknown nonzero value returns WaitQuiet immediately before queue admission.
      - name: client
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^(?:[!-~]+)$"
  /buckets/{sub}/{unit}:
    x-route-priority: 90
    parameters:
    - name: sub
      in: path
      x-path-capture: segment
      x-path-decode: percent-segment
      x-path-error:
        GET: {status: 404, response_schema: "-"}
      required: true
      schema:
        $ref: '#/components/schemas/Subsystem'
    - name: unit
      in: path
      x-path-capture: segment
      x-path-decode: percent-segment
      x-path-error:
        GET: {status: 404, response_schema: "-"}
      required: true
      schema:
        $ref: '#/components/schemas/SafeSegment'
    get:
      summary: 'Resource: the list of buckets of a unit'
      responses:
        '200':
          description: 'UTF-8 JSON Lines: one BucketInfo per LF, without an outer array; an empty list — an empty
            body'
          content:
            application/x-ndjson:
              schema:
                type: string
                x-line-schema:
                  $ref: '#/components/schemas/BucketInfo'
        '500':
          description: Reading the directory or the metadata failed; before successful headers, the body is absent. The list is unknown, not empty.
        '404':
          description: Wrong path/unknown unit; the body is absent
        '403':
          description: Refusal of the identity/role before the operation by the table N2 «Resource door admission»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
  /events/{path}:
    x-route-priority: 80
    parameters:
    - name: path
      in: path
      x-path-capture: remainder
      x-path-decode: percent-segment
      x-path-error:
        GET: {status: 404, response_schema: "-"}
      required: true
      schema:
        $ref: '#/components/schemas/ObjectKey'
      description: A relative path with the suffix .events.jsonl, also .mirror/<server>/... for restoration;
        the segments . and .. are forbidden.
    get:
      summary: 'Resource: the stream of a bucket file'
      responses:
        '200':
          description: The whole bucket up to the size fixed for this read; the object/mirror reception byte ceiling does not cap this GET
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            X-Sum:
              schema:
                $ref: '#/components/schemas/Sha256'
              description: SHA-256 of the full returned body, required.
        '206':
          description: One range of the file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Range:
              schema:
                type: string
              description: 'Required: bytes start-end/size.'
        '404':
          description: There is no available regular bucket file; the body is absent
        '416':
          description: The range is not satisfiable
          content:
            text/plain:
              schema:
                type: string
          headers:
            Content-Range:
              schema:
                type: string
              description: 'Required: bytes */size.'
        '500':
          description: Failed to prepare the full body/its sum; the body is absent
        '403':
          description: Refusal of the identity/role before the operation by the table N2 «Resource door admission»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
      parameters:
      - name: Range
        in: header
        required: false
        schema:
          type: string
          pattern: "^(?:bytes=(?:[0-9]+-[0-9]*|-[1-9][0-9]*))$"
        description: >-
          One range: clamp end to size-1; start >= size or start > end gives 416 with bytes */size.
          A positive suffix longer than a nonempty file gives the whole file as 206; a suffix of an empty file gives 416.
          Malformed/multiple Range and conditional requests are outside the profile; their handling is not judged.
  /mirror/{server}/{path}:
    x-route-priority: 100
    parameters:
    - name: server
      in: path
      x-path-capture: segment
      x-path-decode: percent-segment
      x-path-error:
        PUT: {status: 400, response_schema: "-"}
      required: true
      schema:
        $ref: '#/components/schemas/SafeSegment'
    - name: path
      in: path
      x-path-capture: remainder
      x-path-decode: percent-segment
      x-path-error:
        PUT: {status: 400, response_schema: "-"}
      required: true
      schema:
        $ref: '#/components/schemas/ObjectKey'
    put:
      summary: 'Resource: accept a whole copy of a closed bucket'
      responses:
        '204':
          description: The copy is checked and published; the body is absent
        '400':
          description: Wrong path/sum, no X-Sum or a cut-off body; the body is absent
        '408':
          description: The body came too slowly; the body is absent
        '413':
          description: Larger than 67108864 bytes; the body is absent
        '422':
          description: The SHA-256 of the body did not match; the body is absent
        '500':
          description: A file/publication error; the body is absent
        '403':
          description: Refusal of the identity/role before the operation by the table N2 «Resource door admission»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
      parameters:
      - name: X-Sum
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/Sha256'
      requestBody:
        description: A correctly framed chunked body without Content-Length is accepted with the same full-body, checksum, receive-term and actual byte-limit checks; no 411 is assigned.
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  /mirrored/{server}:
    x-route-priority: 40
    parameters:
    - name: server
      in: path
      x-path-capture: segment
      x-path-decode: percent-segment
      x-path-error:
        GET: {status: 404, response_schema: "-"}
      required: true
      schema:
        $ref: '#/components/schemas/SafeSegment'
    get:
      summary: 'Resource: the list of copies of a server'
      responses:
        '200':
          description: The full list of copies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MirroredListing'
        '500':
          description: Reading the directory or the metadata failed; before successful headers, the body is absent. The list is unknown, not empty.
        '404':
          description: There are no copies of this server; the body is absent
        '403':
          description: Refusal of the identity/role before the operation by the table N2 «Resource door admission»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
  /mirrored/{server}/{path}:
    x-route-priority: 30
    parameters:
    - name: server
      in: path
      x-path-capture: segment
      x-path-decode: percent-segment
      x-path-error:
        GET: {status: 404, response_schema: "-"}
      required: true
      schema:
        $ref: '#/components/schemas/SafeSegment'
    - name: path
      in: path
      x-path-capture: remainder
      x-path-decode: percent-segment
      x-path-error:
        GET: {status: 404, response_schema: "-"}
      required: true
      schema:
        $ref: '#/components/schemas/ObjectKey'
    get:
      summary: 'Resource: a whole copy of a bucket'
      responses:
        '200':
          description: The bytes of the copy
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            X-Sum:
              schema:
                $ref: '#/components/schemas/Sha256'
              description: Required, the sum of the returned copy.
        '404':
          description: There is no such copy; the body is absent
        '500':
          description: Failed to read/check the copy; the body is absent
        '403':
          description: Refusal of the identity/role before the operation by the table N2 «Resource door admission»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDenied'
components:
  schemas:
    SubsystemName:
      description: The name of a loaded subsystem by P/02.1 N1.2 (the original; the contract P/06 refers to it, $ref).
      type: string
      minLength: 1
      maxLength: 32
      pattern: "^(?:[a-z][\\s\\S]*)$"
      not:
        anyOf:
        - pattern: "^(?:[\\s\\S]*[^a-z0-9_-][\\s\\S]*)$"
        - enum:
          - platform
          - domain
          - console
          - audit
          - spec
          - manifest
          - session
          - mounts
          - healthz
          - metrics
          - servers
          - resources
          - where
          - unplaceable
          - policy
          - drain
          - schema
          - events
          - marks
          - requests
          - asked
          - api
    Subsystem:
      type: string
      pattern: "^(?:[a-z][a-z0-9_-]{0,31})$"
    SafeSegment:
      type: string
      minLength: 1
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: "^(?:[\\s\\S]*[/\\\\\u0000-\u001F\u007F-\u009F\u2028\u2029][\\s\\S]*)$"
    ObjectKey:
      type: string
      minLength: 1
      pattern: "^(?:(?:[^/.\\\\\u0000-\u001F\u007F-\u009F\u2028\u2029][^/\\\\\u0000-\u001F\u007F-\u009F\u2028\u2029]*|\\.[^/.\\\\\u0000-\u001F\u007F-\u009F\u2028\u2029][^/\\\\\u0000-\u001F\u007F-\u009F\u2028\u2029]*|\\.\\.[^/\\\\\u0000-\u001F\u007F-\u009F\u2028\u2029]+)(?:/(?:[^/.\\\\\u0000-\u001F\u007F-\u009F\u2028\u2029][^/\\\\\u0000-\u001F\u007F-\u009F\u2028\u2029]*|\\.[^/.\\\\\u0000-\u001F\u007F-\u009F\u2028\u2029][^/\\\\\u0000-\u001F\u007F-\u009F\u2028\u2029]*|\\.\\.[^/\\\\\u0000-\u001F\u007F-\u009F\u2028\u2029]+))*)$"
      description: A non-empty relative key; each segment is non-empty and not a dot or two dots. The check of the meaning of the key
        — N1.1; the schema does not check the symbolic links of the disk. All components and the full path with the root must fit
        into the declared file profile (the event log contract «File names in shared trees»); otherwise 400 before the file operation.
    UnitRef:
      type: string
      minLength: 3
      pattern: "^(?:[a-z][a-z0-9_-]{0,31}(?:\\.alarms)?/[^/|\",\\\\\u0000-\u001F\u007F-\u009F\u2028\u2029]+)$"
      description: A full reference <tree>/<unit>, also console/<instance> and audit/<role>; the instance is limited in advance by the profile of the event log contract. Without exact . and ..
        in the second part; for the addressee of a unit UnitId applies additionally (the contract P/06, chapter 6.1 N1.3); existence is checked where
        the route requires it.
      not:
        pattern: "^(?:[\\s\\S]*/\\.{1,2})$"
    Sha256:
      type: string
      pattern: "^(?:[0-9a-f]{64})$"
    ObjectEntry:
      description: For a tombstone, written is its object-write stamp, server holds the selected copy, and size is the returned body size; read the deletion stamp from the body.
      type: object
      required:
      - written
      - server
      - size
      additionalProperties: false
      properties:
        written:
          type: number
        server:
          $ref: '#/components/schemas/SafeSegment'
        size:
          type: integer
          minimum: 0
    ObjectListing:
      description: Cluster scope polls the local server and every confirmed foreign door without a live filter; known non-answers appear in missing. An unconfirmed poll set or failed local listing gives 503.
      type: object
      required:
      - server
      - objects
      additionalProperties: false
      properties:
        server:
          $ref: '#/components/schemas/SafeSegment'
        objects:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ObjectEntry'
          propertyNames:
            $ref: '#/components/schemas/ObjectKey'
        missing:
          type: array
          items:
            $ref: '#/components/schemas/SafeSegment'
          uniqueItems: true
    ResourceError:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: string
          minLength: 1
    ResourceDenied:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
          minLength: 1
        error:
          const: refused
        role:
          type: string
          minLength: 1
    EventRow:
      type: object
      required:
      - id
      - subsystem
      - unit
      - of
      - epoch
      - t
      - kind
      - server
      - bucket
      - class
      additionalProperties: true
      properties:
        id:
          type: string
          description: 'As read: a string parsed by the form line of the event log contract is given out as is (the reader''s form). The writer''s duty is the canon
            e1-<hex of the tree>-<hex of the unit>-<epoch>-<hex of the instance>-<number> (hex UTF-8, epoch and number decimal), the generation and
            the absence of a repeated number — the event log contract (N1.2).'
        subsystem:
          type: string
          minLength: 1
        unit:
          $ref: '#/components/schemas/UnitRef'
        of:
          type: string
        epoch:
          type: integer
          minimum: 0
        t:
          type: number
        kind:
          type: string
          description: As read (the form of the reader); a non-empty word is the duty of the writer.
        server:
          $ref: '#/components/schemas/SafeSegment'
        bucket:
          $ref: '#/components/schemas/ObjectKey'
        class:
          enum:
          - alarm
          - observation
        epoch_is:
          enum:
          - current
          - fenced
          - earlier-run
          - unknown
        fenced:
          type: boolean
        occurred:
          type: number
        repeats:
          type: integer
          minimum: 1
        since:
          type: number
        until:
          type: number
      description: The subsystem fields are open; the listed platform fields have these types and are not overridden. of
        is empty only for a platform row without an addressee. All JSON numbers are finite. epoch_is and fenced are set by the merger —
        the console or the worker by the event log merge contract (the resource has none of them); unknown — only for the worker;
        consistency of epoch_is/fenced — N1.3.
    ResourceEventRow:
      description: A row of the resource response — without epoch_is and fenced (they are set by the merger, the event log merge contract).
      type: object
      additionalProperties: true
      allOf:
      - $ref: '#/components/schemas/EventRow'
      properties:
        epoch_is: false
        fenced: false
    ResourceEvents:
      type: object
      required:
      - events
      - state
      - truncated
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ResourceEventRow'
        state:
          const: live
        truncated:
          description: The number of matching rows unique by id that did not fit into the local limit after deduplication.
          type: integer
          minimum: 0
        partial:
          const: true
        lines_garbled:
          description: The number of skipped unreadable bucket lines and misplaced files (N1.3; P/01.1 N0 «Stability of output»); the field is absent when nothing is skipped.
          type: integer
          minimum: 1
    WaitPart:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^(?:[A-Za-z0-9_-][A-Za-z0-9_.-]*)$"
    Want:
      type: string
      minLength: 3
      description: 'A comma-separated list: <sub>/<kind>[/<unit>]. Each part is WaitPart; empty elements and spaces
        are not allowed. Matching uses the logical manifest subsystem without .alarms; that suffix is not normalized and matches no subsystem.'
      pattern: "^(?:[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63}/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63}(?:/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63})?(?:,[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63}/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63}(?:/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63})?)*)$"
    Touched:
      type: string
      pattern: "^(?:[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63}/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63}/[A-Za-z0-9_-][A-Za-z0-9_.-]{0,63})$"
    WaitChanged:
      type: object
      required:
      - changed
      - seq
      - touched
      additionalProperties: false
      properties:
        changed:
          const: true
        seq:
          type: integer
          minimum: 1
          maximum: 18446744073709551615
        touched:
          type: array
          items:
            $ref: '#/components/schemas/Touched'
          minItems: 1
          uniqueItems: true
    WaitQuiet:
      description: Quiet hint; immediate for an unknown nonzero since, without queue admission or replacement.
      type: object
      required:
      - changed
      - seq
      additionalProperties: false
      properties:
        changed:
          const: false
        seq:
          type: integer
          minimum: 1
          maximum: 18446744073709551615
    WaitFull:
      type: object
      required:
      - changed
      - seq
      - full
      additionalProperties: false
      properties:
        changed:
          const: false
        seq:
          type: integer
          minimum: 1
          maximum: 18446744073709551615
        full:
          const: true
    WaitReplaced:
      type: object
      required:
      - changed
      - seq
      - replaced
      additionalProperties: false
      properties:
        changed:
          const: false
        seq:
          type: integer
          minimum: 1
          maximum: 18446744073709551615
        replaced:
          const: true
    WaitAnswer:
      oneOf:
      - $ref: '#/components/schemas/WaitChanged'
      - $ref: '#/components/schemas/WaitQuiet'
      - $ref: '#/components/schemas/WaitFull'
      - $ref: '#/components/schemas/WaitReplaced'
    BucketInfo:
      type: object
      required:
      - kind
      - subsystem
      - unit
      - epoch
      - start
      - end
      - path
      - events
      additionalProperties: false
      properties:
        kind:
          const: events
        subsystem:
          type: string
          minLength: 1
        unit:
          $ref: '#/components/schemas/SafeSegment'
        epoch:
          type: integer
          minimum: 0
        start:
          type: number
        end:
          type: number
        path:
          $ref: '#/components/schemas/ObjectKey'
        events:
          type: integer
          minimum: 0
        sha256:
          $ref: '#/components/schemas/Sha256'
    MirroredCopy:
      type: object
      required:
      - path
      - written
      - size
      - sum
      additionalProperties: false
      properties:
        path:
          $ref: '#/components/schemas/ObjectKey'
        written:
          type: number
        size:
          type: integer
          minimum: 0
        sum:
          $ref: '#/components/schemas/Sha256'
    MirroredListing:
      description: A readable existing empty copies directory returns 200 with copies empty; an absent directory returns 404.
      type: object
      required:
      - copies
      additionalProperties: false
      properties:
        copies:
          type: array
          items:
            $ref: '#/components/schemas/MirroredCopy'
