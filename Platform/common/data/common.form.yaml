# Общие определения схем семей данных (ADR-0088 п. 1, доп. (1), (2)). Байты — «Спецификация».
# Читается слоем текста Н1.1 (ADR-0087 доп. (4) В1); слова — Platform/common/DIALECT.md; ссылка — ref: common.<имя>.
dialect: data-form/1
defs:
  time:
    type: time
    description: время Н0 P/01.1 «Время в строке»
  uint53:
    type: integer
    minimum: 0
    maximum: 9007199254740991
    description: целое от 0 до 2^53 − 1
  pos53:
    type: integer
    minimum: 1
    maximum: 9007199254740991
    description: целое от 1 до 2^53 − 1
  sha256_hex:
    type: string
    pattern: '[0-9a-f]{64}'
    description: sha256 — 64 строчные hex-цифры (P/02.3 Н1.5)
  sub_name:
    type: string
    pattern: '[a-z][a-z0-9_-]{0,31}'
    description: имя подсистемы (P/02.1 Н1.2)
  named_id:
    type: string
    pattern: '[^/\\|",\x{0000}-\x{001F}\x{007F}-\x{009F}\x{2028}\x{2029}\x{0660}-\x{0669}\x{06F0}-\x{06F9}\x{07C0}-\x{07C9}\x{0966}-\x{096F}\x{09E6}-\x{09EF}\x{0A66}-\x{0A6F}\x{0AE6}-\x{0AEF}\x{0B66}-\x{0B6F}\x{0BE6}-\x{0BEF}\x{0C66}-\x{0C6F}\x{0CE6}-\x{0CEF}\x{0D66}-\x{0D6F}\x{0DE6}-\x{0DEF}\x{0E50}-\x{0E59}\x{0ED0}-\x{0ED9}\x{0F20}-\x{0F29}\x{1040}-\x{1049}\x{1090}-\x{1099}\x{17E0}-\x{17E9}\x{1810}-\x{1819}\x{1946}-\x{194F}\x{19D0}-\x{19D9}\x{1A80}-\x{1A89}\x{1A90}-\x{1A99}\x{1B50}-\x{1B59}\x{1BB0}-\x{1BB9}\x{1C40}-\x{1C49}\x{1C50}-\x{1C59}\x{A620}-\x{A629}\x{A8D0}-\x{A8D9}\x{A900}-\x{A909}\x{A9D0}-\x{A9D9}\x{A9F0}-\x{A9F9}\x{AA50}-\x{AA59}\x{ABF0}-\x{ABF9}\x{FF10}-\x{FF19}\x{104A0}-\x{104A9}\x{10D30}-\x{10D39}\x{11066}-\x{1106F}\x{110F0}-\x{110F9}\x{11136}-\x{1113F}\x{111D0}-\x{111D9}\x{112F0}-\x{112F9}\x{11450}-\x{11459}\x{114D0}-\x{114D9}\x{11650}-\x{11659}\x{116C0}-\x{116C9}\x{11730}-\x{11739}\x{118E0}-\x{118E9}\x{11950}-\x{11959}\x{11C50}-\x{11C59}\x{11D50}-\x{11D59}\x{11DA0}-\x{11DA9}\x{11F50}-\x{11F59}\x{16A60}-\x{16A69}\x{16AC0}-\x{16AC9}\x{16B50}-\x{16B59}\x{1D7CE}-\x{1D7FF}\x{1E140}-\x{1E149}\x{1E2F0}-\x{1E2F9}\x{1E4F0}-\x{1E4F9}\x{1E950}-\x{1E959}\x{1FBF0}-\x{1FBF9}]+'
    not_enum: ['.', '..']
    description: >-
      id единицы по полю (P/06.1 Н1.3 named): непустой; без / \ | " запятой, управляющих (Cc), разделителей строк и
      абзацев (Zl, Zp) и цифр вне 0–9 (Nd не ASCII); категории — Unicode 15.0.0
  # Урок P/08 «Процесс domain»: формы, общие у семьи держателя и копии агента (глава P/09.1) — решение «Архитектора»
  # 2026-10-20 по планам переноса 8–10, п. 3 (ADR-0083 доп. (14)); внутри файла ссылка — ref: <имя>.
  # имя члена — глава 8.1
  domain_member:
    type: string
    pattern: '[a-z0-9-]{1,64}'
    description: имя члена — CLUSTER его установки, 1–64 знака [a-z0-9-] (P/08.1 Н1.1 member)
  # список членов и топология — глава 8.3 (копии агента domain/member-list, domain/member-topology)
  domain_member_key:
    type: string
    pattern: '[0-9a-f]{64}'
    description: hex открытого ключа Ed25519 члена, 32 байта (ключ члена P/09.1 Н1.1 pub; Entry.key P/08.3 Н1.1)
  domain_member_entry:
    type: object
    properties:
      how:
        type: string
        not_enum: ['']
        writer:
          pattern: 'admitted|holder|held the domain until term [1-9][0-9]*'
        description: откуда член в списке — "admitted" | "holder" | `"held the domain until term <N>"` (P/08.3 Н1.1; два последних — P/08.8 Н1.2)
      since:
        ref: time
        description: стенные секунды держателя записи
      by:
        type: string
        description: человек, принявший члена (P/08.4; до него — operator); только у admitted
      key:
        ref: domain_member_key
        description: ключ члена, принятого по отпечатку; у holder — ключ из первого отчёта его агента
      revoked_keys:
        type: array
        items:
          ref: domain_member_key
        writer:
          max_items: 4
        description: прежние ключи этого имени, отозванные; не больше 4 последних (P/08.10 Н1.5)
      ca:
        type: array
        items:
          ref: sha256_hex
        min_items: 1
        max_items: 2
        unique_items: true
        description: отпечатки центра члена (sha256 DER), 1–2, по возрастанию, без повторов (P/08.3 Н1.6 Entry.ca)
    required: [how, since]
    description: >-
      запись члена Entry (P/08.3 Н1.1); by — только у admitted, Entry не больше ENTRY_MAX 820 байт JCS (P/08.10 Н1.5) —
      проверки урока у писателя, не формы
  domain_members_doc:
    encoding: jcs
    type: object
    properties:
      rev:
        ref: pos53
        description: +1 на каждую запись
      term:
        ref: pos53
        description: срок держателя, записавшего строку (P/08.8 Н1.1; установка — 1)
      members:
        type: object
        names:
          key:
            ref: domain_member
          value:
            ref: domain_member_entry
        writer:
          max_items: 500
        description: записи членов, держатель в счёте; не больше MEMBERS_MAX 500 (P/08.10 Н1.5)
    required: [rev, term, members]
    description: >-
      doc строки domain/members держателя (P/08.3 Н1.1) и её копии domain/member-list у члена — текст JCS (P/09.1 Н1.1,
      Н1.4)
  domain_topology_doc:
    encoding: jcs
    type: object
    properties:
      rev:
        ref: uint53
        description: 0 — «никогда не писали»; +1 на запись
      centre:
        ref: domain_member
        description: член — центр домена; нет — центра нет
      star:
        type: array
        items:
          ref: domain_member
        unique_items: true
        description: звёздные ретрансляторы, по возрастанию, без повторов
      via:
        type: object
        names:
          key:
            ref: domain_member
          value:
            ref: domain_member
        description: член → ретранслятор, через который он отчитывается; члена нет — прямо
      by:
        type: string
        description: кто записал — имя, доказанное сторожевой
      at:
        ref: time
        description: когда записал (стенные секунды консоли)
    required: [rev, star, via]
    description: >-
      doc строки domain/topology держателя (P/08.3 Н1.2) и её копии domain/member-topology у члена — текст JCS (P/09.1
      Н1.4)
  # люди и гранты — глава 8.4 (копия агента domain/grants)
  person_name:
    type: string
    pattern: '[^\x{0000}-\x{0020}\x{007F}\x{0085}\x{00A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}:|()"/]{1,64}'
    not_enum: [break-glass]
    description: >-
      имя человека (P/08.4 Н1.1 name): 1–64 знака без пробельных, управляющих (U+0000–U+001F, U+007F) и : | ( ) " /; не
      ровно break-glass; пробельные — свойство White_Space Unicode 15.0.0, выписанное знаками (решение «Архитектора» 2026-10-20 по вопросам сборки урока 8, п. 3);
      «не субъект индекса имён» — проверка двери (глава 8.5 Н1.7), не форма
  grants_line:
    type: object
    properties:
      subject:
        ref: person_name
        description: имя человека (Н1.1) или субъект индекса имён (глава 8.5 Н1.7); форма — Н1.1 (Н3 «гранты» шаг 3)
      cap:
        type: string
        enum: [view, edit, admin]
        description: view < edit < admin
      scope:
        type: string
        pattern: '\*|unit:[a-z][a-z0-9_-]{0,31}/[^/\\|",\x{0000}-\x{001F}\x{007F}-\x{009F}\x{2028}\x{2029}\x{0660}-\x{0669}\x{06F0}-\x{06F9}\x{07C0}-\x{07C9}\x{0966}-\x{096F}\x{09E6}-\x{09EF}\x{0A66}-\x{0A6F}\x{0AE6}-\x{0AEF}\x{0B66}-\x{0B6F}\x{0BE6}-\x{0BEF}\x{0C66}-\x{0C6F}\x{0CE6}-\x{0CEF}\x{0D66}-\x{0D6F}\x{0DE6}-\x{0DEF}\x{0E50}-\x{0E59}\x{0ED0}-\x{0ED9}\x{0F20}-\x{0F29}\x{1040}-\x{1049}\x{1090}-\x{1099}\x{17E0}-\x{17E9}\x{1810}-\x{1819}\x{1946}-\x{194F}\x{19D0}-\x{19D9}\x{1A80}-\x{1A89}\x{1A90}-\x{1A99}\x{1B50}-\x{1B59}\x{1BB0}-\x{1BB9}\x{1C40}-\x{1C49}\x{1C50}-\x{1C59}\x{A620}-\x{A629}\x{A8D0}-\x{A8D9}\x{A900}-\x{A909}\x{A9D0}-\x{A9D9}\x{A9F0}-\x{A9F9}\x{AA50}-\x{AA59}\x{ABF0}-\x{ABF9}\x{FF10}-\x{FF19}\x{104A0}-\x{104A9}\x{10D30}-\x{10D39}\x{11066}-\x{1106F}\x{110F0}-\x{110F9}\x{11136}-\x{1113F}\x{111D0}-\x{111D9}\x{112F0}-\x{112F9}\x{11450}-\x{11459}\x{114D0}-\x{114D9}\x{11650}-\x{11659}\x{116C0}-\x{116C9}\x{11730}-\x{11739}\x{118E0}-\x{118E9}\x{11950}-\x{11959}\x{11C50}-\x{11C59}\x{11D50}-\x{11D59}\x{11DA0}-\x{11DA9}\x{11F50}-\x{11F59}\x{16A60}-\x{16A69}\x{16AC0}-\x{16AC9}\x{16B50}-\x{16B59}\x{1D7CE}-\x{1D7FF}\x{1E140}-\x{1E149}\x{1E2F0}-\x{1E2F9}\x{1E4F0}-\x{1E4F9}\x{1E950}-\x{1E959}\x{1FBF0}-\x{1FBF9}]+|labels:[A-Za-z0-9][A-Za-z0-9_.:-]{0,63}(,[A-Za-z0-9][A-Za-z0-9_.:-]{0,63})*'
        not_pattern: 'unit:[a-z][a-z0-9_-]{0,31}/\.\.?'
        description: >-
          `*` | `unit:<sub>/<id>` | `labels:<метка>[,<метка>…]` (P/08.4 Н1.3 scope): `<sub>` — имя манифеста (P/02.1), `<id>` — по
          грамматике идентификатора P/06.1 Н1.3 (named_id: не . и ..), метки — азбука меток common/contracts/labels.md;
          метки без повторов — правило строки, не форма
      until:
        ref: time
        description: >-
          0 — без срока; иначе стенные секунды — строка действует, пока now < until; у входа больше трёх знаков дроби —
          округление до тысячных (P/08.4 Н1.3 until); сравнивается по значению (0 и 0.0 — одна строка)
      by:
        type: string
        description: имя, доказанное сторожевой при записи; совпавшая по (subject, cap, scope, until) строка сохраняет свой by
    required: [subject, cap, scope, until, by]
  grants_doc:
    encoding: jcs
    type: object
    properties:
      lines:
        type: array
        items:
          ref: grants_line
        description: >-
          строки по (subject, cap, scope) в байтах UTF-8, затем until по числу, без повторов по (subject, cap, scope,
          until) — порядок и повтор — правило строки (P/08.4 Н1.3 lines), не форма
    required: [lines]
    description: текст JCS {lines} строки грантов (P/08.4 Н1.3); копия члена несёт его как пришёл (P/09.1 Н1.4 member_copy)
  # строка собранной книги — глава 8.5 (копия агента domain/<sub>/<manifest:domain.books>)
  book_missing:
    type: array
    items:
      type: object
      properties:
        member:
          ref: domain_member
          description: член, из-за которого в книге чего-то нет
        why:
          type: string
          enum: [unseen, silent, never, no_copy, bad_contribution, secret_unopened]
          description: закрытый список слов (P/08.5 Н1.3 why); у члена одна запись
      required: [member, why]
    description: >-
      кого не хватает в книге — [{member, why}] по member в байтах UTF-8, один на книгу (P/08.5 Н1.3 missing); порядок и
      «один на член» — правило урока, не форма
  book_row:
    type: object
    description: >-
      строка собранной книги (P/08.5 Н1.3 result): элемент "" — текст JSON {missing}, элемент `<key>` — текст JSON
      {entries, missing} только с элементами, где получатель в to; у держателя секреты value — конверты кольца держателя
      enc:v2 (Н1.3 at_rest), у члена — конверты кольца члена (P/09.1 Н1.4 member_row); ключи элементов —
      произвольно
    properties:
      "":
        encoding: json
        type: object
        properties:
          missing:
            ref: book_missing
        required: [missing]
        description: текст JSON {missing} — полнота книги без ключей
    names:
      key:
        type: string
        pattern: '.+'
        description: key книги — значение поля key входа, непустая строка (P/03.7 Н1.2 entry)
      value:
        encoding: json
        type: object
        properties:
          entries:
            type: array
            items:
              type: object
              properties:
                member:
                  ref: domain_member
                  description: член-вкладчик — из происхождения отчёта, не из входа
                item:
                  type: string
                  pattern: '.+'
                  description: "`<слот>/<item>` для семьи, `<item>` для одиночной строки"
                value:
                  type: object
                  opaque: true
                  description: объект входа как есть; секреты *_secret — конверты кольца (enc:v2), AAD — ключ строки 0x00 «/<item строки>» + JSON Pointer секрета (Н1.3 at_rest)
              required: [member, item, value]
            description: элементы ключа для этого получателя по (member, item) в байтах UTF-8 (Н1.3 order — правило урока, не форма)
          missing:
            ref: book_missing
        required: [entries, missing]
        description: текст JSON {entries, missing}
    required: [""]
  # назначение и исход правки — глава 8.6 (копии агента domain/placed/<sub>/<ref>, domain/outcomes)
  domain_placement:
    type: object
    properties:
      cluster:
        ref: domain_member
        description: член-исполнитель; обязателен; "" — не по форме (форма двери — 400, P/08.6 Н1.1 form)
      origin:
        type: string
        pattern: '([a-z0-9-]{1,64})?'
        description: член-владелец источника; "" — нет; origin — не исполнитель (P/08.6 Н1.1 executors)
      copies:
        encoding: jcs
        type: array
        items:
          ref: domain_member
          description: другой исполнитель
        unique_items: true
        description: текст JCS массива других исполнителей, по возрастанию, без повторов, без cluster; "[]" — нет (порядок и «без cluster» — правила урока, не формы)
      reason:
        type: string
        description: слова оператора; "" — нет
      at:
        ref: time
        description: стенные секунды процесса domain записи
      rev:
        type: string
        pattern: '[1-9][0-9]*'
        description: значение счётчика domain/placement этой записи, десятичным текстом (P/08.6 Н1.1 rev)
    required: [cluster, origin, copies, reason, at, rev]
    description: >-
      запись назначения — строка держателя `domain/placement/<sub>/<ref>` (P/08.6 Н1.1) и её копия у члена
      `domain/placed/<sub>/<ref>` («элементы записи как у держателя», P/09.1 Н1.5 member)
  domain_outcome:
    encoding: json
    type: object
    properties:
      id:
        type: string
        pattern: 'e-[0-9a-f]{12}'
        description: id правки (P/08.6 Н1.4 id); равен имени элемента — правило урока (settle, P/08.6 Н1.6)
      status:
        type: integer
        description: код ответа консоли члена
      result:
        type: string
        enum: [performed, conflict, refused]
        description: performed (2xx) | conflict (412) | refused (иной 4xx, кроме «in flight»)
      error:
        type: string
        description: detail ответа (нет detail — его error) при status ≥ 400, без значений секретов
      at:
        ref: time
        description: стенные секунды агента
      what:
        type: string
        description: what правки (P/08.6 Н1.4)
      kept_at:
        ref: time
        description: at правки (P/08.6 Н1.4 at)
    required: [id, status, result, at, what, kept_at]
    description: >-
      исход правки — текст JSON элемента `<id>` строки исходов: у держателя domain/outcomes/<член> (P/08.6 Н1.6), у члена
      domain/outcomes (P/09.1 Н1.5 outcome)
  # резервная копия — глава 8.8 (хранитель: domain/backup-taken, объект domain/backup)
  domain_backup_pointer:
    type: object
    description: "пара резервной копии и её сумма {term, rev, sha256} (P/08.8 Н1.5 keepers): указатель держателя domain/keepers/<член> и строка хранителя domain/backup-taken"
    properties:
      term:
        ref: pos53
        description: срок держателя, выпустившего резервную копию
      rev:
        ref: pos53
        description: ревизия резервной копии
      sha256:
        ref: sha256_hex
        description: hex sha256 текста JCS документа резервной копии
    required: [term, rev, sha256]
  domain_backup_doc:
    type: object
    description: >-
      документ резервной копии (P/08.8 Н1.5 document) — JCS {term, rev, holder, at, members, state, objects, backup_key_rev,
      holder_member_key?, issuer, kid, sig}, закрытый набор; один документ у держателя (объект `domain/backups/rev-<rev>`) и у
      хранителя (объект domain/backup); подпись — выпускающим, проверка — функция record договора записи срока (вид
      «документ резервной копии»; типы — шаг 1, not_a_record). domain документ не несёт: к домену его привязывает
      выпускающий (record шаги 3–5)
    properties:
      term:
        ref: pos53
        description: срок держателя
      rev:
        ref: pos53
        description: ревизия резервной копии; растёт только при смене содержимого (Н1.5 rev)
      holder:
        ref: domain_member
        description: имя члена-держателя (P/08.1 Н1.1 member)
      at:
        type: number
        description: "стенные секунды подписи; число JSON (record шаг 1: at — число)"
      members:
        type: array
        items:
          ref: domain_member
          description: имя члена
        unique_items: true
        description: имена списка членов, без повторов
      state:
        type: object
        properties: {}
        names:
          key:
            type: string
            description: ключ строки state (Н1.5 state)
          value:
            type: object
            properties: {}
            names:
              key:
                type: string
                description: элемент строки
              value:
                type: string
                description: значение элемента как хранится (текст); *_secret — конверт enc:v2 ключа резервной копии (Н1.5 secrets)
            description: "{<элемент>: <текст>}"
        description: "{<ключ строки>: {<элемент>: <текст>}} — строки, что домен решил и чего нет ни у кого больше (Н1.5 state)"
      objects:
        type: object
        opaque: true
        description: "`{<ключ объекта>: <JSON>}` — общий документ и история тревог (Н1.5 objects)"
      backup_key_rev:
        ref: pos53
        description: ревизия ключа резервной копии (Н1.5 backup_key)
      holder_member_key:
        type: string
        pattern: '[0-9a-f]{64}'
        description: hex открытого ключа члена-держателя, 32 байта; ключ прежнего в списке после переноса (Н1.2 former)
      issuer:
        type: string
        pattern: '[0-9a-f]{64}'
        description: hex открытого ключа выпускающего, 32 байта (договор записи срока)
      kid:
        type: string
        writer: {pattern: '[0-9a-f]{16}'}
        description: "serial выпускающего — первые 16 знаков hex issuer; иное — функция record шаги 3–5, не форма"
      sig:
        type: string
        writer: {pattern: '[A-Za-z0-9_-]{85}[AQgw]'}
        description: >-
          base64url без = подписи Ed25519 выпускающего над UTF-8(JCS(doc без kid и sig)), 64 байта; не base64url, не 64
          байта или не сходится — функция record шаг 5 (bad_signature), не форма
    required: [term, rev, holder, at, members, state, objects, backup_key_rev, issuer, kid, sig]
  # общий документ — глава 8.9 (копия агента: объект domain/shared)
  shared_doc:
    type: object
    description: "общий документ домена (P/08.9 Н1.2 document) — JCS {domain, term, rev, at, by, shared, issuer, kid, sig}, закрытый набор; один документ у держателя (объект `domain/shared-docs/rev-<rev>`) и у члена (объект domain/shared — копия, взятая агентом, P/09.1 Н1.10); подпись — выпускающим, проверка — функция record договора записи срока (вид «общий документ»)"
    properties:
      domain:
        type: string
        description: имя домена (глава 8.2, из М11/2 Н1.1)
      term:
        ref: pos53
        description: "срок держателя (глава 8.8, из М11/10 Н1.1); порядок — (term, rev), term старше"
      rev:
        ref: pos53
        description: номер правки
      at:
        type: number
        description: стенные секунды подписи
      by:
        type: string
        description: "имя, доказанное сторожевой; после переноса — \"domain\""
      shared:
        type: object
        description: "`{<sub>: {<имя>: <значение>}}` — только объявленное P/02.1 Н1.2б; подсистемы и имена по возрастанию (JCS)"
        names:
          key: {ref: sub_name}
          value:
            type: object
            description: "значения подсистемы `<sub>` — имена её domain.shared"
            names:
              key: {type: string}
              value: {type: any, description: "значение поля или документ, объявленные domain.shared манифеста"}
      issuer:
        type: string
        pattern: '[0-9a-f]{64}'
        description: "hex открытого ключа выпускающего (договор записи срока, issuing_key_secret)"
      kid:
        type: string
        pattern: '[0-9a-f]{16}'
        description: serial выпускающего — первые 16 знаков hex issuer
      sig:
        type: string
        description: "base64url без «=» подписи Ed25519 выпускающего над UTF-8(JCS(doc без kid и sig)) (договор записи срока)"
    required: [domain, term, rev, at, by, shared, issuer, kid, sig]
