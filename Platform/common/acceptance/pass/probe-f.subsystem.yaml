# probe-f is the first-kind door of the pass stand (ADR-0112 addendum (3) item 1); the runner substitutes the worker.
name: probe-f
unit: {rows: fthings, id: name, fields: {name: {type: string, required: true}}}
placement: {capacity: {default: 1}}
slot: {prefix: f}
door: {pass: [accounts]}
worker: {exec: /usr/lib/probe-f/worker}
