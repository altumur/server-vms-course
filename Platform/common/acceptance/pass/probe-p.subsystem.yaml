# probe-p is the second-kind pass stand manifest (ADR-0094 B1); the runner substitutes the worker, so this manifest does not affect testsub or testsub2.
name: probe-p
unit: {rows: things, id: name, fields: {name: {type: string, required: true}}}
placement: {capacity: {default: 1}}
slot: {prefix: p}
tables: {stash: {key: name, fields: {name: {type: string, required: true}, note: {type: string}, user: {type: string}}, service: true}}
door:
  pass:
    routes: [api]
    calls: [probe-p/things, probe-p/stash, probe-f/accounts, console/batch, changes, GET session, GET manifest, domain/verify]
    stream: [api/stream]
    wait: {api/x: 300, api/slow: 2}
worker: {exec: /usr/lib/probe-p/worker}
