        '400':
          description: 'The common refusal of console request parsing (chapter 6.5 N2 «Console request parsing»: query, body JSON, a read
            parameter repeated) or of transport — the body is chunked or shorter than declared (chapter 6.5 N4). The form refusal of its own door
            is named by its operation; HEAD has no body'
        '401':
          description: Identity not confirmed — the gate of chapter 6.3 (identity), error denied; open paths — in the same place
            (open_routes); HEAD has no body
        '403':
          description: 'Access refusal — the gate of chapter 6.3: «no grant» (need), «no domain, not loopback», a foreign Origin
            on an acting request by cookie (csrf); error denied; HEAD has no body'
        '404':
          description: No route (chapter 6.5 N2 «Common codes»); this is not a loader answer about a faulty manifest; HEAD has no
            body
        '405':
          description: A method not among those declared for this door, without the Allow header (chapter 6.5 N2 «Common codes»); HEAD has
            no body
        '408':
          description: The body is read too slowly (chapter 6.5 N4); HEAD has no body
        '413':
          description: The body is over the console limit (chapter 6.5 N4); the service fields limit/size of P/01.1 are not added here;
            HEAD has no body
        '429':
          description: The common input limit of the console (chapter 6.5 N4); doors have no new quotas — neither on reading the manifest nor on creating
            units; HEAD has no body
          headers:
            Retry-After:
              description: The retry delay by the rule of the input limit.
              schema:
                type: string
        '503':
          description: 'The common 503 of the door: the lane is taken — busy with Retry-After 1; trust cannot be checked — denied (the gate of
            chapter 6.3, shut; chapter 6.5 N4); other reasons — the mandatory read and a shell with an on…= attribute at pages — unavailable, sealing
            — by the word of its own norm (chapter 6.5 N4); HEAD has no body'
          headers:
            Retry-After:
              description: Mandatory with the value 1 on busy; not promised for the other reasons.
              schema:
                type: string
                const: '1'
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          description: Full JSON body; HEAD has no body
