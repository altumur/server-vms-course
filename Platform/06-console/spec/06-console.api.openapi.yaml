        description: A move by a signature of the root (P/08.8 N1.8 by_file; the request signature contract).
        schema:
          type: string
      - name: X-W2C-Signature
        in: header
        required: false
        description: A move by a signature of the root (P/08.8 N1.8 by_file; the request signature contract).
        schema:
          type: string
      requestBody:
        $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/paths/~1domain~1move/post/requestBody'
      responses:
        '200':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/paths/~1domain~1move/post/responses/200'
        '400':
          description: 'Forwarding to the signer (chapter 6.7 N1.8 order): X-W2C-Via came — one hop; the body is the common parse and
            transport refusal (chapter 6.5 N4). An answer of the domain process with code 400 is passed on as it came (the operation of the OpenAPI of lesson P/08).'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DomainRefusal'
                - $ref: '#/components/schemas/ConsoleRefusal'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/Refusal'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 'POST /domain/move (chapter 6.7 N1.8 order step 3): there is no admin grant of this cluster — the gate of chapter 6.3
            (denied). An answer of the domain process with code 403 is passed on as it came (the move operation of the OpenAPI of lesson P/08).'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Denied'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/Refusal'
        '404':
          $ref: '#/components/responses/SignerNotHere'
        '405':
          $ref: '#/components/responses/Method'
        '408':
          $ref: '#/components/responses/SlowBody'
        '409':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/paths/~1domain~1move/post/responses/409'
        '413':
          $ref: '#/components/responses/LargeBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/SignerFailed'
        '503':
          description: 'Forwarding to the signer: the common 503 of the console (busy, denied — the gate of chapter 6.3, shut; chapter 6.5 N4) or an answer
            of the domain process with code 503 as it came (the operations handoverPrepare, handoverTake, move of the OpenAPI of lesson P/08: standby, frozen, a move is already under way).'
          headers:
            Retry-After:
              description: Required with the value 1 on busy; not promised for the other reasons.
              schema:
                type: string
                const: '1'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GuardUnavailable'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/Refusal'
components:
  pathItems:
    UnitsCollection:
      description: 'Chapter 6.1 (06.1-console.norms.md) — the units door: create, list. The form of the list and of the rows — 6.1; the console
        module calls /<rows> and /<sub>/<rows> (P/07).'
      servers:
      - url: '{origin}'
        description: The short path selects CONSOLE_ROOT.
        variables:
          origin:
            default: http://localhost
            description: Origin of the actual console without the trailing /; this is an example address, not a server setting.
      - url: '{origin}/{sub}'
        description: The name explicitly selects a loaded subsystem, including CONSOLE_ROOT.
        variables:
          origin:
            default: http://localhost
            description: Origin of the actual console without the trailing /; this is an example address, not a server setting.
          sub:
            default: testsub
            description: The name of a loaded manifest per P/02.1; the example is replaced by a chosen name from /mounts.
      parameters:
      - $ref: '#/components/parameters/Rows'
      post:
        summary: create a unit; a repeat by key returns the earlier answer
        parameters:
        - $ref: '#/components/parameters/IfMatch'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientFields'
        responses:
          '201':
            headers:
              ETag:
                $ref: '#/components/headers/ETag'
            description: Created, or the earlier answer of a completed claim. Fields by the manifest types, secrets as a mask; worker is always
              null, including a repeat.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CreatedUnit'
          '400':
            $ref: '#/components/responses/BadRequest'
          '401':
            $ref: '#/components/responses/Unauthenticated'
          '403':
            $ref: '#/components/responses/WriteDenied'
          '404':
            $ref: '#/components/responses/NotFound'
          '405':
            $ref: '#/components/responses/Method'
          '408':
            $ref: '#/components/responses/SlowBody'
          '409':
            description: The name is taken, a reference is broken, or a claim of another console is still in progress.
            content:
              application/json:
                schema:
                  oneOf:
                  - $ref: '#/components/schemas/CreateBusy'
                  - $ref: '#/components/schemas/ReferenceConflict'
          '412':
            $ref: '#/components/responses/RevisionMoved'
          '413':
            $ref: '#/components/responses/LargeBody'
          '422':
            description: The same key with another request fingerprint; the claim does not change.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/KeyReused'
          '429':
            $ref: '#/components/responses/RateLimited'
          '503':
            $ref: '#/components/responses/WriteUnavailable'
      get:
        summary: all units and the configuration available by view (the gate of chapter 6.3, need)
        parameters:
        - name: deleted
          in: query
          required: false
          description: Exactly 1, only together with about — the output of tombstones (N2 «Tombstones by about»).
          schema:
            const: '1'
        - name: about
          in: query
          required: false
          description: The value of the about.field of tombstones; non-empty, only together with deleted.
          schema:
            type: string
            minLength: 1
        responses:
          '200':
            description: rows — units from heartbeats with the worker data; configured — configuration rows with secrets masked.
            content:
              application/json:
                schema:
                  oneOf:
                  - $ref: '#/components/schemas/UnitList'
                  - $ref: '#/components/schemas/DeletedList'
          '400':
            $ref: '#/components/responses/BadRead'
          '401':
            $ref: '#/components/responses/Unauthenticated'
          '403':
            $ref: '#/components/responses/Denied'
          '404':
            $ref: '#/components/responses/NotFound'
          '405':
            $ref: '#/components/responses/Method'
          '408':
            $ref: '#/components/responses/SlowBody'
          '413':
            $ref: '#/components/responses/LargeBody'
          '429':
            $ref: '#/components/responses/RateLimited'
          '503':
            $ref: '#/components/responses/UnitUnavailable'
      head:
        summary: 'HEAD: all units and the configuration available by view (the gate of chapter 6.3, need)'
        responses:
          '200':
            description: rows — units from heartbeats with the worker data; configured — configuration rows with secrets masked;
              HEAD carries no body
          '400':
            description: A common refusal of transport or path, including badkey of the full store key; detail and error, without fault;
              HEAD carries no body
          '401':
            description: Identity not confirmed — the gate of chapter 6.3 (identity), error denied; the open paths — in the same place
              (open_routes); HEAD carries no body
          '403':
            description: 'Access refusal — the gate of chapter 6.3: «no grant» (need), «no domain, not loopback», a foreign Origin
              on an acting request by cookie (csrf); error denied; HEAD carries no body'
          '404':
            description: No row or a tombstone at PUT/DELETE — error no such unit. Unknown route — detail no such
              route, error no such path. An extra segment — detail a unit's path names one unit, error no such path (chapter 6.5
              N2 «Common codes»); HEAD carries no body
          '405':
            description: A method not among those declared for this door, without the Allow header (chapter 6.5 N2 «Common codes»); HEAD carries
              no body
          '408':
            description: The body is read too slowly (chapter 6.5 N4); HEAD carries no body
          '413':
            description: The body is larger than the console limit (chapter 6.5 N4); the service fields limit/size of P/01.1 are not added here;
              HEAD carries no body
          '429':
            description: The common console entry limit (chapter 6.5 N4); the doors have no new quotas — neither on reading the manifest, nor on creating
              units; HEAD carries no body
            headers:
              Retry-After:
                description: The retry deadline by the rule of the entry limit.
                schema:
                  type: string
          '503':
            description: The store is unavailable — error with the text store unavailable; the answer under the key is not remembered. Also
              the lane is busy — error busy and Retry-After 1 (chapter 6.5 N4 «lane busy»), or there were keys, but there is nothing to check
              trust with — error denied (the gate of chapter 6.3, shut; chapter 6.5 N4 «keys existed, no verifier available»); HEAD carries no body
            headers:
              Retry-After:
                description: Required with the value 1 at busy; not promised for the other reasons.
                schema:
                  type: string
                  const: '1'
    UnitItem:
      description: Chapter 6.1 — edit and delete a unit; there is no separate GET of one unit (405).
