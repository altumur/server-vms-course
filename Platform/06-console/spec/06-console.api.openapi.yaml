          $ref: '#/components/schemas/ServerOrEmpty'
        safe:
          type: boolean
        would_strand:
          type: object
          propertyNames:
            $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/SubsystemName
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/UnitId'
        subsystems:
          type: object
          propertyNames:
            $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/SubsystemName
          additionalProperties:
            $ref: '#/components/schemas/SubsystemDrain'
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 200
      not:
        anyOf:
        - const: ..
        - pattern: /
      description: Один непустой сегмент, кроме '..', не больше 200 UTF-8-байт (Н3). maxLength считает символы и не заменяет
        отдельную проверку байтов. Предел полного ключа с префиксом проверяется отдельно по P/01.1 Н1; определённый отказ
        хранилища badkey преобразуется по главе 6.1 Н3–Н4.
    ClientFields:
      type: object
      propertyNames:
        not:
          enum:
          - id
          - revision
          - deleted
          - worker
          - placement
          - epoch
          - phase
          - observed_revision
      additionalProperties: true
      description: Только поля unit.fields; дополнительные имена здесь нужны для произвольной спеки, но неизвестное ей поле
        отказывается. Типы, required, enum, url, blob, json и fixed/inherit проверяются по Н1 и в порядке Н3, а не одним
        валидатором общей схемы. null у поля с inherit — «не задано», значение снова наследуется; у прочих полей, кроме
        json, null — 400 (Н2). PUT содержит изменяемые поля; пустой или null секрет сохраняет прежний (глава 6.2 Н3 «создать/править»,
        шаг 3; при смене поля из bound_to — 400 «must be given anew»). Платформенные имена worker, placement добавлены М10/4;
        phase, observed_revision — М10/5.
    Unit:
      type: object
      required:
      - id
      - revision
      properties:
        id:
          $ref: '#/components/schemas/UnitId'
        revision:
          type: integer
          minimum: 1
      patternProperties:
        _secret$:
          type: string
          enum:
          - ''
          - '***'
      additionalProperties: true
      description: 'Типизированная строка единицы. Остальные поля задаёт unit.fields: int/float — JSON-числа, bool — булево,
        list — массив, json — JSON-значение, string/url/blob — строки; секрет пустой или маска "***" (глава 6.2, mask, добавлено
        М10/7). Отсутствующий inherit и json null не добавляются в ответ. Открытый набор имён поддерживает произвольную
        спеку, а не разрешает чужие поля.'
    CreatedUnit:
      unevaluatedProperties: false
