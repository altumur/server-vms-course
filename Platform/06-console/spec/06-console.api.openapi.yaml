          minimum: 1
        revision:
          type: integer
          minimum: 1
        observed_revision:
          type: integer
          minimum: 0
        worker:
          $ref: '#/components/schemas/WorkerName'
        server:
          type: string
        age:
          type: number
          minimum: 0
        worker_state:
          enum:
          - live
          - stale
      additionalProperties: true
      description: Элемент status пульса (P/03.4 Н1.1) плюс worker, server, age, worker_state (глава 6.1 Н2; фильтрация
        по view — сторожевая главы 6.3, need). Слова подсистемы остаются непрозрачными. Смысл свежести и формирования списка
        — глава 6.1 Н2 («`rows` в `GET /{rows}`»).
    Refusal:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          type: string
        fault:
          type: string
          enum:
          - not_json
          - not_number
          - too_long
          - bad_url
          - must_match
          - unique
          - garbled
    TextRefusal:
      allOf:
      - $ref: '#/components/schemas/Refusal'
      - not:
