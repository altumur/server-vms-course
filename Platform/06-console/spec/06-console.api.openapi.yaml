      properties:
        unit:
          $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/UnitRef
        note:
          type: string
      description: Лишние поля принимаются и игнорируются; note при отсутствии — пустая строка. Тип note проверяется, длина
        уроком не ограничена.
    MarkWritten:
