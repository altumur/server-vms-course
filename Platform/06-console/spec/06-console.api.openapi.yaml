          of chapter 6.1 (another method on it — 405); a wrong named id — 400.
      put:
        summary: edit fields; revision grows at every successful edit
        parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/IdempotencyKey'
          description: Optional. Without it the edit converges by cas and every repeat raises revision; with it — the repeat memory
            (chapter 6.1 N3 «replay memory»), its order is before If-Match.
        - $ref: '#/components/parameters/IfMatch'
