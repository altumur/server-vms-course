        - $ref: '#/components/parameters/RepeatKey'
        - $ref: '#/components/parameters/IfMatch'
        responses:
          '200':
            headers:
              ETag:
                $ref: '#/components/headers/ETag'
            description: The identifier of the marked unit; a repeated deletion — 404.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/DeletedUnit'
          '400':
            $ref: '#/components/responses/BadRead'
          '401':
            $ref: '#/components/responses/Unauthenticated'
          '403':
            $ref: '#/components/responses/WriteDenied'
          '404':
            $ref: '#/components/responses/NotFound'
          '405':
            $ref: '#/components/responses/Method'
          '408':
            $ref: '#/components/responses/SlowBody'
          '412':
            $ref: '#/components/responses/RevisionMoved'
          '409':
            description: A claim of another console is still in progress — in flight.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/RepeatRefused'
          '413':
            $ref: '#/components/responses/LargeBody'
          '422':
            description: The same key with another request fingerprint; the claim does not change.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/KeyReused'
          '429':
            $ref: '#/components/responses/RateLimited'
          '503':
            $ref: '#/components/responses/UnitUnavailable'
