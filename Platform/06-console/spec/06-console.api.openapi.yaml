components:
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Условие правки по revision строки (Н3 «править», «удалить»); не равен — 412, не целое — 400.
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    Rows:
      name: rows
      in: path
      required: true
      description: Имя семьи единиц из unit.rows загруженной спеки; произвольная семья не создаётся.
      schema:
        type: string
        minLength: 1
        pattern: ^[^/]+$
  schemas:
    SpecView:
      type: object
      required:
      - name
      - rows
      - id
      - fields
      - metrics
      - running_gauge
      - workers_gauge
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[a-z]
          not:
            anyOf:
            - pattern: '[^a-z0-9_-]'
            - enum:
              - platform
              - domain
              - console
              - audit
              - spec
              - session
              - mounts
              - healthz
              - metrics
              - servers
              - resources
              - where
              - unplaceable
              - policy
              - drain
              - schema
              - events
              - marks
              - requests
              - asked
              - api
        rows:
          type: string
        id:
          type: string
          not:
            pattern: _secret(?![\s\S])
          description: numeric либо имя несекретного строкового поля единицы по Н1.4.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldView'
        about:
          type: object
          required:
          - sub
          - field
          additionalProperties: false
          properties:
            sub:
              type: string
