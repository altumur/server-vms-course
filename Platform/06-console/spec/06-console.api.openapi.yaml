    FormRefusal:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/Refusal'
      - properties:
          fault:
            enum:
            - not_json
            - not_number
            - too_long
            - bad_url
    CreateBusy:
      allOf:
      - $ref: '#/components/schemas/TextRefusal'
      - properties:
          error:
            enum:
            - exists
            - in flight
    ReferenceConflict:
      allOf:
      - $ref: '#/components/schemas/Refusal'
      - required:
        - fault
        properties:
          error:
            const: conflict
          fault:
            enum:
            - must_match
            - unique
            - garbled
    KeyReused:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/TextRefusal'
      - properties:
          error:
            const: key reused
    SealingUnavailable:
      allOf:
      - $ref: '#/components/schemas/TextRefusal'
      - properties:
          error:
            const: unavailable
          detail:
            const: the sealing key is set and does not read
      description: Кольцо секретов задано, но не читается; все POST/PUT единиц, включая тела без секретов (HMAC памяти повторов),
        глава 6.2.
    UnitUnavailable:
      allOf:
      - $ref: '#/components/schemas/TextRefusal'
      - properties:
          error:
            enum:
            - store unavailable
            - busy
            - denied
    Rid:
      type: string
      minLength: 1
      maxLength: 200
      description: rid по Н1.5 — не более 200 байт UTF-8, без / \ " ' и управляющих (ADR-0060); maxLength не заменяет байтовую
        проверку.
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: '[/\\"''\u0000-\u001F\u007F-\u009F\u2028\u2029]'
    TextError:
