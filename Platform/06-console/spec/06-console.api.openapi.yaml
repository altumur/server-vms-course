          minimum: 0
        units:
          type: integer
          minimum: 0
        pending_writes:
          type: integer
          minimum: 0
        would_strand:
          type: array
          items:
            $ref: '#/components/schemas/UnitId'
        safe:
          type: boolean
        pending_unsaid:
          type: array
          items:
            $ref: '#/components/schemas/WorkerName'
    DrainState:
      type: object
