# P/06 — doors of the cluster console process: HTTP contract (one process door — one lesson contract).
# Chapters refer to their paths (the description of each path names its chapter): 6.1 — /{rows}, /{rows}/{id},
# /{rows}/{id}/{blob_field}, /{table}, /{table}/{name}, /console/batch; 6.3 — /session (the session form and the w2c_glass cookie at /session/break-glass);
# 6.4 — /events (merge by the console), /marks, /{sub}/requests, /{sub}/asked/{sha16}; 6.5 — pages, /platform/*, /healthz,
# /manifest, /{sub}/manifest, /mounts, /servers, /resources, /where, /metrics, /{sub}/…, door.pass /{pass}; 6.6 — /policy, /drain,
# /servers/{server}/labels, /servers/{server}/decommission, /unplaceable, /schema; 6.7 —
# /session/break-glass (door order), /domain/{sub}/books/{book}, forwarding of /domain and /domain/{route} (transitions 1–2 of the forwarding
# contract), /heartbeats, /domain/at/{cluster}/{sub}/where/…, /domain/keys, /domain/shared/{sub}, /api/held, /api/backup, forwarding
# to the signer of /api/prepare, /api/take, /domain/move; 6.8 — /folders, /folders/{id}; 6.9 — /{sub}/operations and the operation doors.
# Forwarding has only the codes of transitions 1–2 of Platform/common/contracts/forwarding.md «Refusals by transition»;
# the answer of the domain console as it came — ForwardAnswer (like PassAnswer at door.pass). For forwarding to the signer the process answer is
# a $ref to the operations of the OpenAPI of lesson P/08; the schemas of the deadline record, of the pair, of the pointer and
# of the member name — a $ref to the OpenAPI of lesson P/08, no copies. The common console codes (chapter 6.5 N2, N4) are listed at their doors
# of chapter 6.7, as at the others: 429 — at every forwarding door, 405 — at /domain/move, as at /api/held, /domain/keys.
# The login of people POST /api/login is a forwarding door, transitions 1–2 (chapter 6.7 N1.2 process).
# The module contract belongs to P/07; /platform/console.js stays with the console. The resource door belongs to P/05.
# Answers 400–429 use the shared response schemas. ManifestView and FieldView at /{sub}/manifest and /mounts are the same as at GET /manifest.
# Server — RFC 1123; UnitId and WorkerName follow norm 6.1 N1.3 without a narrower file profile.
# At 503 of the observations /servers, /resources, /where, /metrics — error unavailable, the answer Unavailable; Retry-After — a string.
# The door.pass path has local refusals. An empty emergency login password is not cut off by the schema (401 per the norm).
# The answer schemas of /events shared with the resource, and SubsystemName — a $ref to the P/05 contract, no copies.
openapi: 3.1.0
info:
  title: P/06 — doors of the cluster console
  version: '1'
  description: 'Canon — the norms of chapters 06.1…06.9-console.norms.md; N2 «Console request parsing» and the common codes (chapter 6.5 N2, N4)
    apply at every door, their answers are listed explicitly at every operation. The short paths of units, tables, blob fields, /policy,
    /unplaceable, /where/{id} select CONSOLE_ROOT; the servers pair {origin}/{sub} explicitly selects a loaded subsystem, including
    root. /manifest, /servers, /where/{table}/{place}, /metrics are declared also with the prefix /{sub}. The common /drain, /schema, /session,
    /mounts, /healthz, /resources, /platform/*, /servers/{server}/…, /console/batch, /folders get no prefix; /events and /marks — without a prefix;
    requests and the record of a person always name the subsystem. One path segment distinguishes the loaded manifest: unit.rows — /{rows},
    tables — /{table}, door.pass — /{pass}; the non-overlap of names and reserved words — the loader P/02.1. The internal API
    is not normed; the contract does not claim that any implementation has been checked against it.'
paths:
  /{rows}/{id}/{blob_field}:
    description: Chapter 6.1 — the door of the body bytes (digest, then the row reference); the copy of the body at the resource — P/05 (05-resource.api.openapi.yaml).
    servers:
    - url: '{origin}'
      description: The short path selects CONSOLE_ROOT.
      variables:
        origin:
          default: http://localhost
          description: Origin of the actual console without the trailing /; this is an example address, not a server setting.
    - url: '{origin}/{sub}'
      description: The name explicitly selects a loaded subsystem, including CONSOLE_ROOT.
      variables:
        origin:
          default: http://localhost
          description: Origin of the actual console without the trailing /; this is an example address, not a server setting.
        sub:
          default: testsub
          description: The name of a loaded manifest per P/02.1; the example is replaced by a chosen name from /mounts.
    parameters:
    - name: rows
      in: path
      required: true
      schema:
        $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/SubsystemName
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UnitId'
    - name: blob_field
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^(?:[A-Za-z_][A-Za-z0-9_]*)$"
        description: The name of an existing unit blob field; an unrepresentable manifest is rejected by the loader per N1.5.
    put:
      summary: Write the blob bytes and then the row reference
      description: >-
        P/06.1-R120 admits two unfinished blob PUT requests per console instance, across all subsystems,
        doors and connections. Admission precedes body reading; an admitted place remains occupied until
        the full response has been sent or the request terminates. A third request in that interval receives
        the existing 503 with Retry-After before body reading. The blob body ceiling is 32 MiB.
      responses:
        '400':
          $ref: '#/components/responses/BadBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WriteDenied'
        '404':
          description: No path, unit, field or row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleRefusal'
        '405':
          $ref: '#/components/responses/Method'
        '408':
          $ref: '#/components/responses/SlowBody'
        '413':
          $ref: '#/components/responses/LargeBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ConsoleUnavailable'
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          description: Full JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobWritten'
        '409':
          description: The row has changed; a repeat starts with reading it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasRefused'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      parameters:
      - name: Content-Length
        in: header
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 33554432
  /console/batch:
    description: Chapter 6.1 N2 «Batch door», N3 «batch» — writing the rows of a unit and of its parts by one store operation, all or nothing.
      The door is common, gets no subsystem prefix; the rows are named by full keys.
    post:
      summary: Write rows as a batch
      parameters:
      - $ref: '#/components/parameters/RepeatKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchInput'
      responses:
        '200':
          description: The batch is written; at a repeat with the same key — the saved answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchWritten'
        '400':
          description: The body or a row not by the form, key, anchor, counter, row check; field — the field path with the row number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRefused'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/WriteDenied'
        '404':
          description: Removal of a missing row or tombstone; no route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRefused'
        '405':
          $ref: '#/components/responses/Method'
        '408':
          $ref: '#/components/responses/SlowBody'
        '409':
          description: References of a row (conflict with fault) or a claim in progress (in flight).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRefused'
        '412':
          description: "A row CAS, revision condition or generation guard diverged; nothing is written. BatchMoved, RevisionMoved and LeaderMoved retain their own conditions and fields."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BatchMoved'
                - $ref: '#/components/schemas/LeaderMoved'
                - $ref: '#/components/schemas/RevisionMoved'
        '413':
          description: Over the batch limits, a row heavier than the ceiling, or the body larger than the console limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRefused'
        '422':
          description: The same key, another body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /folders:
    description: Chapter 6.8 N2 — cluster folders. The door is common, gets no subsystem prefix.
    get:
      summary: Live cluster folders
      parameters:
      - name: member
        in: query
        required: false
        description: A reference to a unit <sub>/<rows>/<id>, percent-encoded; the answer — its folders and the index of the membership row (chapter 6.8 N2).
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Folders by id in UTF-8 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderList'
        '400':
          description: The member reference is not by the form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderRefused'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Denied'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      summary: Create a folder
      parameters:
      - $ref: '#/components/parameters/RepeatKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderInput'
      responses:
        '201':
          description: The folder is created; at a repeat with the same key — the saved answer.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '400':
          description: The body not by the form, depth.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderRefused'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          description: No parent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderRefused'
        '405':
          $ref: '#/components/responses/Method'
        '408':
          $ref: '#/components/responses/SlowBody'
        '409':
          description: The parent or an ancestor has a tombstone; a claim in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderRefused'
        '412':
          description: An ancestor was changed or deleted after the read; nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderRefused'
        '413':
          description: A row or the batch heavier than the ceiling; the body larger than the console limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderRefused'
        '422':
          description: The same key, another body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    head:
      summary: 'HEAD: Live cluster folders'
      parameters:
      - name: member
        in: query
        required: false
        description: A reference to a unit <sub>/<rows>/<id>, percent-encoded; the answer — its folders and the index of the membership row (chapter 6.8 N2).
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Folders by id in UTF-8 bytes.
        '400':
          description: The member reference is not by the form.
        '401':
          description: The identity is not confirmed — the gate of chapter 6.3 (identity), error denied; the open paths — there too (open_routes). A callback with the header X-W2C-Pass-Ticket that did not pass the ticket order — detail «ticket refused» (chapter 6.3 N1.9; the gate and pass contract).
        '403':
          description: 'Access refusal — the gate of chapter 6.3: «no grant» (need), «no domain, not loopback», a foreign Origin on an acting request by cookie (csrf); error denied.'
        '429':
          description: The common input limit of the console (chapter 6.5 N4), error too many attempts; the doors have no new quotas — neither on reading the manifest nor on creating units.
          headers:
            Retry-After:
              description: The retry term by the rule of the input limit.
              schema:
                type: string
        '503':
          description: A required read or write of the store is not confirmed — error unavailable (the doors of chapter 6.6; for the observations /servers, /resources, /where, /metrics — chapter 6.5 N4); the lane is busy — busy with Retry-After 1; there were keys, nothing to check the trust with — denied (the gate of chapter 6.3, shut). Before a repeat of a change, read the state.
          headers:
            Retry-After:
              description: Required with the value 1 on busy; not promised for the other reasons.
              schema:
                type: string
                const: '1'
  /folders/{id}:
    description: Chapter 6.8 N2 — one folder. A tombstone and a folder under a deleted branch do not exist from outside.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    get:
      summary: Folder
      responses:
        '200':
          description: A live folder.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          description: No folder, a tombstone, the folder is unreachable, the segment is not an id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      summary: Rename a folder or set its whole membership
      parameters:
      - $ref: '#/components/parameters/FolderIfMatch'
      - $ref: '#/components/parameters/RepeatKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderPatch'
      responses:
        '200':
          description: The folder after the write; there is no write without changes, the index is the same.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '400':
          description: Body, parent in the body, member, limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderRefused'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          description: No folder, a tombstone, the folder is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderRefused'
        '405':
          $ref: '#/components/responses/Method'
        '408':
          $ref: '#/components/responses/SlowBody'
        '409':
          description: A claim in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderRefused'
        '412':
          description: If-Match diverged (folder moved) or the chain guard (parent moved); nothing is written.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/FolderMoved'
                - $ref: '#/components/schemas/FolderRefused'
        '413':
          description: The folder row or the batch heavier than the ceiling; the body larger than the console limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderRefused'
        '422':
          description: The same key, another body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      summary: Delete a folder; the units remain, the subfolders are unreachable from this index
      parameters:
      - $ref: '#/components/parameters/FolderIfMatch'
      - $ref: '#/components/parameters/RepeatKey'
      responses:
        '200':
          description: The folder is deleted.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderDeleted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          description: No folder, a tombstone, the folder is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderRefused'
        '405':
          $ref: '#/components/responses/Method'
        '408':
          $ref: '#/components/responses/SlowBody'
        '409':
          description: A claim in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderRefused'
        '412':
          description: If-Match diverged (folder moved) or the chain guard (parent moved); nothing is written.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/FolderMoved'
                - $ref: '#/components/schemas/FolderRefused'
        '413':
          description: The batch is heavier than the ceiling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderRefused'
        '422':
          description: The same key, another body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    head:
      summary: 'HEAD: Folder'
      responses:
        '200':
          description: A live folder.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          description: The identity is not confirmed — the gate of chapter 6.3 (identity), error denied; the open paths — there too (open_routes). A callback with the header X-W2C-Pass-Ticket that did not pass the ticket order — detail «ticket refused» (chapter 6.3 N1.9; the gate and pass contract).
        '403':
          description: 'Access refusal — the gate of chapter 6.3: «no grant» (need), «no domain, not loopback», a foreign Origin on an acting request by cookie (csrf); error denied.'
        '404':
          description: No folder, a tombstone, the folder is unreachable, the segment is not an id.
        '429':
          description: The common input limit of the console (chapter 6.5 N4), error too many attempts; the doors have no new quotas — neither on reading the manifest nor on creating units.
          headers:
            Retry-After:
              description: The retry term by the rule of the input limit.
              schema:
                type: string
        '503':
          description: A required read or write of the store is not confirmed — error unavailable (the doors of chapter 6.6; for the observations /servers, /resources, /where, /metrics — chapter 6.5 N4); the lane is busy — busy with Retry-After 1; there were keys, nothing to check the trust with — denied (the gate of chapter 6.3, shut). Before a repeat of a change, read the state.
          headers:
            Retry-After:
              description: Required with the value 1 on busy; not promised for the other reasons.
              schema:
                type: string
                const: '1'
  /{sub}/operations:
    description: Chapter 6.9 N2 — admission of a group operation. There is no listing door.
    parameters:
    - name: sub
      in: path
      required: true
      schema:
        $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/Subsystem
    post:
      summary: Admit an operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationInput'
      responses:
        '202':
          description: The operation is admitted, all steps wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          description: The body not by the form; the limits of steps and operations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationRefused'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          description: The manifest did not declare operations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationRefused'
        '405':
          $ref: '#/components/responses/Method'
        '408':
          $ref: '#/components/responses/SlowBody'
        '409':
          description: The root is busy (root busy) or the id is taken (exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationBusy'
        '412':
          description: The caller memory row diverged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchMoved'
        '413':
          description: The admission batch is heavier than the ceiling; the body larger than the console limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /{sub}/operations/{id}:
    description: Chapter 6.9 N2 — progress and outcome of an operation.
    parameters:
    - name: sub
      in: path
      required: true
      schema:
        $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/Subsystem
    - name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    get:
      summary: Operation
      responses:
        '200':
          description: The record, the counters and the steps.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          description: The manifest did not declare operations; no operation or no view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    head:
      summary: 'HEAD: Operation'
      responses:
        '200':
          description: The record, the counters and the steps.
        '401':
          description: The identity is not confirmed — the gate of chapter 6.3 (identity), error denied; the open paths — there too (open_routes). A callback with the header X-W2C-Pass-Ticket that did not pass the ticket order — detail «ticket refused» (chapter 6.3 N1.9; the gate and pass contract).
        '403':
          description: 'Access refusal — the gate of chapter 6.3: «no grant» (need), «no domain, not loopback», a foreign Origin on an acting request by cookie (csrf); error denied.'
        '404':
          description: The manifest did not declare operations; no operation or no view.
        '429':
          description: The common input limit of the console (chapter 6.5 N4), error too many attempts; the doors have no new quotas — neither on reading the manifest nor on creating units.
          headers:
            Retry-After:
              description: The retry term by the rule of the input limit.
              schema:
                type: string
        '503':
          description: A required read or write of the store is not confirmed — error unavailable (the doors of chapter 6.6; for the observations /servers, /resources, /where, /metrics — chapter 6.5 N4); the lane is busy — busy with Retry-After 1; there were keys, nothing to check the trust with — denied (the gate of chapter 6.3, shut). Before a repeat of a change, read the state.
          headers:
            Retry-After:
              description: Required with the value 1 on busy; not promised for the other reasons.
              schema:
                type: string
                const: '1'
  /{sub}/operations/{id}/pause:
    description: Chapter 6.9 N3 «pause, resume, cancel».
    parameters:
    - name: sub
      in: path
      required: true
      schema:
        $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/Subsystem
    - name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    post:
      summary: Pause
      description: The current step plays to its end, the next one does not start.
      responses:
        '200':
          description: The operation after the write; the value is already so — without a write.
          content:
            application/json:
