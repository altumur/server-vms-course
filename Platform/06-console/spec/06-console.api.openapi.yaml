        ended_at:
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?(?![\s\S])
          description: Конечное число секунд, записанное текстом строки хранилища; числовой диапазон проверяется отдельно.
        instance:
          type: string
          minLength: 1
        slot:
          type: string
          minLength: 1
        of:
          $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/UnitRef
        at:
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?(?![\s\S])
          description: Конечное число секунд, записанное текстом строки хранилища; числовой диапазон проверяется отдельно.
        valid_until:
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?(?![\s\S])
          description: Конечное число секунд, записанное текстом строки хранилища; числовой диапазон проверяется отдельно.
        outcome:
          enum:
          - performed
          - refused
          - unknown
        action:
          type: string
          minLength: 1
        error:
          type: string
          maxLength: 200
        late:
          const: 'true'
      allOf:
      - if:
          properties:
            outcome:
              const: performed
        then:
          required:
          - action
          not:
            required:
            - error
        else:
          required:
          - error
      - if:
          properties:
            outcome:
              const: refused
        then:
          required:
          - action
    ClosedBegun:
      type: object
      required:
      - unit
      - digest
      - ended_at
      - instance
      - slot
      - at
      - outcome
      - ended_by
      - error
      additionalProperties: false
      properties:
        unit:
          $ref: '#/components/schemas/UnitId'
        digest:
          $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/Sha256
        ended_at:
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?(?![\s\S])
          description: Конечное число секунд, записанное текстом строки хранилища; числовой диапазон проверяется отдельно.
        instance:
          type: string
          minLength: 1
        slot:
          type: string
          minLength: 1
        of:
          $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/UnitRef
        at:
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?(?![\s\S])
          description: Конечное число секунд, записанное текстом строки хранилища; числовой диапазон проверяется отдельно.
        valid_until:
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?(?![\s\S])
          description: Конечное число секунд, записанное текстом строки хранилища; числовой диапазон проверяется отдельно.
        outcome:
          const: unknown
        ended_by:
          enum:
          - reaper
          - holder
        error:
          type: string
          maxLength: 200
    NeverBegun:
      type: object
      required:
      - unit
      - digest
      - ended_at
      - outcome
      - ended_by
      additionalProperties: false
      properties:
        unit:
          $ref: '#/components/schemas/UnitId'
        digest:
          $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/Sha256
        ended_at:
          type: string
          pattern: ^-?(?:0|[1-9][0-9]*)(?:\.[0-9]+)?(?:[eE][+-]?[0-9]+)?(?![\s\S])
          description: Конечное число секунд, записанное текстом строки хранилища; числовой диапазон проверяется отдельно.
        outcome:
          enum:
