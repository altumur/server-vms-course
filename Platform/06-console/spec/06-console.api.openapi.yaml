# P/06 — двери процесса консоли кластера: HTTP-контракт (одна дверь процесса — один контракт урока, план урока 6 В6).
# Главы ссылаются на свои пути (описание каждого пути называет главу): 6.1 — /{rows}, /{rows}/{id},
# /{rows}/{id}/{blob_field}, /{table}, /{table}/{name}; 6.3 — /session, /session/break-glass; 6.4 — /events (слияние
# консолью), /marks, /{sub}/requests, /{sub}/asked/{sha16}; 6.5 — страницы, /platform/*, /healthz, /spec, /{sub}/spec,
# /mounts, /servers, /resources, /where, /metrics, /{sub}/…, door.pass /{pass}; 6.6 — /policy, /drain,
# /servers/{server}/labels, /servers/{server}/decommission, /unplaceable, /schema. Глава 6.7 (поздний слой) отложена до
# уроков 8–10 (разбор ревью стадии A 6–7, № 27): /domain/* и /api/* — двери М11, не заглушки этого контракта.
# Слито из контрактов М10/3, М10/4, М10/8 (консольная половина), М10/9 (без договора модуля — P/07; путь
# /platform/console.js остаётся консоли), М10/10 (без двери ресурса — P/05; /drain М10/10 совпадал с М10/4) — стадия B,
# без изменения поведения, кроме правок разбора ревью стадии A 6–7: № 16, № 24 — копии M2_*, M3_*, M4_* сведены к
# подлинникам (ответы 400–429 — подлинниками М10/9; SpecView и FieldView у /{sub}/spec и /mounts — подлинник GET /spec;
# Server — RFC 1123 по М10/4; у UnitId и WorkerName снята фраза о файловом профиле — норма 6.1 (была М10/3 Н1.3):
# более узкого профиля нет; у 503 наблюдений /servers, /resources, /where, /metrics — слово error unavailable, ответ
# Unavailable; Retry-After — строкой, как у подлинника); № 25 — путь door.pass с местными отказами;
# № 29 — пустой пароль аварийного входа не отсекается схемой (401 по норме). Схемы ответа /events, общие с ресурсом,
# и SubsystemName — $ref на контракт P/05 (решение В7 плана урока 6), копий нет.
openapi: 3.1.0
info:
  title: P/06 — двери консоли кластера
  version: '1'
  description: 'Канон — нормы глав 06.1…06.6-console.norms.md; Н2 «Разбор запроса консоли» и общие коды (глава 6.5 Н2, Н4)
    действуют у каждой двери, их ответы перечислены у каждой операции явно. Короткие пути единиц, таблиц, blob-полей, /policy,
    /unplaceable, /where/{id} выбирают CONSOLE_ROOT; пара servers {origin}/{sub} явно выбирает загруженную подсистему, включая
    root. /spec, /servers, /where/{table}/{place}, /metrics объявлены и с префиксом /{sub}. Общие /drain, /schema, /session,
    /mounts, /healthz, /resources, /platform/*, /servers/{server}/… не получают префикса; /events и /marks — без префикса;
    просьбы и учёт человека всегда именуют подсистему. Один сегмент пути различает загруженная спека: unit.rows — /{rows},
    tables — /{table}, door.pass — /{pass}; непересечение имён и зарезервированных слов — загрузчик P/02.1. Внутренний API
    не нормируется; контракт не утверждает, что какая-либо реализация ему проверена.'
paths:
  /{rows}:
    description: 'Глава 6.1 (06.1-console.norms.md) — дверь единиц: создать, список. Форма списка и строк — 6.1; модуль
      консоли зовёт /<rows> и /<sub>/<rows> (P/07).'
    servers:
    - url: '{origin}'
      description: Короткий путь выбирает CONSOLE_ROOT.
      variables:
        origin:
          default: http://localhost
          description: Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.
    - url: '{origin}/{sub}'
      description: Имя явно выбирает загруженную подсистему, включая CONSOLE_ROOT.
      variables:
        origin:
          default: http://localhost
          description: Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.
        sub:
          default: testsub
          description: Имя загруженной спеки по P/02.1; пример заменяется выбранным именем из /mounts.
    parameters:
    - $ref: '#/components/parameters/Rows'
    post:
      summary: создать единицу; повтор по ключу возвращает прежний ответ
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientFields'
      responses:
        '201':
          description: Создано или прежний ответ завершённой заявки. Поля по типам спеки, секреты маской; worker всегда
            null, включая повтор.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedUnit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/Method'
        '408':
          $ref: '#/components/responses/SlowBody'
        '409':
          description: Имя занято, нарушена ссылка либо заявка другой консоли ещё в работе.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CreateBusy'
                - $ref: '#/components/schemas/ReferenceConflict'
        '413':
          $ref: '#/components/responses/LargeBody'
        '422':
          description: Тот же ключ с другим отпечатком запроса; заявка не меняется.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/WriteUnavailable'
    get:
      summary: все единицы и конфигурация, доступные по view (сторожевая главы 6.3, need)
      responses:
        '200':
          description: rows — единицы из пульсов с данными воркера; configured — строки конфигурации с масками секретов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitList'
        '400':
          $ref: '#/components/responses/BadRead'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/Method'
        '408':
          $ref: '#/components/responses/SlowBody'
        '413':
          $ref: '#/components/responses/LargeBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UnitUnavailable'
    head:
      summary: 'HEAD: все единицы и конфигурация, доступные по view (сторожевая главы 6.3, need)'
      responses:
        '200':
          description: rows — единицы из пульсов с данными воркера; configured — строки конфигурации с масками секретов;
            HEAD не содержит тела
        '400':
          description: Общий отказ транспорта или пути, включая badkey полного ключа хранилища; detail и error, без fault;
            HEAD не содержит тела
        '401':
          description: Личность не подтверждена — сторожевая главы 6.3 (identity), error denied; открытые пути — там же
            (open_routes); HEAD не содержит тела
        '403':
          description: 'Отказ доступа — сторожевая главы 6.3: «гранта нет» (need), «нет домена, не петля», чужой Origin
            на действующем запросе по куке (csrf); error denied; HEAD не содержит тела'
        '404':
          description: Нет строки или надгробие у PUT/DELETE — error no such unit. Неизвестный маршрут — detail no such
            route, error no such path. Лишний сегмент — detail a unit's path names one unit, error no such path (глава 6.5
            Н2 «Общие коды»); HEAD не содержит тела
        '405':
          description: Метод не из объявленных для этой двери, без заголовка Allow (глава 6.5 Н2 «Общие коды»); HEAD не
            содержит тела
        '408':
          description: Тело читается слишком медленно (глава 6.5 Н4); HEAD не содержит тела
        '413':
          description: Тело больше предела консоли (глава 6.5 Н4); служебных полей limit/size P/01.1 сюда не добавляет;
            HEAD не содержит тела
        '429':
          description: Общий предел входа консоли (глава 6.5 Н4); новых квот у дверей нет — ни на чтение спеки, ни на создание
            единиц; HEAD не содержит тела
          headers:
            Retry-After:
              description: Срок повтора по правилу предела входа.
              schema:
                type: string
        '503':
          description: Хранилище недоступно — error с текстом store unavailable; ответ под ключом не запоминается. Также
            полоса занята — error busy и Retry-After 1 (глава 6.5 Н4 «полоса занята»), либо ключи были, но проверить доверие
            нечем — error denied (сторожевая главы 6.3, shut; глава 6.5 Н4 «ключи были, проверить нечем»); слова busy и
            denied добавлены М10/9; HEAD не содержит тела
          headers:
            Retry-After:
              description: Обязателен со значением 1 при busy; не обещан для остальных причин.
              schema:
                type: string
                const: '1'
  /{rows}/{id}:
    description: Глава 6.1 — править и удалить единицу; отдельного GET одной единицы нет (405).
    servers:
    - url: '{origin}'
      description: Короткий путь выбирает CONSOLE_ROOT.
      variables:
        origin:
          default: http://localhost
          description: Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.
    - url: '{origin}/{sub}'
      description: Имя явно выбирает загруженную подсистему, включая CONSOLE_ROOT.
      variables:
        origin:
          default: http://localhost
          description: Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.
        sub:
          default: testsub
          description: Имя загруженной спеки по P/02.1; пример заменяется выбранным именем из /mounts.
    parameters:
    - $ref: '#/components/parameters/Rows'
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UnitId'
      description: Ровно один id; грамматика зависит от unit.id (Н1.3). Сегмент процент-декодируется после выбора маршрута;
        не UTF-8 или не по грамматике — 400 bad id (Н2). Путь длиннее одного id — 404, кроме двери байтов /{rows}/{id}/{blob_field}
        главы 6.1 (иной метод на ней — 405); неверный именованный id — 400.
    put:
      summary: править поля; revision растёт при каждой успешной правке
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/IdempotencyKey'
        description: Необязателен и не читается — правка сходится по cas (Н3 «править»); каждый повтор PUT поднимает revision.
          Обязательный ключ и проход повторов POST описаны в Н3.
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientFields'
      responses:
        '200':
          description: Строка после правки; значения по типам спеки, секреты маской, revision увеличен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/Method'
        '408':
          $ref: '#/components/responses/SlowBody'
        '409':
          description: Ссылки по живым строкам; конфликт cas перечитывается внутри прохода.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceConflict'
        '412':
          $ref: '#/components/responses/RevisionMoved'
        '413':
          $ref: '#/components/responses/LargeBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/WriteUnavailable'
    delete:
      summary: пометить удалённой без изменения revision
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Идентификатор помеченной единицы; повторное удаление — 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedUnit'
        '400':
          $ref: '#/components/responses/BadRead'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/Method'
        '408':
          $ref: '#/components/responses/SlowBody'
        '412':
          $ref: '#/components/responses/RevisionMoved'
        '413':
          $ref: '#/components/responses/LargeBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/UnitUnavailable'
  /{rows}/{id}/{blob_field}:
    description: Глава 6.1 — дверь байтов тела (дайджест, затем ссылка строки); копия тела у ресурса — P/05 (05-resource.api.openapi.yaml).
    servers:
    - url: '{origin}'
      description: Короткий путь выбирает CONSOLE_ROOT.
      variables:
        origin:
          default: http://localhost
          description: Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.
    - url: '{origin}/{sub}'
      description: Имя явно выбирает загруженную подсистему, включая CONSOLE_ROOT.
      variables:
        origin:
          default: http://localhost
          description: Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.
        sub:
          default: testsub
          description: Имя загруженной спеки по P/02.1; пример заменяется выбранным именем из /mounts.
    parameters:
    - name: rows
      in: path
      required: true
      schema:
        $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/SubsystemName
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UnitId'
    - name: blob_field
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z_][A-Za-z0-9_]*(?![\s\S])
        description: Имя существующего unit blob-поля; непредставимая спека отвергается загрузчиком по Н1.5.
    put:
      summary: Записать байты blob и затем ссылку строки
      responses:
        '400':
          $ref: '#/components/responses/BadBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          description: Нет пути, единицы, поля или строки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleRefusal'
        '405':
          $ref: '#/components/responses/Method'
        '408':
          $ref: '#/components/responses/SlowBody'
        '413':
          $ref: '#/components/responses/LargeBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ConsoleUnavailable'
        '200':
          description: Полное JSON-тело
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobWritten'
        '409':
          description: Строка изменилась; повтор начинается с её чтения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextRefusal'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      parameters:
      - name: Content-Length
        in: header
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 33554432
  /{table}:
    description: Глава 6.1 — двери таблиц спеки.
    servers:
    - url: '{origin}'
      description: Короткий путь выбирает CONSOLE_ROOT.
      variables:
        origin:
          default: http://localhost
          description: Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.
    - url: '{origin}/{sub}'
      description: Имя явно выбирает загруженную подсистему, включая CONSOLE_ROOT.
      variables:
        origin:
          default: http://localhost
          description: Origin фактической консоли без завершающего /; это пример адреса, не настройка сервера.
        sub:
          default: testsub
          description: Имя загруженной спеки по P/02.1; пример заменяется выбранным именем из /mounts.
    parameters:
    - name: table
      in: path
      required: true
      schema:
        $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/SubsystemName
    get:
      summary: Список строк таблицы без секретов
      responses:
        '400':
          $ref: '#/components/responses/BadBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          description: Нет пути, единицы, поля или строки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleRefusal'
        '405':
          $ref: '#/components/responses/TableMethod'
        '408':
          $ref: '#/components/responses/SlowBody'
        '413':
          $ref: '#/components/responses/LargeBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ConsoleUnavailable'
        '200':
          description: Полное JSON-тело
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableList'
    post:
      summary: Записать полную строку таблицы
      responses:
        '400':
          description: Полное JSON-тело
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/TextRefusal'
                - $ref: '#/components/schemas/FormRefusal'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Denied'
        '404':
          description: Нет пути, единицы, поля или строки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleRefusal'
        '405':
          $ref: '#/components/responses/TableMethod'
        '408':
          $ref: '#/components/responses/SlowBody'
        '413':
          $ref: '#/components/responses/LargeBody'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ConsoleUnavailable'
        '201':
          description: Полное JSON-тело
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableWritten'
        '409':
          description: Полное JSON-тело
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ReferenceConflict'
                - $ref: '#/components/schemas/TextRefusal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableInput'
    head:
      summary: 'HEAD: Список строк таблицы без секретов'
      responses:
        '400':
          description: 'Общий отказ разбора запроса консоли (глава 6.5 Н2 «Разбор запроса консоли»: query, JSON тела, читаемый
            параметр повторён) или транспорта — тело chunked или короче объявленного (глава 6.5 Н4). Отказ формы своей двери
            называет её операция; HEAD не содержит тела'
        '401':
          description: Личность не подтверждена — сторожевая главы 6.3 (identity), error denied; открытые пути — там же
            (open_routes); HEAD не содержит тела
        '403':
          description: 'Отказ доступа — сторожевая главы 6.3: «гранта нет» (need), «нет домена, не петля», чужой Origin
            на действующем запросе по куке (csrf); error denied; HEAD не содержит тела'
        '404':
          description: Нет пути, единицы, поля или строки; HEAD не содержит тела
        '405':
          description: Метод таблицы не из GET, POST и DELETE одной строки (Н2); HEAD не содержит тела
        '408':
          description: Тело читается слишком медленно (глава 6.5 Н4); HEAD не содержит тела
        '413':
          description: Тело больше предела консоли (глава 6.5 Н4); служебных полей limit/size P/01.1 сюда не добавляет;
            HEAD не содержит тела
        '429':
