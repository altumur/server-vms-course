            $ref: '#/components/schemas/ConsoleEventRow'
        state:
          type: string
          pattern: ^live(?:; [^;\r\n]+ (?:unreachable|from mirror))*(?![\s\S])
        truncated:
          description: Сумма локальных truncated плюс пропуски общей обрезки после дедупликации кандидатов; копии могут
            учитываться по нескольким источникам, это не точное число разных пропущенных событий.
          type: integer
          minimum: 0
        partial:
          const: true
        lines_garbled:
          description: Сумма lines_garbled ответивших ресурсов плюс строки ответов ресурсов не по форме EventRow, пропущенные
            консолью (Н3 «слияние»); поля нет, когда пропусков нет.
          type: integer
          minimum: 1
        complete:
          type: boolean
        incomplete:
