          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientFields'
        responses:
          '200':
            headers:
              ETag:
                $ref: '#/components/headers/ETag'
            description: The row after the edit; values by the manifest types, secrets as a mask, revision increased.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Unit'
          '400':
            $ref: '#/components/responses/BadRequest'
          '401':
            $ref: '#/components/responses/Unauthenticated'
          '403':
            $ref: '#/components/responses/WriteDenied'
          '404':
            $ref: '#/components/responses/NotFound'
          '405':
            $ref: '#/components/responses/Method'
          '408':
            $ref: '#/components/responses/SlowBody'
          '409':
            description: References by live rows; a cas conflict is reread inside the pass.
            content:
              application/json:
                schema:
                  oneOf:
                  - $ref: '#/components/schemas/ReferenceConflict'
                  - $ref: '#/components/schemas/RepeatRefused'
          '412':
            $ref: '#/components/responses/RevisionMoved'
          '413':
            $ref: '#/components/responses/LargeBody'
          '422':
            description: The same key with another request fingerprint; the claim does not change.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/KeyReused'
          '429':
            $ref: '#/components/responses/RateLimited'
          '503':
            $ref: '#/components/responses/WriteUnavailable'
      delete:
        summary: mark as deleted without a change of revision
