          properties:
            garbled:
              const: true
        then:
          maxProperties: 2
    TableList:
      type: object
      minProperties: 1
      maxProperties: 1
      propertyNames:
        $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/SubsystemName
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/TableRow'
      description: Единственное имя свойства равно table в пути.
    TableInput:
      type: object
      propertyNames:
        not:
          enum:
          - held_by
          - garbled
          - by
          - at
          - made_at
      additionalProperties: true
      description: Штампы by/at/made_at клиентом не передаются (400 unknown field), независимо от stamp. Только объявленные
        поля этой таблицы; типы, required, enum, schema и ключ проверяются динамически по спеке. id/revision/worker/placement/epoch/phase/observed_revision
        допустимы при объявлении. Поле name допускается только у key=name с типом string.
    TableWritten:
      type: object
      required:
      - row
      additionalProperties: false
      properties:
        row:
          $ref: '#/components/schemas/TableRow'
    TableDeleted:
      type: object
      required:
      - deleted
      additionalProperties: false
      properties:
        deleted:
          $ref: '#/components/schemas/UnitId'
    SnapshotUnit:
      type: object
      required:
      - id
      - revision
      - worker
      - server
      properties:
        id:
          $ref: '#/components/schemas/UnitId'
        revision:
          type: integer
          minimum: 1
        worker:
          anyOf:
          - $ref: '#/components/schemas/WorkerName'
          - type: 'null'
        server:
          anyOf:
          - $ref: '#/components/schemas/Server'
          - type: 'null'
      propertyNames:
        not:
          pattern: _secret(?![\s\S])
      additionalProperties:
        $ref: '#/components/schemas/SecretFreeValue'
      description: Форма шарда снимка <sub>/snapshot/<воркер> — владелец P/04 (data/snapshot.form.yaml, Н1.3а); консоль
        её читает для возраста снимка и счёта испорченных шардов (глава 6.5, P/06.5-11). Путём не отдаётся. Дополнительные
        поля — ровно snapshot по спеке, без blob/секретов/авторского server; server здесь вычисляется платформой. Адреса
        маскированы.
    SnapshotShard:
      type: object
      required:
      - cluster
      - worker
      - ts
      properties:
        cluster:
          type: string
        worker:
          anyOf:
          - $ref: '#/components/schemas/WorkerName'
          - type: 'null'
        ts:
          type: number
      minProperties: 4
      maxProperties: 4
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/SnapshotUnit'
      description: Форма шарда снимка <sub>/snapshot/<воркер> — владелец P/04 (data/snapshot.form.yaml, Н1.3а); консоль
        её читает для возраста снимка и счёта испорченных шардов (глава 6.5, P/06.5-11). Путём не отдаётся. Четвёртое свойство
        — имя rows из спеки; cluster/worker/ts как rows отвергаются загрузчиком. Отдельный шард, без транзакции нескольких
        шардов.
    TableMethod:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/ConsoleRefusal'
      - properties:
          detail:
            type: string
            pattern: takes GET, POST and DELETE of one row(?![\s\S])
          error:
            const: method
  responses:
    BadBody:
      description: 'Общий отказ разбора запроса консоли (глава 6.5 Н2 «Разбор запроса консоли»: query, JSON тела, читаемый
        параметр повторён) или транспорта — тело chunked или короче объявленного (глава 6.5 Н4). Отказ формы своей двери
        называет её операция.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    Unauthenticated:
      description: Личность не подтверждена — сторожевая главы 6.3 (identity), error denied; открытые пути — там же (open_routes).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Denied'
    Denied:
      description: 'Отказ доступа — сторожевая главы 6.3: «гранта нет» (need), «нет домена, не петля», чужой Origin на действующем
        запросе по куке (csrf); error denied.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Denied'
    NoRoute:
      description: Нет маршрута (глава 6.5 Н2 «Общие коды»); это не ответ загрузчика об ошибочной спеке.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoRoute'
    Method:
      description: Метод не из объявленных для этой двери, без заголовка Allow (глава 6.5 Н2 «Общие коды»).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Method'
    SlowBody:
      description: Тело читается слишком медленно (глава 6.5 Н4).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    LargeBody:
      description: Тело больше предела консоли (глава 6.5 Н4); служебных полей limit/size P/01.1 сюда не добавляет.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    RateLimited:
      description: Общий предел входа консоли (глава 6.5 Н4); новых квот у дверей нет — ни на чтение спеки, ни на создание
        единиц.
      headers:
        Retry-After:
          description: Срок повтора по правилу предела входа.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    GuardUnavailable:
      description: Общий отказ консоли — busy с Retry-After 1 либо denied при потере доверия (глава 6.5 Н4, строки «полоса
        занята» и «ключи были, проверить нечем»).
      headers:
        Retry-After:
          description: Обязателен со значением 1 при busy; не обещан для остальных причин.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GuardUnavailable'
    Unavailable:
      description: Обязательное чтение или запись хранилища не подтверждены — error unavailable (двери главы 6.6; у наблюдений
        /servers, /resources, /where, /metrics — глава 6.5 Н4, слово закреплено разбором ревью стадии A 6–7, № 24); полоса
        занята — busy с Retry-After 1; ключи были, проверить доверие нечем — denied (сторожевая главы 6.3, shut). Перед
        повтором изменения прочитать состояние.
      headers:
        Retry-After:
          description: Обязателен со значением 1 при busy; не обещан для остальных причин.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unavailable'
    RevisionMoved:
      description: If-Match не равен revision строки (Н3 «править», «удалить»); ничего не записано.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            - revision
            additionalProperties: false
            properties:
              error:
                const: revision moved
              revision:
                type: integer
                minimum: 1
    BadRead:
      description: Общий отказ транспорта или пути, включая badkey полного ключа хранилища; detail и error, без fault.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TextRefusal'
    BadRequest:
      description: 'Отказ формы по Н4; порядок Н3. Также общий отказ чтения тела консоли: chunked или короткое тело (урок
        9 Н1.3 body, Н4 «тело: chunked / больше / медленно / коротко»). Причины без fault передают detail и error. Отказ
        полного ключа хранилища — error badkey без fault; завершение POST по Н3.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormRefusal'
    NotFound:
      description: Нет строки или надгробие у PUT/DELETE — error no such unit. Неизвестный маршрут — detail no such route,
        error no such path. Лишний сегмент — detail a unit's path names one unit, error no such path (глава 6.5 Н2 «Общие
        коды»).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TextRefusal'
    UnitUnavailable:
      description: Хранилище недоступно — error с текстом store unavailable; ответ под ключом не запоминается. Также полоса
        занята — error busy и Retry-After 1 (глава 6.5 Н4 «полоса занята»), либо ключи были, но проверить доверие нечем
        — error denied (сторожевая главы 6.3, shut; глава 6.5 Н4 «ключи были, проверить нечем»); слова busy и denied добавлены
        М10/9.
      headers:
        Retry-After:
          description: Обязателен со значением 1 при busy; не обещан для остальных причин.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnitUnavailable'
    WriteUnavailable:
      description: Общий 503 по Unavailable либо заданное, но нечитаемое кольцо секретов по главе 6.2 Н4 («ключ задан и
        не читается, любой POST/PUT единицы»). Ответ 5xx как done не сохраняется; состояние pending — по главе 6.1 Н3.
      headers:
        Retry-After:
          description: Обязателен со значением 1 при busy; для ошибки кольца не требуется.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/UnitUnavailable'
            - $ref: '#/components/schemas/SealingUnavailable'
    TableMethod:
      description: Метод таблицы не из GET, POST и DELETE одной строки (Н2).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TableMethod'
    ConsoleUnavailable:
      description: 'Общий 503 двери: полоса занята — busy с Retry-After 1; доверие не проверить — denied (сторожевая главы
        6.3, shut; глава 6.5 Н4); прочие причины — обязательное чтение, оболочка с атрибутом on…= у страниц, запечатывание
        — словом своей нормы (глава 6.5 Н4).'
      headers:
        Retry-After:
          description: Обязателен со значением 1 при busy; не обещан для остальных причин.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    PassFailed:
      description: 'door.pass: воркер не ответил, ответ больше 4 МиБ, оборван или истёк таймаут ответа — до успешных заголовков
        (слова «<worker> did not answer»; глава 6.5, P/06.5-12). Повтор не автоматический: исход выяснить у держателя. Ответ
        воркера с кодом 502 передаётся как получен.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    PassUnavailable:
      description: 'door.pass: у консоли нет клиента к воркерам — «this console passes no route on to a worker»; нет живого
        воркера подсистемы с дверью (определение — глава 6.5, P/06.5-12) — «no worker of <sub> with a door is heard»; общие
        busy и denied — глава 6.5 Н4. Ответ воркера с кодом 503 передаётся как получен.'
      headers:
        Retry-After:
          description: Обязателен со значением 1 при busy; не обещан для остальных причин.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    PassAnswer:
      description: 'Ответ воркера как получен: статус, Content-Type и тело не больше 4 МиБ (глава 6.5); форма — дело подсистемы,
        этот контракт её не задаёт. Перенаправлению консоль не следует.'
      content:
        '*/*':
          schema: {}
x-mounting: Маршруты подсистемы /spec, /servers, /unplaceable, /where, /metrics имеют и префикс /<sub> (у /unplaceable и
  /where/{id} — парой servers). /session, /mounts и /platform общие; страница у смонтированной подсистемы даёт 404 MountedPage.
  Имена читаются из каталога, неизвестный sub — NoRoute.
x-byte-limits: JSON консоли >= 1048576 байт; blob PUT 33554432; копия тела у ресурса — P/05 (67108864). Размер проверяется
  по фактически прочитанным байтам и заголовку, не maxLength строки. Chunked консоли — 400; blob без Content-Length — 400;
  тело door.pass — не больше 1 МиБ, ответ воркера — не больше 4 МиБ.
