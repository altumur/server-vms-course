      description: 'Chapter 6.5 (P/06.5-12) — door.pass: a route whose
        first segment is in door.pass is passed to the live worker of the subsystem with a door (definition — 6.5) with the least name:
        method, path, query, a body of no more than 1 MiB, the headers Authorization, Content-Type, Idempotency-Key, X-Operator; the client
        to the worker — with the role certificate, if there is one. The gate of the console checks its own first, the worker checks the credentials
        again. Framing and the actual bytes of the request are checked before sending; an incomplete body is not passed; the response is buffered
        within 4 MiB before the headers to the client; the console does not follow a redirect; there is no automatic retry. Below — the local
        refusals of the console; the code of the worker response is passed as received (default). The norm — Platform/common/contracts/gate-and-pass.md
        «Forwarding door.pass» (the participant — the domain console).'
      servers:
      - url: '{origin}'
        description: The short path selects CONSOLE_ROOT.
        variables:
          origin:
            default: http://localhost
            description: Origin of the actual console without a trailing /; this is an example address, not a server setting.
      - url: '{origin}/{sub}'
        description: The name explicitly selects a loaded subsystem, CONSOLE_ROOT included; door.pass — of its manifest.
        variables:
          origin:
            default: http://localhost
            description: Origin of the actual console without a trailing /; this is an example address, not a server setting.
          sub:
            default: testsub2
            description: The name of a loaded manifest per P/02.1; the example is replaced by a name chosen from /mounts.
      parameters:
      - name: pass
        in: path
        required: true
        description: A segment from door.pass of the loaded manifest of the subsystem (the key door.pass — P/02.1 «Form»; does not repeat door.routes,
          unit.rows and where — P/02.1 N1.4, rule 81). A path longer than one segment with the same first segment is passed
          the same way; OpenAPI sets no template of several segments. For door.pass of the second kind the route is a path of several segments (P/02.1 N1.4), and the refusals
          of the console 401, 403, 404, 413, 502, 503, 504 whose status is named in refusals of the manifest go in the form ProblemRefusal (the gate and pass contract, refusals).
        schema:
          type: string
          minLength: 1
      get:
        summary: 'door.pass: GET to the worker door'
        responses:
          '400':
            $ref: '#/components/responses/BadBody'
          '401':
            $ref: '#/components/responses/Unauthenticated'
          '403':
            $ref: '#/components/responses/Denied'
          '408':
            $ref: '#/components/responses/SlowBody'
          '413':
            $ref: '#/components/responses/LargeBody'
          '429':
            $ref: '#/components/responses/RateLimited'
          '502':
            $ref: '#/components/responses/PassFailed'
          '503':
            $ref: '#/components/responses/PassUnavailable'
          '504':
            $ref: '#/components/responses/PassTimedOut'
          default:
            $ref: '#/components/responses/PassAnswer'
      post:
        summary: 'door.pass: POST to the worker door'
        responses:
          '400':
            $ref: '#/components/responses/BadBody'
          '401':
            $ref: '#/components/responses/Unauthenticated'
          '403':
            $ref: '#/components/responses/Denied'
          '408':
            $ref: '#/components/responses/SlowBody'
          '413':
            $ref: '#/components/responses/LargeBody'
          '429':
            $ref: '#/components/responses/RateLimited'
          '502':
            $ref: '#/components/responses/PassFailed'
          '503':
            $ref: '#/components/responses/PassUnavailable'
          '504':
            $ref: '#/components/responses/PassTimedOut'
          default:
            $ref: '#/components/responses/PassAnswer'
      put:
        summary: 'door.pass: PUT to the worker door'
        responses:
          '400':
            $ref: '#/components/responses/BadBody'
          '401':
            $ref: '#/components/responses/Unauthenticated'
          '403':
            $ref: '#/components/responses/Denied'
          '408':
            $ref: '#/components/responses/SlowBody'
          '413':
            $ref: '#/components/responses/LargeBody'
          '429':
            $ref: '#/components/responses/RateLimited'
          '502':
            $ref: '#/components/responses/PassFailed'
          '503':
            $ref: '#/components/responses/PassUnavailable'
          '504':
            $ref: '#/components/responses/PassTimedOut'
          default:
            $ref: '#/components/responses/PassAnswer'
      patch:
        summary: 'door.pass: PATCH to the worker door'
        responses:
          '400':
            $ref: '#/components/responses/BadBody'
          '401':
            $ref: '#/components/responses/Unauthenticated'
          '403':
            $ref: '#/components/responses/Denied'
          '408':
            $ref: '#/components/responses/SlowBody'
          '413':
            $ref: '#/components/responses/LargeBody'
          '429':
            $ref: '#/components/responses/RateLimited'
          '502':
            $ref: '#/components/responses/PassFailed'
          '503':
            $ref: '#/components/responses/PassUnavailable'
          '504':
            $ref: '#/components/responses/PassTimedOut'
          default:
            $ref: '#/components/responses/PassAnswer'
      delete:
        summary: 'door.pass: DELETE to the worker door'
        responses:
          '400':
            $ref: '#/components/responses/BadBody'
          '401':
            $ref: '#/components/responses/Unauthenticated'
          '403':
            $ref: '#/components/responses/Denied'
          '408':
            $ref: '#/components/responses/SlowBody'
          '413':
            $ref: '#/components/responses/LargeBody'
          '429':
            $ref: '#/components/responses/RateLimited'
          '502':
            $ref: '#/components/responses/PassFailed'
          '503':
            $ref: '#/components/responses/PassUnavailable'
          '504':
            $ref: '#/components/responses/PassTimedOut'
          default:
            $ref: '#/components/responses/PassAnswer'
      head:
        summary: 'door.pass: HEAD to the worker door'
        responses:
          '400':
            description: 'The common refusal of console request parsing (chapter 6.5 N2 «Console request parsing»: query, the JSON of the body, a read
              parameter repeated) or of transport — a body chunked or shorter than declared (chapter 6.5 N4). The form refusal of its own door
              is named by its operation; HEAD carries no body'
          '401':
            description: Identity not confirmed — the gate of chapter 6.3 (identity), error denied; open paths — there as well
              (open_routes); HEAD carries no body
          '403':
            description: 'Access refusal — the gate of chapter 6.3: «no grant» (need), «no domain, not loopback», a foreign Origin
              on an acting request by cookie (csrf); error denied; HEAD carries no body'
          '408':
            description: The body is read too slowly (chapter 6.5 N4); HEAD carries no body
          '413':
            description: The body is larger than the console limit (chapter 6.5 N4); the service fields limit/size of P/01.1 are not added here;
              HEAD carries no body
          '429':
            description: The common entry limit of the console (chapter 6.5 N4); the doors have no new quotas — neither on reading the manifest nor on creating
              units; HEAD carries no body
            headers:
              Retry-After:
                description: The retry time by the rule of the entry limit.
                schema:
                  type: string
          '502':
            description: 'door.pass: the worker did not answer, the response is larger than 4 MiB, cut off, or the response timeout expired — before successful
              headers (error denied, detail «<worker> did not answer»; chapter 6.5, P/06.5-12). The retry is not automatic: find out the outcome
              from the holder. A worker response with code 502 is passed as received; HEAD carries no body'
          '503':
            description: 'door.pass: the console has no client to workers — error denied, detail «this console passes no route on to a
              worker»; no live worker of the subsystem with a door (definition — chapter 6.5, P/06.5-12) — error denied, detail «no
              worker of <sub> with a door is heard»; the common busy and denied — chapter 6.5 N4. A worker response with code 503 is passed as received; HEAD carries no
              body'
            headers:
              Retry-After:
                description: Required with the value 1 on busy; not promised for the other causes.
                schema:
                  type: string
                  const: '1'
          default:
            description: 'The worker response as received: status, Content-Type and a body of no more than 4 MiB (chapter 6.5); the form is the business
              of the subsystem, this contract does not set it. The console does not follow a redirect; HEAD carries no body'
    ConsoleFile:
      description: 'Chapter 6.5 (06.5-console.norms.md, N2 «Static files») — a file of the list console.files of the manifest. A name from the list is resolved before the routes of the mounted subsystem; anything else — they, then NoRoute. The query string is not judged.'
      get:
        summary: Static file of a subsystem
        responses:
          '400':
            $ref: '#/components/responses/BadBody'
          '401':
            $ref: '#/components/responses/Unauthenticated'
          '403':
            $ref: '#/components/responses/Denied'
          '404':
            description: The name is not in the list and there is no route; an unknown sub
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/NoRoute'
          '405':
            $ref: '#/components/responses/Method'
          '408':
            $ref: '#/components/responses/SlowBody'
          '413':
            $ref: '#/components/responses/LargeBody'
          '429':
            $ref: '#/components/responses/RateLimited'
          '503':
            $ref: '#/components/responses/ConsoleUnavailable'
          '200':
            description: The bytes of the file whole; the type — by the extension (N2 «Static files»)
            content:
              text/javascript:
                schema:
                  type: string
              text/css:
                schema:
                  type: string
              application/json:
                schema: {}
              font/woff2:
                schema:
                  type: string
                  contentMediaType: font/woff2
              font/woff:
                schema:
                  type: string
                  contentMediaType: font/woff
              font/ttf:
                schema:
                  type: string
                  contentMediaType: font/ttf
              image/png:
                schema:
                  type: string
                  contentMediaType: image/png
              image/svg+xml:
                schema:
                  type: string
            headers:
              X-Content-Type-Options:
                schema:
                  type: string
                  const: nosniff
                description: Required for every type.
              Content-Security-Policy:
                schema:
                  type: string
                  minLength: 1
                description: Required for svg, the value sandbox.
      head:
        summary: 'HEAD: Static file of a subsystem'
        responses:
          '400':
            description: 'The common refusal of console request parsing (chapter 6.5 N2 «Console request parsing»: query, the JSON of the body, a read
              parameter repeated) or of transport — a body chunked or shorter than declared (chapter 6.5 N4). The form refusal of its own door
              is named by its operation; HEAD carries no body'
          '401':
            description: Identity not confirmed — the gate of chapter 6.3 (identity), error denied; open paths — there as well
              (open_routes); HEAD carries no body
          '403':
            description: 'Access refusal — the gate of chapter 6.3: «no grant» (need), «no domain, not loopback», a foreign Origin
              on an acting request by cookie (csrf); error denied; HEAD carries no body'
          '404':
            description: The name is not in the list and there is no route; an unknown sub; HEAD carries no body
          '405':
            description: A method not among those declared for this door, without the Allow header (chapter 6.5 N2 «Common codes»); HEAD carries
              no body
          '408':
            description: The body is read too slowly (chapter 6.5 N4); HEAD carries no body
          '413':
            description: The body is larger than the console limit (chapter 6.5 N4); the service fields limit/size of P/01.1 are not added here;
              HEAD carries no body
          '429':
            description: The common entry limit of the console (chapter 6.5 N4); the doors have no new quotas — neither on reading the manifest nor on creating
              units; HEAD carries no body
            headers:
              Retry-After:
                description: The retry time by the rule of the entry limit.
                schema:
                  type: string
          '503':
            description: 'The common 503 of the door: the lane is taken — busy with Retry-After 1; trust cannot be checked — denied (the gate of
              chapter 6.3, shut; chapter 6.5 N4); the other causes — the mandatory read and a shell with an attribute on…= in pages — unavailable, sealing
              — by the word of its own norm (chapter 6.5 N4); HEAD carries no body'
            headers:
              Retry-After:
                description: Required with the value 1 on busy; not promised for the other causes.
                schema:
                  type: string
                  const: '1'
          '200':
            description: 'As GET: the same headers by the extension; HEAD carries no body'
            headers:
              X-Content-Type-Options:
                schema:
                  type: string
                  const: nosniff
                description: Required for every type.
              Content-Security-Policy:
                schema:
                  type: string
                  minLength: 1
                description: Required for svg, the value sandbox.
      parameters:
      - name: sub
        in: path
        required: true
        schema:
          $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/SubsystemName
      - name: file
        in: path
        required: true
        description: A name from the list console.files; may contain /, is compared with the request path byte for byte (P/02.1 N1.2a).
        schema:
          type: string
  headers:
    ETag:
      description: The store index of the row in double quotes, a strong RFC 9110 tag; for DELETE of a unit — the index of the tombstone (chapter 6.1 N2 «Versions»). The value is fit for If-Match.
      schema:
        type: string
        pattern: "^(?:\"(?:0|[1-9][0-9]{0,19})\")$"
  parameters:
    FolderIfMatch:
      name: If-Match
      in: header
      required: false
      description: The index of the folder row in double quotes, as ETag gave it (chapter 6.8 N2). A folder has no revision, another value — 400 If-Match is a unit revision.
      schema:
        type: string
    RepeatKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional at this door: absent — the pass is as before, a repeat is a new write; present — the replay memory (chapter
        6.1 N3 «replay memory»).'
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 'The condition of the write (chapter 6.1 N2 «Versions»): the revision of the row — a decimal integer ≥ 1 — or the store index in double quotes, as ETag gave it. Not equal — 412, another form — 400.'
      schema:
        type: string
        pattern: "^(?:[1-9][0-9]*|\"(?:0|[1-9][0-9]{0,19})\")$"
    Rows:
      name: rows
      in: path
      required: true
      description: The name of a unit family from unit.rows of the loaded manifest; an arbitrary family is not created.
      schema:
        type: string
        minLength: 1
        pattern: "^(?:[^/]+)$"
    AtSub:
      name: sub
      in: path
      required: true
      description: The catalog manifest of this console (chapter 6.7 N1.6 routes).
      schema:
        type: string
        pattern: "^(?:[a-z][a-z0-9_-]{0,31})$"
  schemas:
    RevisionMoved:
      type: object
      required:
      - detail
      - error
      - field
      - revision
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          const: revision moved
        field:
          const: /revision
        revision:
          type: integer
          minimum: 0
          description: The current revision; 0 — there is no row or the field does not read.
        row:
          type: object
          additionalProperties: true
          description: The current row in the read form of the door, secrets masked; only with the right to read this row, no row or a tombstone — no field.
    VerifyInput:
      type: object
      description: Chapter 6.7 N1.15.
      required:
      - user
      - password
      additionalProperties: false
      properties:
        user:
          type: string
        password:
          type: string
        need:
          type: object
          required:
          - cap
          - sub
          - units
          additionalProperties: false
          properties:
            cap:
              enum:
              - view
              - edit
              - admin
            sub:
              type: string
              pattern: ^(?:[a-z][a-z0-9_-]{0,31})$
            units:
              type: array
              minItems: 1
              maxItems: 256
              uniqueItems: true
              items:
                type: string
                description: '<sub>/<id>: the name of the subsystem, «/», id — one non-empty segment without «/»'
                pattern: ^(?:[a-z][a-z0-9_-]{0,31}/[^/]+)$
    VerifyAnswer:
      type: object
      description: Chapter 6.7 N1.15; need and supervision — only when the request has need.
      required:
      - user
      additionalProperties: false
      properties:
        user:
          type: string
        need:
          type: array
          items:
            type: object
            required:
            - unit
            - may
            additionalProperties: false
            properties:
              unit:
                type: string
              may:
                enum:
                - allow
                - deny
        supervision:
          type: object
          required:
          - required
          - ok
          additionalProperties: false
          properties:
            required:
              type: boolean
            ok:
              type: boolean
            unreadable:
              type: boolean
    VerifyUnavailable:
      type: object
      description: Own 503 of POST /domain/verify after credential verification. An unreadable supervision input requires supervision.unreadable true; an ordinary need unavailability may omit supervision. Common gate and forwarded domain refusals retain their own conditions and schemas.
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          const: unavailable
        supervision:
          type: object
          required:
          - unreadable
          additionalProperties: false
          properties:
            unreadable:
              const: true
    ManifestSource:
      type: object
      description: Chapter 6.5 N2 «GET /manifest/<sub>/source».
      required:
      - name
      - rev
      - served
      - sha256
      - manifest
      - secret_defaults
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^(?:[a-z][a-z0-9_-]{0,31})$
        rev:
          type: integer
          minimum: 1
          description: The revision of the manifest row in the catalog the console serves since its start (P/02.3).
        served:
          type: integer
          minimum: 1
          description: The revision the console serves — equal to rev; the installation waits for 200 with served = its own rev.
        sha256:
          type: string
          pattern: ^(?:[0-9a-f]{64})$
          description: SHA-256 of the bytes of the manifest yaml (P/02.3).
        manifest:
          type: object
          additionalProperties: true
          description: The canonical view P/02.2 of the manifest of the start catalog (02.2-installer.view.schema.json); default of the *_secret fields — null.
        secret_defaults:
          type: array
          uniqueItems: true
          description: The names of the *_secret fields for which the manifest set a default — <field> or <t>.<field>, in ascending byte order; the value is not given out.
          items:
            type: string
    ManifestView:
      type: object
      required:
      - name
      - rows
      - id
      - fields
      - metrics
      - running_gauge
      - workers_gauge
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^(?:[a-z][\\s\\S]*)$"
          not:
            anyOf:
            - pattern: "^(?:[\\s\\S]*[^a-z0-9_-][\\s\\S]*)$"
            - enum:
              - platform
              - domain
              - console
              - audit
              - spec
              - manifest
              - session
              - mounts
              - healthz
              - metrics
              - servers
              - resources
              - where
              - unplaceable
              - policy
              - drain
              - schema
              - events
              - marks
              - requests
              - asked
              - api
        rows:
          type: string
        id:
          type: string
          not:
            pattern: "^(?:[\\s\\S]*_secret)$"
          description: numeric or the name of a non-secret string field of the unit by N1.4.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldView'
        about:
          type: object
          required:
          - sub
          - field
          additionalProperties: false
          properties:
            sub:
              type: string
              pattern: "^(?:[a-z][a-z0-9_-]{0,31})$"
            field:
              type: string
        display:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
        servers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
        door:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
        places:
          type: object
          description: placement.places of the manifest, as loaded (meaning — P/04 N1.3); absent if there is no section.
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
        domain:
          type: object
          description: The projection of the domain section of the manifest that the console module reads (N2 «GET /manifest»); present when the section
            is present.
          required:
          - view
          - edit
          - shared
          - keys
          additionalProperties: false
          properties:
            view:
              type: array
              items:
                type: string
            edit:
              type: array
              items:
                type: string
            shared:
              type: array
              items:
                type: string
              description: The names of the domain.shared fields.
            keys:
              type: array
              items:
                type: object
                required:
                - id
                - keys
                additionalProperties: false
                properties:
                  id:
                    type: string
                  keys:
                    type: array
                    items:
                      type: string
                  prefix:
                    type: string
        metrics:
          type: object
          required:
          - prefix
          - running
          additionalProperties: false
          properties:
            prefix:
              type: string
              description: The prefix of the metric names of the subsystem — its name with `-` replaced by `_` (for testsub — "testsub", for cam-x —
                "cam_x"); the series name is <prefix>_<metric> (chapter 6.5).
            running:
              type:
              - string
              - 'null'
              description: null if the manifest has no console.running (N2).
        running_gauge:
          type:
          - string
          - 'null'
          description: null if the manifest has no console.running (N2); workers_gauge is always present.
        workers_gauge:
          type: string
    JsonValue:
      description: JSON value from a loaded manifest. Numeric bounds apply recursively, including opaque sections.
      unevaluatedProperties: false
      anyOf:
      - type:
        - 'null'
        - boolean
        - string
      - type: number
        minimum: -1.7976931348623157e+308
        maximum: 1.7976931348623157e+308
      - type: array
        items:
          $ref: '#/components/schemas/JsonValue'
      - type: object
        additionalProperties:
          $ref: '#/components/schemas/JsonValue'
    ProblemRefusal:
      type: object
      description: A console refusal on a door.pass route of the second kind with refusals of the manifest (application/problem+json; the gate and pass contract, refusals). code is the value
        of the manifest map, message is the detail of the refusal.
      required:
      - code
      - message
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^(?:[A-Z][A-Z0-9_]{0,63})$
        message:
          type: string
    ConsoleRefusal:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          type: string
          enum:
          - denied
          - busy
          - unavailable
          - too many attempts
          - no such path
          - method
          - refused
          - badkey
          - labels
          - no such unit
          - no such blob field
          - no such row
          - If-Match is a unit revision
          - a version is a whole number from 1
          - this console is open
          - open
          - bad body
          - a mark names a unit
          - no requests
          - exists
          - spent
          - too many
          - store unavailable
          - Idempotency-Key required
          - in flight
          - key reused
          - row too large
        field:
          $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/RefusalField'
      description: The common form of a console refusal (chapter 6.5 N4) `{detail, error, field?}`; this is not a loader diagnostic and not a store
        Fault. The error words of the doors of chapters 6.1, 6.4, 6.5, 6.6 — the closed list data/refusal-words.tsv; the words of /session — the guard
        and pass contract.
    ConsoleRefused:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/ConsoleRefusal'
      - properties:
          error:
            const: refused
    Denied:
      $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Denied'
    WritesVia:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      description: 'A write refused by writes_via (chapter 6.1 N1.1a): error writes via, without field. The detail names the allowed subsystems;
        for a batch it also names the row number. Nothing is written.'
      properties:
        detail:
          type: string
        error:
          const: writes via
    NoRoute:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/ConsoleRefusal'
      - properties:
          detail:
            const: no such route
          error:
            const: no such path
    Method:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/ConsoleRefusal'
      - properties:
          detail:
            const: method
          error:
            const: method
    GuardUnavailable:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/ConsoleRefusal'
      - properties:
          error:
            enum:
            - busy
            - denied
    FieldView:
      type: object
      required:
      - name
      - type
      - default
      - required
      additionalProperties: false
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - string
          - int
          - float
          - bool
          - list
          - json
          - url
          - blob
        default:
          description: The default of the field as written; none — null. For a *_secret field — always null, even if the manifest set it
            (the value of a secret is not given out; P/06.5 N2 «GET /manifest»).
        required:
          type: boolean
        fixed:
          type: boolean
        hidden:
          type: boolean
        bound_to:
          type: array
          items:
            type: string
        enum: {}
        inherit: {}
        merge:
          type: string
      dependentRequired:
        merge:
        - inherit
      allOf:
      - if:
          required:
          - inherit
        then:
          properties:
            default:
              type: 'null'
      oneOf:
      - properties:
          type:
            const: string
          default:
            anyOf:
            - type: 'null'
            - type: string
          inherit:
            type: string
          enum:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
      - properties:
          type:
            const: int
          default:
            anyOf:
            - type: 'null'
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          inherit:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
        not:
          required:
          - enum
      - properties:
          type:
            const: float
          default:
            anyOf:
            - type: 'null'
            - type: number
              minimum: -1.7976931348623157e+308
              maximum: 1.7976931348623157e+308
          inherit:
            type: number
            minimum: -1.7976931348623157e+308
            maximum: 1.7976931348623157e+308
        not:
          required:
          - enum
      - properties:
          type:
            const: bool
          default:
            anyOf:
            - type: 'null'
            - type: boolean
          inherit:
            type: boolean
          enum:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: boolean
      - properties:
          type:
            const: list
          default:
            anyOf:
            - type: 'null'
            - type: array
              items:
                type: string
          inherit:
            type: array
            items:
              type: string
        not:
          required:
          - enum
      - properties:
          type:
            const: json
          default:
            $ref: '#/components/schemas/JsonValue'
          inherit:
            $ref: '#/components/schemas/JsonValue'
        not:
          required:
          - enum
      - properties:
          type:
            const: url
          default:
            anyOf:
            - type: 'null'
            - type: string
          inherit:
            type: string
        not:
          required:
          - enum
      - properties:
          type:
            const: blob
          default:
            type: 'null'
          inherit:
            type: 'null'
          required:
            const: false
        not:
          anyOf:
          - required:
            - enum
          - required:
            - inherit
      description: Loaded field form. default is always present; null means no explicit default (or JSON null). inherit
        is absent when not declared. Type restrictions are static; enum/default membership and other cross-field rules still
        require semantic checks.
    UnitId:
      type: string
      minLength: 1
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: "^(?:[\\s\\S]*[/\\\\|\",\u0000-\u001F\u007F-\u009F\u2028\u2029][\\s\\S]*)$"
      description: 'Common prohibitions of both forms of N1.3: emptiness, the exact . and .., separators and control characters. numeric additionally
        requires a decimal integer from 1; named — the value of the field; Nd outside ASCII are checked separately by the Unicode category.'
    WorkerName:
      type: string
      pattern: "^(?:[a-z]{1,8}-[a-z0-9]+(-[a-z0-9]+)*)$"
      not:
        pattern: "^(?:[\\s\\S]*[^a-z0-9-][\\s\\S]*)$"
      description: 'A slot name by P/03.2 N1.4: prefix of 1–8 lowercase Latin letters and a non-empty suffix of lowercase Latin
        letters/digits with single hyphens between the parts. The match of prefix with slot.prefix of the chosen manifest is checked separately.'
    Server:
      description: The server name — an RFC 1123 host name (chapter 6.6 N2.1).
      type: string
      minLength: 1
      maxLength: 253
      pattern: "^(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*)$"
    Policy:
      type: object
      required:
      - servers
      - revision
      additionalProperties: false
      properties:
        servers:
          type: string
          enum:
          - shared
          - distinct
        revision:
          $ref: '#/components/schemas/SettingsRevision'
    SettingsRevision:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: The revision of the settings row; 0 — there is no row or the field does not read (chapter 6.6 N2.1 «Row revision»); the ceiling is that of the field revision of the row (chapter 6.6 N1).
    StoreIndex:
      type: string
      pattern: ^(?:0|[1-9][0-9]{0,19})$
      description: The store index of the row (P/01.1 index) — the cas condition and the guard of the batch door; compared only for equality.
    NextId:
      type: object
      required: [n, index]
      additionalProperties: false
      properties:
        n:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: The last issued number; the next is n + 1. 0 — nothing issued (chapter 6.1 N2 «Counter door»).
        index:
          type: string
          pattern: ^(?:(?:0|[1-9][0-9]{0,19})?)$
          description: The index of the counter row; an empty string — there is no row.
    ChangeNumber:
      type: string
      pattern: ^(?:[0-9A-Za-z._]{1,128})$
      description: The feed number; opaque, compared only for equality, valid at the issuing instance (chapter 6.1 N2 «Change feed»).
    ChangeMessage:
      type: object
      required: [n, key, at]
      additionalProperties: false
      description: A change of a row without its value; exactly one of revision and deleted (chapter 6.1 N2 «Change feed»).
      oneOf:
      - required: [revision]
      - required: [deleted]
      properties:
        n:
          $ref: '#/components/schemas/ChangeNumber'
        key:
          type: string
          description: The full key of a unit row or of a table row.
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: revision of the live row; 0 — the revision does not read.
        deleted:
          type: string
          pattern: ^(?:(?:0|[1-9][0-9]{0,19})?)$
          description: The index of the unit tombstone; an empty string — there is no tombstone.
        at:
          type: number
          minimum: 0
          description: Wall-clock seconds of the tick that saw this version; a resend gives the same value.
    Changes:
      type: object
      required: [position, changes]
      additionalProperties: false
      description: The feed answer. reset is present only on a reset, changes is then empty (chapter 6.1 N2 «Change feed»).
      properties:
        position:
          $ref: '#/components/schemas/ChangeNumber'
        changes:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/ChangeMessage'
        reset:
          type: boolean
          const: true
    DeletedList:
      type: object
      required: [deleted]
      additionalProperties: false
      description: Unit tombstones by the value of the about field (chapter 6.1 N2 «Tombstones by about»).
      properties:
        deleted:
          type: array
          items:
            type: object
            required: [id, index, revision]
            additionalProperties: false
            properties:
              id:
                $ref: '#/components/schemas/UnitId'
              index:
                $ref: '#/components/schemas/StoreIndex'
              revision:
                type: integer
                minimum: 0
                maximum: 9007199254740991
                description: revision of the tombstone; 0 — the revision does not read.
    Where:
      type: object
      required:
      - worker
      - server
      - reason
      - directory
      - scans
      additionalProperties: false
      properties:
        worker:
          $ref: '#/components/schemas/WorkerName'
        server:
          description: From the worker heartbeat, otherwise from the slot row, otherwise null (N2.2).
          type:
          - string
          - 'null'
          minLength: 1
        reason:
          description: "As read from the placement or intent row, empty included — 200, without replacing it
            with an invented word; a non-empty reason is the duty of the writer, the controller (P/04 N3 «Reason», P/04-18); the reader
            is tolerant, the writer canonical, as EventRow."
          type: string
        directory:
          anyOf:
          - $ref: '#/components/schemas/WorkerName'
          - type: 'null'
        scans:
          type: integer
          minimum: 0
        door:
          $ref: '#/components/schemas/Door'
    Door:
      type: object
      required:
      - url
      - token
      - expires
      - routes
      additionalProperties: false
      properties:
        url:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        expires:
          type: integer
          maximum: 9007199254740991
          description: Integer wall-clock seconds of issue + 120 — the same number as expires in the claims of the token (the door token contract).
        routes:
          type: array
          minItems: 1
          description: The door.routes routes with the token and rank admission allowed to the person on the unit (chapter 6.5 N3); none — there is no door field.
          items:
            type: string
            minLength: 1
    NotPlaced:
      type: object
      required:
      - reason
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
    Unplaceable:
      type: object
      required:
      - id
      - labels
      - workers_live
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/UnitId'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        workers_live:
          type: integer
          minimum: 0
        why:
          type: string
          minLength: 1
    Label:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^(?:[A-Za-z0-9][\\s\\S]*)$"
      not:
        pattern: "^(?:[\\s\\S]*[^A-Za-z0-9_.:-][\\s\\S]*)$"
    ErrorOnly:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: string
    NoVersion:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          const: no such version
    MountedPage:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
          minLength: 1
        error:
          const: is mounted
    Health:
      type: object
      required:
      - ok
      additionalProperties: false
      properties:
        ok:
          const: true
    Mounts:
      type: object
      required:
      - root
      - mounts
      additionalProperties: false
      properties:
        root:
          $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/SubsystemName
        mounts:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ManifestView'
          propertyNames:
            $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/SubsystemName
    Grant:
      type: object
      required:
      - cap
      - scope
      additionalProperties: false
      properties:
        cap:
          enum:
          - none
          - view
          - edit
          - admin
        sub:
          type: string
          description: the subsystem of the row; no field — all subsystems and platform
        scope:
          type: string
          minLength: 1
        role:
          type: string
          description: the name of the role, if the row acts through it; a direct row — without the field
    OpenSession:
      type: object
      required:
      - open
      - login_url
      - server_time
      - timezone
      additionalProperties: false
      properties:
        domain:
          description: The cluster domain from domain/root; null — the row does not read; no field — outside a domain (the gate contract, session).
          unevaluatedProperties: false
          oneOf:
            - type: 'null'
            - type: object
              required: [name, root]
              additionalProperties: false
              properties:
                name: {type: string}
                root: {type: string}
        open:
          const: true
        login_url:
          type: string
        server_time:
          $ref: '#/components/schemas/ServerTime'
        timezone:
          $ref: '#/components/schemas/ClusterTimezone'
    AnonymousSession:
      type: object
      required:
      - open
      - login_url
      - server_time
      - timezone
      additionalProperties: false
      properties:
        open:
          const: false
        login_url:
          type: string
          minLength: 1
        server_time:
          $ref: '#/components/schemas/ServerTime'
        timezone:
          $ref: '#/components/schemas/ClusterTimezone'
    AuthenticatedSession:
      type: object
      required:
      - open
      - login_url
      - user
      - until
      - via
      - grants
      - server_time
      - timezone
      additionalProperties: false
      properties:
        domain:
          description: The cluster domain from domain/root; null — the row does not read; no field — outside a domain (the gate contract, session).
          unevaluatedProperties: false
          oneOf:
            - type: 'null'
            - type: object
              required: [name, root]
              additionalProperties: false
              properties:
                name: {type: string}
                root: {type: string}
        open:
          const: false
        login_url:
          type: string
          minLength: 1
        user:
          type: string
          minLength: 1
        until:
          type: number
          description: "wall-clock seconds of the end of the session; for via ticket, exp of that ticket; 0 without a term for via debug (the gate-and-pass contract session until)."
        via:
          type: string
          enum:
          - break-glass
          - token
          - debug
          - ticket
          description: the identity step of this session (P/06.3 N1.3 `session`)
        debug:
          type: boolean
        admin:
          type: boolean
          enum:
          - true
          description: step 4a of the right contract applies; a field of the answer, not a row; otherwise there is no field (the gate and pass contract `session` `admin`)
        grants:
          type: array
          description: "one element per (cap, sub, scope, source); for via ticket these are the rows of its person; order is the gate-and-pass contract session grants."
          items:
            $ref: '#/components/schemas/Grant'
        server_time:
          $ref: '#/components/schemas/ServerTime'
        timezone:
          $ref: '#/components/schemas/ClusterTimezone'
    ServerTime:
      type: number
      minimum: 0
      description: wall-clock seconds of the console that answered (the time of P/01.1 N0, as the writer writes it; the gate and pass contract `session` `server_time`)
    ClusterTimezone:
      type: string
      pattern: '^(?:[A-Za-z][A-Za-z0-9_+-]*(/[A-Za-z][A-Za-z0-9_+-]*)*)$'
      description: the IANA time zone name, a cluster setting, not the OS of the server; the value of `TIMEZONE`, not set — `UTC` (the environment file contract «Environment variables»; the gate and pass contract `session` `timezone`)
    Session:
      oneOf:
      - $ref: '#/components/schemas/OpenSession'
      - $ref: '#/components/schemas/AnonymousSession'
      - $ref: '#/components/schemas/AuthenticatedSession'
    SessionInput:
      type: object
      required:
      - token
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
    GlassInput:
      type: object
      required:
      - who
      - why
      - password
      additionalProperties: false
      properties:
        who:
          type: string
          minLength: 1
        why:
          type: string
          minLength: 1
        password:
          type: string
          description: An empty string passes the body parse and gets 401 at the password check, counted against the attempt limit (chapter
            6.7 N1.10, steps 2 and 5); who and why are non-empty.
    LoggedIn:
      type: object
      required:
      - user
      - until
      additionalProperties: false
      properties:
        user:
          type: string
          minLength: 1
        until:
          type: number
    LoggedOut:
      type: object
      required:
      - out
      additionalProperties: false
      properties:
        out:
          const: true
    WorkerRow:
      type: object
      required:
      - worker
      - load
      - capacity
      - labels
      - state
      - idle_by_policy
      - hung
      - name_conflict
      additionalProperties: false
      properties:
        worker:
          $ref: '#/components/schemas/WorkerName'
        load:
          type: integer
          minimum: 0
        capacity:
          type:
          - number
          - 'null'
          minimum: 0
          description: The heartbeat field placement.capacity.from — a number as in the heartbeat, fractional without rounding; no field — capacity.default;
            not a number — null (P/04 N1.3).
        labels:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/Label'
          - type: 'null'
          description: The labels of the server of the worker, as ServerRow.labels; null — the source row platform/servers/<s> does not read (chapter 6.5 N2).
        place:
          type: string
          minLength: 1
        state:
          enum:
          - live
          - stale
        idle_by_policy:
          type: boolean
        released:
          type: boolean
        slot_taking:
          description: Only with released "taking" of the slot row (a capture in progress, P/03.2 N1.4); otherwise there is no field.
          type: boolean
          enum:
          - true
        slot_until:
          anyOf:
          - type: number
          - type: 'null'
        slot_garbled:
          type: boolean
        holds:
          type: array
          items:
            type: string
            minLength: 1
        hung:
          type: boolean
        hung_since:
          type: number
        hung_why:
          type: string
        presence_unknown:
          anyOf:
          - type: string
          - type: 'null'
        name_conflict:
          type: boolean
          description: true when under the worker name there is at least one fresh contender mark of any state (an unreadable one too, marked by name_conflict_unreadable)
            (refused, nameless, waiting); the name is a key segment, marks «-» are not included (N3 «/servers» «Contenders»; the observation
            contract «Freshness of a contender mark»).
        name_conflict_unreadable:
          type: boolean
          const: true
          description: Under the worker name there is a fresh contender mark that does not read (including name ≠ the key segment) —
            the conflict is counted in name_conflict too; there is no field when there are no such marks (N3 «/servers» «Contenders»).
        status:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
    DiskSpace:
      type: object
      required:
      - total
      - free
      - used
      - full
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
        free:
          type: integer
          minimum: 0
        used:
          type: integer
          minimum: 0
        full:
          type: number
          minimum: 0
          maximum: 1
    LostHold:
      type: object
      required:
      - unit
      additionalProperties: false
      properties:
        unit:
          $ref: '#/components/schemas/UnitId'
        place:
          type: string
        worker:
          $ref: '#/components/schemas/WorkerName'
    DecommissionRequest:
      type: object
      required:
      - at
      - by
      additionalProperties: false
      properties:
        at:
          type: number
        by:
          type: string
        gone:
          type: boolean
    StatusField:
      type: object
      required:
      - field
      - title
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
        title:
          type: string
        of:
          type: string
          minLength: 1
    ServerRow:
      type: object
      required:
      - resource
      - resource_heard_at
      - resource_url
      - space
      - labels
      - labels_node
      - labels_source
      - draining
      - decommission
      - decommissioned
      - decommission_refusal
      - decommission_warning
      - decommissionable
      - lost
      - requires_resource
      - placeable
      - why
      - workers
      additionalProperties: false
      properties:
        resource:
          enum:
          - live
          - silent
          - unreachable
          - unknown
        resource_heard_at:
          description: 'Wall-clock seconds of the console (the time of P/01.1 N0) when it first read the current version of the resource heartbeat
            as readable (the observation contract «Observation of a version»); with the same version it does not move; an unreadable version, a non-answer and
            absence do not change it; there was no readable heartbeat — null; at of the writer is not used (chapter 6.5 N2).'
          anyOf:
          - type: number
          - type: 'null'
        resource_url:
          anyOf:
          - type: string
          - type: 'null'
        space:
          anyOf:
          - $ref: '#/components/schemas/DiskSpace'
          - type: 'null'
        labels:
          description: null — the source row platform/servers/<s> does not read (chapter 6.5 N2).
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/Label'
          - type: 'null'
        labels_node:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        labels_source:
          description: null — the source row platform/servers/<s> does not read (chapter 6.5 N2).
          enum:
          - console
          - node
          - unknown
          - null
        draining:
          type: boolean
        decommission:
          anyOf:
          - $ref: '#/components/schemas/DecommissionRequest'
          - type: 'null'
        decommissioned:
          description: null — the source row of the output does not read (chapter 6.5 N2).
          anyOf:
          - type: boolean
          - type: 'null'
        decommission_refusal:
          type: string
        decommission_warning:
          type: string
        decommissionable:
          type: boolean
        lost:
          type: array
          items:
            $ref: '#/components/schemas/LostHold'
        requires_resource:
          type: boolean
        placeable:
          type: boolean
        why:
          anyOf:
          - type: string
          - type: 'null'
        workers:
          type: array
          items:
            $ref: '#/components/schemas/WorkerRow'
        events:
          anyOf:
          - type: string
          - type: 'null'
        decommission_may_confirm_gone:
          type: boolean
        door_quiet:
          type: boolean
    Servers:
      type: object
      required:
      - policy
      - servers
      additionalProperties: false
      properties:
        policy:
          $ref: '#/components/schemas/Policy'
        servers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ServerRow'
          propertyNames:
            type: string
            minLength: 1
        status:
          type: array
          items:
            $ref: '#/components/schemas/StatusField'
    WaitCounts:
      type: object
      required:
      - waiting
      - held
      - full
      - replaced
      - max
      additionalProperties: false
      properties:
        waiting:
          type: integer
          minimum: 0
        held:
          type: integer
          minimum: 0
        full:
          type: integer
          minimum: 0
        replaced:
          type: integer
          minimum: 0
        max:
          type: integer
          minimum: 0
    MirrorCounts:
      type: object
      required:
      - skipped
      - failed
      - peer_errors
      - lines_garbled
      additionalProperties: false
      properties:
        skipped:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        peer_errors:
          type: integer
          minimum: 0
        lines_garbled:
          type: integer
          minimum: 0
        sum_refused:
          type: integer
          minimum: 0
        peer_sum_refused:
          type: integer
          minimum: 0
        pull_sum_bad:
          type: integer
          minimum: 0
        unsummed:
          type: integer
          minimum: 0
    RestorePeer:
      type: object
      required:
      - done
      - restored
      - missing
      - failures
      additionalProperties: false
      properties:
        done:
          type: boolean
        silent:
          type: boolean
        last_ok:
          type: number
        last_error:
          type: string
        error_at:
          type: number
        restored:
          type: integer
          minimum: 0
        missing:
          type: integer
          minimum: 0
        failures:
          type: integer
          minimum: 0
        lines_garbled:
          type: integer
          minimum: 0
        next:
          type: number
    DoorState:
      type: object
      required:
      - addr
      - mode
      additionalProperties: false
      properties:
        addr:
          type: string
        mode:
          enum:
          - loopback
          - mtls
          description: the mode of the resource door (P/05 N1.4)
        cert_until:
          type: number
    ResourceRow:
      type: object
      required:
      - server
      - ts
      - url
      - schema
      - build
      - usage
      - usage_at
      - space
      - volumes
      - units
      - mirrors
      - short
      - state
      - door
      - waits
      - restore
      - mirror
      additionalProperties: false
      properties:
        server:
          $ref: '#/components/schemas/Server'
        box:
          type: string
          minLength: 1
        ts:
          type: number
        url:
          type: string
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: null — the resource schema is unknown (schema of the heartbeat is not an integer; chapter 6.5 N2, chapter 6.6 N1.1a
            heartbeat).
        build:
          anyOf:
          - type: string
          - type: 'null'
          description: null — build of the heartbeat is not a string, unknown.
        usage:
          type: integer
          minimum: 0
        usage_at:
          type: number
        space:
          $ref: '#/components/schemas/DiskSpace'
        volumes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DiskSpace'
        units:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/UnitId'
        mirrors:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        short:
          type: integer
          minimum: 0
        state:
          enum:
          - live
          - silent
        workers:
          type: array
          items:
            type: string
            pattern: "^(?:[^/]+/[^/]+)$"
            description: <sub>/<slot name> (P/05 N1.4).
        running:
          type: array
          items:
            type: string
            pattern: "^(?:[^/]+/[^/]+)$"
            description: <sub>/<slot name> (P/05 N1.4).
        unknown:
          type: array
          items:
            type: string
            pattern: "^(?:[^/]+/[^/]+)$"
            description: <sub>/<slot name> (P/05 N1.4).
        instances:
          type: object
          propertyNames:
            pattern: "^(?:[^/]+/[^/]+)$"
          additionalProperties:
            type: string
            minLength: 1
        pass_started:
          type: number
        pass_stalled:
          type: number
        volumes_stuck:
          type: object
          additionalProperties:
            type: number
        door:
          $ref: '#/components/schemas/DoorState'
          if:
            required:
            - mode
            properties:
              mode:
                const: mtls
          then:
            required:
            - cert_until
        garbled_rows:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        retention_garbled:
          description: Subsystems for which any term (<sub>/retention or <sub>/alarms_retention) has wrong days, regardless of
            retention_withheld, in ascending byte order (P/05 N3 retain, N4);
            null — the heartbeat field is not in form, unknown.
          anyOf:
          - type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
          - type: 'null'
        retention_withheld:
          description: Why the dependent tree of the subsystem was not removed in the retention pass — one reason in the order unknown → days_garbled
            → holds_unread (P/05 N3 retain, N4); null — the heartbeat field is not in
            form, unknown.
          unevaluatedProperties: false
          anyOf:
          - type: object
            additionalProperties:
              enum:
              - days_garbled
              - unknown
              - holds_unread
          - type: 'null'
        settings_unread:
          description: The settings rows of the resource pass that did not read — mirror (the mirror step and the copies of bodies are not executed),
            space (the relieve step is not executed); none such — there is no field (P/05 N1.4).
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum:
            - mirror
            - space
        waits:
          $ref: '#/components/schemas/WaitCounts'
        restore:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RestorePeer'
        mirror:
          $ref: '#/components/schemas/MirrorCounts'
    Resources:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/ResourceRow'
      propertyNames:
        $ref: '#/components/schemas/Server'
    WherePlace:
      type: object
      required:
      - worker
      - place
      - server
      additionalProperties: false
      properties:
        worker:
          $ref: '#/components/schemas/WorkerName'
        place:
          type: string
          minLength: 1
        server:
          description: The server field of the fresh heartbeat of the holder; "" in the heartbeat — "?". The place row is not needed —
            its absence, unreadability or an empty server_field do not change the answer (N3).
          anyOf:
          - $ref: '#/components/schemas/Server'
          - const: '?'
        door:
          $ref: '#/components/schemas/Door'
      description: The holder of the place; door is present only with a confirmed door and view on the unit (N3), not null.
    PlaceUnreachable:
      type: object
      required:
      - unreachable
      additionalProperties: false
      properties:
        unreachable:
          type: string
          minLength: 1
    Unavailable:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/ConsoleRefusal'
      - properties:
          error:
            enum:
            - busy
            - denied
            - unavailable
    ServerOrEmpty:
      anyOf:
      - $ref: '#/components/schemas/Server'
      - const: ''
    SubsystemUnitRef:
      type: string
      pattern: "^(?:[a-z][a-z0-9_-]{0,31}/[^/]+)$"
      not:
        anyOf:
        - pattern: "^(?:(platform|domain|console|audit|spec|manifest|session|mounts|healthz|metrics|servers|resources|where|unplaceable|policy|drain|schema|events|marks|requests|asked|api)/[\\s\\S]*)$"
        - pattern: "^(?:[^/]+/\\.{1,2})$"
        - pattern: "^(?:[\\s\\S]*[\\\\|\",\u0000-\u001F\u007F-\u009F\u2028\u2029][\\s\\S]*)$"
    DrainStarted:
      type: object
      required:
      - draining
      additionalProperties: false
      properties:
        draining:
          $ref: '#/components/schemas/Server'
    DrainCleared:
      type: object
      required:
      - draining
      additionalProperties: false
      properties:
        draining:
          const: ''
    Empty:
      type: object
      required: []
      additionalProperties: false
      properties: {}
    LabelsInput:
      type: object
      required:
      - labels
      additionalProperties: false
      properties:
        labels:
          type: array
          uniqueItems: true
          description: Without repeats; a repeated label — 400 (the label alphabet).
          items:
            $ref: '#/components/schemas/Label'
    LabelProbe:
      type: object
      required:
      - would_move
      - revision
      additionalProperties: false
      properties:
        revision:
          $ref: '#/components/schemas/SettingsRevision'
        would_move:
          type: array
          uniqueItems: true
          description: Units that will leave the server (will not come to it), in ascending UTF-8 byte order of the reference — chapter 6.6
            N2.1.
          items:
            $ref: '#/components/schemas/SubsystemUnitRef'
    LabelsWritten:
      type: object
      required:
      - will_move
      additionalProperties: false
      properties:
        will_move:
          type: array
          uniqueItems: true
          description: Units that will leave the server (will not come to it), in ascending UTF-8 byte order of the reference — chapter 6.6
            N2.1.
          items:
            $ref: '#/components/schemas/SubsystemUnitRef'
    DecommissionInput:
      type: object
      required: []
      additionalProperties: false
      properties:
        why:
          type: string
        gone:
          type: boolean
    DecommissionAccepted:
      type: object
      required: []
      additionalProperties: false
      properties:
        warning:
          type: string
          minLength: 1
    ServerAnswers:
      type: object
      required:
      - detail
      - error
      - server
      - may_confirm_gone
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          const: server answers
        server:
          $ref: '#/components/schemas/Server'
        may_confirm_gone:
          type: boolean
    SubsystemDrain:
      type: object
      required:
      - draining
      - subsystem
      - workers
      - units
      - pending_writes
      - would_strand
      - safe
      additionalProperties: false
      properties:
        draining:
          $ref: '#/components/schemas/ServerOrEmpty'
        subsystem:
          $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/SubsystemName
        workers:
          type: integer
          minimum: 0
        units:
          type: integer
          minimum: 0
        pending_writes:
          type: integer
          minimum: 0
        would_strand:
          type: array
          items:
            $ref: '#/components/schemas/UnitId'
        safe:
          type: boolean
        pending_unsaid:
          type: array
          items:
            $ref: '#/components/schemas/WorkerName'
    DrainState:
      type: object
      required:
      - draining
      - safe
      - would_strand
      - subsystems
      - revision
      additionalProperties: false
      properties:
        revision:
          $ref: '#/components/schemas/SettingsRevision'
        draining:
          $ref: '#/components/schemas/ServerOrEmpty'
        safe:
          type: boolean
        would_strand:
          type: object
          propertyNames:
            $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/SubsystemName
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/UnitId'
        subsystems:
          type: object
          propertyNames:
            $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/SubsystemName
          additionalProperties:
            $ref: '#/components/schemas/SubsystemDrain'
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 200
      not:
        anyOf:
        - const: ..
        - pattern: "^(?:[\\s\\S]*/[\\s\\S]*)$"
      description: One non-empty segment, except '..', at most 200 UTF-8 bytes (N3). maxLength counts characters and does not replace
        a separate byte check. The key of the claim row is a digest (chapter 6.1 N3 «replay memory»), the limit of the full
        key does not concern it.
    ClientFields:
      type: object
      propertyNames:
        not:
          enum:
          - id
          - revision
          - deleted
          - worker
          - placement
          - epoch
          - phase
          - observed_revision
          - index
      additionalProperties: true
      description: Only the unit.fields fields; extra names are needed here for an arbitrary manifest, but a field unknown to it
        is refused. Types, required, enum, url, blob, json and fixed/inherit are checked by N1 and in the order of N3, not by one
        validator of the common schema. null for a field with inherit — «not set», the value is inherited again; for other fields, except
        json, null — 400 (N2). PUT contains the changeable fields; an empty or null secret keeps the previous one (chapter 6.2 N3 «create/edit»,
        step 3; on a change of a field from bound_to — 400 «must be given anew»). The platform names are worker, placement, phase and observed_revision.
    Unit:
      type: object
      required:
      - id
      - revision
      - index
      properties:
        id:
          $ref: '#/components/schemas/UnitId'
        revision:
          type: integer
          minimum: 1
        index:
          $ref: '#/components/schemas/StoreIndex'
        made:
          type: object
          required: [by, at, keep]
          additionalProperties: false
          readOnly: true
          description: The order row of another subsystem (P/06.1 N1.2 made); set by the library of the customer, the client does not set it.
          properties:
            by: {type: string}
            at: {type: number}
            keep: {type: number}
            gone: {type: number}
        state:
          type: object
          readOnly: true
          additionalProperties: true
          description: The active states of the unit by unit.state (P/06.1 N2 «State in the response»); the value — by the schema unit.state.<name>.
      patternProperties:
        "^(?:[\\s\\S]*_secret)$":
          type: string
          enum:
          - ''
          - '***'
      additionalProperties: true
      description: 'A typed unit row. The other fields are set by unit.fields: int/float — JSON numbers, bool — a boolean,
        list — an array, json — a JSON value, string/url/blob — strings; a secret is empty or the mask "***" (chapter 6.2, mask). An absent inherit and json null are not added to the answer. An open set of names supports an arbitrary
        manifest and does not permit foreign fields.'
    CreatedUnit:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/Unit'
      - type: object
        required:
        - worker
        properties:
          worker:
            type: 'null'
    DeletedUnit:
      type: object
      required:
      - deleted
      additionalProperties: false
      properties:
        deleted:
          $ref: '#/components/schemas/UnitId'
    PulseList:
      type: object
      required:
      - rows
      additionalProperties: false
      properties:
        rows:
          type: array
          items:
            type: object
            required:
            - worker
            - server
            - ts
            - age
            - worker_state
            - fields
            additionalProperties: false
            properties:
              worker:
                $ref: '#/components/schemas/WorkerName'
              server:
                type: string
              ts:
                type: number
              age:
                type: number
                minimum: 0
              worker_state:
                enum:
                - live
                - stale
              fields:
                type: object
                additionalProperties: true
                description: Only the heartbeat.door fields of the manifest that are present in the heartbeat (chapter 6.7 N1.6 pulse).
      description: Chapter 6.7 N1.6 pulse — one element per heartbeat of a subsystem, ordered by worker in UTF-8 bytes.
    UnitList:
      type: object
      required:
      - rows
      - configured
      additionalProperties: false
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RunningUnit'
        configured:
          type: array
          items:
            $ref: '#/components/schemas/Unit'
      description: The GET form of chapter 6.1 N2; filtering by view does not change the form of the envelope.
    RunningUnit:
      type: object
      required:
      - id
      - phase
      - worker
      - server
      - age
      - worker_state
      properties:
        id:
          $ref: '#/components/schemas/UnitId'
        phase:
          type: string
        epoch:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
        observed_revision:
          type: integer
          minimum: 0
        worker:
          $ref: '#/components/schemas/WorkerName'
        server:
          type: string
        age:
          type: number
          minimum: 0
        worker_state:
          enum:
          - live
          - stale
        why:
          type: string
      additionalProperties: true
      if:
        properties:
          phase:
            enum:
            - sealed
            - unreadable
        required:
        - phase
      then:
        required:
        - why
        not:
          anyOf:
          - required:
            - epoch
          - required:
            - observed_revision
      else:
        required:
        - epoch
        - observed_revision
        - revision
      allOf:
      - if:
          properties:
            phase:
              const: sealed
          required:
          - phase
        then:
          required:
          - revision
      description: An element of status of the heartbeat (P/03.4 N1.1; for phase sealed — {id, phase, why, revision}, for phase unreadable — {id, phase, why, revision?}, without epoch and observed_revision, W03-G02, W03-G05) plus worker, server, age, worker_state (chapter 6.1 N2; filtering
        by view — the gate of chapter 6.3, need). The words of the subsystem stay opaque. The meaning of freshness and of building the list
        — chapter 6.1 N2 («`rows` in `GET /{rows}`»).
    Refusal:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          type: string
          enum:
          - Idempotency-Key required
          - badkey
          - not_json
          - platform_field
          - unknown field
          - not_number
          - type
          - too_long
          - enum
          - bad_url
          - blob
          - labels
          - required
          - bad_id
          - fixed
          - If-Match is a unit revision
          - a sealed value is not taken from outside — give the password itself
          - sealing key required
          - the body does not fill it in
          - refused
          - denied
          - no such unit
          - no such path
          - exists
          - conflict
          - in flight
          - row too large
          - key reused
          - store unavailable
          - busy
          - unavailable
          - bad batch
          - no anchor
          - row moved
          - batch too large
          - no such row
          - bad folder
          - bad member
          - too many members
          - too many folders
          - too deep
          - no such folder
          - no such parent
          - parent gone
          - folder moved
          - parent moved
          - no chain
          - no membership
          - folder gone
          - leader moved
          - bad operation
          - too many steps
          - too many operations
          - no operations
          - no such operation
          - root busy
          - operation done
          - operation running
          - nothing to retry
        field:
          $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/RefusalField'
        fault:
          type: string
          enum:
          - not_json
          - not_number
          - too_long
          - bad_url
          - must_match
          - unique
          - garbled
    TextRefusal:
      allOf:
      - $ref: '#/components/schemas/Refusal'
      - not:
          required:
          - fault
    CasRefused:
      allOf:
      - $ref: '#/components/schemas/TextRefusal'
      - properties:
          error:
            const: refused
      description: A refusal without a word of its own reason (chapter 6.1 N2 «Refusal error and field») — a CAS conflict of the row, a schema door; the reason is in detail.
    FormRefusal:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/Refusal'
      - properties:
          fault:
            enum:
            - not_json
            - not_number
            - too_long
            - bad_url
    CreateBusy:
      allOf:
      - $ref: '#/components/schemas/TextRefusal'
      - properties:
          error:
            enum:
            - exists
            - in flight
    ReferenceConflict:
      allOf:
      - $ref: '#/components/schemas/Refusal'
      - required:
        - fault
        - field
        properties:
          error:
            const: conflict
          fault:
            enum:
            - must_match
            - unique
            - garbled
    RepeatRefused:
      allOf:
      - $ref: '#/components/schemas/TextRefusal'
      - properties:
          error:
            const: in flight
      description: A refusal of the replay memory of a door with an optional key (chapter 6.1 N3 «replay memory»).
    BatchInput:
      type: object
      required: [writes]
      additionalProperties: false
      properties:
        writes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BatchWrite'
          description: Chapter 6.1 N2 «Batch door»; the limit BATCH_WRITES (P/01.1 N1) is checked by the door — 413, a key once.
        guards:
          type: array
          items:
            $ref: '#/components/schemas/BatchGuard'
          description: Read rows that are not written; the limit BATCH_GUARDS (P/01.1 N1); a key once and not in writes.
    BatchWrite:
      type: object
      required: [op, key, cas]
      additionalProperties: false
      properties:
        op:
          enum:
          - put
          - delete
        key:
          type: string
          minLength: 1
          description: The full key of a unit row, a row of a declared table, <s>/next_id or a folder or membership row (chapter 6.8 N2); the key rules — P/01.1 N1.
        fields:
          type: object
          additionalProperties: true
          description: 'The body of the door of this row: for a unit — POST or PUT, for a table — POST, for a counter — {n}, for a folder — {members}, for a membership — {folders}. The fields are checked by the manifest, delete has no fields.'
        revision: {type: integer, minimum: 0, description: 'The version of the row the stored change expects, 0 — there is no live row (P/08.6 N1.3b).'}
        cas:
          type: string
          pattern: ^(?:(?:0|[1-9][0-9]{0,19})?)$
          description: The store index of the read row, for a tombstone — its index; an empty string — there is no row.
      oneOf:
      - properties:
          op:
            const: put
        required: [fields]
      - properties:
          op:
            const: delete
          fields: false
    BatchGuard:
      type: object
      required: [key, index]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
        index:
          type: string
          pattern: ^(?:(?:0|[1-9][0-9]{0,19})?)$
    BatchWritten:
      type: object
      required: [written]
      additionalProperties: false
      properties:
        written:
          type: integer
          minimum: 1
          description: The number of rows of writes. There is no version in the answer — the done claim is written by the same batch.
    BatchRefused:
      allOf:
      - $ref: '#/components/schemas/Refusal'
      description: A refusal of the batch door; the words — refusal-words.tsv, lines batch and *; field — the path of the field from the body root, with the row number.
    BatchMoved:
      type: object
      required: [detail, error, field, key, index]
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          const: row moved
        field:
          $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/RefusalField'
        key:
          type: string
          minLength: 1
        index:
          type: string
          pattern: ^(?:(?:0|[1-9][0-9]{0,19})?)$
          description: The index of this row now; an empty string — there is no row or a guard without view.
      description: Chapter 6.1 N4 «Batch door»; field — /guards/<number>/index or /writes/<number>/cas; nothing is written.
    Folder:
      type: object
      required: [id, name, parent, members, index]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/FolderId'
        name:
          type: string
          minLength: 1
          description: The limit FOLDER_NAME_MAX bytes of UTF-8 is checked by the door; there is no uniqueness.
        parent:
          type: string
          pattern: ^(?:([0-9a-f]{32})?)$
          description: The id of the parent; an empty string — the root of the cluster.
        members:
          type: array
          items:
            $ref: '#/components/schemas/FolderMember'
          description: References to units in order, without a filter by view.
        index:
          type: string
          description: The store index of the row; equality only.
    FolderId:
      type: string
      pattern: ^(?:[0-9a-f]{32})$
      description: 128 random bits.
    FolderMember:
      type: string
      pattern: ^(?:[a-z][a-z0-9_-]{0,31}/[a-z][a-z0-9_-]{0,31}/[^/]+)$
      description: The full key of a unit row (chapter 6.8 N1.1).
    FolderGarbled:
      type: object
      required: [id, garbled]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/FolderId'
        garbled:
          const: true
      description: The row does not read in its own form (the outcomes of the platform/folders family).
    FolderList:
      type: object
      required: [folders]
      additionalProperties: false
      properties:
        folders:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/Folder'
            - $ref: '#/components/schemas/FolderGarbled'
        member:
          type: object
          required: [index]
          additionalProperties: false
          properties:
            index:
              type: string
              description: The index of the membership row; an empty string — there is no row.
          description: Only for a request with member.
    FolderInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        parent:
          type: string
          pattern: ^(?:([0-9a-f]{32})?)$
    FolderPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        members:
          type: array
          items:
            type: string
          description: The whole set; the grammar of a reference, a repeat and the limits are checked by the door (400 bad member, chapter 6.8 N3).
      description: A closed body; parent in it — 400 bad folder, field /parent.
    FolderDeleted:
      type: object
      required: [deleted]
      additionalProperties: false
      properties:
        deleted:
          $ref: '#/components/schemas/FolderId'
    FolderRefused:
      allOf:
      - $ref: '#/components/schemas/Refusal'
      description: A refusal of the folder doors; the words — refusal-words.tsv, lines folders and *.
    FolderMoved:
      type: object
      required: [detail, error, field]
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          const: folder moved
        field:
          const: /index
        row:
          $ref: '#/components/schemas/Folder'
      description: "Chapter 6.8 N4: the 412 body includes the current row only when it exists, is not a tombstone and the caller has view; otherwise row is absent."
    OperationInput:
      type: object
      required: [id, items]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OperationItemInput'
          description: Steps in order; the limit OPS_STEPS_MAX is checked by the door.
        memory:
          $ref: '#/components/schemas/OperationMemory'
    OperationRetry:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        memory:
          $ref: '#/components/schemas/OperationMemory'
    OperationId:
      type: string
      pattern: ^(?:[0-9a-f]{32})$
      description: 128 random bits; named by the caller (chapter 6.9 N1.2).
    OperationItemInput:
      type: object
      required: [body, root, expected]
      additionalProperties: false
      properties:
        body:
          description: The step body without secrets; the console does not parse it.
        root:
          type: string
          minLength: 1
          description: The root of the target; one key component, at most 200 bytes of UTF-8 (chapter 6.9 N1.3).
        expected:
          description: The expected versions of the objects of the root; the console does not parse them.
        secret:
          type: string
          description: The value of the step secret; it is stored sealed, it does not go out in the answer.
    OperationMemory:
      type: object
      required: [key, fields, cas]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          description: A table row of the caller <sub>/<table>/<name>.
        fields:
          type: object
          additionalProperties: true
          description: The POST body of this table row; the fields are checked by the manifest.
        cas:
          type: string
          pattern: ^(?:(?:0|[1-9][0-9]{0,19})?)$
    OperationItem:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          enum:
          - wait
          - run
          - ok
          - fail
          - cancel
        code:
          type: string
        field:
          type: string
        version:
          type: string
        created_id:
          type: string
        body:
          description: 'The step body without secrets, only for a declaration with `service: true` (chapter 6.9 N2).'
    Operation:
      type: object
      required: [id, by, state, created_at, finished_at, retry_of, total, done, ok, failed, cancelled, items]
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        by:
          type: string
        state:
          enum:
          - running
          - paused
          - done
        created_at:
          type: number
        finished_at:
          type:
          - number
          - 'null'
        retry_of:
          oneOf:
          - $ref: '#/components/schemas/OperationId'
          - type: 'null'
        total:
          type: integer
          minimum: 1
        done:
          type: integer
          minimum: 0
        ok:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationItem'
    OperationRefused:
      allOf:
      - $ref: '#/components/schemas/Refusal'
      description: A refusal of the operation doors; the words — refusal-words.tsv, lines operations and *.
    OperationBusy:
      type: object
      required: [detail, error]
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          enum:
          - root busy
          - exists
          - in flight
          - operation done
          - operation running
          - nothing to retry
        field:
          $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/RefusalField'
        operation:
          type: string
          description: Who holds the root; an empty string — the busy row does not read.
        root:
          type: string
      description: Chapter 6.9 N4.
    LeaderMoved:
      type: object
      required: [detail, error]
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          const: leader moved
      description: Chapter 6.9 N2 «Step batch»; the subsystem ends the call and does not write the outcome.
    KeyReused:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/TextRefusal'
      - properties:
          error:
            const: key reused
    SealingUnavailable:
      allOf:
      - $ref: '#/components/schemas/TextRefusal'
      - properties:
          error:
            const: unavailable
          detail:
            const: the sealing key is set and does not read
      description: The secret ring is set but does not read; all POST/PUT of units, including bodies without secrets (HMAC of the replay memory),
        chapter 6.2.
    UnitUnavailable:
      allOf:
      - $ref: '#/components/schemas/TextRefusal'
      - properties:
          error:
            enum:
            - store unavailable
            - busy
            - denied
    Rid:
      type: string
      minLength: 1
      maxLength: 200
      description: rid by N1.5 — at most 200 bytes of UTF-8, without / \ " ' and control characters; maxLength does not replace the byte
        check.
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: "^(?:[\\s\\S]*[/\\\\\"'\u0000-\u001F\u007F-\u009F\u2028\u2029][\\s\\S]*)$"
    ConsoleDenied:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
          minLength: 1
        error:
          const: denied
    RequestError:
      type: object
      required:
      - detail
      - error
      additionalProperties: false
      properties:
        detail:
          type: string
        error:
          type: string
          enum:
          - Idempotency-Key required
          - bad body
          - bad unit
          - bad id
          - bad deadline
          - too far
          - this subsystem takes no deadline
          - too_long
          - refused
          - denied
        fault:
          const: too_long
        field:
          $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/RefusalField'
      description: A 400 refusal of the request door — the ConsoleRefusal form and `fault` of the field length (chapter 6.4 N2, N4). The words — data/refusal-words.tsv.
    ConsoleEventRow:
      description: A console answer row — with fenced and epoch_is (P/05 N1.3, the event log merge contract); epoch_is is absent
        only in a subsystem row whose epoch did not read (incomplete[<sub>/epoch]); unknown never happens at the console.
      type: object
      additionalProperties: true
      allOf:
      - $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/EventRow
      required:
      - fenced
    ConsoleEvents:
      type: object
      required:
      - events
      - state
      - truncated
      - complete
      - incomplete
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ConsoleEventRow'
        state:
          type: string
          pattern: "^(?:live(?:; [^;\u000D\u000A]+ (?:unreachable|from mirror))*)$"
        truncated:
          description: The sum of local truncated plus the omissions of the common trim after deduplication of candidates; copies may
            be counted by several sources, this is not an exact number of distinct omitted events.
          type: integer
          minimum: 0
        partial:
          const: true
        lines_garbled:
          description: The sum of lines_garbled of the resources that answered plus rows of resource answers not in the EventRow form, skipped
            by the console (N3 «merge»); there is no field when there are no omissions.
          type: integer
          minimum: 1
        complete:
          type: boolean
        incomplete:
          type: object
          additionalProperties:
            type: string
            pattern: "^(?:did not answer|silent|said [^\u000A\u000D\u2028\u2029]+)$"
        withheld:
          description: Units whose labels are unknown (the unit row is unreadable or its read is not confirmed) and whose rows
            are therefore hidden from a grant by labels; only to the caller with a view grant by labels; without repeats, in ascending
            byte order; none such — there is no field (P/06.4 N2 «Who can see a row», the merge contract step 5a).
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/UnitRef
    MarkInput:
      type: object
      required:
      - unit
      additionalProperties: true
      properties:
        unit:
          $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/UnitRef
        note:
          type: string
        occurred:
          type: number
          minimum: 0
          description: The moment the mark is about; at most 3 fraction digits (chapter 6.4 N2).
        to:
          type: number
          minimum: 0
          description: The end of the span; only together with occurred and not less than it, otherwise 400; at most 3 fraction digits (chapter 6.4 N2).
      description: Extra fields are accepted and ignored; note when absent — an empty string. The type of note is checked, its length
        is not limited by the lesson.
    MarkWritten:
      type: object
      required:
      - written
      additionalProperties: false
      properties:
        written:
          const: true
    RequestInput:
      type: object
      required:
      - unit
      additionalProperties: true
      properties:
        unit:
          $ref: '#/components/schemas/UnitId'
        valid_until:
          type: number
      not:
        anyOf:
        - required:
          - rid
        - required:
          - digest
        - required:
          - filed
        - required:
          - by
        - required:
          - at
        - required:
          - group
      description: In addition requests.schema of the chosen manifest applies; its required/types/extra fields are kept.
        Service fields are not accepted, except valid_until.
    Queued:
      type: object
      required:
      - queued
      additionalProperties: false
      properties:
        queued:
          $ref: '#/components/schemas/Rid'
    HolderAnswer:
      type: object
      required:
      - unit
      - digest
      - ended_at
      - instance
      - slot
      - at
      - outcome
      additionalProperties: false
      properties:
        unit:
          $ref: '#/components/schemas/UnitId'
        digest:
          $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/Sha256
        ended_at:
          type: string
          pattern: "^(?:-?(?:0|[1-9][0-9]*)(?:\\.[0-9]+)?(?:[eE][+-]?[0-9]+)?)$"
          description: A finite number of seconds written as the text of a store row; the numeric range is checked separately.
        instance:
          type: string
          minLength: 1
        slot:
          type: string
          minLength: 1
        of:
          $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/UnitRef
        at:
          type: string
          pattern: "^(?:-?(?:0|[1-9][0-9]*)(?:\\.[0-9]+)?(?:[eE][+-]?[0-9]+)?)$"
          description: A finite number of seconds written as the text of a store row; the numeric range is checked separately.
        valid_until:
          type: string
          pattern: "^(?:-?(?:0|[1-9][0-9]*)(?:\\.[0-9]+)?(?:[eE][+-]?[0-9]+)?)$"
          description: A finite number of seconds written as the text of a store row; the numeric range is checked separately.
        outcome:
          enum:
          - performed
          - refused
          - unknown
        action:
          type: string
          minLength: 1
          description: The value of the action field of the request body, not the name of the handler; a body without action has no field (the request contract
            «Mark»).
        error:
          type: string
          maxLength: 200
        reply:
          type: string
          description: The JSON text of the perform answer (the request contract «Mark»).
        late:
          const: 'true'
      allOf:
      - if:
          properties:
            outcome:
              const: performed
        then:
          not:
            required:
            - error
        else:
          required:
          - error
    ClosedBegun:
      type: object
      required:
      - unit
      - digest
      - ended_at
      - instance
      - slot
      - at
      - outcome
      - ended_by
      - error
      additionalProperties: false
      properties:
        unit:
          $ref: '#/components/schemas/UnitId'
        digest:
          $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/Sha256
        ended_at:
          type: string
          pattern: "^(?:-?(?:0|[1-9][0-9]*)(?:\\.[0-9]+)?(?:[eE][+-]?[0-9]+)?)$"
          description: A finite number of seconds written as the text of a store row; the numeric range is checked separately.
        instance:
          type: string
          minLength: 1
        slot:
          type: string
          minLength: 1
        of:
          $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/UnitRef
        at:
          type: string
          pattern: "^(?:-?(?:0|[1-9][0-9]*)(?:\\.[0-9]+)?(?:[eE][+-]?[0-9]+)?)$"
          description: A finite number of seconds written as the text of a store row; the numeric range is checked separately.
        valid_until:
          type: string
          pattern: "^(?:-?(?:0|[1-9][0-9]*)(?:\\.[0-9]+)?(?:[eE][+-]?[0-9]+)?)$"
          description: A finite number of seconds written as the text of a store row; the numeric range is checked separately.
        outcome:
          const: unknown
        ended_by:
          enum:
          - reaper
          - holder
        error:
          type: string
          maxLength: 200
    NeverBegun:
      type: object
      required:
      - unit
      - digest
      - ended_at
      - outcome
      - ended_by
      additionalProperties: false
      properties:
        unit:
          $ref: '#/components/schemas/UnitId'
        digest:
          $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/Sha256
        ended_at:
          type: string
          pattern: "^(?:-?(?:0|[1-9][0-9]*)(?:\\.[0-9]+)?(?:[eE][+-]?[0-9]+)?)$"
          description: A finite number of seconds written as the text of a store row; the numeric range is checked separately.
        outcome:
          enum:
          - expired
          - refused
          - gone
        ended_by:
          enum:
          - reaper
          - holder
        error:
          type: string
          maxLength: 200
      allOf:
      - if:
          properties:
            outcome:
              const: refused
        then:
          required:
          - error
          properties:
            ended_by:
              const: holder
        else:
          not:
            required:
            - error
      - if:
          properties:
            outcome:
              const: gone
        then:
          properties:
            ended_by:
              const: reaper
    AnsweredMark:
      oneOf:
      - $ref: '#/components/schemas/HolderAnswer'
      - $ref: '#/components/schemas/ClosedBegun'
      - $ref: '#/components/schemas/NeverBegun'
      description: 'The full mark row: the answer of the one that began, the closing of a foreign begun or a refusal before the start. All values of the row
        are text. begun without an outcome does not go here.'
    Answered:
      type: object
      required:
      - answered
      additionalProperties: false
      properties:
        answered:
          $ref: '#/components/schemas/AnsweredMark'
    Cleared:
      type: object
      required:
      - cleared
      additionalProperties: false
      properties:
        cleared:
          const: true
    ProcessBuild:
      type: object
      required:
      - schema
      - build
      - ts
      - live
      additionalProperties: false
      properties:
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        build:
          anyOf:
          - type: string
          - type: 'null'
          description: null — build of the heartbeat is not a string, unknown (for the worker and the resource).
        ts:
          type: number
        live:
          type: boolean
    SchemaState:
      type: object
      required:
      - version
      - understood
      - builds
      - can_raise_to
      - processes
      - revision
      additionalProperties: false
      properties:
        revision:
          $ref: '#/components/schemas/SettingsRevision'
        version:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        understood:
          type: integer
          minimum: 1
        builds:
          type: array
          items:
            type: string
        can_raise_to:
          type: integer
          minimum: 0
        schema_unknown:
          type: boolean
          description: true when the platform/schema row is damaged (version null); a readable row has no field.
        processes:
          type: object
          description: By heartbeats — a worker under the key <sub>/<slot name>, a resource — resource/<server>; the controller and the console
            are not included (N2).
          additionalProperties:
            $ref: '#/components/schemas/ProcessBuild'
          propertyNames:
            type: string
            pattern: "^(?:[^/]+/[^/]+)$"
    SchemaRaised:
      type: object
      required:
      - version
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
    BlobWritten:
      allOf:
      - $ref: '#/components/schemas/Unit'
      - type: object
        required:
        - bytes
        properties:
          bytes:
            type: integer
            minimum: 0
      unevaluatedProperties: false
      description: The full Unit and the number of accepted bytes. A manifest with blob and a declared unit.fields.bytes is rejected at load
        by N1.5.
    SecretFreeValue:
      unevaluatedProperties: false
      anyOf:
      - type:
        - 'null'
        - boolean
        - number
        - string
      - type: array
        items:
          $ref: '#/components/schemas/SecretFreeValue'
      - type: object
        propertyNames:
          not:
            pattern: "^(?:[\\s\\S]*_secret)$"
        additionalProperties:
          $ref: '#/components/schemas/SecretFreeValue'
    TableRowName:
      type: string
      minLength: 1
      not:
        anyOf:
        - enum:
          - .
          - ..
        - pattern: "^(?:[\\s\\S]*/[\\s\\S]*)$"
      description: 'The name of a table row — chapter 6.1 N1.6 (`<sub>/<t>/<name>`) and N3 «table — write a row» step 1: the name from
        key is not empty, without `/`, not `.` and not `..`; the grammar of the unit id (N1.3, UnitId) does not apply to it. The limit — the full store key (P/01.1).'
    TableRow:
      type: object
      required:
      - name
      - index
      properties:
        name:
          $ref: '#/components/schemas/TableRowName'
        revision:
          type: integer
          minimum: 0
          description: The counter of the writes of the row (N1.6); 0 — the field does not read.
        index:
          $ref: '#/components/schemas/StoreIndex'
        held_by:
          description: by of the active place hold (the observation contract «Hold of a place»), otherwise null;
            an unconfirmed read of the hold or of the heartbeat — null, not 503 (N1.6).
          anyOf:
          - $ref: '#/components/schemas/WorkerName'
          - type: 'null'
        garbled:
          type: boolean
        by:
          type: string
          description: The stamp stamp — the user of the write (N1.6).
        at:
          type: number
          description: The stamp stamp — wall-clock seconds of this write (N1.6).
        made_at:
          type: number
          description: The stamp stamp — wall-clock seconds of the first write of the row (N1.6).
      propertyNames:
        not:
          pattern: "^(?:[\\s\\S]*_secret)$"
      additionalProperties:
        $ref: '#/components/schemas/SecretFreeValue'
      description: The fields of the declared table and stamp are checked by its manifest; secret fields are excluded at any depth.
        garbled=true means only the diagnostic row name/garbled/index.
      allOf:
      - if:
          required:
          - garbled
          properties:
            garbled:
              const: true
        then:
          maxProperties: 3
        else:
          required:
          - revision
    TableList:
      type: object
      minProperties: 1
      maxProperties: 1
      propertyNames:
        $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/SubsystemName
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/TableRow'
      description: The only property name equals table in the path.
    TableInput:
      type: object
      propertyNames:
        not:
          enum:
          - held_by
          - garbled
          - by
          - at
          - made_at
          - revision
          - index
      additionalProperties: true
      description: The stamps by/at/made_at and the versions revision/index are not passed by the client (400 unknown field), regardless of stamp. Only the declared
        fields of this table; types, required, enum, schema and the key are checked dynamically by the manifest. id/worker/placement/epoch/phase/observed_revision
        are allowed when declared. The name field is allowed only for key=name with type string.
    TableWritten:
      type: object
      required:
      - row
      additionalProperties: false
      properties:
        row:
          $ref: '#/components/schemas/TableRow'
    TableDeleted:
      type: object
      required:
      - deleted
      additionalProperties: false
      properties:
        deleted:
          $ref: '#/components/schemas/TableRowName'
    SnapshotUnit:
      type: object
      required:
      - id
      - revision
      - worker
      - server
      properties:
        id:
          $ref: '#/components/schemas/UnitId'
        revision:
          type: integer
          minimum: 1
        worker:
          anyOf:
          - $ref: '#/components/schemas/WorkerName'
          - type: 'null'
        server:
          anyOf:
          - $ref: '#/components/schemas/Server'
          - type: 'null'
      propertyNames:
        not:
          pattern: "^(?:[\\s\\S]*_secret)$"
      additionalProperties:
        $ref: '#/components/schemas/SecretFreeValue'
      description: The form of the snapshot shard <sub>/snapshot/<worker> — owned by P/04 (data/snapshot.schema.json, N1.3a); the console
        reads it for the age of the snapshot and the count of damaged shards (chapter 6.5, P/06.5-11). It is not given out by path. Extra
        fields — exactly snapshot by the manifest, without blob/secrets/a server of the author; server here is computed by the platform. Addresses
        are masked.
    SnapshotShard:
      type: object
      required:
      - cluster
      - worker
      - ts
      properties:
        cluster:
          type: string
        worker:
          anyOf:
          - $ref: '#/components/schemas/WorkerName'
          - type: 'null'
        ts:
          type: number
      minProperties: 4
      maxProperties: 4
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/SnapshotUnit'
      description: The form of the snapshot shard <sub>/snapshot/<worker> — owned by P/04 (data/snapshot.schema.json, N1.3a); the console
        reads it for the age of the snapshot and the count of damaged shards (chapter 6.5, P/06.5-11). It is not given out by path. The fourth property
        — the rows name from the manifest; cluster/worker/ts as rows are rejected by the loader. A separate shard, without a transaction of several
        shards.
    TableMethod:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/ConsoleRefusal'
      - properties:
          detail:
            type: string
            pattern: "^(?:[\\s\\S]*takes GET, POST and DELETE of one row)$"
          error:
            const: method
    DomainRefusal:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: string
          minLength: 1
          description: A word of N4 of chapter 6.7 (not a domain route, one hop, no domain here, no console known, did not answer,
            no signer here, no such book shown, …).
        detail:
          type: string
      description: A refusal of the own doors of chapter 6.7 and of transitions 1–2 of the forwarding contract `{error, detail}` (chapter 6.7 N4).
    DomainKeys:
      type: object
      description: The answer of GET /domain/keys (chapter 6.7 N1.11).
      required:
      - rows
      - families
      - keyset
      additionalProperties: false
      properties:
        rows:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        families:
          type: object
          description: The domain.keys families of the manifests of the catalog; one id in several manifests — the union
            of keys without repeats, keys in ascending UTF-8 byte order (chapter 6.7 N1.11).
          additionalProperties:
            type: array
            items:
              type: string
        keyset:
          type:
          - string
          - 'null'
          description: doc of the domain/keys row as is.
    Resolved:
      type: object
      description: The record of a field in the answer of GET /domain/shared/<sub> (chapter 6.7 N1.14 record, N3 resolve).
      required:
      - from
      additionalProperties: false
      properties:
        value:
          description: The value of the field or of the document.
        groups:
          type: array
          items:
            type: string
        from:
          type: string
        inherit:
          description: inherit of the manifest.
        merge:
          const: union
    SharedValues:
      type: object
      description: The answer of GET /domain/shared/<sub> (chapter 6.7 N1.14).
      required:
      - sub
      - term
      - rev
      - fields
      additionalProperties: false
      properties:
        sub:
          type: string
        term:
          type:
          - integer
          - 'null'
        rev:
          type:
          - integer
          - 'null'
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Resolved'
    PolicyInput:
      type: object
      required:
      - servers
      additionalProperties: false
      properties:
        servers:
          type: string
          enum:
          - shared
          - distinct
  responses:
    BadBody:
      description: 'The common refusal of parsing a console request (chapter 6.5 N2 «Console request parsing»: query, the JSON of the body, a readable
        parameter repeated) — error refused — or of transport — the body is chunked or shorter than declared, error denied (chapter 6.5 N4).
        A refusal of the form of its own door is named by its operation: the words of the list data/refusal-words.tsv.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    Unauthenticated:
      description: The identity is not confirmed — the gate of chapter 6.3 (identity), error denied; the open paths — there too (open_routes). A callback with the header
        X-W2C-Pass-Ticket that did not pass the ticket order — detail «ticket refused» (chapter 6.3 N1.9; the gate and pass contract).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Denied'
    Denied:
      description: 'Access refusal — the gate of chapter 6.3: «no grant» (need), «no domain, not loopback», a foreign Origin on an acting
        request by cookie (csrf); error denied.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Denied'
    WriteDenied:
      description: 'A write refused by writes_via — error writes via (chapter 6.1 N1.1a), before need and may; another access refusal — error
        denied, as in Denied. A batch is refused as a whole.'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Denied'
            - $ref: '#/components/schemas/WritesVia'
    NoRoute:
      description: No route (chapter 6.5 N2 «Common codes»); this is not a loader answer about a faulty manifest.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoRoute'
    Method:
      description: A method not among those declared for this door, without the Allow header (chapter 6.5 N2 «Common codes»).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Method'
    SlowBody:
      description: The body is read too slowly (chapter 6.5 N4).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    LargeBody:
      description: The body is larger than the console limit (chapter 6.5 N4); P/01.1 does not add its service fields limit/size here.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    RateLimited:
      description: The common input limit of the console (chapter 6.5 N4), error too many attempts; the doors have no new quotas — neither on reading
        the manifest nor on creating units.
      headers:
        Retry-After:
          description: The retry term by the rule of the input limit.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    GuardUnavailable:
      description: The common console refusal — busy with Retry-After 1 or denied on a loss of trust (chapter 6.5 N4, lines «lane busy»
        and «keys existed, no verifier available»).
      headers:
        Retry-After:
          description: Required with the value 1 on busy; not promised for the other reasons.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GuardUnavailable'
    Unavailable:
      description: A required read or write of the store is not confirmed — error unavailable (the doors of chapter 6.6; for the observations
        /servers, /resources, /where, /metrics — chapter 6.5 N4); the lane
        is busy — busy with Retry-After 1; there were keys, nothing to check the trust with — denied (the gate of chapter 6.3, shut). Before
        a repeat of a change, read the state.
      headers:
        Retry-After:
          description: Required with the value 1 on busy; not promised for the other reasons.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unavailable'
    RevisionMoved:
      description: If-Match is not equal to the version of the row (chapter 6.1 N2 «Versions»); nothing is written.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevisionMoved'

    BadRead:
      description: The common refusal of transport or path, including badkey of the full store key; detail and error, without fault.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TextRefusal'
    BadRequest:
      description: 'A form refusal by N4; the order of N3. Also the common refusal of reading the console body: a chunked or short body (lesson
        9 N1.3 body, N4 «body: chunked / larger / slow / short»). Reasons without fault pass detail and error. A refusal
        of the full store key — error badkey without fault; completion of POST by N3.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormRefusal'
    NotFound:
      description: No row or a tombstone for PUT/DELETE — error no such unit. An unknown route — detail no such route,
        error no such path. An extra segment — detail a unit's path names one unit, error no such path (chapter 6.5 N2
        «Common codes»).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TextRefusal'
    UnitUnavailable:
      description: The store is unavailable — error with the text store unavailable; the answer under the key is not remembered. Also the lane
        is busy — error busy and Retry-After 1 (chapter 6.5 N4 «lane busy»), or there were keys, but nothing to check the trust with
        — error denied (the gate of chapter 6.3, shut; chapter 6.5 N4 «keys existed, no verifier available»).
      headers:
        Retry-After:
          description: Required with the value 1 on busy; not promised for the other reasons.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnitUnavailable'
    WriteUnavailable:
      description: The common 503 by Unavailable or a set but unreadable secret ring by chapter 6.2 N4
        («key configured but unreadable, any POST/PUT units»). A 5xx answer is not saved as done; the pending state — by chapter 6.1 N3.
      headers:
        Retry-After:
          description: Required with the value 1 on busy; not required for the ring error.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/UnitUnavailable'
            - $ref: '#/components/schemas/SealingUnavailable'
    TableMethod:
      description: A table method other than GET, POST and DELETE of one row (N2).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TableMethod'
    ConsoleUnavailable:
      description: 'The common 503 of the door: the lane is busy — busy with Retry-After 1; trust cannot be checked — denied (the gate of chapter
        6.3, shut; chapter 6.5 N4); other reasons — a required read and a shell with an on…= attribute for pages — unavailable, sealing
        — by the word of its own norm (chapter 6.5 N4).'
      headers:
        Retry-After:
          description: Required with the value 1 on busy; not promised for the other reasons.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemRefusal'
    PassFailed:
      description: 'door.pass: the worker did not answer, the answer is larger than 4 MiB, broken off or the answer timeout expired — before successful headers
        (error denied, detail «<worker> did not answer»; chapter 6.5, P/06.5-12). For the second kind also an answer type outside the list and a foreign server leaf.
        A repeat is not automatic: find out the outcome from the holder. A worker answer with code 502 is passed on as received.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemRefusal'
    PassTimedOut:
      description: 'door.pass of the second kind: the wait limit of the route expired before the answer headers (error denied, detail «<worker> did not answer»; the guard
        and pass contract timeout). A repeat is not automatic: find out the outcome from the holder. A worker answer with code 504 is passed on as received.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemRefusal'
    PassUnavailable:
      description: 'door.pass: the console has no client to the workers — error denied, detail «this console passes no route on to a
        worker»; there is no live worker of the subsystem with a door (definition — chapter 6.5, P/06.5-12) — error denied, detail «no worker
        of <sub> with a door is heard»; the common
        busy and denied — chapter 6.5 N4. A worker answer with code 503 is passed on as received.'
      headers:
        Retry-After:
          description: Required with the value 1 on busy; not promised for the other reasons.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsoleRefusal'
    PassAnswer:
      description: 'The worker answer as received: status, Content-Type and a body of at most 4 MiB (chapter 6.5); the form is the matter of the subsystem,
        this contract does not set it. The console does not follow a redirect.'
      content:
        '*/*':
          schema: {}
    BookNotShown:
      description: 'The book door (chapter 6.7 N1.1, N4): the manifest does not declare the book or the book is without show («carried and not shown»), the book
        is not delivered yet («not delivered yet»); the common refusal «no route» — chapter 6.5 N2.'
      content:
        application/json:
          schema:
            anyOf:
            - unevaluatedProperties: false
              allOf:
              - $ref: '#/components/schemas/DomainRefusal'
              - properties:
                  error:
                    const: no such book shown
            - $ref: '#/components/schemas/NoRoute'
    ForwardBadRequest:
      description: 'Transition 1 (chapter 6.7 N3 «forward», N4): X-W2C-Via came, and it has to be forwarded to another cluster — one hop;
        the body is the common parse and transport refusal (chapter 6.5 N4). An answer of the domain console with code 400 is passed on as it came.'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/DomainRefusal'
            - $ref: '#/components/schemas/ConsoleRefusal'
    ForwardNotFound:
      description: 'Transition 1 (chapter 6.7 N4): not a domain route (a path outside the table and not its own, a segment «.»/«..» — before the identity and
        without a call), no domain here, no console known. An answer of the domain console with code 404 is passed on as it came.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainRefusal'
    ForwardFailed:
      description: 'Transition 1 (chapter 6.7 N4): did not answer (no answer within FORWARD_WAIT — the column «Wait» of the row, network,
        refusal of peer; detail «<cluster>''s console did not answer[: <peer word>]»), answer too large (larger than FORWARD_MAX 1 MiB),
        answer broke off. An answer of the domain console with code 502 is passed on as it came.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainRefusal'
    ForwardUnavailable:
      description: 'Transition 1 (chapter 6.7 N4): domain console not known, the list of members does not read, CLUSTERS does not
        read; the common 503 of the console (busy, denied — chapter 6.5 N4). An answer of the domain console with code 503 is passed on as it came.'
      headers:
        Retry-After:
          description: Required with the value 1 on busy; not promised for the other reasons.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/DomainRefusal'
            - $ref: '#/components/schemas/ConsoleRefusal'
    ForwardAnswer:
      description: 'The answer of the domain console as it came (chapter 6.7 N1.5; the forwarding contract «Forwarding is one function» answer):
        status, Content-Type, X-Unreachable and the body without parsing and wrapping. The forms and codes — the operation of the OpenAPI of lesson P/10 by the row
        of the table «Domain doors» (transition 2) and the OpenAPI of lesson P/08 (transition 3); this contract does not list them (the forwarding contract
        «Refusals by transition»).'
      content:
        '*/*':
          schema: {}
    AtAnswer:
      description: The answer of the member console as it came (chapter 6.7 N1.6 answer) — status, Content-Type, X-Unreachable, body (Where
        of chapter 6.5, the answer of the unit door, of the door route or a refusal of its gate).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    AtNotFound:
      description: '404 /domain/at/… — a forwarding refusal (chapter 6.7 N4: not a route handed to a member, not another member, no such
        member, no console known) or the answer of the member console as it came (N1.6 answer): NotPlaced of the where door of chapter 6.5 or its
        NoRoute (the ConsoleRefusal form is a special case of DomainRefusal).'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/DomainRefusal'
            - $ref: '#/components/schemas/NotPlaced'
    AtBadRequest:
      description: '400 /domain/at/… — a forwarding refusal (one hop) or the answer of the member console as it came; 400 of the where door — BadBody
        of the ConsoleRefusal form {error, detail}, a special case of DomainRefusal, so one schema covers both sides.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainRefusal'
    SharedRefused:
      description: 'GET /domain/shared/<sub> (chapter 6.7 N1.14 refusals): ?unit= empty or repeated — {error: refused, detail: "a
        unit id is required"}; the common refusal of request parsing — chapter 6.5 N2.'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/DomainRefusal'
            - $ref: '#/components/schemas/ConsoleRefusal'
    SharedNotFound:
      description: 'GET /domain/shared/<sub> (chapter 6.7 N1.14 refusals): a subsystem without domain.shared — no such shared settings;
        ?unit= — there is no such unit, including a unit of another manifest, or the id is not by the grammar of chapter 6.1 N1.3 — no such unit;
        the common refusal «no route» — chapter 6.5 N2.'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/DomainRefusal'
            - $ref: '#/components/schemas/NoRoute'
    HeldUnavailable:
      description: '/api/held, /api/backup (chapter 6.7 N1.12, N1.13): the store did not answer, the list of members or the backup
        does not read — {error: unavailable, detail}; the lane is busy — busy with Retry-After 1 (chapter 6.5 N4).'
      headers:
        Retry-After:
          description: Required with the value 1 on busy; not promised for the other reasons.
          schema:
            type: string
            const: '1'
      content:
        application/json:
          schema:
            anyOf:
            - unevaluatedProperties: false
              allOf:
              - $ref: '#/components/schemas/DomainRefusal'
              - properties:
                  error:
                    const: unavailable
            - $ref: '#/components/schemas/Unavailable'
    BackupRefused:
      description: 'GET /api/backup (chapter 6.7 N1.13 order): 401 — no signature headers or ask-sig is not ok (detail — a word
        of the request signature contract); 403 — the member is not in domain/member-list/<part> of this cluster or without a key, the key is revoked; error —
        refused.'
      content:
        application/json:
          schema:
            unevaluatedProperties: false
            allOf:
            - $ref: '#/components/schemas/DomainRefusal'
            - properties:
                error:
                  const: refused
    SignerNotHere:
      description: 'Forwarding to the signer (chapter 6.7 N1.8 codes): no SIGNER_URL — {error: "no signer here", detail: "<cluster>
        runs no signer of the domain (SIGNER_URL): the domain cannot be handed here"}.'
      content:
        application/json:
          schema:
            unevaluatedProperties: false
            allOf:
            - $ref: '#/components/schemas/DomainRefusal'
            - properties:
                error:
                  const: no signer here
    SignerFailed:
      description: 'Forwarding to the signer (chapter 6.7 N1.8 codes): the signer of its own box did not answer in time (10 s for prepare, 90 s
        for take and move) — {error: "did not answer", detail: "this box''s signer did not answer"}.'
      content:
        application/json:
          schema:
            unevaluatedProperties: false
            allOf:
            - $ref: '#/components/schemas/DomainRefusal'
            - properties:
                error:
                  const: did not answer
x-mounting: The subsystem routes /manifest, /servers, /unplaceable, /where, /metrics also have the prefix /<sub> (for /unplaceable and
  /where/{id} — paired with servers). /session, /mounts and /platform are common; a page of a mounted subsystem without console.shell gives 404 MountedPage, with it — the shell.
  Names are read from the catalog, an unknown sub — NoRoute.
x-byte-limits: Console JSON >= 1048576 bytes; blob PUT 33554432; the body copy at the resource — P/05 (67108864). The size is checked
  by the bytes actually read and the header, not by maxLength of a string. Chunked at the console — 400; blob without Content-Length — 400;
  the door.pass body — at most 1 MiB, the worker answer — at most 4 MiB.
