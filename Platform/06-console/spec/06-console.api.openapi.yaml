    ConsoleEventRow:
      description: Строка ответа консоли — с epoch_is и fenced (P/05 Н1.3, Н3 «слияние»).
      type: object
      additionalProperties: true
      allOf:
      - $ref: ../../05-resource/spec/05-resource.api.openapi.yaml#/components/schemas/EventRow
      required:
      - epoch_is
      - fenced
    ConsoleEvents:
      type: object
