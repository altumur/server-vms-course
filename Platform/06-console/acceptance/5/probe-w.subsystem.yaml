# probe-w — fourth manifest of the chapter 6.5 stand: writes_via (P/06.1 N1.1a; ADR-0119 addenda (10), (11)), sc. 33.
# Only probe-x writes unit rows items and table log, under a ticket; the session receives 403 writes via. Table free has no writes_via word;
# the human door remains open. The stand does not start a worker: row doors do not wait for it.
name: probe-w
unit:
  rows: items
  id: name
  fields: {name: {type: string, required: true}, note: {type: string}}
  writes_via: [probe-x]
tables:
  log:
    key: name
    fields: {name: {type: string, required: true}}
    writes_via: [probe-x]
  free:
    key: name
    fields: {name: {type: string, required: true}}
placement: {capacity: {default: 1}}
worker: {exec: /usr/lib/probe-w/worker}
