# probe-w — четвёртый манифест стенда главы 6.5: слово writes_via (P/06.1 N1.1a; ADR-0119 доп. (10), (11)), сц. 33.
# Строки единицы items и таблицы log пишет только probe-x по билету; сеанс получает 403 writes via. Таблица free — без слова,
# дверь человека открыта как прежде. Воркера стенд не запускает: двери строк его не ждут.
name: probe-w
unit:
  rows: items
  id: name
  fields: {name: {type: string, required: true}, note: {type: string}}
  writes_via: [probe-x]
tables:
  log:
    key: name
    fields: {name: {type: string, required: true}}
    writes_via: [probe-x]
  free:
    key: name
    fields: {name: {type: string, required: true}}
placement: {capacity: {default: 1}}
worker: {exec: /usr/lib/probe-w/worker}
