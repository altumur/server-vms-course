# probe-x — третий манифест стенда главы 6.5 (прежде М10/9; разбор ревью стадии B 3–5, № 34): имя с «-», чтобы проверить metrics.prefix (М10/2 Н2: «-» → «_»).
name: probe-x
# label — умолчание с {id}: дверь подставляет выданный номер при создании (P/06.1 Н1.2 шаг 3; запрос VMS № 1, сц. 18)
# cost — поле веса placement.weight.field: целое < 1 — 400 «cost must be at least 1» (P/06.1 Н4; аудит покрытия P/06, сц. 23)
unit: {rows: probes, id: numeric, fields: {label: {type: string, default: 'probe{id}'}, n: {type: int}, cost: {type: int, default: 1}}}
placement: {capacity: {default: 1}, weight: {field: cost, default: 1}}
worker: {exec: /usr/lib/probe-x/worker}
