# Семья <sub>/next_id — счётчик числовых id единиц (P/06.1; P/06.1 Н1.1, Н1.3 numeric). Источник формы строки (ADR-0088).
# Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md.
dialect: data-form/1
root:
  type: object
  properties:
    n:
      ref: common.pos53
      description: >-
        счётчик номеров единиц при unit.id: numeric (Н1.3 numeric): последний выданный номер, десятичное целое;
        следующий — n + 1 (разбор ревью стадии B 6–7, № 38); строки нет — recover: без единиц и заявок 1, при существующих
        единицах — наибольший + 1 (решение «Архитектора» 2026-10-20); номер не используется повторно никогда;
        резерв — запись n + 1 с cas под стражем заявки (Н3 «создать» шаг 3); recover — выдаваемый номер = наибольший
        номер среди строк и надгробий и номеров живых заявок + 1, счётчик переписан целиком с n = этот номер
  required: [n]
