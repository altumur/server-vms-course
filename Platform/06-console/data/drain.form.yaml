# Семья platform/drain — дренаж одного сервера на кластер (P/06.6; P/06.6 Н1.1, Н1.2, Н2.1 `/drain`). Источник формы строки
# (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md. Пишет
# консоль (admin) дверью POST /drain, снимает DELETE /drain; читают контроллер (P/04 Н1.1, пул) и консоль (DrainState).
dialect: data-form/1
root:
  type: object
  properties:
    server:
      type: string
      pattern: '(([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9-]{0,61}[A-Za-z0-9])(\.([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9-]{0,61}[A-Za-z0-9]))*)?'
      max_bytes: 253
      description: >-
        дренируемый сервер — имя сервера Н2.1 (имя хоста RFC 1123: метки 1–63 знака `[A-Za-z0-9-]` через «.», не
        начинаются и не кончаются «-», всего не больше 253 байт); "" — дренажа нет
    at:
      ref: common.time
      description: момент записи
  required: [server, at]
