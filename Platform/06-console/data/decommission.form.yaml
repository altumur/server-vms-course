# Семья platform/decommission/<сервер> — запрос вывода сервера (P/06.6; P/06.6 Н1.1, Н3 «вывести_сервер»). Источник формы
# строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова — Platform/common/DIALECT.md.
# Пишет консоль дверью POST /servers/{server}/decommission (создание), снимает DELETE; читают контроллер (исполнение,
# P/04 Н3 «вывести_сервер»), воркер (P/03.2 Н3 «старт()» шаг 3), ресурс (P/05 Н1.4 door_row) и консоль.
dialect: data-form/1
root:
  type: object
  properties:
    by:
      type: string
      description: кто запросил вывод — доказанное имя вызывающего (глава 6.3 Н1.3)
    at:
      ref: common.time
      description: момент запроса; контроллер переносит его в `asked_at` отметки `<sub>/decommissioned/<сервер>` (P/04 Н1.1)
    why:
      type: string
      description: слова оператора из поля `why` тела запроса (Н2.1)
    gone:
      type: string
      enum: ['true']
      description: подтверждение «сервера нет», когда ресурс никогда не слышали (Н2.2, Н3 «вывести_сервер»); нет — не подтверждено
  required: [by, at, why]
