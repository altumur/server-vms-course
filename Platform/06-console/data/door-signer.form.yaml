# Семья door/signer — подписант токена двери (P/06.5; P/06.5 Н3 «`/where/<id>`», «Токен двери — байты»).
# Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова —
# Platform/common/DIALECT.md. Пишет консоль при первой выдаче токена (создание-однажды), перезапечатывает при старте под
# текущий kid кольца (глава 6.2); admin — `w2cctl secrets seal` (P/02.4 Н1.9). Конверт seed_secret — договор запечатывания.
dialect: data-form/1
root:
  type: object
  properties:
    kid:
      type: string
      pattern: '[a-z0-9-]{1,32}'
      description: "имя ключа подписи токена двери, 1–32 знака [a-z0-9-]; тот же kid — в door/keys и в токене `door1.<kid>…`"
    seed_secret:
      type: string
      description: >-
        32 байта зерна Ed25519 в 64 строчных hex; секрет по суффиксу `_secret` — конверт кольца `enc:v2`
        (договор запечатывания, глава 6.2)
  required: [kid, seed_secret]
