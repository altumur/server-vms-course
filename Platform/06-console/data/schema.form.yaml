# Семья platform/schema — версия раскладки хранилища (P/06.6; P/06.6 Н1.1а, Н2.3 `/schema`, Н3 «поднять_схему», «старт
# консоли — проверка схемы»). Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key
# каталога. Слова — Platform/common/DIALECT.md. Пишет консоль (admin) подъёмом схемы с cas; нет строки — схема сборки
# (свежая установка); читают при старте контроллер, воркер (и после продления слота), ресурс, консоль и процессы домена.
dialect: data-form/1
root:
  type: object
  properties:
    version:
      type: integer
      minimum: 1
      description: >-
        версия раскладки ≥ 1; подъём только вверх (Н3 «поднять_схему»); `GET /schema` отдаёт её точным числом JSON
    at:
      ref: common.time
      description: момент подъёма; при той же версии строка переписывается с новым at (Н2.3 PUT)
  required: [version, at]
