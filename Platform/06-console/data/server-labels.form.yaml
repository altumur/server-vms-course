# Семья platform/servers/<сервер> — метки сервера от администратора (P/06.6; P/06.6 Н1.1, Н2.1 `/servers/{server}/labels`;
# ADR-0026). Источник формы строки (ADR-0088). Экземпляр — {key, row}; ключ — грамматика колонки key каталога. Слова —
# Platform/common/DIALECT.md. Пишет консоль дверью PUT /servers/{server}/labels, снимает DELETE; строка побеждает метки
# узла, даже пустая; читают контроллер (P/04 Н1.1, Н1.3 constraint) и консоль.
dialect: data-form/1
root:
  type: object
  properties:
    labels:
      type: array
      items:
        type: string
        pattern: '[A-Za-z0-9][A-Za-z0-9_.:-]{0,63}'
        description: метка — 1–64 ASCII-знака, первая буква/цифра, далее буква/цифра, `_`, `.`, `:`, `-`; перевод строки недопустим (азбука меток, common/contracts/labels.md)
      description: >-
        метки сервера по правилу списка (через запятую, иначе массив JSON; кодек array); "" — ни одной: сервер не
        достаёт ни до одной метки; строка побеждает метки узла
  required: [labels]
