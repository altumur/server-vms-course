name: probe
unit:
  rows: units
  id: name
  fields:
    name:
      type: string
      required: true
    until:
      type: float
    retired:
      type: bool
placement:
  capacity:
    default: 1
  retire_when:
    field: retired
    in:
    - true
    delete_after: 1
worker:
  exec: /usr/lib/probe/worker
