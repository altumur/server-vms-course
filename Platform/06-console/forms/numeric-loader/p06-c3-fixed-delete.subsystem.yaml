name: probe
unit:
  rows: units
  id: numeric
  fields:
    name:
      type: string
      required: true
    until:
      type: float
    retired:
      type: bool
    pin:
      type: string
      fixed: true
placement:
  capacity:
    default: 1
worker:
  exec: /usr/lib/probe/worker
  deletes:
  - units
