# P/10 — двери консоли домена (domainconsole, порт 8444): HTTP-контракт урока (план переноса урока 10, § 4). Слито из
# контрактов М11/1, М11/3, М11/4, М11/6, М11/8, М11/9, М11/11 (пути консоли домена; М11/4, М11/6 — из истории, сняты
# коммитом 9) — стадия B, без изменения поведения. Коды — только перехода 2 договора пересылки
# Platform/common/contracts/forwarding.md «Отказы по переходам» (разбор ревью стадии A 8–10, решение 3): дверь роли TLS
# (401/403 no_role, wrong_role, bad_chain; отказ рукопожатия — без ответа HTTP), сторожевая (401/403 denied, 503 shut и unavailable),
# 404 not a domain route, 400/408/413 тела, 502 передачи, door.pass и отказы своих чтений; коды переходов 1–2 (пересылающая консоль
# кластера) здесь не перечисляются, ответа Forwarded нет. Двери, которые консоль передаёт процессу domain, — без голого
# default: ответы процесса — $ref на операцию и компоненты OpenAPI урока P/08 (решение «Архитектора» по планам 8–10, п. 9),
# совпавший код — anyOf своего тела и тела процесса. Страница, модуль, /session, /healthz — $ref на пути OpenAPI P/06
# (В7 плана урока 6). Схемы вида, единиц, теневого отчёта, списка членов, топологии, назначения, строки гранта, общего
# документа и доставки — OpenAPI P/08 ($ref), копий нет.
openapi: 3.1.0
info:
  title: P/10 — двери консоли домена
  version: '1'
  description: Канон — нормы 10-domain-console.norms.md (Н1.2 двери чтения, Н1.3 передача, Н1.4 дверь роли, Н1.5 сторожевая,
    Н1.6 door.pass, Н1.7 страница, Н1.8 тревоги, Н4 отказы). Закрытый список дверей домена — договор пересылки «Двери домена».
    Разбор запроса — P/01.1 Н2.1 с отступлениями P/06.5 Н2. Внутренний API не нормируется; контракт не утверждает, что какая-либо
    реализация ему проверена.
servers:
- url: '{origin}'
  description: Консоль домена держателя (DOMAIN_CONSOLE_HOST/PORT, P/02.4 Н1.12).
  variables:
    origin:
      'default': 'http://localhost:8444'
      description: Origin без завершающего /; пример адреса (стенд одной машины), не настройка.
paths:
  /domain:
    get:
      summary: Вид домена (Н1.2а)
      description: 'Отвечает консоль домена сама (P/10-01); поле url вида, которое не читается (не строка), — null в ответе (В7
        п. 3, решение «Архитектора» 2026-10-28; строка 53 списка).'
      responses:
        '200':
          description: Объект domain/view последнего прохода держателя и age
          content:
            application/json:
              schema:
                $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/ServedView'
        '400': &id001
          $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/responses/BadBody'
        '401': &id002
          $ref: '#/components/responses/Unauthenticated'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDomain'
        '503':
          $ref: '#/components/responses/ReadUnavailable'
    head:
      summary: 'HEAD: тот же код и заголовки, что у GET, без тела (P/06.5 Н2; договор пересылки «Двери домена»)'
      responses:
        '200':
          description: как у GET, без тела
        '400':
          description: как у GET, без тела
        '401':
          description: как у GET, без тела
        '403':
          description: как у GET, без тела
        '404':
          description: как у GET, без тела
        '503':
          description: как у GET, без тела
  '/domain/{sub}/{rows}':
    get:
      summary: Единицы подсистемы в виде домена (Н1.2а)
      description: Отвечает консоль домена сама (P/10-01); POST — передача процессу.
      responses:
        '200':
          description: Единицы подсистемы по (cluster, id)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/Unit'
        '400': *id001
        '401': *id002
        '403': *id003
        '404':
          $ref: '#/components/responses/ViewNotFound'
        '503':
          $ref: '#/components/responses/ReadUnavailable'
      parameters: &id005
      - name: cluster
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: Только единицы этого члена; повтор или пусто — 400 (P/06.5 Н2).
    head:
      summary: 'HEAD: тот же код и заголовки, что у GET, без тела (P/06.5 Н2; договор пересылки «Двери домена»)'
      responses:
        '200':
          description: как у GET, без тела
        '400':
          description: как у GET, без тела
        '401':
          description: как у GET, без тела
        '403':
          description: как у GET, без тела
        '404':
          description: как у GET, без тела
        '503':
          description: как у GET, без тела
      parameters: *id005
    parameters:
    - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/parameters/Sub'
    - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/parameters/Rows'
    post:
      operationId: passEditCreate
      summary: 'Передача процессу domain: Создать единицу на члене (правка хранится) (OpenAPI P/08, operationId editCreate)'
      description: 'Консоль домена передаёт запрос процессу domain (Н1.3, Н1.3а): метод, путь с query, тело, Authorization,
        Idempotency-Key, If-Match как пришли; X-W2C-Client ставит консоль (договор пересылки «Адрес клиента»). Ответы процесса
        (переход 3) — ссылкой на операцию editCreate OpenAPI P/08, как пришли; свои коды — перехода 2 (договор пересылки «Отказы
        по переходам»); голого default нет (решение «Архитектора» по планам 8–10, п. 9).'
      parameters:
      - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/paths/~1domain~1{sub}~1{rows}/post/requestBody/content/application~1json/schema'
      responses:
        '202':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Kept'
        '400':
          description: 'Переход 2 — тело или запрос не прочитаны — общий отказ разбора запроса консоли или chunked (P/06.5
            Н2, Н4; договор сторожевой и передачи body). Переход 3 — ответ процесса domain как пришёл: OpenAPI P/08, operationId
            editCreate, ответ 400 (Отказ двери (Н4 главы двери))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/ConsoleRefusal'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Refused/content/application~1json/schema'
        '401':
          description: 'Переход 2 — нет личности — сторожевая консоли домена (Н1.5, error denied) или дверь роли TLS без сертификата
            клиента (Н1.4 server.role, error no_role). Переход 3 — ответ процесса domain как пришёл: OpenAPI P/08, operationId
            editCreate, ответ 401 (Личность и грант у двери процесса (P/08.4 Н1.5): токена нет или не прошёл — 401, may —
            deny — 403; форма {error: denied, detail} — P/06.3 Н4 denied (OpenAPI урока 6, Denied))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GateOrRole401'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Denied/content/application~1json/schema'
        '403':
          description: 'Переход 2 — отказ доступа — сторожевая консоли домена (Н1.5, error denied) или дверь роли TLS: no_role,
            wrong_role, bad_chain (Н1.4 server.role). Переход 3 — ответ процесса domain как пришёл: OpenAPI P/08, operationId
            editCreate, ответ 403 (Личность и грант у двери процесса (P/08.4 Н1.5): токена нет или не прошёл — 401, may —
            deny — 403; форма {error: denied, detail} — P/06.3 Н4 denied (OpenAPI урока 6, Denied))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GateOrRole403'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Denied/content/application~1json/schema'
        '404':
          description: 'Переход 2 — путь с сегментом . или .. (в том числе в процент-форме) — not a domain route, до сторожевой
            и без передачи (договор пересылки «Двери домена»). Переход 3 — ответ процесса domain как пришёл: OpenAPI P/08,
            operationId editCreate, ответ 404 (Отказ двери (Н4 главы двери))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/NotADomainRoute'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Refused/content/application~1json/schema'
        '408':
          $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/responses/SlowBody'
        '409':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Refused'
        '413':
          $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/responses/LargeBody'
        '422':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Refused'
        '502':
          $ref: '#/components/responses/PassBroke'
        '503':
          description: 'Переход 2 — сторожевая shut — ключи были или след домена есть, а проверить нечем (договор сторожевой
            и передачи shut; P/06.3 Н1.8) или unavailable — строка проверки доступа есть, но не читается (Н1.5; правило
            «Нечитаемая строка», форма Unavailable). Переход 3 — ответ процесса domain как пришёл: OpenAPI P/08, operationId editCreate,
            ответ 503 (503 двери (её Н3: счётчик назначений не записался, правка — ref не найден при неполном ответе или contested
            (P/08.6); names unknown (P/08.4); прежний общий документ не читается (P/08.9 Н1.3 шаг 5); «a move is under way
            here already», «a handover is under way already» (P/08.8 Н1.7, Н1.8)), frozen (P/08.8 Н1.7) или standby процесса
            domain (P/08.10 Н1.7))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/Denied'
                - $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Refused503/content/application~1json/schema'
  /domain/shadow:
    get:
      summary: Теневой отчёт последнего прохода (Н1.2а)
      description: Отвечает консоль домена сама (P/10-01).
      responses:
        '200':
          description: Теневой отчёт
          content:
            application/json:
              schema:
                $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/ShadowReport'
        '400': *id001
        '401': *id002
        '403': *id003
        '404':
          $ref: '#/components/responses/NoDomain'
        '503':
          $ref: '#/components/responses/ReadUnavailable'
    head:
      summary: 'HEAD: тот же код и заголовки, что у GET, без тела (P/06.5 Н2; договор пересылки «Двери домена»)'
      responses:
        '200':
          description: как у GET, без тела
        '400':
          description: как у GET, без тела
        '401':
          description: как у GET, без тела
        '403':
          description: как у GET, без тела
        '404':
          description: как у GET, без тела
        '503':
          description: как у GET, без тела
  /domain/members:
    get:
      summary: Список членов и стучащиеся (Н1.2б)
      description: Отвечает консоль домена сама (P/10-07); POST — передача процессу.
      responses:
        '200':
          description: Список и стучащиеся
          content:
            application/json:
              schema:
                $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/MembersView'
        '400': *id001
        '401': *id002
        '403': *id003
        '404':
          $ref: '#/components/responses/NoDomain'
        '503':
          $ref: '#/components/responses/ReadUnavailable'
    head:
      summary: 'HEAD: тот же код и заголовки, что у GET, без тела (P/06.5 Н2; договор пересылки «Двери домена»)'
      responses:
        '200':
          description: как у GET, без тела
        '400':
          description: как у GET, без тела
        '401':
          description: как у GET, без тела
        '403':
          description: как у GET, без тела
        '404':
          description: как у GET, без тела
        '503':
          description: как у GET, без тела
    post:
      operationId: passMembersAdmit
      summary: 'Передача процессу domain: Принять стучащегося по отпечатку его ключа (OpenAPI P/08, operationId membersAdmit)'
      description: 'Консоль домена передаёт запрос процессу domain (Н1.3, Н1.3а): метод, путь с query, тело, Authorization,
        Idempotency-Key, If-Match как пришли; X-W2C-Client ставит консоль (договор пересылки «Адрес клиента»). Ответы процесса
        (переход 3) — ссылкой на операцию membersAdmit OpenAPI P/08, как пришли; свои коды — перехода 2 (договор пересылки
        «Отказы по переходам»); голого default нет (решение «Архитектора» по планам 8–10, п. 9).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/paths/~1domain~1members/post/requestBody/content/application~1json/schema'
      responses:
        '200':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/paths/~1domain~1members/post/responses/200'
        '400':
          description: 'Переход 2 — тело или запрос не прочитаны — общий отказ разбора запроса консоли или chunked (P/06.5
            Н2, Н4; договор сторожевой и передачи body). Переход 3 — ответ процесса domain как пришёл: OpenAPI P/08, operationId
            membersAdmit, ответ 400 (Отказ двери (Н4 главы двери))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/ConsoleRefusal'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Refused/content/application~1json/schema'
        '401':
          description: 'Переход 2 — нет личности — сторожевая консоли домена (Н1.5, error denied) или дверь роли TLS без сертификата
            клиента (Н1.4 server.role, error no_role). Переход 3 — ответ процесса domain как пришёл: OpenAPI P/08, operationId
            membersAdmit, ответ 401 (Личность и грант у двери процесса (P/08.4 Н1.5): токена нет или не прошёл — 401, may
            — deny — 403; форма {error: denied, detail} — P/06.3 Н4 denied (OpenAPI урока 6, Denied))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GateOrRole401'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Denied/content/application~1json/schema'
        '403':
          description: 'Переход 2 — отказ доступа — сторожевая консоли домена (Н1.5, error denied) или дверь роли TLS: no_role,
            wrong_role, bad_chain (Н1.4 server.role). Переход 3 — ответ процесса domain как пришёл: OpenAPI P/08, operationId
            membersAdmit, ответ 403 (Личность и грант у двери процесса (P/08.4 Н1.5): токена нет или не прошёл — 401, may
            — deny — 403; форма {error: denied, detail} — P/06.3 Н4 denied (OpenAPI урока 6, Denied))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GateOrRole403'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Denied/content/application~1json/schema'
        '404':
          description: 'Переход 2 — путь с сегментом . или .. (в том числе в процент-форме) — not a domain route, до сторожевой
            и без передачи (договор пересылки «Двери домена»). Переход 3 — ответ процесса domain как пришёл: OpenAPI P/08,
            operationId membersAdmit, ответ 404 (Отказ двери (Н4 главы двери))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/NotADomainRoute'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Refused/content/application~1json/schema'
        '408':
          $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/responses/SlowBody'
        '409':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/paths/~1domain~1members/post/responses/409'
        '413':
          $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/responses/LargeBody'
        '502':
          $ref: '#/components/responses/PassBroke'
        '503':
          description: 'Переход 2 — сторожевая shut — ключи были или след домена есть, а проверить нечем (договор сторожевой
            и передачи shut; P/06.3 Н1.8) или unavailable — строка проверки доступа есть, но не читается (Н1.5; правило
            «Нечитаемая строка», форма Unavailable). Переход 3 — ответ процесса domain как пришёл: OpenAPI P/08, operationId membersAdmit,
            ответ 503 (standby процесса domain (P/08.10 Н1.7) или frozen — идёт плановая передача, правки людей и подписанта
            отказаны (P/08.8 Н1.7 order шаг 1))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/Denied'
                - $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/StandbyOrFrozen/content/application~1json/schema'
  /domain/topology:
    get:
      summary: Топология домена (Н1.2в)
      description: 'Из строки domain/topology, не из вида: сразу после PUT — новый rev (P/10-08, T1); PUT — передача процессу.'
      responses:
        '200':
          description: Документ топологии
          content:
            application/json:
              schema:
                $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/Topology'
        '400': *id001
        '401': *id002
        '403': *id003
        '404':
          $ref: '#/components/responses/NoDomain'
        '503':
          $ref: '#/components/responses/ReadUnavailable'
    head:
      summary: 'HEAD: тот же код и заголовки, что у GET, без тела (P/06.5 Н2; договор пересылки «Двери домена»)'
      responses:
        '200':
          description: как у GET, без тела
        '400':
          description: как у GET, без тела
        '401':
          description: как у GET, без тела
        '403':
          description: как у GET, без тела
        '404':
          description: как у GET, без тела
        '503':
          description: как у GET, без тела
    put:
      operationId: passTopologyPut
      summary: 'Передача процессу domain: Правка топологии против прочитанной ревизии (OpenAPI P/08, operationId topologyPut)'
      description: 'Консоль домена передаёт запрос процессу domain (Н1.3, Н1.3а): метод, путь с query, тело, Authorization,
        Idempotency-Key, If-Match как пришли; X-W2C-Client ставит консоль (договор пересылки «Адрес клиента»). Ответы процесса
        (переход 3) — ссылкой на операцию topologyPut OpenAPI P/08, как пришли; свои коды — перехода 2 (договор пересылки
        «Отказы по переходам»); голого default нет (решение «Архитектора» по планам 8–10, п. 9).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/TopologyEdit'
      responses:
        '200':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/paths/~1domain~1topology/put/responses/200'
        '400':
          description: 'Переход 2 — тело или запрос не прочитаны — общий отказ разбора запроса консоли или chunked (P/06.5
            Н2, Н4; договор сторожевой и передачи body). Переход 3 — ответ процесса domain как пришёл: OpenAPI P/08, operationId
            topologyPut, ответ 400 (Отказ двери (Н4 главы двери))'
          content:
            application/json:
              schema:
