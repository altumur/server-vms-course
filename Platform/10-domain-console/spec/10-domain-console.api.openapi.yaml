                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Denied/content/application~1json/schema'
        '404':
          description: 'Переход 2 — путь с сегментом . или .. (в том числе в процент-форме) — not a domain route, до сторожевой
            и без передачи (договор пересылки «Двери домена»). Переход 3 — ответ процесса domain как пришёл: OpenAPI P/08,
            operationId strandedApply, ответ 404 (Элемента нет (Н1.6 apply))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/NotADomainRoute'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/paths/~1domain~1stranded~1apply/post/responses/404/content/application~1json/schema'
        '408':
          $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/responses/SlowBody'
        '409':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/paths/~1domain~1stranded~1apply/post/responses/409'
        '413':
          $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/responses/LargeBody'
        '502':
          $ref: '#/components/responses/PassBroke'
        '503':
          description: 'Переход 2 — сторожевая shut — ключи были или след домена есть, а проверить нечем (договор сторожевой
            и передачи shut; P/06.3 Н1.8) или unavailable — строка проверки доступа есть, но не читается (Н1.5; правило
            «Нечитаемая строка», форма Unavailable). Переход 3 — ответ процесса domain как пришёл: OpenAPI P/08, operationId strandedApply,
            ответ 503 (Процесс domain без очереди domain/signer-turn — ждущий: {error: standby, detail} (P/08.10 Н1.7 standby;
            добавлено М11/12))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/Denied'
                - $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Standby/content/application~1json/schema'
  '/domain/{sub}/{pass}':
    description: 'door.pass на домене (Н1.6, P/10-03): маршрут /domain/<sub>/<сегмент>[/…], чей сегмент в door.pass манифеста
      <sub>, консоль домена передаёт воркеру на домене этой подсистемы (адрес — пульс domain/<sub>/heartbeat) путём /<сегмент>[/…]
      с query, клиентом роли domainconsole; заголовки, тело, ответ и коды — договор сторожевой и передачи «Передача door.pass».
      Ответ воркера — как получен (default: это ответ воркера, не процесса domain; решение п. 9 о передаче процессу его не
      касается). Один сегмент пути различает загруженный манифест: unit.rows — /domain/{sub}/{rows}, door.pass — этот путь (как
      /{rows} и /{pass} OpenAPI P/06); путь длиннее одного сегмента передаётся так же.'
