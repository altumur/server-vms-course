# P/10 — doors of the domain console (domainconsole, port 8444): the HTTP contract of the lesson (transfer plan of lesson 10, § 4). Merged from
# the contracts М11/1, М11/3, М11/4, М11/6, М11/8, М11/9, М11/11 (paths of the domain console; М11/4, М11/6 — from history, removed
# by commit 9) — stage B, without a change of behaviour. Codes — only of transition 2 of the forwarding contract
# Platform/common/contracts/forwarding.md «Refusals by transition» (analysis of review of stage A 8–10, decision 3): the TLS role door
# (401/403 no_role, wrong_role, bad_chain; a handshake refusal — without an HTTP answer), the gate (401/403 denied, 503 shut and unavailable),
# 404 not a domain route, 400/408/413 of the body, 502 of the pass, door.pass and the refusals of its own reads; the codes of transitions 1–2 (the forwarding console
# of the cluster) are not listed here, there is no Forwarded answer. Doors that the console passes to the process domain — without a bare
# default: the answers of the process — $ref to the operation and components of the OpenAPI of lesson P/08 (decision of the Architect on plans 8–10, item 9),
# a coinciding code — anyOf of its own body and the body of the process. Page, module, /session, /healthz — $ref to the paths of the OpenAPI of P/06
# (V7 of the plan of lesson 6). Schemas of the view, units, shadow report, member list, topology, placement, grant row, shared
# document and delivery — OpenAPI of P/08 ($ref), no copies.
openapi: 3.1.0
info:
  title: P/10 — doors of the domain console
  version: '1'
  description: Canon — the norms 10-domain-console.norms.md (N1.2 read doors, N1.3 pass, N1.4 role door, N1.5 gate,
    N1.6 door.pass, N1.7 page, N1.8 alarms, N4 refusals). The closed list of domain doors — the forwarding contract «Domain doors».
    Request parsing — P/01.1 N2.1 with the deviations of P/06.5 N2. The internal API is not normed; the contract does not claim that any
    implementation has been checked against it.
servers:
- url: '{origin}'
  description: Domain console of the holder (DOMAIN_CONSOLE_HOST/PORT, P/02.4 N1.12).
  variables:
    origin:
      'default': 'http://localhost:8444'
      description: Origin without a trailing /; an example address (a one-machine stand), not a setting.
paths:
  /domain:
    parameters:
      - name: cursor
        in: query
        required: false
        schema: {type: string}
        description: Opaque continuation returned by GET /domain, including a boundary within one part. Without it, start the traversal; at most 1000 MemberState elements per page (P/10 N1.2a, G10-PAGE-CURSOR-01). Encoding is chosen by the implementation.
    get:
      summary: Domain view (N1.2a)
      description: 'Answered by the domain console itself (P/10-01); the field url of the view that is not readable (not a string) — null in the answer (V7
        item 3, decision of the Architect 2026-10-28; row 53 of the list).'
      responses:
        '200':
          description: Object domain/view of the last pass of the holder and age
          content:
            application/json:
              schema:
                $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/ServedView'
        '400': &id001
          $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/responses/BadBody'
        '401': &id002
          $ref: '#/components/responses/Unauthenticated'
        '403': &id003
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDomain'
        '503':
          $ref: '#/components/responses/ReadUnavailable'
    head:
      summary: 'HEAD: the same code and headers as for GET, without a body (P/06.5 N2; the forwarding contract «Domain doors»)'
      responses:
        '200':
          description: as for GET, without a body
        '400':
          description: as for GET, without a body
        '401':
          description: as for GET, without a body
        '403':
          description: as for GET, without a body
        '404':
          description: as for GET, without a body
        '503':
          description: as for GET, without a body
  '/domain/relays/{relay}':
    get:
      summary: Who is behind the relay (N1.2a)
      description: Answered by the domain console itself; row domain/relay-members, names only, the right view of the domain.
      parameters:
      - {name: relay, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Names ascending; no row — rev 0, empty
          content:
            application/json:
              schema:
                type: object
                required: [relay, rev, members]
                additionalProperties: false
                properties:
                  relay: {type: string}
                  rev: {type: integer, minimum: 0}
                  members:
                    type: array
                    maxItems: 5000
                    items: {type: string}
        '401': {description: No identity}
        '403': {description: No right view of the domain}
        '404': {description: No such member}
        '503': {description: The row is not readable}
  '/domain/{sub}/kept/{name}':
    get:
      summary: Declared row domain.kept (N1.2a)
      description: Answered by the domain console itself; the name — an element of domain.kept_read of the manifest, read only, the right view of the domain.
      parameters:
      - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/parameters/Sub'
      - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Row, secrets masked
          content:
            application/json:
              schema:
                type: object
                required: [items, index]
                additionalProperties: false
                properties:
                  items: {type: object, additionalProperties: true}
                  index: {type: string}
        '401': {description: No identity}
        '403': {description: No right view of the domain}
        '404': {description: Name not declared or no row}
        '503': {description: The row is not readable}
  '/domain/{sub}/tables/{table}':
    get:
      summary: Snapshot of a member table (N1.2a; P/08.1 N1.4a)
      description: Answered by the domain console itself (P/10-01); one member per request.
      parameters:
      - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/parameters/Sub'
      - name: table
        in: path
        required: true
        schema:
          type: string
        description: Key of domain.view_tables of the manifest.
      - name: cluster
        in: query
        required: true
        schema:
          type: string
          minLength: 1
        description: Member; absent, repeated or empty — 400.
      - name: If-None-Match
        in: header
        required: false
        schema: {type: string}
      responses:
        '304':
          description: The body is the same as by the ETag
        '200':
          description: Object as is
          content:
            application/json:
              schema:
                $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/MemberTable'
        '400': *id001
        '401': *id002
        '403': *id003
        '404':
          $ref: '#/components/responses/ViewNotFound'
        '503':
          $ref: '#/components/responses/ReadUnavailable'
  '/domain/{sub}/{rows}':
    get:
      summary: Units of the subsystem in the domain view (N1.2a)
      description: Answered by the domain console itself (P/10-01); POST — pass to the process.
      responses:
        '200':
          description: Units of the subsystem by (cluster, id)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/Unit'
        '400': *id001
        '401': *id002
        '403': *id003
        '404':
          $ref: '#/components/responses/ViewNotFound'
        '503':
          $ref: '#/components/responses/ReadUnavailable'
      parameters: &id005
      - name: cursor
        in: query
        required: false
        schema: {type: string}
        description: 'Continuation only without cluster and part. With either selector it is not read, including invalid opaque contents; there is one page and no X-Cursor. Common HTTP/URL syntax rules still apply.'
      - name: cluster
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: The entire row of this member in its one part, one page; cursor is ignored even if invalid and X-Cursor is absent. Repeated or empty cluster — 400 (P/06.5 N2).
      - name: part
        in: query
        required: false
        schema:
          type: string
          pattern: ^(?:0[0-9]{3}|[1-3][0-9]{3}|40[0-8][0-9]|409[0-5])$
        description: Units of one view row of this part (P/08.3 N1.1; ADR-0113 addendum (22)); without cursor; repeated, empty, not a part or together with cluster — 400.
    head:
      summary: 'HEAD: the same code and headers as for GET, without a body (P/06.5 N2; the forwarding contract «Domain doors»)'
      responses:
        '200':
          description: as for GET, without a body
        '400':
          description: as for GET, without a body
        '401':
          description: as for GET, without a body
        '403':
          description: as for GET, without a body
        '404':
          description: as for GET, without a body
        '503':
          description: as for GET, without a body
      parameters: *id005
    parameters:
    - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/parameters/Sub'
    - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/parameters/Rows'
    post:
      operationId: passEditCreate
      summary: 'Pass to the process domain: Create a unit on a member (the edit is stored) (OpenAPI P/08, operationId editCreate)'
      description: 'The domain console passes the request to the process domain (N1.3, N1.3a): method, path with query, body, Authorization,
        Idempotency-Key, If-Match as they came; X-W2C-Client is set by the console (the forwarding contract «Client address»). The answers of the process
        (transition 3) — by a reference to the operation editCreate of OpenAPI P/08, as they came; its own codes — of transition 2 (the forwarding contract
        «Refusals by transition»); there is no bare default (decision of the Architect on plans 8–10, item 9).'
      parameters:
      - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/paths/~1domain~1{sub}~1{rows}/post/requestBody/content/application~1json/schema'
      responses:
        '202':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Kept'
        '400':
          description: 'Transition 2 — body or request not read — the common refusal of console request parsing or chunked (P/06.5
            N2, N4; the gate-and-pass contract `body`). Transition 3 — the answer of the process domain as it came: OpenAPI P/08, operationId
            editCreate, answer 400 (Refusal of the door (N4 of the chapter of the door))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/ConsoleRefusal'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Refused/content/application~1json/schema'
        '401':
          description: 'Transition 2 — no identity — the gate of the domain console (N1.5, error denied) or the TLS role door without a client
            certificate (N1.4 server.role, error no_role). Transition 3 — the answer of the process domain as it came: OpenAPI P/08, operationId
            editCreate, answer 401 (Identity and grant at the door of the process (P/08.4 N1.5): no token or it did not pass — 401, may —
            deny — 403; form {error: denied, detail} — P/06.3 N4 denied (OpenAPI of lesson 6, Denied))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GateOrRole401'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Denied/content/application~1json/schema'
        '403':
          description: 'Transition 2 — access refusal — the gate of the domain console (N1.5, error denied) or the TLS role door: no_role,
            wrong_role, bad_chain (N1.4 server.role). Transition 3 — the answer of the process domain as it came: OpenAPI P/08, operationId
            editCreate, answer 403 (Identity and grant at the door of the process (P/08.4 N1.5): no token or it did not pass — 401, may —
            deny — 403; form {error: denied, detail} — P/06.3 N4 denied (OpenAPI of lesson 6, Denied))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GateOrRole403'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Denied/content/application~1json/schema'
        '404':
          description: 'Transition 2 — a path with a segment . or .. (including in percent form) — not a domain route, before the gate
            and without a pass (the forwarding contract «Domain doors»). Transition 3 — the answer of the process domain as it came: OpenAPI P/08,
            operationId editCreate, answer 404 (Refusal of the door (N4 of the chapter of the door))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/NotADomainRoute'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Refused/content/application~1json/schema'
        '408':
          $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/responses/SlowBody'
        '409':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Refused'
        '413':
          $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/responses/LargeBody'
        '422':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Refused'
        '502':
          $ref: '#/components/responses/PassBroke'
        '503':
          description: 'Transition 2 — gate shut — there were keys or there is a trace of the domain, but nothing to check with (shut of the gate-and-pass
            contract; P/06.3 N1.8) or unavailable — the access check row exists, but is not readable (N1.5; rule
            «Unreadable row», form Unavailable). Transition 3 — the answer of the process domain as it came: OpenAPI P/08, operationId editCreate,
            answer 503 (503 of the door (its N3: the assignment counter was not written, edit — ref not found with an incomplete answer, or contested
            (P/08.6); names unknown (P/08.4); the former shared document is not readable (P/08.9 N1.3 step 5); «a move is under way
            here already», «a handover is under way already» (P/08.8 N1.7, N1.8)), frozen (P/08.8 N1.7) or standby of the process
            domain (P/08.10 N1.7))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/Denied'
                - $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Refused503/content/application~1json/schema'
  /domain/shadow:
    get:
      summary: Shadow report of the last pass (N1.2a)
      description: Answered by the domain console itself (P/10-01).
      responses:
        '200':
          description: Shadow report
          content:
            application/json:
              schema:
                $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/ShadowReport'
        '400': *id001
        '401': *id002
        '403': *id003
        '404':
          $ref: '#/components/responses/NoDomain'
        '503':
          $ref: '#/components/responses/ReadUnavailable'
    head:
      summary: 'HEAD: the same code and headers as for GET, without a body (P/06.5 N2; the forwarding contract «Domain doors»)'
      responses:
        '200':
          description: as for GET, without a body
        '400':
          description: as for GET, without a body
        '401':
          description: as for GET, without a body
        '403':
          description: as for GET, without a body
        '404':
          description: as for GET, without a body
        '503':
          description: as for GET, without a body
  /domain/members:
    get:
      summary: Member list and those knocking (N1.2b)
      description: Answered by the domain console itself (P/10-07); POST — pass to the process.
      responses:
        '200':
          headers:
            ETag:
              $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/headers/ETag'
          description: 'List and those knocking: rev, term?, members — doc of the row domain/member-rows/<part>; knocking — view.knocking
            (N1.2b; C10-MEMBERS-SOURCE-01)'
          content:
            application/json:
              schema:
                $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/MembersView'
        '400': *id001
        '401': *id002
        '403': *id003
        '404':
          $ref: '#/components/responses/NoDomain'
        '503':
          $ref: '#/components/responses/ReadUnavailable'
    head:
      summary: 'HEAD: the same code and headers as for GET, without a body (P/06.5 N2; the forwarding contract «Domain doors»)'
      responses:
        '200':
          description: as for GET, without a body
        '400':
          description: as for GET, without a body
        '401':
          description: as for GET, without a body
        '403':
          description: as for GET, without a body
        '404':
          description: as for GET, without a body
        '503':
          description: as for GET, without a body
    post:
      operationId: passMembersAdmit
      summary: 'Pass to the process domain: Accept the one knocking by the fingerprint of its key (OpenAPI P/08, operationId membersAdmit)'
      description: 'The domain console passes the request to the process domain (N1.3, N1.3a): method, path with query, body, Authorization,
        Idempotency-Key, If-Match as they came; X-W2C-Client is set by the console (the forwarding contract «Client address»). The answers of the process
        (transition 3) — by a reference to the operation membersAdmit of OpenAPI P/08, as they came; its own codes — of transition 2 (the forwarding contract
        «Refusals by transition»); there is no bare default (decision of the Architect on plans 8–10, item 9).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/paths/~1domain~1members/post/requestBody/content/application~1json/schema'
      responses:
        '412':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/RevisionMoved'
        '422':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/KeyReused'
        '200':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/paths/~1domain~1members/post/responses/200'
        '400':
          description: 'Transition 2 — body or request not read — the common refusal of console request parsing or chunked (P/06.5
            N2, N4; the gate-and-pass contract `body`). Transition 3 — the answer of the process domain as it came: OpenAPI P/08, operationId
            membersAdmit, answer 400 (Refusal of the door (N4 of the chapter of the door))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/ConsoleRefusal'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Refused/content/application~1json/schema'
        '401':
          description: 'Transition 2 — no identity — the gate of the domain console (N1.5, error denied) or the TLS role door without a client
            certificate (N1.4 server.role, error no_role). Transition 3 — the answer of the process domain as it came: OpenAPI P/08, operationId
            membersAdmit, answer 401 (Identity and grant at the door of the process (P/08.4 N1.5): no token or it did not pass — 401, may
            — deny — 403; form {error: denied, detail} — P/06.3 N4 denied (OpenAPI of lesson 6, Denied))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GateOrRole401'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Denied/content/application~1json/schema'
        '403':
          description: 'Transition 2 — access refusal — the gate of the domain console (N1.5, error denied) or the TLS role door: no_role,
            wrong_role, bad_chain (N1.4 server.role). Transition 3 — the answer of the process domain as it came: OpenAPI P/08, operationId
            membersAdmit, answer 403 (Identity and grant at the door of the process (P/08.4 N1.5): no token or it did not pass — 401, may
            — deny — 403; form {error: denied, detail} — P/06.3 N4 denied (OpenAPI of lesson 6, Denied))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GateOrRole403'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Denied/content/application~1json/schema'
        '404':
          description: 'Transition 2 — a path with a segment . or .. (including in percent form) — not a domain route, before the gate
            and without a pass (the forwarding contract «Domain doors»). Transition 3 — the answer of the process domain as it came: OpenAPI P/08,
            operationId membersAdmit, answer 404 (Refusal of the door (N4 of the chapter of the door))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/NotADomainRoute'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/Refused/content/application~1json/schema'
        '408':
          $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/responses/SlowBody'
        '409':
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/paths/~1domain~1members/post/responses/409'
        '413':
          $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/responses/LargeBody'
        '502':
          $ref: '#/components/responses/PassBroke'
        '503':
          description: 'Transition 2 — gate shut — there were keys or there is a trace of the domain, but nothing to check with (shut of the gate-and-pass
            contract; P/06.3 N1.8) or unavailable — the access check row exists, but is not readable (N1.5; rule
            «Unreadable row», form Unavailable). Transition 3 — the answer of the process domain as it came: OpenAPI P/08, operationId membersAdmit,
            answer 503 (standby of the process domain (P/08.10 N1.7) or frozen — a planned handover is under way, edits of people and of the signer
            are refused (P/08.8 N1.7 order step 1))'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/Denied'
                - $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'
                - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/responses/StandbyOrFrozen/content/application~1json/schema'
  /domain/partial/close:
    post:
      summary: End of the «from nothing» collection (chapter 8.8 N1.8a; the right admin of the domain)
      responses:
        '200': {description: 'Pass to the process', content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '401': {description: No identity}
        '403': {description: No right admin}
        '404': {description: No collection}
  /domain/folders/{id}/units:
    get:
      summary: Units of a folder page by page (chapter 8.5 N1.8)
      parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: cursor, in: query, required: false, schema: {type: string}}
      - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000}}
      responses:
        '200':
          description: Page, server order, the cost is constant
          content:
            application/json:
              schema:
                type: object
                required: [units]
                additionalProperties: false
                properties:
                  units:
                    type: array
                    items:
                      type: object
                      required: [cluster, sub, rows, id]
                      additionalProperties: false
                      properties:
                        cluster: {type: string}
                        sub: {type: string}
                        rows: {type: string}
                        id: {type: string}
                  cursor: {type: string}
        '400': {description: Bad cursor}
        '401': {description: No identity}
        '403': {description: No right}
        '404': {description: No folder}
        '503': {description: The row is not readable}
  /domain/batches:
    get:
      summary: Admission batches without the token (chapter 8.3 N1.1b)
      responses:
        '200': {description: 'Pass to the process', content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '401': {description: No identity}
        '403': {description: No right view}
    post:
      summary: New admission batch, the token is shown once (chapter 8.3 N1.1b; the right admin of the domain)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name, n], additionalProperties: false, properties: {name: {type: string}, via: {type: string}, n: {type: integer, minimum: 1}}}}}
      responses:
        '200': {description: 'Pass to the process', content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '400': {description: Not in the form}
        '401': {description: No identity}
        '403': {description: No right admin}
        '409': {description: Such a batch exists}
  /domain/batches/{name}:
    delete:
