components:
  responses:
    Unauthenticated:
      description: нет личности — сторожевая консоли домена (Н1.5, error denied) или дверь роли TLS без сертификата клиента
        (Н1.4 server.role, error no_role)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GateOrRole401'
    Forbidden:
      description: 'отказ доступа — сторожевая консоли домена (Н1.5, error denied) или дверь роли TLS: no_role, wrong_role,
        bad_chain (Н1.4 server.role)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GateOrRole403'
    ReadUnavailable:
      description: 'Дверь чтения консоли домена: строка, которой она отвечает (вид, тень, domain/members, domain/topology,
        domain/placement, запись назначения, указатель domain/shared и его документ), есть, но не читается — 503 {error: "unavailable"}, не 404 и не «строки нет» (В7
        п. 3, решение «Архитектора» 2026-10-28, П1; строки 42, 43, 50, 54 списка); сторожевая shut — договор сторожевой и
        передачи shut'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/Refusal'
            - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/Denied'
    GuardShut:
      description: сторожевая shut — ключи были или след домена есть, а проверить нечем (договор сторожевой и передачи shut;
        P/06.3 Н1.8); или unavailable — строка проверки доступа есть, но не читается (Н1.5; правило «Нечитаемая строка»)
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/Denied'
            - $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'
    NotADomainRoute:
      description: путь с сегментом . или .. (в том числе в процент-форме) — not a domain route, до сторожевой и без передачи
        (договор пересылки «Двери домена»)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotADomainRoute'
    PassBroke:
      description: 'передача процессу domain: обрыв или молчание — слова договора пересылки «Пересылка — одна функция» answer
        (Н1.3 pass)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    NoDomain:
      description: 'Вида нет (не построен) — no domain here (Н1.2а, Н1.2б, Н1.2в); вид есть, но не читается — 503 unavailable
        (ReadUnavailable; В7 п. 3, П1)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoDomainBody'
    ViewNotFound:
      description: 'По порядку Н1.2а: нет такого манифеста; not in the directory — у манифеста нет domain.ref; rows не его; no domain
        here; no such member — член не в списке; путь с . или .. — not a domain route'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    NoPlacement:
      description: Нет записи; нет манифеста или без domain.ref (Н1.2г); путь с . или .. — not a domain route
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    AlarmsWindow:
      description: 'since или until не по грамматике читателя time (договор сторожевой и передачи «Числовые параметры query»), повтор параметра или since > until (Н1.8 door);
        общий отказ разбора запроса — P/06.5 Н2'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/AlarmsRefused'
            - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/ConsoleRefusal'
    PassUnavailableOrShut:
      description: 'door.pass: воркера на домене этой подсистемы не слышно — {error: unavailable, detail: «no worker of <sub>
        with a door is heard»} (Н1.6 absent; договор сторожевой и передачи codes); сторожевая shut или unavailable — строка
        проверки доступа есть, но не читается (Н1.5; правило «Нечитаемая строка», форма Unavailable); ответ воркера с кодом
        503 — как получен'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/ConsoleRefusal'
            - $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'
  schemas:
    Refusal:
      type: object
      required:
      - error
      additionalProperties: false
      description: 'Отказ консоли домена (Н4): error — слово, detail — пояснение.'
      properties:
        error:
          type: string
          minLength: 1
        detail:
          type: string
    RoleRefusal:
      type: object
      required:
      - error
      additionalProperties: false
      description: Отказ двери роли TLS до сторожевой (Н1.4 server.role; слова договора peer).
      properties:
        error:
          enum:
          - no_role
          - wrong_role
          - bad_chain
        detail:
          type: string
    GateOrRole401:
      oneOf:
      - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/Denied'
      - unevaluatedProperties: false
        allOf:
        - $ref: '#/components/schemas/RoleRefusal'
        - properties:
            error:
              const: no_role
    GateOrRole403:
      oneOf:
      - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/Denied'
      - $ref: '#/components/schemas/RoleRefusal'
    NotADomainRoute:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/Refusal'
      - properties:
          error:
            const: not a domain route
    NoDomainBody:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/Refusal'
      - properties:
          error:
            const: no domain here
    AlarmsRefused:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/Refusal'
      - properties:
          error:
            const: refused
          detail:
            const: since and until are times, in seconds
    PlacementList:
      type: object
      required:
      - rev
      - records
      additionalProperties: false
      properties:
        rev:
          type: integer
          minimum: 0
        records:
          type: object
          additionalProperties:
            $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/Placement'
          description: 'Ключ — "<sub>/<ref>".'
    GrantsView:
      type: object
      required:
      - grants
      additionalProperties: false
      properties:
        grants:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/Line'
    SharedView:
      type: object
      required:
      - doc
      - delivery
      - declared
      additionalProperties: false
      properties:
        doc:
          oneOf:
          - type: 'null'
          - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/SharedDoc'
        delivery:
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/Delivery'
        declared:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required:
              - name
              - type
              additionalProperties: false
              properties:
                name:
                  type: string
                type:
                  type: string
                schema:
                  type: object
                  additionalProperties: true
                  description: JSON Schema документа из манифеста (P/02.1 Н1.2б) как объявлена.
    AlarmsView:
      type: object
      required:
      - since
      - until
      - events
      - members
      - complete
      - sentence
      additionalProperties: false
      properties:
        since:
          type: number
        until:
          type: number
        events:
          type: array
          items:
            type: object
            required:
            - t
            - kind
            - class
            - member
            additionalProperties: true
            description: Строка индекса P/05 Н1.3 класса alarm плюс member, t_src, from_history; строка молчания — Н1.8 silence_line.
              Поля строки события задают подсистемы.
        members:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MemberAlarms'
        complete:
          type: boolean
        sentence:
          type: string
    MemberAlarms:
      type: object
      required:
      - state
      additionalProperties: false
      properties:
        state:
          enum:
          - ok
          - silent
          - not_reporting
          - never
          - unreadable
        truncated:
          const: true
        known_until:
          type: number
        silent_since:
          type: number
        alive_at:
          type: number
        alive_via:
          type: string
        history_cut_before:
          type: number
    ManifestNoRoot:
      type: object
      required:
      - name
      - rows
      additionalProperties: false
      properties:
        name:
          const: ''
        rows:
          type: 'null'
    MountsNoRoot:
      type: object
      required:
      - root
      - mounts
      additionalProperties: false
      properties:
        root:
          const: ''
        mounts:
          type: object
          additionalProperties:
            $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/ManifestView'
          description: Описание подсистемы P/06.5 Н2 /mounts; форма — ManifestView контракта P/06.
