components:
  responses:
    Unauthenticated:
      description: no identity — the gate of the domain console (N1.5, error denied) or the TLS role door without a client certificate
        (N1.4 server.role, error no_role)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GateOrRole401'
    Forbidden:
      description: 'access refusal — the gate of the domain console (N1.5, error denied) or the TLS role door: no_role, wrong_role,
        bad_chain (N1.4 server.role)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GateOrRole403'
    ReadUnavailable:
      description: 'A read door of the domain console: the row it answers with (the view, the shadow, domain/member-rows/<part>, domain/topology,
        domain/placement, the assignment record, the pointer domain/shared and its document), exists but is not readable — 503 {error: "unavailable"}, not 404 and not «there is no row» (V7
        item 3, the decision of the Architect of 2026-10-28, P1; rows 42, 43, 50, 54 of the list); the gate shut — the gate and pass
        contract shut'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/Refusal'
            - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/Denied'
    GuardShut:
      description: the gate shut — there were keys or a domain trace exists, but there is nothing to check with (the gate-and-pass contract `shut`;
        P/06.3 N1.8); or unavailable — the row of the access check exists but is not readable (N1.5; the rule «Unreadable row»)
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/Denied'
            - $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'
    NotADomainRoute:
      description: a path with a segment . or .. (including in percent form) — not a domain route, before the gate and not passed on
        (the forwarding contract «Domain doors»)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotADomainRoute'
    PassBroke:
      description: 'pass to the process domain: a break or silence — the words of the forwarding contract «Forwarding is one function» answer
        (N1.3 pass)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    NoDomain:
      description: 'There is no view (not built) — no domain here (N1.2a, N1.2b, N1.2c); at GET /domain/members — also when the row
        domain/member-rows/<part> does not exist (N1.2b); the view exists but is not readable — 503 unavailable (ReadUnavailable; V7 item 3, P1)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoDomainBody'
    ViewNotFound:
      description: 'In the order of N1.2a: there is no such manifest; not in the directory — the manifest has no domain.ref; rows are not its own; no domain
        here; no such member — the member is not in the list; a path with . or .. — not a domain route'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    NoPlacement:
      description: There is no record; there is no manifest or it is without domain.ref (N1.2d); a path with . or .. — not a domain route
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
    AlarmsWindow:
      description: 'since or until not by the grammar of the reader time (the gate-and-pass contract «Numeric query parameters»), a repeated parameter or since > until (N1.8 door);
        the common refusal of request parsing — P/06.5 N2'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/AlarmsRefused'
            - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/ConsoleRefusal'
    PassUnavailableOrShut:
      description: 'door.pass: no worker at the domain of this subsystem is heard — {error: unavailable, detail: «no worker of <sub>
        with a door is heard»} (N1.6 absent; the gate-and-pass contract `codes`); the gate shut or unavailable — the row
        of the access check exists but is not readable (N1.5; the rule «Unreadable row», form Unavailable); an answer of the worker with the code
        503 — as received'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/ConsoleRefusal'
            - $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'
  schemas:
    Refusal:
      type: object
      required:
      - error
      additionalProperties: false
      description: 'Refusal of the own doors of the domain console (N4): error — a word of the closed list data/refusal-words.tsv (ADR-0094 B5), detail — an explanation.
        There is no field field: the own doors read, they have no body.'
      properties:
        error:
          type: string
          enum:
          - no domain here
          - not a domain route
          - not in the directory
          - no such member
          - no such path
          - refused
          - unavailable
          - denied
          - did not answer
          - answer too large
          - answer broke off
        detail:
          type: string
    RoleRefusal:
      type: object
      required:
      - error
      additionalProperties: false
      description: 'Refusal of the TLS role door before the gate (N1.4 server.role; the words of the contract peer); only at the TLS door (the kit
        exists), 401 no_role — the client did not present a leaf; without the kit (no_kit) the door is on the loopback over HTTP without the role check —
        there are no such refusals, X-Operator: console is removed (C10-ROLE-NOKIT-01)'
      properties:
        error:
          enum:
          - no_role
          - wrong_role
          - bad_chain
        detail:
          type: string
    GateOrRole401:
      oneOf:
      - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/Denied'
      - unevaluatedProperties: false
        allOf:
        - $ref: '#/components/schemas/RoleRefusal'
        - properties:
            error:
              const: no_role
    AdminOnly:
      description: 'Transition 3: a door only for the domain administrator, P/08.4 N1.3c denies, the words of data/refusal-words.tsv; the answer of the process domain as it came.'
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: {const: admin only}
        detail: {type: string}
        field: {type: string, description: 'For a batch — /writes/<i> (refusal-words.tsv).'}
    GateOrRole403:
      oneOf:
      - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/Denied'
      - $ref: '#/components/schemas/RoleRefusal'
    NotADomainRoute:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/Refusal'
      - properties:
          error:
            const: not a domain route
    NoDomainBody:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/Refusal'
      - properties:
          error:
            const: no domain here
    AlarmsRefused:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/Refusal'
      - properties:
          error:
            const: refused
          detail:
            const: since and until are times, in seconds
    PlacementList:
      type: object
      required:
      - rev
      - records
      additionalProperties: false
      properties:
        rev:
          type: integer
          minimum: 0
        records:
          type: object
          additionalProperties:
            $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/Placement'
          description: 'The key — "<sub>/<ref>".'
    GrantsView:
      type: object
      required:
      - grants
      - versions
      additionalProperties: false
      properties:
        versions:
          type: object
          description: 'The row version of each cluster from grants (N1.2 «Версия строки»; P/08.0 N1.9): the index and revision stand with the row, the values are fit for If-Match.'
          additionalProperties:
            type: object
            required:
            - revision
            - index
            additionalProperties: false
            properties:
              revision:
                type: integer
                minimum: 0
              index:
                type: string
                minLength: 1
        grants:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/Line'
    SharedView:
      type: object
      required:
      - doc
      - delivery
      - declared
      additionalProperties: false
      properties:
        doc:
          oneOf:
          - type: 'null'
          - $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/SharedDoc'
        delivery:
          description: 'view.shared as it is; the schema — the form that the process domain writes (P/08.9 N1.6); the console does not judge
            the form (N1.2f, C10-SHARED-OPAQUE-COPY-01)'
          $ref: '../../08-domain/spec/08-domain.api.openapi.yaml#/components/schemas/Delivery'
        declared:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required:
              - name
              - type
              additionalProperties: false
              properties:
                name:
                  type: string
                type:
                  type: string
                schema:
                  type: object
                  additionalProperties: true
                  description: JSON Schema of the document from the manifest (P/02.1 N1.2b) as declared.
    AlarmsView:
      type: object
      required:
      - since
      - until
      - events
      - members
      - complete
      - sentence
      additionalProperties: false
      properties:
        since:
          type: number
        until:
          type: number
        events:
          type: array
          items:
            type: object
            required:
            - t
            - kind
            - class
            - member
            additionalProperties: true
            description: A row of the index P/05 N1.3 of the class alarm plus member, t_src, from_history; a silence row — N1.8 silence_line.
              The fields of an event row are set by the subsystems.
        members:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MemberAlarms'
        complete:
          type: boolean
        sentence:
          type: string
    MemberAlarms:
      type: object
      required:
      - state
      additionalProperties: false
      properties:
        state:
          enum:
          - ok
          - silent
          - not_reporting
          - never
          - unreadable
        truncated:
          const: true
        known_until:
          type: number
        silent_since:
          type: number
        alive_at:
          type: number
        alive_via:
          type: string
        history_cut_before:
          type: number
    ManifestNoRoot:
      type: object
      required:
      - name
      - rows
      additionalProperties: false
      properties:
        name:
          const: ''
        rows:
          type: 'null'
    MountsNoRoot:
      type: object
      required:
      - root
      - mounts
      additionalProperties: false
      properties:
        root:
          const: ''
        mounts:
          type: object
          additionalProperties:
            $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/ManifestView'
          description: The description of a subsystem P/06.5 N2 /mounts; the form — ManifestView of the contract P/06.
    GateDenied:
      $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Denied'
    ConsoleRefusal:
      $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/ConsoleRefusal'
    DomainPassRefusal:
      description: 'Existing door.pass forms: ordinary console refusal, unavailable, or the manifest-mapped refusal of the second kind; the source is the gate-and-pass contract.'
      anyOf:
      - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/ConsoleRefusal'
      - $ref: '../../common/contracts/gate-and-pass.api.openapi.yaml#/components/schemas/Unavailable'
      - $ref: '../../06-console/spec/06-console.api.openapi.yaml#/components/schemas/ProblemRefusal'
