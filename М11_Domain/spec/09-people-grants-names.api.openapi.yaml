openapi: 3.1.0
info:
  title: M11/9 people, grants, names
  version: '1'
  description: 'Normative shapes: 09-people-grants-names.norms.md N1.1-N1.10, N2, N4. /api/login is the holder''s domain
    process door; /domain/users, /domain/break-glass and /domain/revoke are passed by the domain console to that process
    (N1.9); /domain/grants is the domain console''s own; /domain/keys is a cluster console''s; /session/break-glass is the M10/9 contract (its order and words: N1.6).
    A cluster console hands the /domain/* doors on by the forwarding table of lesson 8. Request parsing: M10/9 N2.
    Двери процесса `domain` (`/api/login`, `/domain/users`, `/domain/users/{name}`, `/domain/grants/{cluster}`,
    `/domain/break-glass`, `/domain/break-glass/{cluster}`, `/domain/revoke`) перенесены в OpenAPI урока P/08
    (`Platform/08-domain/spec/08-domain.api.openapi.yaml`; перенос урока 8, стадия B).'
servers:
  - url: '{origin}'
    description: Процесс domain держателя, консоль домена или консоль кластера — по двери.
    variables:
      origin: {default: 'http://localhost', description: 'Origin без завершающего /; пример адреса, не настройка.'}
paths:
  /domain/grants:
    get:
      summary: Строки грантов (Н1.3)
      responses:
        '200':
          description: Строки по кластерам и domain
          content:
            application/json:
              schema:
                type: object
                required: [grants]
                additionalProperties: false
                properties:
                  grants:
                    type: object
                    additionalProperties:
                      type: array
                      items: {$ref: '#/components/schemas/Line'}
        '400': {$ref: '#/components/responses/Forwarded'}
        '401': {$ref: '#/components/responses/Refused'}
        '403': {$ref: '#/components/responses/Refused'}
        '404': {$ref: '#/components/responses/Forwarded'}
        '502': {$ref: '#/components/responses/Forwarded'}
        '503': {$ref: '#/components/responses/Forwarded'}
    head:
      summary: 'HEAD: тот же код и заголовки, что у GET, без тела (P/06.5 Н2)'
      responses:
        '200':
          description: как у GET, без тела
        '400':
          description: как у GET, без тела
        '401':
          description: как у GET, без тела
        '403':
          description: как у GET, без тела
        '404':
          description: как у GET, без тела
        '502':
          description: как у GET, без тела
        '503':
          description: как у GET, без тела
  /domain/keys:
    get:
      summary: Строки и семьи ключей домена в хранилище этого кластера (Н1.8)
      responses:
        '200':
          description: Имена полей без значений; открытый набор
          content:
            application/json:
              schema:
                type: object
                required: [rows, families, keyset]
                additionalProperties: false
                properties:
                  rows:
                    type: object
                    additionalProperties:
                      type: array
                      items: {type: string}
                  families:
                    type: object
                    additionalProperties:
                      type: array
                      items: {type: string}
                  keyset:
                    type: ['string', 'null']
                    description: doc строки domain/keys как есть.
        '401': {$ref: '#/components/responses/Refused'}
        '403': {$ref: '#/components/responses/Refused'}
    head:
      summary: 'HEAD: тот же код и заголовки, что у GET, без тела (P/06.5 Н2)'
      responses:
        '200':
          description: как у GET, без тела
        '401':
          description: как у GET, без тела
        '403':
          description: как у GET, без тела
components:
  responses:
    Forwarded:
      description: 'Отказ перехода 1 (пересылка консоли кластера) или 2 (передача консолью домена процессу), а не этой двери: коды и слова — Platform/common/contracts/forwarding.md «Отказы по переходам», слова перехода 1 — OpenAPI урока 8 (Refusal); здесь не перечисляются (разбор ревью стадии A 8–10, решение 3). 503 frozen (урок 10 Н1.7) и standby (урок 12 Н1.7) — коды процесса domain (переход 3). Добавлено прогоном 41'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Refusal'}
    Refused:
      description: Отказ (Н4)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Refusal'}
  schemas:
    Refusal:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: {type: string, minLength: 1, description: Слово Н4.}
        detail: {type: string}
        holder: {type: object, additionalProperties: true, description: 'у 409 deposed — документ записи срока нового держателя как объект (урок 10 Н1.6, форма — HolderRecord контракта урока 10; добавлено М11/10)'}
    PersonName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[^\s\x00-\x1f\x7f:|()"/]+$'
      description: Не break-glass и не субъект индекса имён (Н1.1).
    Cap:
      enum: [view, edit, admin]
    Scope:
      type: string
      pattern: '^(\*|unit:[a-z][a-z0-9_-]{0,31}/.+|labels:[^,]+(,[^,]+)*)$'
    Line:
      type: object
      required: [subject, cap, scope, until, by]
      additionalProperties: false
      properties:
        subject: {$ref: '#/components/schemas/PersonName'}
        cap: {$ref: '#/components/schemas/Cap'}
        scope: {$ref: '#/components/schemas/Scope'}
        until: {type: number, minimum: 0}
        by: {type: string}
    MayInput:
      type: object
      description: Вход функции may (Н1.4; Platform/common/contracts/may.md).
      required: [grants, as_of, disabled, user, glass, cap, unit, now]
      additionalProperties: false
      properties:
        grants:
          unevaluatedProperties: false
          oneOf:
            - type: 'null'
            - type: object
              required: [lines]
              additionalProperties: false
              properties:
                lines:
                  type: array
                  items: {$ref: '#/components/schemas/Line'}
        as_of: {type: ['number', 'null']}
        disabled:
          type: array
          items: {type: string}
        user: {type: string}
        glass: {type: boolean}
        cap: {$ref: '#/components/schemas/Cap'}
        unit:
          oneOf:
            - type: 'null'
            - const: '*'
            - $ref: '#/components/schemas/MayUnit'
        now: {type: number}
    MayUnit:
      type: object
      required: [sub, id, labels]
      additionalProperties: false
      properties:
        sub: {type: string}
        id: {type: string}
        labels:
          type: array
          items: {type: string}
        about:
          type: object
          required: [sub, id, labels]
          additionalProperties: false
          properties:
            sub: {type: string}
            id: {type: string}
            labels:
              type: array
              items: {type: string}
    MayOutput:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result: {enum: [allow, deny]}
        reason: {enum: [disabled, stale, no_grant]}
      description: reason — только при deny (Н1.4; Platform/common/contracts/may.md)
      if: {properties: {result: {const: allow}}}
      then: {not: {required: [reason]}}
      else: {required: [reason]}
