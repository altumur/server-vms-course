openapi: 3.1.0
info:
  title: M11/6 assignment and kept edits
  version: '1'
  description: 'Normative shapes: 06-assignment.norms.md N1.1-N1.6, N2. Doors of the domain console; a member console
    forwards them (M11/8). Request parsing: M10/1 N2.1 with M10/9 N2; grants: M11/9 (admin to change, view to read).
    Двери процесса `domain` (`PUT, DELETE /domain/placement/{sub}/{ref}`, `/domain/{sub}/{rows}`,
    `/domain/{sub}/{rows}/{ref}`) перенесены в OpenAPI урока P/08
    (`Platform/08-domain/spec/08-domain.api.openapi.yaml`; перенос урока 8, стадия B).'
servers:
  - url: '{origin}'
    description: Консоль домена или консоль члена, которая пересылает двери.
    variables:
      origin: {default: 'http://localhost', description: 'Origin без завершающего /; пример адреса, не настройка.'}
paths:
  /domain/placement:
    get:
      summary: Все назначения
      responses:
        '200':
          description: Счётчик и записи
          content:
            application/json:
              schema:
                type: object
                required: [rev, records]
                additionalProperties: false
                properties:
                  rev: {type: integer, minimum: 0}
                  records:
                    type: object
                    additionalProperties: {$ref: '#/components/schemas/Placement'}
        '400': {$ref: '#/components/responses/Forwarded'}
        '401': {$ref: '#/components/responses/Refused'}
        '403': {$ref: '#/components/responses/Refused'}
        '404': {$ref: '#/components/responses/Forwarded'}
        '502': {$ref: '#/components/responses/Forwarded'}
        '503': {$ref: '#/components/responses/Forwarded'}
    head:
      summary: 'HEAD: тот же код и заголовки, что у GET, без тела (P/06.5 Н2)'
      responses:
        '200':
          description: как у GET, без тела
        '400':
          description: как у GET, без тела
        '401':
          description: как у GET, без тела
        '403':
          description: как у GET, без тела
        '404':
          description: как у GET, без тела
        '502':
          description: как у GET, без тела
        '503':
          description: как у GET, без тела
  /domain/placement/{sub}/{ref}:
    parameters:
      - {$ref: '#/components/parameters/Sub'}
      - {$ref: '#/components/parameters/Ref'}
    get:
      summary: Одно назначение
      responses:
        '200':
          description: Запись
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Placement'}
        '400': {$ref: '#/components/responses/Forwarded'}
        '401': {$ref: '#/components/responses/Refused'}
        '403': {$ref: '#/components/responses/Refused'}
        '404': {$ref: '#/components/responses/Refused'}
        '502': {$ref: '#/components/responses/Forwarded'}
        '503': {$ref: '#/components/responses/Forwarded'}
    head:
      summary: 'HEAD: тот же код и заголовки, что у GET, без тела (P/06.5 Н2)'
      responses:
        '200':
          description: как у GET, без тела
        '400':
          description: как у GET, без тела
        '401':
          description: как у GET, без тела
        '403':
          description: как у GET, без тела
        '404':
          description: как у GET, без тела
        '502':
          description: как у GET, без тела
        '503':
          description: как у GET, без тела
components:
  parameters:
    Sub:
      name: sub
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$'}
    Ref:
      name: ref
      in: path
      required: true
      schema: {type: string, minLength: 1}
  responses:
    Forwarded:
      description: 'Отказ перехода 1 (пересылка консоли кластера) или 2 (передача консолью домена процессу), а не этой двери: коды и слова — Platform/common/contracts/forwarding.md «Отказы по переходам», слова перехода 1 — OpenAPI урока 8 (Refusal); здесь не перечисляются (разбор ревью стадии A 8–10, решение 3). 503 frozen (урок 10 Н1.7) и standby (урок 12 Н1.7) — коды процесса domain (переход 3). Добавлено прогоном 41'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Refusal'}
    Refused:
      description: Отказ двери (Н2, Н4)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Refusal'}
  schemas:
    Refusal:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: {type: string, minLength: 1}
        detail: {type: string}
        holder: {type: object, additionalProperties: true, description: 'у 409 deposed — документ записи срока нового держателя как объект (урок 10 Н1.6, форма — HolderRecord контракта урока 10; добавлено М11/10)'}
    MemberName:
      type: string
      pattern: '^[a-z0-9-]{1,64}$'
    Placement:
      type: object
      required: [cluster, origin, copies, reason, at, rev]
      additionalProperties: false
      properties:
        cluster: {$ref: '#/components/schemas/MemberName'}
        origin: {type: string, description: '"" — нет'}
        copies:
          type: array
          items: {$ref: '#/components/schemas/MemberName'}
        reason: {type: string}
        at: {type: number}
        rev: {type: integer, minimum: 1}
    Outcome:
      type: object
      description: Исход правки (Н1.5); в виде домена — outcomes.
      required: [id, status, result, at, what, kept_at]
      additionalProperties: false
      properties:
        id: {type: string, pattern: '^e-[0-9a-f]{12}$'}
        status: {type: integer}
        result: {enum: [performed, conflict, refused]}
        error: {type: string}
        at: {type: number}
        what: {type: string}
        kept_at: {type: number}
