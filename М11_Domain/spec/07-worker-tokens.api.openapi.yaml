openapi: 3.1.0
info:
  title: M11/7 worker tokens through the agent
  version: '1'
  description: 'Normative shapes: 07-worker-tokens.norms.md N1.2-N1.4, N2. /tokens/{sub}/{kind} is the member agent''s
    local door (the role is the identity of the connection, never the body; transport, address and refusals —
    Platform/common/contracts/local-token-door.md: Unix socket <AGENT_TOKEN_DIR>/<role>.sock); /api/tokens/... is the
    holder''s domain process door, signed by the agent (M11/3 N1.4). Request parsing: M10/1 N2.1.
    Двери процесса `domain` (`/api/tokens/{member}/{sub}/{kind}`) перенесены в OpenAPI урока P/08
    (`Platform/08-domain/spec/08-domain.api.openapi.yaml`; перенос урока 8, стадия B).'
servers:
  - url: '{origin}'
    description: Местная дверь агента или дверь процесса domain держателя.
    variables:
      origin: {default: 'http://localhost', description: 'Origin без завершающего /; пример адреса, не настройка.'}
paths:
  /tokens/{sub}/{kind}:
    parameters:
      - {$ref: '#/components/parameters/Sub'}
      - {$ref: '#/components/parameters/Kind'}
    post:
      summary: Воркер просит токен у агента своего кластера
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LocalAsk'}
      responses:
        '200':
          description: Токен этому соединению
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Given'}
        '400': {$ref: '#/components/responses/Refused'}
        '401': {$ref: '#/components/responses/Refused'}
        '403': {$ref: '#/components/responses/Refused'}
        '404': {$ref: '#/components/responses/Refused'}
        '409': {$ref: '#/components/responses/Refused'}
        '413': {$ref: '#/components/responses/Refused'}
        '502': {$ref: '#/components/responses/InvalidReply'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  parameters:
    Sub:
      name: sub
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$'}
    Kind:
      name: kind
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$'}
  responses:
    Unavailable:
      description: 'У агента: держатель не ответил за TOKEN_WAIT (Н1.2)'
      content:
        application/json:
          schema:
            type: object
            required: [error]
            additionalProperties: false
            properties:
              error: {const: unavailable}
              detail: {type: string}
    InvalidReply:
      description: 'У агента: m1 не открылся, не тот request_id или exp ≤ now (Н1.3)'
      content:
        application/json:
          schema:
            type: object
            required: [error]
            additionalProperties: false
            properties:
              error: {const: invalid token reply}
              detail: {type: string}
    Refused:
      description: Отказ (Н4); у выдачи — reason из закрытого списка
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Refusal'}
  schemas:
    Refusal:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: {type: string, minLength: 1}
        reason:
          description: 'слова Н3 «выдать»; у 401 — слова подписи урока 3 Н4 (no_signature, not_a_signature, out_of_window, bad_signature; добавлено прогоном 41)'
          enum: [bad_request, by_misplaced, not_granted, assignment_unreadable, no_assignment, outside_scope,
                 unit_not_unique, not_poll_home, trigger_not_reported, no_shared_doc, no_item, no_home, no_audience,
                 no_centre, no_signature, not_a_signature, out_of_window, bad_signature]
        detail: {type: string}
        holder: {type: object, additionalProperties: true, description: 'у 409 deposed — документ записи срока нового держателя как объект (урок 10 Н1.6, форма — HolderRecord контракта урока 10; добавлено М11/10)'}
    RequestId:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,64}$'
    LocalAsk:
      type: object
      required: [request_id, ref]
      additionalProperties: false
      properties:
        request_id: {$ref: '#/components/schemas/RequestId'}
        ref: {type: string, minLength: 1}
        by: {type: string, minLength: 1}
    Given:
      type: object
      required: [request_id, token, exp]
      additionalProperties: false
      properties:
        request_id: {$ref: '#/components/schemas/RequestId'}
        token: {type: string, minLength: 1}
        exp: {type: number}
