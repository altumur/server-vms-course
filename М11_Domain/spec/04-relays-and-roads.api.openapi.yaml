openapi: 3.1.0
info:
  title: M11/4 relays, roads and the topology
  version: '1'
  description: 'Normative shapes: 04-relays-and-roads.norms.md N1.2, N1.4, N2. /api/relay — door of the holder''s domain
    process; /api/member and /api/carry on a relay — the same forms as the holder''s (M11/3 contract), answered from the
    relay''s memory with domain_age, codes — N2 of this lesson; /domain/topology — the domain console (grants M11/9). Request parsing: M10/1 N2.1
    with M10/9 N2. Publication, Carry and the agent signature — OpenAPI of P/08 (/api/member, /api/carry).
    Двери процесса `domain` (`/api/relay/{relay}`, `PUT /domain/topology`) перенесены в OpenAPI урока P/08
    (`Platform/08-domain/spec/08-domain.api.openapi.yaml`; перенос урока 8, стадия B).'
servers:
  - url: '{origin}'
    description: Дверь процесса domain держателя, дверь ретранслятора или консоль домена.
    variables:
      origin: {default: 'http://localhost', description: 'Origin без завершающего /; пример адреса, не настройка.'}
paths:
  /domain/topology:
    get:
      summary: Топология домена
      responses:
        '200':
          description: Документ топологии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topology'
        '400': {$ref: '#/components/responses/Forwarded'}
        '401':
          $ref: '#/components/responses/Refused'
        '403':
          $ref: '#/components/responses/Refused'
        '404':
          $ref: '#/components/responses/Refused'
        '502': {$ref: '#/components/responses/Forwarded'}
        '503': {$ref: '#/components/responses/Forwarded'}
    head:
      summary: 'HEAD: тот же код и заголовки, что у GET, без тела (P/06.5 Н2)'
      responses:
        '200':
          description: как у GET, без тела
        '400':
          description: как у GET, без тела
        '401':
          description: как у GET, без тела
        '403':
          description: как у GET, без тела
        '404':
          description: как у GET, без тела
        '502':
          description: как у GET, без тела
        '503':
          description: как у GET, без тела
components:
  responses:
    Forwarded:
      description: 'Отказ перехода 1 (пересылка консоли кластера) или 2 (передача консолью домена процессу), а не этой двери: коды и слова — Platform/common/contracts/forwarding.md «Отказы по переходам», слова перехода 1 — OpenAPI урока 8 (Refusal); здесь не перечисляются (разбор ревью стадии A 8–10, решение 3). 503 frozen (урок 10 Н1.7) и standby (урок 12 Н1.7) — коды процесса domain (переход 3). Добавлено прогоном 41'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Refusal'}
    Refused:
      description: Отказ двери (Н2, Н4)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
  schemas:
    Refusal:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: {type: string, minLength: 1}
        detail: {type: string}
        reason: {type: string}
        holder: {type: object, additionalProperties: true, description: 'у 409 deposed — документ записи срока нового держателя как объект (урок 10 Н1.6, форма — HolderRecord контракта урока 10; добавлено М11/10)'}
    MemberName:
      type: string
      pattern: '^[a-z0-9-]{1,64}$'
    Topology:
      type: object
      required: [rev, star, via]
      additionalProperties: false
      properties:
        rev: {type: integer, minimum: 0}
        centre: {$ref: '#/components/schemas/MemberName'}
        star:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/MemberName'}
        via:
          type: object
          propertyNames: {$ref: '#/components/schemas/MemberName'}
          additionalProperties: {$ref: '#/components/schemas/MemberName'}
        by: {type: string}
        at: {type: number}
