openapi: 3.1.0
info:
  title: M11/3 agent reports, the holder's answer and members
  version: '1'
  description: 'Normative shapes: 03-agent-and-reports.norms.md N1.1-N1.7, N2. /domain/members — doors of the domain
    console (people: grants M11/9). Request parsing: M10/1 N2.1 with M10/9 N2. Mark and Generation are objects of the
    holder (M10/8 N1.1), not routes.
    Двери процесса `domain` (`/api/member/{member}`, `/api/carry/{member}`, `POST /domain/members`,
    `/domain/members/{name}`) перенесены в OpenAPI урока P/08 (`Platform/08-domain/spec/08-domain.api.openapi.yaml`;
    перенос урока 8, стадия B).'
servers:
  - url: '{origin}'
    description: Консоль домена (/domain/*).
    variables:
      origin: {default: 'http://localhost', description: 'Origin без завершающего /; пример адреса, не настройка.'}
paths:
  /domain/members:
    get:
      summary: Список членов и стучащиеся
      responses:
        '200':
          description: Список и стучащиеся
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersView'
        '400': {$ref: '#/components/responses/Forwarded'}
        '401':
          $ref: '#/components/responses/Refused'
        '403':
          $ref: '#/components/responses/Refused'
        '404':
          $ref: '#/components/responses/Refused'
        '502': {$ref: '#/components/responses/Forwarded'}
        '503': {$ref: '#/components/responses/Forwarded'}
    head:
      summary: 'HEAD: тот же код и заголовки, что у GET, без тела (P/06.5 Н2)'
      responses:
        '200':
          description: как у GET, без тела
        '400':
          description: как у GET, без тела
        '401':
          description: как у GET, без тела
        '403':
          description: как у GET, без тела
        '404':
          description: как у GET, без тела
        '502':
          description: как у GET, без тела
        '503':
          description: как у GET, без тела
components:
  responses:
    Forwarded:
      description: 'Отказ перехода 1 (пересылка консоли кластера) или 2 (передача консолью домена процессу), а не этой двери: коды и слова — Platform/common/contracts/forwarding.md «Отказы по переходам», слова перехода 1 — OpenAPI урока 8 (Refusal); здесь не перечисляются (разбор ревью стадии A 8–10, решение 3). 503 frozen (урок 10 Н1.7) и standby (урок 12 Н1.7) — коды процесса domain (переход 3). Добавлено прогоном 41'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Refusal'}
    Refused:
      description: Отказ двери (Н4)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
  schemas:
    Refusal:
      type: object
      required: [error, detail]
      description: 'Н4: detail есть у каждого отказа; error — refused, кроме слов поздних уроков (deposed, whole too large, standby) и общих слов вида (no domain here); добавлено сверкой М11'
      additionalProperties: false
      properties:
        error: {type: string, minLength: 1}
        detail: {type: string}
        reason: {type: string}
        holder: {type: object, additionalProperties: true, description: 'у 409 deposed — документ записи срока нового держателя как объект (урок 10 Н1.6, форма — HolderRecord контракта урока 10; добавлено М11/10)'}
    MemberName:
      type: string
      pattern: '^[a-z0-9-]{1,64}$'
    Hex32:
      type: string
      pattern: '^[0-9a-f]{64}$'
    Generation:
      type: object
      description: Объект domain/members/<член>/reports/<rev> (Н1.3), JCS.
      required: [sent_at, objects, key]
      additionalProperties: false
      properties:
        sent_at: {type: number}
        objects:
          type: object
          additionalProperties: true
          description: Открыт намеренно — объекты публикации по member_objects (Н1.2).
        key: {$ref: '#/components/schemas/Hex32'}
        keys_rev: {type: integer, minimum: 1}
        pinned: {type: string, pattern: '^[0-9a-f]{16}$'}
        outcomes:
          type: object
          description: 'Урок 6 Н1.5: исходы правок домена из публикации — часть целого поколения.'
          additionalProperties: {$ref: '#/components/schemas/Outcome'}
    Mark:
      type: object
      description: 'Объект domain/members/<член>/reported (Н1.3): поля поколения (rev, sha256, base, delta_sha256, signature, key, keys_rev, pinned) и поля последнего принятого запроса (sent_at, received_at, request_sha256, via, stale, sign_failures — решение «Архитектора» по сверке М11, A7/W1).'
      required: [rev, sha256, base, delta_sha256, sent_at, received_at, request_sha256, key, stale]
      additionalProperties: false
      properties:
        rev: {type: integer, minimum: 1}
        sha256: {$ref: '#/components/schemas/Hex32'}
        base: {type: integer, minimum: 0}
        delta_sha256: {$ref: '#/components/schemas/Hex32'}
        signature: {type: string}
        sent_at: {type: number}
        received_at: {type: number}
        request_sha256: {$ref: '#/components/schemas/Hex32'}
        via: {type: string, description: урок 4}
        key: {$ref: '#/components/schemas/Hex32'}
        keys_rev: {type: integer, minimum: 1}
        pinned: {type: string, pattern: '^[0-9a-f]{16}$'}
        stale:
          type: array
          items: {type: string}
        sign_failures:
          type: object
          minProperties: 1
          additionalProperties: false
          description: 'Поле последнего принятого запроса — из публикации (урок 12 Н1.6); поколения не создаёт.'
          properties:
            domain: {type: integer, minimum: 1}
            console: {type: integer, minimum: 1}
    Outcome:
      type: object
      required: [id, status, result, at, what, kept_at]
      additionalProperties: false
      description: Урок 6 Н1.5.
      properties:
        id: {type: string, pattern: '^e-[0-9a-f]{12}$'}
        status: {type: integer}
        result: {enum: [performed, conflict, refused]}
        error: {type: string}
        at: {type: number}
        what: {type: string}
        kept_at: {type: number}
    Entry:
      type: object
      required: [how, since]
      additionalProperties: false
      properties:
        how: {type: string, minLength: 1}
        since: {type: number}
        by: {type: string}
        key: {$ref: '#/components/schemas/Hex32'}
        revoked_keys:
          type: array
          items: {$ref: '#/components/schemas/Hex32'}
        ca:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: 'Урок 8 Н1.6: отпечатки центра члена по возрастанию.'
          items: {type: string, pattern: '^[0-9a-f]{64}$'}
    MembersDoc:
      type: object
      required: [rev, members]
      properties:
        rev: {type: integer, minimum: 1}
        members:
          type: object
          propertyNames: {$ref: '#/components/schemas/MemberName'}
          additionalProperties: {$ref: '#/components/schemas/Entry'}
    Knock:
      type: object
      required: [name, last, times, key, fingerprint, pinned, keys_rev]
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/MemberName'}
        last: {type: number}
        times: {type: integer, minimum: 1}
        key: {$ref: '#/components/schemas/Hex32'}
        fingerprint: {type: string, pattern: '^[0-9a-f]{16}$'}
        pinned: {enum: [this, another, none]}
        keys_rev: {type: ['integer', 'null'], minimum: 1}
    MembersView:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/MembersDoc'
        - type: object
          required: [knocking]
          properties:
            knocking:
              type: array
              items: {$ref: '#/components/schemas/Knock'}
