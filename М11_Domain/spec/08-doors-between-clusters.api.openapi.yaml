openapi: 3.1.0
info:
  title: M11/8 doors between clusters
  version: '1'
  description: 'Normative shapes: 08-doors-between-clusters.norms.md N1.2-N1.9, N2, N4. A cluster console hands the
    method-path pairs of the forwarding table (N1.2) to the domain console unchanged and returns the answer as it came
    (status, Content-Type, X-Unreachable, body); those doors belong to their lessons (1, 3, 4, 6, 9, 10, 11), and each
    of those contracts carries the forwarding refusals (response Forwarded: 400 one hop, 404, 413, 502, 503). Any other path under /domain/ is 404 "not a domain route". This contract holds the doors of this lesson:
    a member''s where by its name, the admin''s CA door, the holder''s page doors and the refusals of forwarding.
    Request parsing: M10/9 N2.'
servers:
  - url: '{origin}'
    description: Консоль кластера (/domain/at, пересылка) или консоль домена держателя (ca, страница).
    variables:
      origin: {default: 'http://localhost', description: 'Origin без завершающего /; пример адреса, не настройка.'}
paths:
  /domain/at/{cluster}/{sub}/where/{id}:
    parameters:
      - {$ref: '#/components/parameters/Cluster'}
      - {$ref: '#/components/parameters/Sub'}
      - name: id
        in: path
        required: true
        schema: {type: string, minLength: 1}
    get:
      summary: where единицы у консоли другого члена (Н1.5)
      responses:
        '200': {$ref: '#/components/responses/AsItCame'}
        '400': {$ref: '#/components/responses/AtBadRequest'}
        '401': {$ref: '#/components/responses/Refused'}
        '403': {$ref: '#/components/responses/Refused'}
        '404': {$ref: '#/components/responses/AtNotFound'}
        '502': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/Refused'}
    head:
      summary: 'HEAD: тот же код и заголовки, что у GET, без тела (М10/9 Н2)'
      responses:
        '200':
          description: как у GET, без тела
        '400':
          description: как у GET, без тела
        '401':
          description: как у GET, без тела
        '403':
          description: как у GET, без тела
        '404':
          description: как у GET, без тела
        '502':
          description: как у GET, без тела
        '503':
          description: как у GET, без тела
  /domain/at/{cluster}/{sub}/where/{table}/{place}:
    parameters:
      - {$ref: '#/components/parameters/Cluster'}
      - {$ref: '#/components/parameters/Sub'}
      - name: table
        in: path
        required: true
        description: places.table спеки (М10/4 Н2).
        schema: {type: string, minLength: 1}
      - name: place
        in: path
        required: true
        schema: {type: string, minLength: 1}
      - name: unit
        in: query
        required: false
        description: '<id> единицы спеки <sub> (форма М10/9 Н2 where) — передаётся как пришёл.'
        schema: {type: string}
    get:
      summary: where места у консоли другого члена (Н1.5)
      responses:
        '200': {$ref: '#/components/responses/AsItCame'}
        '400': {$ref: '#/components/responses/AtBadRequest'}
        '401': {$ref: '#/components/responses/Refused'}
        '403': {$ref: '#/components/responses/Refused'}
        '404': {$ref: '#/components/responses/AtNotFound'}
        '502': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/Refused'}
    head:
      summary: 'HEAD: тот же код и заголовки, что у GET, без тела (М10/9 Н2)'
      responses:
        '200':
          description: как у GET, без тела
        '400':
          description: как у GET, без тела
        '401':
          description: как у GET, без тела
        '403':
          description: как у GET, без тела
        '404':
          description: как у GET, без тела
        '502':
          description: как у GET, без тела
        '503':
          description: как у GET, без тела
  /domain/members/{member}/ca:
    parameters:
      - name: member
        in: path
        required: true
        schema: {$ref: '#/components/schemas/MemberName'}
    post:
      summary: Администратор заменяет отпечатки центра члена (Н1.6 admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ca]
              additionalProperties: false
              properties:
                ca:
                  type: array
                  maxItems: 2
                  uniqueItems: true
                  description: '[] — снять отпечатки и строку ca-certs.'
                  items: {$ref: '#/components/schemas/Fingerprint'}
                ca_certs:
                  type: array
                  maxItems: 2
                  description: 'Н1.6 admin: PEM сертификатов центров в порядке ca, sha256(DER) — отпечаток на том же месте; пишутся в domain/members/<член>/ca-certs до Entry.ca.'
                  items: {type: string, minLength: 1}
      responses:
        '200':
          description: Список членов после записи по CAS (урок 3 Н2)
          content:
            application/json:
              schema:
                type: object
                required: [rev, members]
                additionalProperties: false
                properties:
                  rev: {type: integer, minimum: 1}
                  members:
                    type: object
                    propertyNames: {$ref: '#/components/schemas/MemberName'}
                    additionalProperties:
                      type: object
                      additionalProperties: true
                      description: Entry урока 3 Н1.1 с полем ca (Н1.6); форма и закрытость — Entry контракта урока 3.
        '400': {$ref: '#/components/responses/Refused'}
        '401': {$ref: '#/components/responses/Refused'}
        '403': {$ref: '#/components/responses/Refused'}
        '404': {$ref: '#/components/responses/Refused'}
        '409': {$ref: '#/components/responses/Refused'}
        '413': {$ref: '#/components/responses/Refused'}
        '502': {$ref: '#/components/responses/Refused'}
        '503': {$ref: '#/components/responses/Refused'}
  /spec:
    get:
      summary: Спека консоли домена — корня нет (Н1.8)
      responses:
        '200':
          description: Консоль домена без корневой подсистемы
          content:
            application/json:
              schema:
                type: object
                required: [name, rows]
                additionalProperties: false
                properties:
                  name: {const: ''}
                  rows: {type: 'null'}
    head:
      summary: 'HEAD: тот же код и заголовки, что у GET, без тела (М10/9 Н2)'
      responses:
        '200':
          description: как у GET, без тела
  /mounts:
    get:
      summary: Подсистемы каталога держателя (Н1.8)
      responses:
        '200':
          description: Описания подсистем — как /mounts консоли кластера (М10/9 Н2), без media
          content:
            application/json:
              schema:
                type: object
                required: [root, mounts]
                additionalProperties: false
                properties:
                  root: {const: ''}
                  mounts:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties: true
                      description: Описание подсистемы М10/9 Н2 /mounts; форма и закрытость — контракт урока М10/9.
    head:
      summary: 'HEAD: тот же код и заголовки, что у GET, без тела (М10/9 Н2)'
      responses:
        '200':
          description: как у GET, без тела
components:
  parameters:
    Cluster:
      name: cluster
      in: path
      required: true
      schema: {$ref: '#/components/schemas/MemberName'}
    Sub:
      name: sub
      in: path
      required: true
      schema: {type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$'}
  responses:
    AsItCame:
      description: Ответ консоли члена как пришёл — статус, Content-Type, X-Unreachable, тело (М10/4 Where или отказ его сторожевой)
    Refused:
      description: Отказ пересылки (Н4) — или ответ другой стороны как пришёл
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Refusal'}
    AtNotFound:
      description: '404 /domain/at/… — отказ пересылки (Н4) или ответ консоли члена как пришёл (Н1.5 answer): NotPlaced двери
        where М10/4 или её NoRoute (форма ConsoleRefusal М10/4 — частный случай Refusal)'
      content:
        application/json:
          schema:
            oneOf:
              - {$ref: '#/components/schemas/Refusal'}
              - {$ref: '#/components/schemas/MemberNotPlaced'}
    AtBadRequest:
      description: '400 /domain/at/… — отказ пересылки (Н4) или ответ консоли члена как пришёл (Н1.5 answer); 400 двери where
        М10/4 — BadBody формы ConsoleRefusal {error, detail}, частный случай Refusal, поэтому одна схема покрывает обе стороны
        (oneOf двух равных форм был бы неразрешим)'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Refusal'}
  schemas:
    Refusal:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          minLength: 1
          description: Слово Н4 (not a domain route, one hop, no domain here, no console known, did not answer, …).
        detail: {type: string}
        holder: {type: object, additionalProperties: true, description: 'у 409 deposed — документ записи срока нового держателя как объект (урок 10 Н1.6, форма — HolderRecord контракта урока 10; добавлено М11/10)'}
    MemberNotPlaced:
      type: object
      description: Ответ 404 двери where консоли члена как пришёл — форма NotPlaced контракта М10/4.
      required: [reason]
      additionalProperties: false
      properties:
        reason: {type: string, minLength: 1}
    MemberName:
      type: string
      pattern: '^[a-z0-9-]{1,64}$'
    Fingerprint:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: sha256 DER-сертификата центра кластера (Н1.6).
    PeerInput:
      type: object
      description: Вход команды peer (Н5).
      required: [chain, fingerprints, role, host, now]
      additionalProperties: false
      properties:
        chain:
          type: array
          items: {type: string}
          description: PEM-сертификаты сервера, лист первым.
        fingerprints:
          type: array
          items: {$ref: '#/components/schemas/Fingerprint'}
        role: {type: string, minLength: 1}
        host: {type: string, minLength: 1}
        now: {type: number}
    PeerOutput:
      type: object
      description: Вывод команды peer (Н3 «peer»).
      required: [result]
      additionalProperties: false
      properties:
        result: {enum: [ok, refused]}
        reason: {enum: [ip_address, bad_chain, foreign_ca, expired, no_role, wrong_role, wrong_name]}
