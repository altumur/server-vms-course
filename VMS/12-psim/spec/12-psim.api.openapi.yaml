openapi: 3.1.0
info:
  title: V/12 — дверь адаптера плагина psim
  version: 1.0.0
  description: |
    HTTP-контракт двери процесса воркера-адаптера подсистемы `psim-<id>` — глава V/12.3 Н1.6 урока «Плагины psim» модуля VMS.
    Канон — [нормы главы 3](12.3-psim.norms.md); этот файл их выражает и не добавляет требований. Маршруты ресурсов — имена
    `path_prefix` ресурсов `PROXY` плагина (V/12.1 Н1.5), здесь — параметр `route`; их содержание — дело плагина, дверь его
    проксирует на `location` из `RegisterResource` (V/12.3 Н1.2). Вход — токен двери консоли (`GET /psim-<id>/where/plugin`,
    договор токена двери) в `?t=` или `Authorization: Bearer`; после входа — кука сеанса страницы `psim`. `static` — без
    допуска. Разбор запроса и пределы соединений — дверь процесса P/03.4 Н1.7.
servers:
  - url: https://{server}:{port}
    description: дверь процесса адаптера с комплектом роли воркера — адрес SERVER_NAME (P/03.4 Н1.7 kit)
    variables:
      server: {default: "srv-a"}
      port: {default: "0"}
paths:
  /static/i18n.js:
    get:
      summary: Словарь страниц psim — байты psim-sdk c3d9ebb по SHA-256 (V/12.3 Н1.6)
      security: []
      responses:
        "200":
          description: байты `psim_platform_emulator/webui/i18n.js`
          content:
            application/javascript:
              schema: {type: string}
        "404": {$ref: "#/components/responses/Refusal"}
  /{route}/{rest}:
    parameters:
      - name: route
        in: path
        required: true
        description: маршрут ресурса `PROXY` плагина (V/12.1 Н1.5), не `static`
        schema: {type: string, pattern: "^(?:[a-z][a-z0-9_-]{0,31})$"}
      - name: rest
        in: path
        required: true
        description: хвост пути — уходит на `location` ресурса как есть
        schema: {type: string}
    get:
      summary: Вход по токену или запрос страницы плагина (V/12.3 Н1.6)
      security: [{doorToken: []}, {pageCookie: []}]
      parameters:
        - name: t
          in: query
          required: false
          description: токен двери консоли; с ним — вход, ответ 303 и кука сеанса
          schema: {type: string}
      responses:
        "200": {description: ответ плагина как есть}
        "303":
          description: вход принят — тот же адрес без `t`, кука сеанса страницы
          headers:
            Location: {schema: {type: string}}
            Set-Cookie:
              description: "`psim=<сеанс>; HttpOnly; Secure; SameSite=Strict; Path=/<route>/`, срок 3600 с"
              schema: {type: string}
        "401": {$ref: "#/components/responses/Refusal"}
        "403": {$ref: "#/components/responses/Refusal"}
        "502": {$ref: "#/components/responses/Refusal"}
    post:
      summary: Запрос страницы плагина к своему серверу (V/12.3 Н1.6)
      security: [{doorToken: []}, {pageCookie: []}]
      responses:
        "200": {description: ответ плагина как есть}
        "401": {$ref: "#/components/responses/Refusal"}
        "502": {$ref: "#/components/responses/Refusal"}
components:
  securitySchemes:
    doorToken:
      type: http
      scheme: bearer
      description: токен двери консоли (договор токена двери); иначе `?t=`
    pageCookie:
      type: apiKey
      in: cookie
      name: psim
      description: сеанс страницы адаптера (V/12.3 Н1.6), 128 случайных бит, 3600 с
  responses:
    Refusal:
      description: "отказ двери: объект с полем error — слово отказа"
      content:
        application/json:
          schema:
            type: object
            required: [error]
            additionalProperties: false
            properties:
              error: {type: string}
