      fields: [lat, lon, azimuth]
    - title: Титры
      fields: [camera, words, overlay_delay_ms, overlay_duration_sec]
      note: "Только у источника событий (POS): строки кассы показываются поверх видео этой камеры, в кадр они не вжигаются."
    - title: Размещение
      placement: true
      fields: [live, priority, labels, alarms]
      note: "Тревожные события — виды событий устройства, которые у этой камеры тревога. Метки решают, где может работать камера: её возьмёт воркер, чей сервер несёт все её метки. Пусто — любой сервер. Папки лежат только в дереве и на размещение не влияют."
  field_help:
