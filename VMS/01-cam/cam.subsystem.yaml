    mac: "MAC-адрес устройства: только у IP-сервера"
    camera: "id камеры, поверх видео которой идут строки POS"
    words: 'слова и их цвета: [{"msg": "ВОЗВРАТ", "color": "#fff", "bg": "#c00"}]'
    overlay_duration_sec: "0 — до следующей строки"
    source: "адрес устройства (driverpack://производитель/адрес/ch/канал)"
    labels: "сети, в которых виден адрес камеры (vlan:cctv-a)"
    cred_username: логин устройства
    cred_secret: пароль устройства
    live: "живой поток: держать всегда или не открывать (только устройство)"
  kinds:
    io.input: вход устройства
    silent: камера молчит
    text: строка кассы
    unit: событие единицы
  tree:
    folders: true                    # the tree is the cluster's folders, a camera is their member (P/06.8 Н1.1)
    group_title: По папкам
    group_hint: Папки кластера → камеры
    filter: Фильтр по имени, адресу…
    no_group: Без папки
    contents_title: Состав папки
    group_word: папка
    no_group_suffix: без папки
    pick_note: "Папки — записи кластера и на размещение не влияют; размещение решают labels камеры."
    new_root: Папка
    new_sub: Подпапка
    add_here: Добавить камеру сюда
  # The words of the key families (domain.keys), by id; `absent` — what to say when the row is missing.
  keys:
    sources:
      title: Книги источников
      about: "Откуда кластер записи берёт поток каждой камеры и почему этой дорогой. domain/cam/sources/<кластер> — книги у держателя; domain/cam/sources — книга, которую агент кластера унёс домой."

console:
  # the name of the running gauge, one of `metrics:` above (`cam_cameras_running <n>`: status entries in phase
  # `running` on live workers); `/spec` sends it as `metrics.running` so the page's status line knows which metric
  # to read. Not said: no running gauge.
  running: cameras_running             # cam_cameras_running: cameras held — streaming to whoever subscribes; recording is rec's gauge

events:
  # Which of this subsystem's events collapse when they repeat. A storm is normal, not a fault, and the
  # only place a repeat costs nothing to recognise is the worker holding the device — one line before the
  # write (М10A, урок 12).
  #
  # The first line of every window goes into the log immediately and unchanged: whatever the repeats are
  # worth, the first occurrence is the observation. What was swallowed is said when the window closes —
  # one line carrying `repeats`, `since` and `until`, so a quiet log and a suppressed storm are different
  # things on the timeline.
  #
  # `by` is left out everywhere here, which means "every field of the line": two lines collapse only when
  # they are identical. A contact that opens and then closes differs in `value` and is never one event;
  # only the same reading, repeated, is.
  suppress:
    io.input:
      window: 30                       # a contact bounces for milliseconds and a bad one for hours; thirty
                                       # seconds is long enough that a swinging gate is one line per window,
                                       # short enough that a door genuinely used twice a minute is two.
    silent:
      window: 60                       # a camera that cannot be reached posts this every pass — once every
                                       # two seconds, for as long as the network is down. The first one is
                                       # the news; the next thirty are the same news.
    source-stats:
      window: 60
      # …and this is the case `by` exists for. The counters in this line GROW — `delivered` and
      # `received` are different on every pass — so with the default identity two of them are never the
      # same thing and nothing would ever be suppressed. What actually says "the same news" here is that
      # nothing was dropped and nothing is queued: a healthy pipeline then writes one line a minute
      # instead of one every four seconds, and the moment a frame is dropped the line goes out at once,
      # unchanged and immediately, because that is a different reading.
      by: [dropped, depth]

# ================================================================================================
# NOTES — what this file is
# ================================================================================================
# The subsystem's manifest: the one file a subsystem gives the platform (P/02.1). The platform loads it, and
# its controller and its console run this subsystem from it. The header draws the line: everything the controller does
# for this subsystem is here; the worker (camworker) is the part that knows what a camera is. Nothing in the file says
# how a camera records. `live.subsystem.yaml` and `det.subsystem.yaml` are two more subsystems the same platform runs
# from a different manifest.
#
# Event and alarm retention are subsystem-wide resource settings (ADR-0076), independent of camera rows.
#
# - Key layout: `cam/cameras/<id>` (row), `cam/workers/<w>` (assignment), `cam/placement/<id>`, `cam/retention`,
#   `cam/alarms_retention`, `cam/epoch/<id>` (a worker takes by CAS), `cam/next_id`.
# - Fields the operator may never send, whatever the manifest says — the platform's fields (P/06.1): `id, revision,
#   deleted, worker, placement, epoch, phase, observed_revision, born, made, index`. Those are the controller's (placement, with a reason) or the
#   worker's (phase, epoch, observed_revision in its heartbeat).
# - Editing this file changes the controller and the console together, with no change of code.
# ================================================================================================
