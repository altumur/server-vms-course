# cam.shell.html — the VMS's page over the platform's console module (М10B, beside lesson 12)

**Role.** The page at `/` of a console whose root is `cam` (P/06: a subsystem's own page is `<sub>.shell.html`
beside its manifest, served at the console's root). It mounts the module
(`PlatformConsole.mount(#app, {lang, subsystems: [cam, rec, live]})`); rec and live are about the camera (`about`), so the module nests their units under it and the page reads
their manifests with `pc.manifest(name)`. No platform section is drawn here: no login, no tree of servers, no domain card, no
journal — the module's; the page's own tests hold it to that.

## The core: copied with a check
`whereAt`, `doorOf`, `doorFetch`, `yieldCut`, `loadTimeline`, `segmentURL`, `play`, `playNext`, `negotiateLive`,
`stopLive` are the product's (its own page on its `main`), between the two «core» lines below; a check compares each
with the product's page, and what differs is listed as a debt — only shrinking. The places a
recording may lie on are the rows of the table the rec manifest names
(`places.table`), read at `/rec/<table>` — never a table named in the page, here and in the product.

## What the page adds (all through the module's calls)
- `addIcons` — camera, volume (storage); `addDecor("unit")` — a camera's icon and its address as a tag, a stream's
  name and its camera's (a stream is a unit of cam with `main`, V/01.1 Н1.1а; the module draws it as a unit of its own);
  `addFieldEditor("unit", "source")` — the source and what it says (address, vendor, channel), sent by the form.
- `addNote("unit")` — «открытие не завершается» (the device has not opened: `device_state: opening`), «сбой
  устройства» (`phase: failed`, the holder's `why`); `addEventNote` — the VMS's events in words (volumes, cards, the
  footage), everywhere the module lists events.
- `addTab("unit")` «Видео» — the live picture (WHEP at the gateway's door), the timeline of every recording of the
  camera and every place a recording may have left footage on, the events on it, the operator's mark, «Закрепить»
  (what is only in a backup: `POST /rec/requests` for the primary recording), «Удержать показанное».
  The timeline holds the camera's recordings in the other clusters of the domain too (ADR-0061): the book of
  primaries this cluster carries names them by the camera's ref — the primary and each of its `backups` —, at a member
  and at the holder alike, their doors are asked at this console
  (`/domain/at/<cluster>/rec/where/…`), a refusal said in words (403, 404, 502, 503).
  «Видео» of a camera says the size of its window and the gateway picks the stream (`?width=&height=`), of a stream —
  the stream; the timeline is the camera's. «Видео», «Потоки» and «Архив» of a row of another `type` say it has no picture.
  «Потоки» — the camera's streams (`POST /cam/cameras {main, profile, source}`).
  «Архив» — the camera's recordings (`/rec/recordings`: create, switch, delete, home, days, `when` of a card, `replica_from`) and
  its keeps (`/rec/keeps`: make, lift; check at the incidents holder's door; the state in the recorders' own words, from
  their beat — `servers.status` of their rows at `/rec/servers` with `of: keeps`, ADR-0064: here, pushing, pushed,
  at risk, lost, garbled of the recording's writer; kept of the incidents holder; let go — the row's `released_at` —, «нет кадров,
  запечатывать нечего» for a recording with no footage in the stretch).
- Volumes (`/rec/<places table>`): `addTreeNodes("server")` (a server's own), `addTreeNodes("servers")` («Сетевые
  архивы»), `addCard("vol"|"netvols")`, `addBlock("server", {covers: "rec/volumes"})` «Архивы сервера»; declaring
  (`POST`, the row whole: what the dialog does not show is carried from the row; a smaller quota, or one a holder says
  waits — `shrink_pending` —, only with `shrink_confirmed`; `incidents` with `admits: false`) and withdrawing (`DELETE`).
- «Камеру в архив» — `addAction("server")`, `addMenu("server"|"vol")`: a recording of a camera on a volume of the
  server (`POST /rec/recordings {name, cam, stream?, home}`: the camera and the stream chosen together, the largest suggested).
- `addTreeNodes("unit")`, `addCard("child")` — a device's children under their owner: an input, an output, a microphone, a
  speaker (`/cam/children`, the holder's; `/cam/child_settings`, the operator's: name, switch, normal state).
- `addCard("dunit")` — a device's units under their row (`/cam/device_units`, the operator's): a door, a reader, a fence;
  their name, switch and operations (`POST /cam/requests {unit, action: "unit", n, operation}`).
- Titles over the video: the lines of a row `eventsrc` tied to this camera (`/events?kind=text`), live and over the archive;
  never in the frame (V/08.3 Н1.2 п. 10).
- `addSection` «Сценарии» (after units) — the auto subsystem's scenarios: the list and the editor, the actions the
  auto manifest's `then` accepts (the page's catalogue of actions, held to the manifest by a check), the last firings.
- The domain through the VMS's eyes, from the holder's `/domain` view (`units`, `tables`): `addTreeNodes("member")`
  — a member's cameras and archives (a member of one camera stands in the tree as its camera: `replaces`),
  `addCard("dc"|"da")`, `addBlock("member")`, `addBlock("domain")` «Назначения записи» (`domain/placement/rec/`).
- `addMenu("unit")` — «Смотреть видео», «Архив».
- «Учётки потоков» в разделе прав — `addTreeNodes("access")` и `addCard`: свои `/live/accounts`, пароль только
  ответом создания или смены, без хранения в состоянии страницы.
- `addSection` «Ассистент» (after the scenarios; V/11.9–V/11.12) — when the console mounts `assist` and the session sees a
  model row: the admin's text, the model's steps at its holder's door, the tools read the console through `api` and `may`
  over this page's subsystems only (ADR-0093 доп. (5)), the plan checked here and shown in the page's words, «Применить»
  writes each row by one `PUT` with `ifMatch`. The harness is data (`assist-harness`, the bytes of
  `VMS/11-backend/harness/`); the core between `assist:core` markers is pure — the lesson's vectors run it.

## Routes the page itself uses
`/rec/recordings`, `/rec/<places table>`, `/rec/keeps`, `/rec/requests`, `/rec/servers`, `/live/streams`, `/auto/scenarios`,
`/events`, `/marks`, `/live/accounts`, `/cam/cameras` (a stream), `/cam/children`, `/cam/child_settings`, `/cam/device_units`, `/cam/requests` (writes through `pc.api`), `/domain/rec/books/primaries`, `/domain/placement`
(`PUT /domain/placement/rec/<ref>`); the holders' doors from
`/rec/where/<recording>`, `/rec/where/<table>/<place>?unit=<recording>`, `/live/where/<stream>` (`/whep`, `/talk` at the gateway), and another
cluster's from `/domain/at/<cluster>/rec/where/…` (ADR-0061); at the incidents holder's door,
`POST /keeps/<keep>/verify?recording=<r>`. The assistant: `/schema`, the rows and tables of this page's subsystems
(reads; manifests and rights from the module — `manifest`, `may`), `/<sub>/manifest` only to tell «outside the scope»,
`/assist/models`, `/assist/where/<name>` and the model's door (`/chat/<name>/steps`), `PUT /<rows>/<id>` with `If-Match`
(its writes). Everything else is the module's.

.tl .tick.fenced{opacity:.4}

<script type="application/json" id="assist-harness">{"system":"# w2c console configuration assistant\n\nYou are the assistant of a w2c cluster admin. The admin writes a request; you find the units and propose\n**a plan of edits**. Reply in the language of the admin's request, briefly.\n\n## Boundaries\n- You write nothing. Your answer to the admin is **always a tool call**: a plan — `propose_plan` (the admin reviews\n  the diff and applies it), a question — `ask_admin` (the admin's answer comes back as its result), a refusal or\n  \"there are no such units\" — `refuse` with the reason. The admin does not see text without such a call.\n- You have no rights of your own: the tools work in the admin's session and see only what the admin sees.\n- Use only the tools you are given. There are no other actions.\n\n## How to work\n1. `list_subsystems` — which subsystems exist and what their units are called. The first user message is the\n   \"Cluster overview\": it already contains the subsystems, the manifests and the admin's rights, so steps 1–2 are not\n   needed.\n2. `get_manifest` of the subsystem you need — fields, types, options (enum) and their labels, fixed, secret.\n3. `find_units` with `where` conditions — find exactly the units the request is about. Do not guess names or values.\n4. `propose_plan` — `selection` and edits `{unit, field, from, to, why}`: `from` — the current value from\n   `find_units`, `to` — the new one, `why` — which field or label put the unit in the plan. In `summary` — one line\n   to the admin (including which units were left out and why, e.g. no rights). The plan is not applied yet: say\n   what it will do (\"Turns off Gate-1\"), not as done (\"Turned off Gate-1\").\n\n## selection: who is selected, who is edited\n- `edit_sub` — the subsystem **whose field the request changes**; all edits are its units. `select_sub` — the\n  subsystem where the admin gave the selection (names or a condition); the same by default. A request of the form\n  \"for the Xs of the Ys with a condition\" — selection in subsystem Y (`select_sub`), edits in subsystem X\n  (`edit_sub`).\n- Choose the field by its label (`label`) in the manifest — it must match the admin's word. The check compares each\n  edited field with the request text: a field the admin did not name is an error. `fields` (`{field: the admin's\n  word}`) — optional.\n- `propose_plan` computes the selection itself and checks it: an extra or a missing unit, the wrong subsystem, a word\n  that does not fit the field — an error with a hint.\n\n## Rules\n- Fields and values come only from the manifest. For an enum, write the option's code in `to` (not its label).\n- Do not include a unit whose field already has the wanted value.\n- Write a list (e.g. labels) in `to` in full — as it will become.\n- The request names neither a unit nor a selection condition (or does not say which value to set) — **ask first**\n  with `ask_admin`, before searching; one short question. A plan for many units only if the admin said \"all / every\"\n  or gave a condition. In `propose_plan` give `selection`: `named` — the names from the request, or `where` — the\n  condition from the request.\n- Labels, tags, floors, sides, zones are the admin's words; the data stores them as codes. Look up the codes with\n  `field_values` (for a subsystem with `about` — also `about.\u003cfield>` of the related unit) and search by them.\n- An empty search is not an answer: read `hints`, check `field_values`, the related unit and the other subsystem;\n  if there really are no such units — `refuse` with the reason.\n- An empty list (no tags, no labels): `{\"field\": \"tags\", \"op\": \"eq\", \"value\": []}`.\n- The needed field or option is not in the manifest, the field is fixed, there is no right on the unit\n  (`can_edit: false`), the action is outside the console — `refuse` with the reason; do not substitute a similar\n  field. No right on only some of the selected units — a plan for the rest, and the ones left out go in `summary`.\n- Secrets: you do not see passwords. The admin types a password in a separate field; a message tells you \"Secret N is\n  entered\". Write `{\"secret\": N}` as is in `to` of the secret field (a field whose name ends with `_secret`), and\n  nowhere else.\n- `propose_plan` answered `valid: false` — fix your mistake and propose again; if the request cannot be done —\n  `refuse`.\n- An accepted plan (`valid: true`) ends the turn: the admin sees the diff and `summary`.\n","tools":[{"name":"list_subsystems","description":"The cluster's subsystems: name (sub), what their units are called, how they relate, tables.","inputSchema":{"type":"object","properties":{}}},{"name":"get_manifest","description":"A subsystem's manifest: the unit's fields (type, required, enum options and their labels, fixed, secret), field labels and the console form. Call it before writing a plan.","inputSchema":{"type":"object","properties":{"sub":{"type":"string"}},"required":["sub"]}},{"name":"get_schema","description":"The console's /schema door: schema versions of the cluster's data and processes.","inputSchema":{"type":"object","properties":{}}},{"name":"find_units","description":"Find a subsystem's units by conditions (all conditions are AND). No conditions — all units. Returns unit \"\u003csub>/\u003cname>\", revision and fields.\nA where condition is {field, op, value}; all conditions are AND. Kinds:\neq — the field equals the value (scalar): {\"field\": \"zone\", \"op\": \"eq\", \"value\": \"z9\"}\nne — not equal: {\"field\": \"state\", \"op\": \"ne\", \"value\": \"closed\"}\nin — one of a list of values: {\"field\": \"shelf\", \"op\": \"in\", \"value\": [\"x1\", \"x2\"]}\nnot_in — none of the list\ncontains — a LIST field (labels, tags, flags) contains the element: {\"field\": \"labels\", \"op\": \"contains\", \"value\": \"blue\"}; eq on a list field with a string never matches\nnot_contains — the list field does not contain the element\ngt / gte / lt / lte — number greater / not less / less / not greater: {\"field\": \"weight\", \"op\": \"gt\", \"value\": 2}\nexists / missing — the field is set / not set, no value: {\"field\": \"feed\", \"op\": \"exists\"}\nA field of the related unit is about.\u003cfield>: {\"field\": \"about.labels\", \"op\": \"contains\", \"value\": \"blue\"}","inputSchema":{"type":"object","properties":{"sub":{"type":"string"},"where":{"type":"array","items":{"type":"object","properties":{"field":{"type":"string","description":"a field of the unit, or about.\u003cfield> of the related unit"},"op":{"type":"string","enum":["eq","ne","in","not_in","contains","not_contains","gt","gte","lt","lte","exists","missing"]},"value":{"type":["integer","number","string","boolean","array","object","null"],"description":"the value; a list for in/not_in"}},"required":["field"]}},"fields":{"type":"array","items":{"type":"string"},"description":"which fields to return (all if omitted); about.\u003cfield> — the value of that field of the related unit (e.g. its counter's step)"}},"required":["sub"]}},{"name":"field_values","description":"Which values of a field occur among a subsystem's units (labels, zones, shelves, modes) and how many; about.\u003cfield> — values of a field of the related unit. Map the admin's words (\"northern\", \"top floor\") to these values.","inputSchema":{"type":"object","properties":{"sub":{"type":"string"},"field":{"type":"string"}},"required":["sub","field"]}},{"name":"list_table","description":"Rows of a subsystem's table (e.g. rec's volumes). Read only.","inputSchema":{"type":"object","properties":{"sub":{"type":"string"},"table":{"type":"string"}},"required":["sub","table"]}},{"name":"propose_plan","description":"Propose a plan of edits to the admin. Writes nothing: the plan is checked against the unit's form and the session's rights; the admin sees the diff and applies it. Each edit: unit \"\u003csub>/\u003cname>\", field, from (current value), to (new value), why (which field or label put // In the archive the same lines by time: the one whose moment has come and whose time has not gone stands over the picture.
async function archiveTitles(id,p,gen){

  v.ontimeupdate=null;
  // the lines of the pieces read before stay: a title does not break at the edge of a piece
  const was=V.titles&&V.titles.gen===gen&&V.titles.id===id?V.titles.all:[];
  const all=[...was],seen=new Set(was.map(x=>String(x.e.id)));

  }

}

    // a select opens on its first option: the row's own word first
    {name:"kind",label:"Вид",options:(net?[VOL_NET]:["local","backup","incidents"]).concat(was&&!["local","backup","incidents",VOL_NET].includes(was.kind)?[was.kind]:[]).sort((a,b)=>(was&&b===was.kind)-(was&&a===was.kind)).map(k=>[k,VOL_KIND[k]||k])},
    {name:"url",label:net?"Адрес":"Путь",value:was?was.url||"":net?"s3://bucket/vms":"file:///var/lib/vms/archive"},
    {name:"quota",label:"Квота, ГБ",value:shownQuota},
    ...(net?[]:[{name:"server",label:"Сервер",value:was?was.server||"":server||""}]),
    // how a card writes: the volume's word (V/02.6 Н1.7)
    ...(was&&was.kind==="edge"?[{name:"when",label:"Когда писать",options:[["offline","только пока основная не пишется"],["always","всегда"]].sort((a,b)=>(b[0]===was.when)-(a[0]===was.when))}]:[]),...keyFields],was?"Записать":"Объявить");
  if(!v)return;
  // the name is the row's key: another name would be another volume, without this one's fields
  const name=v.name.trim();
  if(was&&name!==was.name){pc.toast("Имя тома не меняется: другое имя — другой том");return}
  const old=volByName(name),body=rowBody(old);

  const quota=old&&String(v.quota).trim()===shownQuota?old.quota_bytes:Math.round((parseFloat(v.quota)||0)*1073741824);
  Object.assign(body,{name,kind:v.kind,url:v.url.trim(),quota_bytes:quota});
  if(!net)body.server=(v.server||"").trim();else delete body.server;
  if(v.access_key&&v.access_key.trim())body.access_key=v.access_key.trim();

  if(body.kind==="edge"&&v.when)body.when=v.when;else if(body.kind!=="edge")delete body.when;   // `when` is a card's only (the table's schema)
  if(body.kind==="incidents")body.admits=false;   // evidence takes no recordings (the table's schema, V/02.1 Н1.2)
  delete body.shrink_confirmed;                    // its own rule below
  const pend=old?shrinkPending(old):0;
  if(old&&old.quota_bytes&&(body.quota_bytes<old.quota_bytes||pend&&body.quota_bytes===old.quota_bytes)){
    if(!pc.confirm(`Уменьшить том «${body.name}»${body.quota_bytes<old.quota_bytes?` с ${gbytes(old.quota_bytes)}`:""} до ${gbytes(body.quota_bytes)}?`,"Самое старое будет стёрто, чтобы уместиться: стёртое не вернуть."))return;
    body.shrink_confirmed=body.quota_bytes;
  }else if(old&&body.quota_bytes===old.quota_bytes&&+old.shrink_confirmed)body.shrink_confirmed=+old.shrink_confirmed;
  try{await pc.api("POST","/rec/"+encodeURIComponent(T_PLACES),body,byVersion(old));await reloadRec();pc.select("vol:"+body.name);pc.toast(body.shrink_confirmed?"Квота тома уменьшена":"Архив объявлен")}
  catch(e){writeFailed(e,reloadRec)}
}

  {sub:"rec",action:"record",label:"Записывать",fields:[{id:"cam",label:"Камера"},{id:"minutes",label:"Минут",t:"num",min:1,max:1440},{id:"archive",label:"Архив",opt:true}]},
  {sub:"det",action:"detect",label:"Искать детектором",fields:[{id:"cam",label:"Камера"},{id:"kind",label:"Детектор"},{id:"minutes",label:"Минут",t:"num",min:1,max:1440},{id:"params",label:"Параметры модели",opt:true}]},
  {sub:"det",action:"scan",label:"Искать в архиве",fields:[{id:"cam",label:"Камера"},{id:"kind",label:"Детектор"},{id:"before",label:"Секунд до",opt:true,t:"num",min:0,max:3600},{id:"after",label:"Секунд после",opt:true,t:"num",min:0,max:3600},{id:"rec",label:"Запись",opt:true},{id:"params",label:"Параметры модели",opt:true}]}];

function ruleProblem(r){
  if(!r.name)return"У сценария должно быть имя: по нему его находят в списке";
  // an unfinished scenario is kept switched off, and one started by a schedule or a person has no event (V/07.1)
  if(r.when.length>4||(!r.when.length&&r.enabled&&(r.start||"event")==="event"))return"«если» — от одного до четырёх событий";
  if(r.when.some(t=>!t.sub||!t.kind))return"у события должны быть подсистема и вид";
  if(r.then.length>4||(!r.then.length&&r.enabled))return"«то» — от одного до четырёх действий";
  // a step with `target` names its devices there, not in `unit` or `cam` (V/07.1)
  for(const a of r.then){const k=actionKind(a),miss=k.fields.filter(f=>!f.opt&&!("target" in a&&(f.id==="unit"||f.id==="cam"))).find(f=>!String(a[f.id]??"").trim());if(miss)return`«${k.label}»: не заполнено поле «${miss.label}»`}
  for(const a of r.then){const k=actionKind(a);for(const f of k.fields){const x=a[f.id];if(x==null)continue;
    if(f.len&&typeof x==="string"&&x.length>f.len)return`«${k.label}»: «${f.label}» — не длиннее ${f.len} знаков`;
    if(!f.t)continue;
    if(f.t==="int"&&!(Number.isSafeInteger(x)&&x>=f.min))return`«${k.label}»: «${f.label}» — целое от ${f.min}`;
    if(f.t==="num"&&!(typeof x==="number"&&isFinite(x)&&x>=f.min&&x<=f.max))return`«${k.label}»: «${f.label}» — число от ${f.min} до ${f.max}`}
    // what one field cannot say: an empty window of a scan (V/07.3 Н1.1), said before writing
    if(a.sub==="det"&&a.action==="scan"&&a.before===0&&a.after===0)return`«${k.label}»: окно пустое — нужно «секунд до» или «секунд после»`}
  for(const t of r.when)if(t.match!==undefined&&(t.match===null||typeof t.match!=="object"||Array.isArray(t.match)))return"«Уточнения» — объект JSON: {\"port\": 1}";
  // one `json` field's ceiling at the door (P/06.1): 4000 bytes of its canonical JSON
  const jsonBytes=v=>new TextEncoder().encode(JSON.stringify(v)).length;
  if(jsonBytes(r.when)>4000)return"«если» — больше 4000 байт";
  if(jsonBytes(r.then)>4000)return"«то» — больше 4000 байт";
  if(!Number.isInteger(r.within)||r.within<0||r.within>3600)return"«в пределах» — целое от 0 до 3600 секунд";
  // what one field's form cannot say — the evaluator's refusal of two fields together (V/07.3 Н1.1), said before writing
  if(r.when.length>1&&!r.within)return"два события и больше — нужно «в пределах»: окно, в которое они должны попасть";
  if(r.when.length===1&&r.within)return"«в пределах» — окно между событиями; у одного события окна нет";
  if(r.rate_per_minute&&(!Number.isInteger(r.rate_per_minute)||r.rate_per_minute<1||r.rate_per_minute>600))return"не чаще — целое от 1 до 600 в минуту (0 — по умолчанию)";
  if(r.valid_for&&(!Number.isInteger(r.valid_for)||r.valid_for<10||r.valid_for>600))return"заявка действительна — целое от 10 до 600 секунд (0 — по умолчанию)";
  return"";
}

// The domain holder's view (`GET /domain`, the module hands it over on refresh): its `units` by subsystem — every

// `domain/placement/rec/` (for a camera, the cluster that records it). The module draws the domain's platform part (members, topology, alarms,
// keys); this is the rest: a member's cameras and archives in the tree, their cards, recording assignments. The page

const DOM_CAM={live:["идёт",""],stale:["воркер молчит — последнее известное","wait"],configured:["настроена, никто не держит","wait"],silent:["кластер молчит — последнее известное","off"]};

// Which cluster records a camera is the domain operator's assignment (`domain/placement/rec/<ref>`, P/08.6 Н1.1; V/02.9
// Н1.1): `cluster` — the primary's, `origin` — the camera's, `copies` — the backups' (`when: offline`). The assignment
// creates no row: the recording cluster's operator makes `rec/recordings` there (`cam: ref:<ref>`, `ref`) — the domain's
// door edits only `domain.edit` (enabled, retention_days) and cannot make one. A move leaves the former primary standing
// with its archive until its days run out; its row is its cluster operator's to remove.
async function domainRecording(camera,backup=false){
  const ref=camera.ref;
  if(!ref){pc.toast("Для записи нужно имя камеры в домене");return}
  const route="/domain/placement/rec/"+encodeURIComponent(ref);
  let old=null;
  try{old=await pc.api("GET",route)}catch(e){if(e.status!==404){pc.toast("Назначение недоступно: "+words(e));return}}
  if(backup&&!old){pc.toast("Сначала назначьте основную запись");return}
  const was=old?jsonList(old.copies):[];
  const members=((domView&&domView.members)||[]).filter(m=>!m.left&&!m.refused&&(!backup||m.name!==old.cluster&&!was.includes(m.name)));
  if(!members.length){pc.toast("Нет кластера для этой записи");return}
  const v=await pc.dialog(backup?"Резервная запись":"Основная запись",[
    {name:"cluster",label:"Кластер",value:old&&!backup?old.cluster:"",options:members.map(m=>[m.name,m.name])}],backup?"Добавить резерв":"Назначить");
  if(!v)return;
  if(!members.some(m=>m.name===v.cluster)){pc.toast("Выберите кластер из списка");return}
  const primary=backup?old.cluster:v.cluster;
  // copies: the other executors, ascending, no repeats, not the primary (P/08.6 Н2)
  const copies=[...new Set(backup?[...was,v.cluster]:was)].filter(n=>n!==primary).sort();
  try{
    // by the version read (feature "placement.if-match"): `copies` is written whole, a neighbour's reserve is not lost silently
    const rev=old?Number(old.rev):0;
    await pc.api("PUT",route,{cluster:primary,origin:camera.cluster,copies},FEATURES.has("placement.if-match")&&Number.isSafeInteger(rev)&&rev>=1?{ifMatch:rev}:undefined);
    PLACEMENTS=await pc.api("GET","/domain/placement");
    if(assignmentHost)renderAssignments(assignmentHost);
    const row=`строку rec/recordings с cam: ref:${ref}, ref: ${ref}`+(backup?", дом на резервном томе, when: offline":"");
    const moved=!backup&&old&&old.cluster!==v.cluster?` Запись кластера ${old.cluster} встанет и хранит архив до срока; её строку убирает оператор ${old.cluster}.`:"";
    pc.toast(`${backup?"Резерв назначен":"Запись назначена"} в ${v.cluster}. Оператор ${v.cluster} заводит ${row}.${moved}`);
  }catch(e){writeFailed(e,async()=>{try{PLACEMENTS=await pc.api("GET","/domain/placement");if(assignmentHost)renderAssignments(assignmentHost)}catch(x){}})}
}

  const label=async(s,f)=>{if(f.startsWith("about.")){const m=await man(s);if(m.about){const am=await man(m.about.sub);return`${((am.display||{}).unit)||m.about.sub}: ${((am.display||{}).fields||{})[f.slice(6)]||f.slice(6)}`}}return((await man(s)).display||{}).fields?.[f]||f};
  const word=async(s,f,v)=>{if(v&&typeof v==="object"&&AS.isLabel(v))return`секрет № ${v.secret}`;if(Array.isArray(v))return v.map(String).join(", ")||"пусто";if(v===null||v===undefined)return"не задано";if(typeof v==="boolean")return v?"да":"нет";const o=(((await man(s)).display||{}).options||{})[f]||{};return o[v]||(typeof v==="string"?v:JSON.stringify(v))};
  const unitName=async(s,id)=>{const m=await man(s),r=(await units(s)).get(String(id));return`${((m.display||{}).unit)||s} ${r&&m.id!=="numeric"&&r[m.id]!==undefined?r[m.id]:(r&&r.name)||id}`};
  const sel=p.selection,conds=[];
  for(const c of sel.where||[])conds.push(`${await label(sel.select_sub,String(c.field))} ${ASSIST_OPS[c.op||"eq"]||c.op}${["exists","missing"].includes(c.op)?"":" "+(Array.isArray(c.value)?c.value.join(", "):await word(sel.select_sub,String(c.field),c.value))}`);
  const shown={by:sel.where&&sel.where.length?"условие: "+conds.join(" и "):"по имени: "+(await Promise.all((sel.named||[]).map(n=>unitName(sel.select_sub,n.slice(n.lastIndexOf("/")+1))))).join(", "),
    subs:sel.select_sub!==sel.edit_sub?`отбор — ${sel.select_sub}, правка — ${sel.edit_sub}`:"",picked:sel.expected.length,inPlan:p.rows.length,rows:[]};
  for(const r of p.rows){
    // the condition's value at the units that selected this one — itself, its related unit, or the related units that
    // name it (a reverse about: several) — as the check kept them (V/11.11 Н1.7; RVP-05)
    const why=[];
    if(r.because)for(const b of r.because){const m=await man(sel.select_sub),f=b.field,ab=f.startsWith("about.")&&m.about?m.about.sub:sel.select_sub;
      const vs=[];for(const v of b.values)vs.push(await word(ab,f.replace(/^about\./,""),v));
      why.push(`${await label(sel.select_sub,f)}: ${vs.join(", ")}${sel.select_sub!==r.sub?` (${(await Promise.all(b.witnesses.map(w=>unitName(sel.select_sub,w)))).join(", ")})`:""}`)}
    else why.push("названа");
    const ch=[];for(const c of r.changes)ch.push({label:await label(r.sub,c.field),from:AS.isLabel(c.to)||/_secret$/.test(c.field)?(c.from??"—"):await word(r.sub,c.field,c.from),to:await word(r.sub,c.field,c.to),why:c.why});
    shown.rows.push({unit:await unitName(r.sub,r.id),ref:r.unit,cond:why.join("; "),changes:ch})}
  if(!alive())return false;
  A.shown=shown;A.log.push({who:"model",text:p.summary,plan:true});return true}
async function assistApply(again){
  if(!A.plan||A.applying||!FEATURES.has("api.if-match"))return;
  const g=A.gen,alive=()=>g===A.gen,plan=A.plan,secrets=plan.secrets;
  A.applying=true;assistDraw();
  const env={api:async(m,p,b,o)=>({status:200,body:await pc.api(m,p,b,o)}),get:assistGet,secret:n=>secrets.get(n),alive,
    base:async s=>s===assistConsole.root?"":"/"+s,rows:async s=>(pc.manifest(s)||{}).rows};
  let results=null;try{results=await AS.apply(env,plan,again?A.results:null)}catch(e){if(alive())pc.toast("Применение прервано: "+(e&&e.message||e))}
  if(!alive())return;                       // reset meanwhile: the new turn's state is not this apply's
  A.applying=false;A.results=results;
  const left=results&&Object.values(results).some(r=>["pending","skipped"].includes(r.outcome));
  if(!left)assistForgetSecrets();    // the secrets live while «Повторить» may still send them (V/11.12 Н1.3)
  assistDraw()}
function assistRebuild(){
  if(!A.turn||!A.results)return;
  const texts=A.turn.texts.slice(),notes=A.plan.rows.filter(r=>A.results[r.unit]&&A.results[r.unit].outcome!=="applied").map(r=>`${r.unit}: ${A.results[r.unit].outcome}`);
  assistReset();A.turn=AS.newTurn();A.turn.texts=texts;A.results=null;
  A.log.push({who:"page",text:"Перестройка: "+notes.join(", ")});
  assistRun(null,"The previous plan was applied in part. Rows to rebuild from a fresh reading: "+notes.join("; ")+".")}
function assistDraw(){
  const h=A.host;if(!h||!h.isConnected)return;
  const L=A.log.map(e=>e.who==="admin"?`<div class="as-msg as-admin">${esc(e.text)}</div>`:
    e.who==="model"?`<div class="as-msg as-model"><small>слова модели</small>${esc(e.text)}</div>`:
    `<div class="as-msg as-page">${esc(e.text)}${e.detail?`<details><summary>причина</summary><code>${esc(e.detail)}</code></details>`:""}</div>`).join("");
  let P="";
  if(A.shown){const s=A.shown;
    P=`<div class="as-sel"><b>Кого выбрали:</b> ${esc(s.by)}${s.subs?` · ${esc(s.subs)}`:""} · отобрано ${s.picked}, в плане ${s.inPlan}</div>
      <table class="as-diff"><tr><th>Единица</th><th>Почему в плане</th><th>Поле</th><th>Было → станет</th><th>Причина модели</th></tr>${s.rows.map(r=>r.changes.map((c,i)=>`<tr>${i?"<td></td><td></td>":`<td>${esc(r.unit)}</td><td>${esc(r.cond)}</td>`}<td>${esc(c.label)}</td><td>${esc(c.from)} → ${esc(c.to)}</td><td>${esc(c.why)}</td></tr>`).join("")).join("")}</table>`;
    const R=A.results;
    if(R)P+=`<ul class="as-res">${A.plan.rows.map(r=>{const o=R[r.unit]||{};return`<li class="as-${esc(o.outcome||"")}">${esc(r.unit)} — ${esc(ASSIST_OUT[o.outcome]||o.outcome||"")}${o.words?": "+esc(o.words):""}</li>`}).join("")}</ul>`;
    const left=R&&Object.values(R).some(o=>["pending","skipped"].includes(o.outcome)),redo=R&&Object.values(R).some(o=>o.outcome!=="applied");
    P+=FEATURES.has("api.if-match")?
      `<div class="vrow">${!R?`<button class="btn" data-act="apply"${A.applying?" disabled":""}>Применить</button>`:""}${left?`<button class="btn" data-act="again"${A.applying?" disabled":""}>Повторить</button>`:""}${redo&&!A.applying?`<button class="btn" data-act="rebuild">Перестроить</button>`:""}</div>`:
      `<p class="sub bad">Запись по версии недоступна: модуль консоли без api.if-match.</p>`}
  const models=A.models.map(m=>`<option value="${esc(m.id)}"${m.id===A.model?" selected":""}>${esc(m.id)}</option>`).join("");
  h.innerHTML=card("Ассистент",`
    <div class="vrow"><label>Модель</label><select data-act="model"${A.busy||A.ask?" disabled":""}>${models}</select><span class="as-status sub">${esc(A.status)}</span></div>
    <div class="as-log">${L}</div>${P}
    <textarea class="as-text" rows="3" placeholder="${A.ask?"Ответьте словами — назовите поле и значение; «да» ничего не называет":"Что сделать? Например: включи запись камер третьего этажа"}"${A.busy?" disabled":""}></textarea>
    <div class="vrow"><button class="btn" data-act="send"${A.busy?" disabled":""}>${A.ask?"Ответить":"Отправить"}</button>
      <button class="btn" data-act="secret"${A.busy?" disabled":""}>Пароль…</button>
      ${A.busy||A.ask||A.applying?`<button class="btn" data-act="cancel">Отменить ход</button>`:""}<button class="btn" data-act="new">Новый ход</button></div>
    <div class="as-secrets"></div>`);
  wire(h,{send:assistSend,cancel:assistCancel,new:assistNew,apply:()=>assistApply(false),again:()=>assistApply(true),rebuild:assistRebuild,model:el=>{A.model=el.value},
    secret:()=>{const box=h.querySelector(".as-secrets"),n=A.secrets.size+box.children.length+1;
      box.insertAdjacentHTML("beforeend",`<div class="as-secret-row"><label>Секрет № ${n}</label><input type="password" class="as-secret" autocomplete="off"></div>`)}})}
// The section: only when the console mounts assist and the session sees a model row (V/11.9 Н1.1).
if(AS)pc.ready.then(async()=>{
  const r=await assistGet("/assist/models");const rows=(r.status===200&&r.body&&r.body.configured)||[];if(!rows.length)return;   // no assist, or no model row the session sees
  const live=new Set(((r.body&&r.body.rows)||[]).filter(x=>x.phase==="running"||x.state==="running").map(x=>String(x.id)));
  A.models=rows.map(x=>({id:String(x.id),context:x.context})).sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
  A.model=(A.models.find(x=>live.has(x.id))||A.models[0]).id;
  pc.addSection({id:"assist",label:"Ассистент",icon:"bolt",after:"rules",render:host=>{A.host=host;assistDraw()}});
  addEventListener("pagehide",()=>assistReset(true));
  pc.on("logout",()=>{assistCancel();A.log=[];assistDraw()});
  // the same person back: the reads go on; another, or not known yet: the turn and the secrets go (V/11.9 Н1.6)
  if(FEATURES.has("session"))pc.on("session",e=>{const u=(e&&e.user)??null,same=u!==null&&(A.who===null||u===A.who);A.who=u;if(same)A.logins.splice(0).forEach(r=>r(true));else assistNew()});
});
// assist:panel:end
</script>
