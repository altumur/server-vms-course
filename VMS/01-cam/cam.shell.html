<!--
NOTES — what this page is, its parts and its state (each function is described where it is defined)

# cam.shell.html — the VMS's page over the platform's console module (М10B, beside lesson 12)

**Role.** The page at `/` of a console whose root is `cam` (P/06: a subsystem's own page is `<sub>.shell.html`
beside its manifest, served at the console's root). It mounts the module
(`PlatformConsole.mount(#app, {lang, subsystems: [cam, rec, live]})`); rec and live are about the camera (`about`), so the module nests their units under it and the page reads
their manifests with `pc.manifest(name)`. No platform section is drawn here: no login, no tree of servers, no domain card, no
journal — the module's; the page's own tests hold it to that.

## The core: copied with a check
`whereAt`, `doorOf`, `doorFetch`, `yieldCut`, `loadTimeline`, `segmentURL`, `play`, `playNext`, `negotiateLive`,
`stopLive` are the product's (its own page on its `main`), between the two «core» lines below; a check compares each
with the product's page, and what differs is listed as a debt — only shrinking. The places a
recording may lie on are the rows of the table the rec manifest names
(`places.table`), read at `/rec/<table>` — never a table named in the page, here and in the product.

## What the page adds (all through the module's calls)
- `addIcons` — camera, volume (storage); `addDecor("unit")` — a camera's icon and its address as a tag, a stream's
  name and its camera's (a stream is a unit of cam with `main`, V/01.1 Н1.1а; the module draws it as a unit of its own);
  `addFieldEditor("unit", "source")` — the source and what it says (address, vendor, channel), sent by the form.
- `addNote("unit")` — «открытие не завершается» (the device has not opened: `device_state: opening`), «сбой
  устройства» (`phase: failed`, the holder's `why`); `addEventNote` — the VMS's events in words (volumes, cards, the
  footage), everywhere the module lists events.
- `addTab("unit")` «Видео» — the live picture (WHEP at the gateway's door), the timeline of every recording of the
  camera and every place a recording may have left footage on, the events on it, the operator's mark, «Закрепить»
  (what is only in a backup: `POST /rec/requests` for the primary recording), «Удержать показанное».
  The timeline holds the camera's recordings in the other clusters of the domain too (ADR-0061): the book of
  primaries this cluster carries names them by the camera's ref — the primary and each of its `backups` —, at a member
  and at the holder alike, their doors are asked at this console
  (`/domain/at/<cluster>/rec/where/…`), a refusal said in words (403, 404, 502, 503).
  «Видео» of a camera says the size of its window and the gateway picks the stream (`?width=&height=`), of a stream —
  the stream; the timeline is the camera's. «Видео», «Потоки» and «Архив» of a row of another `type` say it has no picture.
  «Потоки» — the camera's streams (`POST /cam/cameras {main, profile, source}`).
  «Архив» — the camera's recordings (`/rec/recordings`: create, switch, delete, home, days, `when` of a card, `replica_from`) and
  its keeps (`/rec/keeps`: make, lift; check at the incidents holder's door; the state in the recorders' own words, from
  their beat — `servers.status` of their rows at `/rec/servers` with `of: keeps`, ADR-0064: here, pushing, pushed,
  at risk, lost, garbled of the recording's writer; kept of the incidents holder; let go — the row's `released_at` —, «нет кадров,
  запечатывать нечего» for a recording with no footage in the stretch).
- Volumes (`/rec/<places table>`): `addTreeNodes("server")` (a server's own), `addTreeNodes("servers")` («Сетевые
  архивы»), `addCard("vol"|"netvols")`, `addBlock("server", {covers: "rec/volumes"})` «Архивы сервера»; declaring
  (`POST`, the row whole: what the dialog does not show is carried from the row; a smaller quota, or one a holder says
  waits — `shrink_pending` —, only with `shrink_confirmed`; `incidents` with `admits: false`) and withdrawing (`DELETE`).
- «Камеру в архив» — `addAction("server")`, `addMenu("server"|"vol")`: a recording of a camera on a volume of the
  server (`POST /rec/recordings {name, cam, stream?, home}`: the camera and the stream chosen together, the largest suggested).
- `addTreeNodes("unit")`, `addCard("child")` — a device's children under their owner: an input, an output, a microphone, a
  speaker (`/cam/children`, the holder's; `/cam/child_settings`, the operator's: name, switch, normal state).
- `addCard("dunit")` — a device's units under their row (`/cam/device_units`, the operator's): a door, a reader, a fence;
  their name, switch and operations (`POST /cam/requests {unit, action: "unit", n, operation}`).
- Titles over the video: the lines of a row `eventsrc` tied to this camera (`/events?kind=text`), live and over the archive;
  never in the frame (V/08.3 Н1.2 п. 10).
- `addSection` «Сценарии» (after units) — the auto subsystem's scenarios: the list and the editor, the actions the
  auto manifest's `then` accepts (the page's catalogue of actions, held to the manifest by a check), the last firings.
- The domain through the VMS's eyes, from the holder's `/domain` view (`units`, `tables`): `addTreeNodes("member")`
  — a member's cameras and archives (a member of one camera stands in the tree as its camera: `replaces`),
  `addCard("dc"|"da")`, `addBlock("member")`, `addBlock("domain")` «Назначения записи» (`domain/placement/rec/`).
- `addMenu("unit")` — «Смотреть видео», «Архив».
- «Учётки потоков» в разделе прав — `addTreeNodes("access")` и `addCard`: свои `/live/accounts`, пароль только
  ответом создания или смены, без хранения в состоянии страницы.

## Routes the page itself uses
`/rec/recordings`, `/rec/<places table>`, `/rec/keeps`, `/rec/requests`, `/rec/servers`, `/live/streams`, `/auto/scenarios`,
`/events`, `/marks`, `/live/accounts`, `/cam/cameras` (a stream), `/cam/children`, `/cam/child_settings`, `/cam/device_units`, `/cam/requests` (writes through `pc.api`), `/domain/rec/books/primaries`, `/domain/placement`
(`PUT /domain/placement/rec/<ref>`); the holders' doors from
`/rec/where/<recording>`, `/rec/where/<table>/<place>?unit=<recording>`, `/live/where/<stream>` (`/whep`, `/talk` at the gateway), and another
cluster's from `/domain/at/<cluster>/rec/where/…` (ADR-0061); at the incidents holder's door,
`POST /keeps/<keep>/verify?recording=<r>`. Everything else is the module's.
-->

<script src="/platform/console.js?v=1"></script>
<script>
"use strict";
// The VMS's words (display) and what its subsystems are about (about) the module reads from each one's manifest.
const SUBS=["cam","rec","live"];
// The module's API this page is written for (P/07 Н1.5 `version`): another version is not used — the page says so.
const SHELL_API=1;
if(PlatformConsole.version!==SHELL_API){document.getElementById("app").textContent="Страница VMS написана для версии "+SHELL_API+" модуля консоли, а загружена "+PlatformConsole.version+".";throw new Error("console module version")}
// What the module offers beyond the first calls of version 1 (P/07 Н1.5 `features`): a missing word — no such call.
const FEATURES=new Set(Array.isArray(PlatformConsole.features)?PlatformConsole.features:[]);
const pc=PlatformConsole.mount(document.getElementById("app"),{lang:"ru",subsystems:SUBS});
window.platformConsole=pc;
// ── Helpers ───────────────────────────────────────────────────────────────────────────────────────────────────
// Everything the page draws from data goes through esc: a camera's name, an event's note, a volume's url are TEXT.
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=q=>document.querySelector(q);
const card=(title,body,act="")=>`<div class="card"><div class="ch">${title}${act}</div><div class="cb">${body}</div></div>`;
const noPicture=title=>card(title,`<p class="sub">У этого устройства нет кадров: видео, потоки и запись — только у камеры.</p>`);
const fldRo=(label,value)=>`<div><label>${esc(label)}</label><input type="text" value="${esc(value??"")}" readonly disabled></div>`;
// The words of a refusal (P/07 Н1.5: `api` throws {status, body, retry}): the body's detail or error, else the status;
// `message` — only an error of the network, which has no status.
const words=e=>e&&e.status?String((e.body&&(e.body.detail||e.body.error))||e.status):String(e&&e.message||e);
// A write with no answer, or a 5xx: its outcome is not known, so no refusal is claimed and what is shown is read again (V/08.1 Н1.2).
const unknownOutcome=e=>!e||!e.status||e.status>=500;
const failWords=e=>unknownOutcome(e)?"Исход неизвестен: "+words(e)+". Сначала посмотрите, что записалось":e.status===412?"Строка изменилась: откройте её заново":"Отказано: "+words(e);
const writeFailed=(e,read)=>{pc.toast(failWords(e));if(read&&(unknownOutcome(e)||e.status===412))read()};
const getJSON=async path=>{const r=await fetch(path);if(!r.ok)throw new Error(path+": "+r.status);return r.json()};
// The subsystems of this console, each with its manifest (`/mounts`): the words of those the module does not show (V/08.1 Н1.5).
let MOUNTED={};
const kindsOf=n=>pc.display(n).kinds||(MOUNTED[n]&&(MOUNTED[n].display||{}).kinds)||{};
async function readMounts(){try{const m=await getJSON("/mounts");MOUNTED=m&&m.mounts&&typeof m.mounts==="object"?m.mounts:{};return m}catch(e){return null}}
pc.ready.then(readMounts);
// A click (a change, for a field) on the page's own markup is wired here, never in an attribute: the console's CSP
// runs no inline handler. `data-act` names the handler; the element and its dataset are what it gets.
function wire(host,acts){
  host.querySelectorAll("[data-act]").forEach(el=>{const f=acts[el.dataset.act];if(!f)return;
    if(/^(SELECT|INPUT|TEXTAREA)$/.test(el.tagName))el.onchange=e=>f(el,e);
    else el.onclick=e=>{e.preventDefault();e.stopPropagation();f(el,e)}});
}
function gbytes(n){return n?(n/1073741824).toFixed(1)+" ГБ":"—"}
function fmtDayTime(t){return t?new Date(t*1000).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}):"—"}
function durRu(sec){sec=Math.round(+sec||0);const m=Math.floor(sec/60),s2=sec%60;return m?`${m} мин${s2?" "+s2+" с":""}`:`${s2} с`}
const fmtT=t=>new Date(t*1000).toLocaleString("ru-RU",{hour12:false}).replace(",","");
const fmtHMS=t=>new Date(t*1000).toLocaleTimeString("ru-RU",{hour12:false});
// The units as the module last read them (refresh): the cameras, their recordings; and the domain's view.
let UNITS={},domView=null;
pc.on("refresh",d=>{if(d&&d.units)UNITS=d.units;if(d&&"domain" in d)domView=d.domain});
const camById=id=>(UNITS.cam||[]).find(u=>String(u.id)===String(id))||null;
const camName=id=>{const c=camById(id);return c?(c.name||"камера "+c.id):"камера "+id};
// A camera's streams (V/01.1 Н1.1а): each a unit of cam; the camera is the row whose `main` is empty, another stream names it
// in `main` and says only its source and its `profile`. What is the camera's — name, labels, recordings, keeps — is read
// from the camera, whichever stream is chosen.
const camMain=u=>u&&u.main?String(u.main):"";
const cameraOf=id=>camMain(camById(id))||String(id);
const streamsOf=id=>(UNITS.cam||[]).filter(u=>String(u.main||"")===String(id));
const streamName=u=>u?(u.profile||"main")+(u.size?" · "+u.size:""):"";
// Frames, recording and detectors are a `camera`'s alone (V/01.1 Н1.1б); a row with no word is one, the door's default.
const hasPicture=u=>!u||!u.type||u.type==="camera";
// What to record the page only suggests: the largest picture by the holder's `size`; a stream it has not said a size of
// is not suggested, and nothing suggested is the camera itself. What to watch the gateway picks (V/03.3 Н1.2).
const area=u=>{const m=/^(\d+)x(\d+)$/.exec(String((u&&u.size)||""));return m?m[1]*m[2]:0};
function largestStream(cam){
  const all=[camById(cam),...streamsOf(cam)].filter(u=>area(u));
  if(!all.length)return String(cam);
  all.sort((a,b)=>area(b)-area(a));
  return String(all[0].id);
}
const recsOfCam=id=>(UNITS.rec||[]).filter(r=>String(r.cam)===String(id));
// C2 observations shown by the receiving console: provenance and declared show fields only.
// A recording in the domain is the pair (cluster, id): an id is unique in its cluster only. «Ours» — by the member's
// name, this cluster's being `cluster` of GET /api/held (P/06.7 Н1.12).
let PRIMARIES=null,PLACEMENTS=null,SELF="",assignmentHost=null;
pc.on("refresh",async d=>{
  if(!(d&&"domain" in d))return;
  const get=async path=>{try{const r=await fetch(path);return r.ok?await r.json():null}catch(e){return null}};
  let held;[PRIMARIES,PLACEMENTS,held]=await Promise.all([get("/domain/rec/books/primaries"),get("/domain/placement"),get("/api/held")]);
  SELF=held&&typeof held.cluster==="string"?held.cluster:SELF;
  if(assignmentHost&&assignmentHost.isConnected)renderAssignments(assignmentHost);
});
function farRecsOfCam(id){
  const c=camById(id),ref=c&&c.ref,p=ref&&PRIMARIES&&PRIMARIES[ref],marker=PRIMARIES&&PRIMARIES[""];
  if(!p||!marker||!Array.isArray(marker.missing)||!Array.isArray(p.entries))return[];
  // this cluster's name not read (no /api/held answer): ours are known by this cluster's own recording ids, as before
  const own=SELF?null:new Set(recsOfCam(id).map(r=>String(r.id))),out=[],seen=new Set();
  for(const e of p.entries){
    if(!e||typeof e.member!=="string"||!e.member||typeof e.item!=="string"||!e.item||
       typeof e.recording!=="string"||!e.recording||!["primary","backup"].includes(e.role)||
       e.running!==true)continue;     // a recording nobody writes is not a source (running: true only); an element is a member's that contributes
    // ours are this cluster's own rows (recsOfCam); another member's are unique by (member, recording)
    const key=e.member+"|"+e.recording;if((SELF?e.member===SELF:own.has(e.recording))||seen.has(key))continue;seen.add(key);
    out.push({id:e.recording,cluster:e.member,home:typeof e.home==="string"?e.home:"",backup:e.role!=="primary",cam:String(id)});
  }
  return out;
}
// where a recording's door is asked: its own cluster's console, or another's through this one (ADR-0061)
const recWhere=rec=>(rec.cluster?`/domain/at/${encodeURIComponent(rec.cluster)}`:"")+"/rec/where/"+encodeURIComponent(rec.id);
const placeWhere=(rec,T,place)=>(rec.cluster?`/domain/at/${encodeURIComponent(rec.cluster)}`:"")+`/rec/where/${encodeURIComponent(T)}/${encodeURIComponent(place)}?unit=${encodeURIComponent(rec.id)}`;
const camOf=ref=>String(ref).replace(/^unit:cam\//,"");
const isCam=ref=>String(ref).startsWith("unit:cam/");
// Open an object at a tab by the id given to addTab (`select(ref, {tab})`, feature "select.tab"); without it — the object
// alone, the operator opens the tab: the module's markup is not the page's to touch.
const openAt=(ref,tab)=>FEATURES.has("select.tab")?pc.select(ref,{tab}):pc.select(ref);

// ── A camera: its icons, its address, its notes, its events ───────────────────────────────────────────────────
pc.addIcons({
  camera:`<path fill="currentColor" d="M1.4 3.6h7.6c.9 0 1.6.7 1.6 1.6v5.6c0 .9-.7 1.6-1.6 1.6H1.4C.5 12.4 0 11.7 0 10.8V5.2c0-.9.5-1.6 1.4-1.6z"/><path fill="currentColor" opacity=".75" d="M10.6 5.6 14.6 3.5c.55-.28 1.2.12 1.2.75v7.5c0 .63-.65 1.03-1.2.75l-4-2.1V5.6z"/>`,
  device:`<path fill="currentColor" d="M1.5 4h13c.8 0 1.5.7 1.5 1.5v5c0 .8-.7 1.5-1.5 1.5h-13C.7 12 0 11.3 0 10.5v-5C0 4.7.7 4 1.5 4zM3 7v2h2V7zm4 0v2h2V7zm4 0v2h2V7z"/>`,
  storage:`<path fill="currentColor" d="M2 2.4h12c.6 0 1 .4 1 1v2.2H1V3.4c0-.6.4-1 1-1zm-1 4.4h14v2.4H1zm0 3.6h14V12.6c0 .6-.4 1-1 1H2c-.6 0-1-.4-1-1zm3 1.1c0 .4.3.7.7.7s.7-.3.7-.7-.3-.7-.7-.7-.7.3-.7.7z"/>`
});
// The camera's source, read for a person: driverpack://<vendor>/<address>/ch/<channel>, or any other URL's host — the
// one thing about a camera that does not follow from the manifest's types (a field editor; the module's form sends it).
function parseSource(src){
  const out={host:"",vendor:"",channel:""};
  if(!src)return out;
  try{const u=new URL(src),parts=u.pathname.split("/").filter(Boolean).map(decodeURIComponent);
    if(u.protocol==="driverpack:"){out.vendor=decodeURIComponent(u.hostname);out.host=parts[0]||"";out.channel=parts[1]==="ch"?parts[2]||"":""}
    else out.host=u.hostname+(u.port?":"+u.port:"")}
  catch(e){out.host=String(src)}
  return out;
}
// A stream is drawn by the module as a unit of its own (its tree for an `about` on cam itself is the VMS's request after
// stage C): the badge names its camera, so it is not taken for one.
pc.addDecor("unit",(ref,u)=>!isCam(ref)?{}:camMain(u)?{icon:"camera",badge:(u.profile||"поток")+" ↑ "+camName(u.main),title:"поток камеры "+camName(u.main)}
  :!hasPicture(u)?{icon:"device",badge:((pc.display("cam").options||{}).type||{})[u.type]||u.type}
  :{icon:"camera",badge:u?parseSource(u.source).host:""});
pc.addFieldEditor("unit","source",(host,ref,obj,value,set)=>{
  host.innerHTML=`<div class="g"><div><label>Источник</label><input class="cam-src" value="${esc(value)}" autocomplete="off"></div><span class="cam-src-parts" style="display:contents"></span></div>`;
  const inp=host.querySelector(".cam-src"),parts=host.querySelector(".cam-src-parts");
  const show=v=>{const s2=parseSource(v);parts.innerHTML=fldRo("Адрес",s2.host)+fldRo("Производитель",s2.vendor)+fldRo("Канал",s2.channel)};
  show(value);
  if(!pc.may("edit",ref,"cam"))inp.disabled=true;
  inp.oninput=()=>{set(inp.value);show(inp.value)};
});
// What the driver host does with a camera, said aloud when it goes wrong: a device that has not opened (its open has
// not come back — the address, the network, the credentials), a camera its worker could not run (its words).
pc.addNote("unit",(ref,u)=>{
  if(!isCam(ref)||!u)return"";

// H.265 in the browser's offer: Chrome numbers it below 96, and GStreamer's packer takes only 96–127. The gateway

function h265Dynamic(sdp){

// While watching: the camera's events every 3 s, newest first, the last 30 kept.
async function pollLive(id){
  if(!V.live)return;

  if(!V.live)return;                       // the viewer hung up while it was asked
  const feed=$("#livefeed");if(!feed)return;
  (d.events||[]).sort((a,b)=>evAt(a)-evAt(b)).forEach(e=>{
    V.live.since=Math.max(V.live.since,e.t-5);   // by `t`, with JOURNAL_SETTLE to spare: a line of another resource may come late
    const k=String(e.id);                  // the line's id: unique, copies drop by it (the event journal contract)
    if(V.live.seen.has(k))return;
    V.live.seen.add(k);
    const el=document.createElement("div");el.className="ev";el.dataset.t=String(Number(evAt(e))||0);
    el.innerHTML=`<span class="swatch" style="background:${subColor(e.subsystem)}"></span>${fmtHMS(evAt(e))} <strong title="${esc(e.kind)}">${esc(evKindRu(e))}</strong> <small>${esc(e.subsystem)}${e.note?" · "+esc(e.note):""}${e.score!=null?" · "+esc(e.score):""}${e.fenced?" · отгорожено":""}</small>`;
    // the newest on top by the event's time, across the polls: a late line goes below the newer ones (V/08.3 Н1.2 п. 7)
    const after=[...feed.children].slice(1).find(x=>+x.dataset.t<=+el.dataset.t)||null;
    feed.insertBefore(el,after);
    while(feed.children.length>31)feed.removeChild(feed.lastChild);

  if(feed.firstChild&&((d.state&&d.state!=="live")||hid))

}

async function pollTitles(id){

// In the archive the same lines by time: the one whose moment has come and whose time has not gone stands over the picture.
async function archiveTitles(id,p,gen){
  clearTitle();

  v.ontimeupdate=null;
  // the lines of the pieces read before stay: a title does not break at the edge of a piece
  const was=V.titles&&V.titles.gen===gen&&V.titles.id===id?V.titles.all:[];
  const all=[...was],seen=new Set(was.map(x=>String(x.e.id)));
  for(const pos of posOf(id)){
    try{const r=await fetch(`/events?from=${p.start}&to=${p.end}&kind=text&unit=${encodeURIComponent("cam/"+pos.id)}`);if(!r.ok)continue;
      const d=await r.json();(Array.isArray(d.events)?d.events:[]).forEach(e=>{if(seen.has(String(e.id)))return;seen.add(String(e.id));all.push({at:Number(evAt(e))+num0(pos.overlay_delay_ms)/1000,pos,e})})}catch(e){}
  }

    if(cur===shown)return;shown=cur;

      return[c,...streamsOf(c.id)].map(s=>[String(c.id)+"|"+String(s.id),(c.name||"камера "+c.id)+" · "+streamName(s)+(String(s.id)===sug?" (крупнейший)":"")])
        .sort((a,b)=>(b[1].endsWith("(крупнейший)")?1:0)-(a[1].endsWith("(крупнейший)")?1:0))})},
    {name:"home",label:"Архив",options:(opt.home||opt.server?[]:[["","любой свободный том"]]).concat(homes.map(x=>[x.name,x.name+" · "+volKind(x)]))},
    {name:"days",label:"Срок хранения, дн",value:"30"}],"Создать");
  if(!v)return;
  const [vcam,vstream]=String(v.cam).split("|");v.cam=vcam;
  const stream=vstream&&vstream!==vcam?vstream:"";
  const days=wholeDays(v.days);
  if(!days){pc.toast("Срок хранения — целое число дней, не меньше 1");return}
  const hv=volByName(v.home);
  const taken=new Set(recs.map(r=>r.id));
  // the name (V/08.4): the camera's id; taken — `<cam>-<volume>` with a volume chosen, else `<cam>-s<stream>` with a stream
  const name=!taken.has(v.cam)?v.cam:v.home?`${v.cam}-${v.home}`:stream?`${v.cam}-s${stream}`:v.cam;

  catch(e){writeFailed(e,reloadRec)}
}

const shrinkPending=v=>{const w=recWorkers().find(x=>v.held_by&&x.worker===v.held_by);return w&&+w.status.shrink_pending>0?+w.status.shrink_pending:0};

// Declaring a volume: the row written whole (`POST /rec/<table>`). A smaller quota for a volume that is there erases
// its oldest footage — the recorder applies it only with `shrink_confirmed` equal to it, the operator's second word.
async function openVolume(kind,server,was){
  const net=kind===VOL_NET,shownQuota=was?String(Math.round(was.quota_bytes/1073741824*100)/100):"100";
  // the key of an address: of any kind but a card (the table's schema)
  const keyFields=(was&&was.kind==="edge")?[]:[{name:"access_key",label:"Ключ доступа (ID)",value:was?was.access_key||"":""},{name:"access_secret",label:"Секрет ключа",type:"password",help:"пусто — оставить текущий; при смене адреса впишите заново"}];
  const v=await pc.dialog(was?"Объявление тома "+was.name:net?"Новый сетевой архив":"Новый архив на сервере",[
    {name:"name",label:"Имя",value:was?was.name:net?"nas":(server||"local")},
    // a select opens on its first option: the row's own word first
    {name:"kind",label:"Вид",options:(net?[VOL_NET]:["local","backup","incidents"]).concat(was&&!["local","backup","incidents",VOL_NET].includes(was.kind)?[was.kind]:[]).sort((a,b)=>(was&&b===was.kind)-(was&&a===was.kind)).map(k=>[k,VOL_KIND[k]||k])},
    {name:"url",label:net?"Адрес":"Путь",value:was?was.url||"":net?"s3://bucket/vms":"file:///var/lib/vms/archive"},
    {name:"quota",label:"Квота, ГБ",value:shownQuota},
    ...(net?[]:[{name:"server",label:"Сервер",value:was?was.server||"":server||""}]),
    // how a card writes: the volume's word (V/02.6 Н1.7)
    ...(was&&was.kind==="edge"?[{name:"when",label:"Когда писать",options:[["offline","только пока основная не пишется"],["always","всегда"]].sort((a,b)=>(b[0]===was.when)-(a[0]===was.when))}]:[]),...keyFields],was?"Записать":"Объявить");
  if(!v)return;
  // the name is the row's key: another name would be another volume, without this one's fields
  const name=v.name.trim();
  if(was&&name!==was.name){pc.toast("Имя тома не меняется: другое имя — другой том");return}
  const old=volByName(name),body=rowBody(old);
  // the window shows the quota rounded: untouched, it is the row's bytes
  const quota=old&&String(v.quota).trim()===shownQuota?old.quota_bytes:Math.round((parseFloat(v.quota)||0)*1073741824);
  Object.assign(body,{name,kind:v.kind,url:v.url.trim(),quota_bytes:quota});
  if(!net)body.server=(v.server||"").trim();else delete body.server;
  if(v.access_key&&v.access_key.trim())body.access_key=v.access_key.trim();
  if(v.access_secret)body.access_secret=v.access_secret;
  if(body.kind==="edge"&&v.when)body.when=v.when;else if(body.kind!=="edge")delete body.when;   // `when` is a card's only (the table's schema)
  if(body.kind==="incidents")body.admits=false;   // evidence takes no recordings (the table's schema, V/02.1 Н1.2)
  delete body.shrink_confirmed;                    // its own rule below
  const pend=old?shrinkPending(old):0;
  if(old&&old.quota_bytes&&(body.quota_bytes<old.quota_bytes||pend&&body.quota_bytes===old.quota_bytes)){
    if(!pc.confirm(`Уменьшить том «${body.name}»${body.quota_bytes<old.quota_bytes?` с ${gbytes(old.quota_bytes)}`:""} до ${gbytes(body.quota_bytes)}?`,"Самое старое будет стёрто, чтобы уместиться: стёртое не вернуть."))return;
    body.shrink_confirmed=body.quota_bytes;
  }else if(old&&body.quota_bytes===old.quota_bytes&&+old.shrink_confirmed)body.shrink_confirmed=+old.shrink_confirmed;
  try{await pc.api("POST","/rec/"+encodeURIComponent(T_PLACES),body,byVersion(old));await reloadRec();pc.select("vol:"+body.name);pc.toast(body.shrink_confirmed?"Квота тома уменьшена":"Архив объявлен")}
  catch(e){writeFailed(e,reloadRec)}
}

// ── «Сценарии»: the auto subsystem's scenarios, a section of the page ───────────────────────────────────────────
// A scenario is a unit of auto: «when this happened (and that, within N seconds) — ask for this». Its evaluator reads
// the same events this page shows and files a REQUEST, performed by whoever holds the unit. The catalogue of actions
// is the auto manifest's `then` (each of its `anyOf`, with its required fields): the operator cannot ask for what no
// executor is written for — a check of the specification holds the two together. A detector's actions are offered when
// the console mounts det.
// A field's type is the `then` schema's (V/07.1 Н1.3): `int` — a JSON integer from `min`, `num` — a number in [min, max];
// the rest strings. `params` is a string, as the detector's own field is (V/04.1 Н1.1): the form writes it as typed.
const RACTIONS=[
  {sub:"cam",action:"output",label:"Щёлкнуть реле",fields:[{id:"unit",label:"Устройство"},{id:"port",label:"Реле №",t:"int",min:1},{id:"state",label:"Состояние",opt:true,len:32},{id:"pulse_ms",label:"Импульс, мс",opt:true,t:"int",min:0}]},
  {sub:"cam",action:"preset",label:"Встать в пресет",fields:[{id:"unit",label:"Камера"},{id:"n",label:"Пресет №",t:"int",min:1}]},
  {sub:"rec",action:"record",label:"Записывать",fields:[{id:"cam",label:"Камера"},{id:"minutes",label:"Минут",t:"num",min:1,max:1440},{id:"archive",label:"Архив",opt:true}]},
  {sub:"det",action:"detect",label:"Искать детектором",fields:[{id:"cam",label:"Камера"},{id:"kind",label:"Детектор"},{id:"minutes",label:"Минут",t:"num",min:1,max:1440},{id:"params",label:"Параметры модели",opt:true}]},
  {sub:"det",action:"scan",label:"Искать в архиве",fields:[{id:"cam",label:"Камера"},{id:"kind",label:"Детектор"},{id:"before",label:"Секунд до",opt:true,t:"num",min:0,max:3600},{id:"after",label:"Секунд после",opt:true,t:"num",min:0,max:3600},{id:"rec",label:"Запись",opt:true},{id:"params",label:"Параметры модели",opt:true}]}];
let RSEL=null,ruleDraft=null,ruleFires={},autos=[],autoOff=false,detOn=false,RULES_HOST=null;
const actionsOn=()=>RACTIONS.filter(a=>a.sub!=="det"||detOn);
const actionKind=a=>RACTIONS.find(k=>k.sub===a.sub&&k.action===a.action)||{sub:a.sub,action:a.action,label:(a.sub||"?")+"."+(a.action||"?"),fields:[]};
// The events a trigger may name: the words the VMS's manifest has for its kinds (display.kinds), and any other typed in.
const triggerKinds=sub=>Object.entries(kindsOf(sub||"cam"));
async function loadAuto(){
  await pc.ready;
  try{
    const d=await getJSON("/auto/scenarios");
    // A scenario exists while its row does; a holder that has not noticed a deletion yet speaks of it last.
    const seen=rowsById(d.rows);
    autos=(d.configured||[]).map(c=>{const r=seen[String(c.id)]||null;
      return{...c,id:String(c.id),worker:r?r.worker:null,phase:r?r.phase:"silent",reason:r&&(r.reason||r.why)||"",
        unfit:r&&Array.isArray(r.unfit)&&r.unfit.length?r.unfit:null,unchecked:r&&Array.isArray(r.unchecked)&&r.unchecked.length?r.unchecked:null}})
      .sort((a,b)=>(+a.id)-(+b.id));   // a scenario's id is a number the door issues (V/07.1): the list keeps that order
    autoOff=false;
  }catch(e){autos=[];autoOff=true}
  // det is there when the console mounts it (`/mounts`, P/06.5 root), not when the module's subsystems name it
  const m=await readMounts();detOn=!!m&&(m.root==="det"||!!(m.mounts&&"det" in m.mounts));
}
// The last firings: the evaluator writes `fired` into the scenario's bucket — «why did the door open at 14:02».
async function loadFires(id){
  const to=Date.now()/1000,from=to-86400;
  try{const d=await getJSON(`/events?subsystem=auto&unit=${encodeURIComponent("auto/"+id)}&from=${from}&to=${to}&limit=50`);
    ruleFires[id]=(d.events||[]).filter(e=>e.kind==="fired").sort((a,b)=>evAt(b)-evAt(a)).slice(0,10)}
  catch(e){ruleFires[id]=[]}
  renderRules();
}
const jsonList=v=>{try{const x=typeof v==="string"?JSON.parse(v):v;return Array.isArray(x)?x:[]}catch(e){return[]}};
function ruleOf(r){return{id:r.id,name:r.name||r.id,start:r.start||"event",enabled:r.enabled!==false,rate_per_minute:+r.rate_per_minute||0,within:+r.within||0,
  valid_for:+r.valid_for||0,when:jsonList(r.when),then:jsonList(r.then)}}
const curRule=()=>ruleDraft||(autos.find(r=>r.id===RSEL)?ruleOf(autos.find(r=>r.id===RSEL)):null);
const editRule=()=>(ruleDraft=ruleDraft||JSON.parse(JSON.stringify(curRule())));
// The same refusals as the server's, in its words: a screen that takes what the subsystem will refuse lies twice.
function ruleProblem(r){
  if(!r.name)return"У сценария должно быть имя: по нему его находят в списке";
  // an unfinished scenario is kept switched off, and one started by a schedule or a person has no event (V/07.1)
  if(r.when.length>4||(!r.when.length&&r.enabled&&(r.start||"event")==="event"))return"«если» — от одного до четырёх событий";
  if(r.when.some(t=>!t.sub||!t.kind))return"у события должны быть подсистема и вид";
  if(r.then.length>4||(!r.then.length&&r.enabled))return"«то» — от одного до четырёх действий";
  // a step with `target` names its devices there, not in `unit` or `cam` (V/07.1)
  for(const a of r.then){const k=actionKind(a),miss=k.fields.filter(f=>!f.opt&&!("target" in a&&(f.id==="unit"||f.id==="cam"))).find(f=>!String(a[f.id]??"").trim());if(miss)return`«${k.label}»: не заполнено поле «${miss.label}»`}
  for(const a of r.then){const k=actionKind(a);for(const f of k.fields){const x=a[f.id];if(x==null)continue;
    if(f.len&&typeof x==="string"&&x.length>f.len)return`«${k.label}»: «${f.label}» — не длиннее ${f.len} знаков`;
    if(!f.t)continue;
    if(f.t==="int"&&!(Number.isSafeInteger(x)&&x>=f.min))return`«${k.label}»: «${f.label}» — целое от ${f.min}`;
    if(f.t==="num"&&!(typeof x==="number"&&isFinite(x)&&x>=f.min&&x<=f.max))return`«${k.label}»: «${f.label}» — число от ${f.min} до ${f.max}`}
    // what one field cannot say: an empty window of a scan (V/07.3 Н1.1), said before writing
    if(a.sub==="det"&&a.action==="scan"&&a.before===0&&a.after===0)return`«${k.label}»: окно пустое — нужно «секунд до» или «секунд после»`}
  for(const t of r.when)if(t.match!==undefined&&(t.match===null||typeof t.match!=="object"||Array.isArray(t.match)))return"«Уточнения» — объект JSON: {\"port\": 1}";
  // one `json` field's ceiling at the door (P/06.1): 4000 bytes of its canonical JSON
  const jsonBytes=v=>new TextEncoder().encode(JSON.stringify(v)).length;
  if(jsonBytes(r.when)>4000)return"«если» — больше 4000 байт";
  if(jsonBytes(r.then)>4000)return"«то» — больше 4000 байт";
  if(!Number.isInteger(r.within)||r.within<0||r.within>3600)return"«в пределах» — целое от 0 до 3600 секунд";
  // what one field's form cannot say — the evaluator's refusal of two fields together (V/07.3 Н1.1), said before writing
  if(r.when.length>1&&!r.within)return"два события и больше — нужно «в пределах»: окно, в которое они должны попасть";
  if(r.when.length===1&&r.within)return"«в пределах» — окно между событиями; у одного события окна нет";
  if(r.rate_per_minute&&(!Number.isInteger(r.rate_per_minute)||r.rate_per_minute<1||r.rate_per_minute>600))return"не чаще — целое от 1 до 600 в минуту (0 — по умолчанию)";
  if(r.valid_for&&(!Number.isInteger(r.valid_for)||r.valid_for<10||r.valid_for>600))return"заявка действительна — целое от 10 до 600 секунд (0 — по умолчанию)";
  return"";
}

// Which cluster records a camera is the domain operator's assignment (`domain/placement/rec/<ref>`, P/08.6 Н1.1; V/02.9
// Н1.1): `cluster` — the primary's, `origin` — the camera's, `copies` — the backups' (`when: offline`). The assignment
// creates no row: the recording cluster's operator makes `rec/recordings` there (`cam: ref:<ref>`, `ref`) — the domain's
// door edits only `domain.edit` (enabled, retention_days) and cannot make one. A move leaves the former primary standing
// with its archive until its days run out; its row is its cluster operator's to remove.
async function domainRecording(camera,backup=false){
  const ref=camera.ref;
  if(!ref){pc.toast("Для записи нужно имя камеры в домене");return}
  const route="/domain/placement/rec/"+encodeURIComponent(ref);
  let old=null;
  try{old=await pc.api("GET",route)}catch(e){if(e.status!==404){pc.toast("Назначение недоступно: "+words(e));return}}
  if(backup&&!old){pc.toast("Сначала назначьте основную запись");return}
  const was=old?jsonList(old.copies):[];
  const members=((domView&&domView.members)||[]).filter(m=>!m.left&&!m.refused&&(!backup||m.name!==old.cluster&&!was.includes(m.name)));
  if(!members.length){pc.toast("Нет кластера для этой записи");return}
  const v=await pc.dialog(backup?"Резервная запись":"Основная запись",[
    {name:"cluster",label:"Кластер",value:old&&!backup?old.cluster:"",options:members.map(m=>[m.name,m.name])}],backup?"Добавить резерв":"Назначить");
  if(!v)return;
  if(!members.some(m=>m.name===v.cluster)){pc.toast("Выберите кластер из списка");return}
  const primary=backup?old.cluster:v.cluster;
  // copies: the other executors, ascending, no repeats, not the primary (P/08.6 Н2)
  const copies=[...new Set(backup?[...was,v.cluster]:was)].filter(n=>n!==primary).sort();
  try{
    // by the version read (feature "placement.if-match"): `copies` is written whole, a neighbour's reserve is not lost silently
    const rev=old?Number(old.rev):0;
    await pc.api("PUT",route,{cluster:primary,origin:camera.cluster,copies},FEATURES.has("placement.if-match")&&Number.isSafeInteger(rev)&&rev>=1?{ifMatch:rev}:undefined);

    if(assignmentHost)renderAssignments(assignmentHost);
    const row=`строку rec/recordings с cam: ref:${ref}, ref: ${ref}`+(backup?", дом на резервном томе, when: offline":"");
    const moved=!backup&&old&&old.cluster!==v.cluster?` Запись кластера ${old.cluster} встанет и хранит архив до срока; её строку убирает оператор ${old.cluster}.`:"";
    pc.toast(`${backup?"Резерв назначен":"Запись назначена"} в ${v.cluster}. Оператор ${v.cluster} заводит ${row}.${moved}`);
  }catch(e){writeFailed(e,async()=>{try{PLACEMENTS=await pc.api("GET","/domain/placement");if(assignmentHost)renderAssignments(assignmentHost)}catch(x){}})}
}

    const shown=keepShown&&accountPassword?accountPassword.closest(".live-account-secret"):null;
    if(!shown)forgetAccountPassword();
    const admin=pc.may("admin","domain","live"),disabled=busy||loading?" disabled":"";
    host.innerHTML=`<h1>Учётки потоков</h1><div class="live-accounts">
      <p class="sub">Учётки этого кластера для внешних потребителей видео. Доступ к камерам задают гранты.</p>
      <button type="button" data-account="reload"${disabled}>Обновить</button>
      ${loading?`<p role="status">Загрузка учёток…</p>`:""}
      ${error?`<p class="bad" role="alert">${esc(error)}</p>`:""}
      ${admin?`<form class="live-account-create"><label>Имя <input name="name" value="${esc(draft)}" autocomplete="off" required${disabled}></label>
        <button type="submit"${disabled}>Создать учётку</button></form>`:""}
      <div class="live-account-result"></div>
      ${!loading&&!error&&!rows.length?`<p>Учёток нет.</p>`:""}
      <table><thead><tr><th>Имя</th><th>Состояние</th><th>Изменена</th><th>Кем</th><th></th></tr></thead><tbody>
      ${rows.map((row,i)=>`<tr><td>${esc(row.name)}</td><td>${row.disabled?"Отключена":"Включена"}</td>
        <td>${esc(row.at?fmtDayTime(row.at):"—")}</td><td>${esc(row.by||"—")}</td><td>${admin?
          `<button type="button" data-account="password" data-row="${i}"${disabled}>Новый пароль</button>
           <button type="button" data-account="toggle" data-row="${i}"${disabled}>${row.disabled?"Включить":"Отключить"}</button>
           <button type="button" data-account="delete" data-row="${i}"${disabled}>Удалить</button>`:""}</td></tr>`).join("")}
      </tbody></table></div>`;
    if(shown)host.querySelector(".live-account-result").appendChild(shown);
    host.querySelector('[data-account="reload"]').onclick=()=>{keepShown=false;load()};
    const form=host.querySelector(".live-account-create");
    if(form){
      form.elements.name.oninput=e=>{draft=e.target.value};
      form.onsubmit=e=>{e.preventDefault();const name=form.elements.name.value.trim();if(name)change("POST","/live/accounts",{name},true)};
    }
    host.querySelectorAll("[data-row]").forEach(button=>{button.onclick=()=>{
      const row=rows[Number(button.dataset.row)],path="/live/accounts/"+encodeURIComponent(row.name);
      if(button.dataset.account==="password")change("POST",path+"/password",undefined,true);
      else if(button.dataset.account==="toggle")change("PUT",path,{disabled:!row.disabled});
      else if(pc.confirm("Удалить учётку «"+row.name+"»?","Её гранты также будут сняты."))change("DELETE",path);
    }});
  }
  async function load(){
    if(!live())return;
    loading=true;error="";draw();
    try{
      const result=await pc.api("GET","/live/accounts");
      if(!live())return;
      if(!result||!Array.isArray(result.accounts))throw new Error("Шлюз не вернул список учёток");
      rows=result.accounts.filter(row=>row&&typeof row.name==="string").map(row=>({name:row.name,
        disabled:row.disabled===true,at:typeof row.at==="number"&&Number.isFinite(row.at)?row.at:0,
        by:typeof row.by==="string"?row.by:""}));
    }catch(e){if(live()){rows=[];error=failure(e)}}
    finally{if(live()){loading=false;draw()}}
  }
  async function change(method,path,body,password=false){
    if(!live()||busy||loading)return;
    keepShown=false;busy=true;error="";draw();
    let answer;
    try{
      answer=await pc.api(method,path,body);
      if(!live())return;
      // the gateway answers {account: {name, disabled, at, by}, password} (V/03.6 Н1.2)
      if(password&&(!answer||!answer.account||typeof answer.account.name!=="string"||typeof answer.password!=="string"||!answer.password))
        throw new Error("Шлюз не вернул пароль; запросите новый пароль");
      if(method==="POST"&&path==="/live/accounts")draft="";
      await load();
    }catch(e){if(live())error=(answer===undefined&&unknownOutcome(e)?"Исход неизвестен: ":"")+failure(e);answer=null}
    finally{if(live()){busy=false;draw()}}
    if(password&&answer&&live()){
      const result=host.querySelector(".live-account-result");
      result.innerHTML=`<div class="live-account-secret"><p>Пароль учётки <strong>${esc(answer.account.name)}</strong> показан один раз. Сохраните его сейчас.</p>
        <input class="live-account-password" aria-label="Новый пароль учётки" readonly autocomplete="off">
        <button type="button">Скрыть пароль</button></div>`;
      accountPassword=result.querySelector("input");accountPassword.value=answer.password;keepShown=true;
      result.querySelector("button").onclick=forgetAccountPassword;
    }
  }
  load();
});

// The camera's menu: watch it, its archive (the tabs above).
pc.addMenu("unit",ref=>isCam(ref)&&hasPicture(camById(camOf(ref)))?[{label:"Смотреть видео",run:()=>openAt(ref,"vid")},...(recOn?[{label:"Архив",run:()=>openAt(ref,"rec")}]:[])]:[]);










</script>
