<!--
NOTES — what this page is, its parts and its state (each function is described where it is defined)

# cam.shell.html — the VMS's page over the platform's console module (М10B, beside lesson 12)

**Role.** The page at `/` of a console whose root is `cam` (P/06: a subsystem's own page is `<sub>.shell.html`
beside its manifest, served by the console's root alone). It mounts the module
(`PlatformConsole.mount(#app, {lang, subsystems: [cam, rec, live]})`); rec and live are about the camera (`about`), so the module nests their units under it and the page reads
their manifests with `pc.manifest(name)`. No platform section is drawn here: no login, no tree of servers, no domain card, no
journal — the module's; the page's own tests hold it to that.

## The core: copied with a check
`whereAt`, `doorOf`, `doorFetch`, `yieldCut`, `loadTimeline`, `segmentURL`, `play`, `playNext`, `negotiateLive`,
`stopLive` are the product's (its own page on its `main`), between the two «core» lines below; a check compares each
with the product's page, and what differs is listed as a debt — only shrinking. The places a
recording may lie on are the rows of the table the rec manifest names
(`places.table`), read at `/rec/<table>` — never a table named in the page, here and in the product.

## What the page adds (all through the module's calls)
- `addIcons` — camera, volume (storage); `addDecor("unit")` — a camera's icon and its address as a tag;
  `addFieldEditor("unit", "source")` — the source and what it says (address, vendor, channel), sent by the form.
- `addNote("unit")` — «открытие не завершается» (the device has not opened: `device_state: opening`), «сбой
  устройства» (`phase: failed`, the holder's `why`); `addEventNote` — the VMS's events in words (volumes, cards, the
  footage), everywhere the module lists events.
- `addTab("unit")` «Видео» — the live picture (WHEP at the gateway's door), the timeline of every recording of the
  camera and every place a recording may have left footage on, the events on it, the operator's mark, «Закрепить»
  (what is only in a backup: `POST /rec/requests` for the primary recording), «Удержать показанное».
  The timeline holds the camera's recordings in the other clusters of the domain too (ADR-0061): the book of
  primaries this cluster carries names them by the camera's ref — the primary and each of its `backups` —, at a member
  and at the holder alike, their doors are asked at this console
  (`/domain/at/<cluster>/rec/where/…`), a refusal said in words (403, 404, 502, 503).
  «Архив» — the camera's recordings (`/rec/recordings`: create, switch, delete, home, days, `when` of a backup) and
  its keeps (`/rec/keeps`: make, lift; check at the incidents holder's door; the state in the recorders' own words, from
  their beat — `servers.status` of their rows at `/rec/servers` with `of: keeps`, ADR-0064: here, pushing, pushed,
  at risk, lost, garbled of the recording's writer; kept of the incidents holder; let go — the row's `released_at` —, «нет кадров,
  запечатывать нечего» for a recording with no footage in the stretch).
- Volumes (`/rec/<places table>`): `addTreeNodes("server")` (a server's own), `addTreeNodes("servers")` («Сетевые
  архивы»), `addCard("vol"|"netvols")`, `addBlock("server", {covers: "rec/volumes"})` «Архивы сервера»; declaring
  (`POST`, the row whole: what the dialog does not show is carried from the row; a smaller quota, or one a holder says
  waits — `shrink_pending` —, only with `shrink_confirmed`; `incidents` with `admits: false`) and withdrawing (`DELETE`).
- «Камеру в архив» — `addAction("server")`, `addMenu("server"|"vol")`: a recording of a camera on a volume of the
  server (`POST /rec/recordings {name, cam, home}`).
- `addSection` «Сценарии» (after units) — the auto subsystem's scenarios: the list and the editor, the actions the
  auto manifest's `then` accepts (the page's catalogue of actions, held to the manifest by a check), the last firings.
- The domain through the VMS's eyes, from the holder's `/domain` view (`units`, `tables`): `addTreeNodes("member")`
  — a member's cameras and archives (a member of one camera stands in the tree as its camera: `replaces`),
  `addCard("dc"|"da")`, `addBlock("member")`, `addBlock("domain")` «Назначения записи» (`domain/placement/rec/`).
- `addMenu("unit")` — «Смотреть видео», «Архив».
- «Учётки потоков» в разделе прав — `addTreeNodes("access")` и `addCard`: свои `/live/accounts`, пароль только
  ответом создания или смены, без хранения в состоянии страницы.

## Routes the page itself uses
`/rec/recordings`, `/rec/<places table>`, `/rec/keeps`, `/rec/requests`, `/rec/servers`, `/live/streams`, `/auto/scenarios`,
`/events`, `/marks`, `/live/accounts` (writes through `pc.api`), `/domain/rec/books/primaries`; the holders' doors from
`/rec/where/<recording>`, `/rec/where/<table>/<place>?unit=<recording>`, `/live/where/<camera>`, and another
cluster's from `/domain/at/<cluster>/rec/where/…` (ADR-0061); at the incidents holder's door,
`POST /keeps/<keep>/verify?recording=<r>`. Everything else is the module's.

<script>
"use strict";
// The VMS's words (display) and what its subsystems are about (about) the module reads from each one's manifest.
const SUBS=["cam","rec","live"];
// The module's API this page is written for (P/07 Н1.5 `version`): another version is not used — the page says so.
const SHELL_API=1;
if(PlatformConsole.version!==SHELL_API){document.getElementById("app").textContent="Страница VMS написана для версии "+SHELL_API+" модуля консоли, а загружена "+PlatformConsole.version+".";throw new Error("console module version")}
const pc=PlatformConsole.mount(document.getElementById("app"),{lang:"ru",subsystems:SUBS});
window.platformConsole=pc;
// ── Helpers ───────────────────────────────────────────────────────────────────────────────────────────────────
// Everything the page draws from data goes through esc: a camera's name, an event's note, a volume's url are TEXT.
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=q=>document.querySelector(q);
const card=(title,body,act="")=>`<div class="card"><div class="ch">${title}${act}</div><div class="cb">${body}</div></div>`;
const fldRo=(label,value)=>`<div><label>${esc(label)}</label><input type="text" value="${esc(value??"")}" readonly disabled></div>`;
const getJSON=async path=>{const r=await fetch(path);if(!r.ok)throw new Error(path+": "+r.status);return r.json()};
// A click (a change, for a field) on the page's own markup is wired here, never in an attribute: the console's CSP
// runs no inline handler. `data-act` names the handler; the element and its dataset are what it gets.
function wire(host,acts){
  host.querySelectorAll("[data-act]").forEach(el=>{const f=acts[el.dataset.act];if(!f)return;
    if(/^(SELECT|INPUT|TEXTAREA)$/.test(el.tagName))el.onchange=e=>f(el,e);
    else el.onclick=e=>{e.preventDefault();e.stopPropagation();f(el,e)}});
}
function gbytes(n){return n?(n/1073741824).toFixed(1)+" ГБ":"—"}
function fmtDayTime(t){return t?new Date(t*1000).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}):"—"}
function durRu(sec){sec=Math.round(+sec||0);const m=Math.floor(sec/60),s2=sec%60;return m?`${m} мин${s2?" "+s2+" с":""}`:`${s2} с`}
const fmtT=t=>new Date(t*1000).toLocaleString("ru-RU",{hour12:false}).replace(",","");
const fmtHMS=t=>new Date(t*1000).toLocaleTimeString("ru-RU",{hour12:false});
// The units as the module last read them (refresh): the cameras, their recordings; and the domain's view.
let UNITS={},domView=null;
pc.on("refresh",d=>{if(d&&d.units)UNITS=d.units;if(d&&"domain" in d)domView=d.domain});
const camById=id=>(UNITS.cam||[]).find(u=>String(u.id)===String(id))||null;
const camName=id=>{const c=camById(id);return c?(c.name||"камера "+c.id):"камера "+id};
const recsOfCam=id=>(UNITS.rec||[]).filter(r=>String(r.cam)===String(id));
// C2 observations shown by the receiving console: provenance and declared show fields only.
let PRIMARIES=null,PLACEMENTS=null,assignmentHost=null;
pc.on("refresh",async d=>{
  if(!(d&&"domain" in d))return;
  const get=async path=>{try{const r=await fetch(path);return r.ok?await r.json():null}catch(e){return null}};
  [PRIMARIES,PLACEMENTS]=await Promise.all([get("/domain/rec/books/primaries"),get("/domain/placement")]);
  if(assignmentHost&&assignmentHost.isConnected)renderAssignments(assignmentHost);
});
function farRecsOfCam(id){
  const c=camById(id),ref=c&&c.ref,p=ref&&PRIMARIES&&PRIMARIES[ref],marker=PRIMARIES&&PRIMARIES[""];
  if(!p||!marker||!Array.isArray(marker.missing)||!Array.isArray(p.entries)||!Array.isArray(p.missing))return[];
  const own=new Set(recsOfCam(id).map(r=>String(r.id))),out=[],seen=new Set();
  for(const e of p.entries){
    if(!e||typeof e.member!=="string"||!e.member||typeof e.item!=="string"||!e.item||
       typeof e.recording!=="string"||!e.recording||!["primary","backup","card"].includes(e.role)||
       typeof e.running!=="boolean"||p.missing.includes(e.member))continue;
    const key=e.member+"|"+e.recording;if(own.has(e.recording)||seen.has(key))continue;seen.add(key);
    out.push({id:e.recording,cluster:e.member,home:"",backup:e.role!=="primary",cam:String(id)});
  }
  return out;
}
// where a recording's door is asked: its own cluster's console, or another's through this one (ADR-0061)
const recWhere=rec=>(rec.cluster?`/domain/at/${encodeURIComponent(rec.cluster)}`:"")+"/rec/where/"+encodeURIComponent(rec.id);
const placeWhere=(rec,T,place)=>(rec.cluster?`/domain/at/${encodeURIComponent(rec.cluster)}`:"")+`/rec/where/${encodeURIComponent(T)}/${encodeURIComponent(place)}?unit=${encodeURIComponent(rec.id)}`;
const camOf=ref=>String(ref).replace(/^unit:cam\//,"");
const isCam=ref=>String(ref).startsWith("unit:cam/");
const goTab=t=>setTimeout(()=>{const x=document.querySelector(`.pc-tabs [data-tab="${t}"]`);if(x)x.click()},60);

// ── A camera: its icons, its address, its notes, its events ───────────────────────────────────────────────────
pc.addIcons({
  camera:`<path fill="currentColor" d="M1.4 3.6h7.6c.9 0 1.6.7 1.6 1.6v5.6c0 .9-.7 1.6-1.6 1.6H1.4C.5 12.4 0 11.7 0 10.8V5.2c0-.9.5-1.6 1.4-1.6z"/><path fill="currentColor" opacity=".75" d="M10.6 5.6 14.6 3.5c.55-.28 1.2.12 1.2.75v7.5c0 .63-.65 1.03-1.2.75l-4-2.1V5.6z"/>`,
  storage:`<path fill="currentColor" d="M2 2.4h12c.6 0 1 .4 1 1v2.2H1V3.4c0-.6.4-1 1-1zm-1 4.4h14v2.4H1zm0 3.6h14V12.6c0 .6-.4 1-1 1H2c-.6 0-1-.4-1-1zm3 1.1c0 .4.3.7.7.7s.7-.3.7-.7-.3-.7-.7-.7-.7.3-.7.7z"/>`
});
// The camera's source, read for a person: driverpack://<vendor>/<address>/ch/<channel>, or any other URL's host — the
// one thing about a camera that does not follow from the manifest's types (a field editor; the module's form sends it).
function parseSource(src){
  const out={host:"",vendor:"",channel:""};
  if(!src)return out;
  try{const u=new URL(src),parts=u.pathname.split("/").filter(Boolean).map(decodeURIComponent);
    if(u.protocol==="driverpack:"){out.vendor=decodeURIComponent(u.hostname);out.host=parts[0]||"";out.channel=parts[1]==="ch"?parts[2]||"":""}
    else out.host=u.hostname+(u.port?":"+u.port:"")}
  catch(e){out.host=String(src)}
  return out;
}
pc.addDecor("unit",(ref,u)=>isCam(ref)?{icon:"camera",badge:u?parseSource(u.source).host:""}:{});
pc.addFieldEditor("unit","source",(host,ref,obj,value,set)=>{
  host.innerHTML=`<div class="g"><div><label>Источник</label><input class="cam-src" value="${esc(value)}" autocomplete="off"></div><span class="cam-src-parts" style="display:contents"></span></div>`;
  const inp=host.querySelector(".cam-src"),parts=host.querySelector(".cam-src-parts");
  const show=v=>{const s2=parseSource(v);parts.innerHTML=fldRo("Адрес",s2.host)+fldRo("Производитель",s2.vendor)+fldRo("Канал",s2.channel)};
  show(value);
  if(!pc.may("edit",ref))inp.disabled=true;
  inp.oninput=()=>{set(inp.value);show(inp.value)};
});
// What the driver host does with a camera, said aloud when it goes wrong: a device that has not opened (its open has
// not come back — the address, the network, the credentials), a camera its worker could not run (its words).
pc.addNote("unit",(ref,u)=>{
  if(!isCam(ref)||!u)return"";
  if(u.device_state==="opening")return"Устройство ещё открывается — если это не проходит, открытие не завершается: проверьте адрес, сеть и учётные данные камеры.";
  if(u.phase==="failed"){const w=u.reason||u.why;return`Хост драйверов: сбой устройства${w?" — "+w:""}.`}
  return"";
});
// The VMS's events in words in the module's journal and everywhere it lists events (the platform's it says itself).
let inNote=false;
pc.addEventNote(e=>{if(inNote||!/^(card\.|archive\.)/.test(e.kind||""))return"";inNote=true;try{return evNoteRu(e)}finally{inNote=false}});
function evNoteRu(e){
  const k=e.kind||"";
  if(k==="archive.volume.shrunk")return`том ${e.volume??"?"}${e.was!=null?": "+gbytes(+e.was)+" → "+gbytes(+e.quota_bytes):""} — самое старое отдано первым`;
  if(k==="archive.footage.dropped")return`том ${e.volume??"?"} · потеряно ${durRu(e.seconds)}: писатель взял кадры и не успел записать, когда том отдали`;
  if(k==="card.prebuffer.short")return`кольцо карты держит ${durRu(e.reach_s)}, а обрыв замечают за ${durRu(e.need_s)}: начало обрыва не попадёт в запись`;
  if(k==="card.failing")return`карта камеры: ${e.state||"?"}${e.error?" · "+e.error:""}`;
  if(k==="archive.backfill.refused")return`дозапись не принята${e.error?": "+e.error:""}`;
  return pc.eventNote(e);   // the platform's own events the module describes
}
// An event's words: its subsystem's display.kinds, any of the VMS's (a line about the camera from a subsystem about
// it), then the platform's own (the module's).
const evKindRu=e=>(pc.display(e.subsystem).kinds||{})[e.kind]||SUBS.map(n=>(pc.display(n).kinds||{})[e.kind]).find(Boolean)||pc.kindWord(e)||"";

// ── «Видео»: the live picture, the recorded spans and the events on one timeline ─────────────────────────────────
// Where the bytes come from — the holders' doors and nothing else (the owner's decision: bytes go past the console).
// A camera's recordings each have the door of the recorder holding them (/rec/where/<recording>), and every place they
// may have lain on the door of its holder (/rec/where/<table>/<place>?unit=<recording>); its live stream, the door
// of its gateway (/live/where/<camera>). A door is {url, token, expires}: Bearer for fetch and WHEP, ?t= for the
// player; asked again before its token runs out, and once at once on a 401.
const DOORS={};
const V={spans:[],events:[],queue:[],evfilter:"",live:null,connecting:false,lo:0,hi:0,note:"",evstate:"",
         truncated:false,cam:null};
const VOL_BACKUP="backup";
// a backup recording is one homed on a backup volume or on a camera's card (V/02.1 `when`, V/02.6)
const BACKUP_KINDS=[VOL_BACKUP,"edge"];
const PALETTE=["#c58a1a","#8e44ad","#2a9d5c","#d35400","#16a085","#7f8c8d"];
const palette={};
const subColor=s=>palette[s]||(palette[s]=PALETTE[Object.keys(palette).length%PALETTE.length]);
const WINDOWS=[["1h","Час",3600],["6h","6 часов",21600],["24h","Сутки",86400],["all","Всё",0]];
let winKey="1h",KEEP_ON=false;
function winRange(){
  const now=Date.now()/1000,w=WINDOWS.find(x=>x[0]===winKey);
  if(!w||!w[2])return[0,1e12];
  return[now-w[2],now+60];
}
// A span is played in pieces the page cuts (60 s, as the product's console cuts): /segment/<recording>/e<epoch>/
// <fromMs>-<toMs>[.<source>].mp4 at the door the span came from, the token as ?t= — a media element sets no header.
// Every moment once (М10B, lesson 24): the spans overlap — two epochs over the same minutes, two volumes, a keep's copy
// — so a fenced span (an epoch another took over) is played only when it is the one clicked, and `until` remembers the
// end of what is queued: the next span is queued from there, not from its start. From a moment `t`, the pieces that end
// after it, the first entered at `t` (`off`: its scale starts at zero).
const PIECE=60;
function piecesFrom(i,t){
  const out=[];let until=-Infinity;
  V.spans.forEach((s,j)=>{
    if(j<i||!s.media||(s.fenced&&j!==i))return;
    for(let a=Math.max(s.start,until);a<s.end;a+=PIECE){
      const p={i:j,start:a,end:Math.min(s.end,a+PIECE),off:0};
      if(t&&p.end<=t)continue;
      if(t&&!out.length&&t>p.start)p.off=t-p.start;
      out.push(p);
    }
    until=Math.max(until,s.end);
  });
  return out;
}
function setCap(text){const el=$("#playing");if(el)el.textContent=text}
// An event stands on the timeline where it HAPPENED (`occurred`), not where it was written (`t`).
function evAt(e){return e.occurred||e.t}
function evLate(e){return e.occurred&&e.t-e.occurred>2?` записано в ${fmtT(e.t)} · `:""}

// ── core: COPY WITH A CHECK — the product's page (main), function by function, each checked against it ──────────
async function whereAt(url){
  try{const r=await fetch(url);let d={};try{d=await r.json()}catch(e){}
    return{status:r.status,door:d&&d.door&&d.door.url?d.door:null,missing:r.headers.get("X-Unreachable")||(d&&d.unreachable)||"",error:d&&d.error||""}}
  catch(e){return{status:0,door:null,missing:"",error:String(e)}}
}
async function doorOf(where,fresh){
  const d=DOORS[where];
  if(!fresh&&d&&d.expires-Date.now()/1000>20)return d;
  const w=await whereAt(where);
  DOORS[where]=w.door?{url:String(w.door.url).replace(/\/+$/,""),token:w.door.token||"",expires:+w.door.expires||0}:null;
  return DOORS[where];
}
async function doorFetch(where,path,init={}){
  let d=await doorOf(where);if(!d)return null;
  const go=()=>fetch(d.url+path,{...init,headers:{...(init.headers||{}),Authorization:"Bearer "+d.token}});
  let r=await go();
  if(r.status===403){d=await doorOf(where,true);if(!d)return null;r=await go()}   // its token would not do (door token contract: 403): where again, once
  return r;

function yieldCut(spans){
  const solid=spans.filter(s=>!s.yields);
  const holes=(a,b)=>{const out=[];let at=a;
    for(const o of solid.filter(o=>o.end>a&&o.start<b).sort((x,y)=>x.start-y.start)){if(o.start>at)out.push([at,Math.min(o.start,b)]);at=Math.max(at,o.end)}
    if(at<b)out.push([at,b]);return out};
  return[...solid,...spans.filter(s=>s.yields).flatMap(s=>holes(s.start,s.end).map(([a,b])=>({...s,start:a,end:b})))];
}
async function loadTimeline(id){
  const [from,to]=winRange();
  // The camera's footage is its recordings' — each through its own recorder's door, and through the door of every
  // volume it may have lain on (a recording moves; what it left behind stays on the old volume, read where it lies).
  // The raw ranges {start_ms, end_ms, epoch, source, yields} are merged without twins by (recording, start, end,
  // epoch, source), the recording's own door first; a volume nobody holds is named, not dropped silently.
  const recs=recsOfCam(id).concat(farRecsOfCam(id));
  // the places a recording may lie on: the rows of the table rec's manifest names (manifest.places), not a name written here
  const T=((pc.manifest("rec")||{}).places||{}).table||"";
  let places=[];
  if(T){try{const d=await (await fetch(`/rec/${encodeURIComponent(T)}`)).json();places=d[T]||[]}catch(e){places=[]}}
  const asks=[],missing=new Set(),refused=new Map(),seen=new Set(),spans=[];
  // a recording on a backup volume: what it has yields to the primary's, and its remainder is «only in the backup»;
  // another cluster's recording says it itself (its volumes are that cluster's)
  const backupRec=rec=>{if(rec.cluster)return!!rec.backup;const v=places.find(x=>x.name===rec.home);return!!v&&BACKUP_KINDS.includes(v.kind)};
  const take=(rec,where,list)=>{const bk=backupRec(rec);for(const x of list||[]){
    const k=[rec.cluster||"",rec.id,x.start_ms,x.end_ms,x.epoch,x.source||""].join("|");if(seen.has(k))continue;seen.add(k);
    spans.push({start:x.start_ms/1000,end:x.end_ms/1000,epoch:x.epoch,fenced:!!x.fenced,events:0,source:x.source||"",recording:rec.id,where,media:true,yields:!!x.yields||bk,backupOnly:bk})}};
  const ask=async(rec,where,place)=>{
    const w=await whereAt(where);
    // another cluster's answer, in words: its gate does not know you (403), its console is not reached (502), it is not
    // a member this console can reach (404 from the hop), the members' list does not read here (503)
    if(!w.door&&rec.cluster&&!place&&[403,404,502,503].includes(w.status)){refused.set(rec.cluster,w.status);return null}
    if(!w.door){if(place&&w.status===404&&w.missing)missing.add(w.missing);return null}   // «no such place»: nothing to say
    try{const r=await doorFetch(where,`/timeline/${encodeURIComponent(rec.id)}?from=${from}&to=${to}`);
      if(!r||!r.ok){missing.add(place||rec.id);return null}
      const m=r.headers.get("X-Unreachable");if(m)missing.add(m);
      const u=r.headers.get("X-Unavailable");if(u)u.split(",").map(x=>x.trim()).filter(Boolean).forEach(x=>missing.add(x));   // volumes of it nobody holds
      return await r.json()}
    catch(e){missing.add(place||rec.id);return null}
  };
  // the recordings' own doors first (theirs win a twin), then the volumes'
  const own=await Promise.all(recs.map(rec=>ask(rec,recWhere(rec),"")));
  recs.forEach((rec,i)=>take(rec,recWhere(rec),own[i]));
  // the places: this cluster's table for its own recordings; another cluster's recording, its home there
  for(const rec of recs)for(const name of rec.cluster?(rec.home&&!refused.has(rec.cluster)?[rec.home]:[]):places.map(v=>v.name))
    asks.push((async()=>{const where=placeWhere(rec,T||"volumes",name);take(rec,where,await ask(rec,where,name))})());
  await Promise.all(asks);
  // Лента строится по дверям; недоступное названо: его архив не утрачен, а лента без него неполная — это
  // единственный сбой, который оператор иначе не увидел бы.
  const unr=[...missing];
  const WHY={403:c=>`на ${c} вас не знают: его архив не показан`,502:c=>`консоль ${c} не видна по сети: его архив смотрится только там, где её видно`,404:c=>`консоль ${c} отсюда не известна: его архив не показан`,503:c=>`список членов домена здесь не читается: архив ${c} не показан`};
  V.note=(unr.length?`Недоступн${unr.length>1?"ы":"о"}: ${unr.join(", ")} — ${unr.length>1?"их архивы недоступны":"его архив недоступен"}, а не утрачен${unr.length>1?"ы":""}; лента может быть неполной.`:"")
    +[...refused].map(([c,st])=>" "+WHY[st](c)+".").join("");V.note=V.note.trim();
  V.spans=yieldCut(spans).sort((a,b)=>a.start-b.start);
  V.cam=id;
  await fetchEvents(id,from,to);
  const now=Date.now()/1000;
  const fin=winKey==="all";
  V.lo=fin?Math.min(...V.spans.map(s=>s.start),...V.events.map(e=>e.t),now-3600):from;
  V.hi=fin?Math.max(...V.spans.map(s=>s.end),...V.events.map(e=>e.t),now):to;
  drawTimeline();
}
async function segmentURL(s,p){
  const d=await doorOf(s.where);if(!d)return"";
  return `${d.url}/segment/${encodeURIComponent(s.recording)}/e${s.epoch}/${Math.round(p.start*1000)}-${Math.round(p.end*1000)}${s.source?"."+s.source:""}.mp4?t=${encodeURIComponent(d.token)}`;
}
function play(i){V.queue=piecesFrom(i,0);playNext()}
async function playNext(){
  if(!V.queue.length)return;
  stopLive(true);
  const p=V.queue.shift(),s=V.spans[p.i];
  [...$("#timeline").children].forEach((el,j)=>el.classList.toggle("playing",j===p.i));
  const cap=$("#playing");
  if(cap)cap.textContent=`${fmtT(p.start)} – ${fmtT(p.end)} · эпоха ${s.epoch}`+
    (s.backupOnly?" · из резервного архива":"")+(s.source==="backfill"?" · дозаписано из резервного":"");
  const v=$("#player");v.srcObject=null;v.crossOrigin="anonymous";
  v.src=await segmentURL(s,p);

  // again once after five seconds; then the queue goes on.
  v.onerror=()=>{if(p.again){setCap("кусок не отдан дверью — дальше");playNext();return}
    p.again=true;setCap("дверь архива занята или отказала — повтор через 5 с");setTimeout(()=>{V.queue.unshift(p);playNext()},5000)};
  if(p.off)v.addEventListener("loadedmetadata",()=>{v.currentTime=p.off},{once:true});
  v.play().catch(()=>{});
}
async function negotiateLive(id){
  let pc;
  try{pc=new RTCPeerConnection()}catch(e){setCap("браузер не умеет WebRTC");return}
  pc.addTransceiver("video",{direction:"recvonly"});
  pc.ontrack=e=>{const v=$("#player");if(!v)return;v.src="";v.srcObject=e.streams[0];v.play().catch(()=>{})};
  // Шлюз сам кладёт трубку, когда камера переехала на другой воркер или её поток оборвался: старое
  // соединение уже ничего не покажет. Зритель возвращается сам — после случайной паузы, чтобы пятьдесят
  // зрителей одной камеры не пришли в один миг.
  // «disconnected» браузер держит около полминуты, прежде чем признать «failed»; шлюз, положивший трубку,
  // не вернётся, поэтому пяти секунд без связи достаточно.
  pc.onconnectionstatechange=()=>{
    if(!V.live||V.live.pc!==pc)return;
    const st=pc.connectionState;
    if(st!=="failed"&&st!=="closed"&&st!=="disconnected")return;
    const again=()=>{
      if(!V.live||V.live.pc!==pc||pc.connectionState==="connected")return;
      setCap("живое: связь со шлюзом потеряна, переподключаюсь…");
      startLive(id);
    };
    setTimeout(again,(st==="disconnected"?5000:1000)+Math.random()*3000);
  };
  const offer=await pc.createOffer();
  await pc.setLocalDescription({type:"offer",sdp:h265Dynamic(offer.sdp)});
  // The first viewer makes the stream (POST /live/streams {cam}; «exists» — somebody watches already), then the
  // offer goes to its gateway's door: 404 (not yet), 503 (full, busy), 500 (answer failed) — again after `Retry-After` or
  // 1.5 s, up to 8 times (V/03.3 Н4); 403 — where again, once.
  try{await window.platformConsole.api("POST","/live/streams",{cam:String(id)})}
  catch(e){if(!(e.status===409&&e.body&&e.body.error==="exists")){setCap("живое отклонено: "+e.message);pc.close();return}}
  const where="/live/where/"+encodeURIComponent(id);
  let r=null,tries=0;
  for(;;){
    try{r=await doorFetch(where,`/whep/${encodeURIComponent(id)}`,{method:"POST",headers:{"Content-Type":"application/sdp"},body:pc.localDescription.sdp})}
    catch(e){r=null}
    if(r&&![404,500,503].includes(r.status))break;
    if(++tries>8)break;
    setCap(`живое: ждём шлюз… (${tries})`);
    const ra=r?Number(r.headers.get("Retry-After")):NaN;

  }
  if(!r){setCap("живое: шлюз не взял поток");pc.close();return}
  if(r.status!==201){
    let d={};try{d=await r.json()}catch(e){}
    setCap("живое отклонено: "+(d.detail||d.error||r.status));
    pc.close();return;
  }
  await pc.setRemoteDescription({type:"answer",sdp:await r.text()});
  const session=r.headers.get("Location")||"";
  V.live={pc,session,where,since:Date.now()/1000-30,seen:new Set(),timer:null};
  [...($("#timeline")?.children||[])].forEach(el=>el.classList.remove("playing"));
  let via="";
  try{via=new URLSearchParams(session.split("?")[1]).get("gateway")||""}catch(e){}
  setCap("живое"+(via?" · через "+via:""));
  const btn=$("#liveBtn");if(btn){btn.textContent="Остановить";btn.classList.add("on")}
  const feed=$("#livefeed");
  if(feed){feed.style.display="block";feed.innerHTML='<small class="sub">события, пока вы смотрите — что видят подсистемы на этом объекте</small>'}
  V.live.timer=setInterval(()=>pollLive(id),3000);pollLive(id);
}
function stopLive(keepUi){
  if(!V.live)return;

  if(V.live.session)doorFetch(V.live.where,"/"+V.live.session.replace(/^https?:\/\/[^/]+/,"").replace(/^\/+/,""),{method:"DELETE"}).catch(()=>{});
  clearInterval(V.live.timer);
  try{V.live.pc.close()}catch(e){}
  V.live=null;
  const v=$("#player");if(v)v.srcObject=null;
  if(!keepUi){
    const feed=$("#livefeed");if(feed)feed.style.display="none";
    const btn=$("#liveBtn");if(btn){btn.textContent="Живое видео";btn.classList.remove("on")}
  }
}

// What is only in a backup, and «Закрепить»: the operator sees not a setting but the minutes the primary lacks. The
// pieces glue into ranges, a range is one request of the camera's primary recording (`POST /rec/requests {unit:

    const last=out[out.length-1];

  });
  return out;

// ── Живое видео через WHEP ───────────────────────────────────────────────────────────────────────────────────────
// The browser makes the offer; the first viewer makes the stream's row (`live/streams/<camera>`), the controller places
// it on a gateway, and the offer goes to that gateway's door. RTP goes gateway → browser: neither the console nor a
// worker carries media.
async function toggleLive(id){if(V.live){stopLive();return}await startLive(id)}
async function startLive(id){

// H.265 in the browser's offer: Chrome numbers it below 96, and GStreamer's packer takes only 96–127. The gateway
// answers with the offer's numbers, so H.265's (and their rtx, apt=) move to free ones in 96–127 here.
function h265Dynamic(sdp){
  const used=new Set([...sdp.matchAll(/a=rtpmap:(\d+) /g)].map(m=>+m[1]));

// ── «Камеру в архив»: a recording of a camera on a volume ───────────────────────────────────────────────────────
// opt: cam — the camera chosen already (from its archive tab), server — the server whose volumes it may go to (from
// the server), home — the volume (from its card). The name is the camera's id, or <id>-<volume> when that is taken:
// a camera's recordings are one per volume, and the name is their key (their epoch, their streams).
async function addToArchive(opt){
  opt=opt||{};
  if(recOn===false){pc.toast("Консоль не монтирует rec");return}
  const homes=homesFor(opt.cam).filter(v=>(!opt.server||v.server===opt.server||v.kind===VOL_NET)&&(!opt.home||v.name===opt.home));
  // a camera the server (the volume) writes already is not offered again: one camera, one recording a place
  const here=opt.home?[opt.home]:opt.server?serverVolumes(opt.server).map(v=>v.name):[];
  const cams=(UNITS.cam||[]).filter(c=>opt.cam!=null?String(c.id)===String(opt.cam):!recs.some(r=>String(r.cam)===String(c.id)&&here.includes(r.home)));
  if(!cams.length){pc.toast("Камер, которых этот архив ещё не пишет, нет");return}
  const v=await pc.dialog(opt.server?"Камеру в архив сервера "+opt.server:"Новая запись камеры",[
    {name:"cam",label:"Камера",options:cams.map(c=>[String(c.id),(c.name||"камера "+c.id)+" · "+c.id])},
    {name:"home",label:"Архив",options:(opt.home||opt.server?[]:[["","любой свободный том"]]).concat(homes.map(x=>[x.name,x.name+" · "+volKind(x)]))},
    {name:"days",label:"Срок хранения, дн",value:"30"}],"Создать");
  if(!v)return;
  const days=parseInt(v.days,10);
  if(!(days>=1)){pc.toast("Срок хранения — целое число дней, не меньше 1");return}
  const hv=volByName(v.home);
  if(hv&&hv.kind==="edge"&&String(hv.cam)!==String(v.cam)){pc.toast(`Том «${hv.name}» — карта камеры ${hv.cam}: только для её записей`);return}
  const taken=new Set(recs.map(r=>r.id));
  const name=!taken.has(v.cam)?v.cam:v.home?`${v.cam}-${v.home}`:v.cam;
  if(taken.has(name)){pc.toast(`Запись «${name}» уже есть`);return}
  try{await pc.api("POST","/rec/recordings",{name,cam:v.cam,retention_days:days,...(v.home?{home:v.home}:{})});await reloadRec();pc.toast("Запись создана")}
  catch(e){pc.toast("Отказано: "+e.message)}
}

const shrinkPending=v=>{const w=recWorkers().find(x=>v.held_by&&x.worker===v.held_by);return w&&+w.status.shrink_pending>0?+w.status.shrink_pending:0};

// Declaring a volume: the row written whole (`POST /rec/<table>`). A smaller quota for a volume that is there erases
// its oldest footage — the recorder applies it only with `shrink_confirmed` equal to it, the operator's second word.
async function openVolume(kind,server,was){
  const net=kind===VOL_NET;
  const v=await pc.dialog(was?"Объявление тома "+was.name:net?"Новый сетевой архив":"Новый архив на сервере",[
    {name:"name",label:"Имя",value:was?was.name:net?"nas":(server||"local")},
    {name:"kind",label:"Вид",options:(net?[VOL_NET]:["local","backup","incidents"]).concat(was&&!["local","backup","incidents",VOL_NET].includes(was.kind)?[was.kind]:[]).map(k=>[k,VOL_KIND[k]||k])},
    {name:"url",label:net?"Адрес":"Путь",value:was?was.url||"":net?"s3://bucket/vms":"file:///var/lib/vms/archive"},
    {name:"quota",label:"Квота, ГБ",value:was?String(Math.round(was.quota_bytes/1073741824*100)/100):"100"},
    ...(net?[{name:"access_key",label:"Ключ доступа (ID)",value:was?was.access_key||"":""},{name:"access_secret",label:"Секрет ключа",type:"password",help:"пусто — оставить текущий; при смене адреса впишите заново"}]
          :[{name:"server",label:"Сервер",value:was?was.server||"":server||""}])],was?"Записать":"Объявить");
  if(!v)return;
  const body={name:v.name.trim(),kind:v.kind,url:v.url.trim(),quota_bytes:Math.round((parseFloat(v.quota)||0)*1073741824)};
  if(!net)body.server=(v.server||"").trim();
  if(v.access_key&&v.access_key.trim())body.access_key=v.access_key.trim();
  if(v.access_secret)body.access_secret=v.access_secret;
  const old=volByName(body.name);
  // POST of a table row replaces it whole (P/06.1): what the dialog does not show is carried from the row as it is
  if(old){if(old.enabled===false)body.enabled=false;if(old.kind==="edge"&&body.kind==="edge"&&old.cam!=null)body.cam=old.cam}
  if(body.kind==="incidents")body.admits=false;   // evidence takes no recordings (the table's schema, V/02.1 Н1.2)
  const pend=old?shrinkPending(old):0;
  if(old&&old.quota_bytes&&(body.quota_bytes<old.quota_bytes||pend&&body.quota_bytes===old.quota_bytes)){
    if(!pc.confirm(`Уменьшить том «${body.name}»${body.quota_bytes<old.quota_bytes?` с ${gbytes(old.quota_bytes)}`:""} до ${gbytes(body.quota_bytes)}?`,"Самое старое будет стёрто, чтобы уместиться: стёртое не вернуть."))return;
    body.shrink_confirmed=body.quota_bytes;
  }else if(old&&body.quota_bytes===old.quota_bytes&&+old.shrink_confirmed)body.shrink_confirmed=+old.shrink_confirmed;
  try{await pc.api("POST","/rec/"+encodeURIComponent(T_PLACES),body);await reloadRec();pc.select("vol:"+body.name);pc.toast(body.shrink_confirmed?"Квота тома уменьшена":"Архив объявлен")}
  catch(e){pc.toast("Отказано: "+e.message)}
}

// ── «Сценарии»: the auto subsystem's scenarios, a section of the page ───────────────────────────────────────────
// A scenario is a unit of auto: «when this happened (and that, within N seconds) — ask for this». Its evaluator reads
// the same events this page shows and files a REQUEST, performed by whoever holds the unit. The catalogue of actions
// is the auto manifest's `then` (each of its `anyOf`, with its required fields): the operator cannot ask for what no
// executor is written for — a check of the specification holds the two together. A detector's actions are offered when
// the console mounts det.
const RACTIONS=[
  {sub:"cam",action:"output",label:"Щёлкнуть реле",fields:[{id:"unit",label:"Устройство"},{id:"port",label:"Реле №"},{id:"state",label:"Состояние",opt:true},{id:"pulse_ms",label:"Импульс, мс",opt:true}]},
  {sub:"cam",action:"preset",label:"Встать в пресет",fields:[{id:"unit",label:"Камера"},{id:"n",label:"Пресет №"}]},
  {sub:"rec",action:"record",label:"Записывать",fields:[{id:"cam",label:"Камера"},{id:"minutes",label:"Минут"},{id:"archive",label:"Архив",opt:true}]},
  {sub:"det",action:"detect",label:"Искать детектором",fields:[{id:"cam",label:"Камера"},{id:"kind",label:"Детектор"},{id:"minutes",label:"Минут"}]},
  {sub:"det",action:"scan",label:"Искать в архиве",fields:[{id:"cam",label:"Камера"},{id:"kind",label:"Детектор"},{id:"before",label:"Секунд до",opt:true},{id:"after",label:"Секунд после",opt:true},{id:"rec",label:"Запись",opt:true}]}];
let RSEL=null,ruleDraft=null,ruleFires={},autos=[],autoOff=false,detOn=false,RULES_HOST=null;
const actionsOn=()=>RACTIONS.filter(a=>a.sub!=="det"||detOn);
const actionKind=a=>RACTIONS.find(k=>k.sub===a.sub&&k.action===a.action)||{sub:a.sub,action:a.action,label:(a.sub||"?")+"."+(a.action||"?"),fields:[]};
// The events a trigger may name: the words the VMS's manifest has for its kinds (display.kinds), and any other typed in.
const triggerKinds=()=>Object.entries(pc.display("cam").kinds||{});
async function loadAuto(){
  try{
    const d=await getJSON("/auto/scenarios");
    // A scenario exists while its row does; a holder that has not noticed a deletion yet speaks of it last.
    const seen={};(d.rows||[]).forEach(r=>{seen[String(r.id)]=r});
    autos=(d.configured||[]).map(c=>{const r=seen[String(c.id)]||null;
      return{...c,id:String(c.id),worker:r?r.worker:null,phase:r?r.phase:"silent",why:r?r.why:"",unfit:r&&r.unfit||null}})
      .sort((a,b)=>a.id.localeCompare(b.id));
    autoOff=false;
  }catch(e){autos=[];autoOff=true}
  try{detOn=(await fetch("/det/manifest")).ok}catch(e){detOn=false}
}
// The last firings: the evaluator writes `fired` into the scenario's bucket — «why did the door open at 14:02».
async function loadFires(id){
  const to=Date.now()/1000,from=to-86400;
  try{const d=await getJSON(`/events?subsystem=auto&unit=${encodeURIComponent("auto/"+id)}&from=${from}&to=${to}&limit=50`);
    ruleFires[id]=(d.events||[]).filter(e=>e.kind==="fired").sort((a,b)=>b.t-a.t).slice(0,10)}
  catch(e){ruleFires[id]=[]}
  renderRules();
}
const jsonList=v=>{try{const x=typeof v==="string"?JSON.parse(v):v;return Array.isArray(x)?x:[]}catch(e){return[]}};
function ruleOf(r){return{id:r.id,name:r.name||r.id,enabled:r.enabled!==false,rate_per_minute:+r.rate_per_minute||0,within:+r.within||0,
  valid_for:+r.valid_for||0,when:jsonList(r.when),then:jsonList(r.then)}}
const curRule=()=>ruleDraft||(autos.find(r=>r.id===RSEL)?ruleOf(autos.find(r=>r.id===RSEL)):null);
const editRule=()=>(ruleDraft=ruleDraft||JSON.parse(JSON.stringify(curRule())));
// The same refusals as the server's, in its words: a screen that takes what the subsystem will refuse lies twice.
function ruleProblem(r){
  if(!r.name)return"У сценария должно быть имя: по нему его находят в списке и в журнале";
  if(!r.when.length||r.when.length>4)return"«если» — от одного до четырёх событий";
  if(r.when.some(t=>!t.sub||!t.kind))return"у события должны быть подсистема и вид";
  if(!r.then.length||r.then.length>4)return"«то» — от одного до четырёх действий";
  for(const a of r.then){const k=actionKind(a),miss=k.fields.filter(f=>!f.opt).find(f=>!String(a[f.id]??"").trim());if(miss)return`«${k.label}»: не заполнено поле «${miss.label}»`}
  if(r.within<0||r.within>3600)return"«в пределах» — от 0 до 3600 секунд";
  if(r.rate_per_minute&&(r.rate_per_minute<1||r.rate_per_minute>600))return"не чаще — от 1 до 600 в минуту (0 — по умолчанию)";
  if(r.valid_for&&(r.valid_for<5||r.valid_for>600))return"заявка действительна — от 5 до 600 секунд (0 — по умолчанию)";
  return"";
}

      <div><label>Действие</label><select data-act="akind" data-i="${i}">${acts.map((x,j)=>`<option value="${j}" ${j===ki?"selected":""}>${esc(x.label)}</option>`).join("")}${ki<0?`<option value="" selected>${esc(k.label)}</option>`:""}</select></div>
      ${k.fields.map(f=>`<div><label>${esc(f.label)}${f.opt?" <span class='sub'>необяз.</span>":""}</label><input type="text" value="${esc(a[f.id]??"")}" data-act="af" data-i="${i}" data-f="${esc(f.id)}"></div>`).join("")}
      <div><label>&nbsp;</label><button type="button" class="btn s" title="Убрать" data-act="adel" data-i="${i}">✕</button></div></div>`}).join("")+
    `<div class="vrow"><button type="button" class="btn s" data-act="aadd">Добавить действие</button>
      <span class="sub">заявка действительна <input type="number" min="0" max="600" style="width:80px" value="${esc(r.valid_for)}" data-act="rf" data-f="valid_for"> с · не чаще <input type="number" min="0" max="600" style="width:80px" value="${esc(r.rate_per_minute)}" data-act="rf" data-f="rate_per_minute"> в минуту (0 — по умолчанию)</span></div>
    <p class="sub">Действия — то, под что написан исполнитель: сценарий подаёт заявку, а выполняет её тот, кто держит единицу.</p>`;
  const bad=ruleProblem(r);
  return`<h1>${esc(r.name||"Новый сценарий")}</h1>
    ${row&&row.unfit?`<div class="nt err">Вычислитель отказал: ${esc(row.unfit.join("; "))}</div>`:""}
    ${card("Сценарий",`<div class="g"><div><label>Имя</label><input type="text" value="${esc(r.name)}" data-act="rf" data-f="name" ${r.id?"readonly disabled":""}></div>
      <div><label>Включён</label><select data-act="rf" data-f="enabled"><option value="1" ${r.enabled?"selected":""}>да</option><option value="0" ${r.enabled?"":"selected"}>нет</option></select></div></div>`)}
    ${card("Если",when)}${card("То",then)}
    ${bad?`<div class="nt err">${esc(bad)}</div>`:""}
    <div class="vrow"><button type="button" class="btn pri s" data-act="save" ${ruleDraft?"":"disabled"}>Сохранить</button>${ruleDraft?`<button type="button" class="btn s" data-act="undo">Отменить</button>`:""}${r.id?`<button type="button" class="btn s" data-act="del">Удалить</button>`:""}</div>
    ${r.id?card("Последние срабатывания",fires.length?`<table><tr><th>Время</th><th>Действий</th></tr>${fires.map(e=>`<tr><td>${esc(fmtT(e.t))}</td><td>${esc(e.actions??"—")}</td></tr>`).join("")}</table>`:`<p class="sub">Ещё не срабатывал.</p>`):""}`;
}
function renderRules(){
  if(!RULES_HOST||!RULES_HOST.isConnected)return;
  const r=curRule();
  RULES_HOST.innerHTML=`<div class="vms-rules"><aside class="vms-rules-list">${rulesListHtml()}</aside><section class="vms-rules-card">${autoOff
    ?offCard("Сценарии","подсистема не смонтирована","Консоль запущена без auto: сценарии писать некуда.")
    :r?ruleCardHtml(r):card("Выберите сценарий",`<p class="sub">Сценарий — «когда случилось это — попросить сделать то». Вычислитель читает тот же журнал, что раздел «Журнал», и подаёт заявку тому, кто держит устройство: консоль ничего не выполняет сама.</p>`)}</section></div>`;
  if(r&&r.id&&!(r.id in ruleFires))loadFires(r.id);
  const num=v=>parseInt(v,10)||0,i=el=>+el.dataset.i;
  wire(RULES_HOST,{
    pick:el=>{RSEL=el.dataset.id;ruleDraft=null;renderRules()},
    new:()=>{RSEL=null;const a=actionsOn()[0];ruleDraft={id:"",name:"",enabled:true,rate_per_minute:0,within:0,valid_for:0,when:[{sub:"cam",kind:(triggerKinds()[0]||["silent"])[0]}],then:[{sub:a.sub,action:a.action}]};renderRules()},
    rf:(el)=>{const d=editRule(),f=el.dataset.f;d[f]=f==="enabled"?el.value==="1":f==="name"?el.value.trim():num(el.value);renderRules()},
    tf:(el)=>{const t=editRule().when[i(el)],f=el.dataset.f,v=el.value.trim();if(f==="match"){const m=parseMatch(v);if(Object.keys(m).length)t.match=m;else delete t.match}else if(v)t[f]=v;else delete t[f];renderRules()},
    tadd:()=>{editRule().when.push({sub:"cam",kind:""});renderRules()},
    tdel:el=>{editRule().when.splice(i(el),1);renderRules()},
    akind:el=>{const k=actionsOn()[+el.value];if(k)editRule().then[i(el)]={sub:k.sub,action:k.action};renderRules()},
    af:el=>{const a=editRule().then[i(el)];if(el.value.trim())a[el.dataset.f]=el.value.trim();else delete a[el.dataset.f];renderRules()},
    aadd:()=>{const k=actionsOn()[0];editRule().then.push({sub:k.sub,action:k.action});renderRules()},
    adel:el=>{editRule().then.splice(i(el),1);renderRules()},
    save:()=>saveRule(),undo:()=>{ruleDraft=null;renderRules()},del:()=>delRule(RSEL)});
}
async function saveRule(){
  const r=ruleDraft;if(!r)return;
  const bad=ruleProblem(r);if(bad){pc.toast("Отказано: "+bad);return}
  const body={enabled:r.enabled,when:r.when,then:r.then,within:r.within,rate_per_minute:r.rate_per_minute,valid_for:r.valid_for};
  try{
    if(r.id)await pc.api("PUT","/auto/scenarios/"+encodeURIComponent(r.id),body);
    else await pc.api("POST","/auto/scenarios",{name:r.name,...body});
    RSEL=r.id||r.name;ruleDraft=null;await loadAuto();renderRules();pc.toast("Сохранено");
  }catch(e){pc.toast("Отказано: "+e.message)}
}
function delRule(id){
  if(!id||!pc.confirm(`Удалить сценарий «${id}»?`,"Уже поданные заявки этим не отменяются: их выполнит или отвергнет тот, кому они адресованы."))return;
  (async()=>{try{await pc.api("DELETE","/auto/scenarios/"+encodeURIComponent(id));RSEL=null;ruleDraft=null;await loadAuto();renderRules();pc.toast("Сценарий удалён")}
    catch(e){pc.toast("Отказано: "+e.message)}})();
}
pc.addSection({id:"rules",label:"Сценарии",icon:"bolt",after:"units",render:host=>{RULES_HOST=host;loadAuto().then(renderRules)}});

// ── The domain, as the VMS sees it ───────────────────────────────────────────────────────────────────────────────
// The domain holder's view (`GET /domain`, the module hands it over on refresh): its `units` by subsystem — every
// member's units with their cluster, server, worker and phase — and its `tables`, the domain's tables the manifests serve (`domain/placement/rec/`:
// for a camera, the cluster that records it). The module draws the domain's platform part (members, topology, alarms,
// keys); this is the rest: a member's cameras and archives in the tree, their cards, recording assignments. Edits use the domain console's placement and queued CRUD routes.
const DOM_CAM={live:["идёт",""],stale:["воркер молчит — последнее известное","wait"],configured:["настроена, никто не держит","wait"],unreachable:["кластер молчит — последнее известное","off"]};
const domUnits=(sub,cluster)=>((((domView&&domView.units)||{})[sub])||[]).filter(u=>cluster==null||u.cluster===cluster);
const domKey=u=>u.cluster+"/"+u.unit;
const domFind=(sub,key)=>domUnits(sub).find(u=>domKey(u)===key)||null;
const assignments=()=>Object.fromEntries(Object.entries((PLACEMENTS&&PLACEMENTS.records)||{}).filter(([key])=>key.startsWith("rec/")).map(([key,row])=>[key.slice(4),row]));
const domDot=u=>{const st=DOM_CAM[u.worker_state]||[u.worker_state||"?","mu"];return[st[1]==="off"?"var(--rd)":st[1]==="wait"?"#f0c36a":"var(--gn)",st[0]]};
const domBadge=u=>{const st=DOM_CAM[u.worker_state]||[u.worker_state||"?","mu"];return`<span class="bd ${st[1]}">${esc(st[0])}</span>`};
// a member's cameras, then its archives (the recordings it writes); a member of one camera stands as its camera, its
// archives under it, open from the first look (the product's camera server)
pc.addTreeNodes("member",ref=>{
  const name=ref.slice(7),cams=domUnits("cam",name),arcs=domUnits("rec",name);
  const arc=u=>({ref:"da:"+domKey(u),label:"Архив · "+(u.name||u.unit),icon:"storage",dot:domDot(u),title:"Запись кластера "+u.cluster});
  const cam=u=>({ref:"dc:"+domKey(u),label:u.name||u.ref||u.unit,icon:"camera",dot:domDot(u),tags:[{text:u.ref||"id "+u.unit,title:"Имя камеры в домене"}]});
  if(cams.length===1)return[{...cam(cams[0]),replaces:true,title:"Сервер-камера "+name,open:arcs.length>0,kids:arcs.map(arc)}];
  return cams.map(cam).concat(arcs.map(u=>({...arc(u),after:true})));
});
async function domainRecording(camera,backup=false){
  const ref=camera.ref;
  if(!ref){pc.toast("Для записи нужно имя камеры в домене");return}
  const route="/domain/placement/rec/"+encodeURIComponent(ref);
  let old=null;
  try{old=await pc.api("GET",route)}catch(e){if(e.status!==404){pc.toast("Назначение недоступно: "+e.message);return}}
  if(backup&&!old){pc.toast("Сначала назначьте основную запись");return}
  const members=((domView&&domView.members)||[]).filter(m=>!m.left&&!m.refused&&(!backup||m.name!==old.cluster));
  if(!members.length){pc.toast("Нет кластера для этой записи");return}
  const v=await pc.dialog(backup?"Резервная запись":"Основная запись",[
    {name:"cluster",label:"Кластер",value:old&&!backup?old.cluster:"",options:members.map(m=>[m.name,m.name])},
    {name:"days",label:"Хранить, дней",value:"30"},
    {name:"home",label:"Том (необязательно)",value:""}],backup?"Добавить резерв":"Назначить и создать");
  if(!v)return;
  const days=Number(v.days);
  if(!Number.isInteger(days)||days<1){pc.toast("Срок хранения — целое число дней, не меньше 1");return}
  if(!members.some(m=>m.name===v.cluster)||backup&&v.cluster===old.cluster){pc.toast("Выберите другой кластер для резерва");return}
  const copies=backup?[...new Set([...(old.copies||[]),v.cluster])]:(old&&old.copies||[]).filter(n=>n!==v.cluster);
  let removal="";
  try{
    await pc.api("PUT",route,{cluster:backup?old.cluster:v.cluster,origin:camera.cluster,copies});
    if(!backup&&old&&old.cluster!==v.cluster){
      try{await pc.api("DELETE","/domain/rec/recordings/"+encodeURIComponent(ref)+"?cluster="+encodeURIComponent(old.cluster))}
      catch(e){removal=" Предыдущую запись удалить не удалось: "+e.message}
    }
    let queued=false;
    try{const out=await pc.api("POST","/domain/rec/recordings",{cluster:v.cluster,name:ref,cam:"ref:"+ref,
      retention_days:days,...(v.home?{home:v.home}:{})});queued=!!out.kept}
    catch(e){if(e.status!==409)throw e}
    PLACEMENTS=await pc.api("GET","/domain/placement");
    if(assignmentHost)renderAssignments(assignmentHost);
    pc.toast((queued?"Назначение сохранено; создание записи ожидает применения в ":"Запись назначена в ")+v.cluster+"."+removal);
  }catch(e){pc.toast("Отказано: "+e.message+removal)}
}

  const u=domFind("cam",key);
  if(!u){host.innerHTML=`<h1>Нет такой камеры</h1>`;return}
  const by=u.ref?((assignments()[u.ref]||{}).cluster||""):"";
  host.innerHTML=`<h1><span class="pc-crumbs" data-crumbs="${esc(JSON.stringify([["Домен","domain"],[u.cluster,"member:"+u.cluster]]))}"></span>${esc(u.name||u.ref||u.unit)}</h1>
    <p class="sub pc-hdsub">камера ${esc(u.ref||"—")} кластера ${esc(u.cluster)}</p>`+
    card("Камера",`${domBadge(u)} <span class="sub" style="margin-left:8px">${esc(u.phase||"")} · ${esc(u.as_of||"")}</span>
      <div class="g" style="margin-top:10px">${fldRo("Имя в домене (ref)",u.ref||"—")}${fldRo("Номер в кластере",u.unit)}${fldRo("Воркер",u.worker||"—")}${fldRo("Сервер",u.server||"—")}${fldRo("Пишет кластер",by||"—")}</div>${u.ref?`<div class="vrow"><button type="button" class="btn s" data-act="domainRecord">Назначить запись</button><button type="button" class="btn s" data-act="domainBackup">Добавить резерв</button></div>`:""}`)+
    card("Записи кластера",domUnits("rec",u.cluster).map(a=>`<div class="it" data-act="arc" data-key="${esc(domKey(a))}"><span>${pc.icon("storage")}</span><span>${esc(a.name||a.unit)}<small>${esc(a.worker||"—")} · ${esc(a.server||"—")}</small></span>${domBadge(a)}</div>`).join("")||`<p class="sub">Кластер не пишет ни одной записи — по последнему ответу.</p>`);
  wire(host,{arc:el=>pc.select("da:"+el.dataset.key),domainRecord:()=>domainRecording(u),domainBackup:()=>domainRecording(u,true)});
}
function domArcCard(host,key){
  const u=domFind("rec",key);
  if(!u){host.innerHTML=`<h1>Нет такого архива</h1>`;return}
  host.innerHTML=`<h1><span class="pc-crumbs" data-crumbs="${esc(JSON.stringify([["Домен","domain"],[u.cluster,"member:"+u.cluster]]))}"></span>Архив · ${esc(u.name||u.unit)}</h1>
    <p class="sub pc-hdsub">запись ${esc(u.unit)} кластера ${esc(u.cluster)}</p>`+
    card("Запись",`${domBadge(u)} <span class="sub" style="margin-left:8px">${esc(u.phase||"")} · ${esc(u.as_of||"")}</span>
      <div class="g" style="margin-top:10px">${fldRo("Запись",u.unit)}${fldRo("Регистратор",u.worker||"—")}${fldRo("Сервер",u.server||"—")}</div>
      <p class="sub">Срок, том и включение записи задаются в самом кластере — на его консоли.</p>`);
}
pc.addCard("dc",(host,ref)=>domCamCard(host,ref.slice(3)));
pc.addCard("da",(host,ref)=>domArcCard(host,ref.slice(3)));
// the member's VMS part only: its cameras and its archives; the cluster itself — networks, leaving — is the module's
pc.addBlock("member",{id:"cam",render:(host,ref)=>{
  const name=ref.slice(7),row=u=>`<div class="it" data-act="go" data-ref="${esc(u.sub==="cam"?"dc:":"da:")}${esc(domKey(u))}"><span>${pc.icon(u.sub==="cam"?"camera":"storage")}</span><span>${esc(u.name||u.ref||u.unit)}<small>${esc(u.ref||u.unit)} · ${esc(u.worker||"—")}${u.sub==="cam"&&u.ref&&(assignments()[u.ref]||{}).cluster?" · пишет кластер "+esc((assignments()[u.ref]||{}).cluster):""}</small></span>${domBadge(u)}</div>`;
  host.innerHTML=card("Камеры",domUnits("cam",name).map(row).join("")||`<p class="sub">Камер нет — по последнему ответу кластера.</p>`)+
    card("Архивы",domUnits("rec",name).map(row).join("")||`<p class="sub">Записей нет — по последнему ответу кластера.</p>`);
  wire(host,{go:el=>pc.select(el.dataset.ref)});
}});
// Operator assignments are read from the platform's typed route.
function renderAssignments(host){
  if(!domView){host.innerHTML="";return}
  if(!PLACEMENTS){host.innerHTML=card("Назначения записи",`<p class="sub">Назначения сейчас недоступны.</p>`);return}
  const rows=Object.entries(assignments()),nameOf=ref=>{const u=domUnits("cam").find(c=>c.ref===ref);return u?(u.name||ref)+" · "+u.cluster:ref};
  host.innerHTML=card("Назначения записи",rows.length?`<table><tr><th>Камера</th><th>Основной</th><th>Резервы</th></tr>${rows.map(([ref,row])=>`<tr><td>${esc(nameOf(ref))}</td><td>${esc(row.cluster)}</td><td>${esc((row.copies||[]).join(", ")||"—")}</td></tr>`).join("")}</table>`
    :`<p class="sub">Назначений нет.</p>`);
}
pc.addBlock("domain",{id:"cam",render:host=>{assignmentHost=host;renderAssignments(host)}});

// Cluster-owned RTSP accounts (ADR-0074 C5): the console passes these requests to its live gateway.
// No credentials are cached with the metadata. A password lives only in the result input's value property:
// the module's HTML snapshots, browser storage and subsequent list responses cannot restore it.
let accountView=0,accountPassword=null;
function forgetAccountPassword(){
  if(accountPassword){accountPassword.value="";accountPassword.closest(".vms-account-secret").remove();accountPassword=null}
}
pc.on("select",()=>forgetAccountPassword());
new MutationObserver(()=>{if(accountPassword&&!accountPassword.isConnected)forgetAccountPassword()})
  .observe(document.querySelector(".pc-main"),{childList:true,subtree:true});
pc.addTreeNodes("access",()=>[{ref:"streamaccounts:local",label:"Учётки потоков",icon:"sec_access"}]);
pc.addCard("streamaccounts",host=>{
  forgetAccountPassword();
  const view=++accountView,live=()=>view===accountView&&host.isConnected&&pc.selected()==="streamaccounts:local";
  let rows=[],loading=false,busy=false,error="",draft="";
  const failure=e=>(e.status?String(e.status)+": ":"")+(e.message||String(e));
  function draw(){
    if(!live())return;
    forgetAccountPassword();
    const admin=pc.may("admin","domain"),disabled=busy||loading?" disabled":"";
    host.innerHTML=`<h1>Учётки потоков</h1><div class="vms-accounts">
      <p class="sub">Учётки этого кластера для внешних потребителей видео. Доступ к камерам задают гранты.</p>
      <button type="button" data-account="reload"${disabled}>Обновить</button>
      ${loading?`<p role="status">Загрузка учёток…</p>`:""}
      ${error?`<p class="bad" role="alert">${esc(error)}</p>`:""}
      ${admin?`<form class="vms-account-create"><label>Имя <input name="name" value="${esc(draft)}" autocomplete="off" required${disabled}></label>
        <button type="submit"${disabled}>Создать учётку</button></form>`:""}
      <div class="vms-account-result"></div>
      ${!loading&&!error&&!rows.length?`<p>Учёток нет.</p>`:""}
      <table><thead><tr><th>Имя</th><th>Состояние</th><th>Изменена</th><th>Кем</th><th></th></tr></thead><tbody>
      ${rows.map((row,i)=>`<tr><td>${esc(row.name)}</td><td>${row.disabled?"Отключена":"Включена"}</td>
        <td>${esc(row.at?fmtDayTime(row.at):"—")}</td><td>${esc(row.by||"—")}</td><td>${admin?
          `<button type="button" data-account="password" data-row="${i}"${disabled}>Новый пароль</button>
           <button type="button" data-account="toggle" data-row="${i}"${disabled}>${row.disabled?"Включить":"Отключить"}</button>
           <button type="button" data-account="delete" data-row="${i}"${disabled}>Удалить</button>`:""}</td></tr>`).join("")}
      </tbody></table></div>`;
    host.querySelector('[data-account="reload"]').onclick=()=>load();
    const form=host.querySelector(".vms-account-create");
    if(form){
      form.elements.name.oninput=e=>{draft=e.target.value};
      form.onsubmit=e=>{e.preventDefault();const name=form.elements.name.value.trim();if(name)change("POST","/live/accounts",{name},true)};
    }
    host.querySelectorAll("[data-row]").forEach(button=>{button.onclick=()=>{
      const row=rows[Number(button.dataset.row)],path="/live/accounts/"+encodeURIComponent(row.name);
      if(button.dataset.account==="password")change("POST",path+"/password",undefined,true);
      else if(button.dataset.account==="toggle")change("PUT",path,{disabled:!row.disabled});
      else if(pc.confirm("Удалить учётку «"+row.name+"»?","Её гранты также будут сняты."))change("DELETE",path);
    }});
  }
  async function load(){
    if(!live())return;
    loading=true;error="";draw();
    try{
      const result=await pc.api("GET","/live/accounts");
      if(!live())return;
      if(!result||!Array.isArray(result.accounts))throw new Error("Шлюз не вернул список учёток");
      rows=result.accounts.filter(row=>row&&typeof row.name==="string").map(row=>({name:row.name,
        disabled:row.disabled===true,at:typeof row.at==="number"&&Number.isFinite(row.at)?row.at:0,
        by:typeof row.by==="string"?row.by:""}));
    }catch(e){if(live()){rows=[];error=failure(e)}}
    finally{if(live()){loading=false;draw()}}
  }
  async function change(method,path,body,password=false){
    if(!live()||busy||loading)return;
    busy=true;error="";draw();
    let answer;
    try{
      answer=await pc.api(method,path,body);
      if(!live())return;
      if(password&&(!answer||typeof answer.account!=="string"||typeof answer.password!=="string"||!answer.password))
        throw new Error("Шлюз не вернул пароль; запросите новый пароль");
      if(method==="POST"&&path==="/live/accounts")draft="";
      await load();
    }catch(e){if(live())error=failure(e);answer=null}
    finally{if(live()){busy=false;draw()}}
    if(password&&answer&&live()){
      const result=host.querySelector(".vms-account-result");
      result.innerHTML=`<div class="vms-account-secret"><p>Пароль учётки <strong>${esc(answer.account)}</strong> показан один раз. Сохраните его сейчас.</p>
        <input class="vms-account-password" aria-label="Новый пароль учётки" readonly autocomplete="off">
        <button type="button">Скрыть пароль</button></div>`;
      accountPassword=result.querySelector("input");accountPassword.value=answer.password;
      result.querySelector("button").onclick=forgetAccountPassword;
    }
  }
  load();
});
