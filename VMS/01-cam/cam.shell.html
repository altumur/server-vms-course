NOTES — what this page is, its parts and its state (each function is described where it is defined)

# cam.shell.html — the VMS's page over the platform's console module (М10B, beside lesson 12)

**Role.** The page at `/` of a console whose root is `cam` (P/06: a subsystem's own page is `<sub>.shell.html`
beside its manifest, served by the console's root alone). It mounts the module
(`PlatformConsole.mount(#app, {lang, subsystems: [cam, rec, live]})`); rec and live are about the camera (`about`), so the module nests their units under it and the page reads
their manifests with `pc.manifest(name)`. No platform section is drawn here: no login, no tree of servers, no domain card, no
journal — the module's; the page's own tests hold it to that.

## The core: copied with a check
`whereAt`, `doorOf`, `doorFetch`, `yieldCut`, `loadTimeline`, `segmentURL`, `play`, `playNext`, `negotiateLive`,
`stopLive` are the product's (its own page on its `main`), between the two «core» lines below; a check compares each
with the product's page, and what differs is listed as a debt — only shrinking. The places a
recording may lie on are the rows of the table the rec manifest names
(`places.table`), read at `/rec/<table>` — never a table named in the page, here and in the product.

## What the page adds (all through the module's calls)
- `addIcons` — camera, volume (storage); `addDecor("unit")` — a camera's icon and its address as a tag, a stream's
  name and its camera's (a stream is a unit of cam with `main`, V/01.1 Н1.1а; the module draws it as a unit of its own);
  `addFieldEditor("unit", "source")` — the source and what it says (address, vendor, channel), sent by the form.
- `addNote("unit")` — «открытие не завершается» (the device has not opened: `device_state: opening`), «сбой
  устройства» (`phase: failed`, the holder's `why`); `addEventNote` — the VMS's events in words (volumes, cards, the
  footage), everywhere the module lists events.
- `addTab("unit")` «Видео» — the live picture (WHEP at the gateway's door), the timeline of every recording of the
  camera and every place a recording may have left footage on, the events on it, the operator's mark, «Закрепить»
  (what is only in a backup: `POST /rec/requests` for the primary recording), «Удержать показанное».
  The timeline holds the camera's recordings in the other clusters of the domain too (ADR-0061): the book of
  primaries this cluster carries names them by the camera's ref — the primary and each of its `backups` —, at a member
  and at the holder alike, their doors are asked at this console
  (`/domain/at/<cluster>/rec/where/…`), a refusal said in words (403, 404, 502, 503).
  «Видео» of a camera plays its full-screen stream (`full`), of a stream — the stream; the timeline is the camera's.
  «Потоки» — the camera's streams (`POST /cam/cameras {main, profile, source}`), the grid's and the full screen's
  (`PUT` the camera's `grid`, `full`; the page suggests the smallest and the largest by the holder's `size`).
  «Архив» — the camera's recordings (`/rec/recordings`: create, switch, delete, home, days, `when` of a backup) and
  its keeps (`/rec/keeps`: make, lift; check at the incidents holder's door; the state in the recorders' own words, from
  their beat — `servers.status` of their rows at `/rec/servers` with `of: keeps`, ADR-0064: here, pushing, pushed,
  at risk, lost, garbled of the recording's writer; kept of the incidents holder; let go — the row's `released_at` —, «нет кадров,
  запечатывать нечего» for a recording with no footage in the stretch).
- Volumes (`/rec/<places table>`): `addTreeNodes("server")` (a server's own), `addTreeNodes("servers")` («Сетевые
  архивы»), `addCard("vol"|"netvols")`, `addBlock("server", {covers: "rec/volumes"})` «Архивы сервера»; declaring
  (`POST`, the row whole: what the dialog does not show is carried from the row; a smaller quota, or one a holder says
  waits — `shrink_pending` —, only with `shrink_confirmed`; `incidents` with `admits: false`) and withdrawing (`DELETE`).
- «Камеру в архив» — `addAction("server")`, `addMenu("server"|"vol")`: a recording of a camera on a volume of the
  server (`POST /rec/recordings {name, cam, stream?, home}`: the camera and the stream chosen together, the largest suggested).
- `addSection` «Сценарии» (after units) — the auto subsystem's scenarios: the list and the editor, the actions the
  auto manifest's `then` accepts (the page's catalogue of actions, held to the manifest by a check), the last firings.
- The domain through the VMS's eyes, from the holder's `/domain` view (`units`, `tables`): `addTreeNodes("member")`
  — a member's cameras and archives (a member of one camera stands in the tree as its camera: `replaces`),
  `addCard("dc"|"da")`, `addBlock("member")`, `addBlock("domain")` «Назначения записи» (`domain/placement/rec/`).
- `addMenu("unit")` — «Смотреть видео», «Архив».
- «Учётки потоков» в разделе прав — `addTreeNodes("access")` и `addCard`: свои `/live/accounts`, пароль только
  ответом создания или смены, без хранения в состоянии страницы.
- `addSection` «Ассистент» (after the scenarios; V/10.3–V/10.6) — when the console mounts `assist` and the session sees a
  model row: the admin's text, the model's steps at its holder's door, the tools read the console through `api` and `may`
  over this page's subsystems only (ADR-0093 доп. (5)), the plan checked here and shown in the page's words, «Применить»
  writes each row by one `PUT` with `ifMatch`. The harness is data (`assist-harness`, the bytes of
  `VMS/10-assist/harness/`); the core between `assist:core` markers is pure — the lesson's vectors run it.

## Routes the page itself uses
`/rec/recordings`, `/rec/<places table>`, `/rec/keeps`, `/rec/requests`, `/rec/servers`, `/live/streams`, `/auto/scenarios`,
`/events`, `/marks`, `/live/accounts`, `/cam/cameras` (a stream, a camera's `grid` and `full`) (writes through `pc.api`), `/domain/rec/books/primaries`, `/domain/placement`
(`PUT /domain/placement/rec/<ref>`); the holders' doors from
`/rec/where/<recording>`, `/rec/where/<table>/<place>?unit=<recording>`, `/live/where/<stream>`, and another
cluster's from `/domain/at/<cluster>/rec/where/…` (ADR-0061); at the incidents holder's door,
`POST /keeps/<keep>/verify?recording=<r>`. The assistant: `/mounts`, `/manifest`, `/<sub>/manifest`, `/session`, `/schema`,
the rows and tables of this page's subsystems (reads), `/assist/models`, `/assist/where/<name>` and the model's door
(`/chat/<name>/steps`), `PUT /<rows>/<id>` with `If-Match` (its writes). Everything else is the module's.

/* The VMS's own styles — its icons' colours, the player, the timeline, the scenarios; the console's look is the
   module's (/platform/console.css). */
.ici-camera{color:#4ea3e8}.ici-storage{color:#6a9cbc}.ici-bolt{color:#e8b84a}
/* What is not there is shown, not hidden: a card switched off says why. */
.card.is-off{opacity:.62}.card.is-off .cb code{background:var(--p2);border:1px solid var(--ln);border-radius:4px;padding:1px 5px;font-size:12px}
.vid{position:relative;display:grid;place-items:center;aspect-ratio:16/9;background:#05080d;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.vid video{width:100%;height:100%;display:block;background:#000}
.vrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.vax{display:flex;justify-content:space-between;margin-top:4px}
.tl{position:relative;height:64px;border:1px solid var(--ln);border-radius:6px;background:var(--p2);overflow:hidden}
.tl .span{position:absolute;top:12px;height:26px;border-radius:3px;background:var(--bl);cursor:pointer;min-width:2px}
.tl .span.events-only{background:#c58a1a;top:20px;height:12px;cursor:default}
.tl .span.fenced{opacity:.45}
/* What is only in a backup (the camera's card, another server's disk) and not in the primary: hatched. What was
   backfilled from it is the primary's now, written by another than its recorder: a colour of its own. */
.tl .span.backup{background:repeating-linear-gradient(135deg,#c58a1a 0 4px,transparent 4px 8px);border:1px solid #c58a1a}
.tl .span.backfill{background:#2a9d5c}
.tl .span.playing{outline:2px solid var(--tx);outline-offset:-1px}
.tl .tick{position:absolute;bottom:4px;width:2px;height:12px;background:#c58a1a;cursor:pointer}
.tl .tick.fenced{opacity:.4}
.evlist{list-style:none;margin:0;padding:0;max-height:34vh;overflow:auto}
.evlist li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px}
.evlist li:hover{background:var(--p2)}
.evlist li.fenced{color:var(--mu)}
.evlist li small{color:var(--mu);font-size:11px;white-space:nowrap}
.swatch{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.livefeed{margin-top:8px;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--p2);font-size:13px;max-height:20vh;overflow:auto}
.livefeed .ev{padding:2px 0}
.livefeed .ev:first-child{font-weight:600;color:var(--mu)}
.sub.bad{color:var(--rd)}
.btn.on{border-color:#3f6fac;background:#1a2d4d;color:#fff}
.auto-rules{display:grid;grid-template-columns:260px 1fr;gap:12px}
.auto-rules-list .n{display:flex;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer}
.auto-rules-list .n:hover{background:var(--p2)}.auto-rules-list .n.on{background:#1a2d4d}
/* assist */
.as-log{display:flex;flex-direction:column;gap:6px;margin:8px 0;max-height:40vh;overflow:auto}
.as-msg{padding:6px 10px;border-radius:8px;border:1px solid var(--ln);font-size:13px;white-space:pre-wrap}
.as-admin{align-self:flex-end;background:var(--p2)}.as-model small{display:block;color:var(--mu);font-size:11px}.as-page{color:var(--mu)}
.as-sel{margin:8px 0;padding:6px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--p2);font-size:13px}
.as-diff{width:100%;border-collapse:collapse;font-size:13px}.as-diff td,.as-diff th{border-bottom:1px solid var(--ln);padding:4px 6px;text-align:left;vertical-align:top}
.as-res{font-size:13px}.as-res .as-applied{color:#2a9d5c}.as-res .as-refused,.as-res .as-unknown,.as-res .as-moved{color:var(--rd)}
.as-text{width:100%;box-sizing:border-box}
/* /assist */

<script type="application/json" id="assist-harness">{"system":"# w2c console configuration assistant\n\nYou are the assistant of a w2c cluster admin. The admin writes a request; you find the units and propose\n**a plan of edits**. Reply in the language of the admin's request, briefly.\n\n## Boundaries\n- You write nothing. Your answer to the admin is **always a tool call**: a plan — `propose_plan` (the admin reviews\n  the diff and applies it), a question — `ask_admin` (the admin's answer comes back as its result), a refusal or\n  \"there are no such units\" — `refuse` with the reason. The admin does not see text without such a call.\n- You have no rights of your own: the tools work in the admin's session and see only what the admin sees.\n- Use only the tools you are given. There are no other actions.\n\n## How to work\n1. `list_subsystems` — which subsystems exist and what their units are called. The first user message is the\n   \"Cluster overview\": it already contains the subsystems, the manifests and the admin's rights, so steps 1–2 are not\n   needed.\n2. `get_manifest` of the subsystem you need — fields, types, options (enum) and their labels, fixed, secret.\n3. `find_units` with `where` conditions — find exactly the units the request is about. Do not guess names or values.\n4. `propose_plan` — `selection` and edits `{unit, field, from, to, why}`: `from` — the current value from\n   `find_units`, `to` — the new one, `why` — which field or label put the unit in the plan. In `summary` — one line\n   to the admin (including which units were left out and why, e.g. no rights). The plan is not applied yet: say\n   what it will do (\"Turns off Gate-1\"), not as done (\"Turned off Gate-1\").\n\n## selection: who is selected, who is edited\n- `edit_sub` — the subsystem **whose field the request changes**; all edits are its units. `select_sub` — the\n  subsystem where the admin gave the selection (names or a condition); the same by default. A request of the form\n  \"for the Xs of the Ys with a condition\" — selection in subsystem Y (`select_sub`), edits in subsystem X\n  (`edit_sub`).\n- Choose the field by its label (`label`) in the manifest — it must match the admin's word. The check compares each\n  edited field with the request text: a field the admin did not name is an error. `fields` (`{field: the admin's\n  word}`) — optional.\n- `propose_plan` computes the selection itself and checks it: an extra or a missing unit, the wrong subsystem, a word\n  that does not fit the field — an error with a hint.\n\n## Rules\n- Fields and values come only from the manifest. For an enum, write the option's code in `to` (not its label).\n- Do not include a unit whose field already has the wanted value.\n- Write a list (e.g. labels) in `to` in full — as it will become.\n- The request names neither a unit nor a selection condition (or does not say which value to set) — **ask first**\n  with `ask_admin`, before searching; one short question. A plan for many units only if the admin said \"all / every\"\n  or gave a condition. In `propose_plan` give `selection`: `named` — the names from the request, or `where` — the\n  condition from the request.\n- Labels, tags, floors, sides, zones are the admin's words; the data stores them as codes. Look up the codes with\n  `field_values` (for a subsystem with `about` — also `about.\u003cfield>` of the related unit) and search by them.\n- An empty search is not an answer: read `hints`, check `field_values`, the related unit and the other subsystem;\n  if there really are no such units — `refuse` with the reason.\n- An empty list (no tags, no labels): `{\"field\": \"tags\", \"op\": \"eq\", \"value\": []}`.\n- The needed field or option is not in the manifest, the field is fixed, there is no right on the unit\n  (`can_edit: false`), the action is outside the console — `refuse` with the reason; do not substitute a similar\n  field. No right on only some of the selected units — a plan for the rest, and the ones left out go in `summary`.\n- Secrets: you do not see passwords. The admin types a password in a separate field; a message tells you \"Secret N is\n  entered\". Write `{\"secret\": N}` as is in `to` of the secret field (a field whose name ends with `_secret`), and\n  nowhere else.\n- `propose_plan` answered `valid: false` — fix your mistake and propose again; if the request cannot be done —\n  `refuse`.\n- An accepted plan (`valid: true`) ends the turn: the admin sees the diff and `summary`.\n","tools":[{"name":"list_subsystems","description":"The cluster's subsystems: name (sub), what their units are called, how they relate, tables.","inputSchema":{"type":"object","properties":{}}},{"name":"get_manifest","description":"A subsystem's manifest: the unit's fields (type, required, enum options and their labels, fixed, secret), field labels and the console form. Call it before writing a plan.","inputSchema":{"type":"object","properties":{"sub":{"type":"string"}},"required":["sub"]}},{"name":"get_schema","description":"The console's /schema door: schema versions of the cluster's data and processes.","inputSchema":{"type":"object","properties":{}}},{"name":"find_units","description":"Find a subsystem's units by conditions (all conditions are AND). No conditions — all units. Returns unit \"\u003csub>/\u003cname>\", revision and fields.\nA where condition is {field, op, value}; all conditions are AND. Kinds:\neq — the field equals the value (scalar): {\"field\": \"zone\", \"op\": \"eq\", \"value\": \"z9\"}\nne — not equal: {\"field\": \"state\", \"op\": \"ne\", \"value\": \"closed\"}\nin — one of a list of values: {\"field\": \"shelf\", \"op\": \"in\", \"value\": [\"x1\", \"x2\"]}\nnot_in — none of the list\ncontains — a LIST field (labels, tags, flags) contains the element: {\"field\": \"labels\", \"op\": \"contains\", \"value\": \"blue\"}; eq on a list field with a string never matches\nnot_contains — the list field does not contain the element\ngt / gte / lt / lte — number greater / not less / less / not greater: {\"field\": \"weight\", \"op\": \"gt\", \"value\": 2}\nexists / missing — the field is set / not set, no value: {\"field\": \"feed\", \"op\": \"exists\"}\nA field of the related unit is about.\u003cfield>: {\"field\": \"about.labels\", \"op\": \"contains\", \"value\": \"blue\"}","inputSchema":{"type":"object","properties":{"sub":{"type":"string"},"where":{"type":"array","items":{"type":"object","properties":{"field":{"type":"string","description":"a field of the unit, or about.\u003cfield> of the related unit"},"op":{"type":"string","enum":["eq","ne","in","not_in","contains","not_contains","gt","gte","lt","lte","exists","missing"]},"value":{"type":["integer","number","string","boolean","array","object","null"],"description":"the value; a list for in/not_in"}},"required":["field"]}},"fields":{"type":"array","items":{"type":"string"},"description":"which fields to return (all if omitted); about.\u003cfield> — the value of that field of the related unit (e.g. its counter's step)"}},"required":["sub"]}},{"name":"field_values","description":"Which values of a field occur among a subsystem's units (labels, zones, shelves, modes) and how many; about.\u003cfield> — values of a field of the related unit. Map the admin's words (\"northern\", \"top floor\") to these values.","inputSchema":{"type":"object","properties":{"sub":{"type":"string"},"field":{"type":"string"}},"required":["sub","field"]}},{"name":"list_table","description":"Rows of a subsystem's table (e.g. rec's volumes). Read only.","inputSchema":{"type":"object","properties":{"sub":{"type":"string"},"table":{"type":"string"}},"required":["sub","table"]}},{"name":"propose_plan","description":"Propose a plan of edits to the admin. Writes nothing: the plan is checked against the unit's form and the session's rights; the admin sees the diff and applies it. Each edit: unit \"\u003csub>/\u003cname>\", field, from (current value), to (new value), why (which field or label put async function loadTimeline(id){
  const [from,to]=winRange();
  // The camera's footage is its recordings' — each through its own recorder's door, and through the door of every
  // volume it may have lain on (a recording moves; what it left behind stays on the old volume, read where it lies).
  // The raw ranges {start_ms, end_ms, epoch, source, yields} are merged without twins by (recording, start, end,
  // epoch, source), the recording's own door first; a volume nobody holds is named, not dropped silently.
  const recs=recsOfCam(id).concat(farRecsOfCam(id));
  // the places a recording may lie on: the rows of the table rec's manifest names (manifest.places), not a name written here
  const T=((pc.manifest("rec")||{}).places||{}).table||"";
  let places=[];
  if(T){try{const d=await (await fetch(`/rec/${encodeURIComponent(T)}`)).json();places=d[T]||[]}catch(e){places=[]}}
  const asks=[],missing=new Set(),refused=new Map(),seen=new Set(),spans=[];
  // a recording on a backup volume: what it has yields to the primary's, and its remainder is «only in the backup»;
  // another cluster's recording says it itself (its volumes are that cluster's)
  const backupRec=rec=>{if(rec.cluster)return!!rec.backup;const v=places.find(x=>x.name===rec.home);return!!v&&BACKUP_KINDS.includes(v.kind)};
  const take=(rec,where,list)=>{const bk=backupRec(rec);for(const x of list||[]){
    const k=[rec.cluster||"",rec.id,x.start_ms,x.end_ms,x.epoch,x.source||""].join("|");if(seen.has(k))continue;seen.add(k);
    spans.push({start:x.start_ms/1000,end:x.end_ms/1000,epoch:x.epoch,fenced:!!x.fenced,events:0,source:x.source||"",recording:rec.id,where,media:true,yields:!!x.yields||bk,backupOnly:bk})}};
  const ask=async(rec,where,place)=>{
    const w=await whereAt(where);
    // another cluster's answer, in words: its gate does not know you (403), its console is not reached (502), it is not
    // a member this console can reach (404 from the hop), the members' list does not read here (503)
    if(!w.door&&rec.cluster&&!place&&[403,404,502,503].includes(w.status)){refused.set(rec.cluster,w.status);return null}
    if(!w.door){if(place&&w.status===404&&w.missing)missing.add(w.missing);return null}   // «no such place»: nothing to say
    try{const r=await doorFetch(where,`/timeline/${encodeURIComponent(rec.id)}?from=${from}&to=${to}`);
      if(!r||!r.ok){missing.add(place||rec.id);return null}
      const m=r.headers.get("X-Unreachable");if(m)missing.add(m);
      const u=r.headers.get("X-Unavailable");if(u)u.split(",").map(x=>x.trim()).filter(Boolean).forEach(x=>missing.add(x));   // volumes of it nobody holds
      return await r.json()}
    catch(e){missing.add(place||rec.id);return null}
  };
  // the recordings' own doors first (theirs win a twin), then the volumes'
  const own=await Promise.all(recs.map(rec=>ask(rec,recWhere(rec),"")));
  recs.forEach((rec,i)=>take(rec,recWhere(rec),own[i]));
  // the places: this cluster's table for its own recordings; another cluster's recording, its home there
  for(const rec of recs)for(const name of rec.cluster?(rec.home&&!refused.has(rec.cluster)?[rec.home]:[]):places.map(v=>v.name))
    asks.push((async()=>{const where=placeWhere(rec,T||"volumes",name);take(rec,where,await ask(rec,where,name))})());
  await Promise.all(asks);
  // Лента строится по дверям; недоступное названо: его архив не утрачен, а лента без него неполная — это
  // единственный сбой, который оператор иначе не увидел бы.
  const unr=[...missing];
  const WHY={403:c=>`на ${c} вас не знают: его архив не показан`,502:c=>`консоль ${c} не видна по сети: его архив смотрится только там, где её видно`,404:c=>`консоль ${c} отсюда не известна: его архив не показан`,503:c=>`список членов домена здесь не читается: архив ${c} не показан`};
  V.note=(unr.length?`Недоступн${unr.length>1?"ы":"о"}: ${unr.join(", ")} — ${unr.length>1?"их архивы недоступны":"его архив недоступен"}, а не утрачен${unr.length>1?"ы":""}; лента может быть неполной.`:"")
    +[...refused].map(([c,st])=>" "+WHY[st](c)+".").join("");V.note=V.note.trim();
  V.spans=yieldCut(spans).sort((a,b)=>a.start-b.start);
  V.cam=id;
  await fetchEvents(id,from,to);
  const now=Date.now()/1000;
  const fin=winKey==="all";
  V.lo=fin?Math.min(...V.spans.map(s=>s.start),...V.events.map(e=>e.t),now-3600):from;
  V.hi=fin?Math.max(...V.spans.map(s=>s.end),...V.events.map(e=>e.t),now):to;

}
async function segmentURL(s,p){
  const d=await doorOf(s.where);if(!d)return"";
  return `${d.url}/segment/${encodeURIComponent(s.recording)}/e${s.epoch}/${Math.round(p.start*1000)}-${Math.round(p.end*1000)}${s.source?"."+s.source:""}.mp4?t=${encodeURIComponent(d.token)}`;

function play(i){V.queue=piecesFrom(i,0);playNext()}
async function playNext(){
  if(!V.queue.length)return;
  stopLive(true);
  const p=V.queue.shift(),s=V.spans[p.i];
  [...$("#timeline").children].forEach((el,j)=>el.classList.toggle("playing",j===p.i));
  const cap=$("#playing");
  if(cap)cap.textContent=`${fmtT(p.start)} – ${fmtT(p.end)} · эпоха ${s.epoch}`+
    (s.backupOnly?" · из резервного архива":"")+(s.source==="backfill"?" · дозаписано из резервного":"");
  const v=$("#player");v.srcObject=null;v.crossOrigin="anonymous";
  v.src=await segmentURL(s,p);

  // again once after five seconds; then the queue goes on.
  v.onerror=()=>{if(p.again){setCap("кусок не отдан дверью — дальше");playNext();return}
    p.again=true;setCap("дверь архива занята или отказала — повтор через 5 с");setTimeout(()=>{V.queue.unshift(p);playNext()},5000)};

}
async function negotiateLive(id){
  let pc;
  try{pc=new RTCPeerConnection()}catch(e){setCap("браузер не умеет WebRTC");return}
  pc.addTransceiver("video",{direction:"recvonly"});
  pc.ontrack=e=>{const v=$("#player");if(!v)return;v.src="";v.srcObject=e.streams[0];v.play().catch(()=>{})};
  // Шлюз сам кладёт трубку, когда камера переехала на другой воркер или её поток оборвался: старое
  // соединение уже ничего не покажет. Зритель возвращается сам — после случайной паузы, чтобы пятьдесят
  // зрителей одной камеры не пришли в один миг.
  // «disconnected» браузер держит около полминуты, прежде чем признать «failed»; шлюз, положивший трубку,
  // не вернётся, поэтому пяти секунд без связи достаточно.
  pc.onconnectionstatechange=()=>{
    if(!V.live||V.live.pc!==pc)return;
    const st=pc.connectionState;
    if(st!=="failed"&&st!=="closed"&&st!=="disconnected")return;
    const again=()=>{
      if(!V.live||V.live.pc!==pc||pc.connectionState==="connected")return;
      setCap("живое: связь со шлюзом потеряна, переподключаюсь…");
      startLive(id);
    };
    setTimeout(again,(st==="disconnected"?5000:1000)+Math.random()*3000);
  };
  const offer=await pc.createOffer();
  await pc.setLocalDescription({type:"offer",sdp:h265Dynamic(offer.sdp)});
  // The fan-out is the camera's (V/03.1); the stream watched is said at the gateway's door (V/03.3 Н1.2): the chosen stream
  // itself, or for the camera its full-screen stream (`full`; empty — the main one, no `stream`).
  const u=camById(id),cam=cameraOf(id);
  let sid=camMain(u)?String(id):String((u&&u.full)||"");if(sid===cam)sid="";
  const q=sid?"?stream="+encodeURIComponent(sid):"";
  // The first viewer makes the fan-out (POST /live/streams {cam}; «exists» — somebody watches already), then the offer
  // goes to its gateway's door: 404 «not yet» (the pass has not made the stream's subscription), 503 (full, busy), 500
  // (answer failed) — again after `Retry-After` or 1.5 s, up to 8 times (V/03.3 Н4); 404 «stream refused» — said, not
  // repeated; 403 — where again, once.
  try{await window.platformConsole.api("POST","/live/streams",{cam})}
  catch(e){if(!(e.status===409&&e.body&&e.body.error==="exists")){setCap("живое отклонено: "+e.message);pc.close();return}}
  const where="/live/where/"+encodeURIComponent(cam);
  let r=null,tries=0;
  for(;;){
    try{r=await doorFetch(where,`/whep/${encodeURIComponent(cam)}${q}`,{method:"POST",headers:{"Content-Type":"application/sdp"},body:pc.localDescription.sdp})}
    catch(e){r=null}
    if(r&&r.status===404){let d={};try{d=await r.clone().json()}catch(e){}if(d.error==="stream refused")break}
    if(r&&![404,500,503].includes(r.status))break;

    const ra=r?Number(r.headers.get("Retry-After")):NaN;

  if(!r){setCap("живое: шлюз не взял поток");pc.close();return}
  if(r.status!==201){
    let d={};try{d=await r.json()}catch(e){}
    setCap("живое отклонено: "+(d.detail||d.error||r.status));
    pc.close();return;
  }
  await pc.setRemoteDescription({type:"answer",sdp:await r.text()});
  const session=r.headers.get("Location")||"";
  V.live={pc,session,where,since:Date.now()/1000-30,seen:new Set(),timer:null};
  [...($("#timeline")?.children||[])].forEach(el=>el.classList.remove("playing"));
  let via="";
  try{via=new URLSearchParams(session.split("?")[1]).get("gateway")||""}catch(e){}
  setCap("живое"+(via?" · через "+via:""));
  const btn=$("#liveBtn");if(btn){btn.textContent="Остановить";btn.classList.add("on")}
  const feed=$("#livefeed");
  if(feed){feed.style.display="block";feed.innerHTML='<small class="sub">события, пока вы смотрите — что видят подсистемы на этом объекте</small>'}
  V.live.timer=setInterval(()=>pollLive(id),3000);pollLive(id);

function stopLive(keepUi){

  clearInterval(V.live.timer);
  try{V.live.pc.close()}catch(e){}

  if(!keepUi){
    const feed=$("#livefeed");if(feed)feed.style.display="none";
    const btn=$("#liveBtn");if(btn){btn.textContent="Живое видео";btn.classList.remove("on")}

}

// What is only in a backup, and «Закрепить»: the operator sees not a setting but the minutes the primary lacks. The

// <recording>, from, to}` — the recording's id, the rec manifest's `requests`): its recorder fetches the range from the backup into it.

    const last=out[out.length-1];

  });

// The browser makes the offer; the first viewer makes the stream's row (`live/streams/<camera>`), the controller places
// it on a gateway, and the offer goes to that gateway's door. RTP goes gateway → browser: neither the console nor a
// worker carries media.

// H.265 in the browser's offer: Chrome numbers it below 96, and GStreamer's packer takes only 96–127. The gateway
// answers with the offer's numbers, so H.265's (and their rtx, apt=) move to free ones in 96–127 here.
function h265Dynamic(sdp){
  const used=new Set([...sdp.matchAll(/a=rtpmap:(\d+) /g)].map(m=>+m[1]));
  const free=[];for(let n=96;n<=127;n++)if(!used.has(n))free.push(n);
  const map={};
  for(const m of sdp.matchAll(/a=rtpmap:(\d+) H265\/90000/g)){const pt=+m[1];if(pt<96&&free.length)map[pt]=free.shift()}
  for(const [from,to] of Object.entries(map)){
    sdp=sdp.replace(new RegExp("a=(rtpmap|fmtp|rtcp-fb):"+from+" ","g"),(m,k)=>"a="+k+":"+to+" ")
      .replace(new RegExp("apt="+from+"(\\r|;|$)","gm"),"apt="+to+"$1")
      .replace(/^(m=video \d+ [A-Z\/]+)((?: \d+)+)/m,(m,h,l)=>h+l.split(" ").map(x=>x===from?String(to):x).join(" "));
  }
  return sdp;
}
// While watching: the camera's events every 3 s, newest first, the last 30 kept.
async function pollLive(id){
  if(!V.live)return;
  let d;
  try{const r=await fetch(`/events?from=${V.live.since}&to=1e12&unit=${encodeURIComponent("cam/"+id)}`);if(!r.ok)return;d=await r.json()}catch(e){return}
  if(!V.live)return;                       // the viewer hung up while it was asked
  const feed=$("#livefeed");if(!feed)return;
  (d.events||[]).sort((a,b)=>a.t-b.t).forEach(e=>{
    const k=`${e.server}|${e.bucket}|${e.t}|${e.kind}`;
    if(V.live.seen.has(k))return;
    V.live.seen.add(k);
    const el=document.createElement("div");el.className="ev";
    el.innerHTML=`<span class="swatch" style="background:${subColor(e.subsystem)}"></span>${fmtHMS(e.t)} <strong title="${esc(e.kind)}">${esc(evKindRu(e))}</strong> <small>${esc(e.subsystem)}${e.note?" · "+esc(e.note):""}${e.score!=null?" · "+esc(e.score):""}${e.fenced?" · отгорожено":""}</small>`;
    feed.insertBefore(el,feed.children[1]||null);
    while(feed.children.length>31)feed.removeChild(feed.lastChild);
    V.live.since=Math.max(V.live.since,e.t-1);
  });
  if(d.state&&d.state!=="live"&&feed.firstChild)feed.firstChild.textContent=`события, пока вы смотрите — ${d.state}`;
}

// A recording is a unit of rec (`rec/recordings/<name>`): a camera may have several, one per volume; `cam` says whose
// footage it holds and `home` the volume it lies on. The volumes are the rows of the table rec's manifest names as its
// places (`places.table`); a keep is a row of `rec/keeps` — a range that must not go by the retention.

const VOL_KIND={local:"локальный",network:"сетевой",backup:"резервный",edge:"карта камеры",incidents:"инциденты"};
function volKind(v,short){const k=VOL_KIND[v.kind]||v.kind||"—";return short||v.kind===VOL_NET?k:k+", "+(v.server||"—")}
async function loadRec(){

    const [r,v,k]=await Promise.all([getJSON("/rec/recordings"),T_PLACES?getJSON("/rec/"+encodeURIComponent(T_PLACES)):{},getJSON("/rec/keeps").catch(()=>({}))]);
    const byId={};(r.rows||[]).forEach(x=>{byId[String(x.id)]=x});
    recs=(r.configured||[]).map(c=>({...c,id:String(c.id),row:byId[String(c.id)]||null}));
    vols=((v||{})[T_PLACES]||[]).map(x=>({...x,quota_bytes:+x.quota_bytes||0,enabled:String(x.enabled)!=="false"}));
    keeps=(k||{}).keeps||[];

// A recording's state in one word: three different «not writing».
function recState(r){
  if(r.enabled===false)return{label:"Выключена",bad:true};
  const w=r.row;
  if(!w)return{label:"Не размещена",bad:true};
  if(w.worker_state==="stale")return{label:"Регистратор молчит",bad:true};
  if(w.phase==="running")return{label:"Пишет",bad:false};
  if(w.phase==="pending")return{label:"Запускается",bad:false};
  if(w.phase==="standby")return{label:"Ждёт: основная запись идёт",bad:false};
  if(w.phase==="waiting")return{label:"Ждёт том",bad:true};
  if(w.phase==="failed")return{label:"Ошибка",bad:true};
  return{label:w.phase||"—",bad:false};
}
// A volume is a PLACE when a recorder holds it (`held_by`): declared and served are different things, both shown.

  return{label:"Никто не обслуживает",bad:true};
}

// what the recorders say (servers.status in their worker rows): rec's own servers, read at /rec/servers with the rest
// of rec (loadRec) — the root /servers lists only the workers of the root subsystem. [{server, worker, status}]
let REC_SERVERS={};
const recWorkers=()=>Object.entries(REC_SERVERS||{}).flatMap(([server,s])=>(s.workers||[]).map(w=>({server,worker:w.worker,status:w.status||{}})));
const incidentsVol=()=>vols.find(v=>v.enabled&&v.kind==="incidents")||null;
// the holder's door answers the checks of a keep only when rec's manifest opens that route on it
const keepVerifyOn=()=>(((pc.manifest("rec")||{}).door||{}).routes||[]).includes("keeps");
// What the recorders say of the keeps, in their beat (servers.status of rec with `of: keeps`, ADR-0064):
// keeps {<keep>: {state, …}}, incidents_lost {<keep>: seconds}, incidents_at_risk [<keep>] — matched to the keep's row
// by its key. Only the fields rec's manifest names with of: keeps are read; nothing named — nothing said. Each recorder
// says its own part: the one writing a recording — here, pushing, pushed, at risk, lost, garbled (with recording); the
// holder of the incident archive — kept (V/02.7 Н1.5). A keep let go is its row's `released_at`, not a state.
const KEEP_STATE={
  here:{said:"в архиве записи",cls:"wait"},pushing:{said:"копируется в архив инцидентов",cls:"wait"},
  pushed:{said:"скопировано в архив инцидентов",cls:""},"at risk":{said:"под угрозой",cls:"off"},
  lost:{said:"потеряно",cls:"off"},kept:{said:"в архиве инцидентов",cls:""},garbled:{said:"не читается",cls:"off"}};
function keepSaid(name){
  const fields=new Set((((pc.manifest("rec")||{}).servers||{}).status||[]).filter(x=>x.of==="keeps").map(x=>x.field));
  const out={said:[]};
  for(const w of recWorkers()){const st=w.status||{};
    if(fields.has("keeps")&&st.keeps&&typeof st.keeps==="object"&&st.keeps[name]&&typeof st.keeps[name]==="object")out.said.push({...st.keeps[name],worker:w.worker});
    if(fields.has("incidents_lost")&&st.incidents_lost&&st.incidents_lost[name]!=null)out.lost=+st.incidents_lost[name];
    if(fields.has("incidents_at_risk")&&Array.isArray(st.incidents_at_risk)&&st.incidents_at_risk.map(String).includes(name))out.risk=true}
  // the holder's word first, then the recordings by name
  out.said.sort((x,y)=>(x.recording?1:0)-(y.recording?1:0)||String(x.recording||"").localeCompare(String(y.recording||"")));
  return out;
}
const daysHours=s=>{s=Math.max(0,Math.round(+s||0));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return d?`${d} д ${h} ч`:h?`${h} ч ${m} мин`:`${m} мин`};
function keepStateHtml(name){
  const s2=keepSaid(name),parts=[];
  for(const k of s2.said){
    const st=KEEP_STATE[k.state]||{said:String(k.state||"—"),cls:"wait"},who=k.recording?esc(k.recording)+": ":"";
    const more=[];
    if(k.seconds!=null&&k.state!=="lost")more.push(`${Math.round(+k.seconds)} с`);
    if(k.state==="here"&&k.leaves_in_s!=null)more.push(`кольцо заберёт через ${daysHours(k.leaves_in_s)}`);
    if(k.state==="lost"&&k.lost_seconds!=null)more.push(`${Math.round(+k.lost_seconds)} с`);
    parts.push(`<span class="bd${st.cls?" "+st.cls:""}">${who}${esc(st.said)}${more.length?" · "+esc(more.join(" · ")):""}</span>`);
    if(k.why&&(k.state==="at risk"||k.state==="garbled"))parts.push(`<small style="color:var(--rd)">${esc(k.why)}</small>`);
    // the recordings that hold no footage in the keep's stretch (the holder's keeps.<id>.empty): nothing to seal there
    if(Array.isArray(k.empty)&&k.empty.length)parts.push(`<small class="sub">в отрезке нет кадров у ${esc(k.empty.join(", "))} — запечатывать нечего</small>`);
  }
  if(s2.lost)parts.push(`<small style="color:var(--rd)">архив инцидентов потерял ${Math.round(s2.lost)} с из удержанного</small>`);
  if(s2.risk)parts.push(`<span class="bd off">под угрозой: кольцо записи заберёт раньше, чем скопирует</span>`);
  return parts.length?`<span style="display:flex;flex-direction:column;gap:2px;align-items:flex-end">${parts.join("")}</span>`:"";
}

function toLocalInput(t){const d=new Date(t*1000),z=n=>String(n).padStart(2,"0");

// A keep's range by default is what the timeline shows («Удержать показанное»), else the last hour.
async function openKeep(cam,from,to){
  const now=Date.now()/1000;
  if(!(from>0))from=now-3600;
  if(!(to>from))to=now;
  const v=await pc.dialog("Удержать отрезок: "+camName(cam),[{name:"from",label:"С (ГГГГ-ММ-ДД ЧЧ:ММ)",value:toLocalInput(from)},{name:"to",label:"По",value:toLocalInput(Math.min(to,now))},
    {name:"note",label:"Зачем",help:"что произошло: для тех, кто будет разбирать"}],"Удержать");
  if(!v)return;
  const f=fromLocalInput(v.from),t=fromLocalInput(v.to);

// The check of a keep's seal is the incidents volume holder's (its door, ADR-0015, ADR-0057 p. 3): the copy lies there.
// One request per recording of the keep: the door is a place token for the recording <r> (/rec/where/<table>/<volume>
// ?unit=<r>, the recording's id), and the check names it (?recording=<r>). The answers in one word each: ok, broken, unknown.
async function verifyKeep(id){
  const inc=incidentsVol(),k=keeps.find(x=>x.name===id);
  if(!inc||!inc.held_by){pc.toast("Архив инцидентов никто не держит — проверять негде");return}
  const list=k&&Array.isArray(k.recordings)&&k.recordings.length?k.recordings.map(String):recs.filter(r=>k&&String(r.cam)===String(k.cam)).map(r=>r.id);
  if(!list.length){pc.toast("У удержания нет записей — проверять нечего");return}
  const said=[];let bad=false;
  for(const r of list){
    try{const where=`/rec/where/${encodeURIComponent(T_PLACES)}/${encodeURIComponent(inc.name)}?unit=${encodeURIComponent(r)}`;
      const res=await doorFetch(where,"/keeps/"+encodeURIComponent(id)+"/verify?recording="+encodeURIComponent(r),{method:"POST"});
      if(!res){said.push(`${r}: дверь держателя архива инцидентов не ответила`);bad=true;continue}
      const d=await res.json().catch(()=>({}));
      if(!res.ok){said.push(`${r}: ${d.detail||d.error||res.status}`);bad=true;continue}
      // integrity: "ok" | "broken: <why>" | "unknown: <why>"; a recording that holds no footage in the stretch is not a
      // failure and nothing to wait for (its result: "empty") — said apart
      const g=String(d.integrity||""),why=g.replace(/^[a-z]+:\s*/,""),what=((d.recordings||{})[r]||{}).result;
      if(what==="empty")said.push(`в этом отрезке у ${r} нет кадров — запечатывать нечего`);
      else if(g==="ok")said.push(`${r}: цело`);else{bad=true;said.push(`${r}: ${g.startsWith("broken")?"повреждено — "+why:g.startsWith("unknown")?"не с чем сравнить — "+why:g||"нет ответа"}`)}
    }catch(e){said.push(`${r}: ${e.message}`);bad=true}
  }
  pc.toast((bad?"Не подтверждено: ":"Проверено: ")+said.join("; "));
  await reloadRec();
}

// The same refusals as the server's, in its words: a screen that takes what the subsystem will refuse lies twice.
function ruleProblem(r){
  if(!r.name)return"У сценария должно быть имя: по нему его находят в списке и в журнале";
  if(!r.when.length||r.when.length>4)return"«если» — от одного до четырёх событий";
  if(r.when.some(t=>!t.sub||!t.kind))return"у события должны быть подсистема и вид";
  if(!r.then.length||r.then.length>4)return"«то» — от одного до четырёх действий";
  for(const a of r.then){const k=actionKind(a),miss=k.fields.filter(f=>!f.opt).find(f=>!String(a[f.id]??"").trim());if(miss)return`«${k.label}»: не заполнено поле «${miss.label}»`}
  for(const a of r.then){const k=actionKind(a),j=k.fields.find(f=>f.json&&a[f.id]!=null&&(typeof a[f.id]!=="object"||Array.isArray(a[f.id])));if(j)return`«${k.label}»: «${j.label}» — объект JSON`}
  if(r.within<0||r.within>3600)return"«в пределах» — от 0 до 3600 секунд";
  // what one field's form cannot say — the evaluator's refusal of two fields together (V/07.3 Н1.1), said before writing
  if(r.when.length>1&&!r.within)return"два события и больше — нужно «в пределах»: окно, в которое они должны попасть";
  if(r.when.length===1&&r.within)return"«в пределах» — окно между событиями; у одного события окна нет";
  if(r.rate_per_minute&&(r.rate_per_minute<1||r.rate_per_minute>600))return"не чаще — от 1 до 600 в минуту (0 — по умолчанию)";
  if(r.valid_for&&(r.valid_for<5||r.valid_for>600))return"заявка действительна — от 5 до 600 секунд (0 — по умолчанию)";
  return"";
}
const parseMatch=s=>Object.fromEntries(String(s||"").split(",").map(x=>x.split("=").map(y=>y.trim())).filter(x=>x[0]&&x[1]!==undefined&&x[1]!==""));
const matchText=m=>Object.entries(m||{}).map(([k,v])=>`${k}=${v}`).join(", ");

      ${k.fields.map(f=>`<div><label>${esc(f.label)}${f.opt?" <span class='sub'>необяз.</span>":""}</label><input type="text" value="${esc(f.json&&a[f.id]!=null&&typeof a[f.id]==="object"?JSON.stringify(a[f.id]):a[f.id]??"")}" data-act="af" data-i="${i}" data-f="${esc(f.id)}"${f.json?' data-json="1"':""}></div>`).join("")}
      <div><label>&nbsp;</label><button type="button" class="btn s" title="Убрать" data-act="adel" data-i="${i}">✕</button></div></div>`}).join("")+

      <span class="sub">заявка действительна <input type="number" min="0" max="600" style="width:80px" value="${esc(r.valid_for)}" data-act="rf" data-f="valid_for"> с · не чаще <input type="number" min="0" max="600" style="width:80px" value="${esc(r.rate_per_minute)}" data-act="rf" data-f="rate_per_minute"> в минуту (0 — по умолчанию)</span></div>

  return`<h1>${esc(r.name||"Новый сценарий")}</h1>

      <div><label>Включён</label><select data-act="rf" data-f="enabled"><option value="1" ${r.enabled?"selected":""}>да</option><option value="0" ${r.enabled?"":"selected"}>нет</option></select></div></div>`)}

    ${bad?`<div class="nt err">${esc(bad)}</div>`:""}
    <div class="vrow"><button type="button" class="btn pri s" data-act="save" ${ruleDraft?"":"disabled"}>Сохранить</button>${ruleDraft?`<button type="button" class="btn s" data-act="undo">Отменить</button>`:""}${r.id?`<button type="button" class="btn s" data-act="del">Удалить</button>`:""}</div>
    ${r.id?card("Последние срабатывания",fires.length?`<table><tr><th>Время</th><th>Действий</th></tr>${fires.map(e=>`<tr><td>${esc(fmtT(e.t))}</td><td>${esc(Array.isArray(e.actions)?String(e.actions.length):e.actions??"—")}${e.late?" · срок прошёл, не подано":""}</td></tr>`).join("")}</table>`:`<p class="sub">Ещё не срабатывал.</p>`):""}`;
}
function renderRules(){
  if(!RULES_HOST||!RULES_HOST.isConnected)return;
  const r=curRule();
  RULES_HOST.innerHTML=`<div class="auto-rules"><aside class="auto-rules-list">${rulesListHtml()}</aside><section class="auto-rules-card">${autoOff
    ?offCard("Сценарии","подсистема не смонтирована","Консоль запущена без auto: сценарии писать некуда.")
    :r?ruleCardHtml(r):card("Выберите сценарий",`<p class="sub">Сценарий — «когда случилось это — попросить сделать то». Вычислитель читает тот же журнал, что раздел «Журнал», и подаёт заявку тому, кто держит устройство: консоль ничего не выполняет сама.</p>`)}</section></div>`;
  if(r&&r.id&&!(r.id in ruleFires))loadFires(r.id);
  const num=v=>parseInt(v,10)||0,i=el=>+el.dataset.i;
  wire(RULES_HOST,{
    pick:el=>{RSEL=el.dataset.id;ruleDraft=null;renderRules()},
    new:()=>{RSEL=null;const a=actionsOn()[0];ruleDraft={id:"",name:"",enabled:true,rate_per_minute:0,within:0,valid_for:0,when:[{sub:"cam",kind:(triggerKinds()[0]||["silent"])[0]}],then:[{sub:a.sub,action:a.action}]};renderRules()},
    rf:(el)=>{const d=editRule(),f=el.dataset.f;d[f]=f==="enabled"?el.value==="1":f==="name"?el.value.trim():num(el.value);renderRules()},
    tf:(el)=>{const t=editRule().when[i(el)],f=el.dataset.f,v=el.value.trim();if(f==="match"){const m=parseMatch(v);if(Object.keys(m).length)t.match=m;else delete t.match}else if(v)t[f]=v;else delete t[f];renderRules()},
    tadd:()=>{editRule().when.push({sub:"cam",kind:""});renderRules()},
    tdel:el=>{editRule().when.splice(i(el),1);renderRules()},
    akind:el=>{const k=actionsOn()[+el.value];if(k)editRule().then[i(el)]={sub:k.sub,action:k.action};renderRules()},
    af:el=>{const a=editRule().then[i(el)],v=el.value.trim();
      // a JSON field kept as typed when it does not parse: ruleProblem names it, nothing is written
      if(!v)delete a[el.dataset.f];else if(el.dataset.json){try{a[el.dataset.f]=JSON.parse(v)}catch(e){a[el.dataset.f]=v}}else a[el.dataset.f]=v;renderRules()},
    aadd:()=>{const k=actionsOn()[0];editRule().then.push({sub:k.sub,action:k.action});renderRules()},
    adel:el=>{editRule().then.splice(i(el),1);renderRules()},
    save:()=>saveRule(),undo:()=>{ruleDraft=null;renderRules()},del:()=>delRule(RSEL)});
}
async function saveRule(){
  const r=ruleDraft;if(!r)return;
  const bad=ruleProblem(r);if(bad){pc.toast("Отказано: "+bad);return}
  const body={enabled:r.enabled,when:r.when,then:r.then,within:r.within,rate_per_minute:r.rate_per_minute,valid_for:r.valid_for};
  try{
    if(r.id)await pc.api("PUT","/auto/scenarios/"+encodeURIComponent(r.id),body);
    else await pc.api("POST","/auto/scenarios",{name:r.name,...body});
    RSEL=r.id||r.name;ruleDraft=null;await loadAuto();renderRules();pc.toast("Сохранено");
  }catch(e){pc.toast("Отказано: "+e.message)}
}
function delRule(id){
  if(!id||!pc.confirm(`Удалить сценарий «${id}»?`,"Уже поданные заявки этим не отменяются: их выполнит или отвергнет тот, кому они адресованы."))return;
  (async()=>{try{await pc.api("DELETE","/auto/scenarios/"+encodeURIComponent(id));RSEL=null;ruleDraft=null;await loadAuto();renderRules();pc.toast("Сценарий удалён")}
    catch(e){pc.toast("Отказано: "+e.message)}})();
}
pc.addSection({id:"rules",label:"Сценарии",icon:"bolt",after:"units",render:host=>{RULES_HOST=host;loadAuto().then(renderRules)}});

// ── The domain, as the VMS sees it ───────────────────────────────────────────────────────────────────────────────
// The domain holder's view (`GET /domain`, the module hands it over on refresh): its `units` by subsystem — every
// member's units with their cluster, server, worker and phase — and its `tables`, the domain's tables the manifests serve (`domain/placement/rec/`:
// for a camera, the cluster that records it). The module draws the domain's platform part (members, topology, alarms,
// keys); this is the rest: a member's cameras and archives in the tree, their cards, recording assignments. The page
// writes only the assignment (`PUT /domain/placement/rec/<ref>`); the recordings are their clusters' rows.
const DOM_CAM={live:["идёт",""],stale:["воркер молчит — последнее известное","wait"],configured:["настроена, никто не держит","wait"],unreachable:["кластер молчит — последнее известное","off"]};
const domUnits=(sub,cluster)=>((((domView&&domView.units)||{})[sub])||[]).filter(u=>cluster==null||u.cluster===cluster);
const domKey=u=>u.cluster+"/"+u.unit;
const domFind=(sub,key)=>domUnits(sub).find(u=>domKey(u)===key)||null;
const assignments=()=>Object.fromEntries(Object.entries((PLACEMENTS&&PLACEMENTS.records)||{}).filter(([key])=>key.startsWith("rec/")).map(([key,row])=>[key.slice(4),row]));
const domDot=u=>{const st=DOM_CAM[u.worker_state]||[u.worker_state||"?","mu"];return[st[1]==="off"?"var(--rd)":st[1]==="wait"?"#f0c36a":"var(--gn)",st[0]]};
const domBadge=u=>{const st=DOM_CAM[u.worker_state]||[u.worker_state||"?","mu"];return`<span class="bd ${st[1]}">${esc(st[0])}</span>`};
// a member's cameras, then its archives (the recordings it writes); a member of one camera stands as its camera, its
// archives under it, open from the first look (the product's camera server)
pc.addTreeNodes("member",ref=>{
  const name=ref.slice(7),cams=domUnits("cam",name),arcs=domUnits("rec",name);
  const arc=u=>({ref:"da:"+domKey(u),label:"Архив · "+(u.name||u.unit),icon:"storage",dot:domDot(u),title:"Запись кластера "+u.cluster});
  const cam=u=>({ref:"dc:"+domKey(u),label:u.name||u.ref||u.unit,icon:"camera",dot:domDot(u),tags:[{text:u.ref||"id "+u.unit,title:"Имя камеры в домене"}]});
  if(cams.length===1)return[{...cam(cams[0]),replaces:true,title:"Сервер-камера "+name,open:arcs.length>0,kids:arcs.map(arc)}];
  return cams.map(cam).concat(arcs.map(u=>({...arc(u),after:true})));
});
// Which cluster records a camera is the domain operator's assignment (`domain/placement/rec/<ref>`, P/08.6 Н1.1; V/02.9
// Н1.1): `cluster` — the primary's, `origin` — the camera's, `copies` — the backups' (`when: offline`). The assignment
// creates no row: the recording cluster's operator makes `rec/recordings` there (`cam: ref:<ref>`, `ref`) — the domain's
// door edits only `domain.edit` (enabled, retention_days) and cannot make one. A move leaves the former primary standing
// with its archive until its days run out; its row is its cluster operator's to remove.
async function domainRecording(camera,backup=false){
  const ref=camera.ref;
  if(!ref){pc.toast("Для записи нужно имя камеры в домене");return}
  const route="/domain/placement/rec/"+encodeURIComponent(ref);
  let old=null;
  try{old=await pc.api("GET",route)}catch(e){if(e.status!==404){pc.toast("Назначение недоступно: "+e.message);return}}
  if(backup&&!old){pc.toast("Сначала назначьте основную запись");return}
  const was=old?jsonList(old.copies):[];
  const members=((domView&&domView.members)||[]).filter(m=>!m.left&&!m.refused&&(!backup||m.name!==old.cluster&&!was.includes(m.name)));
  if(!members.length){pc.toast("Нет кластера для этой записи");return}
  const v=await pc.dialog(backup?"Резервная запись":"Основная запись",[
    {name:"cluster",label:"Кластер",value:old&&!backup?old.cluster:"",options:members.map(m=>[m.name,m.name])}],backup?"Добавить резерв":"Назначить");
  if(!v)return;
  if(!members.some(m=>m.name===v.cluster)){pc.toast("Выберите кластер из списка");return}
  const primary=backup?old.cluster:v.cluster;
  // copies: the other executors, ascending, no repeats, not the primary (P/08.6 Н2)
  const copies=[...new Set(backup?[...was,v.cluster]:was)].filter(n=>n!==primary).sort();
  try{
    await pc.api("PUT",route,{cluster:primary,origin:camera.cluster,copies});
    PLACEMENTS=await pc.api("GET","/domain/placement");
    if(assignmentHost)renderAssignments(assignmentHost);
    const row=`строку rec/recordings с cam: ref:${ref}, ref: ${ref}`+(backup?", дом на резервном томе, when: offline":"");
    const moved=!backup&&old&&old.cluster!==v.cluster?` Запись кластера ${old.cluster} встанет и хранит архив до срока; её строку убирает оператор ${old.cluster}.`:"";
    pc.toast(`${backup?"Резерв назначен":"Запись назначена"} в ${v.cluster}. Оператор ${v.cluster} заводит ${row}.${moved}`);
  }catch(e){pc.toast("Отказано: "+e.message)}
}

// No credentials are cached with the metadata. A password lives only in the result input's value property:
// the module's HTML snapshots, browser storage and subsequent list responses cannot restore it.

  const left=A.results&&Object.values(A.results).some(r=>["pending","skipped"].includes(r.outcome));
  if(!left)assistForgetSecrets();    // the secrets live while «Повторить» may still send them (V/10.6 Н1.3)
  assistDraw()}
function assistRebuild(){
  if(!A.turn||!A.results)return;
  const texts=A.turn.texts.slice(),notes=A.plan.rows.filter(r=>A.results[r.unit]&&A.results[r.unit].outcome!=="applied").map(r=>`${r.unit}: ${A.results[r.unit].outcome}`);
  assistForgetSecrets();A.turn=AS.newTurn();A.turn.texts=texts;A.results=null;A.plan=null;A.shown=null;
  A.log.push({who:"page",text:"Перестройка: "+notes.join(", ")});
  assistRun(null,"The previous plan was applied in part. Rows to rebuild from a fresh reading: "+notes.join("; ")+".")}
function assistDraw(){
  const h=A.host;if(!h||!h.isConnected)return;
  const L=A.log.map(e=>e.who==="admin"?`<div class="as-msg as-admin">${esc(e.text)}</div>`:
    e.who==="model"?`<div class="as-msg as-model"><small>слова модели</small>${esc(e.text)}</div>`:
    `<div class="as-msg as-page">${esc(e.text)}${e.detail?`<details><summary>причина</summary><code>${esc(e.detail)}</code></details>`:""}</div>`).join("");
  let P="";
  if(A.shown){const s=A.shown;
    P=`<div class="as-sel"><b>Кого выбрали:</b> ${esc(s.by)}${s.subs?` · ${esc(s.subs)}`:""} · отобрано ${s.picked}, в плане ${s.inPlan}</div>
      <table class="as-diff"><tr><th>Единица</th><th>Почему в плане</th><th>Поле</th><th>Было → станет</th><th>Причина модели</th></tr>${s.rows.map(r=>r.changes.map((c,i)=>`<tr>${i?"<td></td><td></td>":`<td>${esc(r.unit)}</td><td>${esc(r.cond)}</td>`}<td>${esc(c.label)}</td><td>${esc(c.from)} → ${esc(c.to)}</td><td>${esc(c.why)}</td></tr>`).join("")).join("")}</table>`;
    const R=A.results;
    if(R)P+=`<ul class="as-res">${A.plan.rows.map(r=>{const o=R[r.unit]||{};return`<li class="as-${esc(o.outcome||"")}">${esc(r.unit)} — ${esc(ASSIST_OUT[o.outcome]||o.outcome||"")}${o.words?": "+esc(o.words):""}</li>`}).join("")}</ul>`;
    const left=R&&Object.values(R).some(o=>["pending","skipped"].includes(o.outcome)),redo=R&&Object.values(R).some(o=>o.outcome!=="applied");
    P+=FEATURES.has("api.if-match")?
      `<div class="vrow">${!R?`<button class="btn" data-act="apply"${A.applying?" disabled":""}>Применить</button>`:""}${left?`<button class="btn" data-act="again"${A.applying?" disabled":""}>Повторить</button>`:""}${redo&&!A.applying?`<button class="btn" data-act="rebuild">Перестроить</button>`:""}</div>`:
      `<p class="sub bad">Запись по версии недоступна: модуль консоли без api.if-match.</p>`}
  const models=A.models.map(m=>`<option value="${esc(m.id)}"${m.id===A.model?" selected":""}>${esc(m.id)}</option>`).join("");
  h.innerHTML=card("Ассистент",`
    <div class="vrow"><label>Модель</label><select data-act="model"${A.busy||A.ask?" disabled":""}>${models}</select><span class="as-status sub">${esc(A.status)}</span></div>
    <div class="as-log">${L}</div>${P}
    <textarea class="as-text" rows="3" placeholder="${A.ask?"Ответьте словами — назовите поле и значение; «да» ничего не называет":"Что сделать? Например: включи запись камер третьего этажа"}"${A.busy?" disabled":""}></textarea>
    <div class="vrow"><button class="btn" data-act="send"${A.busy?" disabled":""}>${A.ask?"Ответить":"Отправить"}</button>
      <button class="btn" data-act="secret"${A.busy?" disabled":""}>Пароль…</button>
      ${A.busy||A.ask?`<button class="btn" data-act="cancel">Отменить ход</button>`:""}<button class="btn" data-act="new">Новый ход</button></div>
    <div class="as-secrets"></div>`);
  wire(h,{send:assistSend,cancel:assistCancel,new:assistNew,apply:()=>assistApply(false),again:()=>assistApply(true),rebuild:assistRebuild,model:el=>{A.model=el.value},
    secret:()=>{const box=h.querySelector(".as-secrets"),n=A.secrets.size+box.children.length+1;
      box.insertAdjacentHTML("beforeend",`<div class="as-secret-row"><label>Секрет № ${n}</label><input type="password" class="as-secret" autocomplete="off"></div>`)}})}
// The section: only when the console mounts assist and the session sees a model row (V/10.3 Н1.1).
if(AS)pc.ready.then(async()=>{
  const r=await assistConsole.get("/assist/models");const rows=(r.status===200&&r.body&&r.body.configured)||[];if(!rows.length)return;   // no assist, or no model row the session sees
  const live=new Set(((r.body&&r.body.rows)||[]).filter(x=>x.phase==="running"||x.state==="running").map(x=>String(x.id)));
  A.models=rows.map(x=>({id:String(x.id),context:x.context})).sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);
  A.model=(A.models.find(x=>live.has(x.id))||A.models[0]).id;
  pc.addSection({id:"assist",label:"Ассистент",icon:"bolt",after:"rules",render:host=>{A.host=host;assistDraw()}});
  addEventListener("pagehide",()=>{A.cancelled=true;assistDrop(true)});
  pc.on("logout",()=>{assistCancel();A.log=[];assistDraw()});
});
// assist:panel:end
</script>
