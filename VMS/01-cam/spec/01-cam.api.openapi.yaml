openapi: 3.1.0
info:
  title: V/01 — дверь держателя камеры (архив устройства)
  version: 1.0.0
  description: |
    HTTP-контракт двери держателя `camworker` — главы V/01.5 урока «Камера» модуля VMS. Канон —
    [нормы главы 5](01.5-cam.norms.md); этот файл их выражает и не добавляет требований: порядок отказов,
    пределы, куски и бюджет — Н1.5, Н3; личность клиента и разбор запроса — Н2 (сертификат роли, класс `role`
    договора сертификата роли; без комплекта — только петля, маршруты — 401 `no_role`). Только `GET`; иной метод на
    маршруте — 405, иной путь — 404 `no such path`. Порядок: путь → метод → допуск → query (Н2). Цепочка, отвергнутая
    TLS, — отказ рукопожатия без HTTP-ответа (в контракте не выражается).
servers:
  - url: https://{server}:{port}
    description: с комплектом роли camworker — адрес SERVER_NAME (V/01.5 Н1.2; P/03.4 Н1.7 kit); сертификат клиента обязателен
    variables:
      server: {default: "srv-a"}
      port: {default: "0"}
  - url: http://127.0.0.1:{port}
    description: без комплекта сертификатов — только петля; маршруты отвечают 401 no_role (V/01.5 Н1.2, Н2)
    variables:
      port: {default: "0"}
security:
  - roleCertificate: []
paths:
  /devices:
    get:
      summary: Устройства группы держателя (V/01.5 Н1.4)
      responses:
        "200":
          description: по элементу на устройство
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/NoRole"}
        "403": {$ref: "#/components/responses/RoleRefusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /recordings/{id}:
    get:
      summary: Перечень кусков архива устройства по камере (V/01.5 Н1.3, Н3)
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: куски, подрезанные к [from, to)
          content:
            application/json:
              schema:
                type: object
                required: [spans]
                additionalProperties: false
                properties:
                  spans:
                    type: array
                    items: {$ref: "#/components/schemas/Span"}
        "400": {$ref: "#/components/responses/Refusal"}
        "401": {$ref: "#/components/responses/NoRole"}
        "403": {$ref: "#/components/responses/RoleRefusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "501": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /playback/{id}:
    get:
      summary: Байты архива устройства за интервал (V/01.5 Н1.3, Н3)
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: |
            байты устройства как есть; HTTP/1.1 — Transfer-Encoding chunked, без Content-Length; отказ после
            первого байта — ответ без последнего куска; Range не поддерживается
          content:
            video/mp4:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/Refusal"}
        "401": {$ref: "#/components/responses/NoRole"}
        "403": {$ref: "#/components/responses/RoleRefusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
components:
  securitySchemes:
    roleCertificate:
      type: mutualTLS
      description: |
        сертификат роли клиента (класс `role` договора сертификата роли): допущены recworker, detjobworker,
        detedgeworker; набор доверия — ca.pem, ca.next.pem своего кластера (V/01.5 Н2)
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: id камеры (V/01.1 Н1.1)
      schema: {type: string, pattern: "^(?:[0-9]+)$"}
    From:
      name: from
      in: query
      required: false
      description: |
        секунды Unix, включительно, запись числа JSON, конечное; без параметра — от начала архива; повтор, пустое
        значение, иная запись, from > to — 400 bad range (V/01.5 Н2)
      schema: {type: number}
    To:
      name: to
      in: query
      required: false
      description: |
        секунды Unix, не включительно, запись числа JSON, конечное; без параметра — до конца архива; повтор, пустое
        значение, иная запись, from > to — 400 bad range (V/01.5 Н2)
      schema: {type: number}
  responses:
    Refusal:
      description: отказ (V/01.5 Н4); 503 предела соединений — с заголовком Retry-After 1; у /playback роли detedgeworker — и
        запас сессий устройства PLAYBACK_SPARE (Н1.5, Н3)
      headers:
        Retry-After:
          required: false
          schema: {type: integer}
      content:
        application/json:
          schema:
            type: object
            required: [error]
            additionalProperties: false
            properties:
              error: {type: string}
              detail: {type: string}
    NoRole:
      description: |
        сертификата клиента нет (с комплектом) или комплекта нет (петля) — 401 no_role (V/01.5 Н2)
      content:
        application/json:
          schema:
            type: object
            required: [error]
            additionalProperties: false
            properties:
              error: {const: no_role}
              detail: {type: string}
    RoleRefusal:
      description: |
        после рукопожатия: роль не из допущенных — wrong_role; роли в SAN не ровно одна — no_role; подпись листа
        или центра вне sig — bad_chain (класс `role` договора сертификата роли; V/01.5 Н2)
      content:
        application/json:
          schema:
            type: object
            required: [error]
            additionalProperties: false
            properties:
              error: {enum: [no_role, wrong_role, bad_chain]}
              detail: {type: string}
  schemas:
    Span:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from: {type: number}
        to: {type: number}
    Device:
      type: object
      required: [device, known]
      additionalProperties: false
      properties:
        device: {type: string}
        state: {enum: [slow, failed, opening]}
        since: {type: number}
        channels: {type: integer, minimum: 0}
        known:
          type: array
          items: {type: string}
        unimported:
          type: array
          items: {type: string}
        playbacks: {type: integer, minimum: 0}
        max_playbacks: {type: [integer, "null"], minimum: 0}
        reads_stuck:
          type: array
          items: {type: string}
        can:
          description: описание устройства без identity (V/01.4 Н1.4)
          type: object
          additionalProperties: false
          properties:
            events:
              type: array
              items: {type: string}
            rays: {type: integer, minimum: 0}
            relays: {type: integer, minimum: 0}
            ptz: {type: boolean}
            presets: {type: integer, minimum: 0}
        same_serial_as: {type: string}
        why: {type: string}
