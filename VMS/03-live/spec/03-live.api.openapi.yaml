openapi: 3.1.0
info:
  title: V/03 — дверь шлюза живого видео
  version: 1.0.0
  description: |
    HTTP-контракт двери шлюза `liveworker` — урок V/03 «Живое видео» модуля VMS. Канон — нормы глав `03.K-live.norms.md`;
    файл их выражает и не добавляет требований. Маршрут `whep` (глава V/03.3): оффер и отбой; допуск — токен двери консоли
    (`GET /live/where/<cam>`, договор токена двери; `Authorization: Bearer` или `?t=`). Разбор запроса — P/01.1 Н2.1 с
    отступлениями глав V/03.3 и V/03.6: путь байт в байт (`/whep/7/`, пустые сегменты — 404), иной метод — 405, повтор
    `stream` — 400, пустой `stream` — основной; тело SDP — не больше 256 КиБ **байтов** по `Content-Length` (V/03.3 Н1.2;
    `maxLength` меряет знаки и предела не выражает). CORS — `cors` договора сертификата роли (V/03.3 Н1.4), в контракте не
    выражается.
    Учётки потоков (глава V/03.6) — маршруты консоли кластера `/live/accounts…` (смонтированная `live`) и `/accounts…`
    (`CONSOLE_ROOT=live`), которые консоль передаёт шлюзу (`door.pass`): право человека проверяет консоль (view — чтение,
    admin — запись); шлюз — лист роли `console` (класс `role`) и удостоверение человека снова (V/03.6 Н1.2). Путь, который
    получает шлюз, — `/accounts…` при любом корне (запрос к платформе по договору передачи, P/06.5).
servers:
  - url: https://{server}:{port}
    description: шлюз с комплектом роли liveworker — адрес SERVER_NAME (P/03.4 Н1.7 kit)
    variables:
      server: {default: "srv-a"}
      port: {default: "0"}
  - url: http://127.0.0.1:{port}
    description: шлюз без комплекта сертификатов — только петля (P/03.4 Н1.7); двери учёток закрыты (no_kit, 401 no_role)
    variables:
      port: {default: "0"}
paths:
  /whep/{cam}:
    post:
      summary: Оффер WebRTC — ответ без trickle (Н1.2)
      security: [{doorToken: []}]
      parameters:
        - name: cam
          in: path
          required: true
          description: id камеры — имя раздачи (V/03.1 Н1.1)
          schema: {type: string, minLength: 1}
        - name: stream
          in: query
          required: false
          description: поток камеры — id её прочего потока (раскодированный); нет или пусто — основной; повтор параметра — 400; поток не этой камеры — 404 `stream refused` (V/03.3 Н1.2)
          schema: {type: string}
      requestBody:
        required: true
        description: оффер SDP; не больше 256 КиБ байтов по Content-Length (V/03.3 Н1.2), иначе 413 до чтения тела
        content:
          application/sdp:
            schema: {type: string}
      responses:
        "201":
          description: ответ SDP со всеми кандидатами ICE
          headers:
            Location:
              required: true
              description: "/whep/session/<sid>?gateway=<имя шлюза>"
              schema: {type: string}
          content:
            application/sdp:
              schema: {type: string}
        "400": {$ref: "#/components/responses/Refusal"}
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "413": {$ref: "#/components/responses/Refusal"}
        "415": {$ref: "#/components/responses/Refusal"}
        "500": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /whep/session/{session}:
    delete:
      summary: Отбой своей сессии (Н1.3)
      security: [{doorToken: []}]
      parameters:
        - name: session
          in: path
          required: true
          description: sid из Location ответа на оффер
          schema: {type: string, pattern: "^(?:[0-9a-f]{32})$"}
        - name: gateway
          in: query
          required: false
          description: имя шлюза из Location; своё — как без параметра, чужое — 404 `no session` (после проверки токена, V/03.3 Н1.3)
          schema: {type: string}
      responses:
        "204":
          description: сессия закрыта
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
  /live/accounts:
    $ref: "#/components/pathItems/Accounts"
  /live/accounts/{name}:
    $ref: "#/components/pathItems/Account"
  /live/accounts/{name}/password:
    $ref: "#/components/pathItems/AccountPassword"
  /accounts:
    $ref: "#/components/pathItems/Accounts"
  /accounts/{name}:
    $ref: "#/components/pathItems/Account"
  /accounts/{name}/password:
    $ref: "#/components/pathItems/AccountPassword"
components:
  pathItems:
    Accounts:
      servers:
        - url: https://{console}
          description: консоль кластера (корень или монтирование `live`); шлюзу маршрут передаётся door.pass
          variables:
            console: {default: "console.example"}
      get:
        summary: Учётки потоков кластера, без паролей (V/03.6 Н1.2; через door.pass консоли, право view)
        security: [{personToken: []}]
        responses:
          "401": {$ref: "#/components/responses/Refusal"}
          "403": {$ref: "#/components/responses/Refusal"}
          "200":
            description: список
            content:
              application/json:
                schema:
                  type: object
                  required: [accounts]
                  additionalProperties: false
                  properties:
                    accounts:
                      type: array
                      items: {$ref: "#/components/schemas/Account"}
          "502": {$ref: "#/components/responses/Refusal"}
          "503": {$ref: "#/components/responses/Refusal"}
      post:
        summary: Новая учётка — пароль один раз (право admin)
        security: [{personToken: []}]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [name]
                additionalProperties: false
                properties:
                  name: {type: string, minLength: 1, maxLength: 64}
        responses:
          "401": {$ref: "#/components/responses/Refusal"}
          "403": {$ref: "#/components/responses/Refusal"}
          "201": {$ref: "#/components/responses/WithPassword"}
          "400": {$ref: "#/components/responses/Refusal"}
          "409": {$ref: "#/components/responses/Refusal"}
          "502": {$ref: "#/components/responses/Refusal"}
          "503": {$ref: "#/components/responses/Refusal"}
    Account:
      servers:
        - url: https://{console}
          description: консоль кластера (корень или монтирование `live`); шлюзу маршрут передаётся door.pass
          variables:
            console: {default: "console.example"}
      parameters:
        - $ref: "#/components/parameters/AccountName"
      put:
        summary: Включить или отключить учётку (право admin)
        security: [{personToken: []}]
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [disabled]
                additionalProperties: false
                properties:
                  disabled: {type: boolean}
        responses:
          "401": {$ref: "#/components/responses/Refusal"}
          "403": {$ref: "#/components/responses/Refusal"}
          "200":
            description: учётка после правки
            content:
              application/json:
                schema:
                  type: object
                  required: [account]
                  additionalProperties: false
                  properties:
                    account: {$ref: "#/components/schemas/Account"}
          "400": {$ref: "#/components/responses/Refusal"}
          "404": {$ref: "#/components/responses/Refusal"}
          "502": {$ref: "#/components/responses/Refusal"}
          "503": {$ref: "#/components/responses/Refusal"}
      delete:
        summary: Удалить строку учётки; гранты снимает сверка домена (право admin; повтор — 404)
        security: [{personToken: []}]
        responses:
          "401": {$ref: "#/components/responses/Refusal"}
          "403": {$ref: "#/components/responses/Refusal"}
          "200":
            description: удалена
            content:
              application/json:
                schema:
                  type: object
                  required: [deleted]
                  additionalProperties: false
                  properties:
                    deleted: {type: string}
          "404": {$ref: "#/components/responses/Refusal"}
          "502": {$ref: "#/components/responses/Refusal"}
          "503": {$ref: "#/components/responses/Refusal"}
    AccountPassword:
      servers:
        - url: https://{console}
          description: консоль кластера (корень или монтирование `live`); шлюзу маршрут передаётся door.pass
          variables:
            console: {default: "console.example"}
      parameters:
        - $ref: "#/components/parameters/AccountName"
      post:
        summary: Новый пароль — один раз (право admin)
        security: [{personToken: []}]
        responses:
          "401": {$ref: "#/components/responses/Refusal"}
          "403": {$ref: "#/components/responses/Refusal"}
          "200": {$ref: "#/components/responses/WithPassword"}
          "404": {$ref: "#/components/responses/Refusal"}
          "502": {$ref: "#/components/responses/Refusal"}
          "503": {$ref: "#/components/responses/Refusal"}
  parameters:
    AccountName:
      name: name
      in: path
      required: true
      description: имя учётки (грамматика имени человека домена)
      schema: {type: string, minLength: 1, maxLength: 64}
  schemas:
    Account:
      type: object
      required: [name, disabled, at, by]
      additionalProperties: false
      properties:
        name: {type: string}
        disabled: {type: boolean}
        at: {type: number}
        by: {type: string}
  securitySchemes:
    personToken:
      type: http
      scheme: bearer
      description: удостоверение человека у консоли кластера (P/06.3); шлюз проверяет его снова после листа роли console (V/03.6 Н1.2)
    doorToken:
      type: http
      scheme: bearer
      description: токен двери консоли (договор токена двери); также ?t=
  responses:
    WithPassword:
      description: учётка и её пароль — пароль только в этом ответе
      content:
        application/json:
          schema:
            type: object
            required: [account, password]
            additionalProperties: false
            properties:
              account: {$ref: "#/components/schemas/Account"}
              password: {type: string, minLength: 32, maxLength: 32}
    Refusal:
      description: отказ (V/03.3 Н4, V/03.6 Н4; 401/403 сторожевой и допуска, 502/503 передачи); 503 пределов — с Retry-After
      headers:
        Retry-After:
          required: false
          schema: {type: integer}
      content:
        application/json:
          schema:
            type: object
            required: [error]
            additionalProperties: false
            properties:
              error: {type: string}
              detail: {type: string}
