openapi: 3.1.0
info:
  title: V/08 — the door of an export part
  version: 1.0.0
  description: |
    The HTTP contract of the process door of the worker `exp` — chapter V/08.9 of the lesson Export of the VMS module. The canon is
    [the norms of chapter 9](08.9-exp.norms.md); this file expresses them and adds no requirements. The route `files` is for a person by
    the console door token (`GET /exp/where/<part>`, the door token contract; `?t=` or `Authorization: Bearer`), only for the author
    of the part. The route `parts` is for the leading part of the same order by the role certificate `expworker`. Request parsing and the
    connection limits — the process door of P/03.4 N1.7.
servers:
  - url: https://{server}:{port}
    description: the process door of the worker exp with the role kit — the address SERVER_NAME (P/03.4 N1.7 kit)
    variables:
      server: {default: "srv-a"}
      port: {default: "0"}
paths:
  /files/{part}/{file}:
    parameters:
      - $ref: "#/components/parameters/Part"
      - $ref: "#/components/parameters/File"
    get:
      summary: A file of a part to its author (V/08.9 N1.2)
      security: [{doorToken: []}]
      parameters:
        - $ref: "#/components/parameters/T"
        - $ref: "#/components/parameters/Range"
      responses:
        "200": {$ref: "#/components/responses/Bytes"}
        "206": {$ref: "#/components/responses/Partial"}
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "410": {$ref: "#/components/responses/Refusal"}
        "416": {$ref: "#/components/responses/Unsatisfiable"}
    head:
      summary: The headers of a file without the body (V/08.9 N1.2)
      security: [{doorToken: []}]
      parameters:
        - $ref: "#/components/parameters/T"
      responses:
        "200": {description: the headers of the answer 200 without the body}
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "410": {$ref: "#/components/responses/Refusal"}
  /parts/{part}/{file}:
    get:
      summary: A file of a part to the leading part of the same order (V/08.9 N1.3)
      security: [{roleCertificate: []}]
      parameters:
        - $ref: "#/components/parameters/Part"
        - $ref: "#/components/parameters/File"
        - name: for
          in: query
          required: true
          description: the leading part of the calling worker
          schema: {type: string, minLength: 1}
        - $ref: "#/components/parameters/Range"
      responses:
        "200": {$ref: "#/components/responses/Bytes"}
        "206": {$ref: "#/components/responses/Partial"}
        "401": {$ref: "#/components/responses/Refusal"}
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "410": {$ref: "#/components/responses/Refusal"}
        "416": {$ref: "#/components/responses/Unsatisfiable"}
components:
  parameters:
    Part:
      name: part
      in: path
      required: true
      description: name of the part row
      schema: {type: string, minLength: 1}
    File:
      name: file
      in: path
      required: true
      description: the file id from result.files
      schema: {type: string, pattern: "^(?:f[0-9]{1,4})$"}
    T:
      name: t
      in: query
      required: false
      description: the console door token
      schema: {type: string}
    Range:
      name: Range
      in: header
      required: false
      description: one segment of bytes; several — the answer 200, the whole file
      schema: {type: string}
  securitySchemes:
    doorToken:
      type: http
      scheme: bearer
      description: the console door token (the door token contract); also ?t=
    roleCertificate:
      type: mutualTLS
      description: the role leaf expworker (the role certificate contract, class role)
  responses:
    Bytes:
      description: the whole file; Content-Disposition attachment, Accept-Ranges bytes, ETag — "<sha256>"
      headers:
        Content-Disposition: {schema: {type: string}}
        ETag: {schema: {type: string}}
      content:
        application/octet-stream:
          schema: {type: string, contentEncoding: binary}
    Partial:
      description: one segment of the file
      headers:
        Content-Range: {schema: {type: string}}
      content:
        application/octet-stream:
          schema: {type: string, contentEncoding: binary}
    Unsatisfiable:
      description: a segment outside the file; Content-Range bytes */size
      headers:
        Content-Range: {schema: {type: string}}
    Refusal:
      description: "a door refusal: an object with the field error — the refusal word"
      content:
        application/json:
          schema:
            type: object
            required: [error]
            additionalProperties: false
            properties:
              error: {type: string}
