# Detectors, as the platform sees them (V/04). Its unit is one model on one
# camera — "line-crossing on camera 7" (`7-linecross`) — created by the operator
# at the console's door or, for a while, by a scenario (`auto`'s `worker.creates`);
# its workers are detector workers on GPU-labelled servers, capacity in STREAMS a
# GPU can decode and infer on; its events are buckets under det/<unit>/e<epoch>/ on
# the resource, on the camera's timeline like any other subsystem's. Same
# controller class, same console class, same ACL shape as the VMS.
name: det
# The slot a worker of this subsystem makes, `d-<n>`, and the variable naming the one it is started under
# beside `WORKER_NAME` (`runtime.slot`; the boundary's step 4: it was each worker's class saying it).
slot: {prefix: d, name_env: DET_NAME}
about: {sub: cam, field: cam}   # a model runs on a camera's stream: its events, grants and labels are the camera's
unit:
  rows: units                        # det/units/<name>
  id: name                           # "<cam>-<kind>", the operator's name for the pair
  fields:
    name:      {type: string, required: true}
    cam:       {type: string, required: true, fixed: true}   # the VMS camera id whose stream the model runs on
    kind:      {type: string, required: true}      # which model: motion | linecross | lpr | …
    params:    {type: string}                      # the model's settings, opaque to the platform — and SMALL
    # The one thing about a detector that does not fit in a row. A polygon mask is a few hundred bytes and
    # belongs in `params`; a per-pixel one is 345 KB and belongs here — the row keeps the digest, the bytes
    # go to `det/blobs/<digest>` in the object store, and the platform never looks inside either. Changing
    # it changes the digest, which changes the row, which moves `revision`, which is what makes the worker
    # pick it up (P/06.1 Н1.5).
    mask:      {type: blob}                        # sha256-<hex>; the bytes are in the object store
    mask_from: {type: string}                      # an order's mask: the operator's detector's body by reference, det/<id>@sha256-<hex> (V/07.4)
    enabled:   {type: bool,   default: true}
    labels:    {type: list,   default: ["gpu"]}    # where it may run: a worker whose server has these labels
    # Which of this detector's event kinds are ALARMS: written down with fsync, kept in a tree of their own for
    # the alarms' days, kept ahead of observations when a window overflows (P/05 Н1.2). The VMS's
    # field, on the row for the VMS's reason: the class is a fact about what the operator set the model up FOR,
    # and the platform fixes only the two words. The default answers for the three models here (M12 of the
    # review — every detector line used to be an observation): a line is drawn where crossing it matters and a
    # plate list is kept for the plates on it, so `linecross` and an `lpr` hit are what somebody is called for;
    # `motion` is the scene moving, which is all day — an observation, and a suppressed one (`events` below).
    alarms:    {type: list,   default: ["linecross", "lpr"]}
    # WHEN THIS DETECTOR STOPS BEING ONE, in unix seconds; 0 — never, which is every detector an operator
    # creates by hand. The recording's field, for the recording's reason (rec.subsystem.yaml): a scenario
    # that asks "watch camera 7 for plates for ten minutes" asks for an END, and an end that lives in a
    # process's timer dies with the process. Past it the controller unplaces the row and the worker stops the
    # model (`placement.ends`, P/04 Н1.3); a row a scenario made is deleted, one an operator made stays.
    until:     {type: float,  default: 0}          # unix seconds; 0 — never
placement:
  capacity:   {from: capacity, default: 8}        # streams per worker — its own number, from its heartbeat
  headroom:   {from: headroom}
  constraint: labels-subset
  requires:   resource                          # a detector writes its events into the resource on its own server
  ends:       {field: until, never: 0}
  near:       {sub: cam, by: cam}               # An affinity, never a filter: be beside the holder of this camera, so
                                                # the model reads its fan-out from shared memory on its own box (V/04.2).
                                                # `by: cam` and not the bare `near: cam`, because a detector's unit is
                                                # `7-linecross` and no holder ever reports that id: the short form would
                                                # match nothing and read as if it did. Where the affinity cannot be had,
                                                # the filters and `most-free-capacity` below spread detectors over the
                                                # GPU servers, and the model takes the stream from its cluster's ingest.
  # No `home`. A recording has one because an operator can answer "which disk does this footage live on";
  # a detector has nobody to answer "which server does this model live on", and a preference nobody sets is
  # a field nobody maintains. The affinity above is the whole of its topology.
  tie_break:  most-free-capacity
  rebalance:  {dead_band: 0.10}
snapshot: [name, cam, kind, enabled, until]
metrics:
  - {name: units_running, from: status.phase, agg: count, equals: running, live: true}   # the running gauge (`console.running`)
console:
  running: units_running               # det_units_running
events:
  # Which of this subsystem's events collapse when they repeat — the VMS's rule (cam.subsystem.yaml), applied
  # by the detector worker before the write (P/03.6 Н1.2). Until this every line a model produced went into the
  # log (M12 of the review): a motion model re-reports for as long as the scene moves, which on a windy camera is
  # all night, once a pass. The first line of a window is the news and goes in unchanged; what the window
  # swallowed is said when it closes — one line with `repeats`, `since`, `until`.
  #
  # `by: [cam]`, and not every field: a model's fields drift between two looks at the same scene (a score, a box,
  # a pass counter), and two lines that differ only there are not two observations. The unit is already one
  # model on one camera, so this reads "any motion this detector saw inside the window".
  #
  # Not `linecross` and not `lpr`: those are alarms, and every one of them is a separate thing that happened —
  # the second car over the line is the second car. An alarm swallowed is an alarm nobody was called for.
  suppress:
    motion:
      window: 30                       # the VMS's number for a bouncing contact: long enough that a tree in the
                                       # wind is one line a window, short enough that two people crossing a
                                       # minute apart are two
      by: [cam]
# A detector finds the camera's holder and its cluster's ingests by their heartbeats, and reads the holder's
# fan-out from the shared memory of its own server (V/04.2).
worker: {exec: /usr/lib/det/worker, reads: [cam/heartbeats/, rec/heartbeats/], uses: [cam.shm]}
