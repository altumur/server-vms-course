<!doctype html>
<!-- Собрано tools/build_webui.py из index.html — руками не править -->
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="consolem-api" content="api">
<meta name="consolem-login" content="../">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="consolem-assist-public" content="https://cammeta-checks.taile99433.ts.net">
<title>Конфигуратор</title>
<!-- ONE PSIM: мост по ONE.PSIM.PrototypeKit, подключён после стилей прототипа -->
<link rel="stylesheet" href="app.css?v=c5043734d3e5">
<script src="i18n-en.js?v=2ddcaa65d386"></script>
<script src="openapi.js?v=9271affe6aea"></script>
<script src="client.js?v=3124abf37ef1"></script>
<script src="whep-stub.js?v=c1e5524fbef4"></script>
</head>
<body>
<div class="app">
<div class="ws" id="ws"><nav class="rail" id="rail" aria-label="Разделы" data-chrome>
  <div class="rail-brand" title="ONE PSIM · Конфигуратор"><span class="brand-mark" aria-label="ONE PSIM" role="img"></span><span class="rail-brand-t" data-i18n="Конфигуратор">Конфигуратор</span></div>
  <button type="button" class="ph-choice domain-switch" id="domainBtn" title="Все домены" aria-haspopup="menu" aria-controls="domainPop" aria-expanded="false" data-on-click='[["toggleDomainPop",{"$on":"event"}]]'><span class="asw-lb domain-switch-label">Все домены</span><span class="ph-chevron" aria-hidden="true"><svg class="btn-chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5.5 7.75 4.5 4.5 4.5-4.5"/></svg></span></button>
  <div class="rail-tabs" role="tablist" aria-label="Разделы"></div>
  <div class="umenu" id="umenu">
    <button type="button" class="ubtn" id="ubtn" data-on-click='[["toggleUserMenu",{"$on":"event"}]]' title="root" aria-label="root" aria-haspopup="menu" aria-controls="upop" aria-expanded="false">
      <span class="uav" aria-hidden="true"><svg class="ic-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
      <span class="uname">root</span>
      <span class="uchev up" aria-hidden="true"><svg class="btn-chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5.5 7.75 4.5 4.5 4.5-4.5"/></svg></span>
    </button>
    <div class="upop" id="upop" role="menu">
      <div class="uhead"><span class="uav" aria-hidden="true"><svg class="ic-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><b>root</b></div>
      <label><span data-i18n="Язык">Язык</span>
        <select id="langSel" data-on-change='[["setUiLang",{"$on":"value"}]]'>
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>
      </label>
      <button type="button" class="usign" data-i18n="Выйти" data-on-click='[["toast","Выход (прототип)"]]'>Выйти</button>
    </div>
  </div>
</nav><aside id="aside" data-chrome></aside><div class="rsz" id="rsz"></div>
<header>
  <button type="button" class="hd-railtg" id="hdRailTg" data-i18n-title="Скрыть разделы" title="Скрыть разделы" aria-expanded="true" aria-controls="rail" data-on-click='[["toggleRail"]]'><svg class="ic-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
  <div class="hd-nav" role="group" aria-label="История переходов">
    <button type="button" id="navBack" title="Назад" aria-label="Назад" disabled data-on-click='[["navStep",-1]]' data-on-contextmenu='[["navMenu",{"$on":"event"}]]'><svg class="ic-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <button type="button" id="navFwd" title="Вперёд" aria-label="Вперёд" disabled data-on-click='[["navStep",1]]' data-on-contextmenu='[["navMenu",{"$on":"event"}]]'><svg class="ic-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
  <div class="gojump" id="gojump">
    <span class="gojump-lead" aria-hidden="true"><svg class="ic-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></span>
    <input id="gq" autocomplete="off" data-i18n-placeholder="Имя, IP, раздел, настройка…" placeholder="Имя, IP, раздел, настройка…"
      data-i18n-title="Сужает дерево по имени, IP, ID, производителю и модели; разделы, настройки и объекты вне среза предлагает списком"
      title="Сужает дерево по имени, IP, ID, производителю и модели; разделы, настройки и объекты вне среза предлагает списком"
      data-on-input='[["goInput",{"$on":"value"}]]' data-on-focus='[["goSearch",{"$on":"value"}]]' data-on-click='[["goClick",{"$on":"value"}]]' data-on-keydown='[["goKey",{"$on":"event"}]]'>
    <button type="button" class="gojump-clear hide" id="goClear" data-i18n-title="Очистить" title="Очистить" aria-label="Очистить" data-on-click='[["clearTreeQ",{"$on":"event"}]]'><svg class="ic-svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <span class="gojump-hint" aria-hidden="true">Ctrl K</span>
    <div class="gopop" id="gopop"><div id="goList"></div></div>
  </div>
  <button type="button" class="hd-plan" id="hdPlan" hidden data-on-click='[["planHeadOpen"]]'></button>
  <div class="hd-status" id="hdStatus" hidden></div>
  <button type="button" class="hd-asst" id="hdAsst" data-needs="feature:assist" aria-expanded="false" aria-controls="asstDock" title="Ассистент (Ctrl+I)" data-on-click='[["asstToggle"]]'></button>
  <span class="asst-sr" id="asstLive" role="status"></span>
  <button type="button" class="hd-theme" id="hdTheme" data-i18n-title="Сменить тему" title="Сменить тему" aria-label="Сменить тему" data-on-click='[["toggleTheme"]]'><svg class="ic-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v2"/><path d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715"/><path d="M16 12a4 4 0 0 0-4-4"/><path d="m19 5-1.256 1.256"/><path d="M20 12h2"/></svg></button>
  <div class="hd-bell" id="hdBell" data-needs="listRulePrompts" hidden></div>
</header>
<main id="main"></main></div>
</div>
<aside class="asst-dock" id="asstDock" aria-label="Ассистент" tabindex="-1" hidden>
  <div class="asst-grip" id="asstGrip" role="separator" aria-orientation="vertical" aria-label="Ширина панели" data-i18n-title="Ширина панели: тяните край или нажимайте стрелки" title="Ширина панели: тяните край или нажимайте стрелки" tabindex="0"></div>
  <div class="asst-head" id="asstHead"></div>
  <div id="asstBlock"></div>
  <div class="asst-foot" id="asstFoot">
    <input type="file" id="asstFilePick" multiple hidden data-on-change='[["asstFilePicked",{"$on":"event"}]]'>
    <div class="asst-files" id="asstFiles"></div>
    <textarea id="asstText" class="asst-ta" data-on-input='[["asstInput",{"$on":"value"}]]' data-on-keydown='[["asstKey",{"$on":"event"}]]'></textarea>
    <div id="asstActs"></div>
  </div>
</aside>
<div id="domainMenuHost"></div>
<div class="jump" id="jump" data-on-click='[[".self"],["closeJump"]]'>
  <div class="jbox" data-on-click='[[".stop"]]'>
    <input id="jq" data-i18n-placeholder="Перейти к объекту…  (камера, датчик, сервер)" placeholder="Перейти к объекту…  (камера, датчик, сервер)" data-on-input='[["jumpList"]]' autofocus>
    <div class="jlist" id="jlist"></div>
  </div>
</div>
<div class="mask wz-mask" id="wiz">
  <div class="dr wz-win wz-m" id="wizDr" data-on-click='[[".stop"]]'>
    <div class="dh"><b id="wizT">Добавить сервер</b><span id="wizTools" class="wz-tools"></span></div>
    <div class="st wz-bar" id="wst"></div>
    <div class="db" id="wbd"></div>
    <div class="df"><button type="button" class="btn" id="wc" data-i18n="Отмена" data-on-click='[["wizCancel"]]'>Отмена</button><span class="tfoot-gap"></span><div id="wizFoot"></div><button class="btn" id="wb" data-on-click='[["wizBack"]]'>Назад</button><span id="wizFootR"></span><button class="btn pri" id="wn" data-on-click='[["wnx"]]'>Далее</button></div>
  </div>
</div>
<div class="confirm" id="confirm" data-on-click='[[".self"],["closeConfirm"]]'>
  <div class="cbox" data-on-click='[[".stop"]]'>
    <div class="chead" id="confirmTitle" data-i18n="Подтверждение">Подтверждение</div>
    <div class="cbody"><div id="confirmMsg"></div><div class="cwarn" id="confirmWarn"></div></div>
    <div class="cfoot">
      <button type="button" class="btn" id="confirmCancel" data-i18n="Отменить" data-on-click='[["closeConfirm"]]'>Отменить</button>
      <button type="button" class="btn pri" id="confirmOk" data-i18n="Удалить" data-on-click='[["runConfirmOk"]]'>Удалить</button>
    </div>
  </div>
</div>
<div class="confirm" id="bmodal" data-on-click='[[".self"],["bmBackdrop"]]'>
  <div class="cbox bbox" data-on-click='[[".stop"]]'>
    <div class="chead" id="bmTitle"></div>
    <div class="cbody" id="bmBody"></div>
    <div class="cfoot" id="bmFoot"></div>
  </div>
</div>
<div class="confirm" id="schdlg" data-on-click='[[".self"],["schDlgCancel"]]'>
  <div class="cbox bbox sch-box" role="dialog" aria-modal="true" aria-labelledby="schdlgT" data-on-click='[[".stop"]]'>
    <div class="chead" id="schdlgT"></div>
    <div class="cbody" id="schdlgB"></div>
    <div class="cfoot" id="schdlgF"></div>
  </div>
</div>
<div class="tctx" id="tctx" role="menu" data-on-mousedown='[["rcMenuDown",{"$on":"event"}]]'></div>
<script src="app.js?v=4638b77f8ef7"></script>
</body>
</html>
