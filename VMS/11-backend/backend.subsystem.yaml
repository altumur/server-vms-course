# The configurator's backend (`backend`, V/11; ADR-0094): the product's WebUI (consolem) talks to its own REST API —
# `api/openapi.json` of consolem at the pinned commit (V/11.2) — and this subsystem answers it by translating every call
# into the console's own doors (V/11.3–V/11.5). It holds no rights of its own: the console passes it a person's request
# with a ticket for that one request, and the worker calls the console back with the ticket, only on the doors this
# manifest lists (ADR-0094 B1).
#
# A unit is a backend instance — `backend/instances/<name>` — placed by labels next to `live` (ADR-0094 доп. (6) п. 3),
# at most one on a server (B1; the review of V/11, question 8): the console passes a person's request to a live worker
# of backend with a door (the pass rule of the gate contract), and the worker calls back over TLS with the certificate of
# role `backend`; the ticket is bound to the leaf of role backend of the addressee instance's server (доп. (6) пп. 1, 2).
# The role socket — only the profile without a kit (a stand, the loopback; доп. (6) п. 4). One row is enough; a second
# is a reserve for a move (V/11.1 Н1.2).
name: backend
# The slot a worker of this subsystem makes, `b-<n>`, and the variable naming the one it is started under beside
# `WORKER_NAME` (`runtime.slot`).
slot: {prefix: b, name_env: BACKEND_NAME}
# Reads, writes and asks nothing of anybody by itself: what it needs it reads through the console with the ticket of the
# request it serves (V/11.1 Н1.3). No state outside the platform's store: the memory of repeats of a group
# `idempotencyKey` is always there, in its own table `repeats` (below) read and written through the console's door of
# tables with the ticket (V/11.4 Н1.4; the review of V/11, question 3). The family `<sub>/idem/` is the console's own
# memory of `Idempotency-Key` (P/06.1): backend does not touch it.
worker: {exec: /usr/lib/backend/worker, stop_timeout: 20}
unit:
  rows: instances                    # backend/instances/<name>
  id: name                           # the operator's name of the instance: "main"
  fields:
    name:      {type: string, required: true, fixed: true}
    # Where it may stand: labels of the servers, as for the gateways of `live` ("public-address" for a WebUI from outside).
    labels:    {type: list}
    # Off: the worker answers nothing; the console's pass to it fails (503 «no worker of backend with a door is heard»).
    enabled:   {type: bool,   default: true}
placement:
  # By labels next to `live` (ADR-0094 доп. (6) п. 3; B8 `placement.home strict` is not needed for backend): a worker
  # carries one instance; short of a worker on a label set, the controller orders one on a server with these labels.
  # At most one worker of a role with a callback on a server (B1, the review of V/11, question 8): the ticket is bound to
  # the leaf of the server, and two instances on one server would share it. Declared by the norm B1, not a key today.
  capacity:   {from: capacity, default: 1}
  constraint: labels-subset          # an instance's labels ⊆ the labels of its worker's server
  tie_break:  most-free-capacity
  grows:      true
snapshot: [labels, enabled]
# The pass (P/06.5 Н1.8), the second kind (ADR-0094 B1, ADR-0091 доп. (30); the contract of the gate and the pass,
# «Передача второго вида»): a request under `routes` goes to a live worker of backend with a door, without the person's
# Authorization, with a ticket for this one request. The API of the contract (V/11.2) lives under one segment, `api`
# (ADR-0094 доп. (8) п. 2): the browser calls `/backend/api/<contract path>`, the worker gets `/api/<contract path>` (the
# mount prefix is not passed) and answers any path under it, a path the contract has not with 404 NO_ROUTE; the static
# files (B7) are `/backend/<file>` outside `api/`, so the two spaces do not meet. The transport of the callback — V/11.1
# Н1.2. Not here, because the platform fixes them: the headers, the media types and the loopback mark (V/11.1 Н1.5).
door:
  pass:
    routes: [api]
    # A stream goes to the client as it comes, without the 4 MiB limit; its ticket — reads, /changes, the model's route.
    stream: [api/stream, api/assist/turns]
    # Longer than PASS_WAIT, the longest covering key wins; api/assist/turns — ASSIST_TURN_MAX (V/11.7 Н1.5).
    wait: {api/objects/delete: 30, api/devices: 30, api/assist/turns: 7500}
    # The console's own refusals on api are `Problem` (question 5). 502, 503, 504: the contract has no code for them, a
    # request to the product (V/11.2 Н1.3); till then they stay outside the map and answer the console's form.
    refusals:
      form: problem
      codes: {'401': UNAUTHORIZED, '403': PERMISSION_DENIED, '404': NO_ROUTE, '413': VALIDATION_FAILED}
    # The doors the worker may call back with a ticket, in the closed list of the platform (P/06.3 Н1.9). Not: `/where`,
    # writes of /session, grants, people, keys, break-glass, /operations; nor auto — the automation of consolem is not
    # declared on the first step (ADR-0094 доп. (7)), its operations answer 404 NO_ROUTE.
    calls:
      - cam/cameras                  # the rows of cam, their tombstones (V/01.1)
      - cam/devices
      - cam/next_id                  # a new camera names its number itself (V/11.4 Н1.2)
      - rec/recordings               # the rows of rec, their tombstones (V/02.1)
      - rec/volumes
      - det/units                    # the rows of det, their tombstones (V/04.1)
      - cam/policy                   # the common settings of these subsystems (ADR-0094 доп. (2) п. 6)
      - rec/policy
      - det/policy
      - console/batch                # a device is one batch (B9, V/11.4 Н1.2, Н1.4)
      - changes                      # the change feed (B2, V/11.5)
      - GET manifest
      - GET servers
      - GET events
      - GET session                  # «who am I» and its grants (can_edit)
      - GET schema                   # the tool get_schema (V/11.7 Н1.2)
      - GET assist/models            # the assistant's default model (V/11.7 Н1.2)
      - assist/chat                  # the model's route: the console passes it to the holder (V/11.7; доп. (12) п. 7)
      - backend/repeats              # its own table: the memory of repeats of a group key (V/11.4 Н1.4)
# B7 (ADR-0094 доп. (1); P/02.1 `console.shell`, `console.files`, P/02.3, P/06.5 Н1.1 `mounted`), the keys in `console:`
# below (the installer reads each file, the manifest row keeps its SHA-256 and size): the console serves
# the WebUI of consolem as static files next to this manifest, `/backend/<file>`, byte for byte, by the name without the
# query (the shell links `<file>?v=<12 hex>`); no file of the set is named under `api/` — that is the space of the API
# (ADR-0094 доп. (8) п. 2). It serves backend.shell.html at /backend/ because `console.shell: true` declares it
# (доп. (3) п. 8), a page of its own (no frame of another page, no sandbox), with the Content-Security-Policy that is exactly the minimum
# of P/06.5 Н1.1 `page` — the shell has no inline script, so `script-src 'self'; object-src 'none'; base-uri 'none'`,
# not stricter: inline styles and `data:` images stay allowed (доп. (8) пп. 1, 4).
# The build: consolem @ef7175b, `tools/build_webui.py` (reproducible), its MANIFEST.json; its index.html is
# backend.shell.html (SHA-256 caa73ca5…), the rest is the set (V/11.1 Н1.4). The deployment package builds it from the
# pinned commit and places it next to the manifest (V/09.3).
# SHA-256 of each (the lesson's README): 0d9c0fc7… app.css, 621743b8… app.js, 51da0e97… client.js,
# 693b77d4… fonts/InterVariable.woff2, bde5b214… i18n-en.js, 06f709a4… openapi.js
# The set — SHA-256 fbcb074080610e08bd3534b5de6d35246609a6696dec813410f8c9dc07d20142.
# The memory of repeats of a group `idempotencyKey` (V/11.4 Н1.4; the review of V/11, question 3): a row per group,
# key h = SHA-256 hex of the bytes of the person (`user` of the ticket), a zero byte and the external key. Made with
# cas "" as «started» before the snapshot; each step's outcome lands in it in the step's own batch (B9). The form of the
# row is this table's fields (the platform's family of tables has the schema `manifest`, P/06.1 Н1.6): a row the console
# reads not by them is unreadable — backend answers 503 and runs nothing (V/11.4 Н1.4). Its lifetime — `delete_after`: the
# console counts it from the first sight of the row's version, so it can only grow; the platform's reaper removes the row.
tables:
  repeats:
    key: h
    service: true                    # by a live ticket from a leaf of this role only, the person's may is not asked (P/06.1 Н1.6)
    delete_after: 86400              # as the console's own memory of repeats (P/06.1 Н3)
    fields:
      h:        {type: string, required: true, schema: {pattern: "^[0-9a-f]{64}$"}}   # SHA-256 hex of user, 0, key
      user:     {type: string, required: true, schema: {minLength: 1}}   # the person of the ticket; compared on lookup
      idem_key: {type: string, required: true, schema: {minLength: 1}}   # the external idempotencyKey as given
      op:       {type: string, required: true, enum: [createDevices, updateDevices, deleteObjects]}
      body:     {type: string, required: true, schema: {pattern: "^[0-9a-f]{64}$"}}   # SHA-256 hex of the body's bytes
      state:    {type: string, required: true, enum: [started, done]}
      # the steps' outcomes by the index of `items` (V/11.4 Н1.4)
      steps:
        type: json
        default: []
        schema:
          type: array
          items:
            type: object
            required: [index, outcome]
            additionalProperties: false
            properties:
              index:   {type: integer, minimum: 0}
              outcome: {enum: [done, failed]}
              id:      {type: string, minLength: 1}      # the id of the step's record
              code:    {type: string, minLength: 1}      # the contract's code of a failed step
              field:   {type: string, minLength: 1}
metrics:
  - {name: instances_running, from: status.phase, agg: count, equals: running, live: true}   # the running gauge (`console.running`)
console:
  running: instances_running         # backend_instances_running
  shell: true                        # backend.shell.html at /backend/ (P/06.5 Н1.1 `mounted`)
  files: [app.css, app.js, client.js, fonts/InterVariable.woff2, i18n-en.js, openapi.js]   # /backend/<file> (V/11.1 Н1.4)
# What a page calls a unit of it (the product's words, one spec on both sides).
display:
  unit: бэкенд конфигуратора
  units: бэкенды конфигуратора
  units_count: бэкендов конфигуратора
  section: Конфигуратор
  general: Бэкенд
  fields:
    name: имя
    labels: метки серверов
    enabled: включён
