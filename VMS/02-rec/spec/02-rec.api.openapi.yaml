openapi: 3.1.0
info:
  title: V/02 — the archive door and the receiver of the recorder
  version: 1.0.0
  description: |
    The HTTP contract of the archive door of the recorder `recworker` — chapter V/02.5 of the lesson Recording of the VMS module. The canon is
    [the norms of chapter 5](02.5-rec.norms.md); the file expresses them and adds no requirements. The class `mixed` of the role
    certificate contract (N2): for processes — `/spans`, `/samples` (the role certificate `recworker`, `detjobworker`, `expworker`; the words of the class
    `role`); for the page — `/timeline`, `/segment`, `/keeps` (the console door token, the door token contract; absent or invalid —
    403 `forbidden`). The request parsing — P/01.1 N2.1 with the deviations of N2; the order: path (404) → method (405) → admission
    (401, 403) → query (400) → no volume (503). A chain rejected by TLS is a handshake refusal without an HTTP answer (not
    expressed in the contract). CORS — `cors` of the role certificate contract (N1.8), not expressed in the contract.
    The receiver `/ingest/*` — chapter V/02.9 N2 (the route `ingest` of the manifest: process roles or domain tokens; the frame, the bodies
    of calls and the refusals — there too); the local joint within one server is Implementation decides and is not part of the contract.
servers:
  - url: https://{server}:{port}
    description: with the kit of the role recworker — the address SERVER_NAME (V/02.5 N1.7; P/03.4 N1.7 kit); the client certificate is requested as optional
    variables:
      server: {default: "srv-a"}
      port: {default: "0"}
  - url: http://127.0.0.1:{port}
    description: without a certificate kit — loopback only; only the `token` routes work, the process routes — 401 no_role (V/02.5 N2)
    variables:
      port: {default: "0"}
paths:
  /spans/{unit}:
    get:
      summary: The visible spans of a recording in the volume of this recorder (N1.4)
      parameters:
        - $ref: "#/components/parameters/Unit"
        - $ref: "#/components/parameters/FromS"
        - $ref: "#/components/parameters/ToS"
      security: [{roleCertificate: []}]
      responses:
        "200":
          description: the spans, clipped by the ceiling (N1.2)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Spans"}
        "400": {$ref: "#/components/responses/Refusal"}
        "401": {$ref: "#/components/responses/NoRole"}
        "403": {$ref: "#/components/responses/RoleRefusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /samples/{unit}:
    get:
      summary: The frames of a recording (SMPL in a row) over an interval (N1.4)
      parameters:
        - $ref: "#/components/parameters/Unit"
        - $ref: "#/components/parameters/FromS"
        - $ref: "#/components/parameters/ToS"
        - name: stream
          in: query
          required: false
          description: only this stream of the recording, a fenced one too — `<epoch>` or `<epoch>/backfill`; without the parameter — by the rule «one moment — one epoch» (N1.3)
          schema: {type: string, pattern: "^(?:[0-9]+(/backfill)?)$"}
        - name: track
          in: query
          required: false
          description: "`audio` — the audio frames of the same streams (V/02.5 N1.4); a repeat, another value — 400"
          schema: {type: string, enum: [audio]}
      security: [{roleCertificate: []}]
      responses:
        "200":
          description: SMPL records in a row (the obsd contract); HTTP/1.1 — chunked; empty — no body; a break after the first byte — without the last chunk
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/Refusal"}
        "401": {$ref: "#/components/responses/NoRole"}
        "403": {$ref: "#/components/responses/RoleRefusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /timeline/{recording}:
    get:
      summary: The timeline of a recording from all live doors and the device archive (N1.5)
      security: [{doorToken: []}]
      parameters:
        - $ref: "#/components/parameters/Recording"
        - $ref: "#/components/parameters/FromS"
        - $ref: "#/components/parameters/ToS"
      responses:
        "200":
          description: the spans by (start_ms, epoch) and the unavailable — in the body (N1.5)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Timeline"}
        "400": {$ref: "#/components/responses/Refusal"}
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /segment/{recording}/{epoch}/{piece}:
    get:
      summary: An fMP4 piece (N1.6)
      security: [{doorToken: []}]
      parameters:
        - $ref: "#/components/parameters/Recording"
        - name: epoch
          in: path
          required: true
          description: "e<epoch>; e0 — the keep copy or (.device) the device archive"
          schema: {type: string, pattern: "^(?:e[0-9]+)$"}
        - name: piece
          in: path
          required: true
          description: "<fromMs>-<toMs>.mp4 | .backfill.mp4 | .device.mp4 (e0 only)"
          schema: {type: string, pattern: "^(?:[0-9]+-[0-9]+(\\.backfill|\\.device)?\\.mp4)$"}
      responses:
        "200":
          description: fMP4 (ftyp, moov, fragments moof+mdat); HTTP/1.1 — chunked; a door that dropped out before the first byte — a piece without its frames (the incompleteness — by /timeline)
          content:
            video/mp4:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/Refusal"}
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "415": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /keeps/{keep}/verify:
    post:
      summary: Verification of the keep copy (chapter V/02.7)
      security: [{doorToken: []}]
      parameters:
        - name: keep
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/RecordingQuery"
      responses:
        "200":
          description: the result of the verification of the keep copy (the meaning — chapter V/02.7)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeepVerify"}
        "400": {$ref: "#/components/responses/Refusal"}
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "409": {$ref: "#/components/responses/Refusal"}
        "413": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /ingest/poll:
    post:
      summary: Poll of the receiver (V/02.9 N1.3, N2) — recworker; domain tokens stream, poll, upstream
      security: [{roleCertificate: []}, {domainToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PollRequest"}
      responses:
        "200":
          description: the answer of the call (V/02.9 N2)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PollAnswer"}
        "400": {$ref: "#/components/responses/Refusal"}
        "401": {$ref: "#/components/responses/NoRole"}
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "413": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /ingest/subscribe:
    post:
      summary: Subscription to a camera stream (V/02.9 N2) — liveworker, detworker, recworker
      security: [{roleCertificate: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubscribeRequest"}
      responses:
        "200":
          description: the answer of the call (V/02.9 N2)
          content:
            application/x-ndjson:
              schema: {$ref: "#/components/schemas/Frame"}
        "400": {$ref: "#/components/responses/Refusal"}
        "401": {$ref: "#/components/responses/NoRole"}
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "413": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /ingest/push:
    post:
      summary: Push of frames (V/02.9 N2) — recworker; domain tokens stream, upstream
      security: [{roleCertificate: []}, {domainToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PushRequest"}
      responses:
        "200":
          description: the answer of the call (V/02.9 N2)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushAnswer"}
        "400": {$ref: "#/components/responses/Refusal"}
        "401": {$ref: "#/components/responses/NoRole"}
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "413": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /ingest/upload:
    post:
      summary: Upload of a range in pieces (V/02.9 N1.4, N1.5, N2) — recworker (a neighbour); domain tokens stream, upstream
      security: [{roleCertificate: []}, {domainToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UploadRequest"}
      responses:
        "200":
          description: the answer of the call (V/02.9 N2)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadAnswer"}
        "400": {$ref: "#/components/responses/Refusal"}
        "401": {$ref: "#/components/responses/NoRole"}
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "413": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /ingest/pull:
    post:
      summary: Pull of a batch (V/02.9 N1.8, N2) — domain token upstream
      security: [{domainToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PullRequest"}
      responses:
        "200":
          description: the answer of the call (V/02.9 N2)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PullAnswer"}
        "400": {$ref: "#/components/responses/Refusal"}
        "401": {$ref: "#/components/responses/NoRole"}
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "413": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /ingest/asks:
    post:
      summary: A request to a camera (V/02.9 N2, V/07.5 N1.4) — domain token ask
      security: [{domainToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AskRequest"}
      responses:
        "200":
          description: the answer of the call (V/02.9 N2)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AskAnswer"}
        "400": {$ref: "#/components/responses/Refusal"}
        "401": {$ref: "#/components/responses/NoRole"}
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "413": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
components:
  securitySchemes:
    roleCertificate:
      type: mutualTLS
      description: |
        the role certificate of the client (the class `mixed`, the routes `role` of the role certificate contract): admitted are recworker,
        detjobworker, expworker; the trust set — ca.pem, ca.next.pem of its own cluster (V/02.5 N2)
    doorToken:
      type: http
      scheme: bearer
      description: the console door token (the door token contract); also ?t=
    domainToken:
      type: http
      scheme: bearer
      description: a domain token of the kind stream, poll, upstream or ask (P/08.7; the route ingest of the manifest, the domains — its domain)
  parameters:
    Unit:
      name: unit
      in: path
      required: true
      description: the recording id (V/02.1)
      schema: {type: string, minLength: 1}
    Recording:
      name: recording
      in: path
      required: true
      schema: {type: string, minLength: 1}
    RecordingQuery:
      name: recording
      in: query
      required: true
      schema: {type: string, minLength: 1}
    FromS:
      name: from
      in: query
      required: false
      description: Unix seconds — written as a JSON number, finite, once (N2); without the parameter — 0
      schema: {type: number}
    ToS:
      name: to
      in: query
      required: false
      description: Unix seconds — written as a JSON number, finite, once, not less than from (N2); without the parameter — the door clock + 86400
      schema: {type: number}
  responses:
    Refusal:
      description: a refusal (V/02.5 N4); 503 of the limits — with Retry-After
      headers:
        Retry-After:
          required: false
          schema: {type: integer}
      content:
        application/json:
          schema:
            type: object
            required: [error]
            additionalProperties: false
            properties:
              error: {type: string}
              detail: {type: string}
    NoRole:
      description: |
        a process route: no client certificate (with a kit) or no kit (loopback) — 401 no_role (V/02.5 N2)
      content:
        application/json:
          schema:
            type: object
            required: [error]
            additionalProperties: false
            properties:
              error: {const: no_role}
              detail: {type: string}
    RoleRefusal:
      description: |
        a process route after the handshake: not exactly one role in SAN — no_role; a role not among the admitted — wrong_role;
        the signature of the leaf or of the authority outside sig, the serial in revoked — bad_chain (the class `role`; V/02.5 N2)
      content:
        application/json:
          schema:
            type: object
            required: [error]
            additionalProperties: false
            properties:
              error: {enum: [no_role, wrong_role, bad_chain]}
              detail: {type: string}
  schemas:
    Timeline:
      type: object
      required: [spans, unreachable, unavailable]
      additionalProperties: false
      properties:
        spans:
          type: array
          items: {$ref: "#/components/schemas/TimelineSpan"}
        unreachable:
          type: array
          description: the slot names of the recorders whose door did not answer or answered incompletely
          items: {type: string}
        unavailable:
          type: array
          description: "<volume>@<server> of the volumes of this recording without a live holder"
          items: {type: string}
    Spans:
      type: object
      required: [unit, spans, current_epoch, held_since, now]
      additionalProperties: false
      properties:
        unit: {type: string}
        spans:
          type: array
          items:
            type: object
            required: [start, end, epoch, source, bytes, fenced]
            additionalProperties: false
            properties:
              start: {type: number}
              end: {type: number}
              epoch: {type: integer, minimum: 0}
              source: {enum: [live, backfill]}
              bytes: {type: integer, minimum: 0}
              fenced: {type: boolean}
        current_epoch: {type: [integer, "null"], minimum: 0}
        held_since: {type: [number, "null"]}
        copied_to: {type: number, minimum: 0}
        now: {type: number}
    KeepVerify:
      type: object
      required: [keep, volume, integrity, ok, recordings]
      additionalProperties: false
      properties:
        keep: {type: string}
        volume: {type: string, description: "the volume of this door whose copy and seal were verified (V/02.7 N1.4)"}
        integrity: {type: string, description: "ok | broken: … | unknown: …"}
        ok: {type: boolean}
        recordings:
          type: object
          additionalProperties:
            type: object
            required: [sealed, now, samples, result]
            additionalProperties: false
            properties:
              sealed: {type: [string, "null"]}
              now: {type: [string, "null"]}
              samples: {type: integer, minimum: 0}
              result: {enum: [ok, damaged, pending, unverified, empty]}
              detail: {type: string}
    TimelineSpan:
      type: object
      required: [start_ms, end_ms, epoch]
      additionalProperties: false
      properties:
        start_ms: {type: integer}
        end_ms: {type: integer}
        epoch: {type: integer, minimum: 0}
        source: {enum: [backfill, device]}
        fenced: {type: boolean}
        yields: {type: boolean}
    Frame:
      type: object
      additionalProperties: true
      description: a frame (V/02.9 N2); for a subscription — one application/x-ndjson line per frame
      required: [t, key, sample]
      properties:
        t: {type: number, description: seconds by the sender's clock}
        key: {type: boolean}
        sample: {type: string, contentEncoding: base64}
        kind: {type: string, enum: [audio], description: an audio frame; no field — video (V/02.9 N2)}
        mic: {type: integer, minimum: 0, description: "the real number of `mic`, for the upload of the transmitter — `audio` of the claim; mandatory for audio"}
        first: {type: boolean, description: this `mic` is the first of the camera; the frame also goes to the subscribers of number 0 (V/02.9 N1.3a)}
        codec: {type: string, minLength: 1, description: "<rtpmap name>/<rate>[/<channels>]; mandatory for audio"}
    Frames:
      type: array
      items: {$ref: "#/components/schemas/Frame"}
    PollRequest:
      type: object
      additionalProperties: true
      required: [version, camera_now]
      properties:
        cam: {type: string}
        ref: {type: string}
        version: {type: integer}
        camera_now: {type: number}
        rtt: {type: number}
        outcomes:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [ask, outcome]
            properties:
              ask: {type: string}
              outcome: {type: string}
    PollAnswer:
      type: object
      additionalProperties: false
      required: [version, streams]
      properties:
        version: {type: integer}
        streams:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [stream, push]
            properties:
              stream: {type: string}
              push: {type: boolean}
              have: {type: number}
              audio:
                type: array
                description: the numbers of `mic` needed by the subscribers of the stream (V/02.9 N1.3a)
                items: {type: integer, minimum: 0}
        range:
          type: object
          additionalProperties: false
          required: [rid, from, to, recording, piece]
          properties:
            audio: {type: integer, minimum: 0, description: the number of `mic` of the recording; no field — no audio (V/02.9 N1.4)}
            rid: {type: string}
            from: {type: number}
            to: {type: number}
            recording: {type: string}
            piece: {type: integer, description: "the piece size, bytes (V/02.9 N1.4)"}
        asks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [ask, action, firing, deadline]
            properties:
              ask: {type: string}
              action: {type: string}
              n: {type: integer, minimum: 1}
              port: {type: integer, minimum: 1}
              firing: {type: string, pattern: "^(?:[0-9a-f]{32})$"}
              deadline: {type: number}
        uncovered: {const: true}
    SubscribeRequest:
      type: object
      additionalProperties: true
      required: [cam]
      properties:
        audio: {type: integer, minimum: 0, description: the number of `mic`; 0 — the first of the camera; no field — without audio (V/02.9 N1.3a)}
        cam: {type: string}
        stream: {type: string}
    PushRequest:
      type: object
      additionalProperties: true
      required: [frames]
      properties:
        cam: {type: string}
        ref: {type: string}
        stream: {type: string}
        camera_now: {type: number}
        frames: {$ref: "#/components/schemas/Frames"}
    PushAnswer:
      type: object
      additionalProperties: false
      properties:
        have: {type: number}
    UploadRequest:
      unevaluatedProperties: true
      oneOf:
        - type: object
          additionalProperties: true
          required: [ref, rid, seq, more, frames]
          properties:
            ref: {type: string}
            rid: {type: string}
            seq: {type: integer}
            more: {type: boolean}
            frames: {$ref: "#/components/schemas/Frames"}
        - type: object
          additionalProperties: true
          required: [ref, rid, seq, refused]
          properties:
            ref: {type: string}
            rid: {type: string}
            seq: {type: integer}
            refused: {type: string}
    UploadAnswer:
      type: object
      additionalProperties: false
      required: [wanted]
      properties:
        wanted: {type: boolean}
        again: {const: true}
    PullRequest:
      type: object
      additionalProperties: true
      required: [ref]
      properties:
        ref: {type: string}
        audio: {type: integer, minimum: 0, description: the number of `mic` of the recording (V/02.9 N1.3a)}
        last:
          type: object
          additionalProperties: true
          required: [boot, n]
          properties:
            boot: {type: string}
            n: {type: integer}
    PullAnswer:
      type: object
      additionalProperties: false
      required: [boot, n, frames]
      properties:
        boot: {type: string}
        n: {type: integer}
        frames: {$ref: "#/components/schemas/Frames"}
    AskRequest:
      type: object
      additionalProperties: true
      required: [ref, action, firing, deadline, camera_now]
      properties:
        ref: {type: string}
        action: {type: string}
        n: {type: integer, minimum: 1}
        port: {type: integer, minimum: 1}
        firing: {type: string, pattern: "^(?:[0-9a-f]{32})$", description: the firing key (V/07.5 N1.4)}
        deadline: {type: number}
        camera_now: {type: number}
    AskAnswer:
      type: object
      additionalProperties: false
      required: [ask]
      properties:
        ask: {type: string}
        outcome: {type: string, description: "performed | refused: <why> | expired — when known"}
