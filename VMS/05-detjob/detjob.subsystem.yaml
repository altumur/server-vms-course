# Archive scans, as the platform sees them (V/05): the first unit of the VMS whose work ENDS.
#
# A unit is one model over one interval of one recording — "look for this plate in camera 7 between
# 10:00 and 11:00 yesterday" — created by the operator at the console's door, or ordered by a recorder (a scan
# of the minutes it backfilled, V/02.8) or by a scenario (V/07). Everything about it is the same as `det`
# except the two things that follow from having both ends:
#
#   * it reads the recording's footage through the archive doors of the recorders holding its volumes
#     (`/spans`, `/samples`, V/02.5) instead of subscribing to a fan-out, so it wants to be beside the
#     recorder that holds it — an affinity, since the door serves the frames to any server of the cluster;
#   * it finishes: its result is the unit's state (`unit.state.result`, P/03.6 Н1.7), and the controller
#     stops placing a unit whose result says so (`retire_when`, P/04 Н1.3).
#
# Its events go to `detjob/<job>/e<epoch>/` on the resource — its OWN tree, not `det/<unit>/`. A scan of
# last Tuesday writes events dated last Tuesday, and merging them into the live detector's buckets would
# make "what did the detector see on Tuesday" unanswerable and a second run double every count. Separate
# trees also make a re-run free to compare and a deletion a deletion of one directory.
name: detjob
# The slot a worker of this subsystem makes, `j-<n>`, and the variable naming the one it is started under
# beside `WORKER_NAME` (the boundary's step 4: it was each worker's class saying it).
slot: {prefix: j, name_env: DETJOB_NAME}
about: {sub: cam, field: cam}   # a scan reads a camera's footage: its events, grants and labels are the camera's
unit:
  rows: jobs                         # detjob/jobs/<name>
  id: name                           # the operator's name for the run; an order's — `rec-…`, `auto-…`; a re-run is a new row
  fields:
    name:    {type: string, required: true}
    cam:     {type: string, required: true, fixed: true}   # the camera the footage is of — what every event line is
                                                 # about (`of: cam/7`): `/events?unit=cam/7` finds a scan's results by the
                                                 # LINE, not the tree
    # The RECORDING whose streams hold the footage — a recording OF `cam`: a scan reads the footage of the camera it
    # names (the review's fifth pass, major: a job of camera 1 naming camera 2's recording read camera 2's archive and
    # filed what it found under camera 1). `must_match` says it, and the platform refuses the row.
    rec:     {type: string, required: true, fixed: true, ref: rec/recordings, must_match: {cam: cam}}
    kind:    {type: string, required: true}      # which model: motion | linecross | lpr | tick | … — the detectors' registry
    params:  {type: string}                      # the model's settings, opaque to the platform — and SMALL
    mask:    {type: blob}                        # sha256-<hex>; the bytes are in the object store (P/06.1 Н1.5)
    # WHOSE mask: the id of a detector of the same camera (an order names the detector it scans for, V/02.8, V/07.4). The
    # row's own non-empty `mask` wins; else the mask of that detector's row when the model starts; no such row — the job
    # fails. A reference keeps no body alive (P/06.1 sweep counts only blob fields), so the job names the ROW (V/05.3 Н1.3).
    mask_of: {type: string, ref: det/units, must_match: {cam: cam}}
    alarms:  {type: list,   default: ["linecross", "lpr"]}   # which event kinds are ALARMS — the detector's field, copied by the orders
    from:    {type: float,  required: true}      # unix seconds, inclusive — MEDIA time, not the time the job was made
    to:      {type: float,  required: true}      # unix seconds, exclusive
    labels:  {type: list,   default: ["gpu"]}    # where it may run: a worker whose server has these labels
  # What the holder keeps of the job beside the row, under its epoch (P/03.6 Н1.7): the RESULT, which outlives a move
  # and is what retires the job, and the CURSOR — the stretches of the recording already scanned — so the next holder
  # goes on from where the last one stopped (V/05.3).
  state:
    result:
      type: object
      required: [end, covered, asked, events]
      additionalProperties: false
      properties:
        end:     {enum: [done, failed]}
        covered: {type: number, minimum: 0}      # seconds of footage scanned
        asked:   {type: number, minimum: 0}      # seconds of the interval
        events:  {type: integer, minimum: 0}
        partial: {type: array, items: {type: string}}   # what was missing when the wait ran out (V/05.4)
        why:     {type: string}
    cursor:
      type: object
      required: [revision, done, events]
      additionalProperties: false
      properties:
        revision: {type: integer, minimum: 0}    # the row's revision the cursor belongs to: another one is not applied
        done:
          type: array
          items: {type: array, items: {type: number}, minItems: 2, maxItems: 2}
        events:   {type: integer, minimum: 0}
        waiting_since: {type: number}           # when something first went missing (the wait runs from here, V/05.4)
        fetch_since:   {type: number}           # when backfill was first asked for
# The words of the console and of the assistant (V/10.4 Н1.4): labels the admin's text names a field by.
display:
  unit: задача скана
  units: задачи скана
  units_count: задач скана
  fields:
    name: Имя задачи
    cam: Камера
    rec: Запись
    kind: Модель
    params: Параметры
    mask: Маска
    mask_of: Маска детектора
    alarms: Тревожные события
    from: С
    to: По
    labels: Метки серверов
  field_help:
    rec: запись, которую сканирует задача
    from: начало отрезка записи
    to: конец отрезка записи
placement:
  capacity:   {from: capacity, default: 2}      # scans a worker will carry at once — its OWN number, in its OWN
                                                 # heartbeat. This is why a scan is a subsystem and not a flag on a
                                                 # `det` row: a retro-search must not be able to spend the streams
                                                 # live detection is running on.
  headroom:   {from: headroom}
  constraint: labels-subset
  requires:   resource                           # it writes its events into the resource on its own server
  near:       {sub: rec, by: rec}                # An affinity, never a filter: be beside the recorder holding the
                                                 # recording this scan reads, so the footage crosses no network. `by: rec`
                                                 # follows the RECORDING the job names, not the job's own id. Where it
                                                 # cannot be had, the scan runs on any GPU server and reads through the
                                                 # recorders' doors from there — a cost, not a reason the job cannot run.
  # No `home`, for the same reason `det` has none: nobody owns the answer to "which server does this scan
  # belong on". The footage has a home; the work does not.
  retire_when: {state: result, field: end, in: [done, failed], delete_after: 259200}   # the job's work ENDS: a result
                                                 # in its state retires it, and three days later its row goes. In the
                                                 # STATE, because a job that was only `done` in a heartbeat would be
                                                 # un-placed, dropped, forgotten — and started again from the top.
  tie_break:  most-free-capacity
snapshot: [name, cam, kind, state.result]        # what leaves the cluster: enough for a domain to say "camera 7 is
                                                 # being scanned" and how it ended; `from`/`to`/`rec` have no reader
                                                 # above the cluster.
events:
  older_epochs: earlier-run          # the same mechanism as everywhere, the opposite meaning: an older epoch of a job
                                     # is a run that moved or was taken over — a result to compare against, not a writer
                                     # that lost a race. `fenced` would tell the operator their search was never valid.
metrics:
  - {name: jobs_running, from: status.phase, agg: count, equals: running, live: true}   # the running gauge (`console.running`)
  - {name: filings_total, from: "heartbeat.filings.<outcome>", agg: sum, type: counter}   # requests for backfill it filed
console:
  running: jobs_running              # detjob_jobs_running: scans whose worker is decoding right now
# What a job worker reads besides its rows: the recorders' heartbeats (their archive doors) and volumes, the recordings
# (what is visible), the holders' heartbeats (the device's archive index), the detectors' mask bodies; and the
# requests for backfill it files to the recorders (V/05.4).
worker: {exec: /usr/lib/detjob/worker, reads: [rec/heartbeats/, rec/volumes/, rec/recordings/, cam/heartbeats/, det/blobs/], requests: [rec]}
