openapi: 3.1.0
info:
  title: V/10 — the door of the assistant model holder
  version: 1.0.0
  description: |
    The HTTP contract of the door of the model holder `assistworker` — lesson V/10 «Ассистент» of the VMS module. The canon is the norms
    of the chapters `10.K-assist.norms.md`; the file expresses them and adds no requirements. The route `chat` (chapter V/10.2): queue a step
    of the model, ask for its state or answer, cancel it; admittance — the console door token (`GET /assist/where/<name>`, the right
    `view` on the model row, the door token contract; `Authorization: Bearer`). A step belongs to the `user` of the token: to anyone else —
    404. Another method — 405, another path — 404.
servers:
  - url: https://{server}:{port}
    description: with the kit of the role assistworker — the server name SERVER_NAME (P/03.4 Н1.7 door_address kit)
    variables:
      server: {default: srv-a}
      port: {default: "0"}
  - url: http://127.0.0.1:{port}
    description: without a certificate kit — loopback only (P/03.4 Н1.7)
    variables:
      port: {default: "0"}
paths:
  /chat/{name}/steps:
    post:
      summary: Queue a step of the model (Н1.2)
      security: [{doorToken: []}]
      parameters:
        - $ref: "#/components/parameters/ModelName"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StepRequest"}
      responses:
        "202":
          description: the step is in the queue
          headers:
            Location:
              required: true
              description: "/chat/<name>/steps/<step>; the segment step is percent-encoded"
              schema: {type: string}
            Connection: {$ref: "#/components/headers/Close"}
          content:
            application/json:
              schema:
                type: object
                required: [step, state]
                additionalProperties: false
                properties:
                  step: {$ref: "#/components/schemas/StepId"}
                  state: {const: queued}
        "400": {$ref: "#/components/responses/Refusal"}
        "403": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "413": {$ref: "#/components/responses/Refusal"}
        "429": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
  /chat/{name}/steps/{step}:
    get:
      summary: The state or the answer of one's own step, long polling up to 20 s (Н1.3)
      security: [{doorToken: []}]
      parameters:
        - $ref: "#/components/parameters/ModelName"
        - $ref: "#/components/parameters/Step"
        - name: wait
          in: query
          required: false
          description: seconds of waiting for the step to finish; default 0
          schema: {type: integer, minimum: 0, maximum: 20}
      responses:
        "200":
          description: the step state
          headers:
            Connection: {$ref: "#/components/headers/Close"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StepState"}
        "400": {$ref: "#/components/responses/Refusal"}
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "410": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
    delete:
      summary: Cancel one's own step (Н1.5)
      security: [{doorToken: []}]
      parameters:
        - $ref: "#/components/parameters/ModelName"
        - $ref: "#/components/parameters/Step"
      responses:
        "200":
          description: the step is removed or the request to the model is cut off (or already finished); the step is forgotten
          headers:
            Connection: {$ref: "#/components/headers/Close"}
          content:
            application/json:
              schema:
                type: object
                required: [step, state]
                additionalProperties: false
                properties:
                  step: {$ref: "#/components/schemas/StepId"}
                  state: {enum: [done, failed, cancelled]}
        "403": {$ref: "#/components/responses/Refusal"}
        "404": {$ref: "#/components/responses/Refusal"}
        "405": {$ref: "#/components/responses/Refusal"}
        "410": {$ref: "#/components/responses/Refusal"}
        "503": {$ref: "#/components/responses/Refusal"}
components:
  headers:
    Close:
      required: true
      description: every answer of the route chat closes the connection (V/10.2 Н1.6)
      schema: {const: close}
  parameters:
    ModelName:
      name: name
      in: path
      required: true
      description: the name of the model row `assist/models/<name>` (V/10.1 Н1.1)
      schema: {type: string, minLength: 1}
    Step:
      name: step
      in: path
      required: true
      description: the step id from the answer 202
      schema: {$ref: "#/components/schemas/StepId"}
  schemas:
    StepId:
      type: string
      description: "<instance of the holder>.<128 random bits, 32 lowercase hex>; the instance may contain a dot — parsing is by the last one; in the path the segment is percent-encoded (V/10.2 Н1.6)"
      pattern: "^(?:[\\s\\S]+\\.[0-9a-f]{32})$"
      examples: ["srv.a:1:abcdef.00000000000000000000000000000000"]
    ToolCall:
      type: object
      required: [id, type, function]
      additionalProperties: true
      properties:
        id: {type: string}
        type: {const: function}
        function:
          type: object
          required: [name, arguments]
          additionalProperties: true
          properties:
            name: {type: string}
            arguments: {type: string}
    RequestMessage:
      description: a message of the step history (V/10.2 Н1.2); a model message from an answer is returned as is
      type: object
      unevaluatedProperties: false
      oneOf:
        - type: object
          required: [role]
          additionalProperties: false
          properties:
            role: {enum: [system, user, tool]}
            content: {type: string}
            tool_call_id: {type: string}
        - type: object
          required: [role]
          additionalProperties: false
          properties:
            role: {const: assistant}
            content: {type: [string, "null"]}
            tool_calls:
              type: array
              items: {$ref: "#/components/schemas/ToolCall"}
            reasoning_content: {type: string}
    ModelMessage:
      type: object
      description: a model message (V/10.2 Н1.3); the holder serves no other fields
      required: [role, content]
      additionalProperties: false
      properties:
        role: {const: assistant}
        content: {type: [string, "null"]}
        tool_calls:
          type: array
          items: {$ref: "#/components/schemas/ToolCall"}
        reasoning_content: {type: string}
    StepRequest:
      type: object
      required: [messages]
      additionalProperties: false
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 512
          items: {$ref: "#/components/schemas/RequestMessage"}
        tools:
          type: array
          maxItems: 64
          items:
            type: object
            required: [type, function]
            additionalProperties: true
            properties:
              type: {const: function}
              function:
                type: object
                required: [name, parameters]
                additionalProperties: true
                properties:
                  name: {type: string, minLength: 1}
                  description: {type: string}
                  parameters: {type: object, additionalProperties: true}
        tool_choice: {enum: [auto, required, none]}
        reasoning_effort: {enum: [low, medium, high]}
        max_tokens:
          type: integer
          minimum: 1
          description: "the upper bound is context of the model row (V/10.2 Н1.2): more — 400 bad step"
        turn: {type: string, pattern: "^(?:[0-9a-f]{32})$", description: "the client's turn (V/10.2 Н1.2, Н1.4)"}
    StepState:
      description: the step state by branches (V/10.2 Н1.3)
      type: object
      unevaluatedProperties: false
      oneOf:
        - type: object
          required: [step, state, ahead]
          additionalProperties: false
          properties:
            step: {$ref: "#/components/schemas/StepId"}
            state: {const: queued}
            ahead: {type: integer, minimum: 0}
        - type: object
          required: [step, state]
          additionalProperties: false
          properties:
            step: {$ref: "#/components/schemas/StepId"}
            state: {const: running}
        - type: object
          required: [step, state, message, finish_reason, usage, seconds]
          additionalProperties: false
          properties:
            step: {$ref: "#/components/schemas/StepId"}
            state: {const: done}
            message: {$ref: "#/components/schemas/ModelMessage"}
            finish_reason: {enum: [stop, tool_calls, length]}
            usage:
              type: object
              required: [prompt_tokens, completion_tokens]
              additionalProperties: false
              properties:
                prompt_tokens: {type: integer, minimum: 0}
                completion_tokens: {type: integer, minimum: 0}
            seconds: {type: number, minimum: 0}
        - type: object
          required: [step, state, reason, seconds]
          additionalProperties: false
          properties:
            step: {$ref: "#/components/schemas/StepId"}
            state: {const: failed}
            reason: {enum: [model failed, too long, queue too long, context exceeded, model restarted]}
            seconds: {type: number, minimum: 0}
        - type: object
          required: [step, state, reason]
          additionalProperties: false
          properties:
            step: {$ref: "#/components/schemas/StepId"}
            state: {const: cancelled}
            reason: {enum: [disabled, abandoned]}
  securitySchemes:
    doorToken:
      type: http
      scheme: bearer
      description: the console door token (the door token contract)
  responses:
    Refusal:
      description: a refusal (V/10.2 Н4); the retry timeout is in the body `retry_after` (Retry-After is not visible to a client in a browser through CORS), except busy of the process door — there is no timeout in the body there
      headers:
        Connection:
          required: false
          description: for refusals of the route chat — always; 413 and busy of the process door (door_limits) — by the platform (V/10.2 Н1.6)
          schema: {const: close}
        Retry-After:
          required: false
          schema: {type: integer}
      content:
        application/json:
          schema:
            type: object
            required: [error]
            additionalProperties: false
            properties:
              error: {type: string}
              detail: {type: string}
              retry_after: {type: integer, minimum: 1}
